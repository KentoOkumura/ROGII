<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 25px; fill: #374151; }
      .label { font-size: 25px; font-weight: 700; }
      .small { font-size: 21px; fill: #374151; }
      .tiny { font-size: 18px; fill: #4b5563; }
      .axis { stroke: #111827; stroke-width: 4; marker-end: url(#arrow); }
      .thin { stroke: #374151; stroke-width: 2; }
      .dash { stroke-dasharray: 10 10; }
    </style>
  </defs>

  <text x="800" y="58" text-anchor="middle" class="title">Why Z and TVT are different</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">Same real depth Z can correspond to different geological positions when layers dip</text>

  <!-- Main cross section frame -->
  <rect x="115" y="145" width="1020" height="610" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
  <text x="625" y="790" text-anchor="middle" class="small">X / Y location changes horizontally</text>

  <!-- Axes -->
  <line x1="160" y1="705" x2="1080" y2="705" class="axis"/>
  <line x1="160" y1="185" x2="160" y2="710" class="axis"/>
  <text x="1088" y="713" class="label">X/Y</text>
  <text x="128" y="190" text-anchor="middle" class="label">Z</text>
  <text x="94" y="226" class="small">depth</text>
  <text x="84" y="252" class="small">down</text>

  <!-- Tilted geology layers -->
  <polygon points="115,205 1135,310 1135,390 115,285" fill="#fde68a" opacity="0.78"/>
  <polygon points="115,285 1135,390 1135,475 115,370" fill="#bbf7d0" opacity="0.78"/>
  <polygon points="115,370 1135,475 1135,565 115,460" fill="#bfdbfe" opacity="0.78"/>
  <polygon points="115,460 1135,565 1135,650 115,545" fill="#fecaca" opacity="0.78"/>
  <polygon points="115,545 1135,650 1135,755 115,650" fill="#ddd6fe" opacity="0.78"/>

  <line x1="115" y1="205" x2="1135" y2="310" stroke="#92400e" stroke-width="4"/>
  <line x1="115" y1="285" x2="1135" y2="390" stroke="#166534" stroke-width="4"/>
  <line x1="115" y1="370" x2="1135" y2="475" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="115" y1="460" x2="1135" y2="565" stroke="#b91c1c" stroke-width="4"/>
  <line x1="115" y1="545" x2="1135" y2="650" stroke="#6d28d9" stroke-width="4"/>

  <text x="925" y="245" class="small" transform="rotate(6 925 245)">Dipping geological layers</text>
  <text x="900" y="276" class="tiny">formation boundaries are not horizontal</text>

  <!-- Same Z line -->
  <line x1="160" y1="455" x2="1088" y2="455" stroke="#dc2626" stroke-width="4" class="dash"/>
  <text x="210" y="433" class="label" fill="#dc2626">Same Z depth</text>
  <text x="210" y="478" class="small" fill="#dc2626">horizontal line in real space</text>

  <!-- Two well points -->
  <line x1="410" y1="190" x2="410" y2="455" stroke="#111827" stroke-width="2" class="dash"/>
  <line x1="865" y1="190" x2="865" y2="455" stroke="#111827" stroke-width="2" class="dash"/>
  <circle cx="410" cy="455" r="15" fill="#2563eb" stroke="#111827" stroke-width="3"/>
  <circle cx="865" cy="455" r="15" fill="#f97316" stroke="#111827" stroke-width="3"/>

  <text x="410" y="513" text-anchor="middle" class="label">Point A</text>
  <text x="410" y="543" text-anchor="middle" class="small">same Z</text>
  <text x="865" y="513" text-anchor="middle" class="label">Point B</text>
  <text x="865" y="543" text-anchor="middle" class="small">same Z</text>

  <!-- TVT interpretation arrows -->
  <path d="M410,455 C380,492 365,530 348,570" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M865,455 C835,425 820,388 802,360" fill="none" stroke="#f97316" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="250" y="575" width="360" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="430" y="610" text-anchor="middle" class="label" fill="#1d4ed8">At Point A</text>
  <text x="430" y="642" text-anchor="middle" class="small">same Z, but deeper TVT</text>

  <rect x="710" y="585" width="370" height="90" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="895" y="620" text-anchor="middle" class="label" fill="#c2410c">At Point B</text>
  <text x="895" y="652" text-anchor="middle" class="small">same Z, but shallower TVT</text>

  <!-- Typewell reference -->
  <rect x="1215" y="145" width="250" height="610" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="1340" y="184" text-anchor="middle" class="label">Typewell</text>
  <text x="1340" y="214" text-anchor="middle" class="small">TVT ruler</text>

  <line x1="1270" y1="245" x2="1270" y2="690" stroke="#111827" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1240" y="252" text-anchor="end" class="small">TVT 0</text>
  <text x="1240" y="355" text-anchor="end" class="small">TVT 500</text>
  <text x="1240" y="465" text-anchor="end" class="small">TVT 1000</text>
  <text x="1240" y="575" text-anchor="end" class="small">TVT 1500</text>
  <text x="1240" y="690" text-anchor="end" class="small">TVT 2000</text>

  <line x1="1270" y1="355" x2="1425" y2="355" stroke="#92400e" stroke-width="3"/>
  <line x1="1270" y1="465" x2="1425" y2="465" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="1270" y1="575" x2="1425" y2="575" stroke="#b91c1c" stroke-width="3"/>

  <circle cx="1270" cy="595" r="11" fill="#2563eb" stroke="#111827" stroke-width="2"/>
  <circle cx="1270" cy="375" r="11" fill="#f97316" stroke="#111827" stroke-width="2"/>
  <text x="1300" y="602" class="small">A maps here</text>
  <text x="1300" y="382" class="small">B maps here</text>

  <path d="M425,575 C725,770 1080,690 1258,600" fill="none" stroke="#2563eb" stroke-width="3" class="dash" marker-end="url(#arrow-blue)"/>
  <path d="M900,585 C1050,430 1160,390 1258,382" fill="none" stroke="#f97316" stroke-width="3" class="dash" marker-end="url(#arrow)"/>

  <!-- Bottom explanation -->
  <rect x="115" y="812" width="1350" height="58" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="790" y="849" text-anchor="middle" class="small">
    Z is real 3D depth. TVT is position on the geological/typewell ruler. With dipping layers, equal Z does not imply equal TVT.
  </text>
</svg>

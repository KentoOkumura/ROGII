<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <rect width="1800" height="1050" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK JP", "Yu Gothic", sans-serif; fill: #111827; }
      .title { font-size: 44px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #374151; }
      .h2 { font-size: 30px; font-weight: 700; }
      .h3 { font-size: 24px; font-weight: 700; }
      .body { font-size: 20px; fill: #374151; }
      .small { font-size: 17px; fill: #4b5563; }
      .axis { stroke: #111827; stroke-width: 3; marker-end: url(#arrow); }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .dash { stroke-dasharray: 8 8; }
      .panel { fill: #f8fafc; stroke: #111827; stroke-width: 2; rx: 14; }
      .bluebox { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .greenbox { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .orangebox { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 10; }
    </style>
  </defs>

  <text x="900" y="58" text-anchor="middle" class="title">Particle Filter: TVT を「粒子の雲」で追跡する</text>
  <text x="900" y="96" text-anchor="middle" class="subtitle">
    各粒子は「この MD では TVT はこの辺りかもしれない」という仮説。GR が合う粒子ほど重く残る。
  </text>

  <!-- Left narrative -->
  <rect x="55" y="135" width="390" height="850" class="panel"/>
  <text x="250" y="178" text-anchor="middle" class="h2">PF の考え方</text>

  <rect x="85" y="215" width="330" height="105" class="bluebox"/>
  <text x="250" y="249" text-anchor="middle" class="h3">1. initialize</text>
  <text x="250" y="279" text-anchor="middle" class="body">last_known_tvt の近くに</text>
  <text x="250" y="306" text-anchor="middle" class="body">粒子をばらまく</text>

  <rect x="85" y="355" width="330" height="105" class="bluebox"/>
  <text x="250" y="389" text-anchor="middle" class="h3">2. predict</text>
  <text x="250" y="419" text-anchor="middle" class="body">次の MD で TVT が</text>
  <text x="250" y="446" text-anchor="middle" class="body">少し上下すると仮定</text>

  <rect x="85" y="495" width="330" height="125" class="orangebox"/>
  <text x="250" y="529" text-anchor="middle" class="h3">3. weight by GR</text>
  <text x="250" y="559" text-anchor="middle" class="body">粒子の TVT で typewell GR を読む</text>
  <text x="250" y="586" text-anchor="middle" class="body">horizontal GR と近ければ</text>
  <text x="250" y="613" text-anchor="middle" class="body">weight を大きくする</text>

  <rect x="85" y="655" width="330" height="105" class="greenbox"/>
  <text x="250" y="689" text-anchor="middle" class="h3">4. resample</text>
  <text x="250" y="719" text-anchor="middle" class="body">重い粒子を増やし</text>
  <text x="250" y="746" text-anchor="middle" class="body">軽い粒子を捨てる</text>

  <rect x="85" y="795" width="330" height="120" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="10"/>
  <text x="250" y="829" text-anchor="middle" class="h3" fill="#b91c1c">出力</text>
  <text x="250" y="859" text-anchor="middle" class="body">weighted mean / median TVT</text>
  <text x="250" y="886" text-anchor="middle" class="body">std, range, likelihood</text>

  <!-- Main chart -->
  <rect x="485" y="135" width="890" height="850" class="panel"/>
  <text x="930" y="178" text-anchor="middle" class="h2">粒子が GR によって絞られる様子</text>

  <line x1="575" y1="890" x2="1285" y2="890" class="axis"/>
  <line x1="575" y1="835" x2="575" y2="245" class="axis"/>
  <text x="1305" y="898" class="body">MD</text>
  <text x="544" y="246" text-anchor="end" class="body">TVT</text>
  <text x="540" y="272" text-anchor="end" class="small">increases downward</text>

  <g>
    <line x1="710" y1="245" x2="710" y2="890" class="grid"/>
    <line x1="845" y1="245" x2="845" y2="890" class="grid"/>
    <line x1="980" y1="245" x2="980" y2="890" class="grid"/>
    <line x1="1115" y1="245" x2="1115" y2="890" class="grid"/>
    <line x1="1250" y1="245" x2="1250" y2="890" class="grid"/>
  </g>

  <path d="M575,575 C625,565 675,555 710,540" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <circle cx="710" cy="540" r="12" fill="#2563eb" stroke="#111827" stroke-width="2"/>
  <text x="690" y="510" text-anchor="middle" class="small">anchor</text>
  <line x1="710" y1="245" x2="710" y2="890" stroke="#111827" stroke-width="2" class="dash"/>
  <text x="710" y="916" text-anchor="middle" class="small">prediction start</text>

  <!-- particle clouds by step; radius encodes weight -->
  <g>
    <circle cx="780" cy="470" r="5" fill="#bfdbfe"/>
    <circle cx="780" cy="510" r="9" fill="#60a5fa"/>
    <circle cx="780" cy="548" r="15" fill="#2563eb"/>
    <circle cx="780" cy="590" r="7" fill="#93c5fd"/>
    <circle cx="780" cy="642" r="4" fill="#dbeafe"/>

    <circle cx="910" cy="448" r="4" fill="#dbeafe"/>
    <circle cx="910" cy="505" r="8" fill="#60a5fa"/>
    <circle cx="910" cy="560" r="17" fill="#2563eb"/>
    <circle cx="910" cy="620" r="8" fill="#60a5fa"/>
    <circle cx="910" cy="690" r="4" fill="#dbeafe"/>

    <circle cx="1040" cy="430" r="3" fill="#dbeafe"/>
    <circle cx="1040" cy="520" r="7" fill="#93c5fd"/>
    <circle cx="1040" cy="585" r="18" fill="#2563eb"/>
    <circle cx="1040" cy="665" r="8" fill="#60a5fa"/>
    <circle cx="1040" cy="750" r="3" fill="#dbeafe"/>

    <circle cx="1170" cy="470" r="3" fill="#dbeafe"/>
    <circle cx="1170" cy="555" r="9" fill="#60a5fa"/>
    <circle cx="1170" cy="625" r="19" fill="#2563eb"/>
    <circle cx="1170" cy="705" r="7" fill="#93c5fd"/>
  </g>

  <path d="M710,540 C780,548 850,553 910,560 C970,568 1010,578 1040,585 C1095,600 1135,614 1170,625"
        fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
  <text x="1010" y="535" class="body" fill="#15803d">weighted mean path</text>

  <rect x="735" y="755" width="525" height="92" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="10"/>
  <text x="998" y="788" text-anchor="middle" class="body">円が大きい = GR と合って weight が高い粒子</text>
  <text x="998" y="818" text-anchor="middle" class="body">雲が広い = TVT 候補の不確実性が大きい</text>

  <!-- Right typewell / observation -->
  <rect x="1415" y="135" width="330" height="850" class="panel"/>
  <text x="1580" y="178" text-anchor="middle" class="h2">GR likelihood</text>

  <line x1="1490" y1="245" x2="1490" y2="850" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1490" y="225" text-anchor="middle" class="body">TVT</text>
  <path d="M1600,250 C1545,275 1660,300 1590,330 C1545,350 1650,380 1600,410 C1540,440 1660,470 1588,505 C1540,535 1660,565 1605,600 C1545,635 1665,660 1590,700 C1545,735 1650,765 1600,805"
        fill="none" stroke="#111827" stroke-width="3"/>
  <text x="1600" y="225" text-anchor="middle" class="body">typewell GR</text>

  <line x1="1455" y1="585" x2="1690" y2="585" stroke="#f97316" stroke-width="3" class="dash"/>
  <text x="1575" y="565" text-anchor="middle" class="small">candidate TVT</text>
  <text x="1580" y="625" text-anchor="middle" class="body">compare:</text>
  <text x="1580" y="654" text-anchor="middle" class="body">GR_horizontal(MD)</text>
  <text x="1580" y="681" text-anchor="middle" class="body">vs</text>
  <text x="1580" y="708" text-anchor="middle" class="body">GR_typewell(TVT)</text>

  <rect x="1442" y="765" width="276" height="120" class="orangebox"/>
  <text x="1580" y="800" text-anchor="middle" class="h3">PF が作る特徴</text>
  <text x="1580" y="830" text-anchor="middle" class="body">path mean, std, range</text>
  <text x="1580" y="858" text-anchor="middle" class="body">likelihood, entropy</text>

  <line x1="1375" y1="520" x2="1415" y2="520" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

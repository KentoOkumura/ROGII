<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">exp226 K16の空間地質面と坑井幾何</title>
  <desc id="desc">対象坑井の未知区間を16 segmentに分け、各segmentの位置と方位に近い学習坑井segmentから地層ドリフトを補間し、坑井の上下動と合わせてTVTを予測する模式図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#dcfce7" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sectionLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, "Noto Sans JP", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px system-ui, -apple-system, "Noto Sans JP", sans-serif; fill: #475569; }
      .panel-title { font: 700 19px system-ui, -apple-system, "Noto Sans JP", sans-serif; fill: #172554; }
      .label { font: 600 14px system-ui, -apple-system, "Noto Sans JP", sans-serif; fill: #1e293b; }
      .small { font: 400 12.5px system-ui, -apple-system, "Noto Sans JP", sans-serif; fill: #475569; }
      .tiny { font: 600 10px system-ui, -apple-system, "Noto Sans JP", sans-serif; fill: #334155; }
      .formula { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #172554; }
      .panel { fill: white; stroke: #cbd5e1; stroke-width: 1.2; }
      .contour { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-opacity: 0.42; }
      .donor { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; opacity: 0.78; }
      .donor2 { fill: none; stroke: #0891b2; stroke-width: 4; stroke-linecap: round; opacity: 0.72; }
      .neighbor { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
      .target-known { fill: none; stroke: #64748b; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 9 7; }
      .target-segment-a { stroke: #f97316; stroke-width: 7; stroke-linecap: round; }
      .target-segment-b { stroke: #ea580c; stroke-width: 7; stroke-linecap: round; }
      .segment-node { fill: white; stroke: #c2410c; stroke-width: 2; }
      .near-line { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.7; }
      .stratum { fill: none; stroke-width: 3; opacity: 0.8; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <text id="svg-title" class="title" x="38" y="43">exp226 K16：近くの坑井が示す地層の傾きを、対象坑井の16区間へ写す</text>
  <text class="subtitle" x="39" y="70">K16の中心はGR照合ではなく、坑井軌跡と近傍坑井から作る空間地質ドリフト場。GRはその後の小さな位置補正。</text>

  <!-- Plan view -->
  <g transform="translate(30 96)">
    <rect class="panel" x="0" y="0" width="820" height="550" rx="18" filter="url(#shadow)"/>
    <text class="panel-title" x="24" y="34">A. 上面図（X–Y）：segmentごとに近傍donorを参照</text>
    <rect x="22" y="52" width="776" height="468" rx="12" fill="url(#surface)" stroke="#e2e8f0"/>

    <!-- Geological contours -->
    <path class="contour" d="M25 450 C170 390 250 470 390 410 S640 335 795 370"/>
    <path class="contour" d="M24 385 C155 330 270 405 403 345 S645 280 796 305"/>
    <path class="contour" d="M23 315 C180 270 270 320 420 278 S650 205 797 235"/>
    <path class="contour" d="M23 240 C170 205 290 245 430 205 S650 130 797 165"/>
    <path class="contour" d="M23 162 C180 125 300 180 455 130 S660 68 797 98"/>
    <text class="small" x="38" y="493">背景の等値線・色：学習坑井から見える地層座標 U の空間的な高低（模式）</text>

    <!-- Donor well trajectories -->
    <path class="donor" d="M67 128 C160 92 250 112 347 82 S545 73 728 115"/>
    <path class="donor2" d="M74 431 C160 386 258 412 360 373 S585 316 753 342"/>
    <path class="donor" d="M168 497 C220 428 278 365 345 300 S520 187 682 160"/>
    <path class="donor2" d="M386 486 C442 423 512 389 569 333 S675 228 760 205"/>
    <text class="label" x="48" y="88" fill="#1d4ed8">青・水色 = 学習済みdonor well</text>

    <!-- donor segment samples -->
    <g>
      <circle class="neighbor" cx="171" cy="103" r="6"/><circle class="neighbor" cx="300" cy="95" r="6"/>
      <circle class="neighbor" cx="474" cy="73" r="6"/><circle class="neighbor" cx="625" cy="87" r="6"/>
      <circle class="neighbor" cx="169" cy="399" r="6"/><circle class="neighbor" cx="326" cy="386" r="6"/>
      <circle class="neighbor" cx="480" cy="341" r="6"/><circle class="neighbor" cx="637" cy="326" r="6"/>
      <circle class="neighbor" cx="270" cy="372" r="6"/><circle class="neighbor" cx="373" cy="277" r="6"/>
      <circle class="neighbor" cx="500" cy="209" r="6"/><circle class="neighbor" cx="602" cy="178" r="6"/>
      <circle class="neighbor" cx="455" cy="411" r="6"/><circle class="neighbor" cx="555" cy="347" r="6"/>
      <circle class="neighbor" cx="676" cy="250" r="6"/><circle class="neighbor" cx="730" cy="220" r="6"/>
    </g>

    <!-- Target known prefix -->
    <path class="target-known" d="M48 468 C76 422 109 368 151 326 L185 297"/>
    <circle cx="185" cy="297" r="10" fill="#fff" stroke="#334155" stroke-width="3"/>
    <text class="label" x="42" y="445">既知prefix</text>
    <text class="small" x="193" y="318">last-known TVT anchor</text>

    <!-- 16 target segments -->
    <g fill="none">
      <line class="target-segment-a" x1="185" y1="297" x2="218" y2="279"/>
      <line class="target-segment-b" x1="218" y1="279" x2="252" y2="263"/>
      <line class="target-segment-a" x1="252" y1="263" x2="287" y2="253"/>
      <line class="target-segment-b" x1="287" y1="253" x2="322" y2="243"/>
      <line class="target-segment-a" x1="322" y1="243" x2="358" y2="234"/>
      <line class="target-segment-b" x1="358" y1="234" x2="394" y2="225"/>
      <line class="target-segment-a" x1="394" y1="225" x2="430" y2="216"/>
      <line class="target-segment-b" x1="430" y1="216" x2="466" y2="207"/>
      <line class="target-segment-a" x1="466" y1="207" x2="502" y2="196"/>
      <line class="target-segment-b" x1="502" y1="196" x2="538" y2="184"/>
      <line class="target-segment-a" x1="538" y1="184" x2="574" y2="169"/>
      <line class="target-segment-b" x1="574" y1="169" x2="610" y2="153"/>
      <line class="target-segment-a" x1="610" y1="153" x2="646" y2="136"/>
      <line class="target-segment-b" x1="646" y1="136" x2="682" y2="118"/>
      <line class="target-segment-a" x1="682" y1="118" x2="718" y2="96"/>
      <line class="target-segment-b" x1="718" y1="96" x2="754" y2="70"/>
    </g>
    <g>
      <circle class="segment-node" cx="185" cy="297" r="4"/><circle class="segment-node" cx="218" cy="279" r="4"/>
      <circle class="segment-node" cx="252" cy="263" r="4"/><circle class="segment-node" cx="287" cy="253" r="4"/>
      <circle class="segment-node" cx="322" cy="243" r="4"/><circle class="segment-node" cx="358" cy="234" r="4"/>
      <circle class="segment-node" cx="394" cy="225" r="4"/><circle class="segment-node" cx="430" cy="216" r="4"/>
      <circle class="segment-node" cx="466" cy="207" r="4"/><circle class="segment-node" cx="502" cy="196" r="4"/>
      <circle class="segment-node" cx="538" cy="184" r="4"/><circle class="segment-node" cx="574" cy="169" r="4"/>
      <circle class="segment-node" cx="610" cy="153" r="4"/><circle class="segment-node" cx="646" cy="136" r="4"/>
      <circle class="segment-node" cx="682" cy="118" r="4"/><circle class="segment-node" cx="718" cy="96" r="4"/>
      <circle class="segment-node" cx="754" cy="70" r="4"/>
      <text class="tiny" x="197" y="292">1</text><text class="tiny" x="298" y="244">4</text>
      <text class="tiny" x="440" y="207">8</text><text class="tiny" x="582" y="159">12</text>
      <text class="tiny" x="738" y="88">16</text>
    </g>
    <text class="label" x="565" y="57" fill="#c2410c">オレンジ = 予測対象wellの未知suffix</text>
    <text class="small" x="560" y="78">行数を16等分し、各区間の中点と方位を使う</text>

    <!-- Local neighborhood for target segment 9 -->
    <circle cx="484" cy="201" r="92" fill="#eff6ff" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
    <line class="near-line" x1="484" y1="201" x2="500" y2="209"/>
    <line class="near-line" x1="484" y1="201" x2="474" y2="73"/>
    <line class="near-line" x1="484" y1="201" x2="373" y2="277"/>
    <line class="near-line" x1="484" y1="201" x2="555" y2="347"/>
    <circle cx="484" cy="201" r="8" fill="#f97316" stroke="white" stroke-width="2"/>
    <path d="M414 292 C403 270 413 244 440 224" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <rect x="257" y="287" width="196" height="53" rx="9" fill="white" stroke="#93c5fd"/>
    <text class="label" x="270" y="308">例：segment 9</text>
    <text class="small" x="270" y="328">近いdonor係数を距離・方位で補間</text>
  </g>

  <!-- Cross section -->
  <g transform="translate(875 96)">
    <rect class="panel" x="0" y="0" width="495" height="550" rx="18" filter="url(#shadow)"/>
    <text class="panel-title" x="24" y="34">B. 断面図：TVT変化の中身</text>
    <rect x="22" y="52" width="451" height="468" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

    <!-- geological layers -->
    <path d="M34 111 C128 78 197 126 286 95 S405 68 463 90 L463 150 C396 129 342 158 270 167 S118 137 34 178 Z" fill="#fef3c7" opacity="0.65"/>
    <path d="M34 178 C118 137 198 190 270 167 S396 129 463 150 L463 220 C390 198 321 238 250 236 S115 205 34 246 Z" fill="#dbeafe" opacity="0.66"/>
    <path d="M34 246 C115 205 183 260 250 236 S390 198 463 220 L463 293 C380 270 328 305 245 303 S111 280 34 316 Z" fill="#dcfce7" opacity="0.65"/>
    <path d="M34 111 C128 78 197 126 286 95 S405 68 463 90" class="stratum" stroke="#ca8a04"/>
    <path d="M34 178 C118 137 198 190 270 167 S396 129 463 150" class="stratum" stroke="#2563eb"/>
    <path d="M34 246 C115 205 183 260 250 236 S390 198 463 220" class="stratum" stroke="#16a34a"/>
    <path d="M34 316 C111 280 179 330 245 303 S380 270 463 293" class="stratum" stroke="#7c3aed"/>
    <text class="small" x="36" y="76">曲線 = 空間的に傾き・うねりを持つ地層面</text>

    <!-- target well side view -->
    <path d="M47 88 C75 112 95 151 118 191 C136 221 151 237 172 247" fill="none" stroke="#64748b" stroke-width="5" stroke-dasharray="8 6"/>
    <path d="M172 247 C220 263 265 269 311 259 S399 246 454 271" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
    <circle cx="172" cy="247" r="9" fill="white" stroke="#334155" stroke-width="3"/>
    <text class="label" x="41" y="104">坑井軌跡 Z</text>
    <text class="small" x="183" y="237">anchor</text>

    <!-- TVT bracket -->
    <line x1="325" y1="181" x2="325" y2="257" stroke="#475569" stroke-width="2" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
    <line x1="310" y1="181" x2="340" y2="181" stroke="#475569"/>
    <line x1="310" y1="257" x2="340" y2="257" stroke="#475569"/>
    <rect x="337" y="200" width="106" height="39" rx="7" fill="white" stroke="#cbd5e1"/>
    <text class="label" x="348" y="217">予測するTVT</text>
    <text class="small" x="348" y="233">鉛直方向の厚さ</text>

    <!-- segment drift arrows -->
    <line x1="214" y1="259" x2="214" y2="231" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="264" y1="267" x2="264" y2="225" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="390" y1="249" x2="390" y2="214" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text class="small" x="183" y="295">青矢印：近傍donorから得る区間別ドリフト cⱼ</text>

    <!-- decomposition inset -->
    <rect x="40" y="338" width="415" height="159" rx="11" fill="white" stroke="#cbd5e1"/>
    <text class="label" x="56" y="362">未知suffixに沿う累積TVT変化（模式）</text>
    <line x1="63" y1="466" x2="435" y2="466" stroke="#94a3b8"/>
    <line x1="63" y1="383" x2="63" y2="466" stroke="#94a3b8"/>
    <path d="M65 454 L90 449 L115 444 L140 440 L165 435 L190 429 L215 423 L240 417 L265 412 L290 406 L315 401 L340 396 L365 390 L390 386 L415 381 L433 377" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M65 454 L90 451 L115 446 L140 437 L165 429 L190 423 L215 416 L240 411 L265 403 L290 395 L315 387 L340 382 L365 374 L390 368 L415 359 L433 351" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M65 454 C100 449 120 441 145 434 S200 421 230 412 S285 394 315 386 S370 370 433 347" fill="none" stroke="#ea580c" stroke-width="3"/>
    <text class="tiny" x="68" y="486">segment 1</text><text class="tiny" x="379" y="486">segment 16</text>
    <line x1="76" y1="379" x2="102" y2="379" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 4"/><text class="tiny" x="108" y="383">−ΔZだけ</text>
    <line x1="178" y1="379" x2="204" y2="379" stroke="#2563eb" stroke-width="4"/><text class="tiny" x="210" y="383">+ cⱼ（geop）</text>
    <line x1="318" y1="379" x2="344" y2="379" stroke="#ea580c" stroke-width="3"/><text class="tiny" x="350" y="383">最終候補</text>
  </g>

  <!-- Bottom explanation -->
  <g transform="translate(30 673)">
    <rect x="0" y="0" width="1340" height="116" rx="16" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text class="formula" x="25" y="34">各segmentのTVT変化 ≈ 坑井の上下動 (−ΔZ) + 近傍坑井から補間した地層ドリフト (cⱼ)</text>
    <text class="label" x="25" y="65">● K16の本体</text>
    <text class="small" x="136" y="65">16区間の中点・方位を使い、X–Y上の近傍donor（最大50点）からraw/smoothed地層場を補間する。</text>
    <text class="label" x="25" y="91">● 後段の調整</text>
    <text class="small" x="136" y="91">500行GR windowでTVTを最大±4 ft補正し、最後に U=TVT+Z の曲線だけを滑らかにする。GR波形そのものの単純移動平均ではない。</text>
  </g>
</svg>

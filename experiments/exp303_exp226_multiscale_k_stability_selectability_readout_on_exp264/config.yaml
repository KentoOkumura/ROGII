  fold_source: corrected_exp264_stage_c_v6_outer_fold_identity
  score_rows: train_unknown_suffix_rows
  primary_unit: non_overlapping_h512_block
  block_origin: first_prediction_suffix_row_per_well
  include_final_short_block: true
  primary_label: k16_block_rmse_at_least_0p25_ft_better_than_exp264_stage_c_selected_hard
  label_positive_equation: rmse_k16_plus_0p25_le_rmse_exp264_selected_hard
  truth_join_policy: after_feature_schema_feature_values_score_and_block_manifest_sha_freeze
  report_scopes:

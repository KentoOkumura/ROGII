feature_contract:
  allowed_pre_freeze_columns:
    - well_id
    - fold
    - row_idx
    - suffix_offset
    - MD
    - exp226_k12_prediction
    - exp226_k16_prediction
    - exp226_k24_prediction
    - exp264_stage_c_selected_candidate_id
    - exp264_stage_c_selected_hard_prediction
  forbidden_pre_freeze_columns:
    - TVT
    - tvt_true
    - error
    - abs_error
    - oracle_candidate
    - oracle_rank
    - bad_well_label
  fixed_row_features:
    level_spread_ft: max_k_prediction_minus_min_k_prediction
    level_std_ft: population_std_of_three_k_predictions
    k16_midpoint_deviation_ft: abs_k16_minus_mean_k12_k24
    outer_asymmetry_ft: abs_k12_minus_k16_minus_abs_k24_minus_k16
    direction_agreement: sign_k12_minus_k16_equals_sign_k24_minus_k16
    k_order_monotone: k12_k16_k24_monotone_increasing_or_decreasing
  fixed_h128_block_features:
    slope_spread_ft: max_minus_min_ols_slope_vs_normalized_block_position
    slope_std_ft: population_std_of_three_ols_slopes
    k16_slope_midpoint_deviation_ft: abs_k16_slope_minus_mean_k12_k24_slopes
  fixed_boundary_feature:
    name: boundary_weighted_jump_spread_ft
    definition: >-
      At rows within plus-or-minus 8 rows of any equal-row segment boundary
      implied by K=12, K=16, or K=24, take the maximum pairwise absolute
      difference among the three first differences; use zero off boundary.
    boundary_position_rule: continuous_np_linspace_edges_on_zero_based_suffix_position
    boundary_radius_rows: 8
  primary_score:
    name: multiscale_k_instability_score
    components:
      - level_spread_ft
      - slope_spread_ft
      - boundary_weighted_jump_spread_ft
    normalization: outer_train_empirical_percentile_with_average_ties
    formula: arithmetic_mean_of_three_component_percentiles
    h512_aggregation: p90_of_row_score
    direction: higher_means_more_unstable_and_more_likely_k16_is_underselected
    tuning: none
  secondary_features_are_diagnostic_only: true


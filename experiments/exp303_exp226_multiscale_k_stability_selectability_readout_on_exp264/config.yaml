experiment:
  name: exp303_exp226_multiscale_k_stability_selectability_readout_on_exp264
  description: >-
    Tests whether a preregistered target-free instability score derived from
    K=12/K=16/K=24 exp226 predictions identifies H512 blocks where the saved
    exp226 K=16 candidate materially beats corrected exp264 Stage C v6 hard selection.
  route: ml_model
  status: kaggle_cpu_v1_completed_technical_pass_scientific_fail_branch_closed
  created_at: "2026-07-20"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_source: exp302_exp226_multiscale_k_segment_candidate_audit
  evidence_source: exp300_exp264_vs_exp274_well_selector_readout
  required_prior_audit: exp276_corrected_exp264_parent_revalidation
  design_source: .steering/20260720-exp303-exp226-multiscale-k-stability-selectability-readout-on-exp264
  diff_summary: >-
    Fit no model and change no prediction. Freeze K=12/K=16/K=24
    prediction-only stability features, compute one fixed outer-train empirical
    rank score, then join truth only to measure whether it separates blocks
    where exp264 misranks K=16. This is a selector-feature feasibility readout,
    not a gate, correction, or selector retrain.


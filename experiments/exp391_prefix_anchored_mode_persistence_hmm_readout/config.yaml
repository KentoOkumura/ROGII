    - No random numbers, fitted model, GPU, PF, or Beam are used.
    - The decoder contract manifest is the model-manifest equivalent.
    - Full posterior arrays remain process-local and are not persisted.
    - A successful first run is not a deterministic anchor until a rerun reproduces logical SHAs.


model:
  name: exp209_prefix_anchor_no_switch_mode_readout
  estimator: deterministic_exact_hmm_train_side_diagnostic
  fitted_model: false
  fixed_hmm:
    coordinate: absolute_tvt
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    emission: gaussian
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    rate_center: zero
    output_control: posterior_mean
  posterior_modes:
    min_peak_height: 0.02
    min_top2_mass: 0.10
    min_top2_to_top1_mass_ratio: 0.25
    min_peak_separation_ft: 6.0
    min_valley_depth: 0.30
    mean_valley_density_ratio_max: 1.20
    mode_track_allowance_ft: 6.0
    peak_order: ascending_tvt_then_grid_index
    basin_boundary: minimum_posterior_between_adjacent_peaks
    display_rank_is_identity: false
  mode_identity:
    anchor: joint_start_prior_lineage
    matching: maximum_transition_transport_overlap
    tie_break: previous_mode_id_then_current_basin_center_tvt
    fields:
      - anchor_mode_id
      - current_mode_id
      - cross_mode_edge
      - mode_switch_count
      - lineage_status
    cross_mode_definition: source_mode_id_differs_from_destination_mode_id
    gradual_cross_mode_moves_count_as_switch: true
    rank_swap_counts_as_switch: false
    unresolved_policy: whole_well_fallback_to_saved_exp209_posterior_mean
  candidate:
    active_variants:
      - prefix_anchor_no_switch_conditional_mean
    final_condition: current_mode_id_equals_anchor_mode_id_and_mode_switch_count_zero
    output: conditional_posterior_mean
    alternative_mode_lanes: diagnostic_only
    soft_average_across_modes: false
    row_oracle_fallback: false

stage_a0:
  name: saved_artifact_target_free_cause_census
  hmm_well_runs: 0
  decoder_separation_event:
    minimum_abs_decoder_gap_ft: 6.0
    minimum_consecutive_rows: 32
    merge_event_gap_rows: 32
  preflight_selection:
    total_wells: 16
    per_fold_top_severity_wells: 3
    add_global_median_severity_wells: 1
    deduplicate_then_fill_by_well_id: true
    target_or_error_allowed: false
  technical_gates:
    require_rows: 3783989
    require_wells: 773
    require_folds: [0, 1, 2, 3, 4]
    require_duplicate_keys: 0
    require_missing_joins: 0
    require_fold_mismatches: 0
    require_id_mismatches: 0
    require_md_since_mismatches: 0
    require_exp263_cache_partition_folds: [0, 1, 2, 3, 4]
    require_finite_path_coverage: 1.0
    require_exp270_exp209_mean_parity_atol_ft: 0.00001
    maximum_truth_error_role_reads_before_freeze: 0


experiment:
  name: exp391_prefix_anchored_mode_persistence_hmm_readout
  description: >-
    Completed fail-closed train-side readout that first separates
    exp209 posterior averaging and transition effects from exp226 K16 projection
    and exp263 fixed-blend effects, then conditionally tests a prefix-anchored
    no-mode-switch HMM decoder.
  route: pf_beam
  status: completed_stage_a1_fail_closed
  created_at: "2026-07-25"
  updated_at: "2026-07-25"
  inference_enabled: false

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260725-exp391-prefix-anchored-mode-persistence-hmm-readout
  references:
    - exp236_exact_hmm_posterior_bimodality_audit
    - exp270_exact_hmm_posterior_mode_candidate_audit
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp263_last_anchor_better_candidate_confidence_pair_cache
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
    - backlog/KAGGLE_DIRECTION.md
  diff_summary: >-
    Keep the exp209 absolute-TVT exact-HMM model unchanged. Add a train-side
    posterior-shape and downstream-path readout, stable transition-overlap mode
    identities, a cross-mode edge ledger, and one prefix-anchor no-switch
    conditional-mean candidate. Never use top1/top2 mass rank as a mode identity.

implementation:
  enabled: true
  scope: compact_selfcontained_train_and_fail_closed_inference_candidates
  train_notebook_state: canonical_compact_selfcontained_adopted
  inference_notebook_state: compact_selfcontained_fail_closed_candidate_not_adopted
  helper_code_created: false
  tests_created: true
  kaggle_package_created: true

validation:
  strategy: saved_artifact_cause_census_then_same_posterior_mode_persistence_readout
  metric: rmse
  seed: 42
  reporting_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  truth_attachment: after_event_mode_ledger_and_candidate_logical_sha_freeze
  leakage_policy:
    - Event extraction and 16-well selection may use only saved predictions, identity, fold, and suffix distance.
    - Peak extraction, basin matching, mode tracking, and candidate generation happen before suffix truth, errors, or hidden-like roles are read.
    - exp236 values are not joined as exp209 posterior values; only its preregistered peak thresholds are reused.
    - Truth and hidden-like roles are late-joined only for frozen-candidate reporting.
    - Public LB is never used for threshold, event, mode, fallback, or rescue selection.


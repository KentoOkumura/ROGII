      contribution_gate:
        minimum_rmse_gain_vs_exp404_ft: 0.10
        minimum_improvement_folds: 4
        minimum_episode_sse_reduction: 0.10
        minimum_support_outside_reduction_points: 5.0
        minimum_raw_gr_observed_gain_ft: 0.10
        maximum_scoped_regression_ft: 0.02
        maximum_by_well_delta_rmse_p95_ft: 0.25
        maximum_worst_well_regression_ft: 2.0
      classification_non_primary:
        standalone_vs_exp226_minimum_gain_ft: 0.03
        physical_anchor_vs_exp263_minimum_gain_ft: 0.03
        minimum_improvement_folds: 3


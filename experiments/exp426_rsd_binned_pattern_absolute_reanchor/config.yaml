notes:
  - Stage A is a common absolute-datum identifiability prerequisite, not proof that exact HMM accuracy improves.
  - Stage B tests direct contribution to exp226 while preserving its local path shape.
  - Stage C separates a uniform physical reanchor target from paper-score-guided finite-particle allocation.

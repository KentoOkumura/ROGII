  leakage_policy:
    - Candidate generation may read only well_id, row_idx, suffix_offset, fold, exp226 tvt_pred, MD, GR, TVT_input, Type Well TVT/GR, and Stage-C Z.
    - Truth, error, oracle offset, persistent episode/cause, and hidden-like roles are late-join only.
    - Score bank, rank, top-3, candidate prediction, manifests, and logical content SHAs freeze before late join.
    - No threshold, score family, block, offset, or gate is selected after truth attachment.


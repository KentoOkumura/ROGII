experiment:
  name: exp426_rsd_binned_pattern_absolute_reanchor
  description: >-
    Design-frozen staged audit of Wu et al. RSD-binned GR pattern matching as
    an absolute-datum observation, an exp226 coarse reanchor, and an
    importance-corrected likelihood-PF absolute-anchor proposal.
  hypothesis: >-
    RSD 0.5-ft bin averaging followed by Pearson pattern matching can identify
    the coarse absolute offset missing from exp226/HMM local-rate models, and
    its top datum basins can improve finite-particle PF support without
    double-counting GR evidence.
  route: pf_beam
  status: completed_stage_a_technical_failed_closed
  priority: P3
  created_at: "2026-07-28"
  updated_at: "2026-07-28"

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  pf_parent: exp404_scale5_sigma_gr_likelihood_pf_ablation
  steering: ../../docs/legacy/steering/20260728-exp426-rsd-binned-pattern-absolute-reanchor
  references:
    - exp408_hmm_message_rate_basin_audit
    - exp410_likpf_particle_resampling_basin_audit
    - exp280_exp226_shift_likelihood_separability_readout
    - exp360_typewell_reference_shift_zncc_confidence_readout
  paper:
    citation: >-
      Wu et al. (2019), Stochastic clustering and pattern matching for
      real-time geosteering, Geophysics 84(5).
    doi: 10.1190/geo2018-0781.1
  diff_summary: >-
    Keeps the saved fold-safe exp226 final path as the local geometry carrier,
    adds only a coarse residual-datum candidate bank scored after 0.5-ft RSD
    bin averaging, then conditionally tests the same frozen score in an
    exp226 Viterbi reanchor and a defensive PF absolute-anchor proposal.


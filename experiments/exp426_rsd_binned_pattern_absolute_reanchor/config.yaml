model:
  name: rsd_binned_pattern_absolute_reanchor
  estimator: none_until_stage_c_likelihood_pf
  common_candidate_contract:
    base_path: exp226_final_tvt_pred
    block_size_rows: 512
    block_overlap_rows: 0
    offsets_ft: [-80, -40, -20, -10, -5, -2, 0, 2, 5, 10, 20, 40, 80]
    tie_order_ft: [0, -2, 2, -5, 5, -10, 10, -20, 20, -40, 40, -80, 80]
    rsd_bin_width_ft: 0.5
    rsd_bin_origin_ft: 0.0
    horizontal_gr_aggregation: finite_mean
    horizontal_gr_imputation: none
    typewell_interpolation: finite_linear_no_extrapolation_no_endpoint_hold
    minimum_raw_finite_gr_points: 32
    minimum_paired_occupied_bins: 16
    minimum_std: 1.0e-6
    primary_correlation: pearson
    primary_score: half_signed_squared_fisher_z
    correlation_clip_epsilon: 1.0e-6
    descriptive_only: [cosine, spearman]
    matched_controls:
      - raw_pointwise_pearson
      - exp280_compatible_raw_gaussian
      - stable_sha256_shift_label_permutation
    raw_gaussian_control:
      kind: exp280_compatible_raw_gr_gaussian
      sigma_mode: known_prefix_residual_std
      sigma_clip: [10.0, 60.0]
      log_likelihood_clip: 600.0
      horizontal_missing_gr_policy: interpolate_both_directions_then_typewell_mean
      typewell_policy: sort_tvt_forward_then_backward_fill_linear_interp_endpoint_hold
    oracle_definition: late_join_discrete_minimum_block_sse_over_fixed_offsets

  stage_a:
    name: absolute_datum_identifiability
    enabled: true
    target_wells: 773
    model_configs: 0
    boosters: 0
    hmm_runs: 0
    pf_runs: 0
    beam_runs: 0
    technical_gate:
      minimum_supported_block_fraction: 0.95
      minimum_supported_well_fraction: 0.98
      require_truth_reads_before_freeze_zero: true
      require_independent_probe_logical_sha_match: true
      maximum_runtime_seconds: 1800
      maximum_peak_rss_gb: 25
    scientific_gate:
      minimum_top1_discrete_oracle_exact: 0.25
      minimum_top3_oracle_coverage: 0.55
      minimum_nonzero_oracle_direction_accuracy: 0.60
      minimum_direction_folds_above_half: 4
      minimum_top1_gain_vs_raw_pearson: 0.03
      minimum_top1_gain_vs_raw_gaussian: 0.03
      minimum_top1_gain_vs_permutation: 0.10
      minimum_control_improvement_folds: 4
      minimum_independent_top1_rmse_gain_ft: 0.10
      minimum_independent_top1_improvement_folds: 4
      scoped_direction_must_exceed_half:
        - distance_1000_plus
        - hidden_like_spatial
        - hidden_like_typewell_purged
      maximum_scoped_rmse_regression_ft: 0.02

  stage_b:
    name: exp226_coarse_absolute_reanchor
    enabled: false
    prerequisite: stage_a_all_gates_pass_and_separate_authorization
    datum_decoder:
      method: viterbi_map_over_512_row_blocks
      initial_center_ft: 0.0
      initial_sigma_ft: 5.0
      transition_sigma_ft: 10.0
      maximum_initial_step_ft: 20.0
      maximum_adjacent_step_ft: 40.0
      unsupported_block_emission: zero_all_states_transition_only_carry
      partially_invalid_candidate_emission: negative_infinity
      row_projection: linear_boundary_zero_through_block_centers_then_last_hold
      maximum_constructive_row_slope_ft: 0.078125
      prediction: exp226_tvt_pred_plus_interpolated_datum_correction
    promotion_gate:
      minimum_rmse_gain_vs_exp226_ft: 0.10
      minimum_improvement_folds: 4
      minimum_persistent_episode_sse_reduction: 0.10
      minimum_persistent_well_improvement_fraction: 0.60
      minimum_distance_1000_plus_gain_ft: 0.20
      maximum_scoped_regression_ft: 0.02
      maximum_new_episode_sse_fraction_of_corrected_total: 0.05
      maximum_by_well_delta_rmse_p95_ft: 0.25
      maximum_worst_well_regression_ft: 5.0

  stage_c:
    name: likelihood_pf_absolute_anchor_proposal
    enabled: false
    prerequisite: stage_a_and_stage_b_all_gates_pass_and_separate_authorization
    pf:
      parent_variant: exp404_x1p0_temperature5
      particles: 500
      seeds: 128
      seed_aggregation: full_suffix_log_evidence_temperature_5
      block_boundary_rows: 512
      anchor_sigma_ft: 1.0
      target_continuation_weight: 0.90
      target_uniform_13_anchor_weight: 0.10
      guided_continuation_weight: 0.90
      guided_uniform_13_anchor_weight: 0.05
      guided_equal_top3_anchor_weight: 0.05
      original_rate_transition_for_all_components: true
      raw_gr_emission_unchanged: true
      importance_correction: p_aug_over_q
      maximum_importance_ratio: 2.0
      importance_clip: none
      unsupported_block_fallback: uniform_target_proposal
    sentinel:
      wells: 12
      variants: [uniform_anchor, pattern_guided_anchor]
      pf_well_runs: 24
      seed_well_trajectories: 3072
      particle_starts: 1536000
      technical_gate:
        require_zero_anchor_probe_parent_parity: true
        require_all_13_anchor_support: true
        require_top3_occupancy_non_degenerate: true
        require_truth_reads_before_freeze_zero: true
        maximum_importance_ratio: 2.000000000001
        maximum_projected_shard_runtime_seconds: 27000
        maximum_peak_rss_gb: 25
      mechanism_gate:
        minimum_episode_sse_reduction_vs_exp404: 0.10
        minimum_support_outside_reduction_points_vs_exp404: 5.0
        minimum_truth_near_seed_fraction_gain_points: 5.0
        minimum_128_row_recapture_rate_gain: 0.10
        minimum_guided_episode_sse_gain_vs_uniform: 0.05
        minimum_guided_support_gain_points_vs_uniform: 2.0
        minimum_improved_wells_out_of_12: 8
        maximum_worst_well_regression_ft: 2.0
    full:
      enabled: false
      prerequisite: sentinel_all_gates_pass_and_separate_authorization
      variants: [pattern_guided_anchor]
      target_wells: 773
      pf_well_runs: 773

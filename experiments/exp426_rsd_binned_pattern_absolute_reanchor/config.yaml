  expected_folds: [0, 1, 2, 3, 4]
  fixed_probe_well: 000d7d20
  fold_source: exp226_group_safe_fold
  parent_rmse_atol_ft: 1.0e-6
  scope_block_assignment: md_since_mid_ft
  truth_attachment: after_score_candidate_prediction_and_content_sha_freeze

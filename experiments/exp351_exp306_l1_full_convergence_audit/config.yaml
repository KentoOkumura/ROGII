model:
  name: l1_full_convergence_technical_audit
  estimator: none
  target: none
  lightgbm_config_count: 0
  fold_training_count: 0
  booster_count: 0
  parent_control_retraining: false
  common_input:
    missing_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
    horizontal_order: within_well_md
    typewell_order: within_typewell_tvt
    cross_group_smoothing: forbidden
  l1_trend:
    branch_name: l1_iter2000_rho1_tol1e4
    kind: second_order_l1_trend_filter
    objective: 0.5_l2_data_plus_lambda_l1_second_difference
    lambda: mad_first_difference_div_0.67448975_div_sqrt2_times_sqrt_2_log_n
    solver: admm
    rho: 1.0
    maximum_iterations: 2000
    absolute_tolerance: 1.0e-4
    relative_tolerance: 1.0e-4
    adaptive_rho: false
    warm_start_alternative: false
    additional_grid: false
  robust_rts:
    enabled: false

audit:
  full:
    active_branches: [l1_iter2000_rho1_tol1e4]
    expected_wells: 773
    series_kinds: [horizontal, typewell]
    expected_series: 1546
    require_all_series_converged: true
    require_all_series_technical_pass: true
    require_finite_input_output: true
    require_length_order_identity: true
    require_silent_fallback_count: 0
    require_error_count: 0
    runtime_limit_seconds: 30600
    failure_policy: fail_closed_without_solver_rescue
  cross_run_parity:
    parent_sample_wells: 64
    parent_parity_wells: 8
    full_solver_rerun: false
    require_parent_input_output_status_exact_sha: true
    require_parent_parity_output_status_iteration_exact_sha: true
    float_tolerance_rescue: false
  execution_counts:
    active_branches: 1
    l1_solver_series_runs: 1546
    stage0_control_series_runs: 0
    full_rerun_series_runs: 0
    parity_rerun_series_runs: 0
    model_count: 0
    lightgbm_config_count: 0
    trained_fold_count: 0
    hmm_well_runs: 0
    pf_well_runs: 0
    beam_well_runs: 0
    booster_count: 0
    parent_control_retraining: 0
    gpu_runs: 0
  expected_outputs:
    - exp351_exp306_l1_full_convergence_audit_scientific_contract.json
    - exp351_exp306_l1_full_convergence_audit_parent_anchor_manifest.json
    - exp351_exp306_l1_full_convergence_audit_raw_identity_manifest.csv
    - exp351_exp306_l1_full_convergence_audit_full_input.csv.gz
    - exp351_exp306_l1_full_convergence_audit_full_output.csv.gz

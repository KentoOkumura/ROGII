experiment:
  name: exp351_exp306_l1_full_convergence_audit
  description: >-
    Design-frozen target-free full technical audit of the only exp306
    full-eligible branch, L1 trend ADMM with max 2000 iterations, across all
    773 wells and 1,546 horizontal/typewell series.
  route: pf_beam
  status: completed_full_technical_fail_closed_no_rescue
  created_at: "2026-07-23"
  updated_at: "2026-07-23"

lineage:
  parent: exp306_robust_rts_l1_convergence_calibration_audit
  grandparent: exp304_gr_denoiser_emission_separability_readout
  steering: ../../.steering/20260723-exp351-exp306-l1-full-convergence-audit
  diff_summary: >-
    Keeps the exp306 L1 objective, lambda formula, rho, tolerances, maximum
    iterations, target-free preparation, and technical gates fixed. Changes
    only the evaluation scope from the fixed 64-well Stage 0 sample to all
    773 wells. RTS and scientific scoring remain excluded.

implementation:
  enabled: true
  scope: l1_full_technical_audit_only
  compact_train_source: exp351_exp306_l1_full_convergence_audit_compact_selfcontained_train.py
  compact_inference_source: exp351_exp306_l1_full_convergence_audit_compact_selfcontained_inference.py
  canonical_notebook_adopted: true
  full_audit_implemented: true
  scientific_score_implemented: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

validation:
  strategy: target_free_l1_full_convergence_technical_audit
  metric: solver_technical_coverage
  seed: 42
  n_folds: 0
  group_column: well_id
  score_rows: no_truth_no_scientific_score
  expected_wells: 773
  expected_series: 1546
  runtime_limit_seconds: 30600
  leakage_policy:
    - Horizontal TVT, truth, error, abs_error, formation, MRR, top3, RMSE, prediction, and submission are forbidden.
    - Typewell TVT is used only as the physical coordinate of the reference GR series.
    - Technical PASS does not change exp304 selected SWT or establish denoiser quality.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  horizontal_suffix: __horizontal_well.csv
  typewell_suffix: __typewell.csv
  horizontal_allowed_columns: [MD, GR, TVT_input]
  horizontal_forbidden_columns: [TVT, error, abs_error, formation]
  typewell_required_columns: [TVT, GR]
  expected_raw_well_identity_sha256: bbb687a1998092578583ce259309b49031d095bde57cbb26c0ab8808d2379b32


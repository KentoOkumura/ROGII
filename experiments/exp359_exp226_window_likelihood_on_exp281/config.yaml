model:
  name: exp226_sparse_window_likelihood_on_exp281
  estimator: none_deterministic_diagnostic
  window_potential:
    source_algorithm: exp226_gr_correction_score_only
    window_rows: 500
    stride_rows: 125
    shifts_ft: [-80.0, -40.0, -20.0, -10.0, -5.0, -2.0, 0.0, 2.0, 5.0, 10.0, 20.0, 40.0, 80.0]
    profile_grid_step_ft: 0.5
    minimum_finite_gr_fraction: 0.50
    minimum_profile_bins: 7
    minimum_relative_path_span_ft: 4.0
    score_weights: {correlation: 2.0, mse: 0.5, level: 0.1}
    correlation_transform: fisher_arctanh_clip_0p95
    sigma_mode: exp226_affine_known_prefix_residual_std
    sigma_clip: [5.0, 60.0]
    normalization: subtract_state_mean_divide_state_std
    state_std_floor: 0.000001
    posterior_sd_source: fixed_13_shift_softmax_of_normalized_window_scores
    lambda_formula: stride_over_window_times_clipped_one_point_one_minus_point_one_two_posterior_sd
    lambda_clip: [0.3, 1.0]
    overlap_normalization: stride_div_window
    placement: fixed_stride_window_centers_only
    ineligible_lambda: 0.0
    typewell_out_of_range_policy: ineligible_candidate
  stage_0:
    active_variants: [fixed_sparse_exp226_window_potential]
    active_variant_count: 1
    gaussian_control: sha_pinned_saved_exp280_aggregate
    control_alignment: window_center_to_containing_exp280_512_row_block
    negative_control: stable_sha256_within_well_window_permutation
  stage_1:
    implemented: false
    enabled_condition: stage_0_all_gates_pass_and_separate_user_approval
    active_variants: [fixed_sparse_exp226_window_potential]
    hmm_well_runs: 773
    pass_requires_all:
      minimum_rmse_gain_vs_exp281_ft: 0.05
      minimum_improved_folds: 4
      require_1000_plus_non_regression: true
      require_hidden_like_spatial_non_regression: true
      require_hidden_like_typewell_purged_non_regression: true
      require_by_well_p95_non_regression: true
      maximum_worst_well_regression_ft: 0.25
      maximum_direct_rmse_for_promotion: 9.427109596582213
  fixed_parent:
    shape: exp226_tvt_geop
    coordinate: residual_offset
    relative_path: exp226_tvt_geop_within_window
    row_gaussian_emission_transition_sigma_grid_momentum_prior_output: exact_exp281
  forbidden:
    - exp323_or_exp338_dependency
    - exp305_or_exp343_input
    - window_stride_score_or_lambda_grid
    - dense_rowwise_factor
    - transition_or_sigma_change
    - exp226_delta_or_final_prediction
    - prediction_blend

audit:
  output_prefix: exp359_exp226_window_likelihood_on_exp281
  window_policy: full_windows_from_suffix_start_fixed_stride

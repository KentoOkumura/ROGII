experiment:
  name: exp359_exp226_window_likelihood_on_exp281
  description: >-
    Independent sparse exp226 window-likelihood rank audit and conditional
    exp281 residual-offset exact-HMM evaluation without an exp323 dependency.
  route: pf_beam
  status: stage_0_completed_guard_failed_closed
  created_at: "2026-07-23"
  updated_at: "2026-07-25"

lineage:
  parent: exp281_exp226_residual_offset_exact_hmm_transition_probe
  steering: ../../docs/legacy/steering/20260723-exp359-exp226-window-likelihood-on-exp281
  stage_0_control: exp280_exp226_shift_likelihood_separability_readout
  history: exp325_exp226_window_likelihood_hmm_tempering
  references:
    - exp305_acf_tempered_log_likelihood
    - exp343_exp226_residual_offset_student_t_emission
  diff_summary: >-
    Removes the exp323 transition dependency. It keeps the full exp281
    residual-offset decoder fixed and adds only a preregistered sparse,
    normalized exp226 window potential at fixed stride centers. Stage 0
    implements only the target-free window-rank audit and does not run an HMM.

implementation:
  enabled: true
  scope: stage_0_rank_audit_only
  train_notebook_state: compact_selfcontained_canonical_adopted
  inference_notebook_state: fail_closed_compact_candidate_created_canonical_placeholder_unchanged
  canonical_notebook_replacement_authorized: true
  canonical_notebook_adopted: true
  compact_selfcontained_source_created: true
  stage_1_implemented: false
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.score_rows

validation:
  strategy: independent_window_shift_rank_then_grouped_exp281_hmm_audit
  metric: mrr_top3_then_rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_exp280_blocks: 7787
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: full_500_row_unknown_suffix_windows_at_fixed_stride_centers
  truth_attachment: after_window_score_eligibility_lambda_and_control_content_sha_freeze
  leakage_policy:
    - Window identities, relative shifts, GR profiles, score surfaces, eligibility, lambda, and controls are frozen before truth or error is joined.
    - Unknown-suffix TVT, error, abs_error, oracle rank, and worst-well identity are forbidden from score generation.
    - Saved exp280 Gaussian scores are mapped by each 500-row window center to the containing fixed 512-row block; partial block scores are never reconstructed.
  stage_0_pass_requires_all:
    required_score_finite_coverage: 1.0
    required_row_identity_coverage: 1.0
    required_control_rank_parity: 1.0
    minimum_pooled_mrr_gain: 0.01
    minimum_pooled_top3_gain: 0.01
    minimum_improved_folds_mrr: 4
    minimum_improved_folds_top3: 4
    require_real_above_shuffle_all_folds: true
    require_1000_plus_positive_direction: true
    require_hidden_like_spatial_positive_direction: true
    require_hidden_like_typewell_purged_positive_direction: true
    minimum_eligible_window_fraction: 0.25


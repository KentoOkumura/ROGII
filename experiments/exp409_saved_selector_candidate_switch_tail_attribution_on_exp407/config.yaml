validation:
  strategy: saved_outer_oof_candidate_switch_tail_attribution
  metric: rmse
  diagnostic_metric: additive_excess_squared_error_and_rmse_readout
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_base_rows: 3783989
  expected_candidate_long_rows: 45407868
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  expected_candidate_count: 12
  expected_selectable_candidate_count: 11
  truth_free_phase:
    allowed_columns:
      - id
      - well
      - well_row_idx
      - outer_fold
      - md_since
      - candidate_id
      - candidate_tvt
      - candidate_available
      - pred_abs_error
      - feature_schema_sha
      - candidate_contract_sha
      - model_fold
    forbidden_columns:
      - actual_abs_error
      - actual_within10
      - TVT
      - error
      - oracle
    freeze_before_truth_join: true
  truth_join_phase:
    allowed_truth_columns:
      - actual_abs_error
    verify_parent_exp407_actual_error_parity: true
    verify_candidate_value_parity: true
  distance_buckets:
    edges: [-.inf, 250.0, 500.0, 1000.0, .inf]
    labels: [near_0_250, 250_500, 500_1000, 1000_plus]
  hidden_like_scopes:
    hidden_like_spatial:
      column: verification_like_spatial_role
      included_value: valid
    hidden_like_typewell_purged:
      column: verification_like_typewell_purged_role
      included_value: valid
  preregistered_worst_well: 52f1e77a
  attribution:
    error_unit: squared_ft
    additive_quantity: exp407_squared_error_minus_parent_squared_error
    positive_value_means: exp407_worse
    transition_inventory_frozen_before_truth: true
    rank_tie_break: transition_id_ascending
  concentration_gate:
    tail_scopes:
      - distance_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
    require_same_rank1_positive_excess_sse_transition: true
    minimum_rank1_folds_per_scope: 4
    require_same_transition_in_all_tail_scopes: true
    require_same_transition_rank1_in_preregistered_worst_well: true
    magnitude_threshold: null
    note: >-
      The gate is ordinal and introduces no tunable share threshold. Every
      transition and its positive-excess-SSE share is still reported.


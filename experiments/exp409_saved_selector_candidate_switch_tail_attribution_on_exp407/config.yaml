experiment:
  name: exp409_saved_selector_candidate_switch_tail_attribution_on_exp407
  description: >-
    Attribute the exp407 hard-selector tail regression to frozen row-level
    candidate switches relative to corrected exp264 Stage B v5, using only
    saved OOF score surfaces and no model fitting.
  hypothesis: >-
    If inverse-RMSE task weighting weakened a specific locally useful
    candidate signal, the same directed parent-to-exp407 candidate switch
    should be the largest positive excess-SSE contributor in at least four of
    five folds across the fixed 1000-plus and two hidden-like tail scopes, and
    should also dominate the preregistered exp407 worst well.
  route: ml_model
  status: completed_tail_consistency_gate_failed_closed
  created_at: "2026-07-26"
  updated_at: "2026-07-26"
  inference_enabled: false
  submission_enabled: false
  next_action: >-
    close_exp409_without_selector_rescue_and_keep_exp407_scientific_fail_closed

lineage:
  parent: exp407_fold_safe_inverse_rmse_weighted_dual_selector_on_exp264
  comparator: exp264_exp263_candidate_confidence_dual_selector
  parent_selector_surface: exp407_stage_b_v1_inverse_rmse_weighted_outer_oof
  comparator_selector_surface: exp264_corrected_stage_b_v5_outer_oof
  steering: >-
    ../../docs/legacy/steering/20260726-exp409-saved-selector-candidate-switch-tail-attribution-on-exp407
  references:
    - docs/06_reproducibility.md
    - experiments/exp407_fold_safe_inverse_rmse_weighted_dual_selector_on_exp264/config.yaml
    - experiments/exp407_fold_safe_inverse_rmse_weighted_dual_selector_on_exp264/result.md
    - experiments/exp264_exp263_candidate_confidence_dual_selector/candidate_contract.yaml
  diff_summary: >-
    Generate no new prediction. Read the two frozen candidate-long OOF score
    surfaces, reproduce each hard selector from pred_abs_error over the same
    eleven-candidate legal domain before reading any actual error, freeze the
    row-level parent-to-exp407 transition and target-free scope columns, then
    join saved actual_abs_error only for additive excess-SSE attribution.


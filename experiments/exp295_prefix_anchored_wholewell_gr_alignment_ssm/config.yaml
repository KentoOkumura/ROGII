      - /kaggle/input/exp209-joint-exact-parity-train/artifacts/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation_amerhu_exact_hmm_smoother_default_train_features.csv.gz
      - experiments/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation/artifacts/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation_amerhu_exact_hmm_smoother_default_train_features.csv.gz
      - /tmp/kaggle-output/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation/train_v5_small/artifacts/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation_amerhu_exact_hmm_smoother_default_train_features.csv.gz

model:
  name: prefix_conditioned_wholewell_gr_emission_exact_ssm
  estimator: pytorch_structured_neural_emission_plus_exact_forward_backward
  target: typewell_tvt_state_of_true_horizontal_tvt
  sample_unit: complete_well
  output: tvt_posterior_mean
  inference_neighbor_well_data: false
  candidate_bank: none
  test_time_gradient_updates: false
  preprocessing:
    robust_center: finite_median
    robust_scale: 1p4826_mad_with_floor_1
    missing_fill_value_after_normalization: 0.0
    include_missing_mask: true
    typewell_extrapolation: false
    prefix_huber_summary:
      minimum_pairs: 32
      fallback: neutral_context
  inputs:
    horizontal_emission_channels: [gr_robust_z, gr_missing_mask, dgr_dmd]
    typewell_emission_channels: [gr_robust_z, gr_missing_mask, dgr_dtvt]
    transition_only_channels: [MD, X, Y, Z, TVT_input]
    prefix_context_sources: [horizontal_gr, typewell_gr_at_visible_tvt_input, visible_tvt_input_mask]
  architecture:
    horizontal_encoder: multiscale_1d_residual
    typewell_encoder: multiscale_1d_residual
    embedding_dim: 64
    dilations: [1, 2, 4, 8, 16]
    normalization: group_norm
    dropout: 0.10
    prefix_context_aggregator: masked_attention_pool
    prefix_context_dim: 32
    conditioning: film_scale_and_bias_per_encoder_block
    similarity: normalized_bilinear_cosine
    temperature: positive_prefix_conditioned_clamped
    temperature_min: 0.05
    temperature_max: 2.0
    temperature_initial: 0.25
    convolution_kernel_size: 3
    group_norm_groups: 8
    prefix_pair_embedding_dim: 64
    prefix_pair_channels: [horizontal_gr, matched_typewell_gr, gr_difference, pair_finite_mask]
    prefix_huber_summary_channels: [slope, intercept_scaled, residual_scale_scaled, pair_fraction, valid_fit]
    derivative_clip_abs: 8.0
    unary_row_chunk_size: 256
    streamed_row_tvt_unary: true
  state_space:
    source: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    state: tvt_grid_and_rate
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    emission_distribution: learned_log_unary
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
    known_prefix_policy: hard_clamp_finite_tvt_input
    solver: exact_log_space_forward_backward
    primary_readout: posterior_mean_tvt
    diagnostic_readouts: [marginal_map, global_viterbi, posterior_std, entropy, grid_edge_mass]
    learn_transition: false
  training:
    objective:
      structured_label_nll_weight: 1.0
      label_observation_distribution: gaussian
      label_observation_sigma_ft: 0.35
      local_true_state_ce_weight: 0.25
    optimizer: adamw
    learning_rate: 0.0003
    weight_decay: 0.0001
    max_epochs: 8
    early_stopping_holdout_fraction: 0.10
    early_stopping_minimum_wells: 16
    early_stopping_patience_epochs: 2
    early_stopping_min_delta_nll_per_token: 0.001
    early_stopping_views: [official]
    gradient_clip_norm: 1.0
    batch_size_wells: 1
    gradient_accumulation_wells: 4
    amp: true
    early_stopping_source: stable_outer_train_well_holdout_only
    dataloader_shuffle: true
    dataloader_workers: 0
    pseudo_cut_views_per_well_maximum: 3
    full_suffix_no_tail_truncation: true
    require_cuda: true
    minimum_cuda_capability_major: 7
  controls:
    - real_gr
    - stable_within_well_circular_shuffled_typewell_gr_same_trained_model
    - zero_gr_unary_geometry_only_same_trained_model
  forbidden_actions:
    - neighbor_well_path_or_tvt_input
    - same_typewell_horizontal_donor
    - spatial_neighbor_feature_or_prior
    - candidate_bank_or_selector
    - hard_top1_or_row_switch
    - candidate_softmax_average
    - learned_transition
    - outer_valid_temperature_or_early_stopping
    - test_time_backpropagation
    - pseudo_start_risk_gate_or_direct_correction
    - posthoc_loss_band_temperature_or_architecture_grid
    - blend_with_existing_ml_pf_or_beam


experiment:
  name: exp295_prefix_anchored_wholewell_gr_alignment_ssm
  description: >-
    Learn a prefix-conditioned complete-well GR-to-Type-Well unary and decode
    the continuous TVT alignment with the fixed exp209 exact state-space
    grammar, without neighbor-well data or a candidate bank.
  route: ensemble
  status: stage_a_failed_runtime_timeout_branch_closed
  created_at: "2026-07-19"

lineage:
  parent: exp202_heatmap_mdn_candidate_generator_probe
  references:
    - exp178_supervised_gr_window_matcher_from_known_tvt_prefix
    - exp197_cnn_pf_likelihood_probe
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp221_lgb_oof_gaussian_emission_hmm_on_exp148
    - exp244_bidirectional_prediction_start_pseudotail_augmentation
    - exp291_prefix_masked_typewell_gr_multimode_safe_beam
    - exp292_typewell_gr_warp_rate_identifiability_audit
    - exp293_physics_only_candidate_bank_headroom_contract
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  design_source: docs/legacy/steering/20260719-exp295-prefix-anchored-wholewell-gr-alignment-ssm
  architecture_contract: architecture_contract.md
  diff_summary: >-
    Replaces local-window argmax, hand-crafted GR candidate scores, and
    candidate selection with one fold-safe neural emission architecture whose
    sample is a complete well. A visible-prefix context conditions horizontal
    and Type Well GR encoders; their row-by-TVT unary is decoded by the fixed
    exp209 state grid and transition grammar. The experiment uses no
    neighbor-well inference data, candidate bank, hard top1, or downstream
    blend. Pseudo-cuts are outer-train augmentation only, not a risk gate.

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.score_rows

validation:
  strategy: complete_well_groupkfold_official_prefix_hidden_suffix
  metric: pooled_oof_rmse_tvt_posterior_mean
  seed: 42
  n_folds: 5
  group_column: well
  sample_unit: complete_well
  score_rows: official_tvt_input_hidden_suffix_rows
  reuse_fold_map_from: exp202_heatmap_mdn_candidate_generator_probe
  valid_mask_policy: organizer_equivalent_official_tvt_input_mask
  outer_train_pseudo_cut_offsets_rows: [0, 256, 512]
  baselines:
    primary_decoder_baseline:
      experiment: exp221_lgb_oof_gaussian_emission_hmm_on_exp148
      pooled_oof_rmse: 8.327736951
    raw_exact_hmm:
      experiment: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
      pooled_oof_rmse: 11.938287417
    current_ml_same_fold_reference:
      experiment: exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218
      pooled_oof_rmse: 7.936690031
      use_for_primary_gate: false
  diagnostics:
    - fold_rmse
    - distance_bucket_rmse
    - distance_1000_plus_rmse
    - hidden_like_spatial_rmse
    - hidden_like_typewell_purged_rmse
    - by_well_rmse_p95_and_worst
    - true_state_nll
    - posterior_mass_within10_and_20
    - posterior_entropy_and_grid_edge_mass
    - target_in_grid_rate
    - step_and_transition_continuity
    - runtime_and_peak_memory
  leakage_policy:
    - Outer-valid wells are completely absent from model fitting, normalization fitting, early stopping, and temperature fitting.
    - Outer-valid suffix TVT is loaded only after model, unary, posterior, row identity, and control manifests are content-frozen.
    - The model input allowlist is target-well MD, X, Y, Z, GR, TVT_input and the target well's provided Type Well TVT/GR curve.
    - Inference-side horizontal source count must equal one; same-typewell or spatially neighboring horizontal wells are forbidden.
    - Pseudo-cuts are generated only from outer-train wells and never serve as an outer-valid risk or correction gate.
    - Candidate, error, oracle, true-error rank, formation, and neighbor-path columns are rejected before model execution.
    - Valid truth may report target-in-grid coverage but may not expand the band or change any setting in exp295.
  stage_a_pass:
    minimum_target_in_grid_rate: 0.995
    maximum_prefix_clamp_abs_error_ft: 0.000001
    minimum_real_nll_gain_vs_circular_shuffle_nats_per_token: 0.05
    minimum_real_within10_mass_gain_vs_circular_shuffle: 0.03
    minimum_real_rmse_gain_vs_geometry_only_ft: 0.25
    minimum_real_rmse_gain_vs_exp209_ft: 0.25
    require_well_rmse_p95_non_regression_vs_exp209: true
    maximum_worst_well_regression_vs_exp209_ft: 10.0
    maximum_peak_gpu_memory_gb: 14.0
    maximum_fold_runtime_hours: 8.5
  stage_b_gr_attribution_pass:
    minimum_pooled_rmse_gain_vs_each_control_ft: 0.50
    require_real_better_than_each_control_all_folds: true
    require_real_nll_better_than_circular_shuffle_all_folds: true
  stage_b_lb5x_promotion_pass:
    maximum_pooled_oof_rmse_ft: 6.0
    stretch_pooled_oof_rmse_ft: 5.0
    require_improvement_vs_exp221_all_folds: true
    require_improvement_vs_exp221_distance_1000_plus: true
    require_improvement_vs_exp221_hidden_like_spatial: true
    require_improvement_vs_exp221_hidden_like_typewell_purged: true
    require_well_rmse_p95_non_regression_vs_exp221: true
    maximum_worst_well_regression_vs_exp221_ft: 5.0
    require_gr_attribution_pass: true
    require_finite_coverage: 1.0
  architecture_signal_only_upper_rmse_ft: 6.75
  failure_policy:
    - Stage A failure closes Stage B without an in-experiment architecture, loss, band, or temperature rescue grid.
    - OOF above 6.75 ft or failed GR attribution closes the branch.
    - OOF in (6.0, 6.75] ft with full GR attribution supports only a separately designed architecture-iteration experiment, not exp295 inference.
    - Only the full LB5x promotion gate permits a separately approved Stage C in this same experiment.


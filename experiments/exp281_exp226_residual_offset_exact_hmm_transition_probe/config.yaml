experiment:
  name: exp281_exp226_residual_offset_exact_hmm_transition_probe
  description: >-
    Decode one fixed slow residual-offset exact HMM in the moving coordinate
    system of group-safe exp226 geometry-only tvt_geop after exp280 established
    fold-stable raw-GR likelihood separability.
  route: pf_beam
  status: completed_train_side_guard_failed
  created_at: "2026-07-19"
  updated_at: "2026-07-19"

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  decoder_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  separability_parent: exp280_exp226_shift_likelihood_separability_readout
  failure_reference: exp279_exp226_geop_centered_exact_hmm_redecode
  control_reference: exp263_last_anchor_better_candidate_confidence_pair_cache
  diff_summary: >-
    Reparameterizes the exp209 joint exact HMM from absolute TVT position into
    delta around saved group-safe exp226 tvt_geop. The absolute transition
    center is the exp226 row-to-row geometry increment and the only dynamic
    freedom is a slow residual offset and its minimal rate state. Keeps the
    exp209 Gaussian raw-GR emission, known-prefix calibration, missing-GR
    interpolation, 0.35-ft step, 41 rate states, process grammar, and likelihood
    weight fixed. exp226 tvt_pred is forbidden to prevent GR double use.

validation:
  strategy: group_safe_exp226_residual_offset_exact_hmm_unknown_suffix_oof
  metric: rmse_tvt
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  promotion_baseline:
    candidate: exp263_fixed_exp226_w500_50_50
    oof_rmse: 8.238331
    parity_atol_ft: 0.00001
    public_lb: 7.800
  guards:
    minimum_oof_gain_ft: 0.02
    minimum_improved_folds: 3
    maximum_scope_rmse_regression_ft: 0.02
    maximum_worst_well_rmse_regression_ft: 0.25
    maximum_persistent_episode_count_delta: 0
    minimum_recovery_rate_delta: 0.0
    required_delta_grid_coverage: 1.0
    required_finite_coverage: 1.0
  leakage_policy:
    - exp226 OOF is group-safe and the decoder loads tvt_geop but not tvt_pred, gr_delta, truth, error, or abs_error.
    - The decoder receives raw horizontal/typewell inputs, known TVT_input prefix, and saved group-safe tvt_geop only.
    - Offset grid, rate states, transition noise, likelihood calibration, and guards are fixed before execution.
    - Unknown-suffix true TVT is attached by id only after every well candidate path is frozen.
    - Recovery episodes and all performance guards are truth-only post-generation readouts and cannot select a parameter.


model:
  name: exp226_residual_offset_exact_hmm
  estimator: deterministic_exact_forward_backward_on_delta_and_offset_rate
  target: train_unknown_suffix_tvt_for_post_generation_scoring_only
  hmm:
    delta_min_ft: -80.0
    delta_max_ft: 80.0
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_delta_ft: 0.0
    start_sig: 0.75
    initial_offset_rate: 0.0
    r0_sig: 0.01
    mom: 0.998
    rate_center: zero
    gr_log_likelihood_clip: 600.0
    typewell_extension_ft: 40.0
    transition_center: exp226_tvt_geop_row_delta
    active_variants: [residual_offset_delta80_step035_rate41]
    forbid_columns: [tvt_pred, gr_delta, tvt_true, abs_error, error]
  fixed_formula_control:
    name: exp263_fixed_exp226_w500_50_50
    weights:
      exp226_pred: 0.50
      likelihood_pf_mean: 0.25
      exact_hmm: 0.25

audit:
  output_prefix: exp281_exp226_residual_offset_exact_hmm_transition_probe
  distance_buckets_ft: [50, 100, 250, 500, 1000]
  promotion_scopes:
    near:
      minimum_md_since_ft: 0.0
      maximum_md_since_ft: 250.0
    long_tail:
      minimum_md_since_ft: 1000.0
      maximum_md_since_ft: null
  persistent_offset:
    error_threshold_ft: 10.0
    minimum_consecutive_rows: 128
    return_threshold_ft: 5.0
    recovery_horizons_rows: [256, 512]
  persist_full_posterior: false
  persist_oracle_predictions: false
  persist_selector: false
  persist_candidate_blend: false
  expected_artifacts:
    - exp281_exp226_residual_offset_exact_hmm_transition_probe_oof_predictions.csv.gz
    - exp281_exp226_residual_offset_exact_hmm_transition_probe_candidate_metrics.csv

experiment:
  name: exp011_tracker_divergence_features
  description: Add deterministic tracker candidate path, likelihood, and divergence features to the last-anchor residual model
  route: ml_model
  status: completed
  created_at: "2026-06-03"
  updated_at: "2026-06-03"

lineage:
  parent: exp010_trajectory_drift_ablation
  diff_summary: Replace failed trajectory add-only variants with deterministic PF/beam-style tracker divergence features against exp002/exp003 controls

validation:
  # Shared metric, fold count, seed, group, and score-row defaults come from project.yml.
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Evaluation-zone TVT is used only as the residual target during training/CV.
    - Train-only formation columns are not used.
    - Tracker features use only MD, Z, GR, TVT_input prefix, and paired typewell GR available at inference.
    - Tracker path generation is deterministic; no stochastic PF snapshots or hidden-test fitted state are used.
    - Existing GR NCC and formation guide feature sets stay disabled.

data: {}

model:
  name: hgb_last_anchor_residual_tracker_divergence
  primary_strategy: drift_hgb
  drift_strategy: drift_hgb
  feature_set: all
  strategies:
    - last_anchor
    - drift_hgb
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    trajectory_window: 200
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: HistGradientBoostingRegressor
    params:
      max_iter: 180
      learning_rate: 0.05
      max_leaf_nodes: 31
      min_samples_leaf: 80
      l2_regularization: 0.05
      max_bins: 255
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800
  tracker:
    enabled: true
    allow_reverse: true
    min_valid_fraction: 0.30
    dtw_max_points: 160
    dtw_band_fraction: 0.12
    confidence_hold_scale: 2.0
    long_eval_rows: 5700
    high_z_span: 120.0
    candidates:
      - name: s3
        scale: 3.0
        slope_scale: 0.375
        window: 25
        radius: 90.0
        shift_step: 15.0
      - name: s5
        scale: 5.0
        slope_scale: 0.625
        window: 35
        radius: 120.0
        shift_step: 15.0
      - name: s8
        scale: 8.0
        slope_scale: 1.0
        window: 50
        radius: 160.0
        shift_step: 20.0
      - name: s12
        scale: 12.0
        slope_scale: 1.5
        window: 75
        radius: 220.0
        shift_step: 20.0
  gr_ncc:
    enabled: false
  formation_guide:
    enabled: false
  rationale:
    - exp002 all-GR remains the Public LB anchor at 12.533.
    - exp003 no-GR remains the strongest single-model CV anchor at 13.882944.
    - exp010 showed full trajectory add-only features hurt hard-no-GR, steep trajectory, high-GR-missing, and long-eval groups.
    - Public notebook updates on 2026-06-03 point toward PF/beam scale selectors and likelihood, but stochastic PF is risky for reproducibility and hidden runtime.
    - This experiment converts scale-specific tracker paths, likelihood, hold blend weight, and candidate divergence into auxiliary HGB features.

ablation:
  baseline_experiment: exp002_drift_minimal
  baseline_cv: 14.124569
  baseline_public_lb: 12.533
  alternate_experiment: exp003_residual_ablation
  alternate_cv: 13.882944
  alternate_public_lb: 12.852
  parent_experiment: exp010_trajectory_drift_ablation
  parent_cv: 14.236694
  selected_variant: tracker_divergence_no_gr
  variants:
    - name: control_exp002_all
      variable: control
      description: Re-run exp002 all-GR settings as the Public-LB control row.
      overrides:
        model:
          tracker:
            enabled: false
    - name: control_exp003_no_gr
      variable: feature_set
      description: Re-run exp003 selected no-GR feature set as the strongest CV control row.
      overrides:
        model:
          feature_set: no_gr_signal
          tracker:
            enabled: false
    - name: tracker_divergence_no_gr
      variable: tracker_features
      description: Add deterministic scale-specific tracker likelihood, path deltas, and divergence features to exp003 no-GR.
      overrides:
        model:
          feature_set: no_gr_signal_plus_tracker
    - name: tracker_divergence_all
      variable: tracker_features
      description: Add deterministic tracker divergence features to exp002 all-GR.
      overrides:
        model:
          feature_set: all_plus_tracker
    - name: tracker_direction_no_gr
      variable: tracker_plus_direction
      description: Add tracker divergence plus the limited trajectory direction group, without the failed full trajectory slope/interactions.
      overrides:
        model:
          feature_set: no_gr_signal_plus_tracker_direction

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  save_well_metrics: true
  save_oof_predictions: false

notes:
  - Submission target column is lowercase tvt, while train target is uppercase TVT.
  - Do not use train-only formation columns directly at inference.
  - Train notebook writes ablation_metrics.csv, well_metrics.csv, fold_metrics.csv, and fold_model_training.csv with variant names.
  - Inference applies ablation.selected_variant.
  - Tracker features are deterministic approximations of PF/beam signals: scale-specific prior path, typewell-GR likelihood, DTW cost, hold weight, and candidate divergence.

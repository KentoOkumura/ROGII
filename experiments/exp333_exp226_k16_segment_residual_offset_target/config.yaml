notes:
  - Design frozen on 2026-07-21 at the user's request.
  - Stage 0 implementation was approved on 2026-07-21.
  - Stage 0 Kaggle CPU version 1 completed and passed on 2026-07-21; the only attached kernel source was the saved exp226 train output.
  - Stage 0 execution authorization is consumed. Stage 1 implementation was separately approved and completed.
  - Stage 1 CPU preflight version 1 completed and passed on 2026-07-21; its execution authorization is consumed and the full run remains separately unapproved.
  - Full Stage 1 CPU train was approved on 2026-07-21 for one variant, one config, five folds, five boosters, 25 nested exp226 fits, and 3,865 prediction well-runs; parent/control retraining remains zero.
  - Full Stage 1 CPU train version 1 completed on 2026-07-21 but failed the pooled, near-0-250, and worst-well fixed gates. The branch is fail-closed with no inference or submission.
  - Stage 0 and Stage 1 execution are separate approvals. A Stage 1 scientific PASS does not by itself approve inference.
  - exp361 CPU v2 supported exp333 as an add-one candidate against the fixed exp293 bank. On 2026-07-23 the user separately approved current-test candidate artifact generation with the saved five models; direct promotion, selector/blend, submission-file generation, and competition submit remain disabled.
  - Candidate inference v1 failed before feature generation because the raw replay frame exposed 205 columns including nine exp072-excluded likelihood-PF diagnostic columns. Version 2 applied exp072's canonical 196-column allowlist and completed.
  - Candidate inference v2 produced a validated 14,151-row candidate artifact with five saved models and no training or submission. Its one-run authorization is consumed.

segmentation:
  name: exact_exp226_k16_suffix_segments
  k_segments: 16
  row_coordinate: one_based_unknown_suffix_row
  edges: numpy_linspace_zero_to_suffix_length_17_edges
  assignment: numpy_searchsorted_edges_1_to_16_side_left_clip_zero_15
  empty_segment_policy: omit_sample_record_count
  expected_nonempty_segments: 12368
  boundary_audit_half_width_rows: 8

target:
  name: segment_mean_tvt_minus_nested_exp226
  row_residual: true_tvt_minus_strict_nested_exp226_prediction
  aggregation: float64_arithmetic_mean
  sample_weight: segment_row_count
  broadcast: constant_to_all_rows_in_segment
  clipping: none
  shrinkage: none
  taper: none
  interpolation: none
  slope: disabled

features:
  row_source: exp228_exp218_compatible_target_free_generator
  allowed_groups:
    - projection_correction
    - u_disagreement
    - gr_wavelet_rotation_confidence
  include_lgb_oof_features: false
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  gr_wavelet_rotation_confidence:
    prefix: grwr_
    feature_group: gr_wavelet_rotation_confidence
    prefix_slope_window_rows: 80
    slope_clip: [-3.0, 3.0]
    local_windows_rows: [33, 65, 129]
    candidate_match_offsets_rows: [-32, -24, -16, -8, 0, 8, 16, 24, 32]
    typewell_smooth_window: 5
    ncc_weight: 8.0
    wavelet:
      name: db4
      level: 3
      fallback_window: 65
    fft:
      detrend: linear
      top_k_notch: 3
      rotation_band_norm: [0.06, 0.35]
      high_frequency_norm: 0.35
    denoise_filters:
      rolling_median_11:
        kind: rolling_median
        window: 11
      savgol_31_p2:
        kind: savgol
        window: 31
        polyorder: 2
    default_candidate: likpf_mean
    candidate_match_names: [pf_ancc, beam_mean, likpf_mean, sc_ens, hyb]
    candidate_tvt_specs:
      - {name: pf_ancc, column: pf_ancc, kind: absolute}
      - {name: beam_mean, column: beam_mean_d, kind: delta}
      - {name: likpf_mean, column: likpf_mean_d, kind: delta}
      - {name: sc_ens, column: sc_ens_d, kind: delta}
      - {name: hyb, column: hyb_d, kind: delta}
      - {name: tvt_dense, column: tvt_dense_d, kind: delta}
      - {name: tvt_densew, column: tvt_densew_d, kind: delta}
      - {name: tvt_dense50, column: tvt_dense50_d, kind: delta}
  forbidden_groups:
    - learned_likelihood_confidence
    - selector_score_or_rank_margin
    - formation_label_derived
    - true_error_or_oracle
  row_to_segment_aggregation:
    numeric: finite_float64_mean
    all_nonfinite: preserve_nan
    prohibited: [std, min, max, quantile, first, last, slope]
  structural_columns:
    - segment_id
    - segment_position
    - segment_row_count
    - segment_md_span
    - exp226_pred_mean
    - exp226_pred_start
    - exp226_pred_end_minus_start
  forbidden_columns:
    - well_id_as_model_feature
    - TVT
    - residual
    - oracle_candidate
    - target_slope


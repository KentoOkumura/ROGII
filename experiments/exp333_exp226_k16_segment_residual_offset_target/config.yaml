experiment:
  name: exp333_exp226_k16_segment_residual_offset_target
  description: >-
    Design-frozen strict-nested segment residual experiment that predicts one
    mean TVT-minus-exp226 offset per exp226-compatible K16 segment from
    target-free segment-mean features and broadcasts it without clipping,
    shrinkage, tapering, or slope correction.
  route: ensemble
  status: current_test_candidate_inference_v2_completed_no_submission
  created_at: "2026-07-21"
  updated_at: "2026-07-23"

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  rowwise_residual_comparison: exp228_direct_residual_correction_on_exp226
  reusable_blend_comparison: exp263_last_anchor_better_candidate_confidence_pair_cache
  ml_reference: exp287_fold_safe_formation_74_addonly_on_exp264
  stage_0_implementation_source: exp333_exp226_k16_segment_residual_offset_target_compact_selfcontained_train.py
  stage_1_implementation_source: exp333_exp226_k16_segment_residual_offset_target_stage1_compact_selfcontained_train.py
  candidate_inference_implementation_source: exp333_exp226_k16_segment_residual_offset_target_current_test_compact_selfcontained_inference.py
  steering: ../../.steering/20260721-exp333-exp226-k16-segment-residual-offset-target
  candidate_inference_steering: ../../.steering/20260723-exp333-exp226-k16-segment-residual-offset-target-current-test-candidate-inference
  diff_summary: >-
    Changes the learning unit and residual target from exp228 row-level samples
    to one row-count-weighted mean residual target per exp226-compatible K16
    segment. It uses strict nested exp226 predictions, excludes supervised
    learned-likelihood and selector features, and applies the predicted segment
    offset directly to the fixed exp226 base. Segment slope, alternate horizons,
    smoothing, clipping, shrinkage, and candidate selection are unchanged or
    disabled.

implementation:
  enabled: true
  scope: stage_0_and_stage_1_train
  stage_0_enabled: true
  stage_1_enabled: true
  inference_enabled: false
  submission_enabled: false

downstream_candidate_path_evidence:
  experiment: exp361_exp333_candidate_path_addone_novelty_audit
  status: kaggle_cpu_v2_completed_technical_pass_candidate_novelty_pass
  decision: exp333_candidate_path_novelty_supported
  h512_oracle_improvement_ft: 0.13310387620658748
  whole_well_oracle_improvement_ft: 0.10213233914534925
  h512_strict_unique_best_fraction: 0.11506356748426866
  improved_folds: 5
  interpretation: >-
    The original direct-promotion failure remains valid, but exp333 is
    supported as an add-on candidate path against the frozen exp293 bank.
  current_test_candidate_inference_supported_for_separate_approval: true
  current_test_candidate_inference_approved: false
  current_test_candidate_inference_approval_date: "2026-07-23"
  current_test_candidate_inference_authorization_consumed: true
  current_test_candidate_inference_status: kaggle_cpu_v2_completed_technical_pass
  authorization_scope: candidate_artifact_only_no_submission
  submission_approved: false

validation:
  strategy: strict_nested_exp226_k16_segment_residual_groupkfold
  metric: rmse
  primary_metric_definition: row_level_rmse_tvt_after_segment_offset_broadcast
  seed: 42
  n_outer_folds: 5
  n_inner_folds: 4
  group_column: well_id
  expected_rows: 3783989
  expected_wells: 773
  expected_nonempty_segments: 12368
  outer_fold_policy: exact_saved_exp226_source_fold_identity
  inner_fold_policy: stable_sha256_sort_round_robin_four_fold_within_outer_train
  score_rows: train_unknown_suffix_rows
  outer_valid_parent_parity_max_abs_ft: 0.00000001
  leakage_policy:
    - Outer-valid wells and their true suffix TVT are excluded from every outer-train exp226 donor field, kappa fit, feature, and model fit.
    - Outer-train residual targets use four-fold inner OOF exp226 predictions; an outer-train well is excluded from the exp226 fit that predicts it.
    - Outer-valid exp226 predictions are generated from full outer-train only and must reproduce the saved exp226 OOF within 1e-8 ft.
    - Row feature groups are limited to target-free raw-test-regenerable projection, U-disagreement, and GR-wavelet-rotation confidence groups.
    - Supervised learned-likelihood, selector score, true error, oracle candidate, residual summary, target slope, and well ID features are forbidden.
    - Segment target is attached only after base prediction, row feature, fold, and segment assignment are frozen and hashed.
  technical_guards:
    required_row_coverage: 1.0
    required_well_coverage: 1.0
    required_segment_count: 12368
    required_segment_id_min: 0
    required_segment_id_max: 15
    required_finite_target_coverage: 1.0
    required_finite_base_prediction_coverage: 1.0
    required_outer_fold_set: [0, 1, 2, 3, 4]
    maximum_outer_valid_parent_parity_abs_ft: 0.00000001
    maximum_feature_forbidden_column_hits: 0
    maximum_target_or_error_loaded_before_freeze: 0


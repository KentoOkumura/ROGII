experiment:
  name: exp415_fold_safe_rmse_prior_bounded_nudge_on_exp264
  description: >-
    Confirm a zero-booster use of fold-safe candidate RMSE as an additive
    selector prior, then convert the selected candidate difference into a
    mathematically risk-bounded TVT nudge on corrected exp264 OOF.
  hypothesis: >-
    Candidate RMSE can improve the direction of local selector corrections
    when used as a global score prior rather than task importance. Clipping
    every TVT correction to 0.25 ft guarantees scope-level RMSE regression no
    larger than 0.25 ft while retaining repeatable aggregate improvement.
  route: ensemble
  status: complete_saved_oof_method_confirmed
  created_at: "2026-07-26"
  updated_at: "2026-07-27"
  inference_enabled: false
  submission_enabled: false
  next_action: no_inference_or_submission_diagnostic_method_only

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  root_cause_source: exp407_fold_safe_inverse_rmse_weighted_dual_selector_on_exp264
  root_cause_readout: exp414_fold_safe_candidate_rmse_offset_selector_on_exp264
  steering: ../../docs/legacy/steering/20260726-exp415-fold-safe-rmse-prior-bounded-nudge-on-exp264
  references:
    - docs/06_reproducibility.md
    - experiments/exp264_exp263_candidate_confidence_dual_selector/config.yaml
    - experiments/exp407_fold_safe_inverse_rmse_weighted_dual_selector_on_exp264/result.md
    - experiments/exp414_fold_safe_candidate_rmse_offset_selector_on_exp264/result.md
  diff_summary: >-
    Use corrected exp264 saved pred_abs_error scores and candidate TVT values
    without retraining. Add each outer model's exact-fit candidate RMSE to its
    candidate score to choose a prior candidate. Move the parent-selected TVT
    halfway toward that candidate but clip the per-row correction to +/-0.25
    ft. The ML selector and PF/Beam-containing candidate bank both contribute
    directly to prediction, so the route is ensemble.


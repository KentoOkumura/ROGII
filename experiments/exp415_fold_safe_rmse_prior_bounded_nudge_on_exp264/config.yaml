policy:
  name: fold_safe_rmse_prior_bounded_tvt_nudge
  parent_selection: argmin_parent_pred_abs_error_over_primary_domain
  prior_selection: argmin_parent_pred_abs_error_plus_fit_candidate_rmse
  candidate_rmse_coefficient: 1.0
  blend_parent_weight: 0.5
  blend_prior_weight: 0.5
  raw_nudge: half_prior_tvt_minus_parent_tvt
  correction_clip_ft: [-0.25, 0.25]
  max_abs_correction_ft: 0.25
  forbidden:
    - inverse_rmse_weight
    - candidate_rmse_as_feature
    - actual_error_before_freeze
    - candidate_rmse_coefficient_grid
    - blend_weight_grid
    - correction_cap_grid
    - candidate_subset
    - well_specific_threshold
    - rescue_after_gate


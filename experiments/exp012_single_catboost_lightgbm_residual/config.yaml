experiment:
  name: exp012_single_catboost_lightgbm_residual
  description: Compare single CatBoost and LightGBM residual models against fixed HGB residual controls
  route: ml_model
  status: completed
  created_at: "2026-06-03"
  updated_at: "2026-06-03"

lineage:
  parent: exp003_residual_ablation
  diff_summary: Keep the exp002/exp003 residual target, GroupKFold split, row sampling, and feature sets while changing only the residual model class

validation:
  # Shared metric, fold count, seed, group, and score-row defaults come from project.yml.
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Evaluation-zone TVT is used only as the residual target during training/CV.
    - Train-only formation columns are not used.
    - CatBoost and LightGBM variants use the same sampled rows and feature sets as HGB controls.

data: {}

model:
  name: single_model_last_anchor_residual
  primary_strategy: drift_model
  drift_strategy: drift_model
  feature_set: no_gr_signal
  strategies:
    - last_anchor
    - drift_model
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: HistGradientBoostingRegressor
    params:
      max_iter: 180
      learning_rate: 0.05
      max_leaf_nodes: 31
      min_samples_leaf: 80
      l2_regularization: 0.05
      max_bins: 255
  lightgbm_params:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 80
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 0.1
    n_jobs: 2
  catboost_params:
    iterations: 800
    learning_rate: 0.03
    depth: 8
    l2_leaf_reg: 3.0
    thread_count: 2
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800
  rationale:
    - exp002 all-GR HGB remains the Public LB anchor at 12.533.
    - exp003 no-GR HGB remains the strongest single-model CV anchor at 13.882944.
    - exp008 to exp011 add-only feature experiments worsened CV, so this experiment changes only model class.
    - A single CatBoost or LightGBM model may capture residual interactions without adding leak-prone features.

ablation:
  baseline_experiment: exp002_drift_minimal
  baseline_cv: 14.124569
  baseline_public_lb: 12.533
  cv_anchor_experiment: exp003_residual_ablation
  cv_anchor_cv: 13.882944
  cv_anchor_public_lb: 12.852
  selected_variant: lightgbm_no_gr
  variants:
    - name: control_hgb_all
      variable: control
      description: Re-run exp002 all-GR HGB settings as the Public-LB control row.
      overrides:
        model:
          feature_set: all
          drift_model:
            estimator: HistGradientBoostingRegressor
            params:
              max_iter: 180
              learning_rate: 0.05
              max_leaf_nodes: 31
              min_samples_leaf: 80
              l2_regularization: 0.05
              max_bins: 255
    - name: control_hgb_no_gr
      variable: control
      description: Re-run exp003 selected no-GR HGB settings as the CV control row.
      overrides:
        model:
          feature_set: no_gr_signal
          drift_model:
            estimator: HistGradientBoostingRegressor
            params:
              max_iter: 180
              learning_rate: 0.05
              max_leaf_nodes: 31
              min_samples_leaf: 80
              l2_regularization: 0.05
              max_bins: 255
    - name: lightgbm_all
      variable: model_class
      description: Replace HGB with a single LightGBM residual model on the all-GR feature set.
      overrides:
        model:
          feature_set: all
          drift_model:
            estimator: LGBMRegressor
            params:
              n_estimators: 800
              learning_rate: 0.03
              num_leaves: 31
              min_child_samples: 80
              subsample: 0.9
              colsample_bytree: 0.9
              reg_lambda: 0.1
              n_jobs: 2
    - name: lightgbm_no_gr
      variable: model_class
      description: Replace HGB with a single LightGBM residual model on the exp003 no-GR feature set.
      overrides:
        model:
          feature_set: no_gr_signal
          drift_model:
            estimator: LGBMRegressor
            params:
              n_estimators: 800
              learning_rate: 0.03
              num_leaves: 31
              min_child_samples: 80
              subsample: 0.9
              colsample_bytree: 0.9
              reg_lambda: 0.1
              n_jobs: 2
    - name: catboost_all
      variable: model_class
      description: Replace HGB with a single CatBoost residual model on the all-GR feature set.
      overrides:
        model:
          feature_set: all
          drift_model:
            estimator: CatBoostRegressor
            params:
              iterations: 800
              learning_rate: 0.03
              depth: 8
              l2_leaf_reg: 3.0
              thread_count: 2
    - name: catboost_no_gr
      variable: model_class
      description: Replace HGB with a single CatBoost residual model on the exp003 no-GR feature set.
      overrides:
        model:
          feature_set: no_gr_signal
          drift_model:
            estimator: CatBoostRegressor
            params:
              iterations: 800
              learning_rate: 0.03
              depth: 8
              l2_leaf_reg: 3.0
              thread_count: 2

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  save_well_metrics: true
  save_oof_predictions: false

notes:
  - Submission target column is lowercase tvt, while train target is uppercase TVT.
  - Do not use train-only formation columns directly at inference.
  - Train notebook writes ablation_metrics.csv, well_metrics.csv, fold_metrics.csv, fold_model_training.csv, and model_group_summary.csv with variant names.
  - Inference applies ablation.selected_variant after Kaggle full CV chooses a candidate.
  - LightGBM and CatBoost are optional runtime dependencies and are imported only by their selected variants.

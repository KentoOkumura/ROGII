experiment:
  name: exp487_time_varying_gr_affine_likelihood_pf
  description: >-
    Design-frozen two-variant PF audit that applies the exp345 causal and
    exp350 bidirectional time-varying GR affine schedules to particle emission
    centers.
  hypothesis: >-
    Dynamic current-well affine calibration can correct local GR distribution
    drift inside PF filtering more safely than the failed exp211 static affine
    transform.
  route: pf_beam
  status: stage0_completed_all_pass_pending_stage1_approval
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  exact_pf_implementation_reference: exp404_scale5_sigma_gr_likelihood_pf_ablation
  causal_schedule_source: exp345_exp209_time_varying_gr_affine_calibration_hmm
  bidirectional_schedule_source: exp350_exp345_bidirectional_gr_affine_smoother
  static_pf_negative_reference: exp211_affine_calibrated_gr_observation_pfbeam
  steering: ../../.steering/20260730-exp487-time-varying-gr-affine-likelihood-pf
  diff_summary: >-
    Generate the fixed exp345 causal EKF and exp350 extended-RTS affine
    schedules from the frozen exp209 base path, then apply each schedule to the
    exp404 per-particle Type Well GR emission center. Keep PF sigma, dynamics,
    500 particles, 128 stable seeds, and temperature-5 aggregation fixed.
    Report both variants independently without same-OOF winner selection.


model:
  name: time_varying_affine_gr_emission_likelihood_pf_audit
  estimator: deterministic_affine_schedule_plus_stochastic_likelihood_pf
  active_variants:
    - causal_ekf_affine_emission
    - bidirectional_rts_affine_emission
  base_path:
    source: saved_exp209_posterior_mean_and_std
    freeze_before_schedule: true
    calibration_iterations: 1
  affine_state_common:
    state: [intercept_b, log_scale_a]
    transition: local_level_random_walk
    initial_fit: robust_current_well_visible_prefix_affine
    minimum_prefix_pairs: 40
    minimum_typewell_gr_std: 5.0
    slope_bounds: [0.25, 4.0]
    maximum_prefix_rmse: 60.0
    trim_quantile: 0.90
    robust_iterations: 2
    process_noise_estimator: median_squared_adjacent_robust_prefix_state_increment
    process_noise_state_sequence: cumulative_robust_fit_every_40_finite_pairs_plus_final
    process_noise_increment_normalization: squared_state_increment_per_source_row
    process_noise_shrinkage: n_div_n_plus_100_toward_global_outer_train_median
    process_noise_shrinkage_space: linear_variance
    process_noise_numerical_floor: 1.0e-12
    initial_covariance: trimmed_ols_covariance_transformed_to_intercept_and_log_scale
    covariance_update: joseph_form
    missing_raw_gr_update_policy: skip_update_propagate_state
    fallback: identity_a1_b0
    train_process_noise_policy: once_per_outer_fold_from_visible_prefix_only
    test_process_noise_policy: once_from_all_train_visible_prefix_only
  causal_ekf:
    schedule_state_timing: current_row_posterior_after_one_finite_raw_gr_update
    gr_nll_timing: one_step_predictive_before_current_row_update
    freeze_before_pf: true
  bidirectional_rts:
    forward_records: exact_causal_ekf_records
    algorithm: deterministic_fixed_interval_extended_rts
    transition_matrix: identity_2x2
    interval: entire_score_suffix
    observation_source: full_observable_raw_gr
    smoothing_gain: filtered_covariance_times_pinv_next_predicted_covariance
    pseudoinverse_rcond: 1.0e-12
    terminal_policy: smoothed_terminal_equals_filtered_terminal
    covariance_symmetrization: half_matrix_plus_transpose
    covariance_negative_eigen_tolerance: 1.0e-8
    covariance_numerical_floor: 1.0e-12
    output_scale_policy: clip_to_common_slope_bounds
    maximum_output_scale_clip_fraction: 0.01
    freeze_before_pf: true
  pf_emission:
    mean: exp_log_scale_a_t_times_typewell_gr_at_particle_tvt_plus_intercept_b_t
    sigma_policy: unchanged_exp404_x1p0_no_a_rescaling
    log_likelihood: capped_gaussian_z2_600
    emission_clip_z2: 600.0
    raw_gr_double_use_risk: schedule_update_and_particle_likelihood
  fixed_from_exp404:
    particles: 500
    seeds: 128
    primary_seed_weighting_temperature: 5.0
    base_scale_clip: [10.0, 60.0]
    initial_position_spread_ft: 4.5
    initial_rate_spread: 0.01
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    rough_position: 0.1
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
    typewell_grid_step_ft: 0.2
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32


model:
  name: none_gr_denoiser_emission_separability_readout
  estimator: none_deterministic_diagnostic
  active_audit_variants: [raw, robust_rts, swt_db4_l3, l1_trend]
  active_variant_count: 4
  lightgbm_config_count: 0
  trained_fold_count: 0
  booster_count: 0
  hmm_decode_count: 0
  pf_run_count: 0
  beam_run_count: 0
  parent_control_retraining: false

audit:
  implementation_status: kaggle_cpu_v1_completed_quality_passed
  selected_denoiser: swt_db4_l3
  valid_denoisers: [swt_db4_l3]
  output_prefix: exp304_gr_denoiser_emission_separability_readout
  shift_bank_ft: [-80.0, -40.0, -20.0, -10.0, -5.0, -2.0, 0.0, 2.0, 5.0, 10.0, 20.0, 40.0, 80.0]
  block_rows: 512
  block_policy: non_overlapping_from_suffix_start_keep_short_tail
  score_aggregation: mean_row_log_likelihood
  tie_policy: config_shift_bank_order
  typewell_extension_ft: 40.0
  common_input:
    missing_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
    preserve_original_missing_mask_for_readout: true
    horizontal_order: within_well_md
    typewell_order: within_typewell_tvt
    cross_group_smoothing: forbidden
  emission:
    kind: exp209_gaussian_gr
    sigma_source: known_prefix_raw_gr_residual_std_shared_by_all_variants
    sigma_clip: [10.0, 60.0]
    log_likelihood_clip: 600.0
    recompute_sigma_from_denoised_gr: false
  denoisers:
    raw:
      kind: identity_after_common_missing_policy
    robust_rts:
      kind: student_t_iteratively_reweighted_rts_level_slope
      coordinate_normalization: median_positive_spacing
      robust_scale: median_absolute_deviation_from_median_div_0.67448975
      measurement_df: 4.0
      measurement_scale: robust_scale_first_difference_div_sqrt2
      process_acceleration_scale: robust_scale_second_divided_difference
      transition_matrix: constant_velocity_F_dt
      process_covariance: discrete_white_acceleration_Q_dt
      initial_mean: first_level_and_median_normalized_slope
      initial_covariance: diag_R_and_R_plus_acceleration_variance
      finite_scale_floor: 1.0e-6
      maximum_iterations: 8
      relative_mean_tolerance: 1.0e-6
      hyperparameter_grid: false
    swt_db4_l3:
      kind: stationary_wavelet_soft_universal_threshold
      wavelet: db4
      level: 3
      padding: reflection_to_multiple_of_8
      padding_side: right_preserve_original_row_alignment
      noise_scale: detail_mad_div_0.67448975
      threshold: sigma_j_times_sqrt_2_log_n
      fallback: forbidden_technical_fail
    l1_trend:
      kind: second_order_l1_trend_filter
      objective: 0.5_l2_data_plus_lambda_l1_second_difference
      lambda: mad_first_difference_div_0.67448975_div_sqrt2_times_sqrt_2_log_n
      solver: admm
      rho: 1.0
      maximum_iterations: 500
      absolute_tolerance: 1.0e-4
      relative_tolerance: 1.0e-4
      hyperparameter_grid: false
  shuffled_control:
    enabled: true
    seed: 42
    policy: stable_sha256_per_well_block_permutation_of_candidate_scores
  scopes:
    long_tail_min_md_since_ft: 1000.0
    sharp_edge_definition: global_top10pct_raw_typewell_abs_gradient_block_mean_at_tvt_geop
    original_gr_missing_definition: any_original_missing_row_in_block
  distortion_metrics:
    - raw_smoothed_mae
    - raw_smoothed_correlation
    - detail_energy_ratio
    - sharp_edge_attenuation
    - output_finite_coverage
  expected_artifacts:
    - exp304_gr_denoiser_emission_separability_readout_scientific_contract.json
    - exp304_gr_denoiser_emission_separability_readout_denoised_gr_manifest.json
    - exp304_gr_denoiser_emission_separability_readout_denoised_gr_series.csv.gz
    - exp304_gr_denoiser_emission_separability_readout_target_free_shift_scores.csv.gz
    - exp304_gr_denoiser_emission_separability_readout_block_readout.csv.gz
    - exp304_gr_denoiser_emission_separability_readout_fold_metrics.csv
    - exp304_gr_denoiser_emission_separability_readout_scope_metrics.csv
    - exp304_gr_denoiser_emission_separability_readout_distortion_metrics.csv
    - exp304_gr_denoiser_emission_separability_readout_solver_status.csv
    - exp304_gr_denoiser_emission_separability_readout_input_manifest.json
    - exp304_gr_denoiser_emission_separability_readout_summary.json


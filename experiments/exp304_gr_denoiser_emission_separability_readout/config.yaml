experiment:
  name: exp304_gr_denoiser_emission_separability_readout
  description: >-
    Completed 0-booster audit that selected stationary db4 level-3 SWT as the only
    technically valid denoiser to improve truth-nearest shift separability before
    any exact-HMM, PF, or Beam decode.
  route: pf_beam
  status: train_side_readout_completed_quality_passed
  created_at: "2026-07-20"
  updated_at: "2026-07-21"

lineage:
  parent: null
  methodology_parent: exp280_exp226_shift_likelihood_separability_readout
  emission_reference: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  negative_reference: exp189_denoised_gr_pfbeam_generation_audit
  signal_reference: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  reserved_followup_contract: reserved_followup_contract.md
  diff_summary: >-
    Reuses exp280's fixed exp226 geometry, 13-shift bank, 512-row blocks,
    fold identities, score freeze, and raw-GR Gaussian calibration. Changes only
    the GR signal supplied to the emission: raw, robust RTS, stationary db4 level-3
    wavelet denoising, or second-order L1 trend filtering. The compact self-contained
    train-side Kaggle CPU v1 selected stationary db4 level-3 SWT as the only
    technically valid and quality-passing denoiser. Decode, model training,
    inference, and submission remain excluded; the fixed tempered exact-HMM
    follow-up must be a separate experiment.

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.group_column
    - validation.score_rows

validation:
  strategy: fixed_exp280_shift_bank_gr_denoiser_emission_separability_readout
  metric: diagnostic_block_mrr_top3_vs_raw_and_stable_shuffled
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows_aggregated_to_fixed_512_row_blocks
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  truth_attachment: after_all_denoised_series_and_target_free_scores_are_frozen
  forbidden_score_columns: [tvt_pred, gr_delta, tvt_true, error, abs_error, formation]
  scopes:
    - overall
    - fold_0_to_4
    - md_since_1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - original_gr_missing
    - original_gr_observed
    - typewell_gr_abs_gradient_top10pct
  late_phase_scope_enabled: false
  promotion:
    primary_metrics: [mrr, top3]
    minimum_pooled_mrr_absolute_gain_vs_raw: 0.01
    minimum_pooled_top3_absolute_gain_vs_raw: 0.01
    require_pooled_top1_non_degradation: true
    minimum_folds_mrr_improved_vs_raw: 4
    minimum_folds_top3_improved_vs_raw: 4
    require_scope_mrr_top3_non_degradation:
      - md_since_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
      - typewell_gr_abs_gradient_top10pct
    minimum_folds_real_mrr_above_shuffled: 5
    minimum_folds_real_top3_above_shuffled: 5
    require_truth_minus_best_decoy_gap_improvement: true
    selection_metric: pooled_mrr_absolute_gain_vs_raw
    selection_tie_tolerance: 0.0001
    selection_tie_order: [robust_rts, swt_db4_l3, l1_trend]
    failure_action: close_reserved_followups_2_3_4_without_rescue_grid


validation:
  strategy: exp391_same_outer5_groupfold_truth_late_directional_confidence_readout
  metric: rmse
  primary_diagnostic_metric: bad10_auc
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: train_unknown_suffix_rows
  truth_attachment: after_checkpoint_mode_confidence_null_and_content_sha_freeze
  primary_scope:
    source: exp391_stage_a0_decoder_separation_events
    expected_event_manifest_logical_sha256: 30dae154edf9cb5bdc353378649c3fdd38bf3592000e0feabfbdc2083565cd09
    expected_events: 1234
    expected_event_wells: 730
    checkpoint: event_center
  secondary_scope:
    checkpoint_stride_rows: 256
    purpose: coverage_and_risk_curve_only
  leakage_policy:
    - Event and checkpoint identities are fixed without suffix truth or error.
    - Mode lineage, left/right evidence, confidence, and circular null are frozen before suffix truth, error, or hidden-like roles are read.
    - Outer-valid/test raw formation columns and suffix true TVT are unavailable before confidence freeze.
    - exp226 tvt_geop must preserve its saved group-safe outer-fold contract.
    - Public LB cannot select a window, gap, mode threshold, confidence formula, or gate.
    - Cross-model consensus is reporting-only and cannot enter the primary confidence score.


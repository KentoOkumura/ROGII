  additional_shift_grid: false
  mode_label_permutation: false

model:
  name: deterministic_left_right_mode_consensus_readout
  estimator: no_fitted_model
  prediction_output: none_confidence_only
  fixed_hmm:
    source: exact_exp209
    coordinate: absolute_tvt
    step_ft: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    emission: gaussian
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad_ft: 100.0
    momentum: 0.998
  forbidden:
    - reverse_direction_tvt_predictor
    - new_tvt_candidate
    - hard_mode_selection_or_switch
    - conditional_mode_mean_as_prediction
    - prediction_replacement
    - posthoc_blend_or_selector
    - confidence_weight_tuning
    - window_gap_or_mode_threshold_grid
    - same_oof_rescue
    - exp386_or_exp387_reopening
    - inference_or_submission


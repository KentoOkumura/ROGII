directional_evidence:
  checkpoint:
    primary: exp391_event_center
    secondary_stride_rows: 256
  left:
    window_rows: 512
    ends_before_checkpoint_rows: 64
  right:
    window_rows: 512
    starts_after_checkpoint_rows: 64
  minimum_observed_rows_per_side: 256
  shared_conditions:
    - known_prefix_affine_gr_calibration
    - exp209_absolute_tvt_grid
    - exp209_transition_grammar
    - exp209_emission_contract
  shared_target_gr_rows_between_sides: false
  interpretation: disjoint_observation_consistency_conditional_on_shared_physics_and_calibration
  distribution_support: union_of_stable_mode_lineages_at_checkpoint
  missing_mode_mass: 0.0

confidence:
  primary_name: left_right_mode_posterior_overlap
  formula: sum_over_modes_min_left_probability_right_probability
  range: [0.0, 1.0]
  risk_score_name: one_minus_left_right_overlap
  risk_formula: one_minus_primary_confidence
  learned_or_tuned_weights: false
  absolute_high_confidence_threshold: null
  fixed_reports:
    - left_right_top_mode_agreement
    - mode_center_tvt_difference
    - minimum_top1_top2_log_margin
    - jensen_shannon_divergence
    - adjacent_checkpoint_agreement_persistence
    - confidence_quartile_rmse
    - coverage_risk_curve
  cross_model_reporting_only:
    physical_third_vote: exp226_tvt_geop
    predictions:
      - likpf
      - exact_hmm
      - exp226_final
      - exp263_fixed_candidate
    enters_primary_confidence: false


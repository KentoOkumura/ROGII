experiment:
  name: exp395_left_right_mode_consensus_confidence_readout
  description: >-
    Confidence-only train-side readout that scores the same stable exact-HMM
    mode lineages with disjoint heel-side and toe-side GR evidence, without
    generating or changing any TVT prediction.
  route: pf_beam
  status: closed_unimplemented_exp391_stage_a1_failed
  created_at: "2026-07-25"
  updated_at: "2026-07-25"

lineage:
  parent: exp391_prefix_anchored_mode_persistence_hmm_readout
  decoder_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  physical_reference: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  promotion_reference: exp263_last_anchor_better_candidate_confidence_pair_cache
  steering: ../../.steering/20260725-exp395-left-right-mode-consensus-confidence-readout
  prerequisites:
    - exp391_stage_a1_all_technical_and_mechanism_gates_pass
    - exp391_mode_identity_contract_sha_frozen
    - separate_user_implementation_approval
  references:
    - exp236_exact_hmm_posterior_bimodality_audit
    - exp270_exact_hmm_posterior_mode_candidate_audit
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp283_self_gr_topk_alternative_mode_branch_future_evidence_readout
    - exp284_prefix_masked_wrong_mode_branch_recovery_backtest
    - exp291_prefix_masked_typewell_gr_multimode_safe_beam
    - exp340_exp226_depth_alias_block_confidence_readout_on_exp264
    - exp386_cycle_consistent_rgt_scenario_bank
    - exp387_prefix_gr_rgt_scenario_posterior
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep the exp209 HMM grammar and exp391 stable mode identities fixed. Split
    target GR into non-overlapping left and right windows around each checkpoint,
    normalize the two evidence distributions over the same mode lineages, and
    use posterior overlap only as an error-confidence readout. Do not reverse a
    predictor, alter a path, select a mode, or create a TVT candidate.


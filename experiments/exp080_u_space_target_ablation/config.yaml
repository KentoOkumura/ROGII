experiment:
  name: "exp080_u_space_target_ablation"
  description: Compare U-space supervised target definitions on the fixed exp073 full replay LightGBM feature surface.
  route: ml_model
  status: implemented_not_run
  created_at: "2026-06-18"
  updated_at: "2026-06-18"

lineage:
  parent: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  cache_parent: exp072_exp063_full_replay_feature_cache
  implementation_source: u_space_target_ablation.py
  public_replay_source: public_notebook_replay_audit.py
  diff_summary: Reuses the exp072 deterministic 196-feature full replay train cache and exp073 LightGBM config family, but changes only the supervised target definition. Stage 1 compares raw TVT residual and U-space target transforms, converting every OOF prediction back to TVT space for the same pooled, well-level, distance-bucket, tail-bucket, and target-distribution audits.

validation:
  strategy: groupkfold_by_exp063_well_same_features_target_ablation
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Train features are read from exp072's raw-train-only deterministic feature cache.
    - The expected train feature surface is exp063 Pixiux full public replay with 196 features.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.
    - Target anchors T0 and Z0 are recovered from raw train known-prefix rows only.
    - Target construction never reads valid tail true TVT as an anchor.
    - The only changed variable versus exp073 is supervised target definition.
    - This is a train-side target ablation and not a submission candidate until full CV is recorded.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json

model:
  name: exp080_u_space_target_ablation_lgbm
  source_experiment: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  feature_source: exp072_exp063_full_replay_train_feature_cache
  expected_feature_count: 196
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  target_ablation:
    stage: 1
    selected_target: null
    active_targets:
      - dTVT
      - dTVT_plus_dZ
      - TVT_plus_Z_abs
      - TVT_plus_Z_minus_T0
      - TVT_plus_Z_minus_T0Z0
    target_definitions:
      dTVT:
        description: TVT - T0, equivalent to the exp073 last_known_tvt residual baseline.
      dTVT_plus_dZ:
        description: (TVT - T0) + (Z - Z0), a local U-space delta.
      TVT_plus_Z_abs:
        description: TVT + Z absolute U-space value.
      TVT_plus_Z_minus_T0:
        description: TVT + Z - T0.
      TVT_plus_Z_minus_T0Z0:
        description: TVT + Z - (T0 + Z0).
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; included for optional rerun comparison.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train

audit:
  mode: u_space_target_ablation_from_exp072_cache
  output_prefix: exp080_u_space_target_ablation
  fast: false
  bucket_columns:
    distance: md_since
    tail_rank: id
  expected_train_artifacts:
    - exp080_u_space_target_ablation_metrics.csv
    - exp080_u_space_target_ablation_by_well.csv
    - exp080_u_space_target_ablation_bucket_metrics.csv
    - exp080_u_space_target_ablation_target_summary.csv
    - exp080_u_space_target_ablation_predictions.csv.gz
    - exp080_u_space_target_ablation_feature_schema.csv
    - exp080_u_space_target_ablation_lgb_models/manifest.json
    - exp080_u_space_target_ablation_summary.json

inference:
  mode: not_selected_train_side_target_ablation
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  selected_target: null
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  notes:
    - Inference is intentionally not selected until train-side target ablation results are reviewed.
    - If a U-space target is selected, the inference notebook must regenerate raw-test features and apply the matching inverse target transform using test prefix T0/Z0.

notes:
  - This implements the backlog item `u_space_target_ablation`.
  - Old `u_space_anchor_definition_ablation` is treated as Stage 1 inside this experiment.
  - Target-only comparison keeps exp073 feature cache, folds, and LightGBM config fixed.

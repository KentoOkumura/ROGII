notes:
  - The linked discussion is weak external evidence because it gives no score, CV, version, or active-path proof.
  - The current linked notebook contains both an x1.3 lik_pf and a separate x1.0 selector particle filter; exp400 targets only the exp072-like lik_pf lineage.
  - exp398's exact-HMM x1.3 failure remains closed and is not reclassified by this PF-specific design.
  - Implementation-only approval was received on 2026-07-25; compact self-contained
    train and fail-closed inference candidates plus contract tests are implemented.
  - The fixed exp072 cache has likpf_mean_d but no saved scale 3/5/8/12 columns.
    Candidate scale readouts remain nonselective diagnostics; the parent PF is not rerun.
  - Canonical train notebook adoption and Kaggle private CPU package/push/run were
    approved by the user on 2026-07-25. Inference and submission remain unapproved.

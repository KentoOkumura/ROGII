validation:
  strategy: exp072_saved_control_all_well_likelihood_pf_gs_x1p3
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  primary_candidate: likpf_mean_x1p3
  primary_control: saved_exp072_likpf_mean
  control_rmse_ft: 11.594897672217703
  fixed_hmm_likpf_blend_control_rmse_ft: 10.269696146642758
  truth_attachment: after_candidate_prediction_and_logical_content_sha_freeze
  missing_fraction_buckets:
    low: [0.0, 0.10]
    mid: [0.10, 0.30]
    high: [0.30, 1.0]
    boundary_policy: left_closed_right_open_except_final_closed
  leakage_policy:
    - Candidate generation reads horizontal MD, Z, GR, and TVT_input but not horizontal suffix TVT.
    - Type Well TVT is a reference-curve coordinate and is allowed during candidate generation.
    - Candidate predictions and logical content SHA are frozen before suffix truth, errors, fold scores, or hidden-like roles are read.
    - exp226 is used only for well, row, suffix-offset, and fold identity.
    - Saved exp072 and exp209 predictions are reporting controls and fixed-blend inputs only.
    - Public LB cannot select the multiplier, clip, particle count, seed count, scale, or rescue.


experiment:
  name: exp400_all_well_1p3_sigma_gr_likelihood_pf
  description: >-
    Design-frozen train-side one-factor audit that keeps the deterministic
    exp072 128-seed likelihood-PF unchanged except for multiplying the
    already-clipped well-level GR observation scale by 1.3 for every well.
    The saved exp072 likpf_mean prediction is the control and is not rerun.
  route: pf_beam
  status: train_side_all_well_likelihood_pf_gs_x1p3_gate_failed_closed
  created_at: "2026-07-25"
  updated_at: "2026-07-26"

overrides:
  project_defaults:
    - validation.metric
    - validation.n_folds

lineage:
  parent: exp072_exp063_full_replay_feature_cache
  steering: ../../.steering/20260725-exp400-all-well-1p3-sigma-gr-likelihood-pf
  fixed_reporting_reference: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  sibling_negative_reference: exp398_all_well_1p3_sigma_gr_exact_hmm
  references:
    - exp069_pixiux_pf_beam_direct_submit_audit
    - exp091_self_gr_likelihood_pf_beam_probe
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
    - https://www.kaggle.com/competitions/rogii-wellbore-geology-prediction/discussion/728712
    - https://www.kaggle.com/code/hjyact/ultimate-pf-config-strategy-a-reproducible-score
  diff_summary: >-
    Change only exp072 lik_pf gs from clip(prefix zero-filled GR residual
    population std, 10, 60) to 1.3 times that already-clipped value for all
    773 wells, with no post-multiplier clip. Keep particles, seeds, stable
    per-well seed policy, dynamics, likelihood, resampling, interpolation,
    scale readouts, and aggregation exact. This isolates the discussion's
    lik_pf line and is not a replay of the linked notebook's full selector,
    Beam, Ridge, projection, or model-package pipeline.


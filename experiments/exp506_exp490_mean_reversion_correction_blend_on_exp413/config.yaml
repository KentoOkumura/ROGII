experiment:
  name: exp506_exp490_mean_reversion_correction_blend_on_exp413
  description: >-
    Audit whether the novel mean-reversion correction from exp357 to exp490
    can be added to the final exp413-family anchor with one nonnegative,
    tightly bounded, meta-fold-safe scalar weight.
  route: ensemble
  status: stage_a_complete_gate_failed_closed
  created_at: "2026-08-03"
  updated_at: "2026-08-04"
  inference_enabled: false

lineage:
  parent: exp413_scale5_likpf_full_replacement_on_exp335
  upstream_anchor_candidate: exp497_strict_public_core_fold_safe_ensemble_on_exp413
  correction_source: exp490_geometry_centered_mean_reverting_offset_hmm
  correction_parent: exp357_exp226_huber_emission_independent_audit
  steering: ../../.steering/20260803-exp506-exp490-mean-reversion-correction-blend-on-exp413
  negative_references:
    - exp494_exp413_cat_xgb_physics_bounded_stack
    - exp499_exp490_cross_fitted_well_application_selector
    - exp501_exp490_mean_reverting_hmm_fixed13_selector_on_exp264
    - exp502_exp501_fixed13_selector_replacement_on_exp413
    - exp500_exp490_mean_reversion_residual_likelihood_pf
    - exp503_exp490_strength_weakness_prefix_policy_readout
    - exp505_exp490_tau500_fade_fixed13_on_exp413
  diff_summary: >-
    Keep every saved source prediction and fold fixed. Isolate the novel
    correction d = exp490 - exp357 and add only lambda*d to the selected
    exp413-family final anchor. Fit lambda on the other four outer folds,
    apply it to the held fold, cap it to [0, 0.10], and prohibit intercepts,
    gates, fades, depth buckets, component grids, and same-OOF rescue.


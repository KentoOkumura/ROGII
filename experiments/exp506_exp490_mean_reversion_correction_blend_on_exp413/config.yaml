  output_contract: output_contract.md
  primary:
    id: selected_anchor_plus_exp490_minus_exp357_correction
    correction_formula: exp490_prediction_minus_exp357_parent_prediction
    prediction_formula: anchor_plus_lambda_times_correction
    intercept: false
    lambda_fit: closed_form_suffix_row_unweighted_sse
    lambda_bounds: [0.0, 0.10]
    deployment_lambda: median_of_five_meta_fold_lambdas
    selectable: true
  report_only_control:
    id: selected_anchor_exp490_small_convex_blend
    prediction_formula: anchor_plus_w_times_exp490_minus_anchor
    weight_fit: same_meta5_closed_form
    weight_bounds: [0.0, 0.10]
    selectable: false
    may_rescue_primary: false
  prohibited:
    - tau_or_alpha_fade
    - depth_or_scope_weight
    - row_or_well_gate
    - hard_or_conditional_router
    - intercept
    - negative_weight
    - three_way_stack
    - component_grid
    - same_oof_global_refit
    - public_lb_tuning


  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  meta_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  fold_source: exp413_saved_outer_fold
  fold_manifest_sha256: fa41084c5fcb4adffb88d44211b4cc5d2d2f46b5bd4d65828b6af941184b2a6d
  meta_fit_rows: other_four_outer_folds_only
  held_fold_truth_in_weight_fit_allowed: false
  full_oof_weight_refit_allowed: false
  leakage_policy:
    - Resolve and freeze the anchor before loading exp506 outcomes.
    - Load exp490 before prediction freeze through the exact six-column allowlist only.
    - Join globally by well and row_idx, verify suffix_offset, row role, and exp413 fold parity.
    - Never use the exp490 source fold as a feature or split source.
    - Freeze anchor, exp490, exp357, correction, key, and fold logical SHA before reading suffix truth.
    - Fit each scalar weight on the other four outer folds and apply it only to the held fold.
    - Freeze primary OOF, metrics, and decision before computing the report-only convex control.
    - Never use Public LB, public test identity, or submission values for selection.


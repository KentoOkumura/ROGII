model:
  name: frozen_exp417_likpf_scale5_x1p0_direct
  estimator: likelihood_weighted_particle_filter
  active_variants: [likpf_scale_5_x1p0]
  gr_scale:
    estimator: known_prefix_zero_fill_population_std
    clip: [10.0, 60.0]
    multiplier: 1.0
    post_multiplier_clip: null
  pf:
    particles: 500
    seeds: 128
    seed_indices: [0, 127]
    typewell_grid_step_ft: 0.2
    initial_position_spread_ft: 4.5
    initial_rate_spread: 0.01
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    rough_position: 0.1
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
    emission: capped_gaussian
    emission_clip_z2: 600.0
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
  aggregation:
    family: full_suffix_seed_loglik_softmax
    temperature: 5.0
    formula: exp((loglik-max(loglik))/5)_normalized_weighted_tvt_mean
    output_dtype: float32
  execution_count:
    scientific_variants: 1
    train_runs: 0
    model_configs: 0
    trained_folds: 0
    boosters: 0
    hmm_runs: 0
    beam_runs: 0
    parent_control_reruns: 0


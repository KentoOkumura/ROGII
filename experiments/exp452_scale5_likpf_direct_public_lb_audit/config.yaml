experiment:
  name: exp452_scale5_likpf_direct_public_lb_audit
  description: >-
    Design-frozen direct Public-LB audit of the exp417 likelihood-PF
    temperature-5 seed aggregation candidate. The exact exp404/exp413
    gs-x1.0 500-particle, 128-seed physical surface is exposed as a standalone
    submission without training, blending, selection, gating, or postprocess.
  hypothesis: >-
    The 0.680375810 ft pooled OOF improvement of fixed temperature-5 seed
    aggregation may transfer to Public LB even though the candidate failed
    preregistered by-well p95 and worst-well tail guards.
  route: pf_beam
  status: public_lb_8p797_complete_user_submitted_ref55149125_no_agent_submit
  created_at: "2026-07-30"
  updated_at: "2026-08-01"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  generator_source: exp413_scale5_likpf_full_replacement_on_exp335
  kernel_parent: exp072_exp063_full_replay_feature_cache
  public_lb_control: exp434_physics_candidate_public_lb_audit
  steering: ../../.steering/20260730-exp452-scale5-likpf-direct-public-lb-audit
  references:
    - exp404_scale5_sigma_gr_likelihood_pf_ablation
    - exp410_likpf_particle_resampling_basin_audit
    - exp413_scale5_likpf_full_replacement_on_exp335
    - exp417_scale5_seed_aggregation_promotion_audit
    - exp434_physics_candidate_public_lb_audit
    - docs/06_reproducibility.md
  diff_summary: >-
    Do not create or tune a new physical model. Reuse exactly the frozen
    likpf_scale_5_x1p0 semantics from exp417 and the hidden-compatible raw-test
    generator from exp413 v4, then expose that one primitive directly as
    submission tvt. No arithmetic-mean control, alternative temperature,
    blend, selector, gate, model, or postprocess is executed.


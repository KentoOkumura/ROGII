validation:
  strategy: frozen_train_side_candidate_to_direct_public_lb_audit
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  public_lb_display_precision: 3
  no_new_train_side_scoring: true
  train_side_evidence:
    control_id: likpf_mean_x1p0
    control_rmse: 11.59489788373621
    candidate_id: likpf_scale_5_x1p0
    candidate_rmse: 10.914522073423171
    improvement_ft: 0.6803758103130395
    improved_folds: 5
    total_folds: 5
    by_well_delta_p95_ft: 2.9416884826255085
    worst_well_delta_ft: 25.311274575082955
    improved_wells: 516
    regressed_wells: 257
  public_lb_audit:
    candidate_id: likpf_scale_5_x1p0
    parent_control_id: exp434_sha256_seed_likpf_mean
    exclude_control_submission_ref: 53706005
    exclude_control_reason: exp069_uses_different_blake2b_per_well_monte_carlo_realization
    order_within_three_candidate_backlog: 1
    descriptive_only: true
    lower_is_better: true
    tie_policy: displayed_three_decimal_tie_is_inconclusive
    forbid_adaptation_after_any_lb: true
  leakage_policy:
    - Raw-test generation may read complete horizontal GR but never suffix TVT, error, fold, hidden-like role, or Public LB.
    - Type Well TVT is a permitted reference-curve coordinate.
    - Candidate identity, schema, and logical content SHA are frozen before submission construction.
    - Public LB cannot change temperature, seed, particle, sigma, dynamics, aggregation, gate, or candidate formula.


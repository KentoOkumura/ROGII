validation:
  strategy: conditional_fixed16_gr_pairwise_loop_closed_rgt_stage0
  metric: target_free_graph_and_prefix_rolling_origin_gates
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  fixed16_target_wells: 16
  fixed16_selection:
    source: exp386_cycle_consistent_rgt_scenario_bank
    policy: round_robin_fold_then_sorted_well_id_then_offset
    must_match_exp386: true
    posthoc_reselection: forbidden
  control:
    experiment: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    regenerate: false
    cv_rmse_ft: 9.427109596582213
    public_lb: 9.837
    oof_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
  leakage_policy:
    - The exp405 decision manifest must prove a technically valid scientific FAIL before any exp406 implementation or run.
    - Outer-valid target wells are absent from donor TVT truth, donor geometry, fitted edge templates, and graph source controls.
    - Target pre-freeze columns are limited to well_id, row_idx, MD, X, Y, Z, GR, and TVT_input.
    - Target suffix TVT, error, oracle, six Formation columns, and hidden-like roles are unread before edge, graph, cycle, and gauge SHA freeze.
    - Prefix rolling-origin truth is attached only after target-free Stage-0 artifacts are frozen.
    - The approved exp226 prefix control may read outer-train ANCC only after the target-free graph freeze and only to rebuild the original K16 geometry donor field/Kappa for fixed16 pseudo-cuts; target ANCC remains unread.
    - No visible sample-test well may select a donor, edge, window, shift, score, solver, or gate setting.


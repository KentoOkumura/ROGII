    scope: fixed16_pseudo_cut_only
    source_contract: exp226_original_outer_fold_k16_geometry_and_adaptive_kappa
    official_oof_regenerated: false
    gr_correction: false
    u_projection: false
    outer_train_ancc_read_timing: after_target_free_graph_freeze_only
    k16_params:
      theta0: 118.4
      k_segments: 16
      local_linear_k: 50
      local_linear_bandwidth: 500.0
      local_linear_ridge: 1.0
      smooth_rho: 10.0
      gate: 0.35
      field_min_proj: 0.3
      kbins: [0.0, 750.0, 1500.0, 2500.0, 4000.0, 1.0e18]
      kappa_regimes: [0.0, 1000.0, 1500.0, 2000.0]
      rot_max_deg: 60.0
      ancc_theta_bandwidth: 1500.0
  prediction_scope: heldout_prefix_rows_only
  persist_unknown_suffix_prediction: false


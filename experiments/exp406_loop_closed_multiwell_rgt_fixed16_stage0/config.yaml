pairwise_gr:
  coordinate_family: candidate_centered_local_tvt_correspondence
  target_geometry_center: exp226_k16
  block_rows: 256
  stride_rows: 128
  include_final_short_block: true
  minimum_finite_pairs: 64
  minimum_pair_fraction: 0.50
  shift_grid_ft:
    minimum: -55.0
    maximum: 55.0
    step: 5.0
    expected_states: 23
  donor_pool:
    outer_train_only: true
    maximum_unique_wells: 12
    priority:
      - same_typewell_family_then_xy_distance
      - xy_distance
    stable_order: [same_typewell_rank, xy_distance, donor_well_id]
    target_self_donor: forbidden
    same_reporting_fold_valid_donor: forbidden
  morphology:
    standardization: separate_block_median_1p4826mad
    scale_clip: [5.0, 60.0]
    components:
      raw: {window_rows: 1, weight: 0.50}
      rolling_21: {window_rows: 21, weight: 0.25}
      rolling_101: {window_rows: 101, weight: 0.25}
    score: weighted_pearson_ncc
    score_tie_order: [score_desc, finite_pairs_desc, donor_well_id, shift_ft]
  edge_selection:
    minimum_ncc: 0.20
    maximum_edges_per_target_block: 4
    retain_rejection_funnel: true
    rejection_reasons:
      - insufficient_finite_pairs
      - insufficient_pair_fraction
      - nonfinite_ncc
      - ncc_below_minimum
      - donor_fold_leakage
      - nonfinite_relative_offset
      - nonpositive_local_tvt_progress
  circular_control:
    kind: stable_within_donor_block_finite_gr_circular_rotation_preserve_nan_mask
    seed_key: SHA256_exp406_circular_well_block
    minimum_rotation_fraction: 0.25

loop_closure:
  edge_measurement: relative_tvt_offset_ft
  model: edge_offset_ij_equals_gauge_j_minus_gauge_i
  cycle_basis: deterministic_fundamental_cycle_basis
  component_anchor:
    donor: minimum_donor_well_id_true_tvt_gauge
    target: visible_prefix_last_finite_tvt_input
  solver: deterministic_sparse_huber_irls
  huber_delta_ft: 5.0
  iterations: 10
  ridge: 1.0e-9
  convergence_used_for_early_stop: false
  stable_node_order: [fold, well_id, block_id]
  stable_edge_order: [fold, source_well_id, target_well_id, source_block_id, target_block_id]
  stable_cycle_order: [fold, component_min_well_id, non_tree_edge_key]
  outputs:
    - raw_cycle_residual_ft
    - solved_cycle_residual_ft
    - component_id
    - connected_target
    - finite_gauge
    - edge_rejection_funnel
  unknown_suffix_prediction: forbidden

prefix_rolling_origin:
  enabled_after_target_free_stage0_technical_pass: true
  heldout_prefix_rows: 512
  minimum_original_prefix_rows: 1024
  target_graph_uses_heldout_rows:

experiment:
  name: exp406_loop_closed_multiwell_rgt_fixed16_stage0
  description: >-
    Conditionally design-frozen fixed16 Stage-0 experiment for a GR-first,
    loop-closed multi-well relative-geologic-time graph. It may be implemented
    only after a technically valid exp405 scientific failure.
  hypothesis: >-
    Pairwise horizontal-GR correspondences, solved jointly under explicit loop
    closure and prefix gauge anchors, can provide non-degenerate target-well RGT
    support where the exp386 formation-derived graph produced zero valid paths.
  route: pf_beam
  status: fixed16_stage0_v1_technical_fail_closed
  created_at: "2026-07-26"
  updated_at: "2026-07-26"
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp405_geometry_reinjected_interval_semimarkov_fusion
  scientific_family: conditional_independent_gr_first_loop_closed_rgt_family
  unlock_dependency: exp405_geometry_reinjected_interval_semimarkov_fusion
  reporting_fold_source: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  fixed16_selector_reference: exp386_cycle_consistent_rgt_scenario_bank
  negative_references:
    - exp386_cycle_consistent_rgt_scenario_bank
    - exp230_dtw_hmm_emission
  steering: ../../docs/legacy/steering/20260726-exp406-loop-closed-multiwell-rgt-fixed16-stage0
  references:
    - docs/06_reproducibility.md
    - experiments/exp405_geometry_reinjected_interval_semimarkov_fusion/config.yaml
  diff_summary: >-
    Replace exp386's formation-derived RGT nodes and k-shortest route enumeration
    with horizontal-GR pairwise block correspondences and a global TVT-ft loop
    closure solve. Reuse only its deterministic fixed16 selection policy for a
    fair preflight comparison. Stage 0 emits graph diagnostics and prefix
    rolling-origin evidence but no unknown-suffix path or prediction.


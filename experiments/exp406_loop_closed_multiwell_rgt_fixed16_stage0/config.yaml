notes:
  - This experiment is a conditional independent GR-first topology family, not an exp386 rescue run.
  - The compact self-contained Jupytext train implementation was adopted as the canonical train notebook after explicit execution approval; the fail-closed inference notebook remains unadopted.
  - The approved exp226 replay rebuilds donor field and Kappa only for fixed16 pseudo-cut geometry controls after graph freeze; it does not regenerate official OOF or run GR/U prediction.
  - Stage 0 PASS is only evidence to design full-OOF Stage 1; it is not a current-test promotion.
  - Version 1 failed graph-query coverage, finite row coverage, and projected runtime gates; the branch is closed without parameter rescue and all run authorization is disabled.

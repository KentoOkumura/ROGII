experiment:
  name: exp497_strict_public_core_fold_safe_ensemble_on_exp413
  description: >-
    Build a strict fold-safe OOF trajectory from the generalizable public
    SP45/physical-selector/projection/independent-learned structure after
    removing Public-LB-specific overlays, then combine it with the frozen
    exp413 OOF using a meta-fold constant convex blend.
  route: ensemble
  status: saved_model_inference_kaggle_v2_complete_validated_gate_fail_preserved
  created_at: "2026-08-01"
  updated_at: "2026-08-04"
  inference_enabled: true

overrides:
  project_defaults:
    - validation.strategy
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp413_scale5_likpf_full_replacement_on_exp335
  public_source_slug: raunakdey07/rogii-stacked-ensemble
  public_source_id_no: 128237178
  public_source_sha256: 88c7b99e234fdbd5620c0045df294d9167eac84e56f538ceb3f2449a677a5454
  public_source_port_reference: exp082_public_artifact_replay_followup
  ensemble_negative_reference: exp494_exp413_cat_xgb_physics_bounded_stack
  steering: ../../docs/legacy/steering/20260801-exp497-strict-public-core-fold-safe-ensemble-on-exp413
  diff_summary: >-
    Keep the public pipeline's physical candidate family, well-shape selector
    concept, residual ML branch, robust U projection, independent learned
    trajectory, warmup, and trajectory smoothing. Refit selector thresholds,
    mappings, and internal constant weights only inside outer-train/inner OOF.
    Exclude public well IDs, fixed branch shifts, Q0522, A27, same-well contact,
    visible-prefix routing, bimodal public hedge, model-package correction,
    precomputed submissions, and public-output copies. Keep exp413 frozen until
    an OOF-level constant blend with a maximum public-core weight of 0.30.


validation:
  strategy: exp413_outer5_groupkfold_strict_public_core_nested_inner4_then_meta5_constant_blend
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  meta_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  fold_source: exp413_saved_outer_fold
  parent_oof_source: exp413_saved_final_tvt_oof
  leakage_policy:
    - Keep all outer-valid wells out of model fit, early stopping, Ridge meta fit, selector fit, internal weight fit, and spatial imputer pools.
    - Build outer-train model meta inputs from inner OOF predictions only.
    - Build outer-valid model meta inputs from the four inner-model ensemble only.
    - Freeze target-free physical and learned feature surfaces before reading outer-valid truth or errors.
    - Do not use exp413 final370, selector scores, signed scores, or predictions inside the public-core branch.
    - Join exp413 only after strict_public_core_oof is frozen.
    - Fit final constant blend weights on the other four OOF folds and apply to the held meta fold.
    - Never use Public LB, public well IDs, public row counts, public output values, or submission SHA for selection.


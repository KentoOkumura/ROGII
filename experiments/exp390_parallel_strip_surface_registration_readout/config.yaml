      eligible_rows_rmse_gain_vs_exp226_ft_min: 0.50
      distance_1000_plus_rmse_gain_ft_min: 0.25
      near_0_250_regression_tolerance_ft: 0.05
      hidden_like_spatial_regression_tolerance_ft: 0.0
      hidden_like_typewell_purged_regression_tolerance_ft: 0.0
    promotion_safety:
      improved_or_equal_wells_gte_worse_wells: true
      by_well_delta_p95_max_ft: 0.0
      worst_well_delta_max_ft: 0.25
    report_only_oracle_blocks_rows: [1, 128, 256, 512, -1]
    persist_oracle_prediction: false
    persist_truth_derived_selector: false
    fail_action: close_without_threshold_bandwidth_calibration_fallback_blend_or_selector_rescue


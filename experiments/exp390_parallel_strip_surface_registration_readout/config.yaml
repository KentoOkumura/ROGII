experiment:
  name: exp390_parallel_strip_surface_registration_readout
  description: >-
    Register nearly parallel horizontal wells into a query-centric along-track
    and cross-track strip coordinate, interpolate outer-train S=TVT+Z at the
    same along-track position with a two-sided robust cross-track fit, and audit
    one exp226-fallback physical candidate without target GR or Formation.
  route: pf_beam
  status: stage0_failed_closed_sparse_two_sided_support
  created_at: "2026-07-24"
  updated_at: "2026-07-24"
  inference_enabled: false

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  comparison_references:
    - exp114_spatial_neighbor_prior_signal_audit
    - exp119_same_typewell_other_horizontal_prefix_gr_transfer_audit
    - exp201_typewell_spatial_tvt_error_readout
    - exp273_two_dimensional_formation_gradient_transition
    - exp383_all_tvt_stratigraphic_vector_drift_field
  execution_order:
    after_result_review:
      - exp383_all_tvt_stratigraphic_vector_drift_field
  diff_summary: >-
    Keep the exp226 outer-five-fold identity, saved OOF control, score rows, and
    fallback prediction fixed. Replace well-level XY neighbors and generic 2D
    vector interpolation with an explicit query-centric strip coordinate:
    match outer-train donor surfaces at the same along-track coordinate, fit
    S=a(s)+b(s)n only with two-sided support, calibrate one vertical gauge from
    the known target prefix, and use the strip path only where all preregistered
    support checks pass. No GR, target Formation, residual copying, model,
    selector, soft blend, inference, or submission is included.

validation:
  strategy: exp226_outer5_groupfold_parallel_strip_truth_late_readout
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  control:
    experiment: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    candidate: v6_k16_geometry_gr_u_projection
    regenerate: false
    cv_rmse_ft: 9.427109596582213
    public_lb: 9.837
    oof_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
  report_scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  distance_buckets_ft: [0, 50, 100, 250, 500, 1000]
  leakage_policy:
    - Outer-valid wells are absent from donor geometry, donor surfaces, pair eligibility, strip fits, and threshold estimation.
    - Target suffix TVT, target raw Formation columns, and target GR are unread before strip predictions and their logical SHA are frozen.
    - Target TVT_input is used only for one prefix vertical-gauge intercept and rolling-origin diagnostics.
    - Donor S=TVT+Z comes only from outer-train wells in the active fold.
    - Visible three-well sample-test behavior cannot select any pair, support, fit, calibration, smoothing, fallback, or gate setting.
    - Truth-derived row, block, or well oracle results are diagnostic only and cannot produce a persisted selector or prediction.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  target_column: TVT
  visible_prefix_column: TVT_input
  coordinate_columns: [MD, X, Y, Z]
  structural_surface_formula: S=TVT+Z
  donor_allowed_columns: [well_id, row_idx, MD, X, Y, Z, TVT]
  target_allowed_pre_freeze_columns: [well_id, row_idx, MD, X, Y, Z, TVT_input]
  target_forbidden_pre_freeze_columns:
    - TVT
    - GR
    - ANCC
    - ASTNU
    - ASTNL
    - EGFDU
    - EGFDL
    - BUDA
  parent_exp226:

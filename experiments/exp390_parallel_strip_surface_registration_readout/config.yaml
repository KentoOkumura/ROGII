    expected_wells: 773
    expected_outer_fold_runs: 5
    finite_fallback_prediction_coverage_min: 1.0
    two_sided_strip_row_coverage_min: 0.50
    two_sided_strip_well_coverage_min: 0.75
    eligible_node_unique_donor_p05_min: 4

    candidates:
      - /kaggle/input/notebooks/kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts
      - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts
      - experiments/exp115_hidden_like_spatial_holdout_from_ppt/artifacts

model:
  name: deterministic_parallel_strip_surface_registration_readout
  fitted_model: false
  estimator: deterministic_query_centric_strip_registration_and_robust_cross_track_fit

strip_coordinate:
  query_axis:
    estimator: pca_first_component_on_full_query_xy
    axial_angle_modulo_pi: true
    canonical_sign: largest_absolute_component_positive
    normal_formula: "e_n=(-e_sy,e_sx)"
  pair_eligibility:
    axial_angle_mismatch_deg_max: 5.0
    projected_along_track_overlap_min: 0.80
    median_abs_cross_track_distance_ft_max: 2000.0
    projected_s_monotone_step_fraction_min: 0.99
    self_donor_exclusion: true
    maximum_unique_donor_wells: 16
    minimum_unique_donor_wells: 4
    minimum_positive_side_wells: 1
    minimum_negative_side_wells: 1
    stable_order: [median_abs_cross_track_distance, donor_well_id]
  query_nodes:
    grid_md_ft: 64
    donor_interpolation_coordinate: projected_global_s
    donor_interpolation: linear_inside_observed_range_only
    donor_range_extrapolation: forbidden
  surface_fit:
    response: donor_S_equals_TVT_plus_Z_at_query_s
    formula: S_equals_a_plus_b_times_n
    cross_track_bandwidth_ft: 1000.0
    weight_formula: exp_negative_n_squared_over_two_bandwidth_squared
    robust_loss: huber
    huber_delta: 1.345
    irls_iterations: 5
    slope_ridge_trace_ratio: 1.0e-6
    donor_stable_order: [absolute_n, donor_well_id]
    along_track_smoothing: centered_node_median
    along_track_smoothing_nodes: 5
    edge_smoothing: available_nodes_only
  prefix_calibration:
    response: TVT_input_plus_Z_minus_S_strip
    estimator: deterministic_huber_intercept
    huber_delta: 1.345
    iterations: 5
    minimum_finite_prefix_rows: 64
    fitted_terms: [vertical_gauge_intercept]
    forbidden_terms: [slope, scale, warp, rowwise_offset]
  candidate:
    name: parallel_strip_two_sided_fallback_exp226
    valid_row_prediction: calibrated_S_strip_minus_Z
    invalid_row_prediction: exact_saved_exp226_oof
    one_sided_prediction: forbidden
    soft_blend: false
    clipping: false
    candidate_mean: false


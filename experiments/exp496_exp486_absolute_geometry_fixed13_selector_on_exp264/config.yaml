experiment:
  name: exp496_exp486_absolute_geometry_fixed13_selector_on_exp264
  description: >-
    Add the saved exp486 absolute-geometry likelihood-PF prediction as the
    thirteenth candidate to the corrected exp264 fixed12 dual selector. The
    existing candidates, fixed fallback, objectives, folds, and model settings
    remain unchanged. The compact Stage A/C implementation and contract tests
    are complete; the fixed Stage A/C Kaggle CPU run is approved.
  route: ensemble
  status: completed_train_side_rejected_no_submit
  created_at: "2026-07-31"
  updated_at: "2026-07-31"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_parent: exp486_exp226_geometry_residual_likelihood_pf
  fixed_bank_source: exp263_last_anchor_better_candidate_confidence_pair_cache
  implementation_reference: exp392_exp389_fixed13_dual_selector_on_exp264
  steering: ../../.steering/20260731-exp496-exp486-absolute-geometry-fixed13-selector-on-exp264
  diff_summary: >-
    Change only the primary candidate inventory from corrected exp264 fixed12
    to fixed12 plus exp486_absolute_geometry_likpf. Add the saved exp486
    absolute-geometry prediction and five target-free mechanism confidence
    fields after global key join. Keep the residual variant, exp486 HMM blend,
    new pair formulas, and the seven-candidate fixed fallback out of scope.
    Do not change objectives, folds, sampling, LightGBM parameters, thresholds,
    downstream TVT, inference, or submission.

implementation:
  approved: true
  approval_source: user_message_implement_exp496
  code_created: true
  contracts_created: true
  canonical_notebooks_are_placeholders: false
  canonical_train_notebook_adopted: true
  canonical_inference_notebook_is_placeholder: true
  compact_train_candidate: exp496_exp486_absolute_geometry_fixed13_selector_on_exp264_compact_selfcontained_train.py
  compact_train_notebook_candidate: exp496_exp486_absolute_geometry_fixed13_selector_on_exp264_compact_selfcontained_train.ipynb
  compact_inference_guard_candidate: exp496_exp486_absolute_geometry_fixed13_selector_on_exp264_compact_selfcontained_inference.py
  compact_inference_guard_notebook_candidate: exp496_exp486_absolute_geometry_fixed13_selector_on_exp264_compact_selfcontained_inference.ipynb
  dedicated_test: ../../tests/test_exp496_exp486_absolute_geometry_fixed13_selector.py
  kaggle_package_created: true
  kaggle_run_approved: true
  inference_implemented: false
  submission_implemented: false

validation:
  strategy: outer5_groupkfold_fixed13_selector_then_inner4_nested_stacking
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_score_candidates: 13
  expected_primary_candidates: 12
  expected_fixed_fallback_candidates: 7
  fold_source: exp263_selector_outer_fold_after_global_exp486_key_join
  leakage_policy:
    - Read exp486 candidate and mechanism data through the frozen allowlists only.
    - Do not read exp486 truth, error, residual prediction, control, role, scope, by-well, or gate fields before feature freeze.
    - Audit the upstream exp226 group-safe OOF contract, but never use its fold ID as a selector feature.
    - Globally join exp486 by well_id,row_idx and repartition by the exp263 selector outer fold.
    - Exclude outer-valid wells from inner assignment, fit, and early stopping.
    - Build outer-train compact rows from inner OOF scores only.
    - Build outer-valid compact rows from the four inner-model ensemble only.
    - Read parent exp264 scores only after all fixed13 selector scores and choices freeze.
    - Compute add-one oracle and incumbent-reranking readouts post-freeze and diagnostic-only.


experiment:
  name: exp243_pf_seed_medoids
  description: >
    Replays the deterministic exp072 likelihood-PF seed bank, clusters all 128
    seed trajectories with target-free weighted trajectory distance, and retains
    real seed medoids as diverse candidate paths for train-side audit.
  route: pf_beam
  status: completed_v3_exact_parity_candidate_bank_supported_direct_replacement_rejected
  created_at: "2026-07-13"
  updated_at: "2026-07-14"

overrides:
  project_defaults:
    - validation.n_folds

lineage:
  parent: exp072_exp063_full_replay_feature_cache
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp214_public_raw_gr_residual_scale_control
    - exp232_adaptive_robust_likelihood_pf
    - exp233_adaptive_outlier_mixture_likelihood_pf
    - exp237_hmm_exp226_candidate_selector_on_exp183
    - exp241_adaptive_likelihood_pf_trajectory_containment_audit
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md pf_seed_medoids
  implementation_source: pf_seed_medoids.py
  diff_summary: >
    Keeps the exp072 raw-GR Gaussian observation likelihood, transition,
    particles, resampling, and stable per-well seed contract fixed. Instead of
    collapsing 128 seed trajectories immediately to likpf_mean, it applies
    deterministic BUILD+PAM K-medoids for fixed K=3/5/8 using weighted
    trajectory RMSE (first half 1.0, second half 1.5) and persists the real
    medoid trajectories plus cluster diagnostics. No selector is trained.

validation:
  strategy: full_train_exp072_pseudotail_seed_trajectory_candidate_audit
  metric: rmse
  secondary_metrics:
    - row_oracle_rmse
    - block_128_oracle_rmse
    - block_256_oracle_rmse
    - block_512_oracle_rmse
    - whole_well_oracle_rmse
    - unique_best_rate
    - cluster_mass
    - normalized_cluster_entropy
    - rmse_1000_plus
    - hidden_like_rmse
    - worst_well_regression
  seed: 42
  n_folds: 0
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - PF replay uses raw evaluation GR, raw typewell GR, and observed prefix only.
    - Trajectory distance, PAM initialization, K, medoid choice, cluster order, and candidate generation never use true TVT, target, error, oracle, or Public LB.
    - True TVT is used only after all candidate paths are frozen, for diagnostic RMSE and oracle readouts.
    - K is predeclared as 3/5/8 and is not selected using target-side metrics.
    - Raw-test regeneration, selector training, inference, and submission are disabled.


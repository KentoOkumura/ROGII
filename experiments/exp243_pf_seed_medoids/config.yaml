model:
  name: exp072_seed_trajectory_kmedoids_audit
  estimator: none_pfbeam_candidate_generation_audit
  target: exp072_target_for_post_generation_scoring_only
  validation_surface:
    selection_mode: all_eligible_wells
    max_target_wells: null
    well_include: []
    min_known_prefix_rows: 160
    min_eval_rows: 64
  replay:
    split_key: train
    replay_count: 1
    observation_likelihood: raw_gr_gaussian_exp072
    transition: classic_exp072_surface_state
    seed_aggregation_fallback: mean
  runtime:
    particles: 500
    seed_count: 128
    resample_threshold: 0.5
    init_spread: 4.5
    momentum: 0.998
    velocity_noise: 0.002
    position_noise: 0.005
    resample_pos_noise: 0.10
    resample_velocity_noise: 0.001
    grid_step: 0.2
    gr_sigma_min: 10.0
    gr_sigma_max: 60.0
    gr_sigma_default: 30.0
  clustering:
    algorithm: deterministic_build_pam
    k_values: [3, 5, 8]
    likelihood_mass_temperature: 5.0
    candidate_order: descending_seed_mass_then_likelihood_mass_then_seed_index
    distance:
      name: tail_half_weighted_trajectory_rmse
      tail_half_start_fraction: 0.5
      first_half_weight: 1.0
      second_half_weight: 1.5

comparison:
  baseline_candidate: pf_base_likpf_mean
  exp237_base8_candidates:
    - pf_base_pf_ancc
    - pf_base_beam_mean
    - pf_base_likpf_mean
    - pf_base_sc_ens
    - pf_base_hyb
    - pf_base_tvt_dense
    - pf_base_tvt_densew
    - pf_base_tvt_dense50
  hidden_like:
    enabled: true
    fold_assignment_candidates:
      - /kaggle/input/notebooks/kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
      - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
      - experiments/exp115_hidden_like_spatial_holdout_from_ppt/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    valid_role_columns:
      verification_like_spatial: verification_like_spatial_role
      verification_like_typewell_purged: verification_like_typewell_purged_role

audit:
  mode: target_free_pf_seed_trajectory_medoid_candidate_audit
  output_prefix: exp243_pf_seed_medoids
  primary_baseline: pf_base_likpf_mean
  oracle_block_rows: [128, 256, 512]
  path_jump_threshold_ft: 8.0
  max_rows: null
  close_if:
    - medoid gains exist only for row oracle and disappear at block or whole-well scope
    - clusters are near-duplicate trajectories with negligible between-medoid distance
    - useful clusters are singleton Monte Carlo noise without stable mass
    - exp237 base8 union has no material block or whole-well oracle improvement
  expected_train_artifacts:
    - exp243_pf_seed_medoids_candidate_metrics.csv
    - exp243_pf_seed_medoids_distance_bucket_metrics.csv
    - exp243_pf_seed_medoids_hidden_like_metrics.csv
    - exp243_pf_seed_medoids_by_well.csv
    - exp243_pf_seed_medoids_oracle_scope_metrics.csv
    - exp243_pf_seed_medoids_unique_best.csv
    - exp243_pf_seed_medoids_cluster_manifest.csv.gz
    - exp243_pf_seed_medoids_cluster_summary.csv
    - exp243_pf_seed_medoids_pf_diagnostics.csv
    - exp243_pf_seed_medoids_row_candidates.csv.gz
    - exp243_pf_seed_medoids_target_wells.csv
    - exp243_pf_seed_medoids_well_status.csv
    - exp243_pf_seed_medoids_summary.json

execution:
  parity_probe: false
  active_variant_count: 1
  pf_replay_count: 1
  kmedoids_postprocess_count: 3
  lightgbm_config_count: 0
  fold_count: 0
  total_boosters: 0
  control_or_parent_retraining: false
  well_shard_count: 1
  active_well_shard_index: 0
  shard_policy: single_notebook_all_eligible_wells
  progress_every_wells: 8
  kaggle_push_requires_user_decision: false

runtime:
  use_amp: false
  num_workers: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train
      - kentookumura/exp209-joint-exact-parity-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: exp072_sha256_modulo_plus_one_then_seed_index_numba_single_worker
  pf_input_grid_trajectory_dtype_until_replay_mean_and_kmedoids: float64
  persisted_candidate_dtype: float32
  stochastic_components:
    - likelihood_pf_particle_initialization
    - likelihood_pf_particle_propagation
    - likelihood_pf_conditional_resampling
  parallel_rng_policy: no_thread_parallel_rng_numba_single_worker
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - All 128 seed trajectories are transient per well; only medoids and cluster membership summaries are persisted.
    - Exact replay parity against saved exp072 likpf_mean is measured, not assumed.

inference:
  mode: disabled_diagnostic_only
  selected_candidate: null
  notes:
    - No raw-test regeneration, selector, inference, or submission is generated.

notes:
  - One PF replay per well; K=3/5/8 are deterministic postprocessing views of the same 128 trajectories.
  - No LightGBM, folds, boosters, GPU, control retraining, K tuning, selector, or submission.
  - The corrected v3 full rerun is explicitly approved as one CPU notebook covering all 773 eligible wells.

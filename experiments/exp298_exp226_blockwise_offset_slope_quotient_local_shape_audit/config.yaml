experiment:
  name: exp298_exp226_blockwise_offset_slope_quotient_local_shape_audit
  description: >-
    Audits whether the exp226 pre-U path captures local TVT shape better than the
    fixed exp293 deployable12 bank after diagnostic-only blockwise offset and
    affine trend quotienting at H128/H256/H512.
  route: pf_beam
  status: kaggle_cpu_v2_completed_scientific_guard_failed_branch_closed
  created_at: "2026-07-20"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  references:
    - exp263_last_anchor_better_candidate_confidence_pair_cache
    - exp293_physics_only_candidate_bank_headroom_contract
    - exp280_exp226_shift_likelihood_separability_readout
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp285_exp226_prefix_masked_offset_predictability_readout
    - exp297_prefix_calibrated_latent_registration_gr_evidence
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md exp226_blockwise_offset_slope_quotient_local_shape_audit
  design_source: .steering/20260720-exp298-exp226-blockwise-offset-slope-quotient-local-shape-audit
  downstream_contract: downstream_branch_contract.md
  diff_summary: >-
    Adds no candidate generation, correction, selector, or model. It reads the
    saved exp226 tvt_geop/gr_delta/tvt_pred components and the frozen exp293
    deployable12 paths, freezes row identity and block assignment without truth,
    then uses true suffix TVT only to compute diagnostic offset- and affine-
    quotiented local-shape metrics. Late-phase-specific logic is out of scope.

hypothesis: >-
  The exp226 pre-U path has top-tier H256/H512 local TVT shape after quotienting
  diagnostic-only block offset and slope, even when its absolute TVT RMSE is not
  competitive because of global trend error.

validation:
  strategy: fixed_component_blockwise_offset_slope_quotient_readout
  metric: pooled_h256_h512_blockwise_affine_quotient_rmse
  seed: 42
  n_folds: 5
  trained_folds: 0
  group_column: well
  fold_policy: reuse_exp263_exp293_outer_fold_identity_without_refit
  expected_rows: 3783989
  expected_wells: 773
  score_rows: train_prediction_suffix_rows
  primary_component: exp226_pre_u
  primary_horizons_rows: [256, 512]
  secondary_horizons_rows: [128]
  diagnostic_whole_well: true
  rank_reference_bank: exp293_stage1_deployable12
  primary_anchor_candidate: exp226_w500_50_50
  exp226_final_candidate_alias: exp226_k16
  pass_requires_all:
    maximum_pooled_affine_quotient_rank_h256: 3
    maximum_pooled_affine_quotient_rank_h512: 3
    require_rank1_at_one_primary_horizon: true
    minimum_folds_with_rank_at_most3_each_primary_horizon: 4
    require_pre_u_nonworse_than_post_u_each_primary_horizon: true
    maximum_h512_rank_distance_1000_plus: 3
    maximum_h512_rank_hidden_like_spatial: 3
    maximum_h512_rank_hidden_like_typewell_purged: 3
    minimum_unique_best_block_fraction_at_one_primary_horizon: 0.05
  decision:
    pass: enable_only_the_fixed_stage2_hybrid_bank_design_in_downstream_branch_contract
    fail: close_this_local_global_decomposition_branch_without_rescue_grid
  leakage_policy:
    - Candidate/component phase reads only allowlisted identity, fold, well, row, MD context, tvt_geop, gr_delta, tvt_pred, and fixed candidate TVT columns.
    - The exp226 OOF source may physically contain tvt_true, but the pre-freeze loader must use an explicit allowlist and must not materialize any truth or error column.
    - Candidate/component values, aliases, row identity, fold identity, block assignment, tie order, horizons, scopes, and thresholds are content-frozen before true TVT is loaded.
    - True TVT is loaded through a separate post-freeze raw-train loader and is used only for readout metrics.
    - Oracle offset and affine coefficients are diagnostic nuisances; they are never persisted as prediction columns or used to generate, tune, blend, rank, or correct a deployable path.
    - No target-derived row, block, well, or scope is used as an inference feature.


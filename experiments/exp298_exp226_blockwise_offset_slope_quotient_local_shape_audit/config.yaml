audit:
  name: blockwise_offset_slope_quotient_local_shape
  output_prefix: exp298_exp226_blockwise_offset_slope_quotient_local_shape_audit
  candidate_phase_dtype: float64
  work_chunk_rows: 100000
  fixed_sort_order: [fold, well_id, row_index]
  block_partition:
    source: exp293_frozen_block_assignment
    origin: first_prediction_suffix_row_per_well
    kind: non_overlapping_rows
    horizons_rows: [128, 256, 512]
    include_final_short_block: true
    no_new_boundary_policy: true
    affine_eligibility:
      minimum_selected_rows: 2
      singleton_policy: exclude_from_affine_metric_rank_win_and_unique_best_denominators
      preserve_exp293_block_id_boundary_and_sha: true
      require_singleton_counts_in_outputs: true
      candidate_independent_exclusion: true
  quotient:
    error_definition: true_tvt_minus_candidate_tvt
    row_coordinate: normalized_minus1_to_plus1_within_each_block
    offset_only: residual_minus_block_mean_residual
    affine: residual_minus_ols_intercept_and_linear_row_slope
    degenerate_block_policy: >-
      Reuse exp293 blocks. A selected block with one row is ineligible for the
      affine metric and is excluded identically for every candidate while its
      block/row/well count is reported. Every block with at least two selected
      rows must have a valid affine metric; otherwise fail the technical contract.
    technical_coverage_denominator: affine_eligible_rows_only
    minimum_affine_eligible_rows_per_block: 2
    singleton_changes_block_assignment: false
    persist_coefficients: false
    persist_corrected_prediction: false
    scope_policy:
      fold: select_complete_exp293_blocks_by_evaluation_fold
      hidden_like: select_complete_exp293_blocks_by_well_role
      distance_1000_plus: >-
        Keep exp293 block IDs fixed, select rows with md_since >= 1000, and
        refit only the diagnostic nuisance intercept/slope on those selected
        rows, matching the exp293 subgroup aggregation convention.
  metrics:
    primary:
      - pooled_affine_quotient_rmse_h256
      - pooled_affine_quotient_rmse_h512
      - pooled_candidate_rank_h256
      - pooled_candidate_rank_h512
      - fold_candidate_rank_h256
      - fold_candidate_rank_h512
      - unique_best_block_fraction_h256
      - unique_best_block_fraction_h512
    secondary:
      - offset_only_quotient_rmse_h128_h256_h512
      - affine_quotient_rmse_h128_and_whole_well
      - first_difference_error_rmse_within_block
      - second_difference_error_rmse_within_block
      - block_win_fraction
      - by_well_rmse_p50_p95_worst
      - distance_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
  tie_policy:
    squared_error_atol: 0.000000001
    candidate_order: exp293_order_then_exp226_pre_u
    diagnostic_component_order: [exp226_geop, exp226_pre_u, exp226_post_u]
    diagnostic_components_excluded_from_rank_except_pre_u: true
    unique_best_requires_no_tie: true
  expected_artifacts_if_implemented:
    - exp298_local_shape_input_manifest.csv
    - exp298_local_shape_component_manifest.json
    - exp298_local_shape_freeze_manifest.json
    - exp298_local_shape_pooled_metrics.csv
    - exp298_local_shape_fold_metrics.csv
    - exp298_local_shape_scope_metrics.csv
    - exp298_local_shape_block_metrics.csv.gz
    - exp298_local_shape_by_well.csv
    - exp298_local_shape_summary.json
    - exp298_local_shape_sha_manifest.csv
  forbidden_actions:
    - persist_oracle_offset_or_slope_corrected_prediction
    - use_oracle_coefficient_as_feature_or_candidate
    - add_remove_or_reweight_exp293_candidate
    - choose_component_from_post_freeze_truth
    - smoothing_horizon_grid
    - correction_or_blend
    - train_model
    - hmm_pf_or_beam_regeneration
    - raw_test_inference
    - submission
    - late_phase_specific_branch_or_metric


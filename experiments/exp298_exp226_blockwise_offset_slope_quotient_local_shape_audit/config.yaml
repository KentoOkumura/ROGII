component_contract:
  labels:
    exp226_geop: tvt_geop
    exp226_pre_u: tvt_geop_plus_gr_delta
    exp226_post_u: tvt_pred
  reconstruction:
    exp226_pre_u_formula: float64(tvt_geop) + float64(gr_delta)
    maximum_nonfinite_rows: 0
  alias:
    exp226_post_u_equals: exp226_k16
    maximum_abs_parity_ft: 0.001
    rank_duplicate_policy: >-
      exp226_post_u is an audit alias of exp226_k16 and is excluded as a second
      competitor; it is retained only for pre-U versus post-U paired metrics.
  primary_local_source_for_downstream: exp226_pre_u
  geop_and_post_u_role: diagnostics_only
  no_truth_based_component_selection: true


model:
  name: exp226_geometry_rate_prior_on_exp209
  estimator: none
  stage_0:
    exp226_component: geometry_only_pre_gr_pre_u_projection
    k_segments: 16
    geometry_rate: delta_tvt_geop_plus_delta_z_div_delta_md
    target_anchor_rate: exp209_known_prefix_initial_rate
    formula: parent_initial_rate_plus_geometry_rate_minus_first_segment_geometry_rate
    fallback: constant_parent_initial_rate_when_geometry_invalid
    segment_assignment: exp226_row_position_linspace_k16
    segment_reducer: median_finite_positive_delta_md_steps
    first_segment_policy: full_well_constant_parent_fallback_when_invalid
    invalid_later_segment_policy: constant_parent_rate_for_that_segment
    rate_readout_weighting: equal_valid_well_segment
    cumulative_path_anchor: last_known_prefix_u
    fold_gate_scope: segment_and_cumulative_path_both
    compare_against: exp209_constant_rate_prior
    pass_requires_all:
      minimum_segment_rate_change_rmse_gain_fraction: 0.05
      minimum_cumulative_path_rmse_gain_ft: 0.05
      minimum_improved_folds: 4
      require_1000_plus_non_regression: true
      require_hidden_like_spatial_non_regression: true
      require_hidden_like_typewell_purged_non_regression: true
      maximum_worst_well_regression_ft: 0.25
  stage_1:
    enabled_condition: explicit_user_override_after_stage0_average_improvement
    user_override:
      approved: true
      approved_at: "2026-07-23"
      authorization_source: user_message_average_improves_proceed
      rationale: pooled_and_fold_average_improvement_is_sufficient_to_run_stage1
      overridden_failed_gate: stage0_worst_well_regression_guard
      does_not_approve: [parameter_rescue, inference, submission]
    state_coordinate: residual_rate_about_time_varying_mu
    residual_initial_mean: 0.0
    prior_mean_schedule: stage0_frozen_mu_rate_t
    expected_stage0_schedule_logical_sha256: 53f9d42bcca0f5596568971b5da6c440114922d0a25b5622592e1b7b50774c85
    expected_stage0_geometry_ledger_logical_sha256: b527d3401e2d730ec883681051c476c929a428e7fc28ed88fff3091045915a39
    active_variants: [exp226_geometry_rate_prior_mean_residual_hmm]
    hmm_well_runs: 773
    baseline_metric_absolute_tolerance: 1.0e-5
    hmm:
      step: 0.35
      n_rates: 41
      residual_rate_span: 0.10
      sig_r: 0.002
      sig_p: 0.02
      emission: gauss
      sigma_mode: std
      start_sig: 0.75
      r0_sig: 0.01
      band_pad: 100.0
      momentum: 0.998
      output: posterior_mean
    pass_requires_all:
      minimum_rmse_gain_vs_exp209_ft: 0.05
      minimum_improved_folds: 4
      require_1000_plus_non_regression: true
      require_hidden_like_spatial_non_regression: true
      require_hidden_like_typewell_purged_non_regression: true
      require_by_well_p95_non_regression: true
      maximum_worst_well_regression_ft: 0.25
      require_fixed_likpf_blend_non_regression: true
  fixed_parent:
    observation_model: exact_exp209
    sigma_gr: exact_exp209
    sig_r: 0.002
    sig_p: 0.02
    effective_position_sigma_floor: 0.1225
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    momentum: 0.998
    prior: exact_exp209
    output: posterior_mean
  forbidden:
    - exp307_or_exp308_or_exp309_or_exp338_inputs
    - exp226_final_tvt_prediction
    - exp226_gr_correction
    - exp226_u_projection
    - absolute_tvt_unary
    - fixed_exp226_path_shape
    - prediction_blend
    - parameter_grid


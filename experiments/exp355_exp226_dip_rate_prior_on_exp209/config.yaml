experiment:
  name: exp355_exp226_dip_rate_prior_on_exp209
  description: >-
    Independent two-stage audit of a fold-safe exp226 K16 geometry rate-change
    schedule as the only time-varying rate-prior mean change on trusted exp209.
  route: pf_beam
  status: stage1_completed_scientific_gate_failed_closed
  created_at: "2026-07-23"
  updated_at: "2026-07-23"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260723-exp355-exp226-dip-rate-prior-on-exp209
  history: exp323_time_varying_exp226_dip_rate_prior
  references:
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp338_exp209_well_adaptive_transition_noise
  diff_summary: >-
    Removes the failed exp307--309/338 chain. It keeps every exp209 observation,
    diffusion, grid, momentum, prior, and output setting fixed and changes only
    the constant rate-prior mean to a target-anchored exp226 geometry rate-change schedule.


  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: unknown_suffix_truth_only_after_rate_schedule_and_prediction_freeze
  truth_attachment: after_geometry_ledger_schedule_prediction_and_content_sha_freeze

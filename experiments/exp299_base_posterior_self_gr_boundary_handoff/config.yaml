experiment:
  name: exp299_base_posterior_self_gr_boundary_handoff
  description: >-
    Use a frozen Type-Well-only exact-HMM posterior as a target-free controller,
    keep self-GR contribution exactly zero for outside candidate states, fade the
    entire row contribution to zero at the known-TVT boundary, and conditionally
    normalize inside-support evidence so it does not change inside/outside mass.
  route: ensemble
  status: kaggle_cpu_v2_completed_train_side_guard_failed_closed
  created_at: "2026-07-20"
  updated_at: "2026-07-21"

lineage:
  parent: exp223_joint_typewell_self_gr_hmm_likelihood_probe
  negative_reference: exp296_exp223_self_gr_known_tvt_support_gate
  base_hmm_parity_reference: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  hidden_like_reference: exp115_hidden_like_spatial_holdout_from_ppt
  diff_summary: >-
    Keeps the exp223 raw motif surface and exact Type Well HMM fixed. Adds a
    frozen base-only posterior pass, an outside-state exact-zero rule, a
    target-free row-level boundary handoff using the existing 12-ft self-GR
    sigma, and base-posterior-weighted conditional normalization. This prevents
    self-GR from changing total inside-versus-outside support odds.


model:
  name: base_posterior_self_gr_boundary_handoff
  estimator: deterministic_two_pass_exact_hmm_forward_backward
  implementation_source: exp299_base_posterior_self_gr_boundary_handoff_compact_selfcontained_train.py
  planned_scientific_variants: 1
  active_variants_when_enabled: 1
  variant: hmm_selfgr_base_posterior_conditional_handoff_a070_c100

model:
  name: lgb_quantile_band_emission_hmm
  estimator: lightgbm_quantile_plus_exact_hmm
  target: target
  base_prediction: last_known_tvt
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  feature_ablation:
    active_variants:
      - name: exp148_quantile_surface
        enabled: true
        description: exp148 learned-likelihood add-only surface used for q16/q50/q84 quantile residual models.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
  training:
    active_modes:
      - gpu_quantile_lgb1_q16_q50_q84
    modes:
      gpu_quantile_lgb1_q16_q50_q84:
        description: Single exp063-family lgb1 config trained for q16/q50/q84, 5 folds, 15 boosters.
        use_gpu: true
        selected_config_indices:
          - 1
        early_stopping_rounds: 250
        common_overrides:
          deterministic: true
          force_col_wise: true
          gpu_use_dp: true
          num_threads: 8
  quantile_lgb:
    alphas:
      - 0.16
      - 0.50
      - 0.84
    low_alpha: 0.16
    mid_alpha: 0.50
    high_alpha: 0.84
    band_to_sigma_divisor: 2.0
    sigma_floor: 6.0
    sigma_cap: 30.0
    max_train_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 50
  hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
  notes:
    - The quantile train notebook produces q16/q50/q84 OOF and saved boosters.
    - The train_aggregate notebook uses only q_mid_tvt and sigma_tvt from the OOF band for HMM train-side audit.

lgb_emission:
  enabled: true
  active_sources:
    - exp229_quantile_band
  lambda_grid:
    - 0.25
  sigma_floor_grid:
    - 6.0
  sigma_cap_grid:
    - 30.0
  emission_clip: 600.0
  max_variants: 1
  timeout_recovery:
    source_kernel_version: 2
    reason: >
      The three-lambda CPU audit reached only 652 completed wells (654 started)
      near the Kaggle 12-hour limit, so no final cache or comparison artifact
      was written.
    partial_well_count: 652
    selected_variant: hmm_lgb_exp229_quantile_band_band_sf0600_sc3000_l0250
    rationale: >
      Lambda 0.25 had the lowest partial mean well RMSE (6.316158) and was
      best on 358 of 652 completed wells, ahead of lambda 0.50 (6.355612,
      91 wells) and lambda 1.00 (6.385539, 203 wells).
  deferred_lambda_grid:
    - 0.50
    - 1.00
  sources:
    exp229_quantile_band:
      description: exp229 q16/q50/q84 corrected quantile band; q50 is center and sigma_tvt is row-wise emission sigma.
      id_column: id
      prediction_column: q_mid_tvt
      sigma_column: sigma_tvt
      candidates:
        - /kaggle/input/notebooks/kentookumura/exp229-lgb-quantile-band-exp148-train/artifacts/exp229_lgb_quantile_band_emission_hmm_on_exp148_quantile_predictions.csv.gz
        - /kaggle/input/exp229-lgb-quantile-band-exp148-train/artifacts/exp229_lgb_quantile_band_emission_hmm_on_exp148_quantile_predictions.csv.gz
        - experiments/exp229_lgb_quantile_band_emission_hmm_on_exp148/artifacts/exp229_lgb_quantile_band_emission_hmm_on_exp148_quantile_predictions.csv.gz
    exp148_lgb_mean:
      description: exp148 GPU train v1 lgb_mean OOF prediction.
      id_column: id
      prediction_column: null
      model_filter: lgb_mean
      candidates:
        - /kaggle/input/notebooks/kentookumura/exp148-train/artifacts/exp148_learned_likelihood_fulltrain_addonly_on_exp092_predictions.csv.gz
        - /kaggle/input/exp148-train/artifacts/exp148_learned_likelihood_fulltrain_addonly_on_exp092_predictions.csv.gz
        - /tmp/kaggle-output/exp148_train_v1/artifacts/exp148_learned_likelihood_fulltrain_addonly_on_exp092_predictions.csv.gz
        - experiments/exp148_learned_likelihood_fulltrain_addonly_on_exp092/artifacts/viewer/exp148_lgb_mean_oof_viewer.csv
    exp193_lgb_mean:
      description: exp193 typewell late interval context add-only lgb_mean OOF prediction.
      id_column: id
      prediction_column: pred_tvt
      model_filter: lgb_mean
      candidates:
        - /kaggle/input/notebooks/kentookumura/exp193-typewell-late-context-exp148-train/artifacts/exp193_typewell_late_interval_context_features_addonly_on_exp148_predictions.csv.gz
        - /kaggle/input/exp193-typewell-late-context-exp148-train/artifacts/exp193_typewell_late_interval_context_features_addonly_on_exp148_predictions.csv.gz
        - experiments/exp193_typewell_late_interval_context_features_addonly_on_exp148/kaggle/output/train_v1/artifacts/exp193_typewell_late_interval_context_features_addonly_on_exp148_predictions.csv.gz


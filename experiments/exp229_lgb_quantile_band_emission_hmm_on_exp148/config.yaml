reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_for_quantile_subsample; HMM no RNG
  stochastic_components:
    - LightGBM GPU training
  parallel_rng_policy: HMM has no RNG; LightGBM uses fixed config seeds; optional train-row subsampling uses local default_rng(42)
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: true
  notes:
    - docs/06_reproducibility.md checked on 2026-07-09.
    - This is not a deterministic submission anchor until inference is implemented and rerun evidence exists.

notes:
  - Initial push guard for quantile train is 1 active variant x 1 LightGBM config x 3 quantiles x 5 folds = 15 boosters.
  - No parent/control retraining is included.
  - HMM audit is CPU-only logic but depends on the quantile train output dataset.
  - HMM timeout recovery runs lambda=0.25 only; lambda=0.50/1.00 are deferred to separate runs.

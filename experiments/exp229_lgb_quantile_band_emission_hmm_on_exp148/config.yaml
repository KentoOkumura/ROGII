experiment:
  name: "exp229_lgb_quantile_band_emission_hmm_on_exp148"
  description: Use LightGBM quantile bands from the exp148 feature surface as row-wise HMM emission uncertainty instead of exp221 fixed sigma.
  route: ensemble
  status: completed_train_side_rejected_no_inference_no_submit
  created_at: "2026-07-09"
  updated_at: "2026-07-12"

lineage:
  parent: lgb_quantile_band_emission_hmm_on_exp148 backlog
  references:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp193_typewell_late_interval_context_features_addonly_on_exp148
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp221_lgb_oof_gaussian_emission_hmm_on_exp148
    - exp218_gr_wavelet_rotation_confidence_features_on_exp148
    - KAGGLE_DIRECTION.md lgb_quantile_band_emission_hmm_on_exp148
  implementation_source:
    - quantile_lgb_train.py
    - exact_hmm_smoother.py
    - quantile_band_hmm_audit.py
  diff_summary: >
    Splits the backlog into two Kaggle notebooks. The train notebook fits
    exp148-surface LightGBM quantile models for q16/q50/q84 and writes a
    corrected quantile band with row-wise sigma. The train_aggregate notebook
    injects q50 as the HMM Gaussian center and the clipped quantile-band sigma
    as per-row emission uncertainty, then reuses the exp221 readout against
    exp148, exp193, exp072 likPF, hidden-like buckets, by-well regressions, and
    step-delta smoothness.

validation:
  strategy: groupkfold_by_well_exp148_quantile_oof_then_train_side_hmm_audit
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_train_unknown_suffix_rows
  success_criteria:
    - Quantile q50 OOF should be competitive enough that HMM improvements are interpretable versus exp148 lgb_mean.
    - Quantile-band HMM should improve or at least not materially regress versus exp221 fixed-sigma HMM overall.
    - Near rows, 1000_plus, exp115 hidden-like subgroups, and mid buckets should not show material regression.
    - Worst-well regression versus exp148 and exp221 must be checked before any inference port.
    - Quantile crossing, sigma floor/cap rates, and band coverage must be recorded.
  leakage_policy:
    - Quantile LightGBM uses GroupKFold by well and only OOF predictions for HMM train-side audit.
    - Quantile band width is computed from model predictions only; true TVT is used only for readout metrics.
    - Parent/control exp148 or exp193 boosters are not retrained in this experiment.
    - HMM lambda and sigma floor/cap are fixed config grids, not row-wise label-tuned values.


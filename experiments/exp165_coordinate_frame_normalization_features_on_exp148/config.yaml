experiment:
  name: "exp165_coordinate_frame_normalization_features_on_exp148"
  description: Add target-free anchor-normalized coordinate frame trajectory confidence features to the exp148 learned likelihood ML anchor.
  route: ml_model
  status: completed_train_side_rejected
  created_at: "2026-07-02"
  updated_at: "2026-07-02"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp092_u_projection_correction_disagreement_fullrun
    - exp149_normalized_shape_addonly_features_on_exp092
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148
    - exp162_learned_likelihood_rank_slot_on_exp148
    - exp163_typewell_neighbor_prior_as_ml_features_on_exp148
  implementation_source: coordinate_frame_normalization_features_on_exp148.py
  diff_summary: Keeps the exp148 base, learned likelihood confidence features, residual target, and exp092 U-projection surface fixed, then adds target-free raw MD/X/Y/Z features normalized around the known-prefix anchor and prefix-tail azimuth. Coordinate values are not used as direct TVT candidates, hard corrections, row-wise selectors, blends, or postprocess replacements.

validation:
  strategy: groupkfold_by_well_exp148_surface_with_coordinate_frame_addonly
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_and_exp145_full_train_ml_feature_cache
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood probability and predicted-error columns are target-free features generated from saved exp111 transforms and exp099/full replay candidate features.
    - Coordinate-frame features use only raw MD/X/Y/Z, TVT_input known-prefix anchor location, row id index alignment, and existing target-free candidate disagreement columns.
    - Validation/test true TVT, oracle best candidate, true-error rank, and OOF absolute error are not used for feature generation.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json
  learned_likelihood_train_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_full_train_ml_features.csv.gz
  learned_likelihood_rawtest_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_rawtest_ml_features.csv.gz
  learned_likelihood_train_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_rawtest_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_train_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  learned_likelihood_rawtest_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json

model:
  name: exp165_coordinate_frame_normalization_features_on_exp148_lgbm
  source_experiment: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  learned_likelihood_feature_experiment: exp145_learned_likelihood_rawtest_feature_generator_parity
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_exp145_full_train_ml_features
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  coordinate_frame:
    prefix: cfn_
    prefix_tail_window_rows: 200
    roughness_window_rows: 31
  feature_ablation:
    selected_variant: coordinate_frame_addonly
    active_variants:
      - name: exp148_historical_control
        description: Disabled by user request; use historical exp148 CV/LB as the comparison baseline unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
        enabled: false
      - name: coordinate_frame_addonly
        description: Adds target-free anchor-normalized coordinate geometry, direction, derivative, roughness, and candidate-disagreement interaction features to exp148.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
          - coordinate_frame_geometry
          - coordinate_frame_direction
          - coordinate_frame_derivative
          - coordinate_frame_interaction
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 80
    active_modes:
      - cpu_deterministic_threads8
    modes:
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    train_lgb0_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    train_lgb1_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    train_lgb2_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    train_aggregate_kernel_sources:
      - kentookumura/exp165-coordinate-frame-exp148-lgb0-train
      - kentookumura/exp165-coordinate-frame-exp148-lgb1-train
      - kentookumura/exp165-coordinate-frame-exp148-lgb2-train
    inference_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp165-coordinate-frame-exp148-lgb0-train
      - kentookumura/exp165-coordinate-frame-exp148-lgb1-train
      - kentookumura/exp165-coordinate-frame-exp148-lgb2-train
      - kentookumura/exp111-learned-pf-likelihood-train
      - kentookumura/exp112-learned-pf-likelihood-followup-train

generator:
  chunksize: 200000
  include_candidate_values: false
  default_candidate: likpf_mean
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - cpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; coordinate feature generation itself uses no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a CPU full-train add-only feature audit, not a deterministic submission anchor.
    - Control retraining is disabled; saved exp148 metrics and Public LB are the baseline.

audit:
  mode: coordinate_frame_normalization_features_on_exp148_full_train_rows
  output_prefix: exp165_coordinate_frame_normalization_features_on_exp148
  fast: false
  reference_metrics:
    exp148_lgb_mean_pooled_rmse: 8.50128118189582
    exp148_public_lb: 7.960
    exp092_full_lgb1_pooled_rmse: 9.322479895503927
    exp149_lgb_mean_pooled_rmse: 9.34168837139576
  expected_train_artifacts:
    - exp165_coordinate_frame_normalization_features_on_exp148_metrics.csv

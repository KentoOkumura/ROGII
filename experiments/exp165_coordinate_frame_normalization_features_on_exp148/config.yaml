    - exp165_coordinate_frame_normalization_features_on_exp148_coordinate_frame_feature_summary.csv
    - exp165_coordinate_frame_normalization_features_on_exp148_feature_importance.csv
    - exp165_coordinate_frame_normalization_features_on_exp148_feature_importance_mean.csv
    - exp165_coordinate_frame_normalization_features_on_exp148_feature_importance_mean_top.png
    - exp165_coordinate_frame_normalization_features_on_exp148_predictions.csv.gz
    - exp165_coordinate_frame_normalization_features_on_exp148_feature_schema.csv
    - exp165_coordinate_frame_normalization_features_on_exp148_lgb_models/manifest.json
    - exp165_coordinate_frame_normalization_features_on_exp148_summary.json

inference:
  mode: saved_lgb_booster_inference_with_current_test_coordinate_frame_features
  selected_variant: coordinate_frame_addonly
  selected_mode: cpu_deterministic_threads8
  selected_model: lgb_mean
  model_manifest_prefixes:
    - exp165_coordinate_frame_normalization_features_on_exp148_lgb0
    - exp165_coordinate_frame_normalization_features_on_exp148_lgb1
    - exp165_coordinate_frame_normalization_features_on_exp148_lgb2
  notes:
    - Inference requires completed exp165 split train manifests with saved CPU boosters.
    - Direct submission should wait for OOF, worst-well, near-row, and feature parity review.

notes:
  - Implements the backlog item coordinate_frame_normalization_features_on_exp148.
  - Primary decision is whether anchor-normalized trajectory confidence features add signal beyond the exp148 ML route anchor.

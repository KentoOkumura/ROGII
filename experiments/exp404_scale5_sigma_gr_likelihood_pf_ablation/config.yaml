notes:
  - The exp400 x1.3 scale-5 score is prior exploratory evidence and is not used as the x1.0 comparison.
  - Both variants must be rerun because exp072 saved only likpf_mean and gs changes resampling trajectories.
  - The public notebook's default seed_base=0 is not reproduced; this experiment tests deterministic transfer to the exp072 lineage.
  - The compact self-contained train/inference candidates are adopted as the canonical notebooks by the explicit 2026-07-26 execution request.
  - Kaggle private CPU package, push, and train execution are approved; inference and submission remain unapproved.

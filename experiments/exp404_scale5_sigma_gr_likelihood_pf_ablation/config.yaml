validation:
  strategy: paired_all_well_likelihood_pf_scale5_gs_multiplier_ablation
  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  primary_control: likpf_scale_5_x1p0
  primary_candidate: likpf_scale_5_x1p3
  gain_definition: rmse_x1p0_minus_rmse_x1p3
  truth_attachment: after_both_variant_predictions_and_logical_content_sha_freeze
  missing_fraction_buckets:
    low: [0.0, 0.10]
    mid: [0.10, 0.30]
    high: [0.30, 1.0]
    boundary_policy: left_closed_right_open_except_final_closed
  leakage_policy:
    - PF generation reads horizontal MD, Z, GR, and TVT_input but not horizontal suffix TVT.
    - Type Well TVT is a reference-curve coordinate and is allowed during PF generation.
    - Both variant predictions, their row identity, and logical content SHA are frozen before suffix truth, error, fold score, or hidden-like role is read.
    - exp226 is used only for well, row, suffix-offset, and reporting-fold identity.
    - Public LB and exp400's post-hoc scale ordering cannot change the multiplier, scale temperature, seed policy, gate, or scope.


experiment:
  name: exp404_scale5_sigma_gr_likelihood_pf_ablation
  description: >-
    Design-frozen paired train-side likelihood-PF ablation that compares
    gs x1.0 with gs x1.3 while fixing the seed aggregation to likelihood
    temperature scale 5. Both variants rerun the same exp072-compatible
    500-particle, 128-seed PF with common per-well random seeds.
  hypothesis: >-
    The x1.3 GR observation scale that failed with arithmetic seed averaging
    in exp400 can improve the likelihood-weighted scale-5 prediction because
    scale-5 aggregation suppresses low-likelihood seed trajectories instead
    of averaging incompatible alignment modes.
  route: pf_beam
  status: train_side_paired_scale5_gs_x1p3_gate_failed_closed
  created_at: "2026-07-26"
  updated_at: "2026-07-26"

lineage:
  parent: exp400_all_well_1p3_sigma_gr_likelihood_pf
  kernel_parent: exp072_exp063_full_replay_feature_cache
  reporting_fold_source: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  hidden_like_source: exp115_hidden_like_spatial_holdout_from_ppt
  steering: ../../.steering/20260726-exp404-scale5-sigma-gr-likelihood-pf-ablation
  references:
    - exp069_pixiux_pf_beam_direct_submit_audit
    - exp214_public_raw_gr_residual_scale_control
    - docs/06_reproducibility.md
    - https://www.kaggle.com/competitions/rogii-wellbore-geology-prediction/discussion/728712
    - https://www.kaggle.com/code/hjyact/ultimate-pf-config-strategy-a-reproducible-score
  diff_summary: >-
    Replace exp400's arithmetic pf_mean primary endpoint with a pre-fixed
    likelihood-weighted scale-5 endpoint and add an exact x1.0 scale-5
    control. Rerun x1.0 and x1.3 with identical per-well seed labels because
    the saved exp072 cache has no scale-5 prediction. Keep the PF kernel,
    particle count, seed count, dynamics, resampling, interpolation, base
    scale estimator, folds, and score rows fixed. Do not replay the public
    notebook's ML, Beam, selector, hold, projection, or calibration pipeline.


reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: >-
    seed_base=sha256_first16("likpf::train::<well_id>")
    modulo_2147483647_plus_1; per-seed seed=seed_base+seed_index_0_to_127;
    the multiplier is deliberately excluded so x1.0 and x1.3 use common
    random-number labels.
  stochastic_components:
    - particle_initialization
    - rate_and_position_process_noise
    - systematic_resampling
    - post_resampling_roughening
  parallel_rng_policy: fixed_8_well_threads_each_numba_kernel_receives_explicit_stable_seed
  stable_order: well_id_lexicographic_then_variant_x1p0_x1p3_then_original_row_then_seed_index
  feature_sha_policy: decompressed_content_sha_for_gzip
  freeze_before_truth:
    - scientific_contract
    - well_gr_scale_and_seed_audit
    - paired_prediction_table
    - paired_prediction_logical_content_sha
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - Resampling times may diverge after the gs intervention; that divergence is part of the treatment and does not violate paired seeding.
    - An initial train-side run is a deterministic candidate audit, not a deterministic submission anchor.
    - Raw-test regeneration, inference, and submission are out of scope and require a separate design.


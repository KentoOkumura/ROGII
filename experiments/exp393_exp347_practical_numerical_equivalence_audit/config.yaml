experiment:
  name: exp393_exp347_practical_numerical_equivalence_audit
  description: >-
    Audit whether the exp347 scalar-versus-batched float32 posterior difference
    is practically negligible at the posterior-mean TVT and marginal-MAP
    readouts, without reopening or reclassifying exp347.
  route: ensemble
  status: stage_a_failed_branch_closed
  created_at: "2026-07-25"
  updated_at: "2026-07-25"

overrides:
  project_defaults:
    - validation.metric
    - validation.strategy
    - validation.score_rows

lineage:
  parent: exp347_prefix_gr_unary_batched_window_exact_ssm
  steering: ../../.steering/20260725-exp393-exp347-practical-numerical-equivalence-audit
  references:
    - exp332_prefix_gr_unary_fixed_window_structured_ssm
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp221_lgb_oof_gaussian_emission_hmm_on_exp148
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  diff_summary: >-
    Keeps the terminal exp347 implementation and decision immutable. Changes
    only the promotion surface from a posterior-cell maximum error to a new,
    preregistered practical-equivalence audit centered on posterior-mean TVT,
    marginal MAP, and the existing loss/gradient/padding contracts. After the
    Stage 0 practical gate failed, the user explicitly accepted those numerical
    differences and authorized the unchanged exp347 fold-0 Stage A as an
    exception; neither exp347 nor the exp393 Stage 0 result is reclassified.

implementation:
  approved: true
  approval_source: user_message_implement_exp393_2026_07_25
  scope: stage0_audit_plus_user_override_stage_a_fold0
  train_notebook_state: canonical_stage_a_completed_failed_closed
  inference_notebook_state: canonical_fail_closed_compact_adopted
  compact_selfcontained_source_created: true
  canonical_train_notebook_adopted: true
  canonical_inference_notebook_adopted: true
  inference_enabled: false
  submission_enabled: false

validation:
  strategy: fixed16_exp347_window_practical_numerical_equivalence_audit
  metric: scalar_vs_batched_posterior_mean_tvt_difference
  seed: 42
  fold: 0
  n_folds: 5
  sample_unit: complete_well
  score_rows: fixed16_window_valid_rows_only
  reference_mode: scalar_fp32_reference
  candidate_mode: batched_fp32_batch4_production
  diagnostic_modes:
    - batched_fp32_batch1
    - scalar_fp64_first4_diagnostic
  stage0:
    fixed_window_count: 16
    fp64_diagnostic_window_count: 4
    selection_source: exp347_fixed16_window_and_boundary_contract
    temporary_neural_model_count: 1
    unary_generation_count: 1
    freeze_unary_before_mode_comparison: true
    required_checks:
      posterior_mean_tvt_rmse_ft_max: 0.001
      posterior_mean_tvt_p99_abs_ft_max: 0.005
      posterior_mean_tvt_max_abs_ft_max: 0.02
      marginal_map_state_agreement_min: 0.9999
      loss_or_partition_max_abs_error_max: 0.000001
      gradient_or_adamw_update_max_abs_error_max: 0.00001
      posterior_row_sum_max_abs_error_max: 0.00001
      invalid_posterior_or_gradient_max_abs: 0.0
      finite_rate_min: 1.0
      outer_valid_truth_access_count_max: 0
      stage_a_model_count_max: 0
      peak_gpu_memory_gb_max: 14.0
      audit_runtime_hours_max: 1.0
    diagnostic_only:
      - posterior_cell_abs_error_summary
      - rowwise_total_variation_summary
      - batch1_vs_scalar_summary
      - scalar_fp32_vs_fp64_summary
      - batch4_fp32_vs_fp64_summary
      - map_disagreement_top2_margin_and_state_distance
    posterior_cell_1e6_gate_policy: diagnostic_only_do_not_reclassify_exp347
    failure_action: close_without_threshold_dtype_batch_padding_or_kernel_rescue
  stage_a:
    prerequisite: explicit_user_override_acknowledging_stage0_fail
    fold_indices: [0]
    active_architectures: 1
    seeds: [42]
    neural_model_count: 1
    persisted_model_count: 1
    lightgbm_config_count: 0
    total_boosters: 0
    pf_beam_well_runs: 0
    parent_or_control_retraining: 0
    science_gate_source: exp347_stage_a_contract
    override_changes_science_gate: false
  stage_a_pass:
    minimum_target_in_grid_rate: 0.995
    maximum_prefix_clamp_abs_error_ft: 0.000001
    minimum_real_nll_gain_vs_circular_shuffle_nats_per_token: 0.05
    minimum_real_within10_mass_gain_vs_circular_shuffle: 0.03
    minimum_real_rmse_gain_vs_geometry_only_ft: 0.25
    minimum_real_rmse_gain_vs_exp209_ft: 0.25
    require_well_rmse_p95_non_regression_vs_exp209: true
    maximum_worst_well_regression_vs_exp209_ft: 10.0
    maximum_fold_runtime_hours: 8.5
    maximum_peak_gpu_memory_gb: 14.0


experiment:
  name: "exp118_spatial_neighbor_prior_confidence_gate_on_exp092"
  description: Train-side posthoc confidence gate audit for applying exp114 spatial neighbor prior corrections to exp092 OOF predictions.
  route: ml_model  # ml_model, pf_beam, or ensemble
  status: completed_train_side_audit_supported_for_review_no_submit
  created_at: "2026-06-24"
  updated_at: "2026-06-24"

lineage:
  parent: exp092_u_projection_correction_disagreement_fullrun
  spatial_prior_parent: exp114_spatial_neighbor_prior_signal_audit
  cache_parents:
    - exp114_spatial_neighbor_prior_signal_audit
    - exp092_u_projection_correction_disagreement_fullrun
  diagnostic_parents:
    - exp109_typewell_neighbor_prior_features
    - exp110_typewell_neighbor_prior_rawtest_parity_gate
    - exp115_hidden_like_spatial_holdout_from_ppt
    - exp116_hidden_like_anchor_score_readout_on_exp115
  implementation_source: spatial_neighbor_prior_confidence_gate_on_exp092.py
  diff_summary: Uses exp114 fold-safe spatial prior OOF diagnostics as fixed inputs and audits small clipped corrections to exp092 lgb1 OOF predictions under confidence gates. It does not train a model, regenerate PF/Beam, create an inference port, or submit.

validation:
  strategy: exp092_oof_posthoc_spatial_neighbor_confidence_gate
  metric: rmse
  secondary_metrics:
    - mae
    - within_10ft
    - gate_rate
    - correction_magnitude
    - distance_bucket_rmse
    - worst_well_rmse_delta
    - path_continuity
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: exp092_oof_rows
  leakage_policy:
    - exp092 OOF predictions are fixed model outputs generated by GroupKFold by well.
    - exp114 spatial prior OOF diagnostics are fixed fold-safe priors that use train-fold wells only as neighbor sources.
    - This experiment uses true TVT only to score posthoc gate policies and does not select an inference policy for submission.
    - Gate features are target-free diagnostic columns from exp114 plus exp092 prediction disagreement magnitude.
    - Any positive global OOF result must still pass worst-well, path continuity, raw-test parity, and hidden-like stress checks before inference work.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp114_oof_predictions_local: experiments/exp114_spatial_neighbor_prior_signal_audit/kaggle/output/train_v1/artifacts/exp114_spatial_neighbor_prior_signal_audit_oof_predictions.csv.gz
  exp114_summary_local: experiments/exp114_spatial_neighbor_prior_signal_audit/kaggle/output/train_v1/artifacts/exp114_spatial_neighbor_prior_signal_audit_summary.json
  exp092_predictions_local: experiments/exp092_u_projection_correction_disagreement_fullrun/kaggle/output/train/artifacts/exp092_u_projection_correction_disagreement_fullrun_predictions.csv.gz

model:
  name: spatial_neighbor_prior_confidence_gate_on_exp092
  estimator: none
  target: true_tvt_for_scoring_only
  base_prediction: exp092_lgb1_oof_pred_tvt
  correction_family: clipped_spatial_prior_delta_to_exp092

gate:
  exp092_variant: u_projection_correction_plus_disagreement
  exp092_mode: gpu_repro_guard_dp_threads8
  exp092_models:
    - lgb1
  spatial_variants:
    - xy_plus_trajectory_shape_k8
    - xy_only_k8
  correction_alphas: [0.02, 0.05, 0.10, 0.20]
  correction_clip_ft: [5.0, 10.0, 20.0, 40.0]
  gates:
    - name: valid_prior
    - name: std_q50
      std_quantile: 0.50
    - name: std_q25
      std_quantile: 0.25
    - name: distance_q50
      distance_quantile: 0.50
    - name: distance_q25
      distance_quantile: 0.25
    - name: neighbor_ge8
      min_neighbor_wells: 8
    - name: std_q50_distance_q50
      std_quantile: 0.50
      distance_quantile: 0.50
    - name: std_q50_neighbor_ge8
      std_quantile: 0.50
      min_neighbor_wells: 8
    - name: std_q50_distance_q50_neighbor_ge8
      std_quantile: 0.50
      distance_quantile: 0.50
      min_neighbor_wells: 8
    - name: azimuth_le1p0
      max_azimuth_mismatch: 1.0
    - name: abs_delta_le20
      max_abs_delta: 20.0
    - name: std_q50_abs_delta_le20
      std_quantile: 0.50
      max_abs_delta: 20.0

runtime:
  use_amp: false
  num_workers: 1
  batch_size: 32
  read_chunksize: 1000000
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp114-spatial-neighbor-prior-signal-audit-train
      - kentookumura/exp092-uproj-corr-disagree-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: deterministic_posthoc_grid_no_model_rng
  stochastic_components:
    - upstream_exp092_lgb_oof_predictions
    - upstream_exp114_spatial_neighbor_prior_oof
  parallel_rng_policy: no_rng_in_exp118
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a deterministic posthoc audit over fixed upstream Kaggle outputs.
    - It is not a deterministic submission anchor and does not create submission.csv.

audit:
  mode: spatial_neighbor_prior_confidence_gate_on_exp092
  output_prefix: exp118_spatial_neighbor_prior_confidence_gate_on_exp092
  max_rows: null
  top_n_detailed_policies: 12
  top_n_prediction_policies: 6
  max_regression_warn_rmse: 0.25
  expected_train_artifacts:
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092_gate_metrics.csv
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092_by_well.csv
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092_by_well_delta.csv
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092_bucket_metrics.csv
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092_path_continuity.csv
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092_top_gated_predictions.csv.gz
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092_feature_schema.csv
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092_summary.json

inference:
  mode: not_selected_train_side_audit_only
  selected_variant: lgb1__xy_only_k8__std_q50_distance_q50__a0p05__c5
  notes:
    - This experiment is a gate audit only.
    - Best OOF policy is supported for review but not selected for inference or submit.
    - Raw-test/full-train parity and hidden-like stress checks remain required before any inference port.

notes:
  - Implements the spatial_neighbor_prior_confidence_gate_on_exp092 follow-up from exp114.
  - ML add-only feature evaluation remains a separate backlog item.

experiment:
  name: exp439_continuous_kinematic_joint_transition_exact_hmm
  description: >-
    Preserve the exp209 persistent joint TVT/rate state while replacing its
    destination-rate-only position step with a trapezoidal continuous-
    kinematic joint edge whose lattice projection preserves probability,
    displacement moments, and TVT/rate covariance.
  route: pf_beam
  status: completed_stage0_technical_failed_closed_moment_projection_infeasible
  created_at: "2026-07-29"
  updated_at: "2026-07-29"

overrides:
  project_defaults:
    - validation.strategy
    - validation.score_rows

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  mechanism_evidence: exp408_hmm_message_rate_basin_audit
  comparison_references:
    - exp437_neighbor_geometry_tvt_only_transition_hmm
    - exp438_u_state_fixed_lattice_exact_hmm
    - exp436_sparse_global_stratigraphic_potential
  steering: ../../.steering/20260729-exp439-continuous-kinematic-joint-transition-exact-hmm
  diff_summary: >-
    Keep the exp209 state, legal three-neighbour rate marginal, priors, GR
    emission, TVT lattice, process-noise values, boundary truncation, and
    posterior readout fixed. For each legal source/destination-rate edge,
    integrate the interval rate by the trapezoidal rule and use the smallest
    feasible 5/7/9-cell non-negative maximum-entropy projection that preserves
    probability, conditional displacement mean, and conditional variance.


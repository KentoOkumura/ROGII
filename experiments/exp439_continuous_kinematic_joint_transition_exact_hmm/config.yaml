model:
  name: continuous_kinematic_joint_transition_exact_hmm
  estimator: deterministic_exact_forward_backward
  state: [tvt_position, u_rate]
  fixed_from_exp209:
    position_grid_step_ft: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    effective_position_sigma_ft: 0.1225
    momentum: 0.998
    emission: gaussian_typewell_gr
    emission_lambda: 1.0
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    rate_center: zero
    rate_boundary_semantics: preserve_parent_substochastic_outward_mass
    position_band_boundary_semantics: preserve_parent_truncation
    output: smoothed_posterior_mean_and_std
  active_scientific_variants:
    - continuous_kinematic_joint_edge
  parent_transition:
    position_mean_formula: r_destination*delta_MD-delta_Z
    position_kernel: normalized_five_cell_gaussian
  candidate_transition:
    rate_marginal: exact_exp209_adjacent_three_state_kernel
    conditional_position_mean_formula: 0.5*(r_source+r_destination)*delta_MD-delta_Z
    conditional_position_sigma_formula: max(sig_p,0.35*position_grid_step)
    eta_p_conditionally_independent_of_rate_edge: true
    coupling: source_and_destination_rate_in_same_joint_edge
  lattice_projection:
    objective: finite_support_maximum_entropy
    constraints: [probability_sum, conditional_mean, conditional_variance]
    support_cells_order: [5, 7, 9]
    support_selection: smallest_feasible_nonnegative_odd_support
    maximum_support_cells: 9
    fail_if_infeasible: true
    precompute_dtype: float64
    solver:
      maximum_iterations: 80
      moment_tolerance: 1.0e-12
      feasibility_tolerance: 1.0e-13
      minimum_weight: 0.0
      damping_min: 9.5367431640625e-7
    hmm_message_dtype: float32
  forbidden:
    - rate_support_or_rate_marginal_change
    - rate_boundary_renormalization
    - position_grid_or_band_change
    - sig_r_sig_p_momentum_or_prior_change
    - gr_emission_or_readout_change
    - hard_trigger_reset_or_reanchor
    - ml_selector_or_blend
    - same_oof_parameter_or_gate_rescue


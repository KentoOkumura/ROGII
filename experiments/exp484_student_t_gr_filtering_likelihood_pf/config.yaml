experiment:
  name: exp484_student_t_gr_filtering_likelihood_pf
  description: >-
    Design-frozen one-factor PF ablation that replaces the exp404 Gaussian
    particle GR log likelihood with the exp374 fixed df=4 Student-t score.
  hypothesis: >-
    A df=4 heavy-tailed filtering likelihood can retain correct PF modes under
    large GR residuals better than the capped Gaussian likelihood.
  route: pf_beam
  status: stage1_gate_failed_terminal_close
  created_at: "2026-07-30"
  updated_at: "2026-07-31"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  exact_pf_implementation_reference: exp404_scale5_sigma_gr_likelihood_pf_ablation
  hmm_evidence_source: exp374_exp209_student_t_exact_hmm_emission
  steering: ../../.steering/20260730-exp484-student-t-gr-filtering-likelihood-pf
  diff_summary: >-
    Change only the per-particle GR log emission from capped Gaussian to the
    fixed exp374 df=4 Student-t score. Keep x1.0 GR scale, PF dynamics,
    500 particles, 128 stable seeds, resampling, roughening, missing-GR policy,
    and temperature-5 seed aggregation unchanged.


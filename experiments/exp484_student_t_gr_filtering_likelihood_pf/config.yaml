notes:
  - Implemented on 2026-07-30 as a compact self-contained fixed32 Stage 0 candidate.
  - The only scientific kernel change is the fixed df=4 Student-t per-particle GR emission.
  - Stage 0 Kaggle CPU package/push/run was approved by the user on 2026-07-30.
  - Kernel v1 failed in raw-identity preflight; the SHA routine was restored to the exact exp404 algorithm.
  - Kernel v2 completed Stage 0 with all 16 technical checks passing.
  - Fixed32 RMSE is diagnostic only and is not CV or promotion evidence.
  - The user separately approved the all-773-well Stage 1 run on 2026-07-30.
  - Kernel v3 completed Stage 1 with all 18 technical checks passing.
  - The candidate improved pooled RMSE by only 0.017424990 ft and improved 2/5 folds; the preregistered scientific all-AND gate failed.
  - The Student-t PF branch was closed without rescue, inference, or submission.
  - Inference and submission remain disabled and were not run because the Stage 1 scientific gate failed.

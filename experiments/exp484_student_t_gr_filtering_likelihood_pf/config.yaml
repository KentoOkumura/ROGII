model:
  name: fixed_student_t_gr_filtering_likelihood_pf
  estimator: stochastic_likelihood_weighted_particle_filter
  active_variants: [student_t_df4]
  changed_factor:
    family: student_t
    df: 4.0
    z_definition: observed_minus_typewell_gr_at_particle_tvt_divided_by_exp404_sigma_gr
    log_likelihood: "-0.5*(df+1)*log1p(z^2/df)"
    normalization_constant: omitted_as_particle_state_independent
    additional_clip: null
    application_scope: every_finite_gr_particle_update
  fixed_from_exp404:
    particles: 500
    seeds: 128
    primary_seed_weighting_temperature: 5.0
    gr_scale_multiplier: 1.0
    base_scale_clip: [10.0, 60.0]
    initial_position_spread_ft: 4.5
    initial_rate_spread: 0.01
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    rough_position: 0.1
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
    typewell_grid_step_ft: 0.2
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32


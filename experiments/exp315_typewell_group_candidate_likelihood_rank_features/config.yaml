experiment:
  name: exp315_typewell_group_candidate_likelihood_rank_features
  description: Fold-safe Type Well群GR emissionで物理候補bankを順位付けし、rank/marginだけをselectorへadd-onlyする
  route: ml_model
  status: design_frozen_blocked_on_exp312_exp313
  created_at: "2026-07-21"

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  dependencies: [exp312_typewell_group_conditional_gr_emission_table, exp313_typewell_group_unseen_transfer_guard]
  references: [exp293_physics_only_candidate_bank_headroom_contract, exp297_prefix_calibrated_latent_registration_gr_evidence]
  diff_summary: exp293 deployable12候補値とexp264 selectorを固定し、outer-train group emission由来の候補rank・margin・entropy 4列だけをadd-onlyする。候補生成やhard top1は変更しない。

implementation: {enabled: false, scope: design_only, inference_enabled: false, submission_enabled: false}

validation:
  strategy: exp264_nested_outer5_inner4
  outer_folds: 5
  inner_folds: 4
  group_column: well_id
  fit_scope: emission_outer_train_only; selector_nested_train_only
  control: saved_corrected_exp264_oof_no_retrain
  stage_a: rank_quality_readout_before_selector_fit

features:
  candidate_bank: exp293_deployable12
  add_only: [group_gr_rank_percentile, group_gr_top1_margin, group_gr_score_entropy, group_gr_available]
  fallback: neutral_rank_features
  forbidden: [hard_candidate_switch, candidate_value_change, oracle_rank, suffix_error]

model:
  name: corrected_exp264_dual_selector
  source: exp264_corrected_dual_selector
  objectives: [expected_error, within10]
  control_retrain: false

execution_contract:
  stage_a: {model_configs: 0, boosters: 0}
  stage_b_if_stage_a_passes: {scientific_variants: 1, objectives: 2, outer_folds: 5, inner_folds: 4, selector_models: 40}

promotion_gates:
  stage_a_truth_nearest_mrr_gain_min: 0.02
  stage_a_folds_improved_min: 4
  stage_b_corrected_exp264_gain_min_ft: 0.03
  hidden_like_nonregression: true
  worst_well_delta_max_ft: 0.25

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: exp264_fixed_outer_inner_folds_and_stable_sha256_candidate_scoring
  stochastic_components: [lightgbm_selector_training]
  parallel_rng_policy: fixed model seeds and stable feature generation
  feature_sha_policy: decompressed_content_sha_for_gzip
  record: {kernel_version: true, input_sha: true, feature_schema_sha: true, feature_content_sha: true, model_manifest_sha: true, prediction_sha: true, submission_sha: false}

notes:
  - Stage B cannot start unless Stage A and exp313 transfer gates pass.
  - PF/HMM/Beam candidates are auxiliary inputs; the final prediction is generated by the ML selector, so route is ml_model.

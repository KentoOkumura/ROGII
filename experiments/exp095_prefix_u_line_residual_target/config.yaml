experiment:
  name: "exp095_prefix_u_line_residual_target"
  description: Compare prefix de-trended U-space residual targets on the fixed exp073 full replay LightGBM feature surface.
  route: ml_model
  status: completed_train_side_rejected
  created_at: "2026-06-20"
  updated_at: "2026-06-20"

lineage:
  parent: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  cache_parent: exp072_exp063_full_replay_feature_cache
  implementation_source: prefix_u_line_residual_target.py
  copied_from: exp080_u_space_target_ablation
  diff_summary: Reuses the exp072 deterministic 196-feature full replay train cache and exp073 LightGBM config family, but changes only the supervised target definition. Instead of absolute U-space targets, this experiment fits a robust U_alpha(MD) line on known-prefix rows only and learns the residual from that prefix line.

validation:
  strategy: groupkfold_by_exp063_well_same_features_prefix_target_ablation
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Train features are read from exp072's raw-train-only deterministic feature cache.
    - The expected train feature surface is exp063 Pixiux full public replay with 196 features.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.
    - Prefix line parameters are fitted from raw train known-prefix rows only.
    - Target construction never reads validation tail true TVT as an anchor or line-fit input.
    - The only changed variable versus exp073 is supervised target definition.
    - This is a train-side target ablation and not a submission candidate until full CV is recorded.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json

model:
  name: exp095_prefix_u_line_residual_target_lgbm
  source_experiment: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  feature_source: exp072_exp063_full_replay_train_feature_cache
  expected_feature_count: 196
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  target_ablation:
    stage: 2
    selected_target: dTVT
    control_target: dTVT
    prefix_line:
      alphas:
        - 1.0
        - 0.5
      min_rows: 8
      min_md_span: 25.0
      robust_iterations: 3
      fallback: constant_u_at_last_known_prefix_row
    active_targets:
      - dTVT
      - prefix_u_line_alpha1p0
      - prefix_u_line_alpha0p5
    target_definitions:
      dTVT:
        description: TVT - T0, equivalent to the exp073 last_known_tvt residual baseline.
      prefix_u_line_alpha1p0:
        description: U_alpha=TVT+1.0*Z minus robust known-prefix U_alpha(MD) line; inverse is pred + prefix_line(MD) - 1.0*Z.
      prefix_u_line_alpha0p5:
        description: U_alpha=TVT+0.5*Z minus robust known-prefix U_alpha(MD) line; inverse is pred + prefix_line(MD) - 0.5*Z.
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    max_lgb_models: 1
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; included for optional rerun comparison.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train

audit:
  mode: prefix_u_line_residual_target_from_exp072_cache
  output_prefix: exp095_prefix_u_line_residual_target
  fast: false
  bucket_columns:
    distance: md_since
    tail_rank: id
  expected_train_artifacts:
    - exp095_prefix_u_line_residual_target_metrics.csv
    - exp095_prefix_u_line_residual_target_by_well.csv
    - exp095_prefix_u_line_residual_target_bucket_metrics.csv
    - exp095_prefix_u_line_residual_target_target_summary.csv
    - exp095_prefix_u_line_residual_target_predictions.csv.gz
    - exp095_prefix_u_line_residual_target_feature_schema.csv
    - exp095_prefix_u_line_residual_target_lgb_models/manifest.json
    - exp095_prefix_u_line_residual_target_summary.json

inference:
  mode: not_selected_train_side_target_ablation
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  selected_target: null
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb0
  notes:
    - Inference is intentionally not selected until train-side target ablation results are reviewed.
    - If a prefix U-line target is selected, the inference notebook must regenerate raw-test features and apply the matching inverse transform using test known-prefix line parameters.

notes:
  - This implements the backlog item `prefix_u_line_residual_target`.
  - exp080 rejected raw U-space target variants, so this experiment only tests prefix-de-trended U-space residual targets.
  - Target-only comparison keeps exp073 feature cache, folds, and LightGBM config fixed.
  - Kaggle train v1 rejected both prefix U-line residual targets; keep dTVT and do not inference-port.

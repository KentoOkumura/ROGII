model:
  name: exact_hmm_two_dimensional_formation_gradient_candidate_bank
  estimator: deterministic_huber_plane_plus_exact_hmm_audit
  target: train_unknown_suffix_tvt_for_post_generation_scoring_only
  control:
    candidate: hmm_scalar_tail30
    source: saved_exp209_exact_hmm
    regenerate: false
  formation_plane:
    target_formula: surface_S_equals_TVT_input_plus_Z
    fit_formula: S_equals_gx_X_plus_gy_Y_plus_c
    estimator: deterministic_huber_irls
    huber_delta: 1.345
    max_iterations: 25
    convergence_tolerance: 0.0000000001
    min_points: 64
    min_xy_step: 0.000001
    min_rank_ratio: 0.05
    max_condition_number: 20.0
    min_azimuth_coverage: 0.02
    covariance_rcond: 0.000000000001
    prototype_sigma_multiplier: 1.0
    canonical_eigenvector_sign: largest_absolute_component_positive
    candidate_names:
      - center
      - axis1_minus
      - axis1_plus
      - axis2_minus
      - axis2_plus
    candidate_columns:
      - hmm_grad_center
      - hmm_grad_axis1_minus
      - hmm_grad_axis1_plus
      - hmm_grad_axis2_minus
      - hmm_grad_axis2_plus
  residual_initial_rate:
    estimator: median_residual_surface_increment_per_md
    formula: median((delta_TVT_input+delta_Z-gx_delta_X-gy_delta_Y)/delta_MD)
    window_rows: 30
    min_valid_steps: 3
    fallback_rate: 0.0
  hmm:
    position_transition_formula: gx_delta_X_plus_gy_delta_Y_plus_residual_rate_delta_MD_minus_delta_Z
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero

candidate_bank:
  direct_candidates:
    - hmm_scalar_tail30
    - hmm_grad_center
    - hmm_grad_axis1_minus
    - hmm_grad_axis1_plus
    - hmm_grad_axis2_minus
    - hmm_grad_axis2_plus
  gradient_candidates:
    - hmm_grad_center
    - hmm_grad_axis1_minus
    - hmm_grad_axis1_plus
    - hmm_grad_axis2_minus
    - hmm_grad_axis2_plus
  oracle_banks:
    scalar_control: [hmm_scalar_tail30]
    scalar_plus_gradient_5: [hmm_scalar_tail30, hmm_grad_center, hmm_grad_axis1_minus, hmm_grad_axis1_plus, hmm_grad_axis2_minus, hmm_grad_axis2_plus]

audit:
  output_prefix: exp273_two_dimensional_formation_gradient_transition
  oracle_block_rows: [128, 256, 512]
  path_duplicate_atol_ft: 0.000001
  gradient_duplicate_atol: 0.000000000001
  fallback_control_parity_atol_ft: 0.00001
  turning_azimuth_coverage: 0.10
  distance_buckets_ft: [50, 100, 250, 500, 1000]
  condition_buckets: [2, 5, 10, 20]
  rank_ratio_buckets: [0.05, 0.10, 0.20, 0.40]
  azimuth_coverage_buckets: [0.02, 0.05, 0.10, 0.25]
  persist_oracle_predictions: false
  persist_candidate_mean: false
  persist_selector: false
  expected_aggregate_artifacts:
    - exp273_two_dimensional_formation_gradient_transition_candidate_metrics.csv
    - exp273_two_dimensional_formation_gradient_transition_distance_bucket_metrics.csv
    - exp273_two_dimensional_formation_gradient_transition_geometry_bucket_metrics.csv
    - exp273_two_dimensional_formation_gradient_transition_hidden_like_metrics.csv
    - exp273_two_dimensional_formation_gradient_transition_by_well.csv
    - exp273_two_dimensional_formation_gradient_transition_plane_diagnostics.csv
    - exp273_two_dimensional_formation_gradient_transition_duplicate_diagnostics.csv
    - exp273_two_dimensional_formation_gradient_transition_unique_best.csv
    - exp273_two_dimensional_formation_gradient_transition_oracle_scope_metrics.csv
    - exp273_two_dimensional_formation_gradient_transition_input_manifest.csv
    - exp273_two_dimensional_formation_gradient_transition_summary.json


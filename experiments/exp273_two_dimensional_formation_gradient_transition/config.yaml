experiment:
  name: exp273_two_dimensional_formation_gradient_transition
  description: >-
    Fits a deterministic robust plane to S=TVT_input+Z over each well's known
    prefix, turns the gradient center and four fixed covariance-axis prototypes
    into exact-HMM transition candidates, and audits their complementarity to
    the saved exp209 scalar-rate HMM without fitting a selector.
  route: pf_beam
  status: completed_negative_direct_gradient_candidates
  created_at: "2026-07-17"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.n_folds
    - validation.metric

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  references:
    - exp115_hidden_like_spatial_holdout_from_ppt
    - exp205_exact_hmm_smoother_exp072_compatible_cache_audit
    - exp206_discussion711308_dz_dtvt_bpeak_cluster_baseline
    - exp224_well_scaled_z_dz_features_on_exp218
    - exp227_z_scale_replacement_on_exp218
    - exp268_multi_scale_initial_rate_candidates
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md two_dimensional_formation_gradient_transition
  implementation_source:
    - exp273_two_dimensional_formation_gradient_transition_train.py
    - exp273_two_dimensional_formation_gradient_transition_train_variant0.py
    - exp273_two_dimensional_formation_gradient_transition_train_variant1.py
  diff_summary: >-
    Keeps the exp209 exact-HMM TVT grid, residual-rate state grammar, Gaussian
    GR emission, calibration, sigma, priors, and score rows fixed. The saved
    exp209 scalar-rate HMM remains the control and is not regenerated. Five new
    paths change only the surface increment in the position transition to
    gx*dX+gy*dY+residual_rate*dMD-dZ, using one known-prefix Huber-plane center
    and four predeclared covariance-axis prototypes. Invalid geometry falls back
    to one scalar path copied across the five candidate columns. No candidate
    mean, blend, selector, weight fitting, inference, or submission is included.

validation:
  strategy: full_train_exact_hmm_two_dimensional_gradient_candidate_bank_audit
  metric: rmse_tvt_and_candidate_bank_oracle_headroom
  seed: 42
  n_folds: 0
  group_column: well
  score_rows: full_train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  success_criteria:
    - Both target-free well shards cover the expected 773 wells and 3,783,989 rows exactly once.
    - The saved exp209 scalar control and all five gradient candidates align by id with no mismatch.
    - Plane-fit coverage, fallback reasons, geometry strata, gradient/path duplicates, unique-best rates, and row/block/whole-well oracle metrics are recorded.
    - Candidate-bank headroom is reported separately from deployable direct metrics; no oracle prediction or candidate average is persisted.
  leakage_policy:
    - Plane fit, geometry guards, prototypes, and residual initial rates use only finite known-prefix TVT_input, X, Y, Z, and MD rows from the same well.
    - HMM generation uses a horizontal frame with unknown-suffix true TVT removed before every candidate path is generated.
    - Other-well targets, target-derived spatial neighbors, formation labels, outer-valid targets, and evaluation-tail true TVT are forbidden generation inputs.
    - Well sharding uses only a stable hash of well id.
    - Unknown-suffix true TVT is attached only after all candidate paths are frozen and is used only for train-side diagnostics.
    - Plane thresholds, prototype multiplier, candidate names, block sizes, duplicate tolerances, and banks are fixed before target metrics are inspected.


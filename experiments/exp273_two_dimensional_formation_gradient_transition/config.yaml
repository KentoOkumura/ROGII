      - kentookumura/exp209-joint-exact-parity-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train
      - kentookumura/exp273-2d-formation-gradient-shard0
      - kentookumura/exp273-2d-formation-gradient-shard1
    train_variant0_kernel_sources: []
    train_variant1_kernel_sources: []
    inference_kernel_sources: []

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_exact_hmm_huber_svd_stable_sha256_well_shard_only
  stochastic_components: []
  parallel_rng_policy: no_rng_joblib_threads2_numba_threads2
  eigenvector_sign_policy: largest_absolute_component_positive
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - Exact HMM, Huber IRLS, SVD, and prototype generation consume no random numbers.
    - Stable SHA256 determines only the operational well shard and never a candidate value.
    - Eigenvector signs are canonicalized before prototype construction.
    - Numba parallel floating arithmetic and LAPACK may vary at tiny precision, so this train-side audit is not promoted to a deterministic submission anchor.
    - Raw and decompressed gzip SHA are both recorded; decompressed content SHA is primary.

inference:
  enabled: false
  mode: disabled_train_side_candidate_bank_audit_only
  create_submission: false
  selected_candidate: null

notes:
  - No candidate average, blend, target-aware selector, emission/scale change, inference, or submission is implemented.
  - Oracle paths exist only transiently while aggregate diagnostic metrics are computed and are never persisted as deployable candidates.

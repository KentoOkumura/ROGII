    experiment: exp293_physics_only_candidate_bank_headroom_contract
    h256_oracle_rmse_ft: 3.552829
    h512_oracle_rmse_ft: 3.683763
    h512_fold_rmse_ft: [3.998262, 3.745013, 3.317686, 4.117908, 3.141067]

    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Candidate membership, order, values, folds, blocks, score formula, duration, priors, and gates are fixed before truth access.
    - Candidate score, posterior, prediction, and logical content SHA are frozen before suffix TVT, error, oracle, or hidden-like role is read.
    - Type Well TVT and GR are reference-curve inputs; horizontal suffix GR is observable at current-test and may be used.
    - Registration shift is marginalized as an observation state and is never added to output TVT.
    - Public LB and same-OOF diagnostics may not change a grid, weight, prior, duration, threshold, candidate, or fallback.


observation:
  family: block_local_shift_marginalized_multiscale_gr_morphology
  base_block_rows: 256
  include_final_short_block: true
  typewell_query:
    centered_on_candidate_tvt: true
    minimum_shift_ft: -55.0
    maximum_shift_ft: 55.0
    step_ft: 5.0
    expected_states: 23
    interpolation: linear
    extrapolation: disabled
    prior: laplace
    prior_scale_ft: 20.0
    add_shift_to_output_tvt: false
  normalization:
    kind: separate_block_median_1p4826mad
    scale_clip: [5.0, 60.0]
    minimum_finite_pairs: 64
    minimum_pair_fraction: 0.50
    invalid_policy: neutral_candidate_common_emission
  components:
    raw: {window_rows: 1, weight: 0.50}
    rolling_21: {window_rows: 21, weight: 0.25}
    rolling_101: {window_rows: 101, weight: 0.25}
  rolling_contract:
    centered_within_h256_block: true
    minimum_periods: full_window
    cross_block_values: forbidden
  residual:
    kind: capped_squared_standardized_difference
    cap_z2: 9.0
    block_reduction: finite_pair_mean
    log_likelihood_scale: -0.5
  reliability:
    reliable_mass: 0.80
    candidate_common_neutral_mass: 0.20
  forbidden:
    - prefix_affine_fit
    - exp297_student_t_ncc_derivative_reuse
    - full_tvt_grid
    - registration_output_correction

semimarkov:
  solver: exact_log_space_forward_backward
  base_block_rows: 256
  minimum_duration_blocks: 2
  maximum_duration_blocks: remaining_well_blocks
  final_short_segment: right_censored_allowed
  duration_prior: uniform_over_valid_lengths
  segment_switch_penalty:
    log_cost: 2.1972245773362196
    interpretation: log_9
  segment_start_prior:
    exp226_w500_50_50: 0.45
    exp226_k16: 0.10
    each_other_candidate: 0.045
  transition:
    same_candidate_continues_without_new_segment: true
    new_segment_candidate_must_differ: true
    different_candidate_prior: renormalized_segment_start_prior_excluding_current
    geometry_floor_if_current_is_not_geometry: 0.10
    geometry_floor_depends_on_docking: false
    geometry_floor_depends_on_emission_or_uncertainty: false
  prediction:
    use_viterbi: false
    hard_top1: false
    block_marginal: candidate_probability
    row_weight_interpolation: linear_between_block_centers
    output: convex_candidate_tvt_posterior_mean
    output_dtype: float64
  numerical:
    logsumexp_dtype: float64
    posterior_normalization_abs_error_max: 1.0e-10
    stable_tie_order: candidate_bank_order


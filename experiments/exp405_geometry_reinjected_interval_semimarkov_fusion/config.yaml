experiment:
  name: exp405_geometry_reinjected_interval_semimarkov_fusion
  description: >-
    Design-frozen saved-OOF experiment that fuses the twelve exp293 physical
    paths with an exact interval semi-Markov posterior and a docking-independent
    exp226 geometry re-injection floor. Current-test implementation is forbidden
    unless every train-side scientific gate passes.
  hypothesis: >-
    H256 morphology likelihood around each saved path, H512-or-longer segment
    persistence, and unconditional geometry re-injection can recover the strong
    exp293 interval oracle headroom without the wrong-mode lock-in observed in
    exp399.
  route: pf_beam
  status: scientific_fail_closed_exp406_stage0_unlocked
  created_at: "2026-07-26"
  updated_at: "2026-07-26"
  inference_enabled: false
  submission_enabled: false

lineage:
  parent: exp293_physics_only_candidate_bank_headroom_contract
  promotion_control: exp263_last_anchor_better_candidate_confidence_pair_cache
  reporting_fold_source: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  hidden_like_source: exp115_hidden_like_spatial_holdout_from_ppt
  steering: ../../.steering/20260726-exp405-geometry-reinjected-interval-semimarkov-fusion
  references:
    - exp297_prefix_calibrated_latent_registration_gr_evidence
    - exp399_soft_sticky_fused_exact_runtime_audit
    - exp370_triggered_reset_rejuvenation_pf
    - experiments/exp293_physics_only_candidate_bank_headroom_contract/downstream_branch_contract.md
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep all twelve exp293 path values and identities fixed. Replace the failed
    exp297 prefix-affine evidence and exp399 docking-dependent branch transition
    with block-local, shift-marginalized GR morphology evidence and an exact
    explicit-duration posterior. New segments always retain an exp226_k16
    geometry prior floor independent of docking. No path, PF, HMM, Beam, ML
    model, selector, or parent control is regenerated.


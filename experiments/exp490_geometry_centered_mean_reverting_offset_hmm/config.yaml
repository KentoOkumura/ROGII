model:
  name: geometry_centered_mean_reverting_huber_residual_offset_exact_hmm
  estimator: deterministic_exact_forward_backward_on_residual_offset_and_rate
  coordinate:
    geometry: saved_group_safe_exp226_tvt_geop
    residual_offset: delta_t_equals_tvt_t_minus_geometry_t
    residual_rate: q_t_in_ft_per_md_ft
  k16_segment:
    count: 16
    policy: exact_exp226_unknown_suffix_equal_row_count_segments
    boundary_transition_owner: destination_row_segment
    span_definition: sum_positive_dmd_for_transitions_entering_segment
    require_positive_span: true
  mean_reversion:
    active_variants: [k16_segment_span_half_life]
    half_life_segments: 1.0
    rho_formula: rho_t_equals_2_power_minus_dmd_t_over_destination_segment_md_span
    rate_transition_center: mom_times_rho_t_times_q_previous
    offset_transition_center: rho_t_times_delta_previous_plus_q_t_times_dmd_t
    zero_state_identity: tvt_t_equals_exp226_tvt_geop_t
    hard_reset: false
    gr_confidence_gate: false
    segment_cumulative_rho_atol: 0.0000000001
  hmm:
    delta_min_ft: -80.0
    delta_max_ft: 80.0
    step_ft: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    mom: 0.998
    start_delta_ft: 0.0
    start_sig_ft: 0.75
    initial_rate: 0.0
    initial_rate_sig: 0.01
    output: forward_backward_posterior_mean
    position_kernel_support_cells: 5
  emission:
    kind: huber_raw_gr
    huber_delta: 1.345
    lam: 1.0
    sigma_mode: known_prefix_residual_std
    sigma_clip: [10.0, 60.0]
    additional_likelihood_clip: none
    missing_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
  forbidden_rescue:
    - half_life_grid
    - huber_delta_grid
    - state_grid_change
    - process_noise_change
    - gr_confidence_gate
    - hard_reset
    - blend
    - selector
    - same_oof_winner_selection
  persistent_episode:
    error_threshold_ft: 10.0
    minimum_consecutive_rows: 128
    recovery_threshold_ft: 5.0
    recovery_horizons_rows: [256, 512]
    sse_windows: fixed_exp408_parent_episode_boundaries
    episode_count_policy: recompute_on_exp357_and_candidate_with_fixed_definition


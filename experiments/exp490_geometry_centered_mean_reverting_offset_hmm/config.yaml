experiment:
  name: exp490_geometry_centered_mean_reverting_offset_hmm
  description: >-
    Add one K16-segment-half-life geometry-centered mean-reversion transition
    to the saved exp357 Huber residual-offset exact HMM. Kaggle private CPU
    Stage 0 completed fail-closed because the full-runtime projection and
    matched-control by-well p95 gates failed. A later explicit user override
    ran the unchanged single variant in four target-free full-OOF shards.
    Full pooled RMSE and persistent error improved strongly, but by-well p95
    and worst-well regression failed, so the experiment remained fail-closed.
    After submission ref 55163886 failed on hidden rerun, inference version 2
    replaced only the public-size runtime guards with a full hidden-dynamic
    test inventory contract; the train result and physical model are unchanged.
    Version 2 passed hidden rerun and scored Public LB 9.680, which does not
    promote the fixed-strength model because Stage 1 tail gates remain failed.
  route: pf_beam
  status: hidden_dynamic_inference_v2_scored_public_lb_9p680_stage_1_fail_close_preserved
  created_at: "2026-07-30"
  updated_at: "2026-08-02"

lineage:
  parent: exp357_exp226_huber_emission_independent_audit
  steering: ../../.steering/20260730-exp490-geometry-centered-mean-reverting-offset-hmm
  structural_reference: exp281_exp226_residual_offset_exact_hmm_transition_probe
  geometry_reference: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  mechanism_reference: exp408_hmm_message_rate_basin_audit
  diff_summary: >-
    Keeps the complete exp357 Huber residual-offset HMM fixed and adds rho_t,
    whose half-life is one destination exp226 K16 segment MD span, to both the
    residual-offset and residual-rate transition centers. No hard reset,
    GR-confidence gate, parameter grid, blend, selector, or control rerun is
    included.


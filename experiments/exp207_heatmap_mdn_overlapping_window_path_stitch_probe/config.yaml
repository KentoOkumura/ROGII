experiment:
  name: "exp207_heatmap_mdn_overlapping_window_path_stitch_probe"
  description: >
    Train-side diagnostic for stitching exp202 heatmap MDN local topK window
    paths into full-well path candidates.
  route: pf_beam
  status: kaggle_train_v2_complete_diagnostic_only
  created_at: "2026-07-06"
  updated_at: "2026-07-06"

lineage:
  parent: exp202_heatmap_mdn_candidate_generator_probe
  backlog: heatmap_mdn_overlapping_window_path_stitch_probe
  comparison_parent: exp099_pf_multi_observation_likelihood_probe
  discussion_source: docs/discussions/rogii-wellbore-geology-prediction-699853-multi-trajectory-prediction-mtp-with-deep-cnn-for-welllog-inversion-fullcsv.md
  implementation_source: heatmap_mdn_overlapping_window_path_stitch_probe.py
  diff_summary: >
    Reuses exp202 v2 local heatmap MDN top10 path artifacts and greedily stitches
    per-window path choices with target-free score, overlap disagreement, path
    smoothness, and gap-continuity costs. The output is a diagnostic candidate
    path set evaluated only after stitching against the exp099 PF/Beam candidate
    cache. It does not train a selector, regenerate dense CNN windows, perform
    direct TVT replacement, average heatmap paths into a prediction, replace PF
    weights, run inference, or submit.

validation:
  strategy: cached_exp202_local_path_stitch_train_side_oracle_probe
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: exp099_pseudo_tail_rows_intersecting_stitched_window_coverage
  secondary_metrics:
    - existing_union_on_stitched_rows_oracle_rmse
    - stitched_only_top1_oracle_rmse
    - stitched_only_top3_oracle_rmse
    - existing_plus_stitched_top3_oracle_rmse
    - new_best_candidate_rate
    - row_coverage_rate_vs_exp099_cache
    - source_overlap_pair_count
    - overlap_abs_disagreement
    - gap_boundary_abs
    - path_step_abs_mean
    - curvature_abs_mean
  leakage_policy:
    - Stitch score uses only exp202 predicted center scores, candidate rank, predicted local path smoothness, adjacent-window overlap disagreement, and gap boundary continuity.
    - "`true_tvt_path`, `true_center_tvt`, `center_abs_error`, oracle rank, within10, and absolute-error columns are not loaded for stitching."
    - exp099 target is used only after stitched paths are fixed, for train-side oracle readout.
    - Current exp202 v2 path artifact is sparse validation-sample output; coverage and overlap are reported explicitly before interpreting results.
    - No direct TVT replacement, softmax weighted average, PF weight replacement, postprocess blend, inference, or submission is in scope.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp202_path_npz_local: experiments/exp202_heatmap_mdn_candidate_generator_probe/kaggle/output/train_v2/artifacts/exp202_heatmap_mdn_candidate_generator_probe_heatmap_candidate_paths_top10.npz
  exp202_path_samples_local: experiments/exp202_heatmap_mdn_candidate_generator_probe/kaggle/output/train_v2/artifacts/exp202_heatmap_mdn_candidate_generator_probe_heatmap_candidate_path_samples.csv.gz
  exp099_train_feature_cache_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_train_features.csv.gz

model:
  name: heatmap_mdn_overlapping_window_path_stitch_probe
  estimator: deterministic_cached_path_stitch_beam
  params:
    local_path_parent: exp202_heatmap_mdn_candidate_generator_probe
    candidate_cache_parent: exp099_pf_multi_observation_likelihood_probe

stitching:
  inputs:
    path_npz: data.exp202_path_npz_local
    path_samples: data.exp202_path_samples_local
  local_topk: 10
  beam_width: 6
  output_topn: 3
  max_windows_per_well: null
  debug_max_wells: 3
  score_weights:
    score: 1.0
    rank: 0.05
    smoothness: 0.01
    overlap: 0.04
    boundary: 0.02
    rank_switch: 0.02
    score_eps: 0.000001
  output:
    save_row_level_paths: true
    save_window_assignments: true
    save_source_coverage: true
    save_candidate_union_readouts: true

candidate_union:
  enabled: true
  source_cache: data.exp099_train_feature_cache_local
  id_column: id
  target_delta_column: target
  last_known_tvt_column: last_known_tvt
  distance_column: md_since
  topk_values: [1, 3]
  within_ft: 10.0
  existing_candidates:
    - pf_ancc
    - beam_mean
    - likpf_mean
    - sc_ens
    - hyb
    - tvt_dense
    - tvt_densew
    - tvt_dense50
  required_existing_candidates:
    - pf_ancc
    - beam_mean
    - likpf_mean
    - sc_ens
    - hyb
  optional_existing_candidates:
    - tvt_dense
    - tvt_densew
    - tvt_dense50
  distance_buckets:
    - [0, 50]
    - [50, 100]
    - [100, 250]
    - [250, 500]
    - [500, 1000]
    - [1000, 1000000000]

runtime:
  use_amp: false
  num_workers: 0
  batch_size: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp202-heatmap-mdn-candgen-train
      - kentookumura/exp099-pf-multiobs-likelihood-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_random_sampling_cached_artifact_order_only
  stochastic_components:
    - upstream_exp202_pytorch_gpu_training
    - upstream_exp099_pfbeam_candidate_cache
  parallel_rng_policy: no_parallel_rng_in_exp207_stitching
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: false
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - exp207 stitching itself is deterministic given exp202 v2 and exp099 v2 artifacts.
    - It is not a deterministic submission anchor because it does not create a submission and depends on upstream GPU-trained exp202 paths.
    - gzip outputs record decompressed CSV content SHA.

audit:
  mode: heatmap_mdn_overlapping_window_path_stitch_probe
  output_prefix: exp207_heatmap_mdn_overlapping_window_path_stitch_probe
  expected_train_artifacts:
    - exp207_heatmap_mdn_overlapping_window_path_stitch_probe_stitched_path_rows.csv.gz
    - exp207_heatmap_mdn_overlapping_window_path_stitch_probe_stitched_window_assignments.csv.gz
    - exp207_heatmap_mdn_overlapping_window_path_stitch_probe_source_window_coverage.csv
    - exp207_heatmap_mdn_overlapping_window_path_stitch_probe_stitched_coverage_by_well.csv
    - exp207_heatmap_mdn_overlapping_window_path_stitch_probe_candidate_union_metrics.csv
    - exp207_heatmap_mdn_overlapping_window_path_stitch_probe_candidate_union_distance_bucket_metrics.csv
    - exp207_heatmap_mdn_overlapping_window_path_stitch_probe_candidate_union_by_well.csv
    - exp207_heatmap_mdn_overlapping_window_path_stitch_probe_summary.json

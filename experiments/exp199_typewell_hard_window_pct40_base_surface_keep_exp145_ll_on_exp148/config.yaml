inference:
  mode: train_side_mixed_provenance_diagnostic_first
  selected_variant: null
  selected_mode: null
  selected_model: null
  notes:
    - Initial implementation is train-side only.
    - Even if OOF improves, this mixed-provenance setup should not be submitted directly.
    - Clean exp196-base learned-likelihood regeneration follow-up was removed from backlog after the small exp199 gain.

notes:
  - Implements backlog `typewell_hard_window_pct40_base_surface_keep_exp145_ll_on_exp148`.
  - Planned Kaggle train cost is 1 active variant x 1 GPU mode x 3 LightGBM configs x 5 folds = 15 boosters.
  - Parent/control retraining is not included; exp148 CV/Public LB are historical baselines.
  - The active model keeps base 196 features, projection_correction, u_disagreement, and learned_likelihood_confidence, but the base surface is exp196 pct40 while ll_* remains exp145.
  - Because this mixes exp196 base candidate columns with exp145 learned-likelihood candidate TVT features, it is a diagnostic only and not a direct submission candidate.

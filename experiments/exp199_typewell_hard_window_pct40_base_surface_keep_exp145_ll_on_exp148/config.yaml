experiment:
  name: "exp199_typewell_hard_window_pct40_base_surface_keep_exp145_ll_on_exp148"
  description: Replace the exp148 base PF/Beam surface with exp196 pct40 hard-window cache while keeping exp145 learned-likelihood features.
  route: ml_model
  status: completed_train_side_supported_no_submit
  created_at: "2026-07-05"
  updated_at: "2026-07-05"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp196_typewell_late_range_hard_window_pct40_full_cache_replacement
  base_surface_pct50_parent: exp192_typewell_late_range_hard_window_pct50_full_cache_replacement
  legacy_cache_parent: exp072_exp063_full_replay_feature_cache
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp196_typewell_late_range_hard_window_pct40_full_cache_replacement
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp192_typewell_late_range_hard_window_pct50_full_cache_replacement
    - exp196_typewell_late_range_hard_window_pct40_full_cache_replacement
    - exp145_learned_likelihood_rawtest_feature_generator_parity
    - exp193_typewell_late_interval_context_features_addonly_on_exp148
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148
  implementation_source: typewell_hard_window_pct40_base_surface_keep_exp145_ll_on_exp148.py
  diff_summary: >
    Keeps the exp148 LightGBM training surface shape, but replaces the base
    196 PF/Beam replay cache and the derived projection_correction /
    u_disagreement groups with the exp196 pct40 hard-window full replay cache.
    The exp145 learned_likelihood_confidence ll_* block is kept unchanged.
    This is intentionally a mixed-provenance diagnostic: ll_* candidate TVT
    deltas still come from the exp145/exp072-derived learned-likelihood
    surface, while base candidate columns and U-projection features come from
    exp196. No exp148/control retraining is included.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_exp196_base_keep_exp145_ll_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp196_pct40_base_surface_and_exp145_full_train_ml_feature_cache
  leakage_policy:
    - Exp196 pct40 hard-window full replay features are raw-train-only deterministic cache columns generated by cutting typewell rows to typewell_pct >= 0.40 before PF/Beam generation.
    - Projection and U-disagreement features are recomputed from the exp196 base candidate columns, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features, and are kept unchanged for this mixed-provenance diagnostic.
    - ll_* candidate TVT delta features are mixed provenance: exp145 candidate TVT values are compared against exp196 last_known_tvt / likpf_mean_tvt after the row join.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache must cover the exp196 3,783,989-row train surface; any dropped rows fail the coverage check.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


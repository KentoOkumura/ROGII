  metric: stage0_identifiability_then_rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: tvt_input_unknown_suffix_only_after_agreement_and_prediction_freeze
  truth_attachment: after_agreement_coefficient_and_candidate_prediction_content_sha_freeze
  leakage_policy:
    - Agreement uses only raw finite known-prefix GR, TVT_input, and typewell GR.
    - Unknown-suffix TVT, error, abs_error, Formation, hidden-like roles, and worst-well identity are forbidden before coefficient freeze.
    - Hidden-like assignments and fold are late reporting strata and never coefficient inputs.


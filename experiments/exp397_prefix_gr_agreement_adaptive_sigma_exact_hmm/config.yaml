model:
  name: prefix_gr_agreement_adaptive_sigma_exact_hmm
  estimator: deterministic_exact_forward_backward
  active_variants: [prefix_rho_lt_0p50_sigma_x1p3]
  promotion_candidate: prefix_rho_lt_0p50_sigma_x1p3
  agreement:
    pair_policy: raw_finite_horizontal_gr_tvt_input_and_typewell_interp_only
    horizontal_value: raw_gr_without_missing_fill
    reference_value: typewell_gr_interpolated_at_known_tvt_input
    statistic: pearson_correlation_float64
    primary_window: full_known_prefix
    minimum_primary_pairs: 64
    minimum_standard_deviation: 1.0e-6
    threshold: 0.50
    threshold_boundary: multiplier_1
    good_or_equal_multiplier: 1.0
    poor_multiplier: 1.3
    insufficient_support_fallback_multiplier: 1.0
    computation_order: stable_sorted_well_id_then_raw_row_order
    forbidden_primary_inputs:
      - residual_rmse
      - residual_bias
      - normalized_bias
      - ncc
      - dtw
      - acf
      - tail_correlation
      - unknown_suffix_truth
      - error
      - formation
  sigma:
    alias_in_external_notebook: gs
    parent_name: sigma_gr
    parent_estimator: known_prefix_zero_filled_residual_population_std
    parent_clip: [10.0, 60.0]
    application_order: clip_parent_then_multiply_exactly_once
    post_multiplier_clip: null
    effective_range: [10.0, 78.0]
  emission:
    family: capped_gaussian
    formula: "-0.5 * min(((gr_eval - expected_gr_state) / sigma_eff)^2, 600)"
    normalization_constant: omitted_as_state_independent
    emission_clip_z2: 600.0
  stage_0:
    audit: full_prefix_agreement_identifiability_and_tail_stability
    truth_free: true
    hmm_well_runs: 0
    primary_window: full_known_prefix
    tail_window_raw_rows: 512
    minimum_tail_pairs: 32
    pass_requires_all:
      minimum_primary_evaluable_well_fraction: 0.90
      maximum_fallback_well_fraction: 0.10
      poor_multiplier_well_fraction_range: [0.10, 0.90]
      minimum_each_fold_primary_evaluable_fraction: 0.80
      minimum_tail_evaluable_well_fraction: 0.75
      minimum_full_tail_multiplier_agreement: 0.80
      minimum_full_tail_spearman_correlation: 0.70
  stage_1:
    enabled_condition: stage_0_all_gates_pass_and_separate_user_approval
    active_variants: [prefix_rho_lt_0p50_sigma_x1p3]
    rerun_policy: run_hmm_only_for_multiplier_1p3_wells
    no_op_policy: reuse_saved_exp209_prediction_for_multiplier_1_and_fallback_wells
    maximum_hmm_well_runs: 773
    reporting_folds: 5
  fixed_hmm:
    coordinate: absolute_tvt
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    band_pad: 100.0
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    momentum: 0.998
    sigma_mode: known_prefix_zero_fill_population_std_then_fixed_well_multiplier
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
    output: posterior_mean
    rate_center: zero
  forbidden:
    - continuous_or_quantile_multiplier_mapping
    - threshold_support_window_or_multiplier_grid
    - bias_rmse_ncc_dtw_acf_or_tail_primary_gate
    - finite_only_or_mad_sigma
    - affine_gr_calibration
    - row_varying_sigma
    - huber_student_t_or_mixture_emission
    - likelihood_temperature_or_post_multiplier_clip
    - transition_prior_or_state_grid_change
    - blend_weight_search
    - parent_control_rerun
    - same_oof_rescue

audit:
  output_prefix: exp397_prefix_gr_agreement_adaptive_sigma_exact_hmm
  coefficient_population: all_773_wells
  stability_population: full_and_tail_evaluable_wells_only

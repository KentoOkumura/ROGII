experiment:
  name: exp397_prefix_gr_agreement_adaptive_sigma_exact_hmm
  description: >-
    Design-frozen two-stage audit of a single per-well exact-HMM GR scale
    change. Compute raw finite known-prefix Pearson agreement between the
    horizontal GR and typewell GR at TVT_input, retain the exp209 scale for
    rho >= 0.50 or insufficient support, and multiply the already-clipped
    exp209 scale by 1.3 only for rho < 0.50.
  route: pf_beam
  status: stage_0_completed_guard_failed_closed
  created_at: "2026-07-25"
  updated_at: "2026-07-25"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../.steering/20260725-exp397-prefix-gr-agreement-adaptive-sigma-exact-hmm
  references:
    - exp307_finite_only_robust_sigma_gr
    - exp343_acf_effective_sample_likelihood_tempering_audit
    - exp346_exp209_observed_only_finite_sigma_gr_hmm
    - exp389_exp209_huber_exact_hmm_emission
  external_references:
    - https://www.kaggle.com/competitions/rogii-wellbore-geology-prediction/discussion/728712
    - https://www.kaggle.com/code/hjyact/ultimate-pf-config-strategy-a-reproducible-score
  diff_summary: >-
    Keeps the complete exp209 absolute-TVT Gaussian exact-HMM contract fixed
    and changes only one well-level scalar: multiply the clipped exp209
    sigma_gr by 1.3 when raw finite known-prefix GR Pearson correlation with
    the typewell GR is below 0.50. All other wells are an exact saved-control
    no-op.


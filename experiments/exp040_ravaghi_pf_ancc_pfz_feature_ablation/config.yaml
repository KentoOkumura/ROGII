experiment:
  name: "exp040_ravaghi_pf_ancc_pfz_feature_ablation"
  description: Ablate Ravaghi PF ANCC/PFZ-style confidence and divergence features in a pseudo-tail single LightGBM.
  route: ml_model
  status: completed
  created_at: "2026-06-08"
  updated_at: "2026-06-08"

lineage:
  parent: exp026_pseudo_tail_bucket_shrink_inference_submit
  supporting_artifact: exp029_public_sel15_pf_oof_feature_generation
  diff_summary: Compare single LightGBM models trained on exp029 train well の途中以降を隠した疑似 test rows with base geometry features versus add-only Ravaghi PF ANCC/PFZ-style delta, surface, uncertainty, and likelihood-margin feature families. Direct PF/Beam prediction replacement, Ridge/meta-stack, and train-only ANCC columns are intentionally excluded.

validation:
  leakage_policy:
    - Input rows come from exp029 pseudo-test artifacts where each train well was masked after the cutoff before public sel15 PF/Beam features were generated.
    - Splits are well-level only; the same well is never in train and validation for a candidate model.
    - target_tvt is used only as the supervised label and scoring label.
    - Error diagnostic columns pf_error, last_anchor_error, and beam_error are excluded from features.
    - exp026_oof and exp026 bridge columns are excluded from model features to keep this a single-model feature ablation rather than a stack.
    - Train-only formation columns such as ANCC are not read; pf_ancc and pf_z are represented only by target-safe proxies derived from exp029 PF outputs, Z/MD geometry, and pseudo-cutoff metadata.
    - Beam candidate values are not model features in this ablation; beam is retained only as a report control.
    - Candidate support requires improvement over the base single-LGBM control in both original-fold and well-hash audits; exp026 regenerated control is reported as an anchor, not used as a model feature.

data:
  feature_path: experiments/exp029_public_sel15_pf_oof_feature_generation/features/public_sel15_pf_oof_features.csv.gz
  source_well_summary_path: experiments/exp029_public_sel15_pf_oof_feature_generation/artifacts/public_sel15_pf_oof_well_summary.csv

model:
  name: ravaghi_pf_ancc_pfz_feature_ablation
  target: target_tvt_minus_last_anchor_tvt
  base_prediction: last_anchor_tvt
  estimator: LGBMRegressor
  params:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 80
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 0.1
    n_jobs: 2
  prediction:
    residual_shrink: 0.85
    max_abs_residual: 80.0
  training:
    max_train_rows_per_split: 300000
    max_train_rows_per_bucket: 60000
    seed: 42
  feature_sets:
    base_geometry:
      - pseudo_cutoff_fraction
      - cutoff_row
      - row_idx
      - prefix_length
      - eval_step
      - eval_fraction
      - MD
      - X
      - Y
      - Z
      - gr_isna
      - gr_prefix_availability
      - gr_eval_availability
      - last_anchor_tvt
    pf_ancc_delta_proxy:
      - pf_ancc_delta
      - pf_ancc_abs_delta
      - pf_ancc_surface_delta
      - pf_ancc_delta_per_eval_step
      - pf_vs_last_anchor
      - abs_pf_vs_last_anchor
    pf_z_proxy:
      - z_delta_from_cutoff
      - md_delta_from_cutoff
      - pf_z_delta_proxy
      - pf_z_proxy_delta_from_last_anchor
      - pf_vs_z_proxy
      - abs_pf_vs_z_proxy
    pf_uncertainty:
      - pf_ancc_std
      - pf_scale_mean_delta
      - pf_scale_std
      - pf_scale_range
      - pf_selected_vs_scale_mean
      - pf_scale_range_to_seed_std
      - pf_likelihood_margin
      - pf_lik_best
      - pf_lik_mean
      - pf_lik_std
      - pf_weight_entropy
      - pf_weight_top
      - pf_weight_best_second_gap
      - pf_effective_seeds
      - selector_code
      - selector_scale
      - selector_beam_weight
      - selector_hold_weight
      - selector_n_eval
      - selector_z_span
      - pf_gr_sigma_mean
      - pf_initial_rate_mean
      - pf_mean_effective_particles
      - pf_min_effective_particles
      - pf_resample_count_mean
  variants:
    - name: base_geometry
      feature_families: [base_geometry]
    - name: base_plus_pf_ancc_delta_proxy
      feature_families: [base_geometry, pf_ancc_delta_proxy]
    - name: base_plus_pf_z_proxy
      feature_families: [base_geometry, pf_z_proxy]
    - name: base_plus_pf_uncertainty
      feature_families: [base_geometry, pf_uncertainty]
    - name: base_plus_pf_ancc_pfz_core
      feature_families:
        - base_geometry
        - pf_ancc_delta_proxy
        - pf_z_proxy
    - name: base_plus_pf_ancc_pfz_uncertainty
      feature_families:
        - base_geometry
        - pf_ancc_delta_proxy
        - pf_z_proxy
        - pf_uncertainty

postprocess:
  selected_method: distance_bucket_shrink
  candidate_methods:
    - raw
    - distance_bucket_shrink
  methods:
    distance_bucket_shrink:
      name: exp014_bucket_shrink_params
      buckets:
        - {name: rows_0_49, max_step: 49, alpha: 0.20}
        - {name: rows_50_249, max_step: 249, alpha: 0.5917180252647632}
        - {name: rows_250_999, max_step: 999, alpha: 1.15}
        - {name: rows_1000_2499, max_step: 2499, alpha: 1.15}
        - {name: rows_2500_plus, max_step: 1000000000, alpha: 1.0490770312511664}

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  chunk_rows: 500000
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp029-sel15-pf-oof-train

audit:
  parent_exp026_clean_cv: 12.870780
  parent_exp026_raw_cv: 12.942938
  reference_control: base_geometry_bucket_shrink
  required_controls:
    - base_geometry_bucket_shrink
  report_controls:
    - last_anchor
    - public_pf_selector
    - pf090_hold010
    - beam
  well_holdout_folds: 5
  include_exp026_regenerated_control: true
  exp026_training:
    primary_strategy: drift_model
    drift_strategy: drift_model
    feature_set: no_gr_signal
    strategies:
      - last_anchor
      - recent_linear
      - drift_model
    params:
      recent_slope_window: 200
      recent_slope_shrink: 0.5
      max_abs_recent_slope: 0.08
      min_known_rows: 2
      gr_slope_window: 200
      max_abs_gr_slope: 2.0
      gr_roll_short: 25
      gr_roll_long: 100
      residual_shrink: 0.85
      max_abs_residual: 80.0
    drift_model:
      estimator: LGBMRegressor
      params:
        n_estimators: 800
        learning_rate: 0.03
        num_leaves: 31
        min_child_samples: 80
        subsample: 0.9
        colsample_bytree: 0.9
        reg_lambda: 0.1
        n_jobs: 2
    training:
      max_train_rows_per_fold: 300000
      max_train_rows_per_well: 800
    training_variants:
      selected_variant: pseudo_tail_3_cutoffs_distance_balanced
      variants:
        - name: pseudo_tail_3_cutoffs_distance_balanced
          cutoffs_per_well: 3
          cutoff_quantiles: [0.45, 0.65, 0.82]
          distance_balanced: true
          max_rows_per_pseudo_tail: 260
          balanced_rows_per_bucket: 60000
    pseudo_tail:
      min_prefix_rows: 200
      min_pseudo_eval_rows: 250
      cutoff_strategy: quantile
  distance_buckets:
    - {name: rows_0_49, max_step: 49}
    - {name: rows_50_249, max_step: 249}
    - {name: rows_250_999, max_step: 999}
    - {name: rows_1000_2499, max_step: 2499}
    - {name: rows_2500_plus, max_step: 1000000000}

notes:
  - This experiment evaluates Ravaghi PF ANCC/PFZ-style proxy features as add-only features for a single LightGBM.
  - It intentionally avoids direct ANCC formation columns and direct PF/Beam prediction replacement.
  - pf_ancc and pf_z are approximated from existing exp029 PF outputs generated under the pseudo-test condition and Z/MD geometry; exact Ravaghi Numba PF regeneration is outside this experiment.
  - Raw and fixed bucket-shrink CV are both recorded for every LightGBM feature variant.

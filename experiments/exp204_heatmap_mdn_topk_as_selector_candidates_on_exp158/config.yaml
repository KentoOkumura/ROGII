experiment:
  name: "exp204_heatmap_mdn_topk_as_selector_candidates_on_exp158"
  description: Closed selector-candidate experiment; heatmap-derived path generation route is rejected after exp202/203/207/208/210/212/215 diagnostics.
  route: pf_beam
  status: closed_rejected_heatmap_path_generation_route
  created_at: "2026-07-05"
  updated_at: "2026-07-07"

lineage:
  parent: exp203_heatmap_mdn_candidates_into_selector_features
  selector_parent: exp184_cnn_sdf_mtp_heatmap_path_features_on_exp158
  feature_only_parent: exp203_heatmap_mdn_candidates_into_selector_features
  ranker_parent: exp157_candidate_ranker_feature_enrichment
  continuity_parent: exp158_segment_continuity_selector_on_exp157
  heatmap_path_parent: exp182_cnn_sdf_mtp_heatmap_fullfold_geometry_probe
  heatmap_mdn_parent: exp202_heatmap_mdn_candidate_generator_probe
  feature_cache_parent: exp072_exp063_full_replay_feature_cache
  multiobs_parent: exp099_pf_multi_observation_likelihood_probe
  stress_parent: exp115_hidden_like_spatial_holdout_from_ppt
  implementation_source: heatmap_mdn_topk_as_selector_candidates_on_exp158.py
  diff_summary: >
    Historical implementation that extended exp203's heatmap MDN feature-only
    selector by adding exp202 hmdn_top1 ... hmdn_top10 row-interpolated TVT paths
    to the selectable candidate set. This path source is now considered
    insufficient for the normal selector-candidate premise because exp210 showed
    that covered-row heatmap paths do not provide full-grid trajectory coverage.
    Exp212 fixed full-grid rows but was fallback-heavy, and exp215 fixed
    fallback coverage but still produced weak learned-only / weighted paths.
    Do not rerun exp204 as-is or with exp212/exp215 heatmap paths. The
    heatmap-derived path generation route is closed as diagnostic history only.

validation:
  strategy: train_well_pseudotail_candidate_selector_oof_plus_viterbi_with_exp202_hmdn_top10_candidates
  metric: rmse
  secondary_metrics:
    - mae
    - within_10ft
    - oracle_label_accuracy
    - selection_distribution
    - path_switch_count
    - bucket_rmse
    - subgroup_rmse
    - worst_well_rmse
    - hmdn_confidence_bucket_rmse
    - hmdn_sparse_distance_bucket_rmse
    - hmdn_candidate_selection_rate
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Candidate values and target-free likelihood features are read from exp099 v2 and exp072 train-side pseudo-tail caches.
    - Selectable candidates are exp184's eight candidates plus exp202 hmdn_top1 ... hmdn_top10 row-interpolated TVT paths.
    - Dense candidates are reconstructed as last_known_tvt plus tvt_dense*_d columns, matching exp157/184.
    - Exp184 hmpf features use exp182 validation predictions exactly as the parent did.
    - Exp204 hmdn features and selectable candidates use exp202 heatmap candidate CSV columns available at feature time: predicted topK TVT, scores, score margin, entropy, path-step stats, prior center, row_center, and sparse sample geometry.
    - Exp202 true_center_tvt, target_in_grid, best_mode, abs-error, within10, oracle-best, and true-error rank columns are never loaded as features.
    - Sparse exp202 heatmap candidate rows are expanded to selector rows by within-well row-index interpolation before candidate labels are built.
    - Candidate-long labels use oracle-best candidate index and absolute candidate error only as training labels, not as feature columns.
    - Viterbi local costs use OOF predicted-error scores from the newly trained 18-candidate ranker. Transition penalties use candidate path geometry and target-free guard features only.
    - exp115 hidden-like roles are used only for result subgroup metrics, never for training features.
    - This is a train-side audit; no inference port or submission candidate is selected.


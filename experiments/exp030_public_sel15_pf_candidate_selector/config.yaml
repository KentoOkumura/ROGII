experiment:
  name: "exp030_public_sel15_pf_candidate_selector"
  description: Audit row/bucket/well candidate selection over public sel15 PF/Beam OOF-like features.
  route: pf_beam
  status: implemented
  created_at: "2026-06-07"
  updated_at: "2026-06-07"

lineage:
  parent: exp029_public_sel15_pf_oof_feature_generation
  diff_summary: Select among public sel15 PF, beam, hold, and conservative blend candidates using fold-held and well-hash-held audits.

validation:
  leakage_policy:
    - Input features were generated by exp029 with train well の途中以降を隠した疑似 test TVT_input masked after cutoff.
    - target_tvt and error columns are used only for scoring and candidate selection audits.
    - same-OOF best and oracle scores are diagnostics only.
    - Inference support requires both original-fold holdout and stable well-hash holdout to beat public_pf_selector and last_anchor controls.

data:
  feature_path: experiments/exp029_public_sel15_pf_oof_feature_generation/features/public_sel15_pf_oof_features.csv.gz
  source_well_summary_path: experiments/exp029_public_sel15_pf_oof_feature_generation/artifacts/public_sel15_pf_oof_well_summary.csv

model:
  name: public_sel15_pf_candidate_selector_audit
  params:
    controls:
      - public_pf_selector
      - last_anchor
    selection_policy: require_original_fold_and_well_hash_improvement

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  chunk_rows: 500000

audit:
  well_holdout_folds: 5
  raw_candidate: public_pf_selector
  control_candidates:
    - public_pf_selector
    - last_anchor
  distance_buckets:
    - {name: rows_0_49, max_step: 49}
    - {name: rows_50_249, max_step: 249}
    - {name: rows_250_999, max_step: 999}
    - {name: rows_1000_2499, max_step: 2499}
    - {name: rows_2500_plus, max_step: 1000000000}
  candidates:
    - name: last_anchor
      method: column
      column: last_anchor_tvt
      selectable: true
    - name: public_pf_selector
      method: column
      column: pf_pred
      selectable: true
    - name: pf_selected_scale
      method: column
      column: pf_selected_scale_pred
      selectable: true
    - name: pf_scale_8
      method: column
      column: pf_scale_8
      selectable: true
    - name: pf_scale_12
      method: column
      column: pf_scale_12
      selectable: true
    - name: pf_seed_mean
      method: column
      column: pf_seed_mean
      selectable: true
    - name: beam
      method: column
      column: beam_pred
      selectable: true
    - name: pf080_hold020
      method: blend
      weights: {pf_pred: 0.80, last_anchor_tvt: 0.20}
      selectable: true
    - name: pf090_hold010
      method: blend
      weights: {pf_pred: 0.90, last_anchor_tvt: 0.10}
      selectable: true
    - name: pf090_beam010
      method: blend
      weights: {pf_pred: 0.90, beam_pred: 0.10}
      selectable: true
    - name: pf080_beam010_hold010
      method: blend
      weights: {pf_pred: 0.80, beam_pred: 0.10, last_anchor_tvt: 0.10}
      selectable: true
    - name: pf_scale12_090_hold010
      method: blend
      weights: {pf_scale_12: 0.90, last_anchor_tvt: 0.10}
      selectable: true
    - name: pf_conf_fallback_hold
      method: confidence_fallback
      base: pf_pred
      fallback: last_anchor_tvt
      thresholds:
        max_pf_seed_std: 12.0
        max_abs_pf_beam_diff: 35.0
        min_gr_eval_availability: 0.25
      selectable: true
    - name: pf_conf_fallback_beam
      method: confidence_fallback
      base: pf_pred
      fallback: beam_pred
      thresholds:
        max_pf_seed_std: 10.0
        max_beam_spread: 20.0
        max_abs_pf_beam_diff: 30.0
      selectable: true
    - name: beam_tight_else_pf
      method: confidence_fallback
      base: beam_pred
      fallback: pf_pred
      thresholds:
        max_beam_spread: 5.0
        max_abs_pf_beam_diff: 20.0
      selectable: true

notes:
  - exp026_oof is not connected in exp029 feature artifact, so exp026 raw/bucket candidates are deferred.
  - This experiment is an audit only; it does not create a submission.

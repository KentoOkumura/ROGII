experiment:
  name: exp488_isolated_gr_shock_prior_hold_support_only
  description: >-
    Continue the frozen exp482 isolated-GR-shock intervention on a target-free
    top-32 shock-support manifest without requiring zero-shock control wells.
    Compare the candidate with the saved exp209 prediction on those same wells.
  hypothesis: >-
    The frozen exp482 trigger can improve the saved exp209 prediction on
    shock-enriched wells even though the preregistered zero-shock-well control
    requirement was infeasible.
  route: pf_beam
  status: stage0_failed_closed
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp482_isolated_gr_shock_prior_hold
  evidence:
    - exp408_hmm_message_rate_basin_audit
    - exp440_ambiguity_gated_predictive_prior_hmm
    - exp358_exp209_missing_distance_emission_downweight
    - exp363_sticky_gr_reliability_exact_hmm
    - exp389_exp209_huber_exact_hmm_emission
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260730-exp488-isolated-gr-shock-prior-hold-support-only
  diff_summary: >-
    Preserve the exp482 trigger, HMM, readout, thresholds, support ordering,
    and saved exp209 comparison. Change only Stage 0 sampling from support32
    plus zero-shock control32 to target-free support32 with no external
    zero-shock-well control group.


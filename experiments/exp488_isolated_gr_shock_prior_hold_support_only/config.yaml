notes:
  - Design branched from terminal exp482 on 2026-07-30.
  - The user explicitly removed the zero-shock-well control requirement.
  - The exp482 trigger, intervention, thresholds, and no-rescue policy remain unchanged.
  - Canonical train notebook adoption, Kaggle packaging, and support-only Stage A0/A1 are authorized.
  - Stage 1, inference, and submission still require separate explicit authorization.
  - Version 1 completed the 32-well computation but failed while serializing numpy.bool_ gate values.
  - Version 2 changes only generic JSON conversion from numpy.bool_ to bool.
  - Version 2 completed, but the frozen full trigger fired on 0 of 183093 rows.
  - Candidate and saved parent predictions were therefore identical on support32.
  - Technical runtime projection and saved-parent replay parity also failed.
  - Stage 1, inference, submission, and same-data rescue are closed.

experiment:
  name: exp293_physics_only_candidate_bank_headroom_contract
  description: >-
    Fixes the twelve exp263 Stage-1 raw-test-regenerable physical candidates and
    audits row, non-overlapping H128/H256/H512 block, and whole-well oracle
    headroom before any GR scorer, selector, decoder, candidate generation, or model fit.
  route: pf_beam
  status: kaggle_cpu_audit_completed_support_pass_stage2_required
  created_at: "2026-07-19"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp263_last_anchor_better_candidate_confidence_pair_cache
  references:
    - exp286_geop_hmm_sparse_addonly_candidate_on_exp264
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp290_piecewise_datum_physical_smoother
    - exp291_prefix_masked_typewell_gr_multimode_safe_beam
    - exp292_typewell_gr_warp_rate_identifiability_audit
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md physics_only_candidate_bank_headroom_contract
  design_source: docs/legacy/steering/20260719-exp293-physics-only-candidate-bank-headroom-contract
  downstream_contract: downstream_branch_contract.md
  diff_summary: >-
    Uses only the six exp263 raw-test primitives, their five fixed 50/50 raw-test
    pairs, and exp226_w500_50_50. Adds no candidate or observation score. It
    freezes the candidate bank, then reads truth only for row/block/whole-well
    oracle SSE and a fixed support PASS/FAIL decision that routes work to Stage 2
    or conditional Stage 4.

validation:
  strategy: fixed_deployable_physics_candidate_bank_oracle_headroom_audit
  metric: h512_oracle_rmse_and_required_sse_headroom_recovery_to_6p5
  seed: 42
  n_folds: 5
  trained_folds: 0
  group_column: well
  fold_policy: reuse_exp263_outer_fold_identity_without_refit
  expected_rows: 3783989
  expected_wells: 773
  score_rows: train_prediction_suffix_rows
  anchor_candidate: exp226_w500_50_50
  anchor_oof_rmse: 8.2383315465
  public_lb_goal: 6.5
  oracle_horizons_rows: [1, 128, 256, 512]
  primary_horizon_rows: 512
  include_final_short_block: true
  include_whole_well_oracle: true
  support_pass:
    maximum_pooled_h512_oracle_rmse: 5.5
    maximum_each_fold_h512_oracle_rmse_exclusive: 6.5
    require_h512_improvement_vs_anchor_all_folds: true
    require_required_recovery_to_6p5_finite: true
    maximum_required_recovery_to_6p5: 1.0
  diagnostic_only_risk_flags:
    - distance_1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - by_well_p95_and_worst
  leakage_policy:
    - Candidate inputs accept identity, fold, well, row index, MD context, and candidate TVT values only.
    - TVT, target, true_tvt, error, abs_error, and oracle columns are rejected before bank and block-assignment freeze.
    - True TVT is loaded through a separate post-freeze readout loader.
    - Truth never changes candidate membership, formula, order, block boundary, horizon, tie policy, subgroup, or support threshold.
    - Oracle prediction rows are not persisted.


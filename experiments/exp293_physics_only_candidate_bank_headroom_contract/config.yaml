audit:
  name: physics_only_candidate_bank_headroom
  output_prefix: exp293_physics_only_candidate_bank_headroom_contract
  work_chunk_rows: 100000
  tie_atol_squared_ft: 0.000000001
  distance_buckets_ft:
    000_050: [0.0, 50.0]
    050_100: [50.0, 100.0]
    100_250: [100.0, 250.0]
    250_500: [250.0, 500.0]
    500_1000: [500.0, 1000.0]
    1000_plus: [1000.0, .inf]
  block_partition:
    origin: first_prediction_suffix_row_per_well
    kind: non_overlapping_rows
    horizons_rows: [128, 256, 512]
    include_final_short_block: true
  oracle:
    objective: minimum_sum_squared_tvt_error
    row_tie_policy: candidate_order
    block_tie_policy: candidate_order
    whole_well_tie_policy: candidate_order
    persist_oracle_prediction: false
  headroom:
    target_rmse: 6.5
    formula: (anchor_sse-target_sse)/(anchor_sse-oracle_sse)
    report_for: [row, h128, h256, h512, whole_well]
  metrics:
    - pooled_rmse
    - fold_rmse
    - distance_bucket_rmse
    - h512_required_recovery_to_6p5
    - candidate_choice_count
    - candidate_unique_best_count
    - by_well_rmse
    - hidden_like_rmse
  expected_artifacts:
    - exp293_physics_only_candidate_bank_headroom_contract.json
    - exp293_physics_only_candidate_bank_input_manifest.csv
    - exp293_physics_only_candidate_bank_manifest.json
    - exp293_physics_only_candidate_bank_formula_parity.csv
    - exp293_physics_only_candidate_bank_block_assignment.csv.gz
    - exp293_physics_only_candidate_bank_oracle_metrics.csv
    - exp293_physics_only_candidate_bank_fold_metrics.csv
    - exp293_physics_only_candidate_bank_subgroup_metrics.csv
    - exp293_physics_only_candidate_bank_by_well.csv
    - exp293_physics_only_candidate_bank_choice_counts.csv
    - exp293_physics_only_candidate_bank_sha_manifest.csv
    - exp293_physics_only_candidate_bank_summary.json
  forbidden_actions:
    - add_or_remove_candidate
    - tune_formula_or_weight
    - candidate_score_or_selector
    - candidate_average_or_softmax_output
    - gr_likelihood_or_registration_fit
    - hmm_pf_or_beam_regeneration
    - train_model
    - persist_oracle_prediction
    - raw_test_inference
    - submission


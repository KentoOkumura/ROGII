experiment:
  name: "exp116_hidden_like_anchor_score_readout_on_exp115"
  description: Score existing anchor OOF/train-side predictions on the exp115 hidden-like spatial holdout split without retraining.
  route: ml_model
  status: implemented
  created_at: "2026-06-24"
  updated_at: "2026-06-24"

lineage:
  parent: exp115_hidden_like_spatial_holdout_from_ppt
  diagnostic_parents:
    - exp092_u_projection_correction_disagreement_fullrun
    - exp073_gpu_reproducibility_guard_for_exp063_full_replay
    - exp098_selector_rank_slot_features_on_exp073
  implementation_source: hidden_like_anchor_score_readout_on_exp115.py
  diff_summary: Uses exp115 saved Kaggle split artifacts as fixed hidden-like well masks and re-scores available existing OOF/train-side predictions for current ML anchors. It does not retrain models or create a submission.

# Defaults come from project.yml. Add keys here only when this experiment intentionally differs.
validation:
  strategy: exp115_hidden_like_holdout_stress_readout
  metric: rmse
  secondary_metrics:
    - mae
    - rows
    - wells
    - bucket_rmse
    - worst_well_delta
  group_column: well
  score_rows: existing_oof_or_train_side_prediction_rows
  leakage_policy:
    - exp115 split files define only which train wells are used for stress readout.
    - Existing prediction files are not refit on the exp115 valid wells.
    - True TVT is used only for scoring existing held-out predictions.
    - This is not an exact hidden split and must not be treated as a Public LB replacement.

# Common paths and submission columns come from project.yml.
data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt

model:
  name: no_new_model_existing_anchor_readout
  params:
    estimator: none
    retrain_on_exp115_split: false

readout:
  mode: hidden_like_anchor_score_readout_on_exp115
  output_prefix: exp116_hidden_like_anchor_score_readout_on_exp115
  max_sources: null
  exp115:
    fold_assignments_path_candidates:
      - experiments/exp115_hidden_like_spatial_holdout_from_ppt/kaggle/output/train_v1/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
      - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    holdout_wells_path_candidates:
      - experiments/exp115_hidden_like_spatial_holdout_from_ppt/kaggle/output/train_v1/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_holdout_wells.csv
      - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_holdout_wells.csv
    well_metadata_path_candidates:
      - experiments/exp115_hidden_like_spatial_holdout_from_ppt/kaggle/output/train_v1/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_well_metadata.csv
      - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_well_metadata.csv
    split_variants:
      - verification_like_spatial
      - verification_like_typewell_purged
  baseline_candidate:
    source: exp073
    variant: full_replay_repro_guard
    mode: gpu_repro_guard_dp_threads8
    model: lgb_mean
  bucket_edges_eval_rank:
    - 0
    - 50
    - 100
    - 250
    - 500
    - 1000
    - 1500
    - 2500
  bucket_columns:
    - eval_rank_bucket
    - spatial_bin
    - eval_length_bin
    - prefix_length_bin
    - gr_bin
    - tvt_bin
    - typewell_group_size_bin
  prediction_sources:
    - name: exp073
      display_name: exp073 full replay repro guard
      kind: row_predictions
      required: false
      path_candidates:
        - /tmp/kaggle-output/exp073_gpu_reproducibility_guard_for_exp063_full_replay/train_v2/artifacts/exp063_full_replay_repro_guard_predictions.csv.gz
        - experiments/exp073_gpu_reproducibility_guard_for_exp063_full_replay/kaggle/output/train_v2/artifacts/exp063_full_replay_repro_guard_predictions.csv.gz
        - /kaggle/input/exp073-full-replay-repro-guard-train/artifacts/exp063_full_replay_repro_guard_predictions.csv.gz
      id_col: id
      well_col: well
      target_col: target_tvt
      prediction_col: pred_tvt
      variant_value: full_replay_repro_guard
      include_model_mean: true
      model_mean_name: lgb_mean
    - name: exp098
      display_name: exp098 rank-slot features on exp073
      kind: row_predictions
      required: false
      path_candidates:
        - experiments/exp098_selector_rank_slot_features_on_exp073/kaggle/output/train_v1/artifacts/exp098_selector_rank_slot_features_on_exp073_predictions.csv.gz
        - /kaggle/input/exp098-selector-rank-slot-features-on-exp073-train/artifacts/exp098_selector_rank_slot_features_on_exp073_predictions.csv.gz
      id_col: id
      well_col: well
      target_col: target_tvt
      prediction_col: pred_tvt
      variant_value: rank_slot_u_disagreement
      include_model_mean: true
      model_mean_name: lgb_mean
    - name: exp092
      display_name: exp092 U-projection correction/disagreement
      kind: by_well_metrics
      required: false
      path_candidates:
        - /tmp/exp092_train_output_check/artifacts/exp092_u_projection_correction_disagreement_fullrun_by_well.csv
        - experiments/exp092_u_projection_correction_disagreement_fullrun/kaggle/output/train/artifacts/exp092_u_projection_correction_disagreement_fullrun_by_well.csv
        - /kaggle/input/exp092-uproj-corr-disagree-train/artifacts/exp092_u_projection_correction_disagreement_fullrun_by_well.csv
      well_col: well
      rows_col: rows
      rmse_col: rmse_tvt
      mae_col: error_abs_mean
      variant_value: u_projection_correction_plus_disagreement

runtime:
  use_amp: false
  num_workers: 1
  batch_size: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train
      - kentookumura/exp073-full-replay-repro-guard-train
      - kentookumura/exp098-selector-rank-slot-features-on-exp073-train
      - kentookumura/exp092-uproj-corr-disagree-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_new_rng_deterministic_csv_join
  stochastic_components:
    - upstream_exp073_pf_beam_feature_generation
    - upstream_exp073_lightgbm_training
    - upstream_exp092_lightgbm_training
    - upstream_exp098_lightgbm_training
  parallel_rng_policy: no_new_parallel_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    split_content_sha: true
    upstream_prediction_sha: true
    readout_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - No model is trained in exp116.
    - Gzip input SHA uses decompressed content when applicable.
    - exp115 is a stress holdout, not an exact hidden split.

notes:
  - exp092 row-level predictions were not available in the checked local output; by-well metrics are supported as a fallback input.

experiment:
  name: exp361_exp333_candidate_path_addone_novelty_audit
  description: >-
    Reinterprets the saved exp333 Stage 1 OOF as one add-on candidate path
    against the frozen exp293 deployable12 bank. Direct exp226/exp228/exp263
    scores are context only; the scientific decision uses the exp302 H512 and
    whole-well add-one novelty contract.
  route: ensemble
  status: kaggle_cpu_v2_completed_technical_pass_candidate_novelty_pass
  created_at: "2026-07-23"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp333_exp226_k16_segment_residual_offset_target
  direct_control: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  rowwise_residual_context: exp228_direct_residual_correction_on_exp226
  fixed_blend_context: exp263_last_anchor_better_candidate_confidence_pair_cache
  candidate_bank_contract: exp293_physics_only_candidate_bank_headroom_contract
  novelty_contract: exp302_exp226_multiscale_k_segment_candidate_audit
  design_source: .steering/20260723-exp361-exp333-candidate-path-addone-novelty-audit
  diff_summary: >-
    Adds the frozen exp333 Stage 1 OOF as exactly one candidate to the
    unchanged exp293 deployable12 bank. No prediction, model, block,
    candidate weight, selector, or direct-promotion threshold is tuned.

validation:
  strategy: fixed_exp333_oof_addone_against_exp293_deployable12
  metric: rmse
  seed: 42
  n_folds: 5
  trained_folds: 0
  group_column: well_id
  fold_source: exp333_saved_outer_fold_equal_to_exp226_saved_oof_fold
  fold_roles:
    evaluation: exp333_outer_fold
    candidate_bank_provenance: exp263_outer_fold
    frozen_block_sha: exp293_saved_assignment
  require_evaluation_and_bank_fold_equality: false
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  control_candidate: exp226_k16
  control_oof_rmse_ft: 9.427109596582213
  added_candidate: exp333_segment_offset
  expected_added_candidate_oof_rmse_ft: 9.076676660936826
  report_scopes:
    - pooled
    - fold
    - distance_bucket
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - by_well_p50_p95_worst
  candidate_novelty_horizons_rows: [128, 256, 512]
  primary_candidate_novelty_horizon_rows: 512
  include_whole_well_oracle: true
  include_final_short_block: true
  truth_join_policy: after_exp333_prediction_candidate_bank_and_block_sha_freeze


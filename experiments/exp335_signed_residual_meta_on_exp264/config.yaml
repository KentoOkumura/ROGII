      - exp226_k16__exact_hmm
      - exp226_k16__likpf_mean
      - selfgr_hmm_a070__likpf_mean
      - likpf_mean__exact_hmm
      - exp226_w500_50_50
    legal_domains: [primitive_pair_bank, primitive_fixed_bank]
    active_variants: [signed_residual_l2]
    objectives: [signed_residual]
    execution_count:
      outer_folds: 5
      inner_folds: 4
      planned_cpu_boosters: 20
      actual_cpu_boosters: 20
      existing_selector_retraining_boosters: 0
    sampling:
      namespace: exp264_stage_c
      use_parent_stage_c_sample_keys: true
    training:

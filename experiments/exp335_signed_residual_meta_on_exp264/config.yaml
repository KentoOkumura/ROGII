experiment:
  name: exp335_signed_residual_meta_on_exp264
  description: >-
    Keep the corrected exp264 Stage C v6 nested compact 74 features unchanged
    and add exactly 23 strict-nested signed-residual meta features. The new
    selector target is true_tvt minus candidate_tvt for the same 12 candidates
    and raw-test-safe 88-feature schema. The downstream TVT model remains the
    exp264 clean-273 three-config LightGBM surface. Stage S and the zero-booster
    preflight path are implemented, and the zero-booster Kaggle CPU preflight
    passed on kernel version 2. The one-objective strict-nested selector training
    run completed on Kaggle kernel version 3. All 20 models, the technical gate,
    and the pooled plus 5-of-5 fold score gate passed. Downstream training,
    Stage D implementation and the fixed 15-booster T4 run are approved after
    the Stage S gate passed. Stage D version 1 stopped before the first booster
    because the retained base-column request duplicated last_known_tvt; the
    order-preserving de-duplication fix and regression test are validated for a
    same-contract version 2 retry. Version 2 completed all 15 boosters and
    improved pooled RMSE from 8.460811 to 8.146108, but the frozen by-well and
    clean-control tail guards failed. The branch remains non-promotable, but a
    2026-07-23 explicit user override authorizes saved-model CPU inference and
    submission-file generation only. CPU inference version 3 completed on
    Kaggle CPU and its 14,151-row output passed submit-check. The user later
    submitted that code notebook and received Public LB 7.517. Agent-initiated
    submission remains disabled, and same-family rescue remains unauthorized.
  route: ml_model
  status: submission_scored_public_lb_7p517_train_guard_failed
  created_at: "2026-07-21"

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  source_selector: corrected_stage_c_v6
  source_downstream: corrected_stage_d_v3
  diff_summary: >-
    Reuse the saved corrected exp264 nested compact 74 features and clean 273
    downstream features without retraining. The single strict-nested
    signed-residual selector objective produced a fixed 23-feature compact to add to
    the downstream TVT model. Do not use exp287 formation features, replace the
    existing compact, or perform hard candidate selection.

validation:
  strategy: exp264_outer5_inner4_strict_nested_well_groupfold
  metric: rmse
  seed: 42
  n_outer_folds: 5
  n_inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_compact_partitions: 25
  saved_control:
    experiment: exp264_exp263_candidate_confidence_dual_selector
    stage: corrected_stage_d_v3
    feature_count: 347
    clean_feature_count: 273
    compact_feature_count: 74
    rmse: 8.460811237612477
    oof_sha256: b11c5005ca566f76588f4e1735386c15b8f016b874701a82e1c0741c8b839ae2
    metrics_sha256: 29cecbf758196ee8d9d877545f7f959ce44a138568edabde86526bbf70940acb
  leakage_policy:
    - Use inner OOF signed-selector predictions for every downstream outer-train row.
    - Use the four inner models fitted only on outer-train wells for each downstream outer-valid row.
    - Never expose true_tvt, target, actual error, actual rank, oracle_label, or is_oracle to the downstream feature matrix.
    - Reuse the saved corrected exp264 compact and control without retraining.


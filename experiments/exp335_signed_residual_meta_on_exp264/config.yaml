      predict_base_row_chunk_size: 20000
      num_boost_round: 1200
      early_stopping_rounds: 80
      log_evaluation_period: 100
    lightgbm_common:
      learning_rate: 0.035
      num_leaves: 63
      min_child_samples: 80
      subsample: 0.85
      subsample_freq: 1
      colsample_bytree: 0.85
      reg_alpha: 0.1
      reg_lambda: 1.0
      n_jobs: 8
      deterministic: true
      force_col_wise: true
      verbosity: -1
    forbidden:
      - label_clipping
      - huber_or_quantile_objective
      - target_transform_grid
      - candidate_specific_model_config
      - sample_weight_change
      - nonnested_stage_b_train
      - oracle_or_actual_error_feature

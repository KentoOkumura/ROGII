    distribution_features:
      - selector__pred_signed_residual_mean
      - selector__pred_signed_residual_std
      - selector__pred_signed_residual_range
    forbidden:
      - all_candidate_corrected_tvt_columns
      - signed_residual_hard_top1
      - softmax_candidate_average
      - viterbi_or_hard_switch
      - rolling_segment_or_well_aggregate
      - schema_grid
  downstream_tvt:

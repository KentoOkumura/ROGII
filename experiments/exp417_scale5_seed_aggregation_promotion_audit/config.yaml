experiment:
  name: exp417_scale5_seed_aggregation_promotion_audit
  description: >-
    Design-frozen saved-OOF promotion audit that compares the exp072 arithmetic
    mean over 128 likelihood-PF seeds with the fixed full-suffix likelihood
    temperature-5 weighted mean generated from the identical exp404 x1.0 seed
    bank.
  hypothesis: >-
    Replacing equal seed weights with the fixed temperature-5 likelihood
    weights safely converts the across-seed basin headroom identified by exp410
    into a general full-OOF gain without unacceptable fold, missing-GR,
    hidden-like, long-tail, or well-tail regressions.
  route: pf_beam
  status: stage_a_failed_closed_no_rescue
  created_at: "2026-07-27"
  updated_at: "2026-07-28"
  inference_enabled: false

lineage:
  parent: exp404_scale5_sigma_gr_likelihood_pf_ablation
  scientific_control: exp072_exp063_full_replay_feature_cache
  evidence:
    - exp410_likpf_particle_resampling_basin_audit
  references:
    - exp243_pf_seed_medoids
    - exp252_pf_seed_medoid_selectability_audit
    - exp413_scale5_likpf_full_replacement_on_exp335
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
  steering: ../../docs/legacy/steering/20260727-exp417-scale5-seed-aggregation-promotion-audit
  diff_summary: >-
    Stage A performs no PF replay and no fitting. It reads the SHA-frozen
    exp404 x1.0 trajectories and compares two readouts from the identical
    500-particle x 128-seed bank: arithmetic mean versus one fixed
    exp((loglik-max(loglik))/5) weighted mean. It does not change GR sigma,
    PF dynamics, roughening, particles, seeds, or any prediction value. It is
    distinct from exp404's x1.0-versus-x1.3 GR-sigma question and exp413's ML
    replacement/retraining question.


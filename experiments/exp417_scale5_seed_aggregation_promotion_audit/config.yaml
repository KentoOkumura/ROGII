validation:
  strategy: saved_oof_fixed_scale5_vs_arithmetic_seed_aggregation_promotion_audit
  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  primary_control: likpf_mean_x1p0
  primary_candidate: likpf_scale_5_x1p0
  gain_definition: rmse_arithmetic_mean_minus_rmse_scale5
  evidence_only_expected_control_rmse_ft: 11.594894395642696
  evidence_only_expected_candidate_rmse_ft: 10.914522073
  truth_attachment: after_saved_prediction_identity_and_logical_sha_freeze
  batch_inference_semantics: >-
    The aggregation uses the complete unknown-suffix GR sequence but no suffix
    TVT. This is non-causal/offline in sequence terms and valid only because
    Kaggle inference exposes the complete horizontal GR log before prediction.
  leakage_policy:
    - Stage A reads only already-frozen target-free prediction columns before truth, error, fold, or hidden-like role.
    - Both readouts must come from the identical x1.0 PF seed bank and seed labels.
    - Full-suffix log likelihood may use complete suffix GR but never suffix TVT, error, fold, hidden-like role, or Public LB.
    - exp410 truth-best seed and target-late episode/cause fields are forbidden.
    - Temperature 5 is fixed from existing evidence and is not selected in this experiment.


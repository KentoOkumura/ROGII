model:
  name: fixed_scale5_likelihood_weighted_seed_aggregation_audit
  estimator: none_saved_prediction_audit
  fitted_model: false
  pf_source_contract:
    particles: 500
    seeds: 128
    seed_indices: [0, 127]
    gr_scale_multiplier: 1.0
    transition: classic_exp072_surface_state
    rough_position: 0.10
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
  aggregation:
    control:
      name: arithmetic_seed_mean
      formula: sum_seed_prediction_divided_by_128
    candidate:
      name: full_suffix_likelihood_temperature_5_weighted_seed_mean
      temperature: 5.0
      formula: normalized_exp_of_centered_seed_total_loglik_divided_by_temperature
      target_free: true
      causal_online: false
      batch_inference_compatible: true
    other_aggregations_enabled: false
  execution_count:
    saved_candidate_readouts: 1
    scientific_candidates: 1
    pf_well_runs: 0
    parent_pf_control_reruns: 0
    model_configs: 0
    trained_folds: 0
    boosters: 0
    hmm_well_runs: 0
    beam_well_runs: 0
    gpu_runs: 0
    reporting_folds: 5


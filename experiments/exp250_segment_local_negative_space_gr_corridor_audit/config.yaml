experiment:
  name: exp250_segment_local_negative_space_gr_corridor_audit
  description: Segment-local minimum-bottleneck GR corridor audit for fixed PF/Beam candidates.
  route: pf_beam
  status: stage1_complete_guard_failed
  created_at: "2026-07-14"

lineage:
  parent: exp246_negative_space_gr_barrier_audit
  heatmap_references:
    - exp179_cnn_sdf_mtp_heatmap_probe
    - exp202_heatmap_mdn_candidate_generator_probe
  candidate_cache_parent: exp072_exp063_full_replay_feature_cache
  subgroup_parent: exp115_hidden_like_spatial_holdout_from_ppt
  diff_summary: >-
    Keeps exp246 raw inputs and fixed exp072 candidate values, but replaces the
    full-tail global surface and valid_after_history rule with independent MD
    256 ft overlap segments, well-wide robust GR normalization, and a directed
    minimum-bottleneck corridor that resets at every segment.

validation:
  strategy: train_side_official_evaluation_tail_segment_local_corridor_audit
  group_column: well
  score_rows: TVT_input_is_nan
  primary_metric: pooled_bad_candidate_auc_corridor_outside_fraction
  leakage_policy:
    - Segment starts, grids, normalization, source/sink, DP paths, and corridors use only raw input GR/MD/Z, typewell TVT/GR, row order, and known-prefix TVT.
    - Evaluation-tail TVT and candidate error are read only after each surface and corridor are fixed.
    - Hidden-like roles are aggregation-only and never affect segment or path construction.
    - Overlap views remain separate and are never combined into a row decision.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  target_column: TVT
  input_target_column: TVT_input
  gr_column: GR
  md_column: MD
  z_column: Z
  horizontal_suffix: __horizontal_well.csv
  typewell_suffix: __typewell.csv
  candidate_cache_filename: exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  candidate_cache_paths:
    - experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    - /kaggle/input/notebooks/kentookumura/exp072-exp063-full-replay-feature-cache-train/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    - /kaggle/input/exp072-exp063-full-replay-feature-cache-train/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  hidden_like_filename: exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
  hidden_like_paths:
    - experiments/exp115_hidden_like_spatial_holdout_from_ppt/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    - /kaggle/input/notebooks/kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv

model:
  name: none_segment_local_corridor_audit_only
  active_variants:
    - real_gr
    - shuffled_typewell_gr
  lightgbm_config_count: 0
  cnn_config_count: 0
  hmm_config_count: 0
  fold_training_count: 0
  booster_count: 0
  parent_control_retraining: false

audit:
  active_mode: stage1_full_audit
  allowed_modes:
    - stage0_preview
    - stage1_full_audit
  cache_chunksize: 200000
  max_wells: null
  expected_well_count: 773
  expected_candidate_row_count: 3783989
  bad_candidate_threshold_ft: 10.0
  segment:
    length_ft: 256.0
    stride_ft: 128.0
    horizontal_bin_ft: 4.0
    min_gr_points_per_bin: 2
    min_topology_columns: 16
    right_align_final_segment: true
  typewell_grid:
    half_width_ft: 256.0
    state_step_ft: 4.0
    state_count: 129
    target_free_prior: last_known_tvt_minus_z_delta
    endpoint_extrapolation: false
  normalization:
    scope: well_wide_separate_horizontal_and_typewell
    center: median
    scale: iqr_then_std_then_one
    robust_clip: 8.0
  control:
    seed: 42
    shift_fraction_min: 0.25
    shift_fraction_max: 0.75
    name: shuffled_typewell_gr
  graph:
    normal_dy_states: [-1, 0, 1]
    single_gap_dy_states: [-2, -1, 0, 1, 2]
    anchor_radius_ft: 8.0
    corridor_slack_cost: 0.25
    second_path_mask_radius_states: 1
  candidates:
    - name: pf_ancc
      source_column: pf_ancc
      transform: absolute
    - name: beam_mean
      source_column: beam_mean_d
      transform: base_plus_delta
    - name: likpf_mean
      source_column: likpf_mean_d
      transform: base_plus_delta
    - name: sc_ens
      source_column: sc_ens_d
      transform: base_plus_delta
    - name: hyb
      source_column: hyb_d
      transform: base_plus_delta
  distance_buckets:
    edges: [-1.0, 49.0, 99.0, 249.0, 499.0, 999.0, 1.0e30]
    labels: ["000_050", "050_100", "100_250", "250_500", "500_1000", "1000_plus"]
  buckets:
    flat_horizontal_z_std_max: 0.15
    long_tail_min_span_ft: 1000.0
  stage0:
    manual_parity_confirmed: true
    stable_normal_wells: 6
    high_gr_missing_wells: 2
    flat_gr_wells: 2
    long_tail_wells: 2
    segment_positions: [first, middle, last]
    plot_vmin: 0.0
    plot_vmax: 3.0
  stage1:
    enabled_after_stage0_confirmation: true
    save_full_row_audit: false
  guards:
    min_pooled_real_auc: 0.60
    min_real_minus_shuffled_auc: 0.02
    min_family_q90_lift: 1.50
    min_family_real_minus_shuffled_lift: 0.10
    max_overall_good_false_alert: 0.10
    max_family_good_false_alert: 0.15
    max_overlap_path_tvt_median_ft: 8.0
    max_overlap_path_tvt_p90_ft: 24.0
    min_overlap_risk_spearman: 0.70
    min_hidden_like_auc: 0.57
    max_hidden_like_auc_drop: 0.05
    max_by_well_good_false_alert_p95: 0.25
    max_by_well_good_false_alert: 0.50
    min_truth_coverage_real_minus_shuffled: 0.05
  outputs:
    summary_filename: exp250_segment_local_negative_space_gr_corridor_audit_summary.json
    segment_metrics_filename: exp250_segment_local_negative_space_gr_corridor_audit_segment_metrics.csv.gz
    candidate_segment_metrics_filename: exp250_segment_local_negative_space_gr_corridor_audit_candidate_segment_metrics.csv.gz
    candidate_metrics_filename: exp250_segment_local_negative_space_gr_corridor_audit_candidate_metrics.csv
    group_metrics_filename: exp250_segment_local_negative_space_gr_corridor_audit_group_metrics.csv
    overlap_metrics_filename: exp250_segment_local_negative_space_gr_corridor_audit_overlap_metrics.csv
    by_well_filename: exp250_segment_local_negative_space_gr_corridor_audit_by_well.csv
    stage0_plot_manifest_filename: exp250_segment_local_negative_space_gr_corridor_audit_stage0_plot_manifest.csv
    stage0_preview_manifest_filename: exp250_segment_local_negative_space_gr_corridor_audit_stage0_preview_manifest.json

runtime:
  num_workers: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: stable_sha_only_for_shuffled_typewell_gr
  stochastic_components:
    - upstream_exp072_pf_beam_candidate_cache
  parallel_rng_policy: sorted_single_process_no_global_rng
  gzip_policy: mtime_zero_raw_and_decompressed_sha
  notes:
    - The audit is deterministic for fixed raw files, candidate cache, config, and numerical-library versions.
    - It is not a prediction or submission anchor and inherits stochastic provenance from the saved exp072 candidate cache.

inference:
  enabled: false
  mode: train_side_only_diagnostic_guard
  create_submission: false
  notes:
    - Even a passing Stage 1 result may only start a separate fold-safe add-only confidence-feature experiment.
    - Candidate replacement, pruning, blending, raw-test generation, and submission remain prohibited.

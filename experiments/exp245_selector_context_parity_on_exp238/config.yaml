experiment:
  name: exp245_selector_context_parity_on_exp238
  description: Refit the exp238 nested candidate-error selector with a current-test reproducible context schema and zero missing-context fallback.
  route: ensemble
  status: train_complete_context_parity_pass_selector_guard_failed
  created_at: '2026-07-14'
lineage:
  parent: exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218
  selector_parent: exp237_hmm_exp226_candidate_selector_on_exp183
  candidate_parents:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp223_joint_typewell_self_gr_hmm_likelihood_probe
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  diff_summary: Remove 41 train-only copcf context columns, regenerate four exp226 diagnostic columns on current test, and require zero missing/nonfinite selector context. Direct candidate adoption is deferred to a follow-up experiment.
validation:
  strategy: outer5_inner4_groupkfold_by_well_nested_stacking
  group_column: well
  metric: rmse
  seed: 42
  outer_folds: 5
  inner_folds: 4
  guard:
    near_bucket: '000_050'
    max_near_delta_rmse: 0.0
    max_worst_well_regression: 0.25
    require_global_nonworse: true
    require_longtail_nonworse: true
    allow_failure_for_inference: false
model:
  name: parity_safe_nested_hmm_exp226_candidate_error_selector
  active_variants: [parity_safe_selector]
  selector_configs: 1
  selector_boosters: 20
  final_configs: 0
  final_boosters: 0
  total_boosters: 20
  parent_control_retraining: false
  selector:
    candidates:
      - pf_ancc
      - beam_mean
      - likpf_mean
      - sc_ens
      - hyb
      - tvt_dense
      - tvt_densew
      - tvt_dense50
      - blend_likpf_hmm_w500
      - hmm_selfgr_boost_only_a070_c100_mean_tvt
      - exp226_v6_k16_geometry_gr_u_projection
    objective: regression_l1_candidate_absolute_error
    max_train_long_rows_per_model: 120000
    max_valid_long_rows_per_model: 120000
    predict_chunk_rows: 50000
    expected_context_features: 143
    exp238_context_features: 184
    expected_removed_train_only_features: 41
    excluded_train_only_prefixes: [copcf_]
    required_exp226_diagnostic_columns:
      - exp226_geop_tvt
      - exp226_gr_delta
      - exp226_geop_minus_pred
      - exp226_geop_minus_pred_abs
    params:
      n_estimators: 1200
      learning_rate: 0.04
      num_leaves: 31
      max_depth: 8
      min_child_samples: 80
      subsample: 0.85
      colsample_bytree: 0.85
      reg_alpha: 0.1
      reg_lambda: 1.0
      n_jobs: -1
      verbose: -1
  forbidden:
    - copcf_train_only_context
    - missing_context_nan_fallback
    - median_or_zero_schema_fill
    - direct_replacement
    - final_lightgbm_training
    - same_fold_target_features
inference:
  status: blocked_until_selector_guard_passes
  mode: saved_outer5_inner4_selector_current_test_regeneration
  selector_model_source: exp245_saved_nested_selector_models
  selector_model_count: 20
  selector_training_during_inference: false
  expected_missing_context_columns: 0
  expected_nonfinite_context_values: 0
  submission_requested: false
  public_test_row_artifacts_allowed: false
runtime:
  kaggle:
    enabled: true
    internet: false
    selector_gpu: false
    train:
      enable_gpu: false
    inference:
      enable_gpu: false
    train_kernel_sources:
      - kentookumura/exp099-pf-multiobs-likelihood-train
      - kentookumura/exp209-joint-exact-parity-train
      - kentookumura/exp223-selfgr-hmm-train
      - kentookumura/exp226-k16-kappa-repro-train
      - kentookumura/exp237-hmm-exp226-candidate-selector-exp183-train
    inference_kernel_sources:
      - kentookumura/exp245-selector-context-parity-train
      - kentookumura/exp209-joint-exact-parity-train
      - kentookumura/exp223-selfgr-hmm-train
    bootstrap_dependency_files:
      - source: experiments/exp237_hmm_exp226_candidate_selector_on_exp183/hmm_exp226_candidate_selector_on_exp183.py
        destination: exp237_source/hmm_exp226_candidate_selector_on_exp183.py
      - source: experiments/exp237_hmm_exp226_candidate_selector_on_exp183/settings.py
        destination: exp237_source/settings.py
      - source: experiments/exp237_hmm_exp226_candidate_selector_on_exp183/config.yaml
        destination: exp237_source/config.yaml
      - source: experiments/exp237_hmm_exp226_candidate_selector_on_exp183/rawtest_inference.py
        destination: exp237_source/rawtest_inference.py
      - source: experiments/exp237_hmm_exp226_candidate_selector_on_exp183/inputs/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
        destination: exp237_source/inputs/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
      - source: experiments/exp218_gr_wavelet_rotation_confidence_features_on_exp148/public_notebook_replay_audit.py
        destination: exp218_source/public_notebook_replay_audit.py
      - source: experiments/exp218_gr_wavelet_rotation_confidence_features_on_exp148/settings.py
        destination: exp218_source/settings.py
      - source: experiments/exp218_gr_wavelet_rotation_confidence_features_on_exp148/config.yaml
        destination: exp218_source/config.yaml
      - source: experiments/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/connortynan_k16_reproduction.py
        destination: exp226_source/connortynan_k16_reproduction.py
      - source: experiments/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/config.yaml
        destination: exp226_source/config.yaml
    push_requires_user_approval: true
reproducibility:
  seed: 42
  fold_policy: deterministic_groupkfold_by_well
  candidate_generation_seed_policy: inherit_exp218_exp209_exp223_stable_per_well_seed
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    input_sha: true
    fold_manifest_sha: true
    feature_schema_sha: true
    model_sha: true
    prediction_sha: true
audit:
  output_prefix: exp245_selector_context_parity_on_exp238
  selector_saved_model_directory: exp245_selector_context_parity_on_exp238_selector_models
  selector_saved_model_count: 20
  expected_train_artifacts:
    - exp245_selector_context_parity_on_exp238_fold_manifest.csv
    - exp245_selector_context_parity_on_exp238_context_schema.csv
    - exp245_selector_context_parity_on_exp238_selector_model_manifest.csv
    - exp245_selector_context_parity_on_exp238_selector_safety_metrics.csv
    - exp245_selector_context_parity_on_exp238_selector_by_well.csv
    - exp245_selector_context_parity_on_exp238_nested_scores_outer0.csv.gz
    - exp245_selector_context_parity_on_exp238_nested_scores_outer1.csv.gz
    - exp245_selector_context_parity_on_exp238_nested_scores_outer2.csv.gz
    - exp245_selector_context_parity_on_exp238_nested_scores_outer3.csv.gz
    - exp245_selector_context_parity_on_exp238_nested_scores_outer4.csv.gz
    - exp245_selector_context_parity_on_exp238_selector_summary.json
  expected_inference_artifacts:
    - exp245_selector_context_parity_on_exp238_current_test_selector_scores_outer0.csv.gz
    - exp245_selector_context_parity_on_exp238_current_test_selector_scores_outer1.csv.gz
    - exp245_selector_context_parity_on_exp238_current_test_selector_scores_outer2.csv.gz
    - exp245_selector_context_parity_on_exp238_current_test_selector_scores_outer3.csv.gz
    - exp245_selector_context_parity_on_exp238_current_test_selector_scores_outer4.csv.gz
    - exp245_selector_context_parity_on_exp238_current_test_selector_model_manifest.json
    - exp245_selector_context_parity_on_exp238_current_test_selector_summary.json

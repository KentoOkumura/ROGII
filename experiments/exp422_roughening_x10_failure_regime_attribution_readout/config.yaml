validation:
  strategy: saved_output_target_free_two_axis_failure_regime_attribution
  metric: rmse
  primary_gain_definition: rmse_exp072_control_minus_rmse_exp416_roughening_x10
  secondary_well_gain_definition: control_rmse_minus_candidate_rmse
  episode_gain_definition: control_sse_minus_candidate_sse
  metric_weighting:
    row_primary: unweighted_suffix_rows
    well_association: equal_weight_per_well
    episode: raw_sse
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  group_column: well_id
  expected_rows: 3783989
  expected_wells: 773
  expected_persistent_episode_wells: 12
  expected_persistent_episodes: 16
  expected_persistent_episode_rows: 55104
  expected_candidate_rmse_ft: 13.617717557749454
  expected_control_rmse_ft: 11.594894395642696
  expected_candidate_minus_control_rmse_ft: 2.022823162106759
  metric_parity_absolute_tolerance_ft: 1.0e-6
  outcome_attachment: >-
    after well-regime feature, score, assignment, row-scope, schema, and logical
    content SHA freeze
  leakage_policy:
    - Regime features use only the exp416 well audit and reporting-fold identity.
    - Candidate prediction values are excluded from every score and regime formula.
    - Truth-derived by-well and episode metrics are not opened before regime freeze.
    - exp072 control and exp226 suffix truth are attached only after regime freeze.
    - Individual diagnostic results cannot replace either primary score or the fixed target cell.


readout:
  unit: well
  outer_reference_policy: other_four_reporting_folds_only
  empirical_cdf_formula: count_reference_values_less_than_or_equal_to_x_divided_by_reference_count
  raw_diagnostics:
    resampling_rate:
      formula: resampling_count_total_divided_by_seeds_times_eval_rows
      score_direction: higher_recovery_pressure
    ess_collapse:
      formula: one_minus_clip_minimum_ess_mean_divided_by_particles_zero_one
      score_direction: higher_recovery_pressure
    seed_prediction_dispersion:
      formula: log1p_seed_prediction_std_mean
      score_direction: higher_recovery_pressure
    seed_likelihood_gap:
      formula: log1p_max_seed_loglik_best_per_row_minus_seed_loglik_mean_per_row_zero
      score_direction: higher_recovery_pressure
    eval_missing_fraction:
      formula: eval_raw_gr_missing_rows_divided_by_eval_rows
      score_direction: higher_damage_exposure
    suffix_horizon:
      formula: log1p_eval_rows
      score_direction: higher_damage_exposure
  scores:
    recovery_pressure:
      components:
        - resampling_rate
        - ess_collapse
        - seed_prediction_dispersion
        - seed_likelihood_gap
      aggregation: equal_weight_mean_of_outer_fold_empirical_cdf_percentiles
      high_rule: score_strictly_greater_than_outer_reference_median
    damage_exposure:
      components:
        - eval_missing_fraction
        - suffix_horizon
      aggregation: equal_weight_mean_of_outer_fold_empirical_cdf_percentiles
      low_rule: score_less_than_or_equal_to_outer_reference_median
  primary_target_cell: high_recovery_pressure__low_damage_exposure
  secondary_mediators:
    position_clip_rate: position_clip_count_total_divided_by_seeds_times_eval_rows
    prefix_missing_fraction: prefix_gr_missing_rows_divided_by_prefix_rows
    gr_scale_clipped: identity
  fixed_row_scopes:
    normalized_suffix_progress_edges: [0.0, 0.25, 0.5, 0.75, 1.0]
    singleton_suffix_progress: 0.0
    raw_gr_status: [observed, missing]
    md_since_1000_ft: [below, at_or_above]
  individual_diagnostics_are_secondary_only: true


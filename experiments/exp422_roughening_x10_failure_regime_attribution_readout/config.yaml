experiment:
  name: exp422_roughening_x10_failure_regime_attribution_readout
  description: >-
    Design-frozen saved-output attribution readout for the exp416 roughening-x10
    failure. It tests one target-free two-axis well-regime hypothesis explaining
    the split between persistent-offset recovery and global OOF damage.
  hypothesis: >-
    Roughening x10 helps wells with high particle-recovery pressure but harms
    wells with high missing-GR and long-suffix damage exposure; one fold-safe
    target-free regime therefore explains both the local persistent-episode gain
    and the global regression.
  route: pf_beam
  status: no_reproducible_target_free_regime_close_attribution_branch
  created_at: "2026-07-28"
  implementation_enabled: true
  inference_enabled: false

lineage:
  parent: exp416_roughening_x10_likpf_full_oof_ablation
  scientific_control: exp072_exp063_full_replay_feature_cache
  reporting_source: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  references:
    - exp410_likpf_particle_resampling_basin_audit
    - docs/06_reproducibility.md
  steering: ../../docs/legacy/steering/20260728-exp422-roughening-x10-failure-regime-attribution-readout
  diff_summary: >-
    Generate no PF path, model, or prediction. Reuse the SHA-frozen exp416
    roughening-x10 candidate, well audit, by-well metrics, and persistent-episode
    metrics together with the saved exp072 control and exp226 reporting data.
    Before outcome attachment, freeze one equal-weight recovery-pressure score,
    one equal-weight damage-exposure score, fold-safe median splits, and one
    high-recovery/low-exposure target cell. This is attribution only and does not
    implement adaptive roughening or reclassify exp416.


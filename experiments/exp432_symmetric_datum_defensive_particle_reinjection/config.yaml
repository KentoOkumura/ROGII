  gpu_runs: 0

reproducibility:
  deterministic_anchor: false
  seed_policy: stable_sha256_per_immutable_well_seed_event_particle
  stochastic_components:
    - particle_transition
    - proposal_component_draw
    - resampling
  parallel_rng_policy: local_keyed_streams_independent_of_shard_and_resume_order
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    package_versions: true
    input_sha: true
    sample_manifest_sha: true
    trigger_schedule_sha: true
    event_ledger_sha: true
    common_random_ledger_sha: true
    branch_ancestry_sha: true
    importance_ratio_sha: true
    trajectory_sha: true
    prediction_sha: true
    metrics_sha: true

forbidden:
  - beta_direction_or_sign_in_treatment
  - change_pf_target_density
  - omit_or_clip_importance_ratio
  - repeated_reinjection
  - trigger_or_mixture_or_datum_grid
  - global_roughening_or_process_noise_change
  - huber_affine_ar1_or_self_gr
  - implementation_or_execution_without_explicit_approval

notes:
  - "exp410 and exp412 remain terminal negative results; this is a new direction-free proposal mechanism."
  - "Stage0 fixed32 is a mechanism sample, not CV or promotion evidence."

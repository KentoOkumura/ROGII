experiment:
  name: "exp148_learned_likelihood_fulltrain_addonly_on_exp092"
  description: Add exp145 full-train target-free learned likelihood confidence features to the exp092 U-projection LightGBM surface.
  route: ml_model
  status: ml_route_anchor_public_lb_7p960
  created_at: "2026-06-27"
  updated_at: "2026-06-28"

lineage:
  parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp092_u_projection_correction_disagreement_fullrun
    - exp127_learned_likelihood_features_on_exp092
    - exp144_learned_likelihood_hidden_stress_and_rawtest_parity
    - exp145_learned_likelihood_rawtest_feature_generator_parity
  implementation_source: learned_likelihood_fulltrain_addonly_on_exp092.py
  diff_summary: Keeps the exp092 U-projection correction plus disagreement feature surface and original residual target, replaces exp127's 155-well exp112 subset features with exp145 full-train learned likelihood features, and trains only the add-only learned likelihood confidence variant while comparing against historical exp092 metrics.

validation:
  strategy: groupkfold_by_well_exp092_surface_full_train_exp145_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_and_exp145_full_train_ml_feature_cache
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache covers the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json
  learned_likelihood_train_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_full_train_ml_features.csv.gz
  learned_likelihood_rawtest_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_rawtest_ml_features.csv.gz
  learned_likelihood_train_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_rawtest_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_train_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  learned_likelihood_rawtest_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  exp099_artifact_dir_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts
  exp099_train_feature_cache_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_train_features.csv.gz
  exp099_feature_schema_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_feature_schema.csv
  exp111_artifact_dir_local: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts
  exp111_feature_schema: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts/exp111_learned_pf_observation_likelihood_probe_feature_schema.csv
  exp111_model_manifest: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts/exp111_learned_pf_observation_likelihood_probe_model_manifest.json
  exp112_artifact_dir_local: experiments/exp112_learned_pf_likelihood_weight_or_feature_followup/kaggle/output/train_v1/artifacts
  exp112_feature_schema: experiments/exp112_learned_pf_likelihood_weight_or_feature_followup/kaggle/output/train_v1/artifacts/exp112_learned_pf_likelihood_weight_or_feature_followup_feature_schema.csv

model:
  name: exp148_learned_likelihood_fulltrain_addonly_on_exp092_lgbm
  source_experiment: exp092_u_projection_correction_disagreement_fullrun
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  learned_likelihood_feature_experiment: exp145_learned_likelihood_rawtest_feature_generator_parity
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_exp145_full_train_ml_features
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  feature_ablation:
    selected_variant: learned_likelihood_confidence_addonly
    active_variants:
      - name: exp092_fulltrain_control
        description: Disabled by user request; use historical exp092 metrics as the comparison baseline unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
        enabled: false
      - name: learned_likelihood_confidence_addonly
        description: Adds exp145 target-free learned likelihood probability, predicted-error, margin, entropy, candidate disagreement, multi-observation score, and weighted TVT proxy features.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    inference_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp148-train
      - kentookumura/exp099-pf-multiobs-likelihood-train
      - kentookumura/exp111-learned-pf-likelihood-train
      - kentookumura/exp112-learned-pf-likelihood-followup-train

generator:
  chunksize: 200000
  include_candidate_values: false
  default_candidate: likpf_mean
  candidates:
    - name: pf_ancc
      column: pf_ancc
    - name: beam_mean
      column: beam_mean
    - name: likpf_mean
      column: likpf_mean
    - name: sc_ens
      column: sc_ens
    - name: hyb
      column: hyb
  row_context_columns:
    - last_known_tvt
    - pf_ancc_std
    - beam_mean_d
    - sc_ens_d
    - hyb_d
    - eval_len
    - md_since
    - likpf_mean_d
  multiobs_global_columns:
    - multiobs_score_max
    - multiobs_score_mean
    - multiobs_score_gap
    - multiobs_top1_source_id
    - multiobs_top1_mae
    - multiobs_top1_ncc
  feature_cache:
    include_candidate_tvt: true
    include_multiobs_scores: true
    include_probability_features: true
    include_expected_error_features: true
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - gpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; feature merge itself has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a full-train add-only feature audit, not a deterministic submission anchor.
    - Inference code is implemented against exp145 raw-test features, but submission should wait for full-row OOF and worst-well review.

audit:
  mode: learned_likelihood_fulltrain_addonly_on_exp092_full_train_rows
  output_prefix: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  fast: false
  reference_metrics:
    exp092_full_lgb1_pooled_rmse: 9.322479895503927
    exp092_full_public_lb: 8.350
    exp127_subset_lgb_mean_delta_vs_control: -0.119735177
    exp112_gate_expected_error_delta_rmse_vs_likpf: -0.031143761763194888
  expected_train_artifacts:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_metrics.csv
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_by_well.csv
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_bucket_metrics.csv
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_projection_feature_summary.csv
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_learned_feature_summary.csv
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_feature_importance.csv
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_feature_importance_mean.csv
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_feature_importance_mean_top.png
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_predictions.csv.gz
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_feature_schema.csv
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_lgb_models/manifest.json
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092_summary.json

inference:
  mode: saved_lgb_booster_inference_with_rawtest_learned_likelihood_features
  selected_variant: learned_likelihood_confidence_addonly
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  notes:
    - Inference requires a completed exp148 train manifest with saved boosters.
    - Direct submission should wait for OOF, worst-well, and feature parity review.

notes:
  - Implements the exp145 next action: reuse full-train/raw-test learned likelihood cache in an exp092 full-row add-only model.
  - Primary decision is whether learned likelihood confidence signals still help exp092 when the subset limitation from exp127 is removed.

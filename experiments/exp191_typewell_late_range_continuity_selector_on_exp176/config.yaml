inference:
  mode: not_selected_train_side_audit_only
  selected_variant: null
  notes:
    - Best train-side Viterbi variant is recorded for audit and downstream feature candidates, but no inference notebook candidate is selected by this implementation.
    - Global OOF and path continuity are positive, while near-row buckets show small regressions, so direct inference and submission remain out of scope.
    - Any downstream use should be a confidence or segment-stability feature surface, with raw-test parity, worst-well, near-row, 1000_plus, and hidden-like review before inference work.

notes:
  - Implements the KAGGLE_DIRECTION backlog item `typewell_late_range_continuity_selector_on_exp176`.
  - Planned Kaggle train cost before push is 1 posthoc audit x 0 newly trained boosters; it reuses 15 saved exp176 boosters for OOF score reconstruction.
  - This audit does not use selected_tvt as a direct replacement, blend, postprocess, hard candidate invalidation, or submission generation.

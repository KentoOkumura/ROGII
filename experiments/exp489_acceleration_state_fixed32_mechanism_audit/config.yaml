    - Reuse exp458 v2 outputs only after all new 28 well outputs are frozen.
    - Read truth, role, fold, exp209 control, episode and cause only after combined fixed32 artifact freeze.
    - Treat Stage 0B as a mechanism preflight, not CV or promotion evidence.


experiment:
  name: exp318_typewell_group_time_varying_calibration_ssm
  description: Type Well群priorを初期値にwell内のGR offset/scale driftを低次元state-spaceで追跡する段階的監査
  route: pf_beam
  status: design_frozen_blocked_on_exp311_exp313_runtime_gate
  created_at: "2026-07-21"

lineage:
  parent: exp311_typewell_group_prefix_suffix_gr_calibration_readout
  dependencies: [exp313_typewell_group_unseen_transfer_guard]
  references: [exp295_prefix_anchored_wholewell_gr_alignment_ssm]
  diff_summary: TVT path decoderとは分離し、既知prefixでGR calibration driftの可同定性とruntimeを先に監査する。PASS時のみ固定2-state Kalman calibrationをsuffixへcausal extrapolateする。

implementation: {enabled: false, scope: design_only, inference_enabled: false, submission_enabled: false}

validation:
  strategy: sha256_well_grouped_5fold_with_prefix_mask_backtest
  n_folds: 5
  fit_scope: outer_train_group_prior_plus_current_well_visible_prefix
  truth_join_policy: freeze_state_and_hyperparameters_before_masked_suffix_scoring

state_space:
  state: [intercept, log_scale]
  transition: local_level_random_walk
  inference: deterministic_kalman_filter_no_smoother_at_boundary
  process_noise_selection: outer_train_empirical_bayes_once
  initial_prior: exp311_group_prior
  calibration_observations: visible_prefix_only
  stage0_mask_horizon_rows: 640
  forbidden: [suffix_gr_target_alignment, bidirectional_smoothing_across_boundary, joint_tvt_path_training]

execution_contract:
  stage_0: {diagnostic_variants: 1, model_configs: 0, boosters: 0, decoder_runs: 0}
  stage_1_if_identifiable_and_runtime_pass: {scientific_variants: 1, model_configs: 0, boosters: 0, decoder_runs: 0}

model:
  name: deterministic_two_state_kalman_filter
  params: {}

promotion_gates:
  stage0_gain_min_ft: 0.05
  folds_improved_min: 4
  state_boundary_jump_p95_max_sigma: 3.0
  runtime_projected_max_hours: 8.5
  hidden_like_nonregression: true
  worst_well_delta_max_ft: 0.25

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: stable_sha256_per_well_fold
  stochastic_components: []
  parallel_rng_policy: deterministic linear algebra and stable well ordering
  feature_sha_policy: decompressed_content_sha_for_gzip
  record: {kernel_version: true, input_sha: true, feature_schema_sha: true, feature_content_sha: true, model_manifest_sha: true, prediction_sha: true, submission_sha: false}

notes:
  - Stage 0 must pass scientific and 8.5-hour projected runtime gates before Stage 1 exists operationally.
  - This design explicitly avoids the exp295 joint position-rate state explosion.

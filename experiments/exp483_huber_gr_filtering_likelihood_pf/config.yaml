experiment:
  name: exp483_huber_gr_filtering_likelihood_pf
  description: >-
    Design-frozen one-factor PF ablation that replaces the exp404 Gaussian
    particle GR log likelihood with the exp389 fixed delta=1.345 Huber score.
  hypothesis: >-
    Robustifying the likelihood inside particle filtering can prevent isolated
    GR outliers from eliminating the correct trajectory mode while retaining
    the useful central Gaussian-like evidence.
  route: pf_beam
  status: stage1_gate_failed_terminal_close
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  exact_pf_implementation_reference: exp404_scale5_sigma_gr_likelihood_pf_ablation
  hmm_evidence_source: exp389_exp209_huber_exact_hmm_emission
  frozen_trajectory_negative_reference: exp430_huber_seed_evidence_reaggregation
  steering: ../../docs/legacy/steering/20260730-exp483-huber-gr-filtering-likelihood-pf
  diff_summary: >-
    Change only each particle's capped Gaussian GR log emission to the fixed
    exp389 Huber delta=1.345 score. Keep x1.0 GR scale, PF dynamics, 500
    particles, 128 stable seeds, resampling, roughening, missing-GR handling,
    and temperature-5 seed aggregation fixed. This is filtering-time
    likelihood, not exp430 post-hoc frozen-trajectory evidence reaggregation.


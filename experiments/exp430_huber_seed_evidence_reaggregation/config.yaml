experiment:
  name: exp430_huber_seed_evidence_reaggregation
  description: >-
    Replay one fixed exp404-compatible 128-seed PF trajectory bank and
    reaggregate the frozen trajectories with matched Gaussian versus Huber
    evidence.
  hypothesis: >-
    Huber seed evidence with delta 1.345 preserves the average improvement of
    fixed temperature-5 aggregation while removing the per-well tail
    regressions observed in exp417.
  route: pf_beam
  status: completed_train_side_gate_failed_terminal_close
  created_at: "2026-07-28"
  updated_at: "2026-07-29"

lineage:
  parent: exp404_scale5_sigma_gr_likelihood_pf_ablation
  scientific_control: exp417_scale5_seed_aggregation_promotion_audit
  evidence:
    - exp389_exp209_huber_exact_hmm_emission
  references:
    - exp072_exp063_full_replay_feature_cache
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
  steering: ../../.steering/20260728-exp430-huber-seed-evidence-reaggregation
  diff_summary: >-
    PF generation, Gaussian particle filtering, resampling, transition,
    particles, seeds, and x1.0 GR scale are unchanged. The only scientific
    factor is the post-freeze seed evidence: trajectory-residual Gaussian
    versus Huber(delta=1.345), both aggregated with temperature 5.


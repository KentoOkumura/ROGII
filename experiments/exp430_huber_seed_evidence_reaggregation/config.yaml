  submission_enabled: false

validation:
  strategy: exp226_oof_fixed_trajectory_huber_seed_evidence_audit
  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  primary_control: gaussian_matched
  primary_candidate: huber_delta_1p345
  saved_parent_reference: saved_exp404_temperature5
  arithmetic_control: arithmetic_mean
  gain_definition: rmse_control_minus_huber
  truth_attachment: after_trajectory_prediction_evidence_and_logical_sha_freeze
  scope_contract:
    shallow_md_since_lt_ft: 1000.0
    deep_md_since_ge_ft: 1000.0
    high_missing_fraction_ge: 0.30
    roughness_definition: >-
      well-level RMS second difference of the frozen arithmetic-mean
      trajectory, split at the all-well median after all four shards are
      frozen and before truth attachment
    roughness_split_quantile: 0.50
  batch_inference_semantics: >-
    Evidence may use the complete unknown-suffix GR sequence but never suffix
    TVT. This is non-causal in sequence time and is valid only for batch
    inference where the complete horizontal GR log is available.
  leakage_policy:
    - Raw horizontal TVT is read only through TVT_input during PF generation.
    - Suffix TVT, fold, hidden-like role, error, and Public LB are forbidden before freeze.
    - Gaussian and Huber readouts must reference the same float64 trajectory bank SHA.
    - Full-suffix GR may score seeds after trajectory freeze but cannot alter the PF paths.
    - Delta and temperature are fixed and are not selected from OOF truth.


reproducibility:
  deterministic_anchor: true
  deterministic_anchor_scope: fixed4_preflight_v1_v2
  seed_policy: >-
    seed_base=sha256_first16("likpf::train::<well_id>")
    modulo_2147483647_plus_1; seed=seed_base+seed_index_0_to_127
  seed_indices: "0..127"
  stochastic_components:
    - particle_initialization
    - rate_and_position_process_noise
    - systematic_resampling
    - post_resampling_roughening
  parallel_rng_policy: >-
    Each well receives an explicit stable seed base and each Numba PF call
    owns its local seed streams; well execution and shard order cannot change
    the seed labels.
  stable_order: well_id_lexicographic_then_row_idx_then_seed_index
  trajectory_freeze_before_readout: true
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    package_versions: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    trajectory_sha: true
    evidence_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - Fixed4 v1/v2 trajectory, prediction, and evidence raw SHAs match exactly.

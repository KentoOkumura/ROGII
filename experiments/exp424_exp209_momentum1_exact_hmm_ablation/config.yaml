experiment:
  name: exp424_exp209_momentum1_exact_hmm_ablation
  description: >-
    Stage 0 fail-closed one-factor exact-HMM ablation that changed exp209 rate
    momentum from 0.998 to 1.0 while keeping sig_r and every other state,
    emission, prior, and readout contract fixed.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-28"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  evidence_parent: exp408_hmm_message_rate_basin_audit
  comparison_references:
    - exp338_exp209_well_adaptive_transition_noise
    - exp411_predictive_filtered_rate_innovation_destick
    - exp412_beta_filter_rate_disagreement_two_pass_reset
  diff_summary: >-
    Change only mom from 0.998 to 1.0 to remove zero-centered rate
    mean-reversion. Keep sig_r=0.002, the 41-state rate grid, position
    transition, GR emission, priors, forward-backward smoother, and
    posterior-mean readout unchanged.


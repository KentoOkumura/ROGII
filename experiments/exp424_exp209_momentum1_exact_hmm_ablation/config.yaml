    n_rates: 41
    rate_span: 0.10
    rate_step: 0.005
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
  treatment_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    rate_step: 0.005

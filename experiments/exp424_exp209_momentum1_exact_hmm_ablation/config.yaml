      expected_control_wells: 16
      finite_coverage: 1.0
      normalization_max_abs_error: 1.0e-5
      untreated_parent_parity_max_abs_ft: 1.0e-5
      full_runtime_projection_max_seconds: 30600
      peak_rss_max_gb: 25
      truth_reads_before_freeze: 0
      episode_reads_before_freeze: 0
      rate_edge_state_cells: 1
      rate_edge_mass_nonworse_tolerance: 1.0e-12
    mechanism:
      persistent_episode_sse_reduction_min: 0.05
      persistent_improved_wells_min: 10
      underresponse_sse_share_reduction_min_points: 0.02
      persistent_sse_improving_folds_min: 4
      control_rmse_delta_max_ft: 0.02
      control_by_well_delta_p95_max_ft: 0.25
      rate_edge_mass_nonworse: true
      rate_underresponse_readout: smoothed_rate_mean
      rate_underresponse_definition: same_nonzero_direction_and_smaller_absolute_value
    fail_policy: close_without_parameter_or_gate_rescue
  stage_1:

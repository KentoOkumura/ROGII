        - hidden_like_spatial
        - hidden_like_typewell_purged
        - raw_gr_observed
        - raw_gr_missing
        - fixed_likpf_hmm_50_50
      by_well_delta_p95_max_ft: 0.25
      worst_well_delta_max_ft: 5.0


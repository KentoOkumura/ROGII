    - exp160_sp45_bimodal_selector_confidence_features_on_exp148_feature_schema.csv
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148_lgb_models/manifest.json
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148_summary.json

inference:
  mode: saved_lgb_booster_inference_with_rawtest_learned_likelihood_and_sp45_bimodal_features
  selected_variant: sp45_bimodal_selector_confidence_addonly
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  notes:
    - Inference requires a completed exp160 train manifest with saved boosters.
    - Direct submission should wait for OOF, worst-well, and feature parity review.

notes:
  - Implements the KAGGLE_DIRECTION backlog item `sp45_bimodal_selector_confidence_features_on_exp148`.
  - Primary decision is whether hidden-safe SP45/PF/Beam/bimodal selector confidence signals improve the exp148 ML route anchor without turning public notebook selector output into direct replacement, blend, or hard gate.

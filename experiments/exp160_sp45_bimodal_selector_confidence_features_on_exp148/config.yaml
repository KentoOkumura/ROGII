experiment:
  name: "exp160_sp45_bimodal_selector_confidence_features_on_exp148"
  description: Add hidden-safe SP45/bimodal selector confidence features on top of the exp148 learned-likelihood LightGBM surface.
  route: ml_model
  status: submitted_public_lb_8p061_not_adopted
  created_at: "2026-06-29"
  updated_at: "2026-06-30"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp092_u_projection_correction_disagreement_fullrun
    - exp154_segment_level_dense_candidate_verifier_on_exp148
    - exp157_candidate_ranker_feature_enrichment
    - exp082_public_artifact_replay_followup
  implementation_source: sp45_bimodal_selector_confidence_features_on_exp148.py
  diff_summary: Keeps the exp148 feature surface (exp092 U-projection plus exp145 learned likelihood confidence) and adds target-free SP45/PF/Beam/bimodal selector confidence, spread, margin, prefix trust, shape, and near/longtail interaction features as an add-only ML route experiment. Public notebook selector outputs are not used as direct replacement, blend, or hard gate.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_sp45_confidence_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_exp145_full_train_ml_feature_cache_and_sp45_confidence_features
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - SP45/bimodal features use only target-free candidate values, scores, margins, prefix statistics, row geometry, and train/inference regenerated PF/Beam/cache columns.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache and SP45/bimodal feature generation cover the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


experiment:
  name: exp399_soft_sticky_fused_exact_runtime_audit
  description: >-
    Exact-equivalent runtime audit of the exp394 soft-sticky E/H HMM. Replace
    per-row materialized transition tables with an on-the-fly sparse kernel,
    fuse docking with local H transitions, and decode two independent wells in
    parallel without pruning any TVT or residual-rate state.
  route: pf_beam
  status: full_oof_rejected_no_rescue
  created_at: "2026-07-25"
  updated_at: "2026-07-26"

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp394_soft_sticky_exp226_k16_branch_hmm
  scientific_parent: exp355_exp226_dip_rate_prior_on_exp209
  branch_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  decoder_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  promotion_baseline: exp263_last_anchor_better_candidate_confidence_pair_cache
  steering: ../../.steering/20260725-exp399-soft-sticky-fused-exact-runtime-audit
  references:
    - exp394_soft_sticky_exp226_k16_branch_hmm
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp270_exact_hmm_posterior_mode_candidate_audit
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp357_exp226_huber_emission_independent_audit
    - exp391_prefix_anchored_mode_persistence_hmm_readout
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep the complete exp394 scientific contract and all full-grid states.
    Change only the implementation: compute each source state's at-most
    3-rate by 5-position transitions on demand, calculate the H-to-E docking
    expectation in the same local traversal, and use two independent
    well-level workers with stable output ordering. The saved exp394 fixed16
    output is a load-only numerical and runtime baseline.


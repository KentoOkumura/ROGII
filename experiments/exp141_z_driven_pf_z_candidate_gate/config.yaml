experiment:
  name: "exp141_z_driven_pf_z_candidate_gate"
  description: "Train-side posthoc audit for selecting pf_z only in target-free Z-driven intervals while keeping likpf_mean as the default path."
  route: pf_beam
  status: completed_train_side_rejected_no_submit
  created_at: "2026-06-27"
  updated_at: "2026-06-27"

lineage:
  parent: exp072_exp063_full_replay_feature_cache
  secondary_parents:
    - exp083_pf_beam_true_tvt_2d_well_eda
    - exp104_pf_z_seedbag_scale_cache
    - exp106_strict_exp072_pf_z_multiseed_scale_cache
  implementation_source: z_driven_pf_z_candidate_gate.py
  diff_summary: >
    Implements the KAGGLE_DIRECTION backlog item z_driven_pf_z_candidate_gate.
    The default prediction remains exp072 likpf_mean. pf_z is evaluated as a
    low-frequency candidate selected by target-free Z trajectory, PF/Beam
    disagreement, path-slope, roughness, and near-prefix guards.

validation:
  strategy: exp072_train_pseudotail_posthoc_pf_z_gate
  metric: rmse
  secondary_metrics:
    - mae
    - within_10ft
    - switch_rate
    - switched_wells
    - max_well_regression_vs_likpf
    - distance_bucket_rmse
    - z_slope_bucket_rmse
    - pf_beam_disagreement_bucket_rmse
    - representative_z_driven_well_rmse
    - path_step_ge10
    - path_step_ge25
  seed: 42
  group_column: well
  score_rows: exp072_full_replay_train_pseudotail_rows
  leakage_policy:
    - Candidate values and target-free features are read from exp072 train pseudo-tail feature cache.
    - Gate masks use only raw-test-compatible trajectory/candidate columns, never target_tvt or oracle error.
    - target_tvt is reconstructed only for scoring and oracle diagnostics.
    - No new model is trained and no PF particles are regenerated in this experiment.
    - Any submission candidate requires a later raw-test-compatible inference port in the same experiment before submit-check.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_feature_cache:
    - /tmp/exp072_cache_redownload/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    - /tmp/kaggle-output/exp072_exp063_full_replay_feature_cache/train_v1/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    - /kaggle/input/notebooks/kentookumura/exp072-exp063-full-replay-feature-cache-train/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    - /kaggle/input/exp072-exp063-full-replay-feature-cache-train/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema:
    - experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
    - /tmp/exp072_cache_redownload/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
    - /tmp/kaggle-output/exp072_exp063_full_replay_feature_cache/train_v1/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
    - /kaggle/input/notebooks/kentookumura/exp072-exp063-full-replay-feature-cache-train/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
    - /kaggle/input/exp072-exp063-full-replay-feature-cache-train/artifacts/exp063_full_replay_feature_cache_feature_schema.csv

model:
  name: no_new_model_z_driven_pf_z_candidate_gate
  estimator: none
  default_prediction: pred_likpf_mean
  switch_candidate: pred_pf_z
  comparison_candidates:
    - pred_pf_ancc
    - pred_beam_mean

runtime:
  use_amp: false
  num_workers: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_new_rng_posthoc_saved_cache_audit
  stochastic_components:
    - upstream_exp072_pf_beam_likpf_feature_cache
  parallel_rng_policy: no_parallel_rng_in_exp141
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - docs/06_reproducibility.md applies through saved cache SHA recording and Kaggle bootstrap metadata.
    - exp141 performs no stochastic computation, no model training, and no submission generation.

audit:
  mode: z_driven_pf_z_candidate_gate
  output_prefix: exp141_z_driven_pf_z_candidate_gate
  max_feature_rows: null
  prediction_sample_rows: 200000
  representative_z_driven_wells:
    - "91b301ce"
    - "ba48188d"
    - "fef8af96"
  required_rawtest_compatible_columns:
    - pf_ancc
    - pf_ancc_std
    - pf_z
    - pf_z_delta
    - pf_vs_z
    - beam_mean_d
    - beam_std_d
    - likpf_mean_d
    - md_since
    - eval_len
    - dzdmd
    - z
  gate_variants:
    - name: row_zq90_alignq75_diffq75_sr001_clip25
      scope: row
      switch_rate_cap: 0.01
      dzdmd_q: 0.90
      alignment_margin_q: 0.75
      pf_z_diff_q: 0.75
      pf_beam_q: 0.75
      roughness_max_q: 0.90
      min_conditions: 3
      min_tail_rank: 100
      min_md_since: 50.0
      max_abs_delta: 35.0
      alpha: 1.0
      clip_abs: 25.0
    - name: row_zq85_alignq70_diffq70_sr003_clip25
      scope: row
      switch_rate_cap: 0.03
      dzdmd_q: 0.85
      alignment_margin_q: 0.70
      pf_z_diff_q: 0.70
      pf_beam_q: 0.70
      roughness_max_q: 0.90
      min_conditions: 3
      min_tail_rank: 100
      min_md_since: 50.0
      max_abs_delta: 35.0
      alpha: 1.0
      clip_abs: 25.0
    - name: seg_zq85_alignq70_diffq70_sr003_min16_clip25
      scope: segment
      switch_rate_cap: 0.03
      dzdmd_q: 0.85
      alignment_margin_q: 0.70
      pf_z_diff_q: 0.70
      pf_beam_q: 0.70
      roughness_max_q: 0.90
      min_conditions: 3
      min_tail_rank: 100
      min_md_since: 50.0
      min_segment_rows: 16
      max_abs_delta: 35.0
      alpha: 1.0
      clip_abs: 25.0
    - name: seg_zq80_alignq65_diffq65_sr005_min24_clip20_a075
      scope: segment
      switch_rate_cap: 0.05
      dzdmd_q: 0.80
      alignment_margin_q: 0.65
      pf_z_diff_q: 0.65
      pf_beam_q: 0.65
      roughness_max_q: 0.85
      min_conditions: 3
      min_tail_rank: 150
      min_md_since: 75.0
      min_segment_rows: 24
      max_abs_delta: 30.0
      alpha: 0.75
      clip_abs: 20.0
    - name: seg_zq75_alignq60_diffq70_sr010_min32_clip20_a050
      scope: segment
      switch_rate_cap: 0.10
      dzdmd_q: 0.75
      alignment_margin_q: 0.60
      pf_z_diff_q: 0.70
      pf_beam_q: 0.65
      roughness_max_q: 0.85
      min_conditions: 3
      min_tail_rank: 200
      min_md_since: 100.0
      min_segment_rows: 32
      max_abs_delta: 25.0
      alpha: 0.50
      clip_abs: 20.0
    - name: well_zq90_alignq75_sr005_tail500_clip25
      scope: well
      switch_rate_cap: 0.05
      dzdmd_q: 0.90
      alignment_margin_q: 0.75
      pf_z_diff_q: 0.75
      pf_beam_q: 0.75
      roughness_max_q: 0.90
      min_conditions: 3
      min_tail_rank: 500
      min_md_since: 250.0
      min_well_high_rate: 0.02
      max_abs_delta: 35.0
      alpha: 1.0
      clip_abs: 25.0

inference:
  mode: disabled_train_side_diagnostic_only

experiment:
  name: exp010_trajectory_drift_ablation
  description: Add inference-safe trajectory drift shape features to the last-anchor residual model
  route: ml_model
  status: completed
  created_at: "2026-06-02"
  updated_at: "2026-06-02"

lineage:
  parent: exp009_formation_surface_guide
  diff_summary: Disable failed formation guide work and ablate trajectory direction, slope, and interaction features against exp002/exp003 controls

validation:
  # Shared metric, fold count, seed, group, and score-row defaults come from project.yml.
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Evaluation-zone TVT is used only as the residual target during training/CV.
    - Train-only formation columns are not used.
    - Trajectory features use only MD, X, Y, Z, GR, and TVT_input columns available in hidden test.
    - GR NCC and formation guide features stay disabled for this experiment.

data: {}

model:
  name: hgb_last_anchor_residual_trajectory_drift
  primary_strategy: drift_hgb
  drift_strategy: drift_hgb
  feature_set: all
  strategies:
    - last_anchor
    - drift_hgb
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    trajectory_window: 200
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: HistGradientBoostingRegressor
    params:
      max_iter: 180
      learning_rate: 0.05
      max_leaf_nodes: 31
      min_samples_leaf: 80
      l2_regularization: 0.05
      max_bins: 255
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800
  gr_ncc:
    enabled: false
  formation_guide:
    enabled: false
  rationale:
    - exp002 all-GR remains the Public LB anchor at 12.533.
    - exp003 no-GR remains the strongest single-model CV anchor at 13.882944.
    - exp009 formation guide worsened CV, so this experiment removes that signal path.
    - TVT residual drift may depend on trajectory shape beyond raw coordinates and MD distance.
    - Kaggle full CV showed all trajectory variants worsened versus control_exp003_no_gr.

ablation:
  baseline_experiment: exp002_drift_minimal
  baseline_cv: 14.124569
  baseline_public_lb: 12.533
  alternate_experiment: exp003_residual_ablation
  alternate_cv: 13.882944
  alternate_public_lb: 12.852
  parent_experiment: exp009_formation_surface_guide
  parent_cv: 14.558630
  selected_variant: trajectory_full_no_gr
  variants:
    - name: control_exp002_all
      variable: control
      description: Re-run exp002 all-GR settings as the Public-LB control row.
      overrides: {}
    - name: control_exp003_no_gr
      variable: feature_set
      description: Re-run exp003 selected no-GR feature set as the strongest CV control row.
      overrides:
        model:
          feature_set: no_gr_signal
    - name: trajectory_direction_no_gr
      variable: trajectory_direction
      description: Add azimuth, signed direction, and path-axis features to the exp003 no-GR feature set.
      overrides:
        model:
          feature_set: no_gr_signal_plus_trajectory_direction
    - name: trajectory_slope_no_gr
      variable: trajectory_slope
      description: Add inclination, dZ/dMD, dXY/dMD, and recent known trajectory slope features to exp003 no-GR.
      overrides:
        model:
          feature_set: no_gr_signal_plus_trajectory_slope
    - name: trajectory_full_no_gr
      variable: trajectory_full
      description: Add direction, slope, and residual-shape interaction trajectory features to exp003 no-GR.
      overrides:
        model:
          feature_set: no_gr_signal_plus_trajectory_drift
    - name: trajectory_full_all
      variable: trajectory_full
      description: Add the full trajectory drift feature group on top of the exp002 all-GR feature set.
      overrides:
        model:
          feature_set: all_plus_trajectory_drift

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  save_well_metrics: true
  save_oof_predictions: false

notes:
  - Submission target column is lowercase tvt, while train target is uppercase TVT.
  - Do not use train-only formation columns directly at inference.
  - Train notebook writes ablation_metrics.csv, well_metrics.csv, fold_metrics.csv, and fold_model_training.csv with variant names.
  - Inference applies ablation.selected_variant.
  - Trajectory direction/slope/full variants are separated so the contribution is visible in the ablation table.

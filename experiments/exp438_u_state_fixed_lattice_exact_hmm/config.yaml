model:
  name: fixed_u_lattice_joint_rate_exact_hmm
  estimator: deterministic_exact_forward_backward
  parent_state: [tvt_position, u_rate]
  candidate_state: [u_position, u_rate]
  coordinate:
    formula: U=TVT+Z
    continuous_parent_equivalence: exact
    scientific_difference: fixed_discrete_lattice_coordinate_only
  parent_position:
    lattice: fixed_tvt
    transition_mean_formula: r_current*delta_MD-delta_Z
    emission_state_formula: TVT_state
    readout_formula: E_TVT
  candidate_position:
    lattice: fixed_absolute_u
    grid_formula: parent_tvt_grid+last_known_Z
    grid_reanchoring_after_start: forbidden
    row_adaptive_regridding: forbidden
    transition_mean_formula: r_current*delta_MD
    emission_state_formula: U_state-Z_current
    readout_formula: E_U-Z_current
  fixed_from_exp209:
    position_grid_step_ft: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    effective_position_sigma_ft: 0.1225
    position_kernel_cells: 5
    momentum: 0.998
    emission: gaussian_typewell_gr
    emission_lambda: 1.0
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    rate_center: zero
    rate_position_integration: arrival_rate
    output: smoothed_posterior_mean_and_std
  forbidden:
    - row_adaptive_or_interpolated_grid
    - trapezoidal_source_destination_rate_transition
    - memoryless_rate
    - curvature_or_additional_state
    - position_or_rate_noise_change
    - formation_or_xy_geometry_prior
    - reset_or_reanchor
    - emission_change
    - parent_fallback
    - selector_or_blend


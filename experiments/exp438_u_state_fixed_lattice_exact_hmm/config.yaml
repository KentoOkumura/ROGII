experiment:
  name: exp438_u_state_fixed_lattice_exact_hmm
  description: >-
    Replace exp209's persistent TVT position lattice with one last-known-Z
    anchored fixed U=TVT+Z lattice while preserving the joint U-rate state,
    arrival-rate transition, emission family, priors, and posterior readout.
  route: pf_beam
  status: stage0_fail_closed_v1
  created_at: "2026-07-29"
  updated_at: "2026-07-29"

overrides:
  project_defaults:
    - validation.strategy
    - validation.score_rows

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  mechanism_evidence: exp408_hmm_message_rate_basin_audit
  comparison_references:
    - exp435_tvt_memoryless_u_rate_dzonly_hmm
    - exp437_neighbor_geometry_tvt_only_transition_hmm
    - exp436_sparse_global_stratigraphic_potential
  steering: ../../.steering/20260729-exp438-u-state-fixed-lattice-exact-hmm
  diff_summary: >-
    Keep the exp209 two-dimensional position/rate HMM and every continuous
    transition parameter fixed. Anchor a fixed absolute-U lattice by adding the
    final known Z to the parent TVT lattice, use delta_U=r_current*delta_MD,
    evaluate each row's emission at TVT=U-Z, and read out E[U]-Z. The only
    scientific difference is which coordinate retains the fixed 0.35-ft lattice.


experiment:
  name: exp260_matched_early_late_attribution_on_exp244
  description: Isolate early-only and late-only prediction-start augmentation under the exact exp244 v4 cache, sampling, weight, fold, and model contract.
  route: ml_model
  status: completed_train_side_attribution_rejected_no_inference_no_submit
  created_at: '2026-07-16'
  updated_at: '2026-07-16'

lineage:
  parent: exp244_bidirectional_prediction_start_pseudotail_augmentation
  model_parent: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  diff_summary: >
    Reuses the approved exp244 official and four offset caches but changes only
    which pseudo direction enters training. early_only uses -1000/-250 and
    late_only uses +250/+1000. The official cache, sampled rows, row weights,
    feature schema, folds, three exp218 LightGBM configs, validation surfaces,
    and guards remain fixed. Frozen exp218 and exp244 mixed OOF predictions are
    references and are not retrained.

validation:
  strategy: exp218_official_tail_row_weighted_groupkfold
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: source_well
  primary_score_surface: official_start_oof
  expected_hidden_assignment_sha256: 5f9ac9fac6bb3725a7c613f09856a85bdf73b8206fd2edf1b79e8eaa9bca6597
  stress_surfaces:
    - distance_buckets
    - rows_1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - fold
    - by_well
    - worst_well
  leakage_policy:
    - Derived views inherit the fold of their source well.
    - Outer-valid source-well pseudo rows are excluded from that fold's train rows.
    - Positive-offset late views are train-only.
    - Validation contains official-start rows only.

data:
  target_column: TVT
  input_target_column: TVT_input

frozen_anchor_parity:
  experiment: exp218_gr_wavelet_rotation_confidence_features_on_exp148

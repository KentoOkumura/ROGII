reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_exp218_gpu_repro_guard_dp_threads8
  stochastic_components: []
  parallel_rng_policy: no_new_rng_fixed_lightgbm_seeds
  feature_sha_policy: pinned_exp244_cache_manifest_schema_and_decompressed_prediction_sha
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - GPU LightGBM is not assumed bitwise deterministic without a rerun.
    - No raw-test feature generation, inference prediction, or submission is performed.

notes:
  - User approved 2 variants, 3 configs, 5 folds, 30 boosters, and no parent/control retraining on 2026-07-16.
  - exp239 early-only is not a matched control because its cutoff distribution and sampled rows differ.

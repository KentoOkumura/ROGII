experiment:
  name: exp446_persistent_tvt_rate_exact_hmm
  description: >-
    Replace exp209's persistent U-rate state with a persistent TVT-rate state
    while retaining the same 41-state local rate-process parameters and the
    same TVT-position, GR-emission, prior and posterior-readout contracts.
  hypothesis: >-
    Removing the known Z slope from the persistent rate dynamics and modeling
    q=dTVT/dMD directly can reduce zero-directed rate under-response and
    forward transition/prior hysteresis without the large control damage seen
    when rate memory was removed entirely in exp435.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  evidence:
    - exp408_hmm_message_rate_basin_audit
    - exp435_tvt_memoryless_u_rate_dzonly_hmm
    - exp441_full_support_ou_rate_transition_hmm
    - exp445_tvt_to_u_coordinate_parity_exact_hmm
  steering: ../../.steering/20260730-exp446-persistent-tvt-rate-exact-hmm
  diff_summary: >-
    Change the persistent rate coordinate from
    r_U=d(TVT+Z)/dMD to q=dTVT/dMD. Initialize and discretize q directly,
    apply the unchanged exp209 local zero-centered rate kernel on q, and
    center the TVT-position edge at q_destination*delta_MD instead of
    r_U_destination*delta_MD-delta_Z. All other HMM contracts remain fixed.


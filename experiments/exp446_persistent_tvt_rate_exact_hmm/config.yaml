model:
  name: persistent_tvt_rate_exact_hmm
  estimator: deterministic_exact_forward_backward
  active_scientific_variants:
    - persistent_tvt_rate
  parent_state:
    persistent_state: [tvt_position, u_rate]
    rate_definition: r_u=d(TVT+Z)/dMD
    prefix_initial_rate_formula: median((delta_TVT_input+delta_Z)/delta_MD)
    position_mean_formula: r_u_destination*delta_MD-delta_Z
  candidate_state:
    persistent_state: [tvt_position, tvt_rate]
    rate_symbol: q
    rate_definition: q=dTVT/dMD
    prefix_tail_steps: 50
    prefix_initial_rate_formula: median(delta_TVT_input/delta_MD)
    valid_prefix_step_condition: delta_MD>0_and_all_terms_finite
    rate_grid_formula: linspace(-span_q,span_q,41)
    span_q_formula: max(0.10,abs(q0)+0.04)
    position_mean_formula: q_destination*delta_MD
    position_includes_delta_z_term: false
  fixed_from_exp209:
    position_grid_step_ft: 0.35
    n_rates: 41
    rate_span_min: 0.10
    rate_initial_margin: 0.04
    sig_r: 0.002
    sig_p: 0.02
    emission: gaussian_typewell_gr
    emission_lambda: 1.0
    sigma_mode: known_prefix_zero_fill_population_std
    sigma_clip: [10.0, 60.0]
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    momentum: 0.998
    rate_center: zero
    rate_transition_family: parent_local_adjacent_three_bin_ou_euler
    position_kernel_cells: 5
    output: smoothed_posterior_mean_and_std
  coordinate_interpretation:
    pure_reparameterization_forbidden: true
    parent_euler_coefficient_formula: a_t=1-(1-momentum)*delta_MD
    induced_parent_q_transition_mean_formula: >-
      a_t*(q_previous+g_previous)-g_current
    treatment_transition_mean_formula: a_t*q_previous
    g_formula: delta_Z/delta_MD
    note: >-
      Omitting the known g forcing is the scientific intervention and makes
      this model non-equivalent to exp209.
  technical_sentinel:
    name: constant_z_parent_parity
    condition: Z_is_constant_across_prefix_and_suffix
    implication: u_rate_equals_tvt_rate
    required_equal:
      - initial_rate_and_grid
      - rate_transition
      - position_transition
      - emission_and_prior
      - log_likelihood
      - position_and_rate_posterior
      - tvt_mean_and_std
  forbidden:
    - rate_count_span_rule_momentum_sig_r_or_initial_sigma_grid
    - row_adaptive_rate_support_or_induced_z_forcing
    - position_grid_noise_support_or_boundary_change
    - gr_emission_prior_readout_or_missing_gr_change
    - trigger_reset_reanchor_acceleration_or_jump_mixture
    - blend_selector_gate_or_same_oof_rescue


experiment:
  name: exp009_formation_surface_guide
  description: Convert train-only formation columns into fold-safe KNN surface guide features for the residual model
  route: ml_model
  status: completed
  created_at: "2026-06-02"
  updated_at: "2026-06-02"

lineage:
  parent: exp008_gr_ncc_matcher
  diff_summary: Freeze exp008 GR NCC work and add fold-safe formation KNN surface guide features compared against exp002 and exp003 controls

validation:
  # Shared metric, fold count, seed, group, and score-row defaults come from project.yml.
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Evaluation-zone TVT is used only as the residual target during training/CV.
    - Formation columns are never used directly as inference features.
    - Formation guide models are fit only on train-fold wells during CV.
    - Validation-fold formation columns are not used for guide fitting or feature construction.

data: {}

model:
  name: hgb_last_anchor_residual_formation_surface_guide
  primary_strategy: drift_hgb
  drift_strategy: drift_hgb
  feature_set: all
  strategies:
    - last_anchor
    - drift_hgb
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: HistGradientBoostingRegressor
    params:
      max_iter: 180
      learning_rate: 0.05
      max_leaf_nodes: 31
      min_samples_leaf: 80
      l2_regularization: 0.05
      max_bins: 255
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800
  gr_ncc:
    enabled: false
  formation_guide:
    enabled: false
    method: knn_surface
    coordinate_columns:
      - X
      - Y
    formation_columns:
      - ANCC
      - ASTNU
      - ASTNL
      - EGFDU
      - EGFDL
      - BUDA
    n_neighbors: 24
    weights: distance
    max_rows_total: 200000
    max_rows_per_well: 300
  rationale:
    - exp002 all-GR remains the Public LB anchor at 12.533.
    - exp003 no-GR remains the strongest single-model CV anchor at 13.882944.
    - exp008 showed raw typewell/horizontal GR NCC worsened CV, so GR NCC stays disabled.
    - Formation columns may describe structural surfaces, but they are train-only and must be converted to an inference-safe learned guide.

ablation:
  baseline_experiment: exp002_drift_minimal
  baseline_cv: 14.124569
  baseline_public_lb: 12.533
  alternate_experiment: exp003_residual_ablation
  alternate_cv: 13.882944
  alternate_public_lb: 12.852
  comparison_experiment: exp008_gr_ncc_matcher
  comparison_cv: 14.641514
  comparison_public_lb:
  parent_experiment: exp008_gr_ncc_matcher
  parent_cv: 14.641514
  selected_variant: formation_knn_no_gr
  variants:
    - name: control_exp002_all
      variable: control
      description: Re-run exp002 all-GR settings as the raw-GR/Public-LB control row.
      overrides: {}
    - name: control_exp003_no_gr
      variable: feature_set
      description: Re-run exp003 selected no-GR feature set as the strongest CV control row.
      overrides:
        model:
          feature_set: no_gr_signal
    - name: formation_knn_no_gr
      variable: formation_guide
      description: Add fold-safe KNN formation surface guide features to the exp003 no-GR feature set.
      overrides:
        model:
          feature_set: no_gr_signal_plus_formation_guide
          formation_guide:
            enabled: true
    - name: formation_knn_all
      variable: formation_guide
      description: Add the same fold-safe KNN formation surface guide features on top of the exp002 all-GR feature set.
      overrides:
        model:
          feature_set: all_plus_formation_guide
          formation_guide:
            enabled: true

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  save_well_metrics: true
  save_oof_predictions: false

notes:
  - Submission target column is lowercase tvt, while train target is uppercase TVT.
  - Do not use train-only formation columns directly at inference.
  - Train notebook writes ablation_metrics.csv, well_metrics.csv, fold_metrics.csv, and fold_model_training.csv with variant names.
  - Inference applies ablation.selected_variant.
  - Formation guide is fold-safe in CV and is fit on all training wells only for final inference.

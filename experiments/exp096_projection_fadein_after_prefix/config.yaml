experiment:
  name: "exp096_projection_fadein_after_prefix"
  description: "Fade-in projection postprocess audit on the deterministic exp073 full replay ML OOF prediction."
  route: ml_model
  status: submitted_public_lb_recorded
  created_at: "2026-06-21"
  updated_at: "2026-06-21"

lineage:
  parent: exp094_projection_only_on_exp073
  public_reference: pilkwang/rogii-target-free-tvt-geosteering
  implementation_source: projection_fadein_after_prefix.py
  diff_summary: Keeps the exp073 saved LightGBM OOF prediction and exp094 target-free U-space projection fixed, but changes the projection application from global beta to row-wise beta fade-in after the known prefix. md_since <= fade_start receives beta 0, fade_start..fade_end linearly ramps to the selected beta, and later rows use the selected beta. No model retraining, feature addition, PF/Beam regeneration, public submission blend, or target-space refit is introduced.

validation:
  strategy: exp073_oof_target_free_projection_fadein_guard
  metric: rmse
  secondary_metrics:
    - original_fold_delta
    - well_hash_fold_delta
    - distance_bucket_delta
    - tail_rank_bucket_delta
    - tail_length_bucket_delta
    - correction_abs_p95
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - The input prediction is the fold-out exp073 OOF lgb_mean prediction.
    - Projection fitting uses only exp073 pred_tvt, raw geometry Z/MD, and known-prefix anchor TVT_input/Z per well.
    - target_tvt is used only for scoring the fixed projection variants.
    - No validation-well true TVT tail values are used to fit the polynomial projection.
    - Fixed fade-in variants must improve overall RMSE and protect distance 0-50 ft / tail rank 0-99 before any inference port.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp073_oof_predictions:
    - /tmp/kaggle-output/exp073_gpu_reproducibility_guard_for_exp063_full_replay/train_v2/artifacts/exp063_full_replay_repro_guard_predictions.csv.gz
    - /kaggle/input/notebooks/kentookumura/exp073-full-replay-repro-guard-train/artifacts/exp063_full_replay_repro_guard_predictions.csv.gz
  exp073_inference_predictions:
    - /tmp/kaggle-output/exp073_gpu_reproducibility_guard_for_exp063_full_replay/inference_v2/artifacts/exp063_full_replay_repro_guard_inference_test_predictions.csv.gz
    - /kaggle/input/notebooks/kentookumura/exp073-full-replay-repro-guard-infer/artifacts/exp063_full_replay_repro_guard_inference_test_predictions.csv.gz

model:
  name: projection_fadein_after_prefix_postprocess
  source_experiment: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  base_prediction: exp073_lgb_mean_oof_pred_tvt
  estimator: none
  projection_space: TVT_plus_Z_minus_prefix_anchor

runtime:
  use_amp: false
  num_workers: 1
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp073-full-replay-repro-guard-train
    inference_kernel_sources:
      - kentookumura/exp073-full-replay-repro-guard-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_new_rng_projection_postprocess
  stochastic_components:
    - upstream_exp073_gpu_lightgbm_oof_prediction
  parallel_rng_policy: no_parallel_rng_in_exp096
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: false
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: true
  notes:
    - This audit itself has no RNG and performs no training.
    - Source gzip prediction content SHA is recorded using decompressed CSV bytes.
    - Do not treat this as a deterministic submission anchor unless a selected inference run is rerun and submission SHA is stable.

audit:
  mode: projection_fadein_oof_postprocess_on_exp073
  output_prefix: exp096_projection_fadein_after_prefix
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  max_rows: null
  prediction_read_chunksize: 500000
  grid:
    fade_windows:
      - {start: 250.0, end: 750.0}
      - {start: 250.0, end: 1000.0}
    variants:
      - {degree: 4, robust_c: 2.0}
      - {degree: 5, robust_c: 1.5}
    betas: [0.5, 0.75]
    default_fade_start: 250.0
    default_fade_end: 750.0
    robust_iters: 4
    x_column: md_since
    max_abs_correction_ft: null
  selection_guard:
    min_rmse_gain: 0.0
    max_fold_regression: 0.0
    max_near_row_regression: 0.02
    max_short_tail_regression: 0.02
    max_correction_abs_p95: 10.0
  expected_train_artifacts:
    - exp096_projection_fadein_after_prefix_variant_metrics.csv
    - exp096_projection_fadein_after_prefix_fold_metrics.csv
    - exp096_projection_fadein_after_prefix_bucket_metrics.csv
    - exp096_projection_fadein_after_prefix_by_well.csv
    - exp096_projection_fadein_after_prefix_best_predictions.csv.gz
    - exp096_projection_fadein_after_prefix_context_schema.csv
    - exp096_projection_fadein_after_prefix_summary.json

inference:
  mode: gated_projection_port_only_after_train_guard
  generate_exp073_base_on_current_test: true
  allow_submission_fallback: false
  exp073_base_generation:
    selected_mode: gpu_repro_guard_dp_threads8
    selected_model: lgb_mean
    model_manifest_path: null
    tracker_test_path: null
    regenerate_test_features: true
    feature_generation:
      n_jobs: 8
      pf_seeds: 128
      pf_particles: 500
      fast: false
      use_gpu: auto
  selected_variant:
    variant: degree4_beta0.75_c2_fade250_750
    degree: 4
    beta: 0.75
    fade_start: 250.0
    fade_end: 750.0
    robust_c: 2.0
    robust_iters: 4
    x_column: md_since
    max_abs_correction_ft: null
  notes:
    - Train-side OOF guard passed on Kaggle train v1.
    - Inference regenerates exp073 base predictions from current test rows before applying projection, so Kaggle hidden rerun does not depend on public exp073 inference output.
    - Missing submission-id predictions are treated as an error instead of mean fallback.

notes:
  - Implements backlog item projection_fadein_after_prefix.
  - This is postprocess-only; exp073 raw deterministic anchor and exp094 global projection audit remain the baselines.
  - Train-side guard passed; inference candidate is selected but inference and submission are not yet run.

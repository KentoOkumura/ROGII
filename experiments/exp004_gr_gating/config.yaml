experiment:
  name: exp004_gr_gating
  description: Gate or shrink exp002 GR signal features using inference-safe well conditions
  route: ml_model
  status: completed
  created_at: "2026-05-31"
  updated_at: "2026-05-31"

lineage:
  parent: exp003_residual_ablation
  diff_summary: Use exp002 all-GR residual model as the control and exp003 no-GR model as the alternate prediction only for tagged wells

validation:
  # Shared metric, fold count, seed, group, and score-row defaults come from project.yml.
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Evaluation-zone TVT is used only as the residual target during training/CV.
    - Train-only formation columns are not used.

data: {}

model:
  name: hgb_last_anchor_residual_gr_gated
  primary_strategy: drift_hgb
  drift_strategy: drift_hgb
  feature_set: all
  strategies:
    - last_anchor
    - drift_hgb
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: HistGradientBoostingRegressor
    params:
      max_iter: 180
      learning_rate: 0.05
      max_leaf_nodes: 31
      min_samples_leaf: 80
      l2_regularization: 0.05
      max_bins: 255
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800
  rationale:
    - exp002 all-GR residual learning is the Public LB control: CV 14.124569, Public LB 12.533.
    - exp003 no-GR improved CV to 13.882944 but worsened Public LB to 12.852.
    - The next low-risk step is to keep exp002 behavior by default and route only tagged wells toward the no-GR prediction.
    - Gating rules use only inference-safe well summaries from TVT_input prefix, trajectory, and GR availability/signal shape.

ablation:
  baseline_experiment: exp002_drift_minimal
  baseline_cv: 14.124569
  baseline_public_lb: 12.533
  comparison_experiment: exp003_residual_ablation
  comparison_cv: 13.882944
  comparison_public_lb: 12.852
  selected_variant: gate_low_gr_coverage_hard
  variants:
    - name: control_exp002_all
      variable: control
      description: Re-run exp002 all-GR settings as the main control row.
      overrides: {}
    - name: control_exp003_no_gr
      variable: feature_set
      description: Re-run exp003 selected no-GR feature set as the alternate control row.
      overrides:
        model:
          feature_set: no_gr_signal
    - name: gate_high_gr_shift_soft
      variable: gr_gating
      description: Blend 50% toward no-GR only when GR signal shift/variance suggests the raw GR features may be unstable.
      overrides:
        model:
          gr_gating:
            enabled: true
            base_feature_set: all
            alternate_feature_set: no_gr_signal
            combine: any
            default_weight: 0.0
            alternate_weight: 0.5
            rules:
              - feature: prefix_gr_std
                op: ">="
                value: 35.0
              - feature: gr_delta_abs_mean
                op: ">="
                value: 25.0
    - name: gate_high_gr_shift_hard
      variable: gr_gating
      description: Use the no-GR prediction entirely for the same high GR shift tags.
      overrides:
        model:
          gr_gating:
            enabled: true
            base_feature_set: all
            alternate_feature_set: no_gr_signal
            combine: any
            default_weight: 0.0
            alternate_weight: 1.0
            rules:
              - feature: prefix_gr_std
                op: ">="
                value: 35.0
              - feature: gr_delta_abs_mean
                op: ">="
                value: 25.0
    - name: gate_low_gr_coverage_hard
      variable: gr_gating
      description: Use the no-GR prediction when prefix/evaluation GR coverage is weak.
      overrides:
        model:
          gr_gating:
            enabled: true
            base_feature_set: all
            alternate_feature_set: no_gr_signal
            combine: any
            default_weight: 0.0
            alternate_weight: 1.0
            rules:
              - feature: prefix_gr_missing_rate
                op: ">="
                value: 0.35
              - feature: eval_gr_missing_rate
                op: ">="
                value: 0.40

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  save_well_metrics: true
  save_oof_predictions: false

notes:
  - Submission target column is lowercase tvt, while train target is uppercase TVT.
  - Do not use train-only formation columns directly at inference.
  - Train notebook writes ablation_metrics.csv, well_metrics.csv, fold_metrics.csv, and fold_model_training.csv with variant names.
  - well_metrics.csv includes inference-safe condition tags and the no-GR gate weight for each well.
  - Inference applies ablation.selected_variant; update it after Kaggle full CV if a different gate wins.

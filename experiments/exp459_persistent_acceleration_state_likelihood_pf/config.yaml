experiment:
  name: exp459_persistent_acceleration_state_likelihood_pf
  description: >-
    Compact self-contained fixed32 Stage 0 candidate for a one-factor
    persistent-acceleration likelihood-PF. It isolates a stable acceleration
    RNG from the exp404 base RNG and implements zero-acceleration bitwise
    parity, target-free prediction/diagnostic freeze, truth-late mechanism
    readout, and fail-closed gates. Kaggle CPU Stage 0 completed with every
    technical gate passing but the mechanism all-AND gate failing, so the
    branch is closed without Stage 1, inference, or submission.
  hypothesis: >-
    A three-value persistent acceleration state can carry increasing, flat, or
    decreasing U-rate trends through locally ambiguous GR intervals without
    the multiplicative lattice cost that made the equivalent exact-HMM design
    in exp444 infeasible.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  exact_pf_implementation_reference: exp404_scale5_sigma_gr_likelihood_pf_ablation
  acceleration_scientific_reference: exp444_acceleration_state_exact_hmm
  curvature_negative_reference: exp367_stratified_signed_curvature_pf
  fixed32_mechanism_reference: exp411_predictive_filtered_rate_innovation_destick
  steering: ../../docs/legacy/steering/20260730-exp459-persistent-acceleration-state-likelihood-pf
  diff_summary: >-
    Add only one persistent three-value acceleration coordinate to each
    exp404 particle. Update acceleration first, shift the original destination
    U-rate by acceleration times delta MD, and then advance TVT with the
    updated rate and minus delta Z. Keep the exp404 x1.0 Gaussian GR
    likelihood and exp417 temperature-5 readout fixed. Exp444 and exp367
    remain closed negative context and are not reopened or rescued.


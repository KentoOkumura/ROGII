model:
  name: persistent_three_value_acceleration_likelihood_pf
  estimator: stochastic_likelihood_weighted_particle_filter
  active_variants: [persistent_acceleration3]
  state:
    scientific_coordinates: [tvt_position, u_rate, u_acceleration]
    u_definition: tvt_plus_z
    rate_definition: delta_tvt_plus_delta_z_divided_by_delta_md
    acceleration_definition: delta_u_rate_divided_by_delta_md
    internal_position_equivalence: u_position_equals_tvt_plus_z
  initial_state:
    tvt_center: last_known_tvt_input
    tvt_spread_ft: 4.5
    rate_center: tail30_median_delta_tvt_input_plus_delta_z_divided_by_delta_md
    rate_spread: 0.01
    acceleration_probability: [0.0, 1.0, 0.0]
  acceleration:
    values_rate_per_md_ft: [-0.0005, 0.0, 0.0005]
    initial_probability: [0.0, 1.0, 0.0]
    state_order: [negative, zero, positive]
    transition_matrix:
      - [0.92, 0.08, 0.0]
      - [0.08, 0.84, 0.08]
      - [0.0, 0.08, 0.92]
    boundary_policy: fold_outward_probability_into_boundary_stay
    update_order: acceleration_then_rate_then_tvt
    resampling_policy: copy_selected_acceleration_state_without_roughening
  transition:
    delta_md: max_current_md_minus_previous_md_1p0
    delta_z: current_z_minus_previous_z
    rate: "rate_t = 0.998 * rate_previous + acceleration_t * delta_md + 0.002 * normal_rate"
    tvt: "tvt_t = tvt_previous + rate_t * delta_md - delta_z + 0.005 * normal_position"
    equivalent_u: "u_t = u_previous + rate_t * delta_md + 0.005 * normal_position"
  fixed_from_exp404:
    particles: 500
    seeds: 128
    initial_state_spread_ft: 4.5
    initial_rate_spread: 0.01
    primary_seed_weighting_temperature: 5.0
    gr_emission: capped_gaussian
    gr_emission_clip_z2: 600.0
    gr_scale_multiplier: 1.0
    base_scale_clip: [10.0, 60.0]
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    rough_position: 0.1
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
    typewell_grid_step_ft: 0.2
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32
  controls:
    saved_primary_control_only: true
    zero_acceleration_sentinel:
      acceleration_values: [0.0, 0.0, 0.0]
      purpose: bitwise_exp404_transition_and_prediction_parity
      scientific_variant: false
      persisted_prediction: false


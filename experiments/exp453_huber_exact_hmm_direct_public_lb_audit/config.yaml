validation:
  strategy: frozen_train_side_candidate_to_direct_public_lb_audit
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  public_lb_display_precision: 3
  no_new_train_side_scoring: true
  train_side_evidence:
    control_id: exp209_gaussian_exact_hmm
    control_rmse: 11.938287234887435
    candidate_id: huber_delta1p345_on_exp209_absolute_tvt
    candidate_rmse: 11.852741129500146
    improvement_ft: 0.08554610538728902
    improved_folds: 5
    total_folds: 5
    by_well_delta_p95_ft: 0.0022343508818599006
    worst_well_delta_ft: 1.7502482022987582
    improved_wells: 411
    regressed_wells: 362
  public_lb_audit:
    candidate_id: huber_delta1p345_on_exp209_absolute_tvt
    parent_control_id: exp434_exact_hmm
    order_within_three_candidate_backlog: 2
    descriptive_only: true
    lower_is_better: true
    tie_policy: displayed_three_decimal_tie_is_inconclusive
    forbid_adaptation_after_any_lb: true
  leakage_policy:
    - Decoder may read raw horizontal MD, Z, GR, TVT_input and Type Well TVT/GR but never horizontal suffix TVT or error.
    - Fold and hidden-like assignments are reporting-only train evidence and are absent from current-test inference.
    - Candidate identity, schema, and logical content SHA are frozen before submission construction.
    - Public LB cannot change delta, scale, clip, sigma, grid, transition, prior, readout, gate, or candidate formula.


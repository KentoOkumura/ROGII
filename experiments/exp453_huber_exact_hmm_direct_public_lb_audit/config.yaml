experiment:
  name: exp453_huber_exact_hmm_direct_public_lb_audit
  description: >-
    Design-frozen direct Public-LB audit of the exp389 absolute-TVT exact HMM
    with fixed delta=1.345 Huber row emission. The frozen physical candidate is
    exposed as a standalone submission without retraining, control replay,
    blending, selection, gating, or postprocess.
  hypothesis: >-
    The small but fold-consistent 0.085546105 ft OOF gain from Huber emission
    may transfer to Public LB despite failing by-well p95 and worst-well guards.
  route: pf_beam
  status: design_frozen_implementation_not_started
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp389_exp209_huber_exact_hmm_emission
  scientific_control: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  public_lb_control: exp434_physics_candidate_public_lb_audit
  sibling_reference: exp374_exp209_student_t_exact_hmm_emission
  steering: ../../.steering/20260730-exp453-huber-exact-hmm-direct-public-lb-audit
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp374_exp209_student_t_exact_hmm_emission
    - exp389_exp209_huber_exact_hmm_emission
    - exp434_physics_candidate_public_lb_audit
    - docs/06_reproducibility.md
  diff_summary: >-
    Do not create or tune a new HMM. Port exactly the frozen exp389
    delta=1.345 Huber emission candidate to dynamic current/hidden-test
    inference and expose its posterior-mean TVT directly. The exp209
    coordinate, lattice, rate process, transitions, prior, sigma, GR
    preprocessing, and readout remain unchanged. No Gaussian or Student-t
    control, blend, selector, gate, model, or postprocess is executed.


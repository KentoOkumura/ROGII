model:
  name: exp226_k16_formation_conditioned_donor_kernel
  estimator: deterministic_geometry_pf_beam_style
  parent_fixed:
    k_segments: 16
    local_linear_k: 50
    local_linear_bandwidth_ft: 500.0
    local_linear_ridge: 1.0
    smooth_rho: 10.0
    expected_kappa_terms: 12
    raw_and_smoothed_true_tvt_slopes: true
    near_strike_ancc_local_theta: true
    gr_correction: true
    u_projection: true
  params:
    variants:
      - name: formation_conditioned_k16
        k_segments: 16
    fixed_from_exp226:
      theta0: 118.4
      local_linear_k: 50
      local_linear_bandwidth: 500.0
      local_linear_ridge: 1.0
      smooth_rho: 10.0
      gate: 0.35
      field_min_proj: 0.3
      kbins: [0.0, 750.0, 1500.0, 2500.0, 4000.0, 1000000000000000000.0]
      kappa_regimes: [0.0, 1000.0, 1500.0, 2000.0]
      rot_max_deg: 60.0
      ancc_theta_bandwidth: 1500.0
      gr_grid_step: 0.5
      gr_window: 500
      gr_stride: 125
      gr_tau: 2.0
      gr_w_mse: 0.5
      gr_w_lvl: 0.1
      gr_sh_a: 1.1
      gr_sh_b: 0.12
      gr_sh_lo: 0.3
      gr_cap: 4.0
      gr_s0: 0.10
      gr_extent: 30.0
      enable_gr_correction: true
      enable_u_projection: true
      u_projection_deg: 4
      u_projection_beta: 0.75
      u_projection_iters: 4
  formation_imputer:
    family: FormationPlaneKNN
    reference_statistic: well_median
    plane_k: 10
    self_exclusion: true
    outer_train_only: true
    dense_ancc_imputer: false
    query_workers: 1
  formation_signature:
    dimensions: 11
    relative_depth_dimensions: 6
    adjacent_thickness_dimensions: 5
    robust_center: median
    robust_scale: 1.4826_mad
    scale_floor_ft: 1.0
    standardized_delta_clip: [-3.0, 3.0]
    distance: mean_squared_standardized_delta
  donor_weight:
    selected_variant: fixed_formation_soft_factor
    formula: "w_new = w_xy * (0.5 + 0.5 * exp(-0.5 * d_form_squared))"
    nonfinite_fallback: parent_xy_weight
    variants:
      - fixed_formation_soft_factor
  forbidden:
    - formation_weight_grid
    - formation_imputer_grid
    - donor_count_or_bandwidth_grid
    - direct_prediction_blend
    - hmm_or_pf_redecode
    - selector_training
    - downstream_ml


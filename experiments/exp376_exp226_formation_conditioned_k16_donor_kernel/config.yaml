experiment:
  name: exp376_exp226_formation_conditioned_k16_donor_kernel
  description: >-
    Keep exp226 true-TVT-derived K16 donor slopes and the downstream deterministic
    geometry path fixed, and softly reweight the same XY-nearest 50 donor segments
    by fold-safe multiformation relative coordinates.
  route: pf_beam
  status: kaggle_cpu_v2_completed_technical_pass_direct_fail_novelty_fail
  created_at: "2026-07-24"
  updated_at: "2026-07-24"

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  formation_reference_parent: exp287_fold_safe_formation_74_addonly_on_exp264
  candidate_bank_parent: exp293_physics_only_candidate_bank_headroom_contract
  negative_references:
    - exp009_formation_surface_guide
    - exp150_formation_physical_imputer_revisit
    - exp329_donor_support_risk_bounded_weight_shrink
    - exp362_segment_local_donor_slope_exact_hmm
  diff_summary: >-
    The only scientific change is a fixed formation soft factor on exp226's
    existing XY donor weights. K16 segmentation, true-TVT raw and smoothed donor
    slopes, XY donor selection, adaptive kappa, ANCC local theta, GR correction,
    U-projection, and the saved parent OOF control remain fixed.

validation:
  strategy: exp226_outer5_groupfold_with_fold_local_formation_reference
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_k16_segments: 12368
  expected_folds: [0, 1, 2, 3, 4]
  control_oof_rmse_ft: 9.427109596582213
  scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  parent_control:
    experiment: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    regenerate: false
    cv_rmse: 9.427109596582213
    oof_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
  leakage_policy:
    - Outer-valid wells are absent from all formation references, donor signatures, donor fields, and weight construction.
    - Outer-train donor signatures use references from other outer-train wells only.
    - True TVT is used only for outer-train K16 donor slopes and late scoring.
    - Current test may use all train-well true TVT and formation columns, but no target-well formation column is read.
    - Formation settings and thresholds are fixed before OOF error is opened.
  gates:
    stage0_target_free:
      formation_factor_minimum: 0.5
      formation_factor_maximum: 1.0
      finite_coverage_minimum: 1.0
      nonfinite_fallback_fraction_maximum: 0.01
      segment_p05_new_to_parent_ess_ratio_minimum: 0.75
      validation_reference_count_maximum: 0
      validation_truth_read_count_maximum: 0
    stage1_direct:
      pooled_rmse_gain_minimum_ft: 0.05
      nonworse_folds_minimum: 4
      maximum_scope_delta_rmse_ft: 0.02
      maximum_by_well_p95_delta_rmse_ft: 0.0
      maximum_worst_well_delta_rmse_ft: 0.25
    stage2_fixed12_addone:
      h512_oracle_rmse_gain_minimum_ft: 0.05
      whole_well_oracle_rmse_gain_minimum_ft: 0.05
      h512_strict_unique_best_block_fraction_minimum: 0.05
      h512_positive_gain_folds_minimum: 5


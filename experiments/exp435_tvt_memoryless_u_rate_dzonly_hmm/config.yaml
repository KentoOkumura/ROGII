experiment:
  name: exp435_tvt_memoryless_u_rate_dzonly_hmm
  description: >-
    Stage 0 implementation of a TVT-only exact HMM that marginalizes
    row-local U-rate candidates, compared with its r_U=0 special case.
  hypothesis: >-
    Removing rate-to-rate memory while retaining nonzero U-rate support can
    reduce exp209 forward hysteresis; the dz-only special case isolates the
    value of nonzero U-rate support.
  route: pf_beam
  status: stage0_fail_closed_all_variants
  created_at: "2026-07-29"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  evidence_parent: exp408_hmm_message_rate_basin_audit
  negative_intervention_evidence:
    - exp424_exp209_momentum1_exact_hmm_ablation
  nonzero_rate_evidence:
    - exp355_exp226_dip_rate_prior_on_exp209
  fixed_blend_reference:
    - exp263_last_anchor_better_candidate_confidence_pair_cache
  steering: ../../.steering/20260729-exp435-tvt-memoryless-u-rate-dzonly-hmm
  diff_summary: >-
    Replace the persistent joint (TVT, U-rate) state with a persistent TVT
    distribution and a row-local U-rate edge variable. Compare fixed
    stationary-weighted 41-rate marginalization with the identical position
    kernel restricted to r_U=0.


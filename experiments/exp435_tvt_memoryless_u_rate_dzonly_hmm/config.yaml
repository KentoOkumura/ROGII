model:
  name: tvt_only_memoryless_u_rate_exact_hmm_ablation
  shared_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    rate_step: 0.005
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
    position_kernel_cells: 5
  state_contract:
    persistent_state: tvt_probability_distribution
    point_state_forbidden: true
    edge_variable: u_rate
    edge_variable_persisted: false
    transition_formula: delta_tvt_equals_u_rate_times_delta_md_minus_delta_z
  active_scientific_variants:
    - memoryless_41rate
    - dz_only_r0
  variants:
    memoryless_41rate:
      persistent_state: tvt_only
      n_edge_rates: 41
      rate_grid: parent_zero_centered_per_well_support
      rate_weight_family: zero_centered_parent_ar1_stationary_gaussian
      stationary_sd_formula: sig_r_div_sqrt_1_minus_mom_squared
      stationary_sd: 0.03163859985841663
      weight_normalization: discrete_grid_sum_to_one
      uses_init_rate_as_weight_mean: false
      uses_init_rate_for_support_only: true
      carries_rate_responsibility_to_next_row: false
    dz_only_r0:
      persistent_state: tvt_only
      n_edge_rates: 1
      edge_rates: [0.0]
      edge_rate_weights: [1.0]
      carries_rate_responsibility_to_next_row: false
      required_parity: delta_at_zero_memoryless_kernel


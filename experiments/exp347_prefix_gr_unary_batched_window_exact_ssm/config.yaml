experiment:
  name: exp347_prefix_gr_unary_batched_window_exact_ssm
  description: >-
    Preserve the exp332 fixed-window Gaussian structured objective and exact
    exp209 grammar while batching four windows per GPU forward/backward pass.
  route: ensemble
  status: stage0_technical_parity_failed_branch_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-23"

lineage:
  parent: exp332_prefix_gr_unary_fixed_window_structured_ssm
  steering: ../../docs/legacy/steering/20260722-exp347-prefix-gr-unary-batched-window-exact-ssm
  references:
    - exp295_prefix_anchored_wholewell_gr_alignment_ssm
    - exp331_prefix_gr_unary_local_ce_exact_ssm
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp221_lgb_oof_gaussian_emission_hmm_on_exp148
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  diff_summary: >-
    Changes only the compute layout from one well-window with four-step gradient
    accumulation to four padded and masked well-windows in one exact-DP batch.
    The exp332 objective, effective optimizer batch, window schedule, teacher
    boundary, architecture, state grammar, controls, and full-well evaluation
    remain fixed. The terminal exp332 experiment is not reopened.


experiment:
  name: exp296_exp223_self_gr_known_tvt_support_gate
  description: >-
    Keep exp223 hmm_selfgr_boost_only_a070_c100 unchanged and set only its
    self-GR contribution to exact zero for candidate TVT states outside the
    inclusive visible-prefix known TVT_input range.
  route: ensemble
  status: completed_train_side_guard_failed_closed
  created_at: "2026-07-19"
  updated_at: "2026-07-20"

lineage:
  parent: exp223_joint_typewell_self_gr_hmm_likelihood_probe
  references:
    - exp225_state_known_tvt_self_gr_hmm_emission
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp115_hidden_like_spatial_holdout_from_ppt
  diff_summary: >-
    Adds one inclusive candidate-state support mask after the exp223 full-grid
    self-GR centering and positive clipping. Inside-support self-GR boost,
    descriptor matching, quality, alpha, clip, HMM grid, transition, Type Well
    emission, and posterior readout remain unchanged. This does not use the
    exp225 state-known TVT-to-GR curve.

validation:
  strategy: train_side_no_training_single_support_gate_ablation
  metric: rmse
  group_column: well
  n_training_folds: 0
  reporting_folds: 5
  reporting_fold_policy: stable_sha256_well_mod_5
  score_rows: official_train_unknown_suffix_rows
  truth_join_policy: after_support_mask_variant_prediction_and_sha_freeze_only
  leakage_policy:
    - Build known TVT support from finite visible-prefix TVT_input only.
    - Never use unknown-suffix true TVT, prediction, error, or oracle data in the support mask, self-GR surface, quality, or HMM.
    - Use unknown-suffix true TVT only for metrics after support and prediction freeze.
    - Use exp115 hidden-like assignments only for metric readout.
  hard_gates:
    technical:
      input_wells: 773
      finite_prediction_coverage_min: 1.0
      saved_exp223_row_identity_exact: true
      saved_exp223_decompressed_sha_exact: true
      outside_support_self_gr_contribution_max_abs: 0.0
      inside_support_boost_delta_vs_exp223_max_abs: 0.0
      base_typewell_grid_transition_and_selfgr_config_parity: true
      unknown_suffix_truth_access_before_freeze_max: 0
      parent_control_retraining_max: 0
      lightgbm_configs_max: 0
      trained_folds_max: 0
      boosters_max: 0
    performance:
      pooled_rmse_delta_vs_exp223_max: -0.05
      improving_reporting_folds_min: 4
      true_tvt_outside_known_range_rmse_delta_max: -0.10
      true_tvt_inside_known_range_rmse_delta_max: 0.02
      distance_1000_plus_rmse_delta_max: 0.02
      hidden_like_spatial_rmse_delta_max: 0.02
      hidden_like_typewell_purged_rmse_delta_max: 0.02
      by_well_rmse_p95_delta_max: 0.0
      worst_well_rmse_delta_max: 0.25
      step_delta_p99_nonregression: true
  fail_action: close_without_support_alpha_clip_window_topk_or_threshold_rescue
  pass_action: scientific_support_only_no_automatic_inference

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  target_column: TVT
  known_target_column: TVT_input
  horizontal_gr_column: GR
  horizontal_transition_columns: [MD, Z]
  typewell_columns: [TVT, GR]
  well_identity_source: filename
  forbidden_support_inputs: [TVT, prediction, error, abs_error, oracle, candidate_tvt, typewell_tvt_range]
  hidden_like:
    enabled: true
    fold_assignment_candidates:
      - /tmp/exp275-output-v2/inputs/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
      - /kaggle/input/notebooks/kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
      - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    valid_role_columns:
      verification_like_spatial: verification_like_spatial_role
      verification_like_typewell_purged: verification_like_typewell_purged_role

model:
  name: exp223_self_gr_known_tvt_support_gate
  estimator: deterministic_exact_hmm_forward_backward
  implementation_source: exp296_exp223_self_gr_known_tvt_support_gate_compact_selfcontained_train.py
  planned_variants: 1
  active_variants_when_enabled: 1
  variant: hmm_selfgr_boost_only_a070_c100_known_tvt_support_gate
  lightgbm_configs: 0
  trained_folds: 0
  boosters: 0
  planned_hmm_well_runs: 773
  executed_hmm_well_runs: 773
  base_prediction: last_known_tvt
  hmm:
    source: exp223_joint_typewell_self_gr_hmm_likelihood_probe
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
  self_gr_emission:
    source: exp223_hmm_selfgr_boost_only_a070_c100
    alpha: 0.07
    clip: 1.0
    mode: boost_only
    window_radius_rows: 12
    descriptor_offsets: [-12, -8, -4, 0, 4, 8, 12]
    top_k: 5
    prefix_anchor_stride: 3
    max_prefix_anchors: 128
    keep_last_prefix_anchors: 32
    min_prefix_anchors: 12
    max_window_missing_rate: 0.35
    gaussian_sigma_tvt: 12.0
    descriptor_distance_temperature: 1.5
    typewell_agreement_sigma_tvt: 18.0
    surface_quadratic_clip: 60.0
    surface_chunk_size: 256
  support_gate:
    source_column: TVT_input
    source_rows: finite_visible_prefix_all_rows
    lower_bound: finite_known_tvt_min
    upper_bound: finite_known_tvt_max
    boundary: inclusive
    padding_tvt: 0.0
    apply_after_full_grid_centering_scaling_and_positive_clip: true
    outside_support_self_gr_contribution: 0.0
    inside_support_policy: exact_exp223_boost_parity
    no_finite_known_tvt_action: all_false_mask_self_gr_neutral
    final_prediction_clip_to_support: false
    use_final_prediction_to_gate: false
    use_exp225_state_known_tvt_curve: false
    forbidden_variants:
      - support_padding_grid
      - nearest_known_tvt_distance_threshold
      - hole_aware_support
      - soft_support_weight
      - inside_support_recentering
      - alpha_grid
      - clip_grid
      - window_or_topk_grid


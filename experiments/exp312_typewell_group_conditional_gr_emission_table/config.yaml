    group_membership_filename: exp311_typewell_group_prefix_suffix_gr_calibration_readout_group_membership.csv
    expected_summary_sha256: 821499b895a8bdb6ed8202c714ddb95ea8739defe9b4aaa0e13c35b346a1ca29
    expected_fold_manifest_sha256: bd6a513666d9df4797895ea0e6bc6f6041b4fddc523ce7a61e869c59eeab4afc

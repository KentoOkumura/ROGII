      - /kaggle/input/exp311-typewell-gr-calibration-readout-train/artifacts/exp311_typewell_group_prefix_suffix_gr_calibration_readout_summary.json
      - /tmp/exp311-kaggle-output.AcBbRe/artifacts/exp311_typewell_group_prefix_suffix_gr_calibration_readout_summary.json

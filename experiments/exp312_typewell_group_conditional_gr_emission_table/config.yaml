candidate_bank:
  name: exp293_exp263_stage1_deployable12
  source_contract: exp293_physics_only_candidate_bank_headroom_contract
  expected_count: 12
  order:
    - exp226_k16
    - selfgr_hmm_a070
    - likpf_mean
    - exact_hmm
    - pf_ancc
    - beam_mean
    - exp226_k16__selfgr_hmm_a070
    - exp226_k16__exact_hmm
    - exp226_k16__likpf_mean
    - selfgr_hmm_a070__likpf_mean
    - likpf_mean__exact_hmm
    - exp226_w500_50_50
  primitives: [exp226_k16, selfgr_hmm_a070, likpf_mean, exact_hmm, pf_ancc, beam_mean]
  pairs:
    exp226_k16__selfgr_hmm_a070: {exp226_k16: 0.5, selfgr_hmm_a070: 0.5}
    exp226_k16__exact_hmm: {exp226_k16: 0.5, exact_hmm: 0.5}
    exp226_k16__likpf_mean: {exp226_k16: 0.5, likpf_mean: 0.5}
    selfgr_hmm_a070__likpf_mean: {selfgr_hmm_a070: 0.5, likpf_mean: 0.5}
    likpf_mean__exact_hmm: {likpf_mean: 0.5, exact_hmm: 0.5}
  fixed_formula:
    exp226_w500_50_50: {exp226_k16: 0.5, likpf_mean: 0.25, exact_hmm: 0.25}
  formula_float_contract: match_exp263_stage1_float_operation_order
  formula_parity_max_abs_ft: 0.001

emission_table:
  typewell_group: native_overlap_1
  conditioning: [typewell_gr_decile, abs_typewell_gr_gradient_tertile, horizontal_gr_missing_flag]
  residual: horizontal_gr_minus_typewell_gr
  family: student_t
  fixed_df: 5
  location: weighted_median
  scale: mad_times_1p4826
  scale_floor_gr: 1.0
  shrinkage_support_k: 200
  fallback_order: [group_conditional, group_unconditional, global_conditional, global_unconditional]
  min_effective_rows: 32
  negative_controls: [group_label_shuffle, tvt_shift_matched_count]
  binning:
    typewell_gr_quantiles: 10
    abs_typewell_gr_gradient_quantiles: 3
    edge_policy: outer_train_equal_well_weighted_quantile
  horizontal_gr_imputation: linear_row_interpolation_both_then_typewell_mean
  lookup_tie_policy: candidate_order_stable
  baseline: global_unconditional_student_t

negative_controls:
  group_label_shuffle:
    method: stable_sha256_well_label_rotation
    preserves: [well_count, group_label_multiset]
  tvt_shift_matched_count:
    method: stable_sha256_within_well_candidate_tvt_row_circular_shift
    minimum_fraction: 0.10
    maximum_fraction: 0.90
    truth_free: true

execution_contract: {scientific_variants: 1, diagnostic_controls: 2, model_configs: 0, folds: 5, boosters: 0, decoder_runs: 0}

model: {name: none, params: {}}

promotion_gates:
  truth_nearest_mrr_gain_min: 0.02
  truth_nearest_top3_gain_min: 0.03
  real_minus_shuffled_mrr_min: 0.02
  folds_improved_min: 4
  hidden_like_nonregression: true
  lookup_fallback_rate_max: 0.25


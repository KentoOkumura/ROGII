reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: stable_sha256_per_well_fold_variant
  stochastic_components: []
  parallel_rng_policy: no_global_rng; deterministic bins and reducers
  feature_sha_policy: decompressed_content_sha_for_gzip
  record: {kernel_version: true, input_sha: true, feature_schema_sha: true, feature_content_sha: true, model_manifest_sha: false, prediction_sha: false, submission_sha: false}

notes:
  - No exact-HMM, PF, Beam, selector, inference, or submission is permitted in this experiment.
  - Binning and shrinkage constants are frozen before any outer-valid truth score is read.
  - The exp311 all-gates prerequisite is explicitly overridden by the user; exp311 fit-RMSE R2 and worst-well failures remain recorded and are not reclassified as passes.
  - The deployable12 values, formulas, order, and IDs are inherited from exp293 and are never generated or changed by this experiment.

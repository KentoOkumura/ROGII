experiment:
  name: exp312_typewell_group_conditional_gr_emission_table
  description: Type Well群ごとの条件付きGR残差分布をouter-trainだけで推定する0-booster emission-table監査
  route: pf_beam
  status: kaggle_cpu_v1_completed_gate_failed_branch_closed
  created_at: "2026-07-21"

lineage:
  parent: exp311_typewell_group_prefix_suffix_gr_calibration_readout
  references:
    - exp293_physics_only_candidate_bank_headroom_contract
    - exp263_last_anchor_better_candidate_confidence_pair_cache
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp231_same_typewell_horizontal_gr_atlas_gated_hmm_emission
    - exp115_hidden_like_spatial_holdout_from_ppt
  diff_summary: exp293で凍結済みのdeployable12候補値を変更・再生成せず、Type Well GR値・局所勾配・欠損状態に条件づけたshrunk Student-t residual tableで候補TVTのGR尤度順位だけをreadoutする。exp311の平均GR gainを根拠にユーザー判断で先行gateを上書きするが、fit-RMSE R2とworst-well FAILは安全上の既知リスクとして保持する。

implementation:
  enabled: true
  scope: train_side_zero_booster_candidate_rank_audit
  inference_enabled: false
  submission_enabled: false
  authorization_date: "2026-07-21"
  authorization_source: user_approved_exp293_deployable12_after_exp311_average_gain
  run_authorization_date: "2026-07-21"
  run_authorization_source: user_requested_execution

validation:
  strategy: sha256_well_grouped_5fold
  n_folds: 5
  group_column: well_id
  fit_scope: outer_train_wells_only
  row_weighting: equal_well_weight
  truth_join_policy: freeze_emission_table_and_candidate_scores_before_outer_valid_truth_join
  required_parent_gate: exp311_all_promotion_gates_pass
  parent_gate_override:
    enabled: true
    reason: user_directed_progress_on_exp311_average_gain
    retained_failures: [group_loo_fit_rmse_r2, worst_well_delta]
  expected_rows: 3783989
  expected_wells: 773
  expected_candidates: 12
  hidden_like_roles: [verification_like_spatial_role, verification_like_typewell_purged_role]


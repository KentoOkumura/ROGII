  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  typewell_continuity_selector_features:
    prefix: tlr191_
    oof_predictions_path: experiments/exp191_typewell_late_range_continuity_selector_on_exp176/kaggle/output/train_v1/artifacts/exp191_typewell_late_range_continuity_selector_on_exp176_oof_predictions.csv.gz
    selected_variant: viterbi_sw400_bias000_jw050_jf025_d075_std999999_md0000_seg012
    selected_mode: viterbi
    max_missing_rate: 0.0
    default_candidate: likpf_mean
    pf_ancc_candidate: pf_ancc
    beam_candidates:
      - beam_mean
    dense_candidates:
      - tvt_dense
      - tvt_densew
      - tvt_dense50
    min_typewell_span: 1.0
    candidate_pct_lower_bounds: [0.50, 0.60, 0.70]
    known_last_margins: [0.05, 0.10]
  feature_ablation:
    selected_variant: exp191_continuity_selector_confidence_replacement_only
    active_variants:
      - name: exp148_fulltrain_control
        description: Disabled by cost guard; use completed exp148 CV/Public LB as the comparison baseline unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
        enabled: false
      - name: exp191_continuity_selector_confidence_replacement_only
        description: Replace exp148 learned_likelihood_confidence ll_* with exp191 continuity selector predicted-error, segment-stability, and typewell late-range risk features.
        feature_groups:
          - projection_correction
          - u_disagreement
          - exp191_continuity_selector_confidence
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    active_modes:
      - cpu_deterministic_threads8
    modes:
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM with fixed thread count; split notebooks run one lgb config each.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      gpu_repro_guard_dp_threads8:
        description: Disabled for initial run; GPU path retained only for later explicit approval.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8


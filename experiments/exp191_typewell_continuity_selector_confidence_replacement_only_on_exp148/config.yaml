  - Parent/control retraining is not included; exp148 CV/Public LB are historical baselines.
  - The active feature schema should exclude `learned_likelihood_confidence` and include `exp191_continuity_selector_confidence`.
  - Direct exp191 selected TVT replacement, selected-minus-exp148, blend, postprocess, hard gate, inference port, and submit are explicitly out of initial scope.

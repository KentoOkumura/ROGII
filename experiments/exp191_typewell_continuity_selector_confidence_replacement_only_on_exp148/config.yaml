experiment:
  name: "exp191_typewell_continuity_selector_confidence_replacement_only_on_exp148"
  description: Replace the exp148 learned-likelihood confidence block with exp191 typewell late-range continuity selector confidence features.
  route: ml_model
  status: completed_negative_no_submit
  created_at: "2026-07-05"
  updated_at: "2026-07-05"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  continuity_selector_parent: exp191_typewell_late_range_continuity_selector_on_exp176
  candidate_ranker_parent: exp176_typewell_late_range_pfbeam_candidate_prior
  continuity_lineage:
    - exp157_candidate_ranker_feature_enrichment
    - exp176_typewell_late_range_pfbeam_candidate_prior
    - exp191_typewell_late_range_continuity_selector_on_exp176
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp193_typewell_late_interval_context_features_addonly_on_exp148
    - exp194_exp183_selector_confidence_replacement_only_on_exp148
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148
    - exp162_learned_likelihood_rank_slot_on_exp148
  implementation_source: typewell_continuity_selector_confidence_replacement_only_on_exp148.py
  diff_summary: >
    Keeps the exp148 base 196 features plus exp092 projection_correction and
    u_disagreement groups, removes the exp145 learned_likelihood_confidence
    ll_* block from the active model feature set, and replaces that role with
    target-free exp191 typewell late-range continuity selector confidence
    features. The exp191 selected TVT path is used only to derive identity,
    predicted-error, segment-stability, and typewell-percentile risk features;
    raw selected TVT, selected-minus-exp148, final TVT replacement, blend,
    postprocess, and hard gate usage are out of scope.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_exp191_continuity_selector_replacement_only_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_exp145_full_train_ml_inventory_and_exp191_oof_continuity_selector_path
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are loaded only for coverage/schema inventory and to define the ll_* replacement boundary; learned_likelihood_confidence is not part of the active replacement-only feature list.
    - Exp191 continuity selector features read the fixed train-side best Viterbi OOF selected path and explicitly exclude true_tvt, abs_error, oracle_candidate, and oracle_label columns from downstream features.
    - Exp176 predicted-error scores are reconstructed only from fold-held-out saved boosters and exp176 feature schema; the oracle labels are used only to reproduce the original OOF fold split and are not feature columns.
    - Candidate TVT values are used only for target-free confidence, predicted-error, segment-stability, and typewell-percentile risk features. Raw exp191 selected_tvt and selected-minus-exp148 are not model features in the initial variant.
    - Candidate_pct thresholds are configured before training and are not selected from validation true TVT, oracle best, or OOF absolute error.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


experiment:
  name: exp337_prefix_backtested_structure_sigma_gr
  description: >-
    Design-frozen two-stage exact-HMM audit that decomposes GR emission
    uncertainty into finite-prefix observation dispersion and a
    rolling-origin calibrated structural variance caused by typewell mismatch
    or alignment error.
  route: pf_beam
  status: stage0_gate_failed_branch_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-22"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../.steering/20260722-exp337-prefix-backtested-structure-sigma-gr
  references:
    - exp307_finite_only_robust_sigma_gr
    - exp305_tempered_raw_smoothed_exact_hmm_emission
    - exp310_effective_sample_size_shrunk_sigma_gr
  diff_summary: >-
    Replaces only exp209 well-level sigma_GR. The candidate adds a
    known-prefix rolling-origin structural variance to finite-only population
    variance in quadrature. GR preprocessing, emission center, Gaussian form,
    state grammar, transitions, priors, and posterior output remain fixed.

implementation:
  enabled: true
  scope: stage0_only
  train_notebook_state: compact_selfcontained_candidate_implemented
  canonical_notebook_adopted: true
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

validation:
  strategy: known_prefix_rolling_origin_then_grouped_exact_hmm_audit
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: tvt_input_unknown_suffix_only_after_prediction_freeze
  truth_attachment: after_stage0_scale_audit_or_stage1_prediction_content_sha_is_frozen
  leakage_policy:
    - Rolling-origin scale fitting uses only known-prefix rows at or before the origin.
    - The following 20 percent known-prefix block is used only for forward NLL evaluation, never for that origin's scale fit.
    - Unknown-suffix TVT, error, abs_error, and oracle labels are forbidden before scale and prediction freeze.
    - Known TVT_input is allowed only as an inference-available coordinate for typewell GR interpolation, prefix split, initial state, and initial rate.


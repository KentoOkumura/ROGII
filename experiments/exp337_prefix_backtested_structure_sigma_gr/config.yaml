model:
  name: prefix_backtested_structure_sigma_gr_exact_hmm
  estimator: none
  target: TVT
  residual_contract:
    pair_policy: finite_horizontal_gr_and_finite_typewell_interp_only
    formula: horizontal_gr_minus_typewell_gr_at_tvt_input
    affine_a: 1.0
    affine_b: 0.0
    order: raw_known_prefix_row_order
  scale_estimator:
    internal_fit_fraction: 0.60
    internal_calibration_fraction: 0.40
    minimum_total_finite_pairs: 50
    minimum_early_finite_pairs: 20
    minimum_late_finite_pairs: 20
    finite_sigma: population_standard_deviation_early_finite_pairs
    finite_only_comparator_sigma: population_standard_deviation_all_available_finite_pairs
    structure_variance: max_0_mean_squared_late_residual_minus_finite_variance
    effective_variance: early_finite_variance_plus_structure_variance
    fallback: exp209_zero_fill_sigma_on_same_available_prefix
    clip: [10.0, 60.0]
  stage_0_prefix_backtest:
    enabled_after_implementation: true
    rolling_origins: [0.60, 0.80]
    forward_evaluation_fraction: 0.20
    scale_policies: [finite_only, exp209_zero_fill, structure_added]
    gaussian_nll_without_constant: log_sigma_plus_half_squared_residual_over_variance
    pass_requires_all:
      minimum_evaluable_well_fraction_each_origin: 0.90
      maximum_fallback_well_fraction_each_origin: 0.10
      structure_beats_finite_pooled_each_origin: true
      minimum_folds_structure_beats_finite_each_origin: 4
      minimum_nll_gain_vs_zero_fill_per_finite_residual_each_origin: 0.005
      minimum_folds_structure_beats_zero_fill_each_origin: 4
      minimum_final_median_tau_structure_gr_units: 5.0
      maximum_final_lower_clip_well_fraction: 0.10
  stage_1_exact_hmm:
    enabled_after_implementation: false
    enable_condition: stage_0_all_gates_pass_and_separate_user_approval
    active_variants: [prefix_backtested_structure_sigma_gr]
    sigma_source: full_known_prefix_split_60_40_same_fixed_scale_estimator
  fixed_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    emission: gaussian
    emission_clip_z2: 600.0
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp
    output: posterior_mean
  forbidden:
    - finite_mad
    - affine_or_mean_center_calibration
    - temperature_or_likelihood_weight
    - student_t_or_mixture_emission
    - row_varying_sigma
    - missing_gr_downweight
    - transition_noise_change
    - blend_weight_grid
    - posthoc_split_or_threshold_rescue


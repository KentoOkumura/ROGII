audit:
  stage_a_target_free_freeze:
    source_role: outer_valid_only
    require_all_oof_rows_exactly_once: true
    require_unique_id: true
    require_unique_well_outer_fold: true
    require_finite_formation_features: true
    expected_formation_feature_count: 74
    error_columns_must_be_absent: true
    quantile_method: numpy_linear
    quartile_probabilities: [0.25, 0.50, 0.75]
    require_strictly_increasing_quartile_edges_for_family_eligibility: true
    freeze_before_error_join: true
  primary_risk_families:
    - name: plane_reference_distance
      source_columns: [spatial_knn_dist]
      well_scalar: row_quantile_0p90
      high_is_risky: true
    - name: dense_reference_distance
      source_columns: [dense_dist]
      well_scalar: row_quantile_0p90
      high_is_risky: true
    - name: dense_neighbor_uncertainty
      source_columns: [dense_std]
      well_scalar: row_quantile_0p90
      high_is_risky: true
    - name: plane_dense_disagreement
      source_columns: [spatial_vs_dense]
      transform: absolute_value
      well_scalar: row_quantile_0p90
      high_is_risky: true
    - name: formation_consensus_spread
      source_columns: [form_rng_d]
      well_scalar: row_quantile_0p90
      high_is_risky: true
    - name: known_prefix_formation_calibration_error
      source_columns: [frm_rmse_ANCC, frm_rmse_ASTNU, frm_rmse_ASTNL, frm_rmse_EGFDU, frm_rmse_EGFDL, frm_rmse_BUDA, dense_rmse]
      well_scalar: maximum_of_per_well_constant_values
      high_is_risky: true
  technical_and_context_readouts:
    - plane_reference_available_well_count_by_fold
    - dense_reference_available_well_count_by_fold
    - formation_feature_nonfinite_or_missing_rate
    - known_prefix_row_count
    - evaluation_to_known_row_count_ratio
    - suffix_to_prefix_md_span_ratio
    - evaluation_xy_distance_from_last_known_p90_div_prefix_xy_span
    - signal_disagreement_sig_std_p90
    - dense_known_neighbor_std_dense_nb_std
  context_definitions:
    known_prefix_rows: TVT_input_is_not_null
    evaluation_rows: TVT_input_is_null
    prefix_md_span: max_known_md_minus_min_known_md
    suffix_md_span: max_evaluation_md_minus_last_known_md
    prefix_xy_span: known_xy_bounding_box_diagonal
    evaluation_xy_distance: euclidean_distance_from_last_known_xy
    evaluation_xy_aggregation: row_quantile_0p90_numpy_linear
    denominator_floor: 1.0e-6
  context_can_pass_primary_gate: false
  stage_b_error_join:
    require_exact_id_well_fold_alignment: true
    require_actual_tvt_match_between_oof_files: true
    actual_tvt_absolute_tolerance: 1.0e-4
    endpoint_aggregation: unweighted_well_rmse
    delta_definition: exp287_well_rmse_minus_exp264_well_rmse
    secondary_reports:
      - row_weighted_rmse_delta_report_only
      - spearman_risk_vs_well_delta_report_only
      - plus_1ft_3ft_5ft_worsening_rate_by_quartile
      - single_largest_absolute_delta_well_sensitivity_report_only
  decision_gate:
    family_pass_rule: any_preregistered_primary_family_passes_all_checks
    global_q4_minus_q1_mean_delta_rmse_minimum_ft: 0.25
    require_global_q4_minus_q1_median_delta_positive: true
    minimum_positive_direction_folds: 4
    required_fold_count: 5
    require_positive_direction_hidden_like_spatial: true
    require_positive_direction_hidden_like_typewell_purged: true
    minimum_global_wells_per_endpoint_quartile: 100
    minimum_wells_per_endpoint_quartile_per_fold: 10
    minimum_wells_per_endpoint_quartile_per_hidden_like_scope: 15
    require_no_error_dependent_family_or_boundary: true
    close_if_no_family_passes: true
    pass_means_separate_intervention_experiment_is_eligible_only: true
  expected_outputs:
    - scientific_contract.json
    - input_artifact_manifest.json
    - target_free_well_attributes.csv
    - target_free_attribute_freeze_manifest.json
    - well_oof_delta_metrics.csv
    - family_quartile_metrics.csv
    - fold_direction_metrics.csv
    - hidden_like_direction_metrics.csv
    - technical_context_readout.csv
    - attribution_decision.json
    - reproducibility_manifest.json


experiment:
  name: exp336_exp287_formation_tail_attribution_readout
  description: >-
    Completed design-frozen zero-booster CPU readout testing whether
    preregistered, target-free formation reliability attributes explain the
    well-level tail regression introduced by exp287 relative to corrected
    exp264. Stage A froze values, quartiles, and SHA before Stage B opened truth
    or OOF error. All six families failed the fixed AND gate, so the branch is
    closed without prediction, correction, inference, or submission.
  route: ml_model
  status: kaggle_cpu_v2_complete_no_stable_formation_attribution_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-22"

lineage:
  parent: exp287_fold_safe_formation_74_addonly_on_exp264
  comparison: exp264_exp263_candidate_confidence_dual_selector
  trigger: exp334_equal_well_loss_weighting_on_exp287
  steering: ../../docs/legacy/steering/20260722-exp336-exp287-formation-tail-attribution-readout
  diff_summary: >-
    Changes no model or prediction. It reads the saved outer-valid formation
    cache from exp287, freezes six deployable formation-risk families without
    truth, then joins SHA-pinned exp287 and corrected-exp264 OOF only for
    attribution. exp334 is trigger evidence only and is not a scoring input.

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

validation:
  strategy: saved_oof_target_free_attribute_freeze_then_error_join
  metric: formation_tail_attribution_gate
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  primary_endpoint: well_rmse_delta_exp287_minus_exp264
  reference_scores:
    exp264_rmse: 8.460811237612477
    exp264_public_lb: 7.562
    exp287_rmse: 8.136708220359452
    exp287_public_lb: 7.530
    exp287_delta_rmse: -0.3241030172530248
    exp287_worst_well_delta_rmse: 8.228409822385604
    exp334_rmse: 8.09349752413077
    exp334_delta_rmse_vs_exp287: -0.04321069622868201
    exp334_worst_well_delta_rmse_vs_exp264: 7.156485376687872
  hidden_like_scopes:
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Stage A must not load actual_tvt, TVT, target, prediction, error, abs_error, squared_error, worst-well identity, or by-well outcome files.
    - Stage A uses only exp287 outer-valid formation cache columns, row identity, well, outer fold, raw MD/X/Y/Z/TVT_input context, and reference manifests.
    - Risk-family values, well aggregation, eligible families, and quartile boundaries are written and SHA-frozen before Stage B loads either OOF file.
    - Stage B uses truth and predictions only to evaluate the frozen attributes; it cannot change attributes, boundaries, direction, coverage, or gates.
    - The exp334 OOF is not a scoring input because exp334 changes the loss rather than the formation surface.


experiment:
  name: "exp228_direct_residual_correction_on_exp226"
  description: Train a direct LightGBM residual corrector on the exp218 ML feature surface with group-safe exp226 K16 OOF predictions as the base.
  route: ensemble
  status: train_completed_rejected_no_inference_no_submit
  created_at: "2026-07-09"
  updated_at: "2026-07-11"

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  ml_feature_surface_parent: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp218_gr_wavelet_rotation_confidence_features_on_exp148
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  implementation_source: direct_residual_correction_on_exp226.py
  diff_summary: >
    Uses the same exp218 feature surface as the ML anchor: exp072 full replay
    base features, exp092 U-projection features, exp145 learned likelihood
    features, and exp218 GR wavelet/rotation confidence features. The target is
    changed from direct TVT residual against last_known_tvt to the group-safe
    exp226 residual `TVT - exp226_oof_pred`; inference adds the learned residual
    to the exp226 K16 fallback submission. Full-train exp226 predictions are
    never used to create train residuals.

validation:
  strategy: groupkfold_by_well_exp218_surface_exp226_oof_residual_target
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_aligned_between_exp218_surface_and_exp226_group_safe_oof
  leakage_policy:
    - Exp226 train residual target is created only from group-safe OOF predictions generated by exp226 train v1.
    - Full-train exp226 predictions are not used for train residual construction.
    - Exp218 feature surface columns remain target-free as documented in exp218.
    - Exp226 OOF true TVT is used only as an alignment check against the exp218 target_tvt.
    - LightGBM folds are grouped by well; a well never appears in train and validation in the same fold.
    - Direct correction is evaluated with overall, distance bucket, worst-well, hidden-like, and residual drift readouts before any submit.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json
  learned_likelihood_train_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_full_train_ml_features.csv.gz
  learned_likelihood_rawtest_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_rawtest_ml_features.csv.gz
  learned_likelihood_train_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_rawtest_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_train_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  learned_likelihood_rawtest_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  exp099_artifact_dir_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts
  exp099_train_feature_cache_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_train_features.csv.gz
  exp099_feature_schema_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_feature_schema.csv
  exp111_artifact_dir_local: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts
  exp111_feature_schema: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts/exp111_learned_pf_observation_likelihood_probe_feature_schema.csv
  exp111_model_manifest: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts/exp111_learned_pf_observation_likelihood_probe_model_manifest.json
  exp112_artifact_dir_local: experiments/exp112_learned_pf_likelihood_weight_or_feature_followup/kaggle/output/train_v1/artifacts
  exp112_feature_schema: experiments/exp112_learned_pf_likelihood_weight_or_feature_followup/kaggle/output/train_v1/artifacts/exp112_learned_pf_likelihood_weight_or_feature_followup_feature_schema.csv
  exp226_train_oof_local: experiments/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/kaggle/output/train_v1/artifacts/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
  exp226_inference_submission_local: /tmp/kaggle-output/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/inference_v1/submission.csv

model:
  name: exp218_surface_lgbm_direct_residual_on_exp226
  estimator: lightgbm
  feature_source: exp218_feature_surface
  target: tvt_minus_exp226_oof_pred
  base_prediction: exp226_oof_pred
  expected_base_feature_count: 196
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  gr_wavelet_rotation_confidence_features:
    prefix: grwr_
    feature_group: gr_wavelet_rotation_confidence
    prefix_slope_window_rows: 80
    slope_clip: [-3.0, 3.0]
    local_windows_rows: [33, 65, 129]
    candidate_match_offsets_rows: [-32, -24, -16, -8, 0, 8, 16, 24, 32]
    typewell_smooth_window: 5
    ncc_weight: 8.0
    wavelet:
      name: db4
      level: 3
      fallback_window: 65
    fft:
      detrend: linear
      top_k_notch: 3
      rotation_band_norm: [0.06, 0.35]
      high_frequency_norm: 0.35
    denoise_filters:
      rolling_median_11:
        kind: rolling_median
        window: 11
      savgol_31_p2:
        kind: savgol
        window: 31
        polyorder: 2
    default_candidate: likpf_mean
    candidate_match_names: [pf_ancc, beam_mean, likpf_mean, sc_ens, hyb]
    candidate_tvt_specs:
      - name: pf_ancc
        column: pf_ancc
        kind: absolute
      - name: beam_mean
        column: beam_mean_d
        kind: delta
      - name: likpf_mean
        column: likpf_mean_d
        kind: delta
      - name: sc_ens
        column: sc_ens_d
        kind: delta
      - name: hyb
        column: hyb_d
        kind: delta
      - name: tvt_dense
        column: tvt_dense_d
        kind: delta
      - name: tvt_densew
        column: tvt_densew_d
        kind: delta
      - name: tvt_dense50
        column: tvt_dense50_d
        kind: delta
  feature_ablation:
    selected_variant: exp218_surface_direct_residual
    active_variants:
      - name: exp218_surface_direct_residual
        description: Same feature columns as exp218; target is TVT minus group-safe exp226 OOF prediction.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
          - gr_wavelet_rotation_confidence
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    active_modes:
      - cpu_threads8
    split_lgb_models:
      train_lgb0: [lgb0]
      train_lgb1: [lgb1]
      train_lgb2: [lgb2]
    modes:
      cpu_threads8:
        description: CPU deterministic LightGBM with fixed thread count for split lgb0/lgb1/lgb2 execution.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
      - kentookumura/exp226-k16-kappa-repro-train
    train_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
      - kentookumura/exp226-k16-kappa-repro-train
    train_aggregate_kernel_sources:
      - kentookumura/exp228-direct-residual-exp226-train-lgb0
      - kentookumura/exp228-direct-residual-exp226-train-lgb1
      - kentookumura/exp228-direct-residual-exp226-train-lgb2
    inference_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp228-direct-residual-exp226-train-lgb0
      - kentookumura/exp228-direct-residual-exp226-train-lgb1
      - kentookumura/exp228-direct-residual-exp226-train-lgb2
      - kentookumura/exp226-k16-kappa-repro-inference
      - kentookumura/exp099-pf-multiobs-likelihood-train
      - kentookumura/exp111-learned-pf-likelihood-train
      - kentookumura/exp112-learned-pf-likelihood-followup-train

generator:
  chunksize: 200000
  include_candidate_values: false
  default_candidate: likpf_mean
  candidates:
    - name: pf_ancc
      column: pf_ancc
    - name: beam_mean
      column: beam_mean
    - name: likpf_mean
      column: likpf_mean
    - name: sc_ens
      column: sc_ens
    - name: hyb
      column: hyb
  row_context_columns:
    - last_known_tvt
    - pf_ancc_std
    - beam_mean_d
    - sc_ens_d
    - hyb_d
    - eval_len
    - md_since
    - likpf_mean_d
  multiobs_global_columns:
    - multiobs_score_max
    - multiobs_score_mean
    - multiobs_score_gap
    - multiobs_top1_source_id
    - multiobs_top1_mae
    - multiobs_top1_ncc
  feature_cache:
    include_candidate_tvt: true
    include_multiobs_scores: true
    include_probability_features: true
    include_expected_error_features: true
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_exp226_oof_base_and_cpu_lgbm_threads8
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - upstream_exp226_k16_group_safe_oof
    - cpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; GRWR feature generation is deterministic per well and has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: true
  notes:
    - Split train notebooks run one LightGBM config each on CPU to avoid Kaggle timeout.
    - The aggregate lgb_mean is formed only after all three split outputs exist.

audit:
  mode: exp218_surface_direct_residual_correction_on_exp226
  output_prefix: exp228_direct_residual_correction_on_exp226
  fast: false
  reference_metrics:
    exp226_cv: 9.427109596582213
    exp226_public_lb: 9.837
    exp218_lgb_mean_pooled_rmse: 8.475793751656624
    exp218_public_lb: 7.843
    exp148_cpu_public_lb: 7.921
    exp082_ensemble_public_lb: 7.601
  expected_train_artifacts:
    - exp228_direct_residual_correction_on_exp226_metrics.csv
    - exp228_direct_residual_correction_on_exp226_by_well.csv
    - exp228_direct_residual_correction_on_exp226_bucket_metrics.csv
    - exp228_direct_residual_correction_on_exp226_projection_feature_summary.csv
    - exp228_direct_residual_correction_on_exp226_learned_feature_summary.csv
    - exp228_direct_residual_correction_on_exp226_grwr_feature_summary.csv
    - exp228_direct_residual_correction_on_exp226_feature_importance.csv
    - exp228_direct_residual_correction_on_exp226_feature_importance_mean.csv
    - exp228_direct_residual_correction_on_exp226_predictions.csv.gz
    - exp228_direct_residual_correction_on_exp226_feature_schema.csv
    - exp228_direct_residual_correction_on_exp226_lgb_models/manifest.json
    - exp228_direct_residual_correction_on_exp226_summary.json

inference:
  mode: saved_split_lgb_booster_inference_with_exp226_base_and_current_test_exp218_surface
  selected_variant: exp218_surface_direct_residual
  selected_mode: cpu_threads8
  selected_model: lgb_mean
  notes:
    - Inference should load lgb0/lgb1/lgb2 split train outputs and average all fold boosters.
    - Base prediction is exp226 inference v1 submission; the model predicts only residual correction.

notes:
  - Implements the `exp226_direct_residual_correction` backlog item as exp228 because exp226 is already used by the Connor Tynan K16 reproduction.
  - Planned Kaggle train cost is 1 active variant, 3 LightGBM configs split into 3 CPU notebooks, 5 folds each, 15 total boosters.
  - Parent/control retraining is not included; exp226 and exp218 are historical baselines.
  - Submit is not automatic because direct residual correction can improve CV while hurting LB.

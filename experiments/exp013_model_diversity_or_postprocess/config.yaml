experiment:
  name: exp013_model_diversity_or_postprocess
  description: Compare conservative postprocess and small model-diversity candidates on top of the exp012 LightGBM residual anchor
  route: ml_model
  status: completed
  created_at: "2026-06-04"
  updated_at: "2026-06-04"

lineage:
  parent: exp012_single_catboost_lightgbm_residual
  diff_summary: Keep the exp012 residual pipeline and LightGBM no-GR anchor, then compare OOF-only postprocess and small HGB/LightGBM diversity candidates

validation:
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Evaluation-zone TVT is used only as the residual target during training/CV and postprocess selection.
    - Train-only formation columns are not used.
    - Postprocess methods use only raw predictions, last-known TVT anchor, and row distance at inference.

data: {}

model:
  name: postprocessed_last_anchor_residual
  primary_strategy: drift_model
  drift_strategy: drift_model
  feature_set: no_gr_signal
  strategies:
    - last_anchor
    - drift_model
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: LGBMRegressor
    params:
      n_estimators: 800
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 80
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 0.1
      n_jobs: 2
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800
  rationale:
    - exp012 lightgbm_no_gr is the current CV and Public LB anchor.
    - last_anchor is much stronger near the hidden segment start, so conservative residual damping may help.
    - HGB no-GR remains useful as a fixed diversity control but should not expand into a large ensemble.

ablation:
  baseline_experiment: exp002_drift_minimal
  baseline_cv: 14.124569
  baseline_public_lb: 12.533
  cv_anchor_experiment: exp012_single_catboost_lightgbm_residual
  cv_anchor_cv: 13.549257
  cv_anchor_public_lb: 12.320
  selected_variant: lightgbm_no_gr
  variants:
    - name: control_hgb_no_gr
      variable: diversity_control
      description: Re-run exp003 selected no-GR HGB as the fixed diversity control.
      overrides:
        model:
          feature_set: no_gr_signal
          drift_model:
            estimator: HistGradientBoostingRegressor
            params:
              max_iter: 180
              learning_rate: 0.05
              max_leaf_nodes: 31
              min_samples_leaf: 80
              l2_regularization: 0.05
              max_bins: 255
    - name: lightgbm_no_gr
      variable: anchor
      description: Re-run exp012 selected LightGBM no-GR residual model as the raw anchor.
      overrides:
        model:
          feature_set: no_gr_signal
          drift_model:
            estimator: LGBMRegressor
            params:
              n_estimators: 800
              learning_rate: 0.03
              num_leaves: 31
              min_child_samples: 80
              subsample: 0.9
              colsample_bytree: 0.9
              reg_lambda: 0.1
              n_jobs: 2

postprocess:
  selected_method: distance_bucket_shrink
  selection_variant: lightgbm_no_gr
  diversity_control_variant: control_hgb_no_gr
  alpha_clip:
    min: 0.20
    max: 1.15
  distance_buckets:
    - name: rows_0_49
      max_step: 49
    - name: rows_50_249
      max_step: 249
    - name: rows_250_999
      max_step: 999
    - name: rows_1000_2499
      max_step: 2499
    - name: rows_2500_plus
      max_step: 1000000000
  candidates:
    global_residual_shrink_alphas: [0.70, 0.80, 0.90, 1.00]
    near_anchor_damping:
      - near_rows: 25
        near_alpha: 0.15
        far_alpha: 1.00
      - near_rows: 50
        near_alpha: 0.20
        far_alpha: 1.00
      - near_rows: 100
        near_alpha: 0.30
        far_alpha: 1.00
    sg_smooth:
      - window: 15
        polyorder: 2
        blend: 0.50
      - window: 31
        polyorder: 2
        blend: 0.50
    blend_lightgbm_weights: [0.70, 0.80, 0.90]
  methods:
    raw: {}
    sg_smooth:
      window: 31
      polyorder: 2
      blend: 0.50
    global_residual_shrink:
      alpha: 1.00
    near_anchor_damping:
      near_rows: 50
      near_alpha: 0.20
      far_alpha: 1.00
    distance_bucket_shrink:
      buckets:
        - max_step: 49
          alpha: 0.20
        - max_step: 249
          alpha: 0.5917180252647632
        - max_step: 999
          alpha: 1.15
        - max_step: 2499
          alpha: 1.15
        - max_step: 1000000000
          alpha: 1.0490770312511664

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  save_well_metrics: true
  save_oof_predictions: true

notes:
  - Submission target column is lowercase tvt, while train target is uppercase TVT.
  - Do not use train-only formation columns directly at inference.
  - Train notebook writes row_oof_predictions.csv, postprocess_metrics.csv, postprocess_distance_bucket_summary.csv, and postprocess_selected_params.json.
  - Inference applies ablation.selected_variant followed by postprocess.selected_method.
  - Postprocess params should be updated from Kaggle full CV before preparing the final inference notebook.

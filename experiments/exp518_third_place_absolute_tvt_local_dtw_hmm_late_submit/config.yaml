experiment:
  name: exp518_third_place_absolute_tvt_local_dtw_hmm_late_submit
  description: >-
    Post-competition correction of the exp515 3rd-place HMM reconstruction.
    The hidden TVT position is represented as an absolute TVT around the saved
    exp374 absolute-TVT HMM posterior mean instead of a last-rate straight
    baseline, and Local-DTW uses time-varying local reference offsets.
  route: pf_beam
  status: completed
  created_at: "2026-08-08"
  updated_at: "2026-08-08"

lineage:
  parent: kaggle_3rd_place_solution_discussion_733319
  steering: ../../docs/legacy/steering/20260808-exp518-third-place-absolute-tvt-local-dtw-hmm-late-submit
  code_structure_references:
    - exp374_exp209_student_t_exact_hmm_emission
    - exp515_third_place_three_family_hmm_late_submit
    - exp231_same_typewell_horizontal_gr_atlas_gated_hmm_emission
    - exp065_typewell_supertype_cluster_cv_audit
  comparison_references:
    exp209_exact_hmm_oof_rmse: 11.938287234887435
    exp374_student_t_df4_hmm_oof_rmse: 11.720478702142103
    third_place_reported_base_hmm_oof_rmse: 6.0492
    third_place_reported_three_family_hmm_oof_rmse: 5.9703
    third_place_reported_public_lb: 6.207
    third_place_reported_private_lb: 6.229
  diff_summary: >-
    Correct exp515 by centering the TVT state on the saved target-free exp374
    absolute-TVT HMM path and allowing plus/minus 60 ft corrections.
    Replace three whole-curve stretch values with locally changing
    reference-position offsets. Keep the published
    three-family references, prefix conditioning, Cauchy emission,
    forward-backward posterior mean, fixed weights, and physical projection.

method_fidelity:
  classification: proxy
  primary_source: https://www.kaggle.com/competitions/rogii-wellbore-geology-prediction/discussion/733319
  source_code_publicly_available: false
  public_mechanisms_preserved:
    - joint_tvt_position_formation_rate_gr_bias_reference_family_state
    - sibling_horizontal_gr_reference
    - target_known_prefix_self_reference
    - prefix_128_inside_hmm_with_tvt_clamp
    - robust_initial_rate_from_last_256_known_rows
    - student_t_df1_emission
    - exact_forward_backward_posterior_mean
    - local_dtw_small_stretch_family
    - fine_0p0625ft_sibling_bin_family
    - fixed_three_family_weights_0p50_0p20_0p30
    - rate_quantile_absolute_rate_and_integrated_correction_projection
  frozen_reconstruction_defaults:
    - saved_exp374_absolute_tvt_hmm_guide
    - absolute_tvt_guide_plus_or_minus_60ft
    - one_ft_position_step
    - nine_rate_correction_states_and_three_bias_states
    - reference_switch_probability
    - self_reference_shrinkage_and_cap
    - local_dtw_time_varying_reference_offset_grid
  claims_forbidden:
    - faithful_reproduction
    - source_code_parity
    - exact_original_hyperparameter_reproduction
    - exact_original_cv_split_reproduction
    - exact_local_dtw_implementation_parity

validation:
  strategy: deterministic_groupkfold_well_fold_safe_sibling_reference_oof
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  truth_attachment: after_prediction_content_sha_freeze
  leakage_policy:
    - Validation-fold wells are excluded in full from every sibling atlas source.
    - Typewell group discovery uses only typewell GR and no horizontal target TVT.
    - Validation horizontal TVT is used only for prefix TVT_input and post-freeze scoring.
    - Public LB is not used to select any family, weight, state grid, transition, or projection value.
  reporting:
    - pooled_rmse
    - fold_rmse
    - family_rmse
    - by_well_rmse
    - boundary_posterior_mass
    - runtime

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  horizontal_suffix: __horizontal_well.csv
  typewell_suffix: __typewell.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  absolute_tvt_guide:
    filename: exp374_exp209_student_t_exact_hmm_emission_predictions.csv.gz
    prediction_column: student_t_df4_on_exp209_absolute_tvt_hmm_tvt
    std_column: student_t_df4_on_exp209_absolute_tvt_hmm_std
    expected_rows: 3783989
    expected_wells: 773
    candidates:
      - /tmp/exp374-selector-source/artifacts/exp374_exp209_student_t_exact_hmm_emission_predictions.csv.gz
      - /kaggle/input/notebooks/kentookumura/exp374-exp209-student-t-exact-hmm-emission-train/artifacts/exp374_exp209_student_t_exact_hmm_emission_predictions.csv.gz
      - /kaggle/input/exp374-exp209-student-t-exact-hmm-emission-train/artifacts/exp374_exp209_student_t_exact_hmm_emission_predictions.csv.gz
  typewell_group_assignment:
    filename: common_typewell_cluster_assignments.csv
    method: native_overlap
    threshold: "1"
    minimum_cluster_size: 2
    candidates:
      - experiments/exp065_typewell_supertype_cluster_cv_audit/artifacts/common_typewell_cluster_assignments.csv
      - /kaggle/input/notebooks/kentookumura/exp065-typewell-supertype-cluster-cv-audit-train/artifacts/common_typewell_cluster_assignments.csv
      - /kaggle/input/exp065-typewell-supertype-cluster-cv-audit-train/artifacts/common_typewell_cluster_assignments.csv
  test_group_mapping:
    method: native_quantized_gr_kgram_then_resampled_cosine_fallback
    kgram_rows: 16
    train_stride_rows: 8
    query_stride_rows: 4
    minimum_matching_kgrams: 2
    signature_points: 128
    minimum_fallback_cosine: 0.90

model:
  name: third_place_three_family_joint_hmm_writeup_reconstruction
  estimator: deterministic_exact_forward_backward
  active_variants:
    - exp417_base_reconstruction
    - local_dtw_reconstruction
    - fine_bin_reconstruction
  family_weights:
    exp417_base_reconstruction: 0.50
    local_dtw_reconstruction: 0.20
    fine_bin_reconstruction: 0.30
  state:
    coordinate: absolute_tvt_around_absolute_hmm_guide
    position_step_ft: 1.0
    guide_band_pad_ft: 60.0
    guide_prior_sigma_floor_ft: 10.0
    guide_prior_std_multiplier: 3.0
    rate_coordinate: correction_to_guide_formation_rate
    rate_delta_min: -0.04
    rate_delta_max: 0.04
    rate_states: 9
    bias_delta_min_gr: -20.0
    bias_delta_max_gr: 20.0
    bias_states: 3
    base_reference_states: 2
    local_dtw_reference_states: 3
    fine_bin_reference_states: 1
  prefix:
    initial_rate_rows: 256
    in_model_rows: 128
    tvt_clamp_sigma_ft: 0.50
    initial_position_sigma_ft: 0.50
    initial_rate_sigma: 0.01
    initial_bias_sigma_gr: 5.0
  reference:
    coarse_sibling_bin_ft: 0.25
    fine_sibling_bin_ft: 0.0625
    base_typewell_sibling_mixtures:
      - [0.2, 0.8]
      - [0.8, 0.2]
    self_reference_shrinkage_rows: 256
    self_reference_max_weight: 0.50
    local_dtw_reference_offsets_ft: [-2.0, 0.0, 2.0]
    minimum_sibling_bin_count: 1
  emission:
    family: student_t
    degrees_of_freedom: 1.0
    formula: -log1p_squared_standardized_residual
    sigma_estimator: prefix_typewell_residual_mad
    sigma_clip_gr: [8.0, 60.0]
    missing_gr_log_likelihood: 0.0
  transition:
    rate_sigma_per_sqrt_ft: 0.002
    rate_momentum: 0.999
    position_sigma_ft: 0.175
    bias_sigma_gr_per_sqrt_ft: 0.35
    reference_switch_probability: 0.001
    local_dtw_neighbor_switch_probability: 0.01
    position_kernel_cells: 5
  decode:
    method: exact_forward_backward
    output: posterior_mean
    family_mix: fixed_convex_combination
  projection:
    prefix_rate_quantiles: [0.01, 0.99]
    absolute_formation_rate_cap: 0.25
    integrated_tvt_correction_cap_ft: 10.0


schema_version: 1.0.0
source_of_truth: exp263_deployable12_plus_saved_exp333_stage1_oof
expected_rows: 3783989
expected_wells: 773

score_candidates:
  - {id: exp226_k16, kind: primitive, family: geometry}
  - {id: selfgr_hmm_a070, kind: primitive, family: self_gr_hmm}
  - {id: likpf_mean, kind: primitive, family: likelihood_pf}
  - {id: exact_hmm, kind: primitive, family: exact_hmm}
  - {id: pf_ancc, kind: primitive, family: particle_filter}
  - {id: beam_mean, kind: primitive, family: beam}
  - id: exp226_k16__selfgr_hmm_a070
    kind: pair_mean_50
    family: geometry_self_gr_hmm_pair
    parents: [exp226_k16, selfgr_hmm_a070]
    weights: [0.5, 0.5]
  - id: exp226_k16__exact_hmm
    kind: pair_mean_50
    family: geometry_exact_hmm_pair
    parents: [exp226_k16, exact_hmm]
    weights: [0.5, 0.5]
  - id: exp226_k16__likpf_mean
    kind: pair_mean_50
    family: geometry_likelihood_pf_pair
    parents: [exp226_k16, likpf_mean]
    weights: [0.5, 0.5]
  - id: selfgr_hmm_a070__likpf_mean
    kind: pair_mean_50
    family: self_gr_hmm_likelihood_pf_pair
    parents: [selfgr_hmm_a070, likpf_mean]
    weights: [0.5, 0.5]
  - id: likpf_mean__exact_hmm
    kind: pair_mean_50
    family: likelihood_pf_exact_hmm_pair
    parents: [likpf_mean, exact_hmm]
    weights: [0.5, 0.5]
  - id: exp226_w500_50_50
    kind: named_fixed
    family: geometry_likelihood_pf_exact_hmm_fixed
    parents: [exp226_k16, likpf_mean, exact_hmm]
    weights: [0.5, 0.25, 0.25]
  - id: exp333_segment_offset
    kind: learned_segment_offset
    family: exp226_segment_residual
    source_experiment: exp333_exp226_k16_segment_residual_offset_target
    source_fold_role: saved_exp226_oof_provenance
    selector_join_policy: global_well_id_row_idx_then_exp263_fold_repartition
    source_fold_used_as_model_feature: false

legal_domains:
  primitive_pair_bank:
    role: primary_meta_domain
    candidates:
      - exp226_k16
      - selfgr_hmm_a070
      - likpf_mean
      - exact_hmm
      - pf_ancc
      - beam_mean
      - exp226_k16__selfgr_hmm_a070
      - exp226_k16__exact_hmm
      - exp226_k16__likpf_mean
      - selfgr_hmm_a070__likpf_mean
      - likpf_mean__exact_hmm
      - exp333_segment_offset
  primitive_fixed_bank:
    role: unchanged_fixed_fallback_comparison_domain
    candidates:
      - exp226_k16
      - selfgr_hmm_a070
      - likpf_mean
      - exact_hmm
      - pf_ancc
      - beam_mean
      - exp226_w500_50_50

candidate_id_model_encoding:
  type: one_hot
  order_source: score_candidates_declared_order
  width: 13
  keep_string_id_in_artifacts: true
  ordinal_index_as_model_feature: false

confidence_contract:
  native_confidence_required_for_every_candidate: false
  exp333_native_confidence_available: false
  exp333_confidence_valid_value: false
  universal_proxy_required_for_every_candidate: true
  universal_proxy_groups:
    - candidate_availability_and_coverage
    - candidate_anchor_distance
    - candidate_local_shape
    - candidate_bank_disagreement
    - candidate_family_and_kind_one_hot

forbidden_behaviors:
  - use_exp333_tvt_true_as_feature
  - use_exp333_source_outer_fold_as_feature
  - require_exp333_source_fold_equal_exp263_selector_fold
  - use_candidate_error_or_oracle_as_feature
  - change_selector_objective_or_lightgbm_config
  - add_exp333_to_fixed_fallback_domain
  - tune_candidate_weight_or_usage_threshold_on_same_oof
  - softmax_average_candidate_tvt
  - train_downstream_tvt_in_stage_c_run
  - inference_or_submission_before_gate

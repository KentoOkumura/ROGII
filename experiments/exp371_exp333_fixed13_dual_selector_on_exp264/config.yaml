experiment:
  name: exp371_exp333_fixed13_dual_selector_on_exp264
  description: >-
    Adds the saved exp333 Stage 1 OOF as the thirteenth candidate to the
    corrected exp264 candidate-long dual selector. The selector objectives,
    folds, sampling, raw-test-safe context, LightGBM settings, and fixed
    fallback domain remain unchanged.
  route: ml_model
  status: completed_stage_d_mean_improved_tail_gate_failed_closed
  created_at: "2026-07-24"
  updated_at: "2026-07-25"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_parent: exp333_exp226_k16_segment_residual_offset_target
  novelty_evidence: exp361_exp333_candidate_path_addone_novelty_audit
  fixed_bank_source: exp263_last_anchor_better_candidate_confidence_pair_cache
  design_source: .steering/20260724-exp371-exp333-fixed13-dual-selector-on-exp264
  diff_summary: >-
    Changes only the candidate inventory from the corrected exp264 fixed12
    score bank to fixed12 plus exp333_segment_offset. Exp333 is added to the
    primary hard-select domain; the seven-candidate fixed fallback domain is
    unchanged. Exp333 is globally key-joined and repartitioned by the existing
    exp263 selector fold while its saved-exp226 source fold is retained only
    as provenance. No objective, selector fold, sample cap, LightGBM parameter,
    candidate weight or threshold changes. After the frozen selector safety gate
    failed on by-well tails, the user explicitly allowed the already-designed
    downstream add-only TVT test because pooled selector RMSE improved. The
    original selector gate remains failed and is not reclassified.

validation:
  strategy: outer5_groupkfold_fixed13_selector_then_inner4_nested_stacking
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_candidates: 13
  expected_primary_candidates: 12
  expected_fixed_fallback_candidates: 7
  expected_compact_features: 77
  fold_source: exp263_selector_outer_fold_after_global_exp333_key_join
  leakage_policy:
    - exp333 OOF is read through well_id,row_idx,outer_fold,tvt_pred_stage1 only.
    - The colocated exp333 tvt_true column is not opened before feature freeze.
    - Exp333 outer_fold is saved-exp226 OOF provenance and is not a selector feature.
    - Exp333 is globally joined by well_id,row_idx and repartitioned by exp263 selector outer_fold.
    - Each exp333 prediction remains OOF with respect to its own well under its source fold.
    - Source-fold equality with the independently balanced exp263 selector fold is not required.
    - Outer-valid wells are excluded from inner assignment, fit, and early stopping.
    - Outer-train compact rows use inner OOF scores only.
    - Outer-valid compact rows use the four inner-model ensemble only.
    - Parent exp264 scores are post-fit audit input and never selector features.


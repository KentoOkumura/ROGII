reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: GroupKFold by well without shuffle; HistGradientBoostingRegressor random_state=42; exact HMM has no RNG.
  stochastic_components:
    - HistGradientBoostingRegressor internal randomized feature binning is fixed by random_state
  parallel_rng_policy: residual-scale fits and HMM well generation are sequential; no global RNG or thread-scheduled random stream is used.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - docs/06_reproducibility.md checked on 2026-07-12.
    - No raw-test sigma regeneration, inference, or submission is implemented in this train-side audit.

notes:
  - Kaggle push guard: one active variant, five CPU residual-scale cross-fit fits, one HMM variant, zero LightGBM boosters, and no parent/control retraining.
  - The HMM stage is skipped if the residual-scale calibration guard fails.
  - exp221 / exp229 are scalar train-side references only; their control models are not rerun.

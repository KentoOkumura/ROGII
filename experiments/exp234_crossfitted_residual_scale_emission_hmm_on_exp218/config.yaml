    - /kaggle/input/exp234-crossfitted-residual-scale-hmm-exp218-train/artifacts/exp234_crossfitted_residual_scale_emission_hmm_on_exp218_crossfitted_residual_scale_emission_hmm_train_features.csv.gz
    - /tmp/kaggle-output/exp234_crossfitted_residual_scale_emission_hmm_on_exp218/train_v1/artifacts/exp234_crossfitted_residual_scale_emission_hmm_on_exp218_crossfitted_residual_scale_emission_hmm_train_features.csv.gz
    - /kaggle/working/artifacts/exp234_crossfitted_residual_scale_emission_hmm_on_exp218_crossfitted_residual_scale_emission_hmm_train_features.csv.gz

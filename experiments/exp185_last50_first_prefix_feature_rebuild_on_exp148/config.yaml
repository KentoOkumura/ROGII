notes:
  - Implements the low-priority backlog item last50_first_prefix_feature_rebuild_on_exp148.
  - Cache notebook generates last50-first prefix rebuild features before LightGBM training.
  - Train notebooks load the cache and evaluate the rebuild variant; they do not regenerate crop features during LightGBM training.
  - Training is split into lgb0/lgb1/lgb2 Kaggle GPU notebooks to reduce timeout risk while satisfying the requested GPU execution.
  - Active run plan is 1 enabled variant x 1 GPU mode x 3 LightGBM configs x 5 folds = 15 boosters; exp148 control is not retrained.
  - Primary decision is whether last50-first rebuilt prefix-derived features improve exp148 without near-row or worst-well regressions.
  - Direct submission should wait for OOF, feature importance, raw-test/current-test parity, and worst-well review.

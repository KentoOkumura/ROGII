experiment:
  name: "exp185_last50_first_prefix_feature_rebuild_on_exp148"
  description: Rebuild prefix-derived exp148 LightGBM features after first cropping each known prefix source frame to the last 50 rows.
  route: ml_model
  status: completed_negative_no_submit
  created_at: "2026-07-04"
  updated_at: "2026-07-04"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp092_u_projection_correction_disagreement_fullrun
    - exp154_segment_level_dense_candidate_verifier_on_exp148
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148
    - exp098_selector_rank_slot_features_on_exp073
    - exp082_public_artifact_replay_followup
  implementation_source: last50_first_prefix_feature_rebuild_on_exp148.py
  diff_summary: Tests the backlog item last50_first_prefix_feature_rebuild_on_exp148. Each well's raw known TVT_input prefix is first cropped to the last 50 known-prefix rows, then prefix-derived statistics, x/y/z trajectory geometry, TVT aggregate/slope/calibration, SC/NCC, and multi-observation candidate scores are rebuilt from that cropped frame. Stable anchor columns, base candidate TVT values, U-projection, and learned probability/error features stay on the exp148 surface. Control retraining is disabled; LightGBM split training runs lgb0/lgb1/lgb2 on Kaggle GPU.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_last50_first_prefix_rebuild
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_exp145_full_train_ml_feature_cache_and_last50_prefix_rebuild_features
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - Last50 prefix rebuild features use only raw horizontal known prefix rows ending at the finite TVT_input anchor plus target-free candidate values already present in the exp148 surface.
    - The source prefix frame is deterministically cropped to the last 50 known-prefix rows before prefix-derived TVT/GR/trajectory/calibration/SC/NCC/multiobs features are computed; training/evaluation rows are not cropped.
    - PF/Beam, likelihood-PF, U-projection, base candidate values, and learned probability/error model outputs are not regenerated with crop windows.
    - Learned multiobs score/MAE/NCC columns from exp145 are removed from the active variant and replaced by target-free last50 rebuild multiobs columns.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache covers the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


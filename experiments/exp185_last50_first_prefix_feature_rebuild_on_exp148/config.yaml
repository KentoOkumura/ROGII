model:
  name: exp185_last50_first_prefix_feature_rebuild_on_exp148_lgbm
  source_experiment: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_experiment: exp092_u_projection_correction_disagreement_fullrun
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  learned_likelihood_feature_experiment: exp145_learned_likelihood_rawtest_feature_generator_parity
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_exp145_full_train_ml_features_with_full_prefix_columns_replaced_by_last50_first_prefix_rebuild_features
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  prefix_crop_window_features:
    prefix: pcrop_
    feature_group: last50_prefix_rebuild
    windows:
      last50:
        kind: last_n
        rows: 50
        min_rows: 8
    observation_offsets: [-24, -12, 0, 12, 24]
    gr_rolling_window: 5
    gr_scale: 18.0
    out_of_range_scale: 80.0
    ncc_half_windows: [8, 15, 25]
    ncc_stride: 3
    ncc_max_starts: 256
    progress_every_wells: 25
    candidates:
      - name: pf_ancc
        column: pf_ancc
        kind: absolute
      - name: beam_mean
        column: beam_mean_d
        kind: delta
      - name: likpf_mean
        column: likpf_mean_d
        kind: delta
      - name: sc_ens
        column: sc_ens_d
        kind: delta
      - name: hyb
        column: hyb_d
        kind: delta
  feature_ablation:
    selected_variant: last50_first_prefix_rebuild
    active_variants:
      - name: exp148_fulltrain_control
        description: Disabled by cost guard; use completed exp148 CV/Public LB as the comparison baseline unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
        enabled: false
      - name: last50_first_prefix_rebuild
        description: Drop exp148 full-prefix-derived base columns and learned multiobs score/MAE/NCC columns, then add the last50-first rebuilt prefix statistics, trajectory geometry, SC/NCC, and multiobs features.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence_no_multiobs
          - prefix_crop_last50
        drop_columns:
          - sc8_d
          - sc8_sc
          - sc15_d
          - sc15_sc
          - sc25_d
          - sc25_sc
          - sc_cons_d
          - sc_ens_d
          - sc_trust
          - cal_a
          - cal_b
          - pfx_rmse
          - known_len
          - slp_all
          - slp_50
          - slp_z
          - slp_b_d_all
          - slp_b_d_50
          - ktvt_range
          - ktvt_std
          - gr_vs_slp_all
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    active_modes:
      - cpu_deterministic_threads8
    modes:
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    prefix_crop_features:
      enable_gpu: true
    train_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
      - kentookumura/exp185-l50rebuild-features
    inference_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp185-last50-prefix-rebuild-exp148-train
      - kentookumura/exp099-pf-multiobs-likelihood-train
      - kentookumura/exp111-learned-pf-likelihood-train
      - kentookumura/exp112-learned-pf-likelihood-followup-train
    train_lgb0:
      enable_gpu: false
    train_lgb1:
      enable_gpu: false
    train_lgb2:
      enable_gpu: false

inference:
  selected_variant: last50_first_prefix_rebuild
  selected_mode: cpu_deterministic_threads8
  selected_model: lgb_mean

generator:
  chunksize: 200000
  include_candidate_values: false
  default_candidate: likpf_mean
  candidates:
    - name: pf_ancc
      column: pf_ancc
    - name: beam_mean
      column: beam_mean
    - name: likpf_mean
      column: likpf_mean
    - name: sc_ens
      column: sc_ens
    - name: hyb
      column: hyb
  row_context_columns:
    - last_known_tvt
    - pf_ancc_std
    - beam_mean_d
    - sc_ens_d
    - hyb_d
    - eval_len
    - md_since
    - likpf_mean_d
  multiobs_global_columns:
    - multiobs_score_max
    - multiobs_score_mean
    - multiobs_score_gap
    - multiobs_top1_source_id
    - multiobs_top1_mae
    - multiobs_top1_ncc
  feature_cache:
    include_candidate_tvt: true
    include_multiobs_scores: true
    include_probability_features: true
    include_expected_error_features: true
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - upstream_rawtest_pf_beam_regeneration_for_inference
  parallel_rng_policy: LightGBM GPU deterministic flags plus fixed n_jobs and num_threads where supported; feature merge itself has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a full-train last50-first prefix feature rebuild audit, not a deterministic submission anchor.
    - Inference code is implemented against exp145 raw-test features, but submission should wait for full-row OOF and worst-well review.


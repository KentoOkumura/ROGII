experiment:
  name: exp050_xgboost_pseudo_tail_inference_submit
  description: Port exp049 XGBoost pseudo-tail fixed bucket-shrink model to Kaggle inference
  route: ml_model
  status: submitted
  created_at: "2026-06-10"
  updated_at: "2026-06-10"

lineage:
  parent: exp049_xgboost_pseudo_tail_residual
  diff_summary: Reuse exp026 inference flow but replace the final residual estimator with the exp049 XGBoost pseudo-tail model and keep exp025-selected fixed bucket-shrink postprocess.

validation:
  leakage_policy:
    - Final inference fit uses only official train wells.
    - Pseudo cutoffs are generated only inside train wells.
    - Test predictions use only each test well's known TVT_input prefix.
    - Train-only formation columns are not used.
    - Fixed bucket shrink parameters are selected by exp025 held-out OOF audit, not by public LB.

data: {}

model:
  name: xgboost_pseudo_tail_bucket_shrink_inference
  primary_strategy: drift_model
  drift_strategy: drift_model
  feature_set: no_gr_signal
  strategies:
    - last_anchor
    - recent_linear
    - drift_model
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: XGBRegressor
    params:
      n_estimators: 900
      learning_rate: 0.03
      max_depth: 6
      min_child_weight: 8.0
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      reg_alpha: 0.0
      tree_method: hist
      n_jobs: 2
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800

audit:
  parent_train_experiment: exp023_pseudo_tail_distance_augmentation
  parent_inference_experiment: exp026_pseudo_tail_bucket_shrink_inference_submit
  parent_postprocess_audit: exp025_pseudo_tail_postprocess_cv_audit
  parent_xgboost_experiment: exp049_xgboost_pseudo_tail_residual
  parent_best_variant: xgboost_pseudo_tail_3_cutoffs_distance_balanced_exp014_bucket_shrink_params
  raw_lightgbm_pseudo_tail_cv: 12.942938
  raw_xgboost_pseudo_tail_cv: 12.839225
  xgboost_fixed_bucket_shrink_cv: 12.779452
  lightgbm_fixed_bucket_shrink_cv: 12.870780
  raw_pseudo_tail_public_lb: 12.166
  lightgbm_fixed_bucket_shrink_public_lb: 12.102
  xgboost_fixed_bucket_shrink_public_lb: 12.083
  submission_ref: 53521999
  submission_version: v020
  selected_postprocess: exp014_bucket_shrink_params
  selected_postprocess_cv: 12.779452
  selected_delta_vs_raw_xgboost: -0.059773
  selected_delta_vs_exp026_cv: -0.091328
  same_oof_bucket_alpha_fit_cv: 12.863570
  training_variants:
    enabled: true
    selected_variant: xgboost_pseudo_tail_3_cutoffs_distance_balanced
    variants:
      - name: xgboost_pseudo_tail_3_cutoffs_distance_balanced
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
  pseudo_tail:
    min_prefix_rows: 200
    min_pseudo_eval_rows: 250
    cutoff_strategy: quantile
  distance_buckets:
    - name: rows_0_49
      max_step: 49
    - name: rows_50_249
      max_step: 249
    - name: rows_250_999
      max_step: 999
    - name: rows_1000_2499
      max_step: 2499
    - name: rows_2500_plus
      max_step: 1000000000

postprocess:
  selected_method: distance_bucket_shrink
  candidate_methods:
    - raw
    - distance_bucket_shrink
  methods:
    raw: {}
    distance_bucket_shrink:
      name: exp014_bucket_shrink_params
      buckets:
        - name: rows_0_49
          max_step: 49
          alpha: 0.20
        - name: rows_50_249
          max_step: 249
          alpha: 0.5917180252647632
        - name: rows_250_999
          max_step: 999
          alpha: 1.15
        - name: rows_1000_2499
          max_step: 2499
          alpha: 1.15
        - name: rows_2500_plus
          max_step: 1000000000
          alpha: 1.0490770312511664

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  kaggle:
    kernel_sources: []

notes:
  - exp049 selected fixed exp014_bucket_shrink_params at CV 12.779452.
  - exp025 same-OOF bucket alpha fit 12.863570 is not used.
  - This experiment generates a Kaggle inference submission for submit-check. Submit only after explicit confirmation because competition submissions are limited.

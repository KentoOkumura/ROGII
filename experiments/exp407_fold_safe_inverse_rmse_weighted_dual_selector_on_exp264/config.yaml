candidate_task_weight:
  enabled: true
  application: training_rows_only
  unit: candidate_within_exact_model_fit_partition
  fit_partition_stage_b: deterministic_sampled_outer_train_base_rows
  fit_partition_stage_c: deterministic_sampled_inner_train_base_rows
  truth_join_after_schema_fold_and_row_freeze: true
  rmse:
    expression: sqrt(mean((candidate_tvt - true_tvt)^2))
    epsilon_ft: 1.0e-6
  inverse:
    exponent: 1.0
    expression: 1 / max(candidate_rmse, epsilon_ft)
  normalization:
    before_clip: divide_by_candidate_mean
    clip: [0.5, 1.5]
    after_clip: divide_by_candidate_mean
    final_mean: 1.0
    final_mean_absolute_tolerance: 1.0e-12
    final_range: [0.5, 1.5]
    fail_if_final_range_violated: true
  objectives:
    pred_abs_error: same_candidate_task_weight
    p_within10: same_candidate_task_weight
  validation_weight: none
  metric_weight: none
  persist_fold_tables:
    - fit_candidate_rmse
    - raw_inverse_rmse
    - mean_normalized_weight
    - clipped_weight
    - final_weight
    - fit_row_count
    - fit_row_id_content_sha256
  forbidden:
    - global_oof_weight_for_fit
    - outer_valid_truth
    - inner_valid_truth
    - hidden_like_truth
    - current_test_truth
    - inverse_square
    - exponent_grid
    - clip_grid
    - candidate_specific_manual_weight
    - objective_specific_weight
    - candidate_subset
    - beam_removal
    - weight_as_model_feature


experiment:
  name: exp407_fold_safe_inverse_rmse_weighted_dual_selector_on_exp264
  description: >-
    Keep the corrected exp264 twelve-candidate bank unchanged and test whether
    fold-safe inverse candidate-RMSE task weights reduce negative transfer in
    the shared dual-objective selector.
  hypothesis: >-
    Downweighting globally weak candidate tasks without removing their rows or
    changing inference domains can improve unweighted selector calibration and
    hard readouts by reducing shared-model capacity dilution.
  route: ml_model
  status: stage_b_completed_scientific_fail_closed
  created_at: "2026-07-26"
  updated_at: "2026-07-26"
  inference_enabled: false
  submission_enabled: false
  next_action: close_exp407_without_rescue_and_keep_exp264_as_selector_anchor

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_source: exp263_last_anchor_better_candidate_confidence_pair_cache
  selector_method_parent: exp264_corrected_stage_b_v5
  downstream_method_parent: exp264_corrected_stage_c_v6_and_stage_d_v3
  steering: ../../docs/legacy/steering/20260726-exp407-fold-safe-inverse-rmse-weighted-dual-selector-on-exp264
  references:
    - docs/06_reproducibility.md
    - experiments/exp264_exp263_candidate_confidence_dual_selector/config.yaml
    - experiments/exp264_exp263_candidate_confidence_dual_selector/candidate_contract.yaml
    - experiments/exp264_exp263_candidate_confidence_dual_selector/metrics.json
  diff_summary: >-
    Change only the candidate-long training sample weight. For each exact model
    fit partition, compute actual-TVT RMSE per candidate from fit rows, convert
    inverse RMSE to mean-one clipped candidate weights, and apply the same
    weight to both selector objectives. Keep all candidates, values, features,
    folds, sampling, model parameters, legal domains, validation metrics, and
    downstream adapters fixed.


validation:
  strategy: outer5_groupkfold_selector_then_conditional_outer5_inner4_nested_stacking
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  expected_base_rows: 3783989
  expected_wells: 773
  expected_outer_folds: [0, 1, 2, 3, 4]
  primary_metrics_unweighted: true
  secondary_metrics:
    - candidate_expected_error_mae
    - candidate_within10_logloss
    - candidate_within10_brier
    - calibration_error
    - hard_primary_top1_rmse
    - distance_bucket_rmse
    - hidden_like_rmse
    - fold_rmse
    - worst_well_regression
  leakage_policy:
    - Freeze the parent feature schema, candidate order, fit row IDs, and folds before joining truth for labels or weights.
    - Compute each weight table only from the exact sampled fit rows for that model.
    - Outer-valid, inner-valid, hidden-like, current-test, global-OOF truth, errors, and oracle labels are forbidden from weight calculation.
    - Stage B weights use sampled outer-train rows only.
    - Conditional Stage C weights use sampled inner-train rows only for each outer-inner model.
    - Validation data receives no sample weights and every reported metric is unweighted.
    - Weight tables are training controls and are never model features or current-test inputs.
    - Downstream outer-train compact features must remain inner OOF and outer-valid compact features must remain inner-model ensemble predictions.


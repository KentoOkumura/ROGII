inference:
  mode: not_selected_train_side_audit_only
  selected_variant: null
  notes:
    - No inference notebook candidate is selected by this implementation.
    - A positive OOF result still needs worst-well, near-row, distance bucket, path switch, exp115 hidden-like, hmdn sparse-coverage, and raw-test/current-test parity review before inference work.

notes:
  - Implements backlog item heatmap_mdn_candidates_into_selector_or_ml_features as selector add-only feature path.
  - Planned Kaggle train cost before push is 1 active add-only selector variant, 3 LightGBM configs, 5 folds, 15 boosters.
  - Parent/control retraining is not included.
  - Heatmap MDN topK values are features only; direct replacement, weighted TVT, PF weight replacement, full-length inference port, and submit are explicitly out of scope.

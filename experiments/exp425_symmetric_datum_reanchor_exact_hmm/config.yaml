model:
  name: symmetric_datum_reanchor_exact_hmm
  parent_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    rate_step: 0.005
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    emission: gauss
    rate_center: zero
  first_pass:
    treatment: none
    require_saved_exp209_prediction_parity_ft: 1.0e-5
    persist_filtered_position_std: true
    persist_filtered_rate_mean: true
    persist_filtered_rate_std: true
    persist_smoothed_rate_mean: true
  trigger:
    statistic: standardized_smoothed_minus_filtered_rate
    denominator_floor: 0.005
    absolute_z_threshold: 2.0
    rolling_window_rows: 16
    qualifying_rows_min: 8
    same_sign_fraction_min: 0.75
    event_definition: first_false_to_true_persistent_activation
    maximum_events_per_well: 1
    rate_sign_selects_datum_direction: false
    tie_policy: inactive
    freeze_before_truth: true
    recompute_from_treatment: false
  datum_branch:
    explicit_state_values:
      - negative
      - parent
      - positive
    branch_count: 3
    prior_mass:
      negative: 0.10
      parent: 0.80
      positive: 0.10
    shift_source: first_pass_filtered_position_std_at_event
    shift_scale: 1.0
    shift_floor_ft: 0.35
    shift_formula: max(filtered_position_std_ft, 0.35)
    negative_shift_sign: -1
    positive_shift_sign: 1
    event_transition_only: true
    persist_branch_identity_after_event: true
    allow_branch_switch_after_event: false
    allow_additional_events: false
    selection: exact_sum_product_soft_marginalization
    hard_map_or_viterbi_selection: false
  treatment_fixed_parent_components:
    rate_grid: true
    rate_transition: true
    momentum: true
    sig_r: true
    position_noise: true
    gr_emission: true
    initial_prior: true
    state_support: true
    posterior_mean_readout: true

validation:
  strategy: stage_0_fixed32_two_pass_then_stage_1_full_773_two_pass
  reporting_folds: 5
  metric: rmse
  group_column: well_id
  truth_join: after_first_pass_event_and_treatment_prediction_freeze
  stage_0:
    role: mechanism_preflight_only
    baseline_variants: 1
    baseline_hmm_well_runs: 32
    treatment_variants: 1
    treatment_hmm_logical_well_runs: 32
    treatment_branch_states: 3
    total_logical_hmm_well_runs: 64
    technical:
      expected_wells: 32
      expected_backward_cause_wells: 8
      expected_forward_cause_wells: 8
      expected_control_wells: 16
      finite_coverage: 1.0
      normalization_max_abs_error: 1.0e-5
      untreated_parent_parity_max_abs_ft: 1.0e-5
      event_wells_min: 8
      require_event_well_all_folds: true
      full_runtime_projection_max_seconds: 30600
      peak_rss_max_gb: 25
      truth_reads_before_freeze: 0
      episode_reads_before_freeze: 0
    mechanism:
      soft_datum_direction_agreement_min: 0.60
      per_fold_direction_agreement_strictly_above: 0.50
      passing_folds_min: 4
      backward_cause_sse_reduction_min: 0.10
      forward_cause_sse_regression_max: 0.02
      control_rmse_delta_max_ft: 0.02
      control_reanchor_posterior_mass_mean_max: 0.10
      active_reanchor_posterior_mass_mean_min: 0.05
    fail_policy: close_without_trigger_shift_prior_gate_or_readout_rescue
  stage_1:

experiment:
  name: exp425_symmetric_datum_reanchor_exact_hmm
  description: >-
    Completed fail-closed exact-HMM mechanism experiment that froze the first
    exp412 persistent beta-filter rate-disagreement event, created negative,
    parent, and positive absolute-datum branches once, and used exact
    full-sequence evidence to soft-marginalize them without changing the
    exp209 rate process.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-28"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  evidence_parents:
    - exp408_hmm_message_rate_basin_audit
    - exp412_beta_filter_rate_disagreement_two_pass_reset
  comparison_references:
    - exp290_piecewise_datum_physical_smoother
    - exp424_exp209_momentum1_exact_hmm_ablation
  diff_summary: >-
    Keep the exp209 rate grid, rate transition, position noise, GR emission,
    priors, support, and posterior-mean readout fixed. After an unchanged
    first pass, freeze the first persistent exp412 beta-filter rate-gap event.
    At that single event, add explicit negative and positive datum-reanchor
    states beside the parent datum state; do not use the rate-gap sign to
    choose the datum direction.

steering:
  path: ../../.steering/20260728-exp425-symmetric-datum-reanchor-exact-hmm

design:
  phase: late
  priority: P3
  risk: high
  implementation_authorized: true
  implementation_approval_source: user_message_implement_exp425_symmetric_datum_reanchor_exact_hmm_2026_07_28
  canonical_notebook_adoption_authorized: true
  canonical_notebook_adoption_approval_source: user_message_implement_exp425_symmetric_datum_reanchor_exact_hmm_2026_07_28
  kaggle_stage_0_authorized: true
  kaggle_stage_0_approval_source: user_message_execute_exp425_2026_07_28
  kaggle_stage_0_completed: true
  kaggle_stage_0_kernel_version: 1
  kaggle_stage_0_kernel_id_no: 128930925
  kaggle_stage_0_result: stage0_fail_closed
  stage_1_eligible: false
  kaggle_stage_1_authorized: false
  inference_authorized: false
  submission_authorized: false
  stage_0_role: mechanism_preflight_only_not_cv_or_promotion
  single_factor_change: explicit_symmetric_absolute_datum_branch
  rescue_grid_allowed: false
  assumption: >-
    Persistent beta-filter rate disagreement is useful as a target-free
    indicator that the parent path may be translation-locked, but its rate
    correction sign is not a reliable absolute-datum correction sign.


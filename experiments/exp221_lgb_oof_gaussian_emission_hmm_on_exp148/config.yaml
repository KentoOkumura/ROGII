reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: hmm_no_rng_lgb_oof_fixed_inputs
  stochastic_components: []
  parallel_rng_policy: HMM consumes no RNG; outer job scheduling can change tiny floating point ordering, so compare RMSE and feature content hashes with documented tolerances.
  feature_sha_policy: decompressed_content_sha_for_gzip plus raw gzip SHA recorded separately
  record:
    kernel_version: true
    input_sha: false
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - This experiment is a train-side no-training ensemble audit, not a deterministic submission anchor.
    - LGB sigma/lambda are global grid values, not row-wise error-calibrated parameters.

inference:
  mode: lgb_emission_hmm_current_test_saved_exp148_lgb_mean
  selected_candidate: hmm_lgb_exp148_lgb_mean_s2000_l0500
  selected_source: exp148_lgb_mean
  selected_sigma: 20.0
  selected_lambda: 0.50
  exp148_variant: learned_likelihood_confidence_addonly
  exp148_mode: gpu_repro_guard_dp_threads8
  exp148_model: lgb_mean
  exp148_use_gpu: auto
  strict_sample_ids: true
  notes:
    - Kaggle train v3 passed train-side gates; inference stays in this exp221 directory.
    - exp148 saved LightGBM boosters generate current-test lgb_mean predictions inside this notebook before HMM inference.
    - Visible test files are sample-only and are not used as a scoring checklist.

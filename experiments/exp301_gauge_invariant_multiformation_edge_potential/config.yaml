    - exact_hmm
    - pf_ancc
    - beam_mean
  pairs:
    exp226_k16__selfgr_hmm_a070: [exp226_k16, selfgr_hmm_a070]
    exp226_k16__exact_hmm: [exp226_k16, exact_hmm]
    exp226_k16__likpf_mean: [exp226_k16, likpf_mean]

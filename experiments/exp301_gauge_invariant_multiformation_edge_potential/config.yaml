experiment:
  name: exp301_gauge_invariant_multiformation_edge_potential
  description: >-
    Reconstructs one gauge-invariant two-dimensional geological potential from
    within-well edge differences of all six formation surfaces, then anchors the
    field at the last known TVT_input row to emit one direct physical TVT candidate.
  route: pf_beam
  status: kaggle_cpu_v2_completed_stage0_fail_branch_closed
  phase: completed_fail_closed_before_stage1
  created_at: "2026-07-20"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.score_rows

lineage:
  parent: null
  comparisons:
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp289_fault_aware_transductive_geological_potential
    - exp293_physics_only_candidate_bank_headroom_contract
  design_source: docs/legacy/steering/20260720-exp301-gauge-invariant-multiformation-edge-potential
  reserved_followup_contract: reserved_followup_contract.md
  references:
    - docs/06_reproducibility.md
    - backlog/KAGGLE_DIRECTION.md gauge_invariant_multiformation_edge_potential
  diff_summary: >-
    Starts an independent physical-model family. Unlike ANCC absolute-surface,
    latent-datum, fault-risk, KNN drift, GR, and candidate-selector approaches,
    it discards formation absolute levels and integrates only robust within-well
    differences from all six formations into one smooth scalar potential.

validation:
  strategy: fixed_exp226_outer_groupkfold_gauge_invariant_edge_potential
  metric: rmse
  seed: 42
  n_folds: 5
  trained_folds: 0
  group_column: well_id
  fold_source: exp226_saved_oof_well_fold_identity
  score_rows: TVT_input_isna
  expected_prediction_rows: 3783989
  expected_wells: 773
  transductive_scope: outer_train_donor_plus_outer_valid_geometry_only
  allowed_outer_valid_columns: [well_id, row_index, MD, X, Y, Z, TVT_input]
  forbidden_outer_valid_before_prediction_freeze:
    - TVT
    - GR
    - ANCC
    - ASTNU
    - ASTNL
    - EGFDU
    - EGFDL
    - BUDA
    - target_error
    - oracle_rank
  fold_exclusion: entire_outer_valid_fold
  inference_same_name_exclusion: exclude_matching_train_well_from_donors
  truth_join_policy: after_prediction_content_sha_freeze
  report_scopes:
    - pooled
    - fold
    - distance_bucket
    - distance_1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - by_well
    - well_bias


physics:
  name: gauge_invariant_multiformation_edge_potential
  state: U_equals_TVT_plus_Z
  observation_equation: delta_U_equals_delta_formation_surface
  prediction_equation: >-
    TVT_hat_r = TVT_input_anchor + Z_anchor
    + Phi_XY_r - Phi_XY_anchor - Z_r
  uses_absolute_formation_level: false
  estimates_well_datum: false
  uses_gr: false
  uses_existing_prediction: false
  uses_fault_cut: false
  output: one_direct_physical_candidate

stage0:
  name: multiformation_edge_identity_and_geometry_support_audit
  row_stride: 16
  always_include_final_row: true
  minimum_finite_formations_per_edge: 3
  maximum_edge_identity_rmse_ft_each_formation: 0.02
  maximum_edge_identity_rmse_ft_median6: 0.02
  minimum_edges_with_three_finite_formations_fraction: 0.995
  required_query_component_with_donor_fraction: 1.0
  required_query_bilinear_basis_coverage: 1.0
  failure_policy: stop_before_stage1_execution_and_close_branch

solver:
  grid_spacing_ft: 250.0
  active_grid_chebyshev_halo_cells: 1
  interpolation: bilinear
  component_adjacency: four_neighbor
  gauge_constraint: zero_mean_per_component
  row_stride: 16
  always_include_final_row: true
  edge_response: median_of_finite_six_formation_differences
  minimum_finite_formations_per_edge: 3
  edge_scale: max_1p4826_crossformation_mad_and_0p02_ft
  loss: huber
  huber_delta: 1.345
  regularizer: active_grid_xx_yy_xy_second_differences
  lambda_candidates: [0.001, 0.01, 0.1]
  lambda_selection: outer_train_only_stable_three_way_well_holdout_edge_huber_loss
  lambda_tie_policy: choose_larger_lambda
  inner_split: sha256_well_id_mod_3
  dtype: float64
  process_count: 1
  irls_max_iterations: 20
  irls_relative_objective_tolerance: 0.000001
  missing_query_component_policy: fail_closed_no_fallback
  second_difference_scaling: unscaled_discrete_grid_difference
  linear_solver: scipy_sparse_kkt_spsolve_natural_ordering
  inner_holdout_objective: mean_edge_huber_loss_weighted_by_heldout_edge_count
  runtime_guards:
    maximum_active_nodes_per_outer_fold: 500000
    maximum_donor_edges_per_outer_fold: 500000
    maximum_regularizer_rows_per_outer_fold: 2000000
    maximum_constraint_matrix_nnz_per_outer_fold: 50000000
    maximum_total_solver_fits: 50


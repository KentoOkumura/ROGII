    seed_base=sha256_first16("likpf::train::<well_id>")
    modulo_2147483647_plus_1; seed=seed_base+seed_index_0_to_127;
    component assignment is deterministic particle_index modulo 5.
  stochastic_components:
    - within_component_particle_initialization
    - rate_and_position_process_noise
    - systematic_resampling
    - post_resampling_roughening
  parallel_rng_policy: explicit_per_well_seed_stream_independent_of_thread_schedule
  stable_order: well_id_then_original_row_then_seed_index_then_particle_index

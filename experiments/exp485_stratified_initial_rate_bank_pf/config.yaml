model:
  name: equal_strata_five_center_initial_rate_likelihood_pf
  estimator: stochastic_likelihood_weighted_particle_filter
  active_variants: [equal_strata_rate_bank5]
  changed_factor:
    initial_rate_formula: median_of_delta_tvt_input_plus_delta_z_divided_by_delta_md
    windows_rows: [30, 32, 64, 128, 256]
    component_order: [tail30, w32, w64, w128, w256]
    minimum_valid_steps: 3
    fallback_rate: 0.0
    particles_per_component: 100
    component_assignment: particle_index_modulo_5
    within_component_rate_spread: 0.01
    duplicate_center_policy: retain_all_equal_strata_without_deduplication
    component_label_use: diagnostic_only
  fixed_from_exp404:
    particles: 500
    seeds: 128
    primary_seed_weighting_temperature: 5.0
    gr_emission: capped_gaussian
    gr_emission_clip_z2: 600.0
    gr_scale_multiplier: 1.0
    base_scale_clip: [10.0, 60.0]
    initial_position_spread_ft: 4.5
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    rough_position: 0.1
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
    typewell_grid_step_ft: 0.2
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32

mechanism_readout:
  rate_bank:
    - center_value
    - unique_center_count
    - center_range
    - fallback_count
  component_ancestry_rows: [0, 32, 128, 512, final]
  component_metrics:
    - posterior_mass
    - surviving_particle_count
    - first_extinction_row
    - ess_before_first_resample
  target_free_only: true


experiment:
  name: exp485_stratified_initial_rate_bank_pf
  description: >-
    Stratify 500 likelihood-PF particles equally across five exp268
    initial-rate window centers. Stage 1 completed at CV 11.092618091 versus
    saved exp404 control 10.914522073. Technical checks passed, but only one of
    five folds improved and the primary and fixed-blend scientific gates
    failed, so the branch is terminally closed without inference or submission.
  hypothesis: >-
    Preserving multiple plausible initial rate modes inside every seed can
    reduce early PF mode loss without target-aware rate-window selection.
  route: pf_beam
  status: stage1_gate_failed_terminal_close
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  exact_pf_implementation_reference: exp404_scale5_sigma_gr_likelihood_pf_ablation
  hmm_evidence_source: exp268_multi_scale_initial_rate_candidates
  steering: ../../docs/legacy/steering/20260730-exp485-stratified-initial-rate-bank-pf
  diff_summary: >-
    Replace exp404's single tail30 initial-rate center with one equal-strata
    five-center particle prior using tail30/32/64/128/256 prefix windows.
    Interleave exactly 100 of 500 particles per center and retain the original
    0.01 within-center spread. Keep every later PF and seed aggregation setting
    fixed; do not run five PF candidates or select a window post hoc.


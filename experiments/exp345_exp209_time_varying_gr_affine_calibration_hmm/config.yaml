model:
  name: causal_two_pass_time_varying_gr_affine_exp209_exact_hmm
  estimator: none
  target: TVT
  active_variants: [one_pass_causal_affine_schedule_on_exp209]
  base_path:
    source: exact_exp209_parent_posterior_mean_and_std
    stage_0_prefix_mask: rerun_parent_on_each_masked_well
    stage_1_full_suffix: use_saved_exp209_parent_cache
    calibration_iterations: 1
    freeze_before_affine_filter: true
  affine_state:
    state: [intercept_b, log_scale_a]
    transition: local_level_random_walk
    filter: deterministic_causal_extended_kalman_filter_no_smoother
    initial_fit: robust_current_well_visible_prefix_affine
    initial_fit_pairs:
      x: typewell_gr_interpolated_at_visible_tvt_input
      y: finite_raw_horizontal_gr
    minimum_prefix_pairs: 40
    minimum_typewell_gr_std: 5.0
    slope_bounds: [0.25, 4.0]
    maximum_prefix_rmse: 60.0
    prefix_rmse_scope: retained_pairs_after_fixed_trim_iterations
    trim_quantile: 0.90
    robust_iterations: 2
    process_noise: outer_train_empirical_bayes_once_per_fold
    process_noise_estimator: median_squared_adjacent_robust_prefix_state_increment
    process_noise_state_sequence: cumulative_robust_fit_every_40_finite_pairs_plus_final
    process_noise_increment_normalization: squared_state_increment_per_source_row
    process_noise_shrinkage: n_div_n_plus_100_toward_global_outer_train_median
    process_noise_shrinkage_space: linear_variance
    process_noise_numerical_floor: 1.0e-12
    initial_covariance: trimmed_ols_covariance_transformed_to_intercept_and_log_scale
    covariance_update: joseph_form
    slope_bound_policy: clip_log_scale_after_every_causal_update
    schedule_state_timing: current_row_posterior_after_one_finite_raw_gr_update
    gr_nll_policy: one_step_predictive_before_current_row_update
    observation_mean: exp_log_scale_times_typewell_gr_at_frozen_base_mean_plus_intercept
    observation_variance: exp209_sigma_gr_squared_plus_typewell_local_gradient_squared_times_base_tvt_std_squared
    missing_raw_gr_update_policy: skip_update_propagate_state
    freeze_before_variant_hmm: true
    fallback: static_exp209_identity_observation_a1_b0
  variant_hmm:
    state_gr_formula: exp_log_scale_a_t_times_typewell_gr_state_plus_intercept_b_t
    active_variants: [one_pass_causal_affine_schedule_on_exp209]
  runtime_gate:
    stable_sha256_microbenchmark_wells: 32
    maximum_projected_hours: 8.5
  stage_0_prefix_mask:
    enabled_after_implementation: false
    matched_parent_and_variant_hmm_runs: 1546
    pass_requires_all:
      minimum_rmse_gain_ft: 0.05
      minimum_improved_folds: 4
      require_gr_nll_improvement: true
      require_boundary_jump_p95_max_sigma: 3.0
      require_hidden_like_non_regression: true
      maximum_worst_well_regression_ft: 0.25
      maximum_projected_runtime_hours: 8.5
      maximum_fallback_fraction: 0.50
  stage_1_full_suffix:
    enabled_after_implementation: false
    enable_condition: stage_0_all_gates_pass_and_separate_user_approval
    new_variant_hmm_well_runs: 773
  fixed_exp209_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    emission: gaussian
    emission_clip_z2: 600.0
    sigma_mode: std
    sigma_known_gr_policy: fill_missing_with_zero_before_population_std
    sigma_clip: [10.0, 60.0]
    affine_parent_a: 1.0
    affine_parent_b: 0.0
    missing_gr_weight: none_exact_weight_1
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp
    effective_position_sigma_floor: 0.1225
    output: posterior_mean
  forbidden:
    - finite_only_sigma_gr
    - robust_or_mad_sigma_gr
    - missing_gr_downweight
    - well_adaptive_or_time_varying_sig_r
    - changing_sig_p_momentum_grid_or_prior
    - typewell_group_prior
    - bidirectional_calibration_smoother
    - joint_tvt_rate_affine_state_grid
    - more_than_one_calibration_iteration
    - affine_parameter_grid
    - prediction_blend_as_scientific_variant


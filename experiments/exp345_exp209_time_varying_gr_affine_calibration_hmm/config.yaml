experiment:
  name: exp345_exp209_time_varying_gr_affine_calibration_hmm
  description: >-
    Design-frozen two-pass exact-HMM audit that independently revisits the
    closed exp328 causal time-varying GR affine hypothesis directly on the
    trusted exp209 observation and transition contract.
  route: pf_beam
  status: stage_0_full_failed_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-22"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260722-exp345-exp209-time-varying-gr-affine-calibration-hmm
  design_origin: exp328_time_varying_gr_affine_calibration_hmm
  sibling_experiment: exp338_exp209_well_adaptive_transition_noise
  references:
    - exp211_affine_calibrated_gr_observation_pfbeam
    - exp216_affine_shift_landscape_ruler_readout
    - exp295_prefix_anchored_wholewell_gr_alignment_ssm
    - exp318_typewell_group_time_varying_calibration_ssm
  diff_summary: >-
    Changes only the exp209 HMM observation center from identity Type Well GR
    to one deterministic current-well causal affine schedule a_t,b_t. The
    schedule is estimated once from a frozen exp209 base path, frozen, and then
    used for exactly one variant HMM rerun. Exp209 zero-fill standard-deviation
    sigma_GR, missing-row weight 1, transition sig_r=0.002 and sig_p=0.02,
    grid, momentum, priors, and posterior-mean decoder remain fixed. Exp307
    finite-only scale and exp308 missing-GR confidence are not used.

implementation:
  enabled: true
  scope: train_side_staged_candidate_audit_only
  train_notebook_state: canonical_compact_selfcontained_stage_0_completed_failed_closed
  canonical_notebook_adopted: true
  inference_enabled: false
  submission_enabled: false

validation:
  strategy: staged_prefix_mask_two_pass_exp209_exact_hmm_audit
  metric: rmse
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  score_rows: masked_or_official_unknown_suffix_only_after_affine_schedule_and_prediction_freeze
  dependency_policy:
    required_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    required_parent_status: completed_hmm_exact_parity_pass
    required_hmm_prediction_decompressed_sha256: 8e2f42367b7b8b28e73094eae642c57c75dc8a7ebcfbc3826b0f2067b37f7ae5
    exp338_dependency: none_independent_sibling
    fail_closed_on_dependency_mismatch: true
  prefix_mask_backtest:
    horizon_rows: 640
    minimum_visible_prefix_rows: 160
    source_policy: current_well_only
    truth_join_policy: mask_tvt_then_freeze_base_path_affine_schedule_and_prediction_before_scoring
  leakage_policy:
    - Static initialization uses current-well visible TVT_input prefix pairs only.
    - Suffix filter updates use finite observed raw GR, Type Well GR at the frozen base-HMM mean path, and base-HMM TVT std only.
    - A row with non-finite raw GR skips the affine-state update; exp308 missing weights and future-GR imputation are not filter inputs.
    - Unknown-suffix TVT, error, abs_error, formation, oracle branch, and same-Type-Well donor calibration are forbidden before schedule and prediction freeze.
    - Exactly one calibration pass and one variant HMM pass are allowed; iterative truth-driven refits are forbidden.


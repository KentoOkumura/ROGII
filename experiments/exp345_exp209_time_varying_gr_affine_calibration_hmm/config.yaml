notes:
  - Design frozen on 2026-07-22; scientific implementation was approved separately by the user.
  - The user separately approved execution after disclosure of the stable-SHA 32-well microbenchmark scope: parent 32 plus variant 32 equals 64 HMM runs.
  - The canonical Kaggle kernel id is kentookumura/exp345-gr-affine-hmm-runtime-microbenchmark; Kaggle resolved version 1 from the title and strict post-push status verification confirmed this URL slug.
  - Version 1 completed the 64-run microbenchmark and passed the runtime gate: 364.4895 seconds actual and 4632.1196 seconds projected for 773 wells.
  - The 32-well scientific preview was negative (candidate minus parent RMSE +0.220170 ft; 1/5 folds improved), but it was not a predeclared microbenchmark promotion gate.
  - After version 1 completion all run flags and Kaggle push approval were reset to false; they were enabled again only after separate Stage 0 approval.
  - The user separately approved Stage 0 full after disclosure of the negative 32-well preview; this authorizes 773 masked parent plus 773 variant HMM runs in canonical kernel version 2.
  - Stage 1, inference, submission, and post-hoc parameter rescue remain disabled.
  - Canonical kernel version 2 completed Stage 0 full with 1546/1546 HMM runs, 494720 finite prediction rows, fallback 0 percent, and a passing technical gate.
  - Stage 0 improved pooled RMSE by 0.169505 ft and 4/5 folds, but failed the preregistered scientific AND gate because hidden-like checks were absent and the worst well regressed by 9.354827 ft versus the 0.25 ft limit.
  - The Stage 0 decision is stage_failed_close_without_rescue. All run flags and Kaggle push approval were reset to false, Stage 1 is ineligible, and inference/submission remain disabled.
  - This experiment is the explicit independent successor for the closed exp328 hypothesis.
  - It is not part of the exp338 to new-exp323 to new-exp324-327 successor chain.

experiment:
  name: exp264_exp263_candidate_confidence_dual_selector
  description: >-
    exp263のraw-test生成可能な12 candidate surfaceとtarget-free confidenceを正とし、
    exp251のdual-objective candidate-long学習とexp238型compact meta-feature変換を
    leakage-freeに再設計する。
  route: ml_model
  status: corrected_inference_v4_complete_public_lb_7p562
  created_at: "2026-07-16"

lineage:
  parent: exp263_last_anchor_better_candidate_confidence_pair_cache
  selector_method_parent: exp251_raw_test_safe_dual_objective_candidate_ranker
  downstream_adapter_parent: exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218
  downstream_model_anchor: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  excluded_method_family:
    - exp221_lgb_oof_gaussian_emission_hmm_on_exp148
    - exp234_lgb_oof_gaussian_emission_hmm_on_exp148_followup
    - exp240_hmm_lgb_stack_followup
  diff_summary: >-
    候補集合を旧exp251の11本からexp263 Stage 1の12 surfaceへ置換する。
    exp251 v4の295 candidate-long featureはそのまま採用せず、raw-test-safeな共有contextを
    維持し、旧候補固有列とordinal candidate_indexを除去してexp263値・shape・bank関係・
    confidence・candidate/family/formula one-hotへ再編する。selectorは候補別
    pred_abs_error / p_within10を学習し、同じfold処理内でcompact meta-featureへ変換する。
    PF/HMM/Beam候補は補助meta featureに限定し、downstream LightGBMが最終予測を生成するため
    routeはml_modelとする。HMM+LGB、hard-path提出、Viterbi、softmax TVT平均はscope外とする。

validation:
  strategy: outer5_groupkfold_selector_then_conditional_outer5_inner4_nested_stacking
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  outer_folds: 5
  inner_folds: 4
  secondary_metrics:
    - candidate_expected_error_mae
    - candidate_within10_logloss
    - candidate_within10_brier
    - calibration_error
    - rank_regret
    - topk_oracle_coverage
    - rowwise_diagnostic_rmse
    - distance_bucket_rmse
    - hidden_like_rmse
    - fold_rmse
    - worst_well_regression
  leakage_policy:
    - exp263のtarget/error/oracle/catalog RMSE/pair readout/outer eligibilityをrow featureへ入れない。
    - candidate labelはfeature schemaとfoldを固定した後にtrue TVTを別joinして生成する。
    - outer-valid wellのtarget/errorはselector fit、calibration、threshold選択に使わない。
    - downstream outer-train featureはinner OOF selector scoreだけから作る。
    - downstream outer-valid featureはouter-train内inner model ensembleだけから作る。
    - current-testは保存済みselectorを適用して同一process内でcompact化し、再学習しない。
    - public-test row artifactを推論入力にしない。


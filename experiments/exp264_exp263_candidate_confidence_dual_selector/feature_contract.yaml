schema_version: 1.0.0
status: corrected_stage_a_v4_feature_schema_frozen
invalidation:
  reason: >-
    Stage A selected 12 features derived from ANCC/ASTNU/ASTNL/EGFDU/EGFDL/BUDA even though
    these formation columns exist only in training horizontal files and are absent from hidden/current test.
  forbidden_features:
    - ctx__raw__ancc
    - ctx__raw_delta_last__ancc
    - ctx__raw__astnu
    - ctx__raw_delta_last__astnu
    - ctx__raw__astnl
    - ctx__raw_delta_last__astnl
    - ctx__raw__egfdu
    - ctx__raw_delta_last__egfdu
    - ctx__raw__egfdl
    - ctx__raw_delta_last__egfdl
    - ctx__raw__buda
    - ctx__raw_delta_last__buda
  invalid_outputs:
    - stage_a_feature_contract_pass
    - stage_b_oof_scores_guards_and_importance
    - stage_c_nested_oof_scores_compact_guards_and_importance
    - stage_d_addonly_oof_all_readouts_and_importance
  artifact_policy: historical artifacts are retained only to reproduce the failure and must not be reused
corrected_stage_a_contract:
  horizontal_numeric_allowlist: [MD, X, Y, Z, GR]
  historical_selected_features: 100
  dropped_training_only_features: 12
  retained_features: 88
  actual_schema_audit: artifacts/feature_availability_audit/selector_feature_availability.csv
  runtime_gate: raw_context_availability_audit.csv must pass before feature construction or fit
  kaggle_kernel_version: 4
  kaggle_artifact_root: kaggle/output/stage_a_v4/artifacts
  rows_audited: 600000
  transformed_feature_count_before_audit: 150
  dropped_all_missing: 41
  dropped_constant: 5
  dropped_exact_duplicate: 16
  near_duplicate_pairs_report_only: 14
  selected_sparse_features: 25
  feature_catalog_file_sha256: 3a443a1a5a71874499affdfe68ff07c8f40d0abbb86530f8808b45dee9781235
  feature_schema_file_sha256: b91ec1517a82641fe4d96f41c97872151f273a8bbfcb537284f91d47aacf1035
  feature_schema_logical_sha256: aaef4ffdd90667893b099b76a52f1957b22197aea9cee5e5b57bc81048ddd3a4
  raw_context_availability_file_sha256: cead0e03624f5b9401c8bca28febe1965dd830ac90bd50b73ef88870d56ae1c3
  status: kaggle_stage_a_v4_passed
parent_schema:
  experiment: exp251_raw_test_safe_dual_objective_candidate_ranker
  version: v4
  selected_feature_count: 295
  role: raw_test_safe_context_seed_not_final_allowlist

naming:
  ctx__: candidate_independent_row_well_typewell_spatial_context
  cand__: candidate_value_anchor_relative_and_local_shape
  conf__: source_native_confidence_and_validity
  bank__: candidate_bank_position_spread_and_disagreement
  formula__: formula_parent_value_confidence_and_lineage
  id__: candidate_family_kind_and_formula_one_hot

transform_rules:
  retain:
    - raw-test-safe candidate-independent exp251 v4 context
    - cross-fitted train and hidden-safe current-test COPCF context
    - generic multi-observation summaries that can be recomputed from the exp263 bank
    - raw horizontal row geometry logs and typewell summaries generated identically on train and current-test
    - only columns proven present and semantically identical in actual train and current-test source files
  recompute:
    - candidate_tvt and candidate_minus_last for each exp263 candidate
    - candidate-relative differences against exp263 bank members
    - candidate set rank spread and disagreement from the legal source bank
    - candidate-specific shape windows 32 128 512
  add:
    - exp263 common sparse confidence slots and validity flags
    - exp263 family-specific source-native confidence
    - formula parent namespaced confidence and validity
    - candidate ID one-hot 12
    - family one-hot
    - primitive pair fixed kind one-hot
  remove:
    - ANCC ASTNU ASTNL EGFDU EGFDL BUDA raw values and every transform derived from them
    - ordinal candidate_index
    - old candidate identity/order columns
    - old candidate-specific columns for sc_ens hyb tvt_dense tvt_densew tvt_dense50
    - model or selector prediction inputs not generated by exp263
    - catalog RMSE pair readout outer eligibility target error and oracle fields
  defer:
    - copcf columns until the same implementation guarantees train cross-fit and current-test regeneration parity

required_feature_groups:
  ctx:
    examples:
      - md_since
      - eval_len
      - evaluation_progress
      - last_known_tvt
      - raw_test_safe_typewell_and_spatial_context
    missing_policy: feature_specific_contract
    forbidden_training_only_sources:
      - ANCC
      - ASTNU
      - ASTNL
      - EGFDU
      - EGFDL
      - BUDA
  cand:
    examples:
      - candidate_tvt
      - candidate_minus_last
      - candidate_step
      - candidate_slope_32_128_512
      - candidate_curvature_32_128_512
      - candidate_straightness_32_128_512
    missing_policy: candidate_unavailable_is_nan_with_flag
  conf:
    common_slots:
      - confidence_valid
      - sigma_tvt
      - loglik_per_row
      - entropy
      - score_margin
      - support_count
      - ess_fraction
      - fallback_rate
    rule: source-native only; unavailable values remain NaN
    current_test_rule: selected native fields require confidence__<candidate_id>__<field> parity from exp263 Stage 1
  bank:
    examples:
      - bank_median
      - bank_range
      - bank_std
      - candidate_minus_bank_median
      - candidate_abs_minus_bank_median
      - bank_disagreement_32_128_512
      - candidate_is_bank_min_or_max
    rule: derive without target and without illegal hard-selection closure
  formula:
    examples:
      - parent_valid_count
      - component_range
      - component_std
      - parent_direction_agreement
      - parent_confidence_namespaced
    rule: no cross-family sigma averaging
  id:
    required:
      - candidate_id_one_hot_12
      - family_one_hot
      - kind_one_hot_primitive_pair_fixed
    forbidden:
      - ordinal_candidate_index

universal_confidence_proxy:
  guarantee: every candidate has at least one target-free proxy vector
  not_a_guarantee: every candidate has a source-native scalar sigma
  common_calibrated_outputs:
    - pred_abs_error
    - p_within10

audit:
  freeze_before_fit: true
  raw_test_availability_gate:
    required: true
    rule: every selected feature must be generated with the same source columns and semantics on actual train and current-test inputs
    imputation_is_not_parity: true
    historical_stage_status: failed
    corrected_stage_a_v4_status: passed_train_773_of_773_current_test_3_of_3
  remove_constant: true
  remove_all_missing: true
  remove_exact_duplicate: true
  near_duplicate_thresholds:
    pearson_abs: 0.999
    spearman_abs: 0.999
    action: report_only
  required_catalog_columns:
    - feature
    - group
    - description
    - provenance
    - raw_test_status
    - dtype
    - missing_rate
    - exact_duplicate_of
    - pearson_near_duplicate_group
    - spearman_near_duplicate_group
    - objective
    - fold
    - gain_importance
    - split_importance
    - importance_mean
    - importance_std
    - importance_rank
  output:
    - feature_catalog.csv
    - feature_schema.json
    - feature_duplicate_correlation_audit.csv
    - confidence_coverage_by_candidate_fold.csv

final_feature_count:
  fixed_at_design_time: false
  corrected_stage_a_v4_frozen_count: 88
  corrected_stage_a_v4_feature_schema_sha256: aaef4ffdd90667893b099b76a52f1957b22197aea9cee5e5b57bc81048ddd3a4
  reason: >-
    exp251の295列はseedであり、旧候補固有列の除去、exp263 confidence追加、
    exact duplicate/all-missing監査の結果で変わる。Stage AのSHA固定後は同一実験内で変更しない。

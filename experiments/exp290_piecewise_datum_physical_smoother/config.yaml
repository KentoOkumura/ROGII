physics:
  equation: "TVT_w(t) = g_w(t) + delta_w(t)"
  base_geometry: exp226_group_safe_tvt_geop
  output: one_posterior_mean_prediction
  geometry_replay:
    mode: exp226_geometry_only_fold_safe_saved_kappa_at_each_pseudocut
    pseudo_cut_anchor_datum_location_ft: 0.0
    source_truth_policy: outer_train_wells_only
    target_input_columns: [MD, X, Y, Z, GR, TVT_input]
    target_forbidden_columns: [TVT, ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
    params:
      theta0: 118.4
      k_segments: 16
      local_linear_k: 50
      local_linear_bandwidth: 500.0
      local_linear_ridge: 1.0
      smooth_rho: 10.0
      gate: 0.35
      field_min_proj: 0.3
      kbins: [0.0, 750.0, 1500.0, 2500.0, 4000.0, 1.0e18]
      rot_max_deg: 60.0
      ancc_theta_bandwidth: 1500.0
  state_space:
    state: absolute_datum_correction_ft
    minimum_ft: -15.0
    maximum_ft: 15.0
    step_ft: 0.5
    state_count: 61
    cumulative_random_walk: false
    checkpoint_stride_rows: 64
    minimum_segment_duration_rows: 256
    duration_representation: four_locked_checkpoint_phases_plus_eligible_geometric_phase
    duration_phase_count_per_offset: 5
    expanded_state_count: 305
    row_projection: linear_interpolation_of_posterior_mean_between_checkpoints
  transition:
    stay: same_absolute_state
    reset: bounded_absolute_state_change
    reset_jump_prior: zero_centered_laplace
    reset_jump_scale_ft: 4.0
    base_reset_hazard_per_row: 0.00048828125
    maximum_event_hazard_per_row: 0.015625
    event_gate:
      windows_rows: [128, 256, 512]
      components: [shift_likelihood_sign_consistency, posterior_entropy_drop, geometry_curvature]
      aggregation: equal_weight_robust_rank_mean
      minimum_consistent_shift_windows: 2
      threshold_source: outer_train_pseudocuts_only_frozen_before_official_suffix
      outer_train_quantile: 0.75
      checkpoint_hazard_mapping: linear_between_base_and_maximum_above_frozen_gate
  observations:
    prefix:
      family: student_t
      degrees_of_freedom: 4
      value: TVT_input_minus_base_geometry
      location: latent_absolute_datum
      scale_estimator: current_well_prefix_mad_with_hierarchical_shrinkage
    gr:
      family: student_t
      degrees_of_freedom: 4
      template_coordinate: base_geometry_plus_latent_absolute_datum
      affine_calibration: known_prefix_huber_fit_only
      scale_estimator: known_prefix_mad
      scale_clip: [10.0, 60.0]
      likelihood_reduction: mean_log_likelihood_per_64_row_block
      temperature: current_well_pseudocut_reliability
  hierarchy:
    current_well_parameters: [prefix_datum_location, prefix_noise, gr_affine_scale, gr_affine_offset, gr_noise, pseudocut_reliability]
    pseudocut_horizons_rows: [512, 256, 128]
    pseudocut_validation_window_rows: 128
    stage0_reliability_scope: temporally_earlier_frozen_pseudocuts_only
    final_suffix_reliability_scope: all_three_known_prefix_pseudocuts
    pseudocut_nll_reference: fixed_zero_datum_exp226_geometry
    pseudocut_reliability_formula: "clip(exp(-median_nll_excess), 0.10, 1.00)"
    pseudocut_nll_aggregation: mean_student_t_nll_model_minus_base_per_window
    pooled_prior: outer_train_masked_prefix_backtests
    typewell_prior:
      parameters: [prefix_noise_log_scale, reset_hazard_log_scale, jump_scale_log_scale, gr_noise_log_scale]
      minimum_group_wells: 8
      small_group_policy: precision_shrink_to_pooled
      datum_mean_or_jump_sign_allowed: false
    spatial_prior:
      standardized_space: outer_train_median_mad_xy
      neighbors: 16
      exclude_self_well: true
      stable_tiebreak: [distance, source_well_id, source_row_id]
      role: hyperprior_variance_only
      datum_mean_or_jump_sign_allowed: false
    combine_order: [pooled, typewell, spatial, current_well_prefix]
    combine_method: precision_weighted_empirical_bayes
    missing_group_policy: widen_same_model_pooled_prior
  solver:
    method: exact_log_space_semi_markov_forward_backward
    dtype: float64
    output_statistic: posterior_mean
    viterbi_output_allowed: false
    candidate_bank_allowed: false
    nonfinite_policy: fail_closed_no_fallback


experiment:
  name: exp290_piecewise_datum_physical_smoother
  description: >
    Infer one bounded piecewise-constant datum posterior on top of the fixed
    group-safe exp226 geometry using known-prefix calibration, robust Type Well
    GR likelihood, and uncertainty-only Type Well/spatial hyperpriors.
  route: pf_beam
  status: stage0_guard_failed_branch_closed
  phase: stage0_scientific_guard_failed
  created_at: "2026-07-19"
  target_public_lb: 6.5

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  comparison:
    - exp169_prefix_based_offset_correction
    - exp201_typewell_neighbor_bias_direction_readout
    - exp280_exp226_shift_likelihood_separability_readout
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp285_exp226_prefix_masked_offset_predictability_readout
    - exp289_fault_aware_transductive_geological_potential
  diff_summary: >
    Keeps the exp226 group-safe geometry as an internal deterministic term but
    replaces geometry-only output with one hierarchical semi-Markov posterior
    over a bounded absolute datum. It does not blend, select, or postprocess
    saved exp226/HMM/ML predictions.

validation:
  scheme: group_kfold_by_well
  n_splits: 5
  group_column: well_id
  fold_source: exp226_saved_oof_fold_assignment
  evaluation_mask: TVT_input_isna
  metric: rmse
  allowed_outer_valid_columns: [MD, X, Y, Z, GR, TVT_input]
  allowed_auxiliary_table_columns: [Type_Well_group, Type_Well_TVT, Type_Well_GR]
  forbidden_before_prediction_freeze:
    - TVT_on_evaluation_rows
    - ANCC
    - ASTNU
    - ASTNL
    - EGFDU
    - EGFDL
    - BUDA
    - target_error
    - oracle_rank
    - exp281_prediction
  pseudo_cut_horizons_rows: [512, 256, 128]
  pseudo_cut_validation_window_rows: 128
  pseudo_cut_reliability_policy: earlier_pseudocuts_only_for_stage0_all_three_for_final_suffix
  pseudo_cut_truth_policy: held_known_tvt_masked_until_prediction_content_sha_freeze
  official_truth_join_policy: after_oof_prediction_content_sha_freeze
  report_scopes:
    - overall
    - fold
    - distance_bucket
    - prefix_length_bucket
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - by_well
    - well_bias
    - persistent_abs_error_ge10_episode
    - posterior_entropy_bucket
    - reset_probability_bucket
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]


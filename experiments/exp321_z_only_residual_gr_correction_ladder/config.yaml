    enable_internet: false
    canonical_train_kernel_id: kentookumura/exp321-z-only-residual-gr-ladder-train
    canonical_train_title: exp321 z only residual gr ladder train
    run_after_kernel: kentookumura/exp305-tempered-raw-swt-exact-hmm-emission-train
    train_kernel_sources:
      - kentookumura/exp226-k16-kappa-repro-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train

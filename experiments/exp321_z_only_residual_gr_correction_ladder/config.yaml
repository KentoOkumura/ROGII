reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_real_paths_stable_sha256_local_rng_for_shuffle_only
  stochastic_components:
    - stable_shuffled_score_negative_control_only
  parallel_rng_policy: fixed_well_row_block_shift_window_order_no_global_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - Run AB records target-free path/block/score content SHA before truth join.
    - Run C records correction/prediction raw, decompressed, and logical content SHA before truth join.
    - This is not a deterministic submission anchor because inference and submission are disabled.

inference:
  enabled: false
  mode: disabled_design_only_train_side_ladder
  create_submission: false

notes:
  - exp305完了後にKaggle CPU Run AB version 1を実行し、Stage A PASS / Stage B FAILで完了した。
  - Stage A/B/Cを同じexpに保持し、PASS後のinference portだけを理由に新expを作らない。
  - Stage Bのbank range/quantization gate FAILによりStage Cと案4/5を救済なしで閉じた。

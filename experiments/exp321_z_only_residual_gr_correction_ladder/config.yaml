      - exp321_z_only_stage_b_block_readout.csv.gz
      - exp321_z_only_stage_b_scope_metrics.csv
      - exp321_z_only_stage_b_fold_metrics.csv
      - exp321_z_only_stage_b_shift_metrics.csv
      - exp321_z_only_well_manifest.csv
      - exp321_z_only_input_manifest.csv

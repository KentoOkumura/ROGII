experiment:
  name: exp263_last_anchor_better_candidate_confidence_pair_cache
  description: >-
    last_anchorより良いknown 33 pathをcatalog固定し、core 12 primitiveの値・target-free
    confidence・有望8 pair・3 named combinationを共通candidate-major cache化する。
  route: pf_beam
  status: stage1_namespaced_confidence_kaggle_v3_completed
  created_at: "2026-07-16"

lineage:
  parent: exp072_exp063_full_replay_feature_cache
  references:
    - exp103_pf_z_xy_likpf_ensemble_parity
    - exp104_pf_z_seedbag_scale_cache
    - exp192_typewell_late_range_hard_window_pct50_full_cache_replacement
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp223_joint_typewell_self_gr_hmm_likelihood_probe
    - exp225_state_known_tvt_self_gr_hmm_emission
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp231_same_typewell_horizontal_gr_atlas_gated_hmm_emission
    - exp232_adaptive_robust_likelihood_pf
    - exp233_adaptive_outlier_mixture_likelihood_pf
    - exp243_pf_seed_medoids
  diff_summary: >-
    HMM+LGB exp221/234/240とselector/TVT model outputsを除外する。known 33本は
    reference catalogに固定するが、row cacheはfamily圧縮したcore 12本だけとする。
    378 pairを複製せず8 pairとw500 alias + 3 named formulaをvirtual loaderで再構成する。

validation:
  strategy: deterministic_group_balance_by_well
  n_folds: 5
  seed: 42
  metric: rmse
  group_column: well
  anchor_candidate: last_anchor
  anchor_rmse: 15.909866082
  eligibility_basis: outer_train_only_excludes_outer_valid_fold
  distance_buckets: [0, 50, 100, 250, 500, 1000]


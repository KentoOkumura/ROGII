experiment:
  name: "exp085_u_projection_feature_ablation"
  description: Add-only U-space projection feature ablation on the fixed exp073 full replay LightGBM surface.
  route: ml_model
  status: implemented_not_run
  created_at: "2026-06-20"
  updated_at: "2026-06-20"

lineage:
  parent: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  cache_parent: exp072_exp063_full_replay_feature_cache
  implementation_source: u_projection_feature_ablation.py
  public_replay_source: public_notebook_replay_audit.py
  diff_summary: Keeps the exp073/exp072 deterministic 196-feature full replay surface and the original TVT-minus-last-anchor target, then adds target-free U-space projection correction and PF/Beam/likelihood-PF disagreement features as one-at-a-time feature groups.

validation:
  strategy: groupkfold_by_exp063_well_same_features_add_only_projection_ablation
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Train features are read from exp072's raw-train-only deterministic feature cache.
    - The expected train feature surface is exp063 Pixiux full public replay with 196 base features.
    - The supervised target remains exp073's TVT minus last_known_tvt residual.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.
    - U-projection features use only target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - LGB OOF U-projection features are disabled in this first implementation because nested fold generation is required to avoid leakage.
    - This is a train-side feature ablation and not a submission candidate until full CV and parity checks are reviewed.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json

model:
  name: exp085_u_projection_feature_ablation_lgbm
  source_experiment: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  feature_source: exp072_exp063_full_replay_train_feature_cache
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  feature_ablation:
    selected_variant: null
    active_variants:
      - name: control_exp073_base196
        description: Exp073 full replay 196-feature control, original target.
        feature_groups: []
        enabled: true
      - name: u_projection_correction
        description: Add robust U-space polynomial correction, residual, absolute residual, and residual MAD features.
        feature_groups:
          - projection_correction
        enabled: true
      - name: u_disagreement
        description: Add PF/Beam/likelihood-PF U-space pairwise disagreement and source spread features.
        feature_groups:
          - u_disagreement
        enabled: true
      - name: u_projection_correction_plus_disagreement
        description: Add both projection correction and U-space disagreement groups.
        feature_groups:
          - projection_correction
          - u_disagreement
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 40
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; included for optional rerun comparison.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train

audit:
  mode: u_projection_feature_ablation_from_exp072_cache
  output_prefix: exp085_u_projection_feature_ablation
  fast: false
  bucket_columns:
    distance: md_since
    tail_rank: id
  expected_train_artifacts:
    - exp085_u_projection_feature_ablation_metrics.csv
    - exp085_u_projection_feature_ablation_by_well.csv
    - exp085_u_projection_feature_ablation_bucket_metrics.csv
    - exp085_u_projection_feature_ablation_projection_feature_summary.csv
    - exp085_u_projection_feature_ablation_feature_importance.csv
    - exp085_u_projection_feature_ablation_feature_importance_mean.csv
    - exp085_u_projection_feature_ablation_feature_importance_mean_top.png
    - exp085_u_projection_feature_ablation_predictions.csv.gz
    - exp085_u_projection_feature_ablation_feature_schema.csv
    - exp085_u_projection_feature_ablation_lgb_models/manifest.json
    - exp085_u_projection_feature_ablation_summary.json

inference:
  mode: not_selected_train_side_feature_ablation
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  selected_variant: null
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  notes:
    - Inference is intentionally not selected until train-side projection feature ablation results are reviewed.
    - If selected, the inference notebook must regenerate raw-test full replay features and compute the same target-free U-projection features from test PF/Beam/likelihood-PF paths.

notes:
  - This implements the backlog item `u_projection_feature_ablation`.
  - Target ablation is not mixed into this experiment; the target remains TVT - last_known_tvt.
  - LGB OOF U-space features are deferred until a nested fold implementation is added.

experiment:
  name: exp486_exp226_geometry_residual_likelihood_pf
  description: >-
    Two-variant PF audit of the exp279 absolute exp226 geometry unary and the
    exp281 slow residual-offset state. All-well Stage 1 passed the technical
    gate, but absolute geometry failed the preregistered well-tail guard and
    residual offset regressed overall, so both variants closed without promotion.
  hypothesis: >-
    Group-safe exp226 geometry may prevent PF mode slip either as a fixed
    absolute observation potential or as the moving center of a slow residual
    state, even though a relative-rate defensive proposal failed in exp419.
  route: pf_beam
  status: stage1_all_variants_gate_failed_terminal_close
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  exact_pf_implementation_reference: exp404_scale5_sigma_gr_likelihood_pf_ablation
  absolute_geometry_source: exp279_exp226_geop_centered_exact_hmm_redecode
  residual_offset_source: exp281_exp226_residual_offset_exact_hmm_transition_probe
  nonduplicate_pf_reference: exp419_exp226_guided_defensive_mixture_pf
  steering: ../../docs/legacy/steering/20260730-exp486-exp226-geometry-residual-likelihood-pf
  diff_summary: >-
    Evaluate two preregistered variants independently: add the exp279
    sigma20/lambda0.50 absolute tvt_geop unary to the unchanged exp404 PF, or
    replace its state dynamics with an exp281-derived slow offset around
    tvt_geop. Do not use exp226 final prediction, mix the variants, or select a
    same-OOF winner. Exp419 used only a relative-rate proposal and did not test
    either treatment.


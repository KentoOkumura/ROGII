model:
  name: exp226_absolute_geometry_and_residual_offset_likelihood_pf_audit
  estimator: stochastic_likelihood_weighted_particle_filter
  active_variants:
    - absolute_geometry_unary_sigma20_lambda050
    - slow_residual_offset_state
  absolute_geometry_unary:
    state: exp404_position_and_rate_unchanged
    geometry_center: tvt_geop
    sigma_ft: 20.0
    lambda: 0.50
    log_likelihood: "0.50 * (-0.5 * min(((particle_tvt-tvt_geop)/20)^2,600))"
    added_to: exp404_capped_gaussian_gr_log_likelihood
  residual_offset_state:
    state: [offset_from_tvt_geop, offset_rate]
    output_tvt: tvt_geop_plus_offset
    initial_offset_center: last_known_tvt_minus_tvt_geop_at_first_score_row
    initial_offset_spread_ft: 4.5
    initial_offset_rate_center: 0.0
    initial_offset_rate_spread: 0.01
    offset_rate_transition: "0.998*previous_offset_rate + 0.002*normal"
    offset_transition: "previous_offset + current_offset_rate*delta_md + 0.005*normal"
    gr_emission_position: tvt_geop_plus_offset
    gr_emission: exp404_capped_gaussian_x1p0
  fixed_from_exp404_for_both:
    particles: 500
    seeds: 128
    initial_state_spread_ft: 4.5
    initial_rate_spread: 0.01
    primary_seed_weighting_temperature: 5.0
    gr_scale_multiplier: 1.0
    base_scale_clip: [10.0, 60.0]
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    rough_position: 0.1
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
    typewell_grid_step_ft: 0.2
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32

mechanism_readout:
  absolute_geometry_unary:
    - geometry_log_weight_quantiles
    - particle_geometry_residual_quantiles
    - ess_and_resampling_delta
  slow_residual_offset_state:

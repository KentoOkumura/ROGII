experiment:
  name: exp418_exp226_signed_segment_rate_residual
  description: >-
    Design-frozen one-factor successor to exp333 that keeps its strict nested
    exp226 base, target-free 136-feature surface, folds, and LightGBM config,
    but replaces segment-constant offset prediction with signed K16 rate
    targets and an anchor-preserving cumulative correction.
  hypothesis: >-
    The persistent exp226 offset is caused by small signed local rate mismatch
    accumulating after the last known TVT anchor. Predicting one signed rate
    per K16 segment and integrating it continuously from zero correction at the
    first suffix row can reduce drift without the boundary level steps and tail
    regressions caused by segment-constant offset broadcast.
  route: ensemble
  status: stage0_v1_technical_fail_closed
  created_at: "2026-07-27"
  updated_at: "2026-07-28"
  inference_enabled: false
  submission_enabled: false
  next_action: terminal_close_no_stage1_consider_separate_numerical_contract_audit

lineage:
  parent: exp333_exp226_k16_segment_residual_offset_target
  base_prediction_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  rowwise_residual_comparison: exp228_direct_residual_correction_on_exp226
  root_cause_evidence: docs/analysis/exp226_offset_root_cause_audit_20260727.md
  steering: ../../.steering/20260727-exp418-exp226-signed-segment-rate-residual
  references:
    - docs/06_reproducibility.md
    - experiments/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/result.md
    - experiments/exp228_direct_residual_correction_on_exp226/result.md
    - experiments/exp333_exp226_k16_segment_residual_offset_target/result.md
  diff_summary: >-
    Preserve the exp333 Stage-1 outer/inner folds, target-free 136-feature
    schema and aggregation, row-count sample weight, and single lgb1 config.
    Replace its per-segment mean residual target and constant broadcast with a
    16-rate, zero-intercept cumulative least-squares target per well and
    continuous suffix integration. No other feature, model, K, correction, or
    selector variable changes.


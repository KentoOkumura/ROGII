  metric: rmse
  seed: 42
  n_outer_folds: 5
  n_inner_folds: 4
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_segments: 12368
  expected_segments_per_well: 16
  expected_outer_folds: [0, 1, 2, 3, 4]
  outer_fold_policy: exact_saved_exp226_source_fold_identity
  inner_fold_policy: exact_saved_exp333_stage1_inner_fold_manifest
  truth_attachment: after_base_feature_basis_and_manifest_sha_freeze
  leakage_policy:
    - Reuse only exp333 strict-nested target-free exp226 predictions for every train and valid target.
    - Do not fit donor fields, kappa, or an exp226 control inside exp418.
    - Freeze base rows, K16 assignment, feature schema/content, cumulative-rate basis, and fold identity before reading truth or residual.
    - Use inner-OOF base prediction for outer-train rate targets and full outer-train base prediction for outer-valid evaluation.
    - Keep exp333 feature allowlist and forbid truth, residual, error, oracle, well ID, supervised learned-likelihood, and selector-score features.
    - Read hidden-like roles only after row prediction freeze.


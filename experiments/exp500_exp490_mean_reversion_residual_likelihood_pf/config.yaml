experiment:
  name: exp500_exp490_mean_reversion_residual_likelihood_pf
  description: >-
    Single-variant likelihood-PF audit transferring exp490
    K16-span geometry-centered mean reversion onto the exp486 residual-offset
    particle state. Kaggle fixed44 completed with every technical check passing,
    but three matched-control and sentinel safety checks failed. A 2026-08-02
    explicit user override ran unchanged Stage 1 full OOF while preserving that
    negative Stage 0 result. Stage 1 improved pooled RMSE but failed the fixed
    by-well tail guards. Inference and submission remain disabled.
  hypothesis: >-
    Applying the exp490 one-K16-segment half-life shrink to both residual offset
    and residual offset-rate transition centers can reduce persistent PF basin
    errors while the unchanged GR likelihood preserves supported nonzero offsets.
  route: pf_beam
  status: stage1_fail_closed_under_override
  created_at: "2026-08-01"
  updated_at: "2026-08-02"

lineage:
  parent: exp486_exp226_geometry_residual_likelihood_pf
  parent_variant: slow_residual_offset_state
  mechanism_parent: exp490_geometry_centered_mean_reverting_offset_hmm
  geometry_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  pf_implementation_reference: exp486_exp226_geometry_residual_likelihood_pf
  scientific_control: exp404_scale5_sigma_gr_likelihood_pf_ablation
  mechanism_references:
    - exp408_hmm_message_rate_basin_audit
    - exp410_likpf_particle_resampling_basin_audit
    - exp498_geometry_mean_reversion_tail_regime_physics_readout
  steering: ../../.steering/20260801-exp500-exp490-mean-reversion-residual-likelihood-pf
  diff_summary: >-
    Keep the exp486 residual-state likelihood-PF fixed and add only exp490 rho_t
    to the residual-rate and residual-offset transition centers. Do not copy the
    exp490 Huber emission or exact-HMM smoother, add an adaptive gate, mix the
    parent transition, or combine any saved prediction.


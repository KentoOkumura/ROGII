model:
  name: exp490_k16_mean_reverting_residual_likelihood_pf
  estimator: stochastic_likelihood_weighted_particle_filter
  active_variants:
    - k16_half_life_mean_reverting_residual_likpf
  coordinate:
    geometry: saved_group_safe_exp226_tvt_geop
    residual_offset: delta_t_equals_tvt_t_minus_geometry_t
    residual_rate: q_t_in_ft_per_md_ft
    output_tvt: tvt_geop_plus_residual_offset
  k16_segment:
    count: 16
    policy: exact_exp226_unknown_suffix_equal_row_count_segments
    boundary_transition_owner: destination_row_segment
    span_definition: sum_positive_dmd_for_transitions_entering_segment
    first_unknown_dmd_source: last_known_prefix_row
    require_positive_span: true
  mean_reversion:
    half_life_segments: 1.0
    rho_formula: rho_t_equals_2_power_minus_dmd_t_over_destination_segment_md_span
    rate_transition_center: momentum_times_rho_t_times_previous_residual_rate
    offset_transition_center: rho_t_times_previous_offset_plus_current_rate_times_dmd_t
    process_noise_applied_after_center: true
    zero_state_geometry_identity: true
    segment_cumulative_rho_target: 0.5
    segment_cumulative_rho_atol: 0.0000000001
    hard_reset: false
    adaptive_gate: false
    parent_transition_mixture: false
    proposal_only: false
  initialization:
    offset_center: last_known_tvt_minus_geop_at_first_score_row
    offset_spread_ft: 4.5
    rate_center: 0.0
    rate_spread: 0.01
  transition:
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    rate_formula: 0.998_times_rho_times_previous_rate_plus_0.002_normal
    offset_formula: rho_times_previous_offset_plus_current_rate_times_dmd_plus_0.005_normal
  particle_filter:
    particles: 500
    seeds: 128
    rough_position: 0.1
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
    resampling: systematic
    typewell_grid_step_ft: 0.2
    primary_seed_weighting_temperature: 5.0
    output_dtype: float32
  emission:
    kind: exp486_exp404_capped_gaussian_raw_gr
    gr_scale_multiplier: 1.0
    base_scale_clip: [10.0, 60.0]
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    exp490_huber_emission_used: false


experiment:
  name: "exp073_gpu_reproducibility_guard_for_exp063_full_replay"
  description: End-to-end reproducibility guard for exp063 full replay, covering fixed train cache, LightGBM training, and deterministic PF/Beam test feature regeneration.
  route: ml_model
  status: repro_check_passed_cpu_infer_v2_completed_pending_optional_lb
  created_at: "2026-06-14"
  updated_at: "2026-06-15"

lineage:
  parent: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
  cache_parent: exp072_exp063_full_replay_feature_cache
  implementation_source: exp063_full_replay_reproducibility_guard.py
  public_replay_source: public_notebook_replay_audit.py
  diff_summary: Train reads the exp072 CPU-only deterministic full public replay train feature cache and retrains only the exp063 Pixiux public LightGBM config family with reproducibility-focused LightGBM settings. Inference does not use a cached test feature file; it regenerates exp063 public replay PF/Beam/likelihood-PF features from current raw test files with the same stable per-well seed policy, then applies exp073 saved LightGBM boosters.

validation:
  strategy: groupkfold_by_exp063_well
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Train features are read from exp072's raw-train-only deterministic feature cache.
    - The expected train feature surface is exp063 Pixiux full public replay with 196 features.
    - The supervised target is exp063 target, defined as TVT minus last_known_tvt.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.
    - Train-side audit does not read raw test files, train-visible overrides, pretrained boosters, public submissions, CatBoost, Ridge stack, final public blend, or projection postprocess.
    - Inference regenerates only current raw test features inside this notebook using stable per-well seeds for PF/Beam/likelihood-PF paths.
    - This is an end-to-end reproducibility guard, not a feature-improvement experiment.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json

model:
  name: exp063_full_replay_lgbm_reproducibility_guard
  source_experiment: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  feature_source: exp072_exp063_full_replay_train_feature_cache
  expected_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; included for optional rerun comparison.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
    cpu_train_kernel: kentookumura/exp073-full-replay-repro-guard-train-cpu
    inference_kernel_sources:
      - kentookumura/exp073-full-replay-repro-guard-train
    cpu_inference_kernel: kentookumura/exp073-full-replay-repro-guard-infer-cpu
    cpu_inference_kernel_sources:
      - kentookumura/exp073-full-replay-repro-guard-train-cpu

audit:
  mode: exp063_full_replay_lgbm_reproducibility_guard_from_exp072_cache
  output_prefix: exp063_full_replay_repro_guard
  fast: false
  expected_train_artifacts:
    - exp063_full_replay_repro_guard_metrics.csv
    - exp063_full_replay_repro_guard_by_well.csv
    - exp063_full_replay_repro_guard_predictions.csv.gz
    - exp063_full_replay_repro_guard_feature_schema.csv
    - exp063_full_replay_repro_guard_summary.json
    - exp063_full_replay_repro_guard_lgb_models/manifest.json
  notes:
    - Default package for this guard is GPU-only.
    - Do not push while exp072 is still running; prepare the notebook only.
    - After exp072 output exists, run the GPU train package once first and compare CV, OOF prediction SHA, model SHA, and runtime against exp063/exp070.
    - CPU deterministic package is prepared separately under kaggle/train_cpu with active mode cpu_deterministic_threads8 and enable_gpu=false.
    - CPU deterministic inference package is prepared separately under kaggle/inference_cpu; it loads cpu_deterministic_threads8 boosters from the CPU train kernel and runs with enable_gpu=false.

inference:
  mode: saved_lgb_booster_inference_with_exp063_raw_test_feature_replay
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  model_manifest_path: null
  regenerate_test_features: true
  feature_generation:
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false
    use_gpu: auto
  notes:
    - Loads exp073 full replay train saved boosters from kernel source kentookumura/exp073-full-replay-repro-guard-train.
    - Regenerates exp063 public replay PF/Beam/likelihood-PF test features from current competition raw test files using stable SHA256 per-well seeds.
    - Does not use exp072 for test features, because exp072 intentionally caches train features only.
    - Writes submission.csv for a later LB check after train completes.

notes:
  - Exp070 remains invalid for the exp063 full replay reproducibility guard because it used a 65-feature compact tracker surface.
  - Exp073 is the corrected full 196-feature guard.
  - Reproducibility scope includes both LightGBM training on fixed exp072 cache and deterministic PF/Beam/likelihood-PF test feature regeneration.
  - GPU train v2, CPU deterministic train v1, and deterministic inference v1/v2 rerun check completed. LB submit remains optional.
  - CPU deterministic inference v2 completed on Kaggle after rebuilding the notebook bootstrap support ZIP with CPU config.

experiment:
  name: exp498_geometry_mean_reversion_tail_regime_physics_readout
  description: >-
    Explain the exp490 pooled-versus-well-tail split with one pre-registered,
    target-free physical regime built from visible-prefix GR observability,
    geometry disagreement, and early suffix offset evidence. This is a saved
    full-OOF diagnostic only and does not generate or select predictions.
  route: pf_beam
  status: completed_terminal_fail
  created_at: "2026-08-01"
  updated_at: "2026-08-01"

lineage:
  parent: exp490_geometry_centered_mean_reverting_offset_hmm
  comparison: saved_exp357_parent_prediction_inside_exp490_full_oof
  steering: ../../docs/legacy/steering/20260801-exp498-geometry-mean-reversion-tail-regime-physics-readout
  diff_summary: >-
    Adds one truth-late physics-regime readout over SHA-pinned exp490 full OOF.
    It does not change exp490, regenerate predictions, run an HMM/PF/Beam,
    train a model, blend candidates, or create a selector.


readout:
  phase_order:
    - validate_input_sha_and_identity
    - compute_target_free_well_physics
    - freeze_feature_contract_and_content_sha
    - attach_fold_and_saved_outcomes
    - evaluate_single_primary_regime
  features:
    suffix_horizon_md:
      definition: sum_k16_segment_dmd_span
      bins: [0.0, 4000.0, 6000.0, .inf]
      labels: [short_0_to_4000, medium_over4000_to_6000, long_over6000]
      closed: right
    k16_median_segment_span_ft:
      definition: median_k16_segment_dmd_span
      bins: [0.0, 240.0, 360.0, .inf]
      labels: [short_0_to_240, medium_over240_to_360, long_over360]
      closed: right
    prefix_gr_sigma:
      definition: exact_exp490_prefix_residual_std_clipped_10_60
      bins: [10.0, 20.0, 40.0, 60.0]
      labels: [low_10_to_under20, mid_20_to_under40, high_40_to_60]
    prefix_gr_information_ratio:
      definition: typewell_gr_p95_minus_p05_over_prefix_gr_sigma_on_visible_prefix_tvt
      bins: [0.0, 1.0, 2.0, .inf]
      labels: [weak_under1, medium_1_to_under2, strong_2_plus]
      closed: left
    geometry_disagreement_median_ft:
      definition: median_abs_exp226_pred_minus_tvt_geop_over_suffix
      bins: [0.0, 2.0, 10.0, .inf]
      labels: [close_under2, moderate_2_to_under10, conflict_10_plus]
      closed: left
      interpretation: geometry_vs_gr_corrected_exp226_disagreement_proxy_not_ground_truth_uncertainty
    early_abs_offset_ft:
      definition: abs_median_geometry_mean_reverting_delta_mean_suffix_offsets_0_through_31
      bins: [0.0, 1.0, 5.0, .inf]
      labels: [small_under1, moderate_1_to_under5, material_5_plus]
      closed: left
    state_uncertainty_median_ft:
      definition: median_geometry_mean_reverting_hmm_std_over_suffix
      bins: [0.0, 2.0, 5.0, .inf]
      labels: [low_under2, medium_2_to_under5, high_5_plus]
      closed: left
      use: secondary_descriptive_only
  primary_regime:
    name: weak_gr_geometry_conflict
    weak_observation: prefix_gr_sigma_ge_40_or_prefix_gr_information_ratio_lt_1
    geometry_conflict: geometry_disagreement_median_ft_ge_10
    material_early_offset: early_abs_offset_ft_ge_5
    formula: weak_observation_and_geometry_conflict_and_material_early_offset
    prefix_gr_sigma_minimum: 40.0
    prefix_gr_information_ratio_maximum_exclusive: 1.0
    geometry_disagreement_minimum_ft: 10.0
    early_abs_offset_minimum_ft: 5.0
    allow_post_freeze_redefinition: false
  outcomes:
    harmful_well: candidate_minus_parent_rmse_ft_gt_0_25
    catastrophic_tail_well: candidate_minus_parent_rmse_ft_gt_5
    episode: candidate_sse_minus_parent_sse
    harmful_well_delta_rmse_threshold_ft: 0.25
    catastrophic_tail_delta_rmse_threshold_ft: 5.0
  physics_regime_requires_all:
    minimum_total_regime_wells: 20
    minimum_regime_wells_per_supported_fold: 3
    minimum_supported_folds: 4
    pooled_harmful_rate_ratio_minimum: 1.5
    minimum_folds_regime_harm_rate_higher: 4
    pooled_mean_delta_rmse_regime_minus_complement_minimum_ft: 1.0
    minimum_folds_mean_delta_rmse_difference_positive: 4
    catastrophic_tail_capture_minimum_fraction: 0.30
    regime_coverage_maximum_fraction: 0.30

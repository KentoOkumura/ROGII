model:
  name: soft_sticky_exp226_k16_full_grid_exact_hmm
  estimator: deterministic_switching_exact_hmm
  fitted_model: false
  regimes: [E_exp226_geometry, H_free_exact_hmm]
  initial_regime_probability:
    E_exp226_geometry: 0.5
    H_free_exact_hmm: 0.5
  e_branch:
    state_count_per_row: 1
    tvt_value: exp226_tvt_geop
    uses_target_gr_in_candidate_generation: false
    emission: exact_exp209_gaussian_at_tvt_geop
  h_branch:
    coordinate: absolute_tvt_and_residual_rate_about_k16_mu
    retain_all_tvt_grid_states: true
    retain_all_rate_states: true
    transition_mean_schedule:
      source: exp355_exp226_dip_rate_prior_on_exp209
      exp226_component: geometry_only_pre_gr_pre_u_projection
      k_segments: 16
      geometry_rate: delta_tvt_geop_plus_delta_z_div_delta_md
      target_anchor_rate: exp209_known_prefix_initial_rate
      formula: parent_initial_rate_plus_geometry_rate_minus_first_segment_geometry_rate
      fallback: exact_exp355
      gr_correction_timing: before_gr_observation
    fixed_hmm:
      step_ft: 0.35
      n_rates: 41
      residual_rate_span: 0.10
      sig_r: 0.002
      sig_p: 0.02
      effective_position_sigma_floor: 0.1225
      emission: gaussian
      sigma_mode: std
      start_sig: 0.75
      r0_sig: 0.01
      band_pad_ft: 100.0
      momentum: 0.998
      output_inside_branch: posterior_mean
  observation:
    source: exact_exp209
    prefix_affine_calibration: exact_exp209
    sigma_gr: exact_exp209
    missing_gr_policy: exact_exp209
    h_evaluation: all_absolute_tvt_grid_values
    e_evaluation: exp226_tvt_geop
  soft_sticky:
    coordinate: measured_depth_ft
    base_switching_length_md_ft: 1000.0
    switch_hazard_formula: one_minus_exp_negative_delta_md_over_base_switching_length
    dwell_interpretation: >-
      E prior mean dwell is 1000 MD-ft; H dwell can be longer because H-to-E
      switch probability is multiplied by the docking score.
    e_to_h_injection:
      source_tvt: previous_exp226_tvt_geop
      source_residual_rate: 0.0
      destination_distribution: normalized_h_transition_kernel
    h_to_e_docking:
      sigma_ft: 6.0
      score: >-
        expectation_under_normalized_h_transition_kernel_of_gaussian_distance
        between_next_h_absolute_tvt_and_current_exp226_tvt_geop
      probability_formula: switch_hazard_times_gaussian_docking
    h_to_h_probability: one_minus_h_to_e_probability
    e_to_e_probability: one_minus_switch_hazard
  inference:
    algorithm: exact_log_space_forward_backward
    output: joint_regime_and_state_posterior_mean
    formula: gamma_E_times_tvt_geop_plus_sum_gamma_H_times_absolute_tvt
  forbidden:
    - low_rank_3d_geologic_field
    - formation_or_rgt_prerequisite
    - exp226_gr_delta_or_final_tvt_pred_or_u_projection
    - manually_enumerated_hmm_modes
    - marginal_map_viterbi_or_topk_mode_bank
    - student_t_or_huber_emission
    - hard_router_or_rowwise_selector
    - posthoc_blend_or_oracle_branch_choice
    - parameter_grid_or_same_oof_rescue


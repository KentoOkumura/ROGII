experiment:
  name: exp394_soft_sticky_exp226_k16_branch_hmm
  description: >-
    Joint exact forward-backward model with one exp226 geometry-only path branch
    and one full-grid exp209 HMM branch whose transition mean follows the frozen
    exp355 K16 relative rate schedule.
  route: pf_beam
  status: technical_preflight_runtime_failed_closed
  created_at: "2026-07-25"
  updated_at: "2026-07-25"

lineage:
  parent: exp355_exp226_dip_rate_prior_on_exp209
  branch_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  decoder_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  promotion_baseline: exp263_last_anchor_better_candidate_confidence_pair_cache
  steering: ../../docs/legacy/steering/20260725-exp394-soft-sticky-exp226-k16-branch-hmm
  references:
    - exp270_exact_hmm_posterior_mode_candidate_audit
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp357_exp226_huber_emission_independent_audit
    - exp391_prefix_anchored_mode_persistence_hmm_readout
    - docs/06_reproducibility.md
  diff_summary: >-
    Add an exp226 geometry-only single-state branch to the complete exp209
    absolute-TVT-by-residual-rate trellis. Use the exp355 K16 relative rate
    schedule only as the HMM transition mean, use the same exp209 Gaussian GR
    emission on both branches, and marginalize an MD-aware soft-sticky regime.
    Do not use a low-rank 3D field or a finite HMM mode bank.


inference:
  mode: not_selected_train_side_audit_only
  selected_variant: top2_candidate_only
  notes:
    - Inference is intentionally out of scope because train-side OOF is weaker than exp098 lgb1 and exp092 lgb1.

submission:
  status: not_submitted
  public_lb: null
  private_lb: null
  notes:
    - Kaggle train v1 rejected the top-n candidate-only feature set; do not submit.

notes:
  - Implements backlog item selector_topn_candidate_only_features.
  - PF/Beam candidates remain target-free structured features under route ml_model.
  - Direct candidate selector and soft average are intentionally out of scope.

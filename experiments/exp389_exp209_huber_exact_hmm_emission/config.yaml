model:
  name: exp209_absolute_tvt_exact_hmm_huber_delta1p345
  estimator: deterministic_exact_forward_backward
  active_variants: [huber_delta1p345_on_exp209_absolute_tvt]
  promotion_candidate: huber_delta1p345_on_exp209_absolute_tvt
  emission:
    control_family: gaussian
    control_formula: "-0.5 * min(z^2, 600)"
    candidate_family: huber
    delta: 1.345
    candidate_formula: "-0.5*z^2 if abs(z)<=delta else -(delta*abs(z)-0.5*delta^2)"
    normalization_constant: omitted_as_state_independent
    additional_clip: none
    temperature: 1.0
    likelihood_weight: 1.0
  fixed_hmm:
    coordinate: absolute_tvt
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    band_pad: 100.0
    grid_contract: exp209_typewell_range_last_known_tvt_band_pad_100ft
    grid_step_ft: 0.35
    rate_states: 41
    rate_center: zero
    rate_span_contract: max_0p10_abs_prefix_initial_rate_plus_0p04
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    momentum: 0.998
    sigma_mode: known_prefix_zero_fill_population_std
    sigma_clip: [10.0, 60.0]
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
    output: posterior_mean
    emission: huber_quadratic_center_linear_tail
    delta: 1.345
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
  execution_count:
    scientific_variants: 1
    hmm_well_runs: 773
    gaussian_parent_hmm_reruns: 0
    lightgbm_configs: 0
    trained_folds: 0
    boosters: 0
    pf_runs: 0
    beam_runs: 0


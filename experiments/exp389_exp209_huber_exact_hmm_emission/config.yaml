experiment:
  name: exp389_exp209_huber_exact_hmm_emission
  description: >-
    Implemented compact self-contained train-side candidate that keeps the
    exp209 absolute-TVT exact HMM unchanged and replaces only its capped
    Gaussian row emission with a fixed delta=1.345 Huber emission. The saved
    exp209 Gaussian prediction is the control and is not rerun.
  route: pf_beam
  status: terminal_closed_tail_gate_failed_no_rescue
  created_at: "2026-07-24"
  updated_at: "2026-07-25"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../.steering/20260724-exp389-exp209-huber-exact-hmm-emission
  sibling_reference: exp374_exp209_student_t_exact_hmm_emission
  mis_scoped_history: exp357_exp226_huber_emission_independent_audit
  references:
    - exp072_likelihood_pf_baseline
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp374_exp209_student_t_exact_hmm_emission
    - exp357_exp226_huber_emission_independent_audit
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  diff_summary: >-
    Change only the exp209 row log emission from
    -0.5*min(z^2,600) to the fixed delta=1.345 Huber log score.
    Keep the absolute-TVT coordinate, grid, rate states, transitions, priors,
    sigma, missing-GR handling, Type Well GR, momentum, likelihood weight,
    and posterior-mean output unchanged. Do not use exp226 tvt_geop, the
    exp281 residual-offset coordinate, or the exp357 shift-rank design.


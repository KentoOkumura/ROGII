experiment:
  name: exp342_exp226_student_t_residual_offset_emission_audit
  description: >-
    Stage 0 target-free rank audit and an explicitly approved exploratory
    Stage 1 exact-HMM evaluation of a fixed df=4 Student-t GR emission.
    Stage 1 replaced only the exp281 Gaussian emission and failed its frozen
    scientific and direct-promotion gates.
  route: pf_beam
  status: stage_1_override_completed_guard_failed_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-24"

lineage:
  parent: exp281_exp226_residual_offset_exact_hmm_transition_probe
  steering: ../../.steering/20260722-exp342-exp226-student-t-residual-offset-emission-audit
  stage_0_source: exp280_exp226_shift_likelihood_separability_readout
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp232_adaptive_robust_likelihood_pf
    - exp307_finite_only_robust_sigma_gr
  diff_summary: >-
    Replaces only the Gaussian residual family with df=4 Student-t while
    retaining the exp280 512-row/13-shift bank, exp281 known-prefix residual
    sigma, GR missing policy, exp226 geometry path, fold assignment, and
    truth-late rank readout. The Gaussian control is loaded from the
    SHA-pinned exp280 score artifact and is not regenerated.

implementation:
  enabled: true
  scope: stage_0_rank_audit_and_stage_1_exact_hmm_override
  train_notebook_state: compact_selfcontained_canonical_adopted
  canonical_notebook_replacement_authorized_by_request: true
  canonical_notebook_adopted: true
  stage_1_implemented: true
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.score_rows

validation:
  strategy: frozen_student_t_and_saved_gaussian_shift_rank_audit
  metric: mrr_top3_gain_vs_saved_gaussian
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_blocks: 7787
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: train_unknown_suffix_rows_aggregated_to_fixed_512_row_blocks
  truth_attachment: after_student_t_and_control_score_content_sha_freeze
  leakage_policy:
    - Student-t scores and extreme-residual counts are frozen before truth-nearest shifts are joined.
    - The saved Gaussian score table is verified by compressed-content and declared content SHA before use.
    - exp226 tvt_pred, gr_delta, tvt_true, error, and abs_error are rejected by target-free scoring APIs.
    - Raw horizontal TVT is not read until Student-t and Gaussian score bundles are frozen.
  stage_0_pass_requires_all:
    required_score_finite_coverage: 1.0
    required_row_identity_coverage: 1.0
    required_control_rank_parity: 1.0
    minimum_pooled_mrr_gain: 0.01
    minimum_pooled_top3_gain: 0.01
    minimum_improved_folds_mrr: 4
    minimum_improved_folds_top3: 4
    stress_scopes:
      - long_tail_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
      - persistent_offset
    require_stress_mrr_non_regression: true
    require_stress_top3_non_regression: true
    require_real_shuffle_mrr_gap_not_worse: true
    require_real_shuffle_top3_gap_not_worse: true
    extreme_residual:
      absolute_z_threshold: 3.0
      block_definition: truth_nearest_shift_has_at_least_one_extreme_row
      minimum_extreme_rows_per_block: 1
      require_top3_improvement: true
      require_mean_regret_improvement: true
  stage_1_pass_requires_all:
    parent_candidate: gaussian_residual_offset_hmm
    candidate: student_t_residual_offset_hmm
    minimum_rmse_gain_vs_exp281_ft: 0.05
    minimum_improved_folds: 4
    maximum_scope_rmse_regression_ft: 0.0
    required_scopes:
      - long_tail_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
    maximum_by_well_p95_delta_rmse_ft: 0.0
    maximum_worst_well_regression_ft: 0.25
    required_parent_rmse_parity_atol_ft: 0.00001
    required_finite_coverage: 1.0
    required_row_identity_coverage: 1.0
    maximum_direct_rmse_for_promotion: 9.427109596582213


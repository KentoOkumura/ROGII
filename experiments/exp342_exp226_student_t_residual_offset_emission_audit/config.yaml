model:
  name: exp226_student_t_residual_offset_emission_audit
  estimator: none_deterministic_diagnostic
  student_t:
    degrees_of_freedom: 4.0
    formula: minus_half_df_plus_one_log1p_z2_over_df
    zscore_scale: exact_exp281_known_prefix_residual_std
    additional_clip: none
  stage_0:
    active_variants: [student_t_df4]
    active_variant_count: 1
    block_size: 512
    shifts_ft: [-80.0, -40.0, -20.0, -10.0, -5.0, -2.0, 0.0, 2.0, 5.0, 10.0, 20.0, 40.0, 80.0]
    gaussian_control: sha_pinned_saved_exp280
    negative_control: stable_sha256_nonzero_circular_shift_bank_rotation
  stage_1:
    implemented: true
    enabled_condition: explicit_user_override_after_stage_0_fail
    active_variants: [student_t_df4]
    hmm_well_runs: 773
  hmm:
    delta_min_ft: -80.0
    delta_max_ft: 80.0
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    emission: student_t_df4
    student_t_degrees_of_freedom: 4.0
    lam: 1.0
    sigma_mode: std
    start_delta_ft: 0.0
    start_sig: 0.75
    initial_offset_rate: 0.0
    r0_sig: 0.01
    mom: 0.998
    rate_center: zero
    additional_likelihood_clip: none
    typewell_extension_ft: 40.0
    transition_center: exp226_tvt_geop_row_delta
    active_variants: [student_t_df4_residual_offset_delta80_step035_rate41]
    forbid_columns: [tvt_pred, gr_delta, tvt_true, abs_error, error]
  fixed_parent:
    shape: exp226_tvt_geop
    coordinate: residual_offset
    sigma_mode: known_prefix_residual_std
    sigma_clip: [10.0, 60.0]
    missing_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
    state_grammar_transition_prior_output: exact_exp281
  forbidden:
    - df_grid
    - sigma_rescaling
    - likelihood_temperature
    - huber_or_log_cap
    - missing_uncertainty
    - acf_tempering
    - blend


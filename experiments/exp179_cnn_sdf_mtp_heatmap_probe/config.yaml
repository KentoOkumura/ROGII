experiment:
  name: "exp179_cnn_sdf_mtp_heatmap_probe"
  description: Fold-safe GPU smoke for the discussion-699853 5-channel CNN/SDF/MTP heatmap idea.
  route: ml_model
  status: completed_train_side_gpu_probe_supported
  created_at: "2026-07-03"
  updated_at: "2026-07-03"

lineage:
  parent: mtp_heatmap_sdf_mdn_probe backlog
  discussion_source: docs/discussions/rogii-wellbore-geology-prediction-699853-multi-trajectory-prediction-mtp-with-deep-cnn-for-welllog-inversion-fullcsv.md
  implementation_source: exp179_cnn_sdf_mtp_heatmap_probe_train.py
  diff_summary: Implements the first split-out MTP/CNN/SDF backlog item as a train-side GPU diagnostic. It builds target-free typewell TVT windows from last-known TVT plus Z prior, trains a compact 5-channel heatmap CNN with K path heads, and compares real GR against shuffled-GR and no-GR controls on one well GroupKFold fold. It does not create a submission, replace PF/Beam paths, use valid/test true TVT for input windows, or train any existing baseline/control.

overrides:
  project_defaults:
    - validation.metric

# Defaults come from project.yml. Add keys here only when this experiment intentionally differs.
validation:
  strategy: one_fold_well_groupkfold_heatmap_mtp_probe
  metric: top3_within10_center_rate
  seed: 42
  n_folds: 5
  fold_index: 0
  group_column: well
  score_rows: pseudo_tail_tvt_input_missing_equivalent_windows
  secondary_metrics:
    - target_in_grid_rate
    - top1_within10_center_rate
    - top5_within10_center_rate
    - top10_within10_center_rate
    - oracle_top10_center_rmse
    - center_ce_loss
    - real_vs_shuffled_margin
    - real_vs_no_gr_margin
  leakage_policy:
    - Typewell TVT grid centers are generated from last finite TVT_input and known Z trajectory only, using flat-prior TVT = last_known_tvt - (Z - last_known_z).
    - Horizontal history channel uses observed TVT_input prefix only. Evaluation-tail TVT is never written into heatmap inputs, normalization, candidate grid centers, or controls.
    - True TVT is used only as the supervised path target and for metrics on raw train pseudo-tail rows.
    - Fold split is by well id. Window random split is forbidden.
    - Shuffled-GR and no-GR controls are trained and evaluated under the same fold/sample schedule before any follow-up is considered.
    - Direct TVT submission, PF weight replacement, hard candidate path replacement, softmax blend, inference port, and hidden-test regeneration are out of scope.

# Common paths and submission columns come from project.yml.
data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt

model:
  name: compact_heatmap_cnn_mtp_probe
  estimator: pytorch_conv2d_path_head
  target: nearest_typewell_tvt_bin_for_true_horizontal_tvt
  input_channels:
    - typewell_gr_heatmap
    - horizontal_gr_heatmap
    - typewell_minus_horizontal_gr
    - tvt_history_sdf_from_observed_tvt_input_prefix
    - observed_tvt_input_mask
  variants:
    - real_gr
    - shuffled_gr
    - no_gr
  active_variants:
    - real_gr
    - shuffled_gr
    - no_gr
  architecture:
    channels: [32, 64, 64]
    kernel_size: 3
    path_modes: 10
    use_group_norm: true
    dropout: 0.05
  training:
    max_wells: 160
    max_train_wells: 96
    max_valid_wells: 32
    train_samples_per_well: 24
    valid_samples_per_well: 16
    horizontal_window_rows: 128
    typewell_window_bins: 64
    typewell_compression: 2
    tvt_grid_half_width_ft: 192.0
    max_tail_rows: 2048
    min_label_fraction: 0.35
    center_target_tolerance_ft: 10.0
    history_scale_ft: 200.0
    epochs: 5
    learning_rate: 0.001
    weight_decay: 0.0001
    gradient_clip_norm: 1.0
    use_amp: false
    require_cuda: true
    min_cuda_capability_major: 7
    dataloader_shuffle: true

runtime:
  use_amp: false
  num_workers: 0
  batch_size: 32
  kaggle:
    enable_gpu: true
    machine_shape: NvidiaTeslaT4
    enable_internet: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_global_seed_plus_stable_sha256_per_well_for_sample_order_and_shuffled_gr
  stochastic_components:
    - pytorch_cuda_conv_training
    - adamw_optimizer
    - dataloader_shuffle_with_seeded_generator
  parallel_rng_policy: num_workers_zero_no_parallel_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a GPU train-side diagnostic, not a deterministic submission anchor.
    - torch.use_deterministic_algorithms is enabled with warn_only=True; CuDNN benchmark is disabled.
    - Model, sample index, validation predictions, schema, and decompressed gzip content SHA are recorded after Kaggle train.

audit:
  mode: cnn_sdf_mtp_heatmap_probe
  output_prefix: exp179_cnn_sdf_mtp_heatmap_probe
  topk_values: [1, 3, 5, 10]
  expected_train_artifacts:
    - exp179_cnn_sdf_mtp_heatmap_probe_sample_index.csv.gz
    - exp179_cnn_sdf_mtp_heatmap_probe_validation_predictions.csv.gz
    - exp179_cnn_sdf_mtp_heatmap_probe_metrics.csv
    - exp179_cnn_sdf_mtp_heatmap_probe_training_history.csv
    - exp179_cnn_sdf_mtp_heatmap_probe_feature_schema.csv
    - exp179_cnn_sdf_mtp_heatmap_probe_model_manifest.json
    - exp179_cnn_sdf_mtp_heatmap_probe_summary.json

inference:
  mode: not_selected_train_side_diagnostic_only
  selected_variant: null
  notes:
    - No inference notebook should be pushed for submission from this smoke.
    - Follow-up requires real GR to beat both shuffled-GR and no-GR controls on topK coverage and weak-bucket diagnostics.

notes:
  - Implements backlog item cnn_sdf_mtp_heatmap_probe split out from mtp_heatmap_sdf_mdn_probe.
  - The first authoritative execution should be Kaggle train v1 with GPU enabled.

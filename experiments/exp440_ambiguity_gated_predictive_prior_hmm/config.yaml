notes:
  - Current phase is late; exp440 is P3 behind exp434 P1 and the exp436-derived fixed-five P3 contract, and ahead of P4 attribution-only work.
  - Strong negative evidence from exp408, exp133, and exp363 is retained; design completion is not scientific support.
  - Kaggle version 1 uses the exact self-contained notebook with only unused repository src files omitted from the bootstrap bundle.
  - Stage 0 passed 13/15 technical gates and 2/8 mechanism gates; the user explicitly authorized a full-well confirmation on 2026-07-30 without changing the failed Stage-0 interpretation.
  - Full OOF uses four deterministic LPT CPU shards so every one of the 773 wells is decoded exactly once while preserving the existing 9-hour per-kernel hard guard.
  - Stage 1 technical gates all passed, but candidate RMSE was 12.992063 versus exp209 11.938287 and every preregistered scientific safety family failed; the branch is terminally closed without inference or submission.

model:
  name: ambiguity_gated_predictive_prior_exact_hmm
  estimator: deterministic_exact_forward_backward
  state:
    - tvt_position
    - u_rate
  fixed_from_exp209:
    position_grid_step_ft: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    momentum: 0.998
    emission_family: gaussian_typewell_gr
    emission_lambda_clear: 1.0
    sigma_mode: known_prefix_zero_fill_population_std
    sigma_clip:
      - 10.0
      - 60.0
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    rate_center: zero
    output: smoothed_posterior_mean_and_std
  active_scientific_variants:
    - ambiguity_gated_predictive_prior_hold
  candidate:
    ambiguity_source: causal_provisional_filtered_tvt_position_marginal
    eligibility: raw_gr_observed_only
    ambiguous_emission_lambda: 0.0
    clear_emission_lambda: 1.0
    candidate_filtered_if_ambiguous: transitioned_predictive_joint_distribution
    hard_previous_tvt_point_freeze: false
    schedule_iteration: single_causal_forward_pass_no_backward_or_truth_feedback
    backward_policy: reuse_frozen_forward_ambiguity_schedule
  ambiguity_contract:
    source: exp236_exact_hmm_posterior_bimodality_audit
    min_peak_height: 0.02
    min_top2_mass: 0.10
    min_top2_to_top1_mass_ratio: 0.25
    min_peak_separation_ft: 6.0
    min_valley_depth: 0.30
  forbidden:
    - gmm_student_t_huber_or_other_emission_family_change
    - continuous_or_soft_emission_lambda
    - ambiguity_threshold_grid_or_same_oof_selection
    - hard_previous_tvt_point_freeze
    - transition_rate_prior_grid_sigma_or_missing_gr_change
    - blend_selector_well_gate_or_row_gate
    - same_oof_rescue


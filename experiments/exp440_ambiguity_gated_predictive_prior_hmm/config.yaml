experiment:
  name: "exp440_ambiguity_gated_predictive_prior_hmm"
  description: "Stage 0 FAILを維持したfull 773-well確認でもparent exp209比1.053776 ft悪化、positive fold 1/5、全安全scopeとwell tailがFAILしたためno-rescueでterminal close。"
  route: pf_beam
  status: stage1_full_oof_failed_closed
  created_at: "2026-07-29"
  updated_at: "2026-07-30"
  inference_enabled: false

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  references:
    - exp133_gr_bimodal_match_ambiguity_detector
    - exp236_exact_hmm_posterior_bimodality_audit
    - exp363_sticky_gr_reliability_exact_hmm
    - exp408_hmm_message_rate_basin_audit
    - exp411_predictive_filtered_rate_innovation_destick
    - exp435_tvt_memoryless_u_rate_dzonly_hmm
    - docs/06_reproducibility.md
  implementation_source:
    - experiments/exp408_hmm_message_rate_basin_audit/exp408_hmm_message_rate_basin_audit_compact_selfcontained_train.py
    - experiments/exp236_exact_hmm_posterior_bimodality_audit/posterior_bimodality_audit.py
    - experiments/exp411_predictive_filtered_rate_innovation_destick/exp411_predictive_filtered_rate_innovation_destick_compact_selfcontained_train.py
  diff_summary: >
    Keep the complete exp209 state, transition, prior, GR preprocessing,
    Gaussian emission family and scale, grid, forward-backward algorithm, and
    posterior-mean readout. On raw-GR-observed rows only, compute the ordinary
    provisional filtered TVT marginal from the candidate predictive prior and
    parent emission. If that marginal satisfies the unchanged exp236
    bimodality thresholds, replace only that row's emission exponent 1.0 with
    0.0. This retains the transitioned predictive distribution; it does not
    set TVT_t equal to a previous point estimate. No GMM or robust emission is
    introduced.

validation:
  strategy: fixed32_mechanism_gate_then_separately_authorized_full_773_well_oof
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_wells: 773
  expected_rows: 3783989
  expected_folds: [0, 1, 2, 3, 4]
  high_missing_fraction_min: 0.30
  leakage_policy:
    - Ambiguity uses only the candidate predictive message, parent GR emission, and raw-GR-observed flag.
    - True TVT, error, fold, hidden-like role, persistent episode, and cause labels are prohibited before ambiguity schedule, prediction, and diagnostic SHA freeze.
    - The exp236 thresholds are reused unchanged and are not selected on exp440 outcomes.
    - Stage 0 fixed32 is mechanism-only and must not be reported as CV or promotion evidence.


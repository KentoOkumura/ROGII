  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    ambiguity_schedule_sha: true
    diagnostic_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - First run is not a deterministic anchor; an independent schedule and prediction SHA rerun is required.
    - Freeze ambiguity schedule, prediction, and diagnostic content before reading truth, fold, hidden-like role, or episode labels.
    - Model and submission SHA are not applicable because this experiment trains no model and produces no submission.


experiment:
  name: "exp202_heatmap_mdn_candidate_generator_probe"
  description: Heatmap MDN/MTP candidate generator probe for PF/Beam candidate union headroom.
  route: pf_beam
  status: implemented_not_run
  created_at: "2026-07-05"
  updated_at: "2026-07-06"

lineage:
  parent: heatmap_mdn_candidate_generator_probe backlog
  heatmap_parent: exp182_cnn_sdf_mtp_heatmap_fullfold_geometry_probe
  selector_parent: exp184_cnn_sdf_mtp_heatmap_path_features_on_exp158
  candidate_cache_parent: exp099_pf_multi_observation_likelihood_probe
  discussion_source: docs/discussions/rogii-wellbore-geology-prediction-699853-multi-trajectory-prediction-mtp-with-deep-cnn-for-welllog-inversion-fullcsv.md
  implementation_source: exp202_heatmap_mdn_candidate_generator_probe_train.py
  diff_summary: >
    Reframes the exp182 5-channel heatmap CNN/MTP model as a PF/Beam candidate
    generator. It trains only a base real-GR K-path head, saves topK TVT/mode
    candidates, and measures whether adding those candidates to the existing
    PF/Beam/likPF/sc/hyb union improves oracle coverage and selector headroom.
    It does not perform direct TVT replacement, softmax averaging, PF weight
    replacement, postprocess blending, inference, or submission.

overrides:
  project_defaults:
    - validation.metric

validation:
  strategy: fullfold_groupkfold_heatmap_mdn_candidate_union_probe
  metric: union_top10_oracle_rmse_delta
  seed: 42
  n_folds: 5
  active_fold_indices: [0, 1, 2, 3, 4]
  group_column: well
  score_rows: pseudo_tail_tvt_input_missing_equivalent_windows
  secondary_metrics:
    - heatmap_top1_within10_center_rate
    - heatmap_top3_within10_center_rate
    - heatmap_top10_within10_center_rate
    - heatmap_top10_oracle_center_rmse
    - base_union_oracle_rmse
    - heatmap_union_oracle_rmse
    - union_within10_delta
    - new_best_candidate_rate
    - mode_probability_calibration
    - distance_bucket_oracle_delta
    - worst_well_oracle_delta
  leakage_policy:
    - Typewell TVT grid centers are generated from last finite TVT_input and known Z trajectory only, using flat-prior TVT = last_known_tvt - (Z - last_known_z).
    - Horizontal history and prefix anchor channels use observed TVT_input prefix only. Evaluation-tail TVT is never written into heatmap inputs, normalization, candidate grid centers, run spec selection, or controls.
    - True TVT is used only as the supervised path target and for train-side metrics / oracle readout.
    - Fold split is by well id. Window random split is forbidden.
    - Existing PF/Beam candidate values are read from saved train-side pseudo-tail caches and are not regenerated.
    - Oracle best, true-error rank, absolute error, within10, and OOF error columns are never used as features or inference-time selection inputs.
    - Direct TVT replacement, softmax weighted average, PF weight replacement, postprocess blend, inference port, and submission are out of scope.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp099_train_feature_cache_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_train_features.csv.gz
  exp099_train_feature_schema_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_feature_schema.csv

model:
  name: heatmap_mdn_candidate_generator_probe
  estimator: pytorch_conv2d_path_logit_head
  target: nearest_typewell_tvt_bin_for_true_horizontal_tvt
  base_input_channels:
    - typewell_gr_heatmap
    - horizontal_gr_heatmap
    - typewell_minus_horizontal_gr
    - tvt_history_sdf_from_observed_tvt_input_prefix
    - observed_tvt_input_mask
  variants:
    - real_gr
  channel_sets:
    base:
      include_geometry: false
  architecture:
    channels: [32, 64, 64]
    kernel_size: 3
    path_modes: 10
    path_horizon: 128
    use_group_norm: true
    dropout: 0.05
  training:
    max_wells: null
    max_train_wells: null
    max_valid_wells: null
    train_samples_per_well: 20
    valid_samples_per_well: 14
    default_horizontal_window_rows: 128
    default_typewell_window_bins: 64
    default_tvt_grid_half_width_ft: 192.0
    default_history_scale_ft: 200.0
    max_tail_rows: 2048
    min_label_fraction: 0.35
    center_target_tolerance_ft: 10.0
    epochs: 4
    learning_rate: 0.001
    weight_decay: 0.0001
    gradient_clip_norm: 1.0
    use_amp: false
    require_cuda: true
    min_cuda_capability_major: 7
    dataloader_shuffle: true
  active_run_specs:
    - name: candidate_real_w128_b64_fullfold
      variant: real_gr
      channel_set: base
      fold_indices: [0, 1, 2, 3, 4]
      horizontal_window_rows: 128
      typewell_window_bins: 64
      tvt_grid_half_width_ft: 192.0
      history_scale_ft: 200.0
  planned_cnn_models: 5
  planned_lightgbm_configs: 0
  planned_boosters: 0
  control_or_parent_retraining: false

candidate_union:
  enabled: true
  source_cache: data.exp099_train_feature_cache_local
  source_schema: data.exp099_train_feature_schema_local
  id_column: id
  target_delta_column: target
  last_known_tvt_column: last_known_tvt
  heatmap_run_spec: candidate_real_w128_b64_fullfold
  heatmap_candidate_prefix: heatmap_mdn
  topk_values: [1, 3, 5, 10]
  within_ft: 10.0
  existing_candidates:
    - pf_ancc
    - beam_mean
    - likpf_mean
    - sc_ens
    - hyb
    - tvt_dense
    - tvt_densew
    - tvt_dense50
  required_existing_candidates:
    - pf_ancc
    - beam_mean
    - likpf_mean
    - sc_ens
    - hyb
  optional_existing_candidates:
    - tvt_dense
    - tvt_densew
    - tvt_dense50
  distance_column: md_since

candidate_paths:
  enabled: true
  topk: 10
  format: npz_plus_index_csv
  intended_use: plotting_only
  description: >
    Save the local 128-row path corresponding to each deduplicated heatmap
    center-row topK candidate. This does not stitch full-well trajectories and
    is not used for training, selection, inference, or submission.

runtime:
  use_amp: false
  num_workers: 0
  batch_size: 32
  kaggle:
    enable_gpu: true
    machine_shape: NvidiaTeslaT4
    enable_internet: false
    kernel_sources:
      - kentookumura/exp099-pf-multiobs-likelihood-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_global_seed_plus_stable_sha256_per_run_spec_fold_well_for_sample_order
  stochastic_components:
    - pytorch_cuda_conv_training
    - adamw_optimizer
    - dataloader_shuffle_with_seeded_generator
    - upstream_exp099_pfbeam_candidate_cache
  parallel_rng_policy: num_workers_zero_no_parallel_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    run_spec_manifest_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a GPU train-side diagnostic, not a deterministic submission anchor.
    - torch.use_deterministic_algorithms is enabled with warn_only=True; CuDNN benchmark is disabled.
    - Model, sample index, validation predictions, candidate-union readouts, schema, run specs, and decompressed gzip content SHA are recorded after Kaggle train.

audit:
  mode: heatmap_mdn_candidate_generator_probe
  output_prefix: exp202_heatmap_mdn_candidate_generator_probe
  topk_values: [1, 3, 5, 10]
  distance_buckets:
    - [0, 50]
    - [50, 100]
    - [100, 250]
    - [250, 500]
    - [500, 1000]
    - [1000, 1000000000]
  expected_train_artifacts:
    - exp202_heatmap_mdn_candidate_generator_probe_sample_index.csv.gz
    - exp202_heatmap_mdn_candidate_generator_probe_validation_predictions.csv.gz
    - exp202_heatmap_mdn_candidate_generator_probe_heatmap_candidates.csv.gz
    - exp202_heatmap_mdn_candidate_generator_probe_heatmap_candidate_paths_top10.npz
    - exp202_heatmap_mdn_candidate_generator_probe_heatmap_candidate_path_samples.csv.gz
    - exp202_heatmap_mdn_candidate_generator_probe_heatmap_candidate_path_rank_index.csv.gz
    - exp202_heatmap_mdn_candidate_generator_probe_candidate_union_metrics.csv
    - exp202_heatmap_mdn_candidate_generator_probe_candidate_union_by_well.csv
    - exp202_heatmap_mdn_candidate_generator_probe_candidate_union_distance_bucket_metrics.csv
    - exp202_heatmap_mdn_candidate_generator_probe_metrics.csv
    - exp202_heatmap_mdn_candidate_generator_probe_fold_metrics.csv
    - exp202_heatmap_mdn_candidate_generator_probe_well_metrics.csv
    - exp202_heatmap_mdn_candidate_generator_probe_distance_bucket_metrics.csv
    - exp202_heatmap_mdn_candidate_generator_probe_training_history.csv
    - exp202_heatmap_mdn_candidate_generator_probe_feature_schema.csv
    - exp202_heatmap_mdn_candidate_generator_probe_run_spec_manifest.json
    - exp202_heatmap_mdn_candidate_generator_probe_model_manifest.json
    - exp202_heatmap_mdn_candidate_generator_probe_summary.json

inference:
  mode: not_selected_train_side_diagnostic_only
  selected_variant: null
  notes:
    - No inference notebook should be pushed for submission from this diagnostic.
    - A positive candidate-union headroom result must be split into heatmap_mdn_candidates_into_exp158_selector or heatmap_mdn_confidence_features_on_exp148 before any inference work.

notes:
  - Implements backlog item heatmap_mdn_candidate_generator_probe.
  - Planned Kaggle train cost before push is 1 active heatmap candidate-generator spec x 5 folds = 5 CNN models, 0 LightGBM boosters, and no parent/control retraining.
  - Kaggle train push requires explicit GPU cost confirmation.

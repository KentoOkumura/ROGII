experiment:
  name: exp492_huber_exact_hmm_full_replacement_on_exp264
  description: >-
    exp264の12候補ID・順序・legal domain・88列candidate-long schemaを維持したまま、
    exact_hmm semantic slotをexp389のdelta=1.345 Huber exact HMMへ全面置換する。
    exact_hmm依存のpairと固定3-wayも再計算し、corrected strict nested dual selectorだけを
    1 variant、2 objectives、outer 5 x inner 4で評価する設計凍結実験。
  hypothesis: >-
    exp389 Huber HMMはGaussian exact HMMよりsaved OOF RMSEを0.085546 ft改善した。
    13本目として追加したexp392ではcandidate count増加に伴うincumbent rerankingが発生したため、
    semantic slotを置換して候補数を12本に保てば、その平均改善をより安定してselectorへ
    伝播できる可能性がある。
  route: ensemble
  status: stage_c_completed_scientific_gate_failed_postreadout_error_closed
  created_at: "2026-07-30"

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  physical_candidate_parent: exp389_exp209_huber_exact_hmm_emission
  fixed13_negative_reference: exp392_exp389_fixed13_dual_selector_on_exp264
  semantic_replacement_reference: exp413_scale5_likpf_full_replacement_on_exp335
  steering: ../../.steering/20260730-exp492-huber-exact-hmm-full-replacement-on-exp264
  diff_summary: >-
    12候補のID、宣言順、primary 11本、fixed fallback 7本、outer/inner fold、
    selector objective、sampling、LightGBM config、88列feature schemaを固定する。
    exact_hmmの値とnative confidenceをexp389へ差し替え、
    exp226_k16__exact_hmm、likpf_mean__exact_hmm、exp226_w500_50_50を再計算する。
    残る8候補はparent値とのparityを必須にする。13本目追加、Gaussianとの共存、
    downstream TVT、推論、提出は行わない。


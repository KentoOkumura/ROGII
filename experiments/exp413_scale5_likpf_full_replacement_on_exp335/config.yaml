    exactly 40 CPU selector boosters. The first 2026-07-28 request authorizes
    the completed Stage S package, push, and run for exactly 20 CPU
    signed-residual selector boosters. The later 2026-07-28 request authorizes
    only the completed Stage D package, push, and run for one replacement
    variant, three frozen LightGBM configs, and five outer folds: exactly 15 GPU
    boosters with zero saved-exp335 control retraining. The 2026-07-29 request
    separately authorizes current-test CPU inference with all 75 saved exp413
    models and zero new boosters, through prediction-only artifact generation
    and audit. The later 2026-07-29 request separately authorizes generation
    and submit-check of a sample-compatible submission.csv from the validated
    prediction. The user clarification requires this file to be generated by
    the Kaggle Notebook itself, so the same full current-test inference is
    authorized for Kaggle version 3 with zero trained boosters. The canonical
    inference placeholder remains unchanged. External submission remains
    fail-closed and requires separate approval.


experiment:
  name: "exp413_scale5_likpf_full_replacement_on_exp335"
  description: >-
    Design-frozen late-stage ML ablation that fully replaces the exp335
    likelihood-PF arithmetic-mean primitive with the saved exp404
    likelihood-temperature-5, gs-x1.0 prediction. The twelve-candidate
    identity contract is preserved, every direct and transitive
    likpf_mean-dependent feature is rebuilt, and all affected selectors and
    downstream models are retrained. Train-side Stage 0/C/S/D and the separately
    authorized current-test inference are complete. A local
    preflight CSV passed schema checks, and Kaggle-side full inference version 3
    generated submission.csv as a Notebook output. The downloaded file passed
    submit-check, but user-submitted ref 55078306 failed during the hidden
    rerun because public-test row/well cardinalities were hard-asserted.
    Hidden-compatible version 4 completed with dynamic sample-derived
    cardinality checks and exact public-output parity to version 3. The
    user-submitted version 4 code submission ref 55080377 completed with
    Public LB 7.201. Codex did not perform the external submission.
  hypothesis: >-
    The exp404 scale-5 x1.0 likelihood-PF prediction improves direct train OOF
    RMSE over the exp072-compatible arithmetic mean by about 0.680376 ft.
    Propagating that stronger primitive consistently through the exp264
    candidate bank and the exp335 ML stack can improve the current exp335
    Public-LB reference surface without introducing a thirteenth candidate.
  route: ml_model
  status: code_submission_v4_complete_public_lb_7p201
  created_at: "2026-07-26"
  updated_at: "2026-07-30"

lineage:
  parent: exp335_signed_residual_meta_on_exp264
  candidate_and_compact_parent: exp264_exp263_candidate_confidence_dual_selector
  pf_evidence: exp404_scale5_sigma_gr_likelihood_pf_ablation
  pf_kernel_parent: exp072_exp063_full_replay_feature_cache
  steering: ../../.steering/20260726-exp413-scale5-likpf-full-replacement-on-exp335
  references:
    - experiments/exp335_signed_residual_meta_on_exp264/result.md
    - experiments/exp264_exp263_candidate_confidence_dual_selector/candidate_contract.yaml
    - experiments/exp404_scale5_sigma_gr_likelihood_pf_ablation/metrics.json
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep the exp335 twelve-candidate IDs, order, legal domains, feature names,
    folds, selector objectives, signed-residual objective, LightGBM configs,
    and final 370-column width fixed. Replace only the value source behind the
    likpf_mean semantic slot, from the exp072-compatible arithmetic seed mean
    to exp404 likpf_scale_5_x1p0. Recompute all four derived likPF formulas,
    the fixed formula, every bank/base/selector/signed feature that depends
    directly or transitively on the primitive, then retrain 40 CPU selector,
    20 CPU signed-selector, and 15 GPU downstream boosters. Do not retrain the
    saved exp335 control.


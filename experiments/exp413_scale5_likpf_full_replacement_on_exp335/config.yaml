validation:
  strategy: exp335_outer5_full_transitive_likpf_primitive_replacement
  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  target: target_residual_from_last_known_tvt
  primary_control:
    experiment: exp335_signed_residual_meta_on_exp264
    prediction: saved_stage_d_lgb_mean_oof
    rmse: 8.146107755881022
    public_lb_reference: 7.517
    public_lb_ref: 54928806
    retraining_boosters: 0
  primary_candidate: scale5_x1p0_likpf_full_replacement_on_exp335
  gain_definition: parent_rmse_minus_replacement_rmse
  leakage_policy:
    - The exp404 replacement primitive is frozen before suffix truth, error, fold score, or hidden-like role is read.
    - Outer-valid target and error never enter selector fitting, calibration, feature selection, or threshold selection.
    - Candidate IDs, legal domains, folds, and sampling keys are frozen before any replacement model fit.
    - Public LB is a post-CV reference and cannot select scale, multiplier, feature subset, candidate subset, or model config.
  decision_policy: lb_oriented_late_stage_ml_replacement
  promotion:
    minimum_pooled_rmse_gain_ft: 0.03
    minimum_nonworse_folds: 3
    maximum_scope_delta_rmse_ft: 0.02
    required_scopes:
      - md_since_0_250
      - md_since_250_1000
      - md_since_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
    require_all_technical_checks: true
    by_well_tail_policy: report_only_not_automatic_stop
    required_tail_readouts:
      - by_well_delta_p95
      - worst_well_delta_rmse
      - worsened_well_count_plus_1ft
      - worsened_well_count_plus_3ft
      - worsened_well_count_plus_5ft
    pass_action: qualify_same_exp_inference_implementation_for_separate_approval
    fail_action: close_without_same_oof_rescue


reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: stable_sha256_per_well_for_pf_and_parent_seed42_for_models
  stochastic_components:
    - saved_likelihood_pf_seed_paths
    - lightgbm_cpu_selector_training
    - lightgbm_gpu_downstream_training
  parallel_rng_policy: >-
    PF seeds are derived from immutable split, feature-family, and well keys
    before parallel execution. No threaded worker may consume global RNG.
    Selector folds and sampling keys are inherited unchanged from the parents.
  cpu_model_flags:
    deterministic: true
    force_col_wise: true
    n_jobs: 8
  gpu_model_flags:
    gpu_use_dp: true
    deterministic: true
    force_col_wise: true
    num_threads: 8
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: true
  notes:
    - The exp404 train replacement primitive is SHA-frozen and requires zero new PF runs.
    - Current-test PF must retain the exp072 per-well stable seed policy and record regenerated feature content SHA.
    - GPU LightGBM is not assumed to be bitwise deterministic even with deterministic flags.
    - See docs/06_reproducibility.md before any deterministic-anchor claim.


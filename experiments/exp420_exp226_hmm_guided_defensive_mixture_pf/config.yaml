model:
  name: exp226_hmm_guided_defensive_mixture_scale5
  estimator: likelihood_weighted_particle_filter
  fitted_model: false
  active_variants:
    - exp226_hmm_guided_defensive_mixture_scale5
  state:
    position: surface_tvt_plus_z
    rate: surface_rate_per_md
  target_transition:
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    minimum_md_delta: 1.0
    rate_mean_formula: momentum_times_previous_particle_rate
    position_mean_formula: previous_position_plus_sampled_rate_times_md_delta
  geometry_rate:
    geometry_surface_formula: tvt_geop_plus_z
    formula: geometry_surface_difference_divided_by_md_delta
    first_suffix_previous_surface: last_known_tvt_input_plus_z
    uses_gr_correction: false
    uses_absolute_geometry_as_state: false
  hmm_signal:
    kernel: untreated_exp209_forward_filter
    uses_backward_pass: false
    uses_hmm_prediction: false
    uses_absolute_hmm_state: false
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    rate_step: 0.005
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    tie_tolerance: 1.0e-12
    momentum: 0.998
    emission: gaussian
    statistic: filtered_rate_mean_minus_predictive_rate_mean_divided_by_rate_step
    cusum:
      drift_allowance_rate_cells: 0.01
      positive_threshold_rate_cells: 1.0
      negative_threshold_rate_cells: 1.0
      activation_transitions: 32
      refractory_rows: 128
      reset_on_trigger: true
      allow_overlapping_trigger: false
      allow_direction_flip_while_active: false
      first_affected_transition: row_after_trigger
      freeze_before_pf: true
  rate_proposal:
    family: scheduled_importance_corrected_defensive_gaussian_mixture
    target_component:
      weight: 0.5
      center: target_transition_rate_mean
      sigma_multiplier: 1.0
    inactive:
      geometry_component_weights:
        - 0.16666666666666666
        - 0.16666666666666666
        - 0.16666666666666666
      geometry_center: fold_safe_exp226_geometry_rate
      sigma_multipliers: [1.0, 4.0, 16.0]
      weight_sum: 1.0
    active:
      geometry_component_weights:
        - 0.08333333333333333
        - 0.08333333333333333
        - 0.08333333333333333
      geometry_center: fold_safe_exp226_geometry_rate
      hmm_component_weights:
        - 0.08333333333333333
        - 0.08333333333333333
        - 0.08333333333333333
      hmm_center: target_transition_rate_mean_plus_direction_times_0p005
      sigma_multipliers: [1.0, 4.0, 16.0]
      weight_sum: 1.0
    importance_ratio: target_rate_density_divided_by_mixture_rate_density
    maximum_importance_ratio_by_construction: 2.0
    importance_clipping: false
  pf:
    particles: 500
    seeds: 128
    seed_index_first: 0
    seed_index_last: 127
    typewell_grid_step_ft: 0.2
    initial_position_spread_ft: 4.5
    initial_rate_spread: 0.01
    resample_threshold_fraction: 0.5
    resampling: systematic
    rough_position: 0.10
    rough_rate: 0.001
    emission: capped_gaussian
    emission_clip_z2: 600.0
    gr_sigma_multiplier: 1.0
    gr_sigma_clip: [10.0, 60.0]
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32
  aggregation:
    family: full_suffix_log_marginal_likelihood_weighted_mean
    temperature: 5.0
    evidence_source: importance_corrected_incremental_normalizer
    aggregation_mode: batch_noncausal


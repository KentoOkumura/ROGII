  primary_candidate: exp226_hmm_guided_defensive_mixture_scale5
  standalone_reference: saved_exp226_final_oof
  physical_anchor_reference: saved_exp263_exp226_w500_50_50
  saved_control_rmse_ft: 10.914522073423171
  saved_exp226_final_rmse_ft: 9.427109596582213
  saved_exp263_physical_blend_rmse_ft: 8.238331
  truth_attachment: after_schedule_candidate_target_free_diagnostics_and_logical_sha_freeze
  stage_0:
    use_pooled_rmse_as_promotion_gate: false
    expected_unique_wells: 44
    expected_fixed32_wells: 32
    expected_pf_sentinel_wells: 12
    expected_overlap: 0
  leakage_policy:
    - >-
      Proposal generation may read MD, Z, raw GR, Type Well inputs,
      last-known state, fold-safe exp226 tvt_geop, and the frozen untreated-HMM
      active/direction schedule only.
    - >-
      HMM posterior mean, backward message, exp226 final prediction, gr_delta,
      U projection, suffix TVT, error, episode labels, role, hidden-like role,
      and Public LB are forbidden before candidate freeze.
    - >-
      Candidate identity, schedule, prediction bytes, proposal diagnostics,
      resource ledger, and logical SHAs are frozen before evaluation fields are
      attached.
    - >-
      Stage-0 well selection is mechanism-enriched and fixed upstream, so its
      pooled RMSE is descriptive only and cannot promote the full candidate.


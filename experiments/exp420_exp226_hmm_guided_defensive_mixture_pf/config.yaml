experiment:
  name: exp420_exp226_hmm_guided_defensive_mixture_pf
  description: >-
    Integrate the fold-safe exp226 geometry rate and the untreated exact-HMM
    predictive-to-filtered rate-innovation schedule into one
    importance-corrected defensive-mixture likelihood-PF. The final prediction
    is a single PF output; no HMM/exp226 prediction blend or ML model is used.
  hypothesis: >-
    A proposal that preserves 50 percent of the original PF transition, uses
    exp226 geometry rate for spatial support, and temporarily adds a
    one-rate-cell HMM innovation direction can reduce finite-particle support
    loss and persistent rate-lag offsets without inheriting either physical
    model's absolute-path drift.
  route: pf_beam
  status: implementation_complete_prerequisite_failed_not_executed
  created_at: "2026-07-27"
  updated_at: "2026-07-28"
  inference_enabled: false

lineage:
  parent: exp419_exp226_guided_defensive_mixture_pf
  scientific_pf_parent: exp404_scale5_sigma_gr_likelihood_pf_ablation
  geometry_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  hmm_kernel_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  hmm_schedule_reference: exp411_predictive_filtered_rate_innovation_destick
  mechanism_evidence:
    - exp408_hmm_message_rate_basin_audit
    - exp410_likpf_particle_resampling_basin_audit
  physical_reference: exp263_last_anchor_better_candidate_confidence_pair_cache
  references:
    - experiments/exp264_exp263_candidate_confidence_dual_selector/physical_model_summary.md
    - docs/06_reproducibility.md
  steering: ../../.steering/20260727-exp420-exp226-hmm-guided-defensive-mixture-pf
  diff_summary: >-
    Start from the exp419 exp226-guided defensive-mixture proposal. Keep the
    original target component at 0.5. On a frozen untreated-HMM activation
    schedule only, split the remaining 0.5 equally between the exp226 geometry
    family and a three-width family centered one HMM rate cell in the detected
    direction. Keep p0/q correction, the PF target model, raw-GR emission,
    resampling, roughening, 500 particles, 128 seeds, and temperature-5
    full-suffix evidence aggregation fixed.


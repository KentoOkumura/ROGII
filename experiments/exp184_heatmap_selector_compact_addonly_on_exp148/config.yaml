    prefix: hmp184_
    oof_predictions_path: experiments/exp184_cnn_sdf_mtp_heatmap_path_features_on_exp158/kaggle/output/train_v2/artifacts/exp184_cnn_sdf_mtp_heatmap_path_features_on_exp158_oof_predictions.csv.gz
    selected_variant: viterbi_sw200_bias000_jw000_jf025_d0150_std999999_md0000_seg012
    selected_mode: viterbi
    max_missing_rate: 0.0
    default_candidate: likpf_mean
    candidate_diff_names:

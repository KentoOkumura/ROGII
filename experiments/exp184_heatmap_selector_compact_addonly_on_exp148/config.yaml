reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng_and_fixed_upstream_hmp184_oof_selector_artifact
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - upstream_exp182_pytorch_cuda_heatmap_models
    - upstream_exp184_lightgbm_selector_oof_surface
    - cpu_lightgbm_training
  parallel_rng_policy: CPU LightGBM deterministic flags plus fixed n_jobs and num_threads; feature merge itself has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a full-train add-only feature audit, not a deterministic submission anchor.
    - Exp184 OOF selector path is an upstream fixed train-side artifact and excludes true_tvt, abs_error, oracle_candidate, and oracle_label from downstream features.
    - Exp182 heatmap prediction reader excludes true TVT, target_in_grid, best_mode, abs_error, within10, and oracle-derived columns before feature construction.
    - Raw-test exp184 heatmap selector feature generation is not part of initial train implementation; submission requires a later inference port in the same experiment.


notes:
  - Implements the `exp184_heatmap_selector_compact_addonly_on_exp148` backlog item.
  - Planned Kaggle train cost is 1 active add-only variant, 3 LightGBM configs, 5 folds, 15 boosters.
  - Parent/control retraining is not included; exp148 CV/Public LB are historical baselines.
  - Kaggle train runtime is CPU with active mode cpu_deterministic_threads8 and enable_gpu=false.
  - The train code is split into train_lgb0/train_lgb1/train_lgb2 notebook packages; each package runs 1 config x 5 folds = 5 boosters.
  - Kaggle split train lgb0/lgb1/lgb2 version 1 completed on 2026-07-05.
  - Cross-split lgb_mean RMSE is 8.604130846223319, worse than exp148 GPU lgb_mean by +0.10284966432749876 and exp148 CPU runtime lgb_mean by +0.0754327322233177.
  - Kaggle run generated 28 hmp184 features because the optional exp148 OOF delta features were unavailable from the split train kernel inputs; local helper smoke had generated 31 features.
  - Direct exp184 selected TVT replacement, full exp184 heatmap feature dump, blend, postprocess, hard gate, inference port, and submit are explicitly out of initial scope.

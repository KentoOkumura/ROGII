experiment:
  name: "exp184_heatmap_selector_compact_addonly_on_exp148"
  description: Add compact exp184 CNN/SDF/MTP heatmap selector confidence features on top of the exp148 learned-likelihood LightGBM surface.
  route: ml_model
  status: completed_train_side_rejected_no_submit
  created_at: "2026-07-05"
  updated_at: "2026-07-05"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  selector_parent: exp184_cnn_sdf_mtp_heatmap_path_features_on_exp158
  heatmap_parent: exp182_cnn_sdf_mtp_heatmap_fullfold_geometry_probe
  selector_lineage:
    - exp157_candidate_ranker_feature_enrichment
    - exp158_segment_continuity_selector_on_exp157
    - exp184_cnn_sdf_mtp_heatmap_path_features_on_exp158
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp188_exp183_selector_confidence_addonly_on_exp148
    - exp194_exp183_selector_confidence_replacement_only_on_exp148
    - exp190_denoised_calibrated_matching_features_on_exp148
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148
  implementation_source: heatmap_selector_compact_addonly_on_exp148.py
  diff_summary: >
    Keeps the exp148 ML feature surface (exp092 U-projection plus exp145 learned
    likelihood confidence) and adds a compact feature block from exp184's
    best-Viterbi selected path plus exp182 heatmap score/margin/sparse-distance
    signals. The heatmap/selector selected TVT is used only as confidence and
    disagreement features, never as direct replacement, blend, postprocess, or
    hard gate.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_hmp184_selector_addonly_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_exp145_full_train_ml_features_exp184_oof_selector_path_and_exp182_heatmap_validation_features
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache covers the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check.
    - Exp184 selected-path features are read from the exp184 OOF best Viterbi selected path only; true_tvt, abs_error, oracle_candidate, and oracle_label columns are explicitly excluded.
    - Exp182 heatmap validation predictions are read only through predicted topK TVT, predicted scores, prior geometry, and sparse sample location columns; true TVT, abs_error, within10, target_in_grid, best_mode, and oracle-derived columns are forbidden.
    - Exp184 selected TVT is used only as confidence/path surface features and never as final replacement, blend, postprocess, or hard gate.
    - Exp184 Viterbi hyperparameter choice is a train-side selected upstream artifact; submit requires a later raw-test/current-test compatible heatmap feature generation and schema parity check in this same experiment.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


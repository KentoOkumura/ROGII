experiment:
  name: exp284_prefix_masked_wrong_mode_branch_recovery_backtest
  description: >-
    Mask the last 640 known-prefix rows, inject one GR-supported alternative
    offset mode, retain the safe base and fixed self-GR top-3 branches, and
    audit fixed-horizon evidence-based recovery without changing a decoder.
  route: pf_beam
  status: train_side_backtest_completed_guard_failed_branch_closed
  created_at: "2026-07-19"
  updated_at: "2026-07-19"

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.group_column
    - validation.score_rows

lineage:
  parent: exp283_self_gr_topk_alternative_mode_branch_future_evidence_readout
  geometry_reference: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  emission_reference: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  shift_bank_reference: exp280_exp226_shift_likelihood_separability_readout
  diff_summary: >-
    Converts the exp283 proposal/evidence readout into a controlled known-prefix
    masked backtest. A wrong GR-supported offset mode is injected at a visible
    cut, while the safe base is always retained. Recovery and false switches are
    scored only after all target-free branch and evidence tables are frozen.

dependency:
  scientific_execution_requires:
    experiment: exp283_self_gr_topk_alternative_mode_branch_future_evidence_readout
    condition: all_technical_proposal_and_verifier_scientific_guards_pass
  implementation_dependency: none_selfcontained_fixed_contract_reimplementation
  current_status: user_authorized_independent_execution
  gate_override:
    authorized: true
    authorized_at: "2026-07-19T15:51:36+09:00"
    source: user_message_execute_after_independence_clarification
    scope: one_fixed_contract_kaggle_cpu_v1_run
    interpretation: exp284_controlled_backtest_stands_alone_and_does_not_assert_exp283_pass

validation:
  strategy: fixed_prefix_masked_wrong_mode_branch_recovery_backtest
  metric: h256_recovery_rmse_and_false_switch
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: masked_known_prefix_rows_after_fixed_event
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  guards:
    minimum_eligible_wells: 100
    required_mask_identity_coverage: 1.0
    required_branch_finite_coverage: 1.0
    required_evidence_finite_coverage: 1.0
    required_post_cut_truth_access_before_freeze: 0
    required_minimum_injected_abs_shift_ft: 10.0
    minimum_safe_wrong_auc_each_fold: 0.60
    minimum_safe_choice_accuracy_pooled: 0.60
    minimum_safe_choice_accuracy_each_fold_exclusive: 0.50
    minimum_full_gain_vs_wrong_h256_ft: 0.10
    minimum_full_gain_vs_wrong_folds: 5
    minimum_full_gain_vs_pair_h256_ft: 0.02
    minimum_full_gain_vs_pair_folds: 3
    require_h512_gain_not_below_h256: true
    maximum_no_injection_false_switch_rate: 0.05
    minimum_real_vs_shuffled_nonregressing_folds: 5
  leakage_policy:
    - TVT_input rows after the pseudo cut are masked before any generator receives the frame.
    - Raw true TVT after the cut is unavailable until mask, injection, proposal, and evidence tables are frozen and hashed.
    - The wrong shift is selected from visible pre-cut rows and a fixed shift bank without post-cut truth.
    - The proposal ends at the event and future evidence starts on the following row.
    - Truth-best branch and recovery labels are post-freeze readouts only.
    - Cut, mask length, shift bank, K, horizons, likelihood, veto, and guards cannot be tuned on the same backtest truth.


pseudo_mask:
  masked_rows: 640
  minimum_visible_rows_before_cut: 512
  cut_policy: last_contiguous_known_row_minus_640
  observation_rows_after_cut: 128
  event_row_offset_from_cut: 128
  primary_future_rows: 256
  diagnostic_future_rows: [128, 512]
  cuts_per_well: 1

wrong_mode_injection:
  score_rows_before_cut: 128
  shift_bank_ft: [-80.0, -40.0, -20.0, -10.0, -5.0, -2.0, 0.0, 2.0, 5.0, 10.0, 20.0, 40.0, 80.0]
  minimum_abs_shift_ft: 10.0
  mode_policy: highest_likelihood_eligible_local_maximum_else_highest_eligible
  tie_policy: shift_bank_order
  path_policy: safe_base_plus_constant_selected_shift
  reference_path_on_visible_score_rows: observed_visible_tvt_input
  emission: exp209_gaussian_raw_gr_typewell

geometry_replay:
  mode: exp226_fold_safe_donor_field_saved_kappa_at_pseudo_cut
  source_truth_policy: other_fold_wells_only
  target_truth_policy: never_read_before_all_target_free_tables_frozen
  params:
    theta0: 118.4
    k_segments: 16
    local_linear_k: 50
    local_linear_bandwidth: 500.0
    local_linear_ridge: 1.0
    smooth_rho: 10.0
    gate: 0.35
    field_min_proj: 0.3
    kbins: [0.0, 750.0, 1500.0, 2500.0, 4000.0, 1.0e18]
    rot_max_deg: 60.0
    ancc_theta_bandwidth: 1500.0

self_gr_proposal:
  rolling_mean_rows: 5
  rolling_direction: causal_trailing
  trailing_window_rows: [17, 31, 51]
  primary_window_rows: 51
  donor_stride_rows: 3
  minimum_prediction_donor_gap_rows: 256
  donor_sources: [known_prefix, earlier_prediction_zone]
  orientations: [forward, reverse]
  donor_center_dedup_rows: 25
  anchor_dedup_ft: 2.0
  multiscale_agreement: auxiliary_best_same_orientation_within_dedup_rows
  tie_policy: ncc51_desc_multiscale_desc_known_prefix_forward_donor_row_asc
  shuffled_assignment: stable_per_event_source_bank_permutation

branches:
  safe_base: visible_cut_tvt_plus_exp226_tvt_geop_increment
  wrong_active: safe_base_plus_selected_shift
  self_gr_contract: exp283_fixed_top3_h256
  max_self_gr_alternatives: 3
  always_keep_safe_base: true
  policies:
    - wrong_active_only
    - safe_base_plus_wrong
    - safe_base_plus_wrong_plus_selfgr_top3
    - safe_base_plus_wrong_plus_shuffled_selfgr_top3
    - no_injection_base_plus_selfgr_top3

evidence:

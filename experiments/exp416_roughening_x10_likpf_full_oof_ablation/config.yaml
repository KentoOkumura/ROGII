model:
  name: exp072_likelihood_pf_roughening_x10_single_ablation
  estimator: likelihood_weighted_particle_filter
  fitted_model: false
  active_variants:
    - roughening_x10
  replay:
    split_key: train
    observation_likelihood: raw_gr_gaussian_exp072
    transition: classic_exp072_surface_state
    seed_aggregation: arithmetic_mean
  pf:
    particles: 500
    seeds: 128
    seed_indices: [0, 127]
    typewell_grid_step_ft: 0.2
    initial_position_spread_ft: 4.5
    initial_rate_spread: 0.01
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    control_rough_position: 0.10
    control_rough_rate: 0.001
    candidate_rough_position: 1.00
    candidate_rough_rate: 0.010
    roughening_multiplier: 10.0
    resample_threshold_fraction: 0.5
    resampling: systematic
    emission: capped_gaussian
    emission_clip_z2: 600.0
    gr_sigma_clip: [10.0, 60.0]
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32

guards:
  technical:
    require_all_input_sha_matches: true
    require_expected_rows: 3783989
    require_expected_wells: 773
    require_expected_folds: [0, 1, 2, 3, 4]
    require_id_row_order_fold_identity: true
    require_all_wells_completed_without_fallback: true
    require_finite_candidate_coverage: 1.0
    require_saved_control_rmse_parity_atol_ft: 0.00001
    require_exp209_control_row_parity_atol_ft: 0.00001
    require_seed_policy_parity_with_exp072: true
    require_only_roughening_parameter_diff: true
    require_candidate_roughening_ratio: 10.0
    roughening_ratio_absolute_tolerance: 1.0e-12
    maximum_truth_error_fold_hidden_reads_before_candidate_freeze: 0
    require_execution_count_match: true
  scientific:
    minimum_direct_rmse_gain_vs_exp072_ft: 0.05
    minimum_improved_folds: 4
    minimum_raw_gr_observed_gain_ft: 0.05
    maximum_raw_gr_missing_regression_ft: 0.0
    maximum_long_tail_1000_plus_regression_ft: 0.0
    maximum_hidden_like_spatial_regression_ft: 0.0
    maximum_hidden_like_typewell_purged_regression_ft: 0.0
    maximum_by_well_delta_p95_ft: 0.0
    maximum_worst_well_regression_ft: 0.25
    minimum_persistent_offset_sse_reduction_fraction: 0.05
    require_all_checks: true
  decision:
    pass_action: eligible_for_separate_fail_closed_inference_implementation_design
    fail_action: roughening_x10_rejected_close_without_rescue
  forbidden:
    - roughening_multiplier_search
    - separate_position_or_rate_roughening_ablation
    - process_noise_or_ess_threshold_change
    - particle_or_seed_count_change
    - gr_sigma_or_initial_spread_change
    - seed_aggregation_change
    - target_late_well_or_row_gate
    - parent_pf_control_rerun
    - same_oof_rescue
    - inference_or_submission_without_separate_approval


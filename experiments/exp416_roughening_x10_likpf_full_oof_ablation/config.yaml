experiment:
  name: exp416_roughening_x10_likpf_full_oof_ablation
  description: >-
    Design-frozen one-factor full-OOF likelihood-PF ablation that keeps the
    exp072 500-particle x 128-seed kernel unchanged except for multiplying both
    resampling roughening noises by 10.
  hypothesis: >-
    The exp410 target-late improvement from roughening x10 generalizes across
    all 773 train wells because additional post-resampling diversity preserves
    or recaptures the correct particle basin without introducing unacceptable
    fold, hidden-like, or well-tail regressions.
  route: pf_beam
  status: train_side_roughening_x10_full_oof_gate_failed_closed
  created_at: "2026-07-27"
  updated_at: "2026-07-28"
  inference_enabled: false

lineage:
  parent: exp072_exp063_full_replay_feature_cache
  evidence:
    - exp410_likpf_particle_resampling_basin_audit
  references:
    - exp243_pf_seed_medoids
    - exp400_all_well_1p3_sigma_gr_likelihood_pf
    - exp404_scale5_sigma_gr_likelihood_pf_ablation
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
  steering: ../../docs/legacy/steering/20260727-exp416-roughening-x10-likpf-full-oof-ablation
  diff_summary: >-
    Rerun only one treatment on all 773 train wells: exp072 resampling position
    roughening 0.10 -> 1.00 ft and rate roughening 0.001 -> 0.010. Reuse the
    saved exp072 likpf_mean as the control with zero control PF reruns. Keep GR
    scale, initialization, transition noise, ESS threshold, systematic
    resampling, particle/seed counts, stable seeds, and arithmetic seed
    aggregation unchanged. This experiment does not test seed aggregation.


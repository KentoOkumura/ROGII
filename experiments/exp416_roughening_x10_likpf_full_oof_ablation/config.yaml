validation:
  strategy: full_train_single_treatment_exp072_roughening_x10_ablation
  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  primary_control: exp072_likpf_mean
  primary_candidate: likpf_roughening_x10_mean
  gain_definition: rmse_control_minus_rmse_candidate
  saved_control_rmse_ft: 11.594897672217703
  truth_attachment: after_candidate_prediction_and_logical_content_sha_freeze
  leakage_policy:
    - PF generation may read horizontal MD, Z, GR, TVT_input, and the paired Type Well but not horizontal suffix TVT.
    - Candidate IDs, prediction bytes, logical SHA, and resource ledger are frozen before suffix truth, error, fold, or hidden-like role is read.
    - exp226 supplies only well, row, suffix-offset, and reporting-fold identity.
    - exp115 supplies only fixed hidden-like role identity after prediction freeze.
    - exp410 sentinel membership, cause, episode, error, or oracle information is never an input or activation gate.


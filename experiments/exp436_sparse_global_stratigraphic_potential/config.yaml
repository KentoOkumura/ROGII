  control:
    experiment: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    regenerate: false
    cv_rmse_ft: 9.427109596582213
    public_lb: 9.837
    oof_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
  secondary_report_only:
    experiment: exp263_last_anchor_better_candidate_confidence_pair_cache
    cv_rmse_ft: 8.238331
    promotion_or_weight_selection_use: forbidden
  report_scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Outer-valid wells are absent from every contact, node, edge, and surface solve.
    - Outer-valid known TVT_input is used only for the hard anchor and frozen prefix rolling-origin audit.
    - Outer-valid suffix TVT and raw formation columns are read only after surface, query, support, and prediction SHA freeze.
    - Target and test raw formation columns and GR are never read by the candidate.
    - The visible three-well sample test cannot select formation, graph, solver, support, aggregation, gate, or promotion settings.


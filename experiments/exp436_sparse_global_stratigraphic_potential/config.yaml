contact_observations:
  source_scope: outer_train_only
  formation_order: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
  equation: Z_minus_formation_surface_equals_zero
  selection: first_crossing_in_increasing_md
  exact_zero_precedes_sign_change: true
  interpolation: linear_between_adjacent_rows_for_MD_X_Y_Z_TVT
  value_formula: U_contact=TVT_contact+Z_contact
  maximum_observations_per_well_formation: 1
  multiple_crossing_oracle_selection: forbidden
  posthoc_order_repair: forbidden

field:
  family: deterministic_sparse_global_formation_potential
  physical_assumption: six_smooth_stratigraphic_potentials_without_faults
  surfaces_per_fold: 6
  total_surface_fits: 30
  node:
    stable_key: [fold, formation_order, well_id, contact_md]
    value_formula: U_contact=TVT_contact+Z_contact
    minimum_source_wells_per_formation: 32
  graph_edges:
    scope: within_same_formation_only
    nearest_unique_wells: 8
    maximum_nodes_per_source_well: 1
    maximum_distance_ft: 4000.0
    kernel_bandwidth_ft: 1000.0
    weight_formula: exp(-distance_xy^2/(2*1000^2))
    directed_to_undirected: stable_union
    cross_formation_edges: forbidden
  objective:
    observation_loss: huber
    huber_delta: 1.345
    irls_updates: 5
    scale: outer_train_formation_U_MAD_floor_1e-6
    graph_smoothness_weight: 1.0
    graph_laplacian_bending_weight: 0.05
    ridge_weight: 1.0e-8
  solver:
    name: scipy_sparse_lsqr
    atol: 1.0e-6
    btol: 1.0e-6
    iteration_limit: 2000
    accepted_istop: [1, 2]
    worker_count: 1
    blas_thread_count: 1

query:
  control_md_stride_ft: 64.0
  include_last_known_and_suffix_end: true
  maximum_unique_source_wells_per_formation: 16
  minimum_unique_source_wells_per_formation: 8
  maximum_distance_ft: 4000.0
  query_chunk_rows: 4096
  bandwidth_rule: farthest_selected_unique_well_distance
  bandwidth_clip_ft: [500.0, 4000.0]
  interpolation: normalized_gaussian_weighted_mean_then_linear_in_md
  local_plane_or_query_solve: forbidden
  formation_support:
    selection_time: last_known_anchor_before_truth_join
    require_support_at_all_control_points: true
    minimum_fixed_formations_per_well: 4
    fixed_for_entire_suffix: true
    rowwise_switch_or_drop: forbidden
  prediction:
    anchor: exact_last_finite_TVT_input
    per_formation_delta_formula: U_k_query-U_k_anchor
    primary_delta_formula: equal_weight_mean_over_fixed_supported_formations
    TVT_formula: TVT_anchor+mean_delta_U_k-(Z_query-Z_anchor)
    single_formation_paths: report_only_not_for_selection
    unsupported_fallback: forbidden_fail_entire_candidate


experiment:
  name: exp436_sparse_global_stratigraphic_potential
  description: >-
    Fit six fold-safe sparse global stratigraphic potentials U_k(X,Y) from
    outer-train formation contacts, then predict target suffixes from a fixed
    equal-weight mean of last-prefix-anchored potential differences.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-29"
  updated_at: "2026-07-29"

overrides:
  project_defaults:
    - validation.strategy
    - validation.score_rows

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  comparison_references:
    - exp263_last_anchor_better_candidate_confidence_pair_cache
    - exp273_two_dimensional_formation_gradient_transition
    - exp381_formation_contact_order_semimarkov_hmm
    - exp383_all_tvt_stratigraphic_vector_drift_field
  steering: ../../.steering/20260729-exp436-sparse-global-stratigraphic-potential
  diff_summary: >-
    Replace the incorrect single P(X,Y) design with six formation-specific
    U_k(X,Y) surfaces. Each surface is solved once per outer fold from
    outer-train first-contact U=TVT+Z observations. Target raw formation columns
    are never read. A fixed support set of anchored surface differences is
    averaged with equal weights; there is no row-wise formation selection,
    local surface fit, parent fallback, selector, or blend.


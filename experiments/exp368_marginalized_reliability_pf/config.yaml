experiment:
  name: "exp368_marginalized_reliability_pf"
  description: >-
    Run a zero-PF identifiability readout for a Rao-Blackwellized sticky
    normal/weak GR reliability state before any exp072 particle replay.
  hypothesis: >-
    A sticky weak-GR state can reduce exp072 observation overconfidence without
    sampling another particle axis, provided its predictive and bad-block
    identification signals transfer across folds and hidden-like scopes.
  route: pf_beam
  status: stage_0_failed_close_without_rescue
  created_at: "2026-07-23"
  updated_at: "2026-07-25"

implementation:
  enabled: true
  scope: stage0_train_side_reliability_readout
  stage_1_implemented: false
  train_notebook_state: canonical_adopted_from_compact_selfcontained
  canonical_notebook_adopted: true
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp072_exp063_full_replay_feature_cache
  steering: ../../docs/legacy/steering/20260723-exp368-marginalized-reliability-pf
  references:
    - exp232_adaptive_robust_likelihood_pf
    - exp233_adaptive_outlier_mixture_likelihood_pf
    - exp241_adaptive_likelihood_pf_trajectory_containment_audit
    - exp363_sticky_gr_reliability_exact_hmm
  diff_summary: >-
    Keep exp072 particle dynamics and counts fixed. Stage 0 first checks a
    normalized two-state Gaussian forward recursion on a final contiguous
    128-row known-prefix history and 64-row held-out segment, then freezes the
    same weak posterior on the saved exp072 likpf_mean path before suffix truth
    is attached. Stage 1 PF is deliberately not implemented.

validation:
  strategy: two_stage_reliability_predictive_readout_then_marginalized_pf
  metric: predictive_nll_and_bad10_auc
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  expected_wells: 773
  expected_rows: 3783989
  group_column: well_id
  score_rows: unknown_suffix_only
  truth_attachment: after_prefix_and_suffix_feature_content_sha_freeze
  stage_0:
    name: known_prefix_nll_and_saved_likpf_bad_block_readout
    pf_seed_well_runs: 0
    known_prefix:
      history_rows: 128
      heldout_rows: 64
      selection: final_contiguous_192_rows_with_finite_tvt_input
      gr_preprocessing: exp072_linear_interpolate_both_directions_then_typewell_mean
      sigma_fit_rows: exp072_full_known_prefix_with_missing_gr_filled_zero
      state_posterior: carry_history_posterior_into_heldout
      base_predictive_density: normalized_gaussian_sigma_1x
      marginalized_predictive_density: normalized_two_state_gaussian_sigma_1x_4x
      score: pooled_heldout_predictive_nll_gain_fraction
    suffix:
      block_rows: 512
      stride_rows: 256
      tail_policy: keep_short_tail_from_stride_starts
      posterior_score: row_weighted_mean_forward_filtered_weak_probability
      bad_block_label_after_freeze: exp072_likpf_block_rmse_greater_than_or_equal_10ft
      bad_block_rmse_ft: 10.0
      quartile_edges: [0.25, 0.75]
      fold_pass_definition: real_bad10_auc_strictly_greater_than_0p50
      hidden_like_policy: require_both_spatial_and_typewell_purged
      negative_control:
        kind: within_well_nonzero_circular_shift_of_block_weak_score
        key_prefix: exp368
        offset_formula: one_plus_sha256_well_prefix_mod_block_count_minus_one
        preserve_within_well_score_multiset: true
        single_block_well_policy: identity_and_report
    all_required:
      minimum_known_prefix_predictive_nll_gain_fraction: 0.01
      minimum_bad_block_auc: 0.60
      minimum_auc_gain_over_circular: 0.02
      minimum_passing_folds: 4
      minimum_hidden_like_auc: 0.55
      weak_posterior_mean_range: [0.02, 0.50]
  stage_1:
    enabled_only_after_stage_0_pass_and_separate_user_approval: true
    particles: 500
    seed_count: 128
    well_count: 773
    pf_seed_well_runs: 98944
    all_required:
      minimum_rmse_gain_vs_exp072_likpf_mean_ft: 0.05
      minimum_improved_folds: 4
      maximum_1000_plus_regression_ft: 0.02
      maximum_hidden_like_spatial_regression_ft: 0.02
      maximum_hidden_like_typewell_purged_regression_ft: 0.02
      maximum_by_well_p95_regression_ft: 0.02
      maximum_worst_well_regression_ft: 0.25


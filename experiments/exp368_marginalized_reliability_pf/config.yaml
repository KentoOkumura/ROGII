model:
  name: marginalized_sticky_gr_reliability_likelihood_pf
  estimator: none_stage0_then_stochastic_rao_blackwellized_likelihood_pf_if_promoted
  particle_state: [position, rate]
  marginalized_state: gr_reliability_probability
  path_emission:
    kind: normalized_gaussian_logpdf_with_squared_z_clip
    squared_z_clip: 600.0
    horizontal_gr_policy: exp072_linear_interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_drop_duplicate_then_linear_interp_endpoint_hold
    gr_sigma_min: 10.0
    gr_sigma_max: 60.0
    gr_sigma_default: 30.0
    suffix_sigma_source: exp072_full_known_prefix_residual_std
  gr_reliability:
    states: [normal, weak]
    transition_matrix:
      - [0.998046875, 0.001953125]
      - [0.0078125, 0.9921875]
    initial_probability: [0.8, 0.2]
    normal_sigma_multiplier: 1.0
    weak_sigma_multiplier: 4.0
    weak_mean: same_as_normal_predicted_gr
    update: exact_two_state_normalized_gaussian_forward_per_path
  fixed_from_exp072:
    particles: 500
    seed_count: 128
    seed_aggregation: mean
    momentum: 0.998
    velocity_noise: 0.002
    position_noise: 0.005
    resample_threshold: 0.5
    resample_position_noise: 0.10
    resample_velocity_noise: 0.001
  forbidden:
    - sampled_reliability_particles
    - uniform_outlier_component
    - adaptive_temperature_or_sigma
    - transition_or_sigma_multiplier_grid
    - rate_prediction_from_prefix_or_geometry
    - particle_or_seed_increase
    - blend_or_selector
    - parent_pf_control_replay


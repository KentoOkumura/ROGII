  parallel_rng_policy: single_worker_no_rng_stage0
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - Freeze known-prefix NLL rows and suffix weak posterior before attaching suffix truth.
    - The circular control uses a stable SHA256-derived nonzero block shift.
    - Stage 0 is deterministic and creates no prediction or submission anchor.
    - A future Stage 1 must use one local RNG stream per well and seed index.


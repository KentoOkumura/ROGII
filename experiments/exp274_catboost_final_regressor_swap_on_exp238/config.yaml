  - The public cb1 configuration is intentionally not trained.
  - Parent exp238 LightGBM OOF is mounted and read-only; no LightGBM control is retrained.
  - Reference inference is explicitly user-authorized despite raw guard failure; it does not change the rejection or permit competition submission.

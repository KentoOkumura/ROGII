experiment:
  name: exp274_catboost_final_regressor_swap_on_exp238
  description: Replace only the exp238 final TVT LightGBM regressor with one public-notebook CatBoost configuration.
  route: ml_model
  status: reference_inference_completed_submission_scored_train_guard_failed
  created_at: '2026-07-17'

lineage:
  parent: exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218
  feature_parent: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  selector_parent: exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218
  public_notebook_source: pixiux/rogii-dual-pipeline-blend
  diff_summary: Keep the exp238 outer folds, residual target, 380 base features, and 35 nested selector rank-slot features fixed; replace only the final LightGBM family with public CatBoost cb0.

data:
  selector_artifact_dir_local: experiments/exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218/artifacts
  parent_final_oof_local: experiments/exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218/artifacts/exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218_final_oof_predictions.csv.gz
  hidden_like_assignment_local: experiments/exp237_hmm_exp226_candidate_selector_on_exp183/inputs/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
  public_notebook_local: docs/notebooks/rogii-wellbore-geology-prediction/score_ascending_20260611/pixiux__rogii-dual-pipeline-blend/rogii-dual-pipeline-blend.ipynb

validation:
  strategy: exp238_saved_outer5_fold_roles_grouped_by_well
  group_column: well
  metric: rmse
  seed: 42
  outer_folds: 5
  parent_primary_model: lgb_mean
  surfaces:
    distance_bins: [-.inf, 50, 100, 250, 500, 1000, .inf]
    distance_labels: ['000_050', '050_100', '100_250', '250_500', '500_1000', '1000_plus']
    hidden_like: [verification_like_spatial, verification_like_typewell_purged]

model:
  name: exp238_final_catboost_cb0
  active_variants: [catboost_public_cb0]
  parent_control_retraining: false
  selector_retraining: false
  active_variant_count: 1
  catboost_config_count: 1
  folds: 5
  total_new_models: 5
  max_iterations_per_model: 8000
  maximum_total_iterations: 40000
  expected_base_feature_count: 380
  expected_selector_feature_count: 35
  expected_final_feature_count: 415
  target: residual_from_last_known_tvt
  public_source:
    notebook: pixiux/rogii-dual-pipeline-blend
    local_path: docs/notebooks/rogii-wellbore-geology-prediction/score_ascending_20260611/pixiux__rogii-dual-pipeline-blend/rogii-dual-pipeline-blend.ipynb
    sha256: 9f80687b9582b9b47a464613433afabe74274565252a2e235c152456a0d828e8
    extracted_config_reference: experiments/exp098_selector_rank_slot_features_on_exp073/public_notebook_replay_audit.py
    extracted_config_sha256: c46da772d09595cb3ff6d1c7f04233f0522fd672a2d83f70808b8f7e0e117a60
    selected_config: cb0
    unselected_public_configs: [cb1]
  catboost:
    source_exact_params:
      iterations: 8000
      depth: 7
      l2_leaf_reg: 2.0
      min_data_in_leaf: 15
      border_count: 254
      loss_function: RMSE
      task_type: GPU
      od_type: Iter
      od_wait: 300
      verbose: 0
      learning_rate: 0.02
      random_seed: 7
    source_exact_fit_params:
      early_stopping_rounds: 250
      use_best_model: true
    runtime_only_params:
      devices: '0'
      allow_writing_files: false
  blend_readout:
    enabled: true
    catboost_weight: 0.25
    tune_weight: false
  adoption_guards:
    require_raw_overall_improvement: true
    require_1000_plus_non_worse: true
    require_hidden_like_spatial_non_worse: true
    require_hidden_like_typewell_purged_non_worse: true
    max_worst_well_regression: 0.25
    min_improved_folds: 3
  forbidden:
    - parent_lightgbm_retraining
    - selector_retraining
    - selector_catboost_swap
    - categorical_feature_addition
    - catboost_parameter_grid
    - blend_weight_grid
    - adoption_inference_before_all_raw_guards_pass
    - adoption_submission_when_raw_guards_fail


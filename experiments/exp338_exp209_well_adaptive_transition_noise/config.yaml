model:
  name: exp209_well_adaptive_sig_r_exact_hmm
  estimator: none
  target: TVT
  active_variants: [robust_prefix_rate_diffusion_on_exp209]
  transition_scale:
    state_coordinate: U_equals_TVT_input_plus_Z
    rate: delta_U_div_delta_MD
    innovation: adjacent_rate_difference_div_sqrt_mean_delta_MD
    raw_scale: 1.4826_times_mad_about_median
    minimum_innovations: 20
    fallback_sig_r: 0.002
    shrinkage_pseudocount: 100.0
    shrinkage_alpha: n_div_n_plus_100
    shrinkage_space: log
    raw_scale_floor: 1.0e-6
    clip: [0.001, 0.004]
  fixed_exp209_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    emission: gaussian
    emission_clip_z2: 600.0
    sigma_mode: std
    sigma_known_gr_policy: fill_missing_with_zero_before_population_std
    sigma_clip: [10.0, 60.0]
    affine_a: 1.0
    affine_b: 0.0
    missing_gr_weight: none_exact_weight_1
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp
    effective_position_sigma_floor: 0.1225
    output: posterior_mean
  forbidden:
    - finite_only_sigma_gr
    - robust_or_mad_sigma_gr
    - missing_gr_downweight
    - gr_affine_calibration
    - row_or_segment_varying_sig_r
    - time_varying_rate_prior_mean
    - changing_sig_p_momentum_grid_or_blend
    - posthoc_sig_r_grid_or_threshold_rescue


experiment:
  name: exp338_exp209_well_adaptive_transition_noise
  description: >-
    Exact-HMM audit that changed only exp209 well-level rate diffusion sig_r.
    Version 3 completed 773 HMM runs, but every well mapped to the upper sig_r
    clip and direct RMSE regressed by 2.124061 ft with 0/5 folds improved, so
    the branch closed without rescue, inference, submission, or successors.
  route: pf_beam
  status: train_side_adaptive_sig_r_gate_failed_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-23"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260722-exp338-exp209-well-adaptive-transition-noise
  formula_reference: exp309_well_adaptive_transition_noise
  evidence:
    - exp307_finite_only_robust_sigma_gr
    - exp268_multi_scale_initial_rate_candidates
    - exp273_two_dimensional_formation_gradient_transition
  diff_summary: >-
    Changes only exp209 fixed sig_r=0.002 to one deterministic well-specific
    value estimated from robust known-prefix U-rate innovations. Exp209
    zero-fill standard-deviation sigma_GR, GR preprocessing, Gaussian
    emission, state grid, sig_p, momentum, priors, and posterior mean remain
    fixed. No exp307 finite-only scale or exp308 missing-GR confidence is used.


    - exp226_w500_50_50
  safe_candidate: exp226_w500_50_50
  regenerate_candidates: false
  persist_selected_row_prediction: false

audit:
  name: prefix_calibrated_latent_registration_gr_evidence
  output_prefix: exp297_prefix_calibrated_latent_registration_gr_evidence
  block_partition:
    source: exp293_frozen_nonoverlap_assignment
    horizons_rows: [128, 256, 512]
    include_final_short_block: true
  prefix_calibration:
    maximum_rows: 512
    minimum_pairs: 64
    huber_delta: 1.345
    irls_iterations: 2
    minimum_typewell_gr_std: 5.0
    slope_clip: [0.25, 4.0]
    maximum_prefix_rmse: 60.0
    invalid_policy: unreliable_safe
  residual_component:
    distribution: student_t
    degrees_of_freedom: 4.0
    scale: 1p4826_times_prefix_residual_mad
    scale_clip: [10.0, 60.0]
  derivative_component:
    formula: slope_times_typewell_gradient_at_registered_candidate_midpoint_times_candidate_tvt_delta
    score: negative_mean_absolute_residual_over_prefix_derivative_scale
    scale_clip: [1.0, 30.0]
    minimum_median_absolute_forward_delta_gr_per_row: 0.25
  ncc_component:
    formula: pearson_on_state_specific_common_finite_rows
  block_coverage:
    minimum_pairs: 64
    minimum_fraction: 0.50
  registration:
    query_formula: candidate_tvt_plus_delta
    minimum_ft: -20.0
    maximum_ft: 20.0
    step_ft: 2.0
    expected_states: 21
    prior: laplace
    prior_scale_ft: 10.0
    extrapolation: disabled
  composite:
    normalization_scope: one_block_control_component_over_12x21_states
    zscore: median_1p4826mad
    zero_mad_threshold: 0.000000001
    zscore_clip: [-5.0, 5.0]
    weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
  reliability:
    reliable_prior: 0.9
    unreliable_prior: 0.1
    outlier_log_likelihood: 0.0
    outlier_candidate: exp226_w500_50_50
  shuffled_control:
    kind: stable_within_well_finite_value_circular_rotation_preserve_nan_mask
    seed: 42
    minimum_rotation_rows: 32
    minimum_rotation_fraction: 0.25
    same_rotation_all_horizons: true
  truth_readout:
    expected_sse_formula: sum_candidate_probability_times_candidate_block_sse
    recovery_formula: anchor_minus_expected_over_anchor_minus_oracle
    primary_horizon_rows: 256
    subgroup_horizon_rows: 256
    persist_truth_joined_candidate_rows: false
  forbidden_actions:
    - add_remove_or_regenerate_candidate
    - tune_registration_grid
    - tune_affine_scale_component_weight_or_prior
    - hard_top1_or_rowwise_switch
    - candidate_tvt_average_or_posterior_mean_tvt
    - add_registration_offset_to_tvt
    - selector_or_model_fit
    - persist_selected_or_corrected_row_prediction
    - raw_test_inference
    - submission
  expected_artifacts:
    - exp297_prefix_calibrated_latent_registration_gr_evidence_contract.json
    - exp297_prefix_calibrated_latent_registration_gr_evidence_input_manifest.csv
    - exp297_prefix_calibrated_latent_registration_gr_evidence_calibration.csv
    - exp297_prefix_calibrated_latent_registration_gr_evidence_block_index.csv.gz
    - exp297_prefix_calibrated_latent_registration_gr_evidence_joint_reliable_posterior.npy
    - exp297_prefix_calibrated_latent_registration_gr_evidence_candidate_posterior.parquet
    - exp297_prefix_calibrated_latent_registration_gr_evidence_registration_posterior.parquet
    - exp297_prefix_calibrated_latent_registration_gr_evidence_block_summary.csv.gz
    - exp297_prefix_calibrated_latent_registration_gr_evidence_readout_metrics.csv
    - exp297_prefix_calibrated_latent_registration_gr_evidence_subgroup_metrics.csv
    - exp297_prefix_calibrated_latent_registration_gr_evidence_sha_manifest.csv
    - exp297_prefix_calibrated_latent_registration_gr_evidence_summary.json


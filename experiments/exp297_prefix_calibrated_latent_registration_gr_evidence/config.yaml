experiment:
  name: exp297_prefix_calibrated_latent_registration_gr_evidence
  description: >-
    Keeps the exp293 deployable12 paths fixed and audits whether prefix-calibrated
    Type Well/horizontal GR latent-registration evidence assigns probability mass
    to low-SSE candidates at H128/H256/H512 without producing a TVT prediction.
  route: pf_beam
  status: completed_fail_stop_no_stage4
  created_at: "2026-07-19"
  inference_enabled: false

overrides:
  project_defaults: [validation.metric]

lineage:
  parent: exp293_physics_only_candidate_bank_headroom_contract
  references:
    - exp292_typewell_gr_warp_rate_identifiability_audit
    - exp115_hidden_like_spatial_holdout_from_ppt
    - experiments/exp293_physics_only_candidate_bank_headroom_contract/downstream_branch_contract.md
    - docs/06_reproducibility.md
    - backlog/KAGGLE_DIRECTION.md prefix_calibrated_latent_registration_gr_evidence
  design_source: docs/legacy/steering/20260719-exp297-prefix-calibrated-latent-registration-gr-evidence
  diff_summary: >-
    Adds only target-free GR calibration, 21-state observation registration,
    reliable/unreliable posterior evidence, circular-shuffle control, and
    expected-candidate-SSE readout on the frozen exp293 bank. Candidate paths,
    folds, block assignment, and physical TVT values remain unchanged.

validation:
  strategy: fixed_exp293_bank_latent_registration_gr_evidence_audit
  metric: h256_expected_candidate_sse_headroom_recovery
  seed: 42
  n_folds: 5
  trained_folds: 0
  group_column: well
  fold_policy: reuse_exp293_outer_fold_identity_without_refit
  expected_rows: 3783989
  expected_wells: 773
  horizons_rows: [128, 256, 512]
  primary_horizon_rows: 256
  continuity_horizon_rows: 512
  success_criteria:
    minimum_pooled_h256_recovery: 0.35
    require_positive_h256_recovery_folds: 5
    require_real_better_than_shuffle_pooled: true
    require_real_better_than_shuffle_folds: 5
    maximum_h512_recovery_drop_from_h256: 0.05
    require_1000_plus_anchor_nonregression: true
    require_hidden_like_spatial_anchor_nonregression: true
    require_hidden_like_typewell_purged_anchor_nonregression: true
    require_truth_access_before_freeze_zero: true


reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: stable_sha256_experiment_well_family_seed_index
  stochastic_components:
    - initial_particle_jitter
    - curvature_transition
    - rate_and_position_propagation
    - stratified_systematic_resampling
    - resampling_jitter
  parallel_rng_policy: per_well_seed_stream_independent_of_thread_schedule
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: true
  notes:
    - No global RNG; one local stream per experiment/well/family/seed index.
    - Raw train and raw test generation must be separate and content-SHA recorded.


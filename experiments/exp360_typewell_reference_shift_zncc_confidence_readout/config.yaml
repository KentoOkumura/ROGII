experiment:
  name: exp360_typewell_reference_shift_zncc_confidence_readout
  description: >-
    Design-frozen zero-booster OOF readout testing whether raw-finite Type Well
    reference-shift ZNCC predicts exp264 failure better than exp280 raw Gaussian
    shift likelihood, without changing any prediction.
  hypothesis: >-
    Centered and scale-invariant zero-versus-nonzero Type Well reference-shift
    ZNCC is a more stable target-free exp264 bad10 risk signal than absolute
    residual raw Gaussian likelihood.
  route: ensemble
  status: completed_stage_0_gate_failed_closed
  created_at: "2026-07-23"
  updated_at: "2026-07-23"

lineage:
  parent: exp340_exp226_depth_alias_block_confidence_readout_on_exp264
  steering: ../../.steering/20260723-exp360-typewell-reference-shift-zncc-confidence-readout
  references:
    - exp280_exp226_shift_likelihood_separability_readout
    - exp264_exp263_candidate_confidence_dual_selector
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp115_hidden_like_spatial_holdout_from_ppt
  diff_summary: >-
    Freezes the exp226 path, exp280 512-row blocks and 13 shifts, and exp264 late
    error readout; the only scientific change is replacing absolute-residual raw
    Gaussian likelihood with raw-finite centered scale-invariant ZNCC.

implementation:
  enabled: true
  scope: zero_booster_stage_0_readout
  train_notebook_state: compact_selfcontained
  canonical_notebook_replacement_authorized_by_request: true
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.score_rows

validation:
  strategy: frozen_target_free_zncc_block_confidence_then_late_error_attribution
  metric: block_rmse_and_row_weighted_bad10_auc
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_blocks: 7787
  expected_folds: [0, 1, 2, 3, 4]
  fold_source: exp226_group_safe_fold
  score_rows: nonoverlapping_512_row_blocks
  primary_unit: block
  auc_unit: row_weighted_block_score
  auc_label: exp264_row_abs_error_ge_10ft
  truth_alignment_atol_ft: 0.001
  truth_attachment: after_score_control_feature_quantile_and_manifest_sha_freeze
  report_scopes:
    - pooled
    - fold
    - distance_1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  descriptive_sentinel_wells:
    - 000d7d20
    - 8cc21f01
    - e5ff9fd2
    - 2ddad940
  sentinel_policy: descriptive_only_never_used_for_grid_threshold_family_or_gate_selection
  leakage_policy:
    - Horizontal safe loader exposes only MD, GR, and TVT_input before freeze.
    - Exp226 safe OOF loader exposes only well_id, row_idx, suffix_offset, fold, and tvt_geop before freeze.
    - Exp264 truth, prediction error, bad10 labels, and exp226 truth are late-join only.
    - Scores, controls, features, fold quantiles, manifests, and content SHAs freeze before late join.


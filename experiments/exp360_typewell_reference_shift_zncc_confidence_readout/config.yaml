model:
  name: typewell_reference_shift_zncc_confidence_readout
  estimator: none
  reference_shift_definition: expected_gr_equals_typewell_gr_at_tvt_geop_plus_delta
  horizontal_row_or_md_shift: false
  score:
    name: raw_finite_zncc
    horizontal_gr_imputation: none
    typewell_missing_gr_fill: forward_then_backward
    typewell_interpolation: linear_with_endpoint_hold
    minimum_finite_pairs: 32
    minimum_observed_std: 1.0e-6
    minimum_expected_std: 1.0e-6
    invalid_score: -1.0
    core_supported_requires_zero_valid: true
    core_supported_minimum_valid_candidates: 2
  tie_policy:
    priority: [higher_score, zero_shift, smaller_absolute_shift, negative_before_positive]
    exact_tie_order_ft: [0, -2, 2, -5, 5, -10, 10, -20, 20, -40, 40, -80, 80]
  target_free_families:
    primary:
      - best_nonzero_minus_zero_zncc
    supporting:
      - low_zero_shift_zncc
      - zero_shift_rank
      - absolute_top1_shift
      - top1_shift_jump_from_previous_block
      - three_block_sign_inconsistency
    secondary_non_gating:
      - best_zncc
      - top1_minus_top2_zncc
  family_contract:
    best_nonzero_minus_zero_zncc: maximum_valid_nonzero_zncc_minus_zero_shift_zncc
    low_zero_shift_zncc: negative_zero_shift_zncc
    zero_shift_rank: normalized_descending_rank_of_zero_among_valid_candidates
    absolute_top1_shift: absolute_tie_resolved_top1_shift_ft
    top1_shift_jump_from_previous_block: absolute_tie_resolved_shift_change_within_well
    three_block_sign_inconsistency: disagreement_share_among_nonzero_top1_signs_in_current_and_previous_two_supported_blocks
  controls:
    historical_raw_gaussian:
      source: exp280_saved_score_bank
      matched_block_shift_tie_and_feature_formulas: true
    stable_shift_label_permutation:
      key: sha256_of_well_id_block_index_and_fixed_namespace
      scope: within_each_well_block_over_frozen_13_scores
      preserves: [score_values, score_distribution]
      breaks: [zero_shift_identity, shift_sign, shift_magnitude]
      uses_global_rng: false
  attribution:
    quantiles: [0.25, 0.75]
    quantile_fit_scope: each_fold_target_free_supported_blocks_only
    primary_metric: q4_minus_q1_exp264_block_rmse
    primary_label: exp264_row_abs_error_ge_10ft
    secondary_label: exp226_beats_exp264_block_rmse_by_ge_0p25ft
  pass_requires_all_for_primary:
    minimum_core_supported_block_coverage: 0.98
    require_all_wells_have_supported_block: true
    minimum_q4_minus_q1_mean_rmse_ft: 0.50
    require_q4_minus_q1_median_positive: true
    minimum_positive_rmse_folds: 4
    minimum_pooled_bad10_auc: 0.60
    minimum_folds_bad10_auc_gt_half: 4
    require_distance_1000_plus_positive: true
    require_hidden_like_spatial_positive: true
    require_hidden_like_typewell_purged_positive: true
    minimum_pooled_auc_gain_vs_raw_gaussian: 0.02
    minimum_folds_better_than_raw_gaussian: 4
    minimum_pooled_auc_gain_vs_permutation: 0.02
    minimum_folds_better_than_permutation: 4
  fail_closed_policy:
    promotable_family: best_nonzero_minus_zero_zncc_only
    supporting_family_rescue: false
    posthoc_threshold_rescue: false
    sentinel_rescue: false
    pass_action: propose_separate_addonly_ml_feature_experiment_only
    fail_action: close_branch_without_rescue
  forbidden:
    - horizontal_row_or_md_shift
    - random_shift_prediction_augmentation
    - dense_shift_grid_after_sentinel_inspection
    - shift_bank_threshold_pair_count_or_std_retuning
    - prediction_or_candidate_change
    - hard_tvt_correction
    - selector_or_family_blend
    - model_training
    - inference
    - submission


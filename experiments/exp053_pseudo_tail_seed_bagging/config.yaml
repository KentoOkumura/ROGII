experiment:
  name: exp053_pseudo_tail_seed_bagging
  description: Audit seed and sampling bagging on the exp051 LightGBM capacity pseudo-tail residual model
  route: ml_model
  status: completed
  created_at: "2026-06-10"
  updated_at: "2026-06-10"

lineage:
  parent: exp051_pseudo_tail_lgbm_param_micro_tune
  diff_summary: Use the exp051 best LightGBM capacity pseudo-tail model as the base, then compare a single-seed control against a 3-member seed bag where both pseudo-tail row sampling and LightGBM random_state differ by member. Keep cutoffs, no-GR feature set, residual shrink, and fixed bucket-shrink postprocess unchanged.

validation:
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Existing raw comparison uses GroupKFold-by-well OOF predictions from exp013 only as a reference.
    - Pseudo cutoffs are generated only inside training-fold wells.
    - Held-out fold scoring uses only each well's original TVT_input NaN evaluation zone.
    - Train-only formation columns are not used.

data: {}

model:
  name: lgbm_pseudo_tail_seed_bagging_last_anchor_residual
  primary_strategy: drift_model
  drift_strategy: drift_model
  feature_set: no_gr_signal
  strategies:
    - last_anchor
    - recent_linear
    - drift_model
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: LGBMRegressor
    params:
      n_estimators: 800
      learning_rate: 0.03
      num_leaves: 47
      min_child_samples: 60
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 0.1
      n_jobs: 2
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800

audit:
  parent_micro_tune_experiment: exp051_pseudo_tail_lgbm_param_micro_tune
  parent_micro_tune_variant: lgbm_capacity_leaves47_minchild60_exp014_bucket_shrink_params
  parent_micro_tune_cv: 12.634392
  parent_capacity_inference_experiment: exp052_lgbm_capacity_pseudotail_inference_submit
  parent_capacity_public_lb: 12.076
  parent_train_experiment: exp023_pseudo_tail_distance_augmentation
  parent_postprocess_audit: exp025_pseudo_tail_postprocess_cv_audit
  parent_inference_experiment: exp026_pseudo_tail_bucket_shrink_inference_submit
  parent_best_variant: pseudo_tail_3_cutoffs_distance_balanced
  parent_raw_pseudo_tail_cv: 12.942938
  parent_bucket_shrink_cv: 12.870780
  parent_public_lb: 12.102
  raw_anchor_experiment: exp013_model_diversity_or_postprocess
  raw_anchor_variant: lightgbm_no_gr
  raw_clean_cv: 13.549257
  heldout_postprocess_cv: 13.535596
  weighted_clean_cv: 13.470015
  weighted_postprocess_cv: 13.415799
  raw_oof_path: data/external/kaggle-output/exp013_model_diversity_or_postprocess/train/artifacts/row_oof_predictions.csv
  raw_oof_variant: lightgbm_no_gr
  chunk_rows: 250000
  distance_buckets:
    - name: rows_0_49
      max_step: 49
    - name: rows_50_249
      max_step: 249
    - name: rows_250_999
      max_step: 999
    - name: rows_1000_2499
      max_step: 2499
    - name: rows_2500_plus
      max_step: 1000000000
  postprocess:
    exp014_heldout_bucket_shrink:
      - name: rows_0_49
        max_step: 49
        alpha: 0.20
      - name: rows_50_249
        max_step: 249
        alpha: 0.5917180252647632
      - name: rows_250_999
        max_step: 999
        alpha: 1.15
      - name: rows_1000_2499
        max_step: 2499
        alpha: 1.15
      - name: rows_2500_plus
        max_step: 1000000000
        alpha: 1.0490770312511664
  training_variants:
    enabled: true
    variants:
      - name: lgbm_capacity_single_seed_control
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
      - name: lgbm_capacity_seed_bag3
        kind: seed_bagging
        member_seeds: [42, 314, 2027]
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
  fixed_postprocess:
    exp014_bucket_shrink_params:
      - name: rows_0_49
        max_step: 49
        alpha: 0.20
      - name: rows_50_249
        max_step: 249
        alpha: 0.5917180252647632
      - name: rows_250_999
        max_step: 999
        alpha: 1.15
      - name: rows_1000_2499
        max_step: 2499
        alpha: 1.15
      - name: rows_2500_plus
        max_step: 1000000000
        alpha: 1.0490770312511664
  pseudo_tail:
    min_prefix_rows: 200
    min_pseudo_eval_rows: 250
    cutoff_strategy: quantile

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  kaggle:
    kernel_sources:
      - kentookumura/exp013-model-diversity-or-postprocess-train

notes:
  - This experiment writes no inference submission.
  - The estimator remains LGBMRegressor with exp051 best capacity params num_leaves=47 and min_child_samples=60.
  - Seed bagging varies both pseudo-tail sampling RNG and LightGBM random_state for each member, then averages raw valid predictions before fixed bucket-shrink.
  - Pseudo-tail rows are created only from train-fold wells; valid-fold predictions use the original TVT_input mask.
  - The primary comparison is 3-seed bagged fixed bucket-shrink CV versus exp051 best 12.634392 and same-run single-seed control.
  - Fixed bucket-shrink is evaluated with exp025-selected exp014 parameters, not refit on this OOF.

    prediction_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_predictions.csv.gz
    raw_file_sha_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_raw_file_sha.csv
    missing_well_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_missing_well_inventory.csv
    missing_run_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_missing_run_inventory.csv
    control_readout_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_control_missing_readout.csv
    group_metrics_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_group_metrics.csv
    by_well_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_by_well_metrics.csv
    divergence_segment_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_divergence_segments.csv

  output_prefix: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation
  max_wells: null
  focus_well: 11d0f5ac
  prediction_change_tolerance_ft: 1.0e-6
  fixed_control_parity_tolerance_ft: 1.0e-5
  stage1_guard:
    overall_delta_rmse_max_ft: -0.02
    raw_missing_delta_rmse_max_ft: 0.0
    observed_delta_rmse_max_ft: 0.02
    distance_1000_plus_delta_rmse_max_ft: 0.02
    hidden_like_delta_rmse_max_ft: 0.02
    worst_well_delta_rmse_max_ft: 0.25
    prediction_finite_coverage_min: 1.0
    std_finite_coverage_min: 1.0
    id_mismatch_max: 0
  distance_buckets:
    edges: [-1.0, 49.0, 99.0, 249.0, 499.0, 999.0, 1.0e30]
    labels: ["000_050", "050_100", "100_250", "250_500", "500_1000", "1000_plus"]
  missing_run_buckets:
    edges: [0, 4, 31, 127, 255, 999, 2147483647]
    labels: ["1_4", "5_31", "32_127", "128_255", "256_999", "1000_plus"]
  post_gap_buckets:
    edges: [0, 128, 256, 2147483647]
    labels: [post_gap_001_128, post_gap_129_256, post_gap_257_plus]
  hidden_like_roles:
    verification_like_spatial: verification_like_spatial_role
    verification_like_typewell_purged: verification_like_typewell_purged_role
  outputs:

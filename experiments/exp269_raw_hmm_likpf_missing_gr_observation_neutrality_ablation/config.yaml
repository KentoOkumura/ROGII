    generation_well_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_generation_by_well.csv
    summary_filename: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation_summary.json

runtime:
  use_amp: false
  outer_workers: 2
  numba_num_threads: 2
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp209-joint-exact-parity-train
      - kentookumura/exp205-exact-hmm-smoother-cache-audit-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_new_rng_raw_exact_hmm_missing_gr_neutrality_ablation
  stochastic_components: []
  parallel_rng_policy: sorted_wells_no_rng_thread_count_recorded
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: false
    prediction_sha: true
    model_manifest_sha: false
    submission_sha: false
  notes:
    - Stage 1 uses no RNG and is deterministic for fixed inputs, runtime versions, and thread settings.
    - It is not promoted to a submission anchor because this experiment has no inference or submission output.

pf_stage:
  enabled: false
  fail_close: true
  eligibility_source: stage1_guard
  requires_separate_user_approval: true
  notes:
    - No likelihood-PF code is executed by this implementation.
    - Passing Stage 1 records eligibility only and does not authorize Stage 2.

inference:
  enabled: false
  mode: train_side_stage1_only
  create_submission: false
  notes:
    - Positive train-side evidence does not authorize current-test inference, likelihood-PF, or submission.

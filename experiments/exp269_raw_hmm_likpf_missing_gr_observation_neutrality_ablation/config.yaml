experiment:
  name: exp269_raw_hmm_likpf_missing_gr_observation_neutrality_ablation
  description: >-
    Stage-1 raw exact-HMM ablation that makes raw horizontal-GR missing
    evaluation rows observation-neutral before deciding whether likelihood-PF
    deserves a separately approved Stage 2.
  route: pf_beam
  status: completed_stage1_guard_failed_pf_closed
  created_at: "2026-07-17"

overrides:
  project_defaults:
    - validation.n_folds
    - validation.strategy
    - validation.score_rows

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  artifact_ancestor: exp205_exact_hmm_smoother_exp072_compatible_cache_audit
  references:
    - exp247_missing_gr_masking
    - exp115_hidden_like_spatial_holdout_from_ppt
    - backlog/KAGGLE_DIRECTION.md raw_hmm_likpf_missing_gr_observation_neutrality_ablation
  implementation_source: exact_hmm_smoother.py
  diff_summary: >-
    Keeps the exp209 raw typewell-GR exact-HMM grid, transition, initialization,
    GR interpolation, sigma, and score rows fixed. The only prediction change is
    that evaluation rows whose raw horizontal GR is non-finite receive zero GR
    emission contribution. No self-GR descriptor or LightGBM unary is present.
    The saved exp209/exp205 prediction is loaded as the control and is not regenerated.

validation:
  strategy: train_side_fixed_control_raw_hmm_missing_gr_neutrality_ablation
  metric: rmse
  seed: 42
  n_folds: 0
  group_column: well
  score_rows: full_train_unknown_suffix_rows
  success_criteria:
    - Overall RMSE improves by at least 0.02 ft versus the fixed raw-HMM control.
    - Raw-GR missing rows do not regress and observed rows regress by at most 0.02 ft.
    - The 1000-plus distance group and both hidden-like groups regress by at most 0.02 ft.
    - Worst-well RMSE regression is at most 0.25 ft.
    - Prediction and posterior-standard-deviation finite coverage are 100 percent and ID mismatch is zero.
  leakage_policy:
    - The emission mask is exactly raw horizontal GR non-finiteness and never reads target, OOF error, focus-well role, hidden-like role, or oracle information.
    - Unknown-suffix train TVT is used only after prediction generation for paired metrics and row audit.
    - Visible test files are used only for GR missing-run distribution readout, not score evidence or model selection.
    - No self-GR, LightGBM unary, raw-test prediction, likelihood-PF execution, selector, or submission is produced.


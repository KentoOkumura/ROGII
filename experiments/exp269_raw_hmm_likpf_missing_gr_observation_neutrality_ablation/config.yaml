    - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv

model:
  name: raw_exact_hmm_missing_gr_observation_neutrality
  estimator: none
  target: TVT
  active_variants:
    - raw_hmm_missing_gr_neutral
  lightgbm_config_count: 0
  fold_training_count: 0
  booster_count: 0
  parent_control_retraining: false
  hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
  gr_missing:
    policy: raw_horizontal_gr_missing_rows_have_zero_gr_emission
    apply_to: evaluation_suffix_only
    missing_definition: not_finite_raw_horizontal_gr
    self_gr_unary: false
    lightgbm_unary: false
    run_length_gate: false
  notes:
    - Every active HMM parameter is copied from the exp209 raw exact-HMM control.
    - Interpolated GR is computed identically but its GR unary is discarded on raw-missing evaluation rows.


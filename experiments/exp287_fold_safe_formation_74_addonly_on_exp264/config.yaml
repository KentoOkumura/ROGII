reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_lightgbm_family_seeds_and_rng_free_fold_safe_formation_generation
  stochastic_components:
    - saved_exp264_nested_compact_feature_input
    - gpu_lightgbm_training
  parallel_rng_policy: >-
    Formation generation has no RNG; wells are sorted before joblib thread dispatch,
    each query uses workers=1, and outputs are realigned by immutable row id. LightGBM
    uses gpu_use_dp, deterministic, force_col_wise, n_jobs=8, and num_threads=8.
  feature_sha_policy: parquet_file_sha_plus_logical_float32_content_sha_per_fold_role
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: true
  notes:
    - The saved exp264 347-feature OOF SHA is fixed and its control boosters are not retrained.
    - Current-test feature generation is enabled only by the explicit 2026-07-20 inference override; the failed train guard remains recorded.
    - The inference run fits zero boosters, regenerates target features from raw test, and cannot call the competition submit API.

notes:
  - User approved Kaggle train v1 for 1 variant, 3 configs, 5 folds, and 15 GPU boosters on 2026-07-19; control retraining remains disabled.
  - The prior exp276-first preference was explicitly bypassed; exp276 PASS was never an implementation or train-push prerequisite.
  - Kaggle version 2 stopped before booster fitting because the config pinned invalidated Stage D v2 OOF SHA 7367983f... while the corrected Stage D v3 control is b11c5005...; the pin is corrected and rerun approval is required.
  - User explicitly approved version 3 on 2026-07-19 for the same 15-booster scope with zero control retraining.
  - Kaggle version 3 stopped before booster fitting because last_known_tvt was requested both as context and as one of the clean-273 model features, producing a duplicate projected column; the projection now deduplicates requested labels and rejects ambiguous source schemas.
  - User explicitly approved version 4 on 2026-07-19 for the same 15-booster scope with zero control retraining after the duplicate projection fix.
  - Version 4 approval is train-only; inference and submission remain outside the approved scope.
  - Kaggle version 4 stopped before booster fitting because eight wells lack complete six-formation plane rows and seven lack dense ANCC rows; the source exp072 replay skips those wells independently per imputer rather than rejecting the catalog.
  - User explicitly authorized the code fix and version 5 push on 2026-07-19 for the unchanged 15-booster scope with zero control retraining.
  - Kaggle version 5 completed 15/15 boosters. Pooled CV improved from 8.460811 to 8.136708 and every fold/scope improved, but worst-well delta was +8.228410 ft and +1/+3/+5 ft worsened-well counts all increased, so the fixed promotion guard failed.
  - The promotion guard remains failed and no rescue grid or guard relaxation is allowed.
  - On 2026-07-20 the user explicitly overrode only the inference prohibition; saved-model inference and submission-file generation are enabled, while external competition submission remains unauthorized.

experiment:
  name: exp287_fold_safe_formation_74_addonly_on_exp264
  description: >-
    Rebuild the 74 exp218 base-replay formation features inside each downstream
    outer fold, add them to the corrected exp264 clean-273 plus nested-compact-74
    surface, and compare one 421-feature variant with the saved corrected exp264
    347-feature OOF without retraining the parent control.
  route: ml_model
  status: inference_v1_complete_submit_check_pass_public_lb_7p530_train_guard_failed
  created_at: "2026-07-19"
  updated_at: "2026-07-20"

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  formation_source: exp072_exp063_full_replay_feature_cache
  downstream_surface_parent: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  diff_summary: >-
    Keeps corrected exp264 Stage C v6 nested compact features and the corrected
    Stage D v3 clean-273 surface fixed. Rebuilds only the audit-fixed 74
    base_replay formation features with FormationPlaneKNN and DenseANCCImputer
    fitted on outer-train wells. The saved exp264 347-feature OOF is the control;
    no control booster is retrained. PF/HMM/Beam-derived values remain auxiliary
    compact meta features, while the downstream LightGBM generates the final
    prediction, so the primary route is ml_model.

validation:
  strategy: corrected_exp264_outer5_groupfold_with_fold_local_formation_reference
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_current_test_wells_minimum: 1
  parent_exp264_rmse: 8.460811237612477
  parent_metric_tolerance: 1.0e-6
  scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - The historical full-train formation columns are dropped before any fold surface is built.
    - Each outer fold fits FormationPlaneKNN and DenseANCCImputer on outer-train wells only.
    - An outer-train target well is explicitly excluded from its own plane and dense reference query.
    - An outer-valid target well uses only the frozen outer-train reference.
    - Current-test generation is schema-audited to use all training wells as reference and never read target formation columns.
    - Target TVT and outer-valid formation values never enter reference fitting, feature pruning, or guard tuning.
    - Exact duplicate and Pearson/Spearman audits are reporting-only; no correlation-based pruning is allowed.


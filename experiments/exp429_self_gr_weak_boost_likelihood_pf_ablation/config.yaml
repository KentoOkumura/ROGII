experiment:
  name: "exp429_self_gr_weak_boost_likelihood_pf_ablation"
  description: >-
    Design-frozen one-factor likelihood-PF ablation that inserts the fixed
    exp223 self-GR boost-only surface directly into each particle observation
    log-likelihood while preserving the exp072 PF dynamics and x1.0 GR scale.
  hypothesis: >-
    The exp223 self-GR weak boost can improve the fixed temperature-5
    likelihood-PF prediction by changing particle weights, ESS, resampling, and
    trajectories inside the filter, even though separate self-GR candidates and
    post-hoc PF switches were negative.
  route: pf_beam
  status: completed_train_side_gate_failed_terminal_close
  created_at: "2026-07-28"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  kernel_control: exp072_exp063_full_replay_feature_cache
  self_gr_formula_parent: exp223_joint_typewell_self_gr_hmm_likelihood_probe
  exact_pf_implementation_reference: exp400_all_well_1p3_sigma_gr_likelihood_pf
  scale5_artifact_parent: exp404_scale5_sigma_gr_likelihood_pf_ablation
  diagnostic_references:
    - exp091_self_gr_likelihood_pf_beam_probe
    - exp128_trajectory_local_typewell_self_gr_switch_audit
    - exp410_likpf_particle_resampling_basin_audit
  steering: ../../docs/legacy/steering/20260728-exp429-self-gr-weak-boost-likelihood-pf-ablation
  diff_summary: >-
    Keep the exp072 x1.0 Type Well GR emission, transition, 500 particles,
    128 stable seeds, clamp, ESS resampling, roughening, and score rows fixed.
    Add only the exp223 boost-only alpha-0.07 clip-1.0 same-well visible-prefix
    self-GR surface to each particle observation log-likelihood. Use fixed
    temperature-5 seed aggregation as the sole primary and arithmetic mean as
    a preregistered secondary. This is not a self-GR candidate, post-hoc switch,
    blend, proposal, or transition change.


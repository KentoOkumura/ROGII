experiment:
  name: exp392_exp389_fixed13_dual_selector_on_exp264
  description: >-
    Adds the saved exp389 delta=1.345 Huber absolute-TVT exact-HMM train
    predictions as the thirteenth candidate to the corrected exp264
    candidate-long dual selector. Selector objectives, folds, sampling,
    raw-test-safe context, LightGBM settings, and the fixed fallback domain
    remain unchanged.
  route: ensemble
  status: completed_fixed13_selector_scientific_gate_failed_closed
  created_at: "2026-07-25"
  updated_at: "2026-07-25"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_parent: exp389_exp209_huber_exact_hmm_emission
  separate_novelty_experiment: not_required_user_selected_direct_selector_inclusion
  in_run_postfreeze_novelty_diagnostic: enabled_non_gating
  fixed_bank_source: exp263_last_anchor_better_candidate_confidence_pair_cache
  design_source: docs/legacy/steering/20260725-exp392-exp389-fixed13-dual-selector-on-exp264
  diff_summary: >-
    Changes only the candidate inventory from the corrected exp264 fixed12
    score bank to fixed12 plus huber_exact_hmm. The existing exact_hmm
    path and all formulas remain unchanged. Huber HMM is added only to
    the primary hard-select domain; the seven-candidate fixed fallback domain
    is unchanged. Exp389 is a target-free per-well candidate without a source
    fold; it is globally key-joined and repartitioned by the existing exp263
    selector fold. Gaussian/LikPF controls and gate diagnostics are excluded.
    No objective, selector fold, sample cap, LightGBM parameter, candidate
    weight, threshold, downstream TVT model, inference, or submission changes.

validation:
  strategy: outer5_groupkfold_fixed13_selector_then_inner4_nested_stacking
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_candidates: 13
  expected_primary_candidates: 12
  expected_fixed_fallback_candidates: 7
  expected_compact_features: 77
  fold_source: exp263_selector_outer_fold_after_global_exp389_key_join
  leakage_policy:
    - exp389 is read only through id, well_id, row_idx, Huber TVT, posterior std, and HMM log-likelihood.
    - No exp389 truth, error, control prediction, scope, or gate diagnostic is opened before feature freeze.
    - Exp389 is generated independently per well from known-prefix inputs and has no source fold.
    - Exp389 is globally joined by well_id,row_idx and repartitioned by exp263 selector outer_fold.
    - No source fold is synthesized or used as a selector feature.
    - Outer-valid wells are excluded from inner assignment, fit, and early stopping.
    - Outer-train compact rows use inner OOF scores only.
    - Outer-valid compact rows use the four inner-model ensemble only.
    - Parent exp264 scores are post-fit audit input and never selector features.
    - Add-one oracle headroom is computed only after selector score freeze and is diagnostic only.


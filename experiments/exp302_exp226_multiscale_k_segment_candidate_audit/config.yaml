    - exp226_k16__likpf_mean
    - selfgr_hmm_a070__likpf_mean
    - likpf_mean__exact_hmm
    - exp226_w500_50_50
  added_candidates_evaluated_separately: [exp226_k12, exp226_k24]
  added_candidate_dtype: float32_matching_exp293_bank
  objective: minimum_sum_squared_tvt_error
  block_origin: first_prediction_suffix_row_per_well
  block_horizons_rows: [128, 256, 512]
  primary_horizon_rows: 512
  tie_atol_squared_ft: 0.000000001
  tie_policy: frozen_bank_order_then_added_candidate
  persist_oracle_prediction: false


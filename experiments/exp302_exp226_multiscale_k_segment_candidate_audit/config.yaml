  formula_float_contract: match_exp263_stage1_float_operation_order
  formula_parity_max_abs_ft: 0.001

model:
  name: deterministic_exp226_multiscale_k_segment_variants
  estimator: deterministic_geometry_pf_beam_style
  params:
    variants:
      - name: exp226_k12
        k_segments: 12
      - name: exp226_k24
        k_segments: 24
    fixed_from_exp226:
      theta0: 118.4
      local_linear_k: 50
      local_linear_bandwidth: 500.0
      local_linear_ridge: 1.0
      smooth_rho: 10.0
      gate: 0.35
      field_min_proj: 0.3
      kbins: [0.0, 750.0, 1500.0, 2500.0, 4000.0, 1000000000000000000.0]
      kappa_regimes: [0.0, 1000.0, 1500.0, 2000.0]
      rot_max_deg: 60.0
      ancc_theta_bandwidth: 1500.0
      gr_grid_step: 0.5
      gr_window: 500
      gr_stride: 125
      gr_tau: 2.0
      gr_w_mse: 0.5
      gr_w_lvl: 0.1
      gr_sh_a: 1.1
      gr_sh_b: 0.12
      gr_sh_lo: 0.3
      gr_cap: 4.0
      gr_s0: 0.10
      gr_extent: 30.0
      enable_gr_correction: true
      enable_u_projection: true
      u_projection_deg: 4
      u_projection_beta: 0.75
      u_projection_iters: 4

candidate_novelty_audit:

experiment:
  name: exp302_exp226_multiscale_k_segment_candidate_audit
  description: >-
    Changes only the exp226 geometric segment count from the saved K=16
    control to K=12 and K=24, then audits direct OOF quality and add-one
    candidate novelty against the frozen exp293 deployable12 bank.
  route: pf_beam
  status: kaggle_cpu_v2_completed_direct_fail_candidate_novelty_pass
  created_at: "2026-07-20"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  comparisons:
    - exp293_physics_only_candidate_bank_headroom_contract
    - exp300_exp264_vs_exp274_well_selector_readout
  design_source: docs/legacy/steering/20260720-exp302-exp226-multiscale-k-segment-candidate-audit
  diff_summary: >-
    Reuse the saved exp226 K=16 OOF as control and change k_segments only.
    Generate K=12 and K=24 on the same five group-safe folds. All other
    geometry, kNN, kappa, GR-correction, and U-projection settings remain
    byte-for-byte equivalent to exp226. No HMM parameter is changed.

validation:
  strategy: fixed_exp226_group_safe_kfold_multiscale_k_addone_audit
  metric: rmse
  seed: 42
  n_folds: 5
  trained_folds: 0
  group_column: well_id
  fold_source: exp226_saved_oof_well_fold_identity
  fold_roles:
    evaluation: exp226_saved_oof_fold
    candidate_bank_provenance: exp263_outer_fold
    frozen_block_sha: exp263_outer_fold
  require_evaluation_and_bank_fold_equality: false
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  control_candidate: exp226_k16
  control_oof_rmse_ft: 9.42710967407494
  control_policy: reuse_saved_oof_without_regeneration
  report_scopes:
    - pooled
    - fold
    - distance_bucket
    - distance_1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - by_well_p50_p95_worst
  candidate_novelty_horizons_rows: [1, 128, 256, 512]
  primary_candidate_novelty_horizon_rows: 512
  include_whole_well_oracle: true
  include_final_short_block: true
  truth_join_policy: after_candidate_prediction_and_block_manifest_sha_freeze


experiment:
  name: exp494_exp413_cat_xgb_physics_bounded_stack
  description: >-
    exp413の保存済みLightGBMを固定アンカーとし、同じouter 5 folds、
    final 370特徴、last-known残差targetでCatBoostとXGBoostを各5本だけ学習する。
    保存物理候補exp226_w500_50_50を1本だけ加え、固定bound付きOOF-level
    cross-fit stackingを評価する設計凍結の最終提出候補実験。
  hypothesis: >-
    exp413の強い平均性能を最低60%維持しながら、学習器family差と
    target-free物理pathの誤差共分散を小さな非負weightで利用すれば、
    fixed scopeとwell-tailを悪化させずpooled RMSEを0.03 ft以上改善できる。
  route: ensemble
  status: train_guard_failed_reference_submission_scored_not_adopted
  created_at: "2026-07-30"

lineage:
  parent: exp413_scale5_likpf_full_replacement_on_exp335
  ml_negative_references:
    - exp274_catboost_final_regressor_swap_on_exp238
    - exp275_xgboost_final_regressor_swap_on_exp238
  physical_evidence:
    - exp263_last_anchor_better_candidate_confidence_pair_cache
    - exp434_physics_candidate_public_lb_audit
  public_notebook_references:
    - pixiux/rogii-dual-pipeline-blend
    - cdeotte/xgb-starter-cv-15
    - pilkwang/rogii-ridge-pf-blend-model-package-experiments
  steering: ../../.steering/20260730-exp494-exp413-cat-xgb-physics-bounded-stack
  diff_summary: >-
    exp413 Stage 0/C/S、outer fold、clean273 + nested74 + signed23のfinal370、
    residual target、保存15 LightGBMを固定する。CatBoost cb0とXGBoost
    Cdeotte v3を各1 config x 5 foldsだけ追加し、保存物理候補
    exp226_w500_50_50を含む4-family bounded stackを行う。selector、
    signed selector、LightGBM、PF/HMM/Beamは再学習せず、Public LBによる
    weight/candidate選択はしない。


reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: exp413_outer_fold_manifest_catboost_seed7_xgboost_seed42_and_stable_sha256_per_well_replay
  stochastic_components:
    - catboost_gpu_training
    - xgboost_gpu_hist_training
    - inherited_exp413_raw_test_pf_replay
  parallel_rng_policy: no_python_global_rng_family_internal_rng_only_and_exp413_stable_per_well_seed
  feature_sha_policy: float32_matrix_content_sha_per_fold_and_decompressed_content_sha_for_gzip
  gpu_note: GPU training is not assumed bitwise deterministic across reruns or runtime images.
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    blend_weight_sha: true
    submission_sha: true
  notes:
    - Independent rerun parity is required before treating exp494 as a deterministic anchor.
    - Kaggle bootstrap embedded and loose config byte parity is mandatory before push.

forbidden:
  - exp413_lightgbm_or_selector_retraining
  - feature_fold_target_or_sample_weight_change
  - catboost_or_xgboost_parameter_grid
  - physical_candidate_grid
  - public_lb_weight_or_candidate_selection
  - negative_weight_or_intercept
  - strict_nested_claim_without_nested_base_refit
  - same_oof_weight_bound_scope_or_tail_gate_rescue
  - confidence_gate_before_constant_stack_pass
  - per_well_or_coordinate_gate
  - inference_training_or_weight_refit
  - silent_fallback
  - external_submission_without_separate_user_approval

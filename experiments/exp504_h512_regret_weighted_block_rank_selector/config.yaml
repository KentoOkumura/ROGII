experiment:
  name: exp504_h512_regret_weighted_block_rank_selector
  description: >-
    Design-frozen H512 block-level regret-weighted pairwise rank selector over
    the saved exp293 fixed12 physical candidate bank. One candidate is selected
    for every non-overlapping H512 block and evaluated at original row level.
  hypothesis: >-
    Ranking candidates jointly within H512 queries can avoid the stable
    high-confidence long-section misranking observed in row-wise selectors and
    improve the fixed anchor without introducing a horizon or loss grid.
  route: ensemble
  status: completed_train_side_rejected_no_inference_no_submit
  created_at: "2026-08-02"
  updated_at: "2026-08-02"

lineage:
  parent: exp293_physics_only_candidate_bank_headroom_contract
  feature_contract_parent: exp264_exp263_candidate_confidence_dual_selector
  diagnosis_reference: exp300_exp264_candidate_rank_misranking_readout
  negative_framework_reference: exp348_h512_neural_path_bank
  steering: ../../.steering/20260802-exp504-h512-regret-weighted-block-rank-selector
  references:
    - exp251_raw_test_safe_dual_objective_candidate_ranker
    - exp264_exp263_candidate_confidence_dual_selector
    - exp293_physics_only_candidate_bank_headroom_contract
    - exp300_exp264_candidate_rank_misranking_readout
    - exp348_h512_neural_path_bank
    - docs/06_reproducibility.md
  diff_summary: >-
    Replace row-wise pointwise absolute-error or within-10 scoring with one
    H512-query pairwise ranking objective. Candidate values, order, folds,
    blocks, and hidden-safe row feature schema remain frozen. No new physical
    candidate, smoothing, blending, downstream model, or inference is included.


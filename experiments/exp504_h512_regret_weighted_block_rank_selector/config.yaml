model:
  name: h512_regret_weighted_pairwise_logistic_ranker
  role: implemented_ranking_model_contract_below
  implemented: true

ranking:
  framework: regret_weighted_pairwise_logistic_rank
  query: one_non_overlapping_h512_block
  documents_per_query: 12
  canonical_pairs: unordered_pairs_follow_frozen_candidate_order
  target:
    candidate_loss: block_mean_squared_error
    label: one_if_left_block_mse_is_lower
    tie_tolerance_mse: 1.0e-12
    tie_policy: drop_unordered_pair
  weight:
    raw_formula: row_count_times_log1p_abs_mse_difference
    normalization: divide_by_outer_train_unordered_pair_weight_mean
    orientation_policy: two_orientations_each_receive_half_normalized_weight
  model:
    estimator: LGBMClassifier
    objective: binary
    metric: binary_logloss
    boosting_type: gbdt
    learning_rate: 0.03
    n_estimators: 800
    early_stopping: false
    num_leaves: 31
    min_child_samples: 100
    max_depth: -1
    subsample: 1.0
    subsample_freq: 0
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    max_bin: 255
    random_state: 42
    deterministic: true
    force_col_wise: true
    device: cpu
    n_jobs: 4
    class_balancing: false
    pair_subsampling: false
  inference:
    bidirectional_probability: half_q_left_right_plus_one_minus_q_right_left
    candidate_score: mean_pairwise_win_probability_borda
    provisional_choice: maximum_borda_score
    tie_tolerance: 1.0e-12
    tie_policy: anchor_first_else_frozen_candidate_order
    anchor_candidate: exp226_w500_50_50
    anchor_guard: provisional_non_anchor_must_beat_anchor_strictly_above_0p5
    guard_probability_threshold: 0.5
    selected_value: one_candidate_value_for_all_rows_in_block
    boundary_smoothing: false
  readout:
    ndcg_at_1_relevance: candidate_count_minus_mse_rank
    ndcg_at_1_formula: selected_linear_rank_relevance_divided_by_best_relevance
    top3_order: descending_borda_then_frozen_candidate_order


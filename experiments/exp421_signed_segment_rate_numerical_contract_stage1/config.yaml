numerical_contract:
  name: truth_free_float64_cumulative_integration_v1
  dtype: float64
  maximum_matrix_vs_sequential_integration_abs_ft: 1.0e-10
  rationale: >-
    Reuse the tolerance already preregistered in exp418 Stage 1 and common
    validation. Do not choose it from exp418's oracle score or Stage 1 result.
  synthetic_audit:
    suffix_lengths: [1, 2, 17, 257, 4097]
    rate_vector: fixed_symmetric_linspace_plus_alternating_perturbation
    rate_min_ft_per_row: -0.03125
    rate_max_ft_per_row: 0.03125
    alternating_perturbation_ft_per_row: 1.0e-7
    truth_columns_loaded: 0
  exp418_reclassification: forbidden
  failure_policy: fail_closed_without_training

segmentation:
  name: exact_exp226_k16_suffix_segments
  k_segments: 16
  row_coordinate: zero_based_unknown_suffix_row
  edges: numpy_linspace_zero_to_suffix_length_17_edges
  assignment: numpy_searchsorted_edges_1_to_16_on_one_based_row_side_left_clip_zero_15
  expected_nonempty_segments: 12368
  required_min_rows_per_segment: 2
  boundary_audit_half_width_rows: 8

rate_target:
  name: zero_intercept_k16_cumulative_residual_rate
  residual_sign: true_tvt_minus_strict_nested_exp226_prediction
  unit: ft_per_row
  basis:
    first_row_all_zero: true
    interval_assignment: destination_row_segment
    definition: cumulative_count_of_prior_and_current_destination_intervals_by_segment
  solver:
    name: numpy_linalg_lstsq
    dtype: float64
    rcond: null
    intercept: false
    ridge: 0.0
    robust_loss: none
    row_reweight: none
  required_rank: 16
  segment_sample_weight: segment_row_count

correction:
  name: continuous_k16_rate_integration
  first_unknown_row_correction_ft: 0.0
  formula: cumulative_rate_basis_matrix_times_predicted_segment_rates
  clipping: none
  shrinkage: none
  taper: none
  interpolation: none
  boundary_level_step: none
  absolute_reanchor: none

features:
  source: exact_exp333_stage1_target_free_136_feature_contract
  expected_feature_count: 136
  row_groups:
    - projection_correction
    - u_disagreement
    - gr_wavelet_rotation_confidence
  row_to_segment_aggregation: finite_float64_mean
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc: {value_column: pf_ancc, enabled: true}
      pf_z: {value_column: pf_z, enabled: true}
      beam_mean: {delta_column: beam_mean_d, enabled: true}
      beam_med: {delta_column: beam_med_d, enabled: true}
      likpf_mean: {delta_column: likpf_mean_d, enabled: true}
  gr_wavelet_rotation_confidence:
    prefix: grwr_
    feature_group: gr_wavelet_rotation_confidence
    prefix_slope_window_rows: 80
    slope_clip: [-3.0, 3.0]
    local_windows_rows: [33, 65, 129]
    candidate_match_offsets_rows: [-32, -24, -16, -8, 0, 8, 16, 24, 32]
    typewell_smooth_window: 5
    ncc_weight: 8.0
    wavelet: {name: db4, level: 3, fallback_window: 65}
    fft:
      detrend: linear
      top_k_notch: 3
      rotation_band_norm: [0.06, 0.35]
      high_frequency_norm: 0.35
    denoise_filters:
      rolling_median_11: {kind: rolling_median, window: 11}
      savgol_31_p2: {kind: savgol, window: 31, polyorder: 2}
    default_candidate: likpf_mean
    candidate_match_names: [pf_ancc, beam_mean, likpf_mean, sc_ens, hyb]
    candidate_tvt_specs:
      - {name: pf_ancc, column: pf_ancc, kind: absolute}
      - {name: beam_mean, column: beam_mean_d, kind: delta}
      - {name: likpf_mean, column: likpf_mean_d, kind: delta}
      - {name: sc_ens, column: sc_ens_d, kind: delta}
      - {name: hyb, column: hyb_d, kind: delta}
      - {name: tvt_dense, column: tvt_dense_d, kind: delta}
      - {name: tvt_densew, column: tvt_densew_d, kind: delta}
      - {name: tvt_dense50, column: tvt_dense50_d, kind: delta}
  structural_columns:
    - segment_id
    - segment_position
    - segment_row_count
    - segment_md_span
    - exp226_pred_mean
    - exp226_pred_start
    - exp226_pred_end_minus_start
  forbidden:
    - feature_slope_or_new_aggregation
    - donor_risk_score
    - k12_k24_disagreement
    - true_tvt
    - residual
    - error
    - oracle
    - well_id
    - supervised_learned_likelihood
    - selector_score


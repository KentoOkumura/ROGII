experiment:
  name: exp421_signed_segment_rate_numerical_contract_stage1
  description: >-
    Governance-clean successor to exp418 that leaves its technical FAIL
    unchanged, preregisters a truth-free 1e-10 ft floating-point integration
    contract, and runs the otherwise unchanged signed K16 rate Stage 1.
  hypothesis: >-
    The 6.3e-12 ft exp418 matrix-versus-sequential discrepancy is harmless
    float64 summation-order noise under a truth-free 1e-10 ft numerical
    contract. With that contract fixed independently of OOF score, the
    unchanged signed-rate learner can test whether exp418's oracle headroom is
    learnable without reopening or reclassifying exp418.
  route: ensemble
  status: stage1_v5_completed_scientific_fail_closed
  created_at: "2026-07-28"
  updated_at: "2026-07-28"
  inference_enabled: false
  submission_enabled: false
  next_action: branch_closed_no_inference_or_submission

lineage:
  parent: exp418_exp226_signed_segment_rate_residual
  base_prediction_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  rowwise_residual_comparison: exp228_direct_residual_correction_on_exp226
  root_cause_evidence: docs/surveys/exp226_offset_root_cause_audit_20260727.md
  steering: ../../docs/legacy/steering/20260728-exp421-signed-segment-rate-numerical-contract-stage1
  references:
    - docs/06_reproducibility.md
    - experiments/exp418_exp226_signed_segment_rate_residual/result.md
    - experiments/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/result.md
    - experiments/exp228_direct_residual_correction_on_exp226/result.md
    - experiments/exp333_exp226_k16_segment_residual_offset_target/result.md
  diff_summary: >-
    Preserve exp418's target, K16 basis, correction, exp333 Stage-1
    outer/inner folds, target-free 136-feature schema and aggregation,
    row-count sample weight, fixed lgb1 config, and every Stage-1 scientific
    gate. Change only successor eligibility: verify the exact exp418 failed
    summary and its sole integration-parity failure against a preregistered,
    truth-free 1e-10 ft numerical contract before training.


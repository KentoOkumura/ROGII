  deterministic_anchor: false
  seed_policy: no_rng_stable_sha256_pseudogap_identity
  stochastic_components: []
  parallel_rng_policy: no_rng_fixed_identity_and_aggregation_order
  feature_sha_policy: decompressed_content_sha_for_gzip
  record: {kernel_version: true, input_sha: true, feature_schema_sha: true, feature_content_sha: true, model_manifest_sha: false, prediction_sha: true, submission_sha: false}

inference:
  enabled: false
  mode: disabled_until_all_stage0_gates_pass_and_separate_implementation_approval
  create_submission: false


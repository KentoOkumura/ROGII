notes:
  - Design frozen on 2026-07-22; Stage 0 implementation was explicitly approved later the same day.
  - Kaggle CPU package, push, and Stage 0 execution were explicitly approved on 2026-07-22.
  - Approved run cost is one scientific readout plus two controls across five outer audit folds, with zero trained folds, zero model configs, zero boosters, and no parent-control retraining.
  - This differs from exp337 by isolating interpolation error with hidden raw GR rather than total typewell structural residual variance.
  - exp341 remains blocked unless every Stage 0 gate passes and the table SHA is frozen.
  - Kaggle version 1 completed and failed only the 4-of-5 real-better-than-circular fold gate at 2-of-5; no rescue tuning or rerun is allowed.

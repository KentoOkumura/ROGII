    - fold
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - orientation
    - by_well
  donor_transfer:
    enabled_for_post_freeze_readout_only: true
    source: exp263_fixed_exp226_w500_50_50_donor_prediction
    create_corrected_row_prediction: false
  expected_artifacts:

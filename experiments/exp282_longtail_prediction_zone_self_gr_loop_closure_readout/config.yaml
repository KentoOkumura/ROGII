experiment:
  name: exp282_longtail_prediction_zone_self_gr_loop_closure_readout
  description: >-
    Audit whether target-free self-GR loop-closure edges from 1000+ ft
    long-tail receiver rows to earlier 0-500 ft prediction-zone donor rows
    recover same-TVT relationships before any correction is implemented.
  route: pf_beam
  status: train_side_readout_completed_guard_failed_branch_closed
  created_at: "2026-07-19"
  updated_at: "2026-07-19"

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp090_lateral_self_gr_match_pseudotail_probe
  fixed_prediction_reference: exp263_last_anchor_better_candidate_confidence_pair_cache
  parallel_comparison: exp281_exp226_residual_offset_exact_hmm_transition_probe
  supporting_references:
    - exp091_self_gr_candidate_feature
    - exp134_exp131_long_tail_rescue_tuned
    - exp223_exp072_lateral_self_gr_tail_rescue
    - exp280_exp226_shift_likelihood_separability_readout
  diff_summary: >-
    Moves self-GR matching away from the known TVT prefix and into the unknown
    prediction zone. Donors are fixed to 0-500 ft after prediction start and
    receivers to 1000+ ft. The experiment freezes target-free multiscale
    forward/reverse GR edges and confidence before attaching true TVT or the
    fixed exp263 OOF prediction. It is a readout only and creates no corrected
    prediction, model, PF/HMM path, inference output, or submission.

validation:
  strategy: group_safe_prediction_zone_self_gr_loop_closure_oof_readout
  metric: rmse_tvt
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  fixed_prediction_reference:
    candidate: exp263_fixed_exp226_w500_50_50
    oof_rmse: 8.238331
    public_lb: 7.800
  confidence_scope:
    mode: per_well_target_free_top_fraction
    top_fraction: 0.10
  guards:
    required_edge_coverage: 1.0
    required_finite_score_coverage: 1.0
    minimum_high_confidence_within10_precision: 0.60
    minimum_all_edge_positive_lift_folds: 5
    minimum_high_confidence_positive_lift_folds: 5
    minimum_high_confidence_better_median_delta_folds: 5
    minimum_high_confidence_receiver_coverage: 0.01
    minimum_donor_transfer_improved_folds: 5
    minimum_pooled_donor_transfer_rmse_gain_ft: 0.10
    require_positive_hidden_like_spatial_lift: true
    require_positive_hidden_like_typewell_purged_lift: true
  leakage_policy:
    - Edge generation may read only well identity, raw row index, MD, GR, and TVT_input.
    - Known TVT_input prefix is excluded from both donor and receiver pools.
    - True TVT, target, error, oracle labels, and exp263 predictions are forbidden until every real and shuffled edge is frozen and content-hashed.
    - Confidence uses only NCC rank, best-second gap rank, multiscale agreement, and segment support.
    - Thresholds, windows, stride, tie-breaks, shuffled control, and guards are fixed before execution.


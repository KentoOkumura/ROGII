model:
  name: none_readout_only
  estimator: none
  trained_folds: 0
  total_boosters: 0

matching:
  enabled: true
  implementation_status: canonical_selfcontained_notebooks_executed_kaggle_cpu_v1
  prediction_start_rule: row_after_last_finite_tvt_input
  md_since_reference: last_known_md
  donor_scope:
    minimum_md_since_ft: 0.0
    maximum_md_since_ft_exclusive: 500.0
  receiver_scope:
    minimum_md_since_ft: 1000.0
    maximum_md_since_ft: null
  preprocessing:
    missing_gr: interpolate_then_prefix_or_full_mean_fallback
    rolling_mean_rows: 5
    normalize: per_window_zscore
  search:
    primary_half_window_rows: 25
    auxiliary_half_window_rows: [8, 15]
    center_stride_rows: 3
    orientations: [forward, reverse]
    score: normalized_cross_correlation
    tie_break: score_desc_forward_first_donor_row_asc
    best_second_gap: true
  scale_agreement:
    maximum_primary_row_distance: 25
    require_same_orientation: true
  segment_support:
    minimum_consecutive_centers: 3
    donor_step_tolerance_strides: 1
  confidence:
    components:
      ncc_percentile: 0.25
      best_second_gap_percentile: 0.25
      multiscale_agreement: 0.25
      segment_supported: 0.25
  shuffled_control:
    mode: within_well_donor_assignment_permutation
    seed_derivation: sha256_experiment_seed_well_donor_shuffle
    preserve_receiver_confidence_coverage_and_donor_pool: true


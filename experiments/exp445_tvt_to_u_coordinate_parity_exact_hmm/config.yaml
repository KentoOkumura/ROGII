experiment:
  name: exp445_tvt_to_u_coordinate_parity_exact_hmm
  description: >-
    Re-express exp209's fixed TVT position state as the row-shifted coordinate
    U_t,j=parent_TVT_grid_j+Z_t without changing any state-index transition,
    emission, prior, posterior, or TVT readout, and verify exact numerical
    parity rather than predictive improvement.
  route: pf_beam
  status: coordinate_parity_verified_v2
  created_at: "2026-07-29"
  updated_at: "2026-07-30"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  comparison_reference: exp438_u_state_fixed_lattice_exact_hmm
  steering: ../../.steering/20260729-exp445-tvt-to-u-coordinate-parity-exact-hmm
  diff_summary: >-
    Apply no scientific model change. Keep the parent's fixed TVT index lattice
    P_j and represent each row's candidate state value as U_t,j=P_j+Z_t. This
    preserves the parent index-space transition mean r_current*delta_MD-delta_Z,
    all probabilities and posterior indices, and the TVT readout. Unlike exp438,
    no fixed absolute-U lattice is introduced.


model:
  name: row_shifted_u_coordinate_parity_exact_hmm
  estimator: deterministic_exact_forward_backward
  parent_state: [tvt_position, u_rate]
  candidate_state: [row_shifted_u_position, u_rate]
  coordinate:
    formula: U=TVT+Z
    parent_tvt_grid_formula: P_j
    candidate_u_grid_formula: U_t_j=P_j+Z_t
    candidate_tvt_view_formula: U_t_j-Z_t=P_j
    candidate_grid_is_fixed_absolute_u: false
    candidate_grid_translation_source: known_row_Z_only
    cell_index_identity: parent_j_equals_candidate_j
    continuous_equivalence: exact
    discrete_equivalence: exact
    scientific_difference: none_coordinate_relabel_only
  transition:
    rate_definition: r_U=d(TVT+Z)/dMD
    parent_index_mean_formula: r_current*delta_MD-delta_Z
    candidate_physical_u_edge_formula: (P_k-P_j)+delta_Z
    candidate_index_mean_formula: r_current*delta_MD-delta_Z
    physical_edge_residual_identity: >-
      ((P_k-P_j)+delta_Z)-r_current*delta_MD
      ==(P_k-P_j)-(r_current*delta_MD-delta_Z)
    integration: arrival_rate
  emission:
    parent_formula: GR_typewell(P_j)
    candidate_formula: GR_typewell(U_t_j-Z_t)
    identity: GR_typewell(U_t_j-Z_t)==GR_typewell(P_j)
  readout:
    parent_tvt: E_P
    candidate_u: E_U
    candidate_tvt: E_U-Z_t
    identity: E_U-Z_t==E_P
    posterior_normalization: explicit_before_coordinate_expectation
    parent_exp209_raw_matrix_product: report_only_numerical_ledger
  fixed_from_exp209:
    position_grid_step_ft: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    effective_position_sigma_ft: 0.1225
    position_kernel_cells: 5
    momentum: 0.998
    emission: gaussian_typewell_gr
    emission_lambda: 1.0
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    rate_center: zero
    output: smoothed_posterior_mean_and_std
  forbidden:
    - fixed_absolute_u_grid
    - last_known_z_anchored_u_grid
    - candidate_index_mean_r_times_delta_md_without_minus_delta_z
    - row_adaptive_cell_addition_or_removal
    - interpolation_transport
    - reanchor_or_reset
    - grid_step_phase_band_or_state_count_change
    - rate_noise_emission_prior_or_readout_change
    - truth_error_fold_role_or_episode_selection
    - blend_selector_pf_beam_ml_inference_or_submission


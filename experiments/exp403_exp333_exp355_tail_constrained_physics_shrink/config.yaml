experiment:
  name: exp403_exp333_exp355_tail_constrained_physics_shrink
  description: >-
    Design-frozen saved-OOF experiment that replaces the exp263 K16 and
    exact-HMM components with the saved exp333 segment-corrected K16 path and
    exp355 K16-rate-prior HMM, then cross-fits one fold-level scalar shrink
    back to exp263 under strict well-tail constraints.
  hypothesis: >-
    The complementary mean gain from the two fixed component upgrades can
    survive held-out folds when a shrink coefficient is selected using only
    outer-train wells and fails closed to the saved exp263 prediction whenever
    no positive coefficient satisfies the fixed tail constraints.
  route: ensemble
  status: kaggle_train_completed_fail_closed
  created_at: "2026-07-26"
  updated_at: "2026-07-26"

lineage:
  parent: exp263_last_anchor_better_candidate_confidence_pair_cache
  k16_upgrade: exp333_exp226_k16_segment_residual_offset_target
  hmm_upgrade: exp355_exp226_dip_rate_prior_on_exp209
  reporting_fold_source: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  hidden_like_source: exp115_hidden_like_spatial_holdout_from_ppt
  steering: ../../.steering/20260726-exp403-exp333-exp355-tail-constrained-physics-shrink
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp399_soft_sticky_fused_exact_runtime_audit
    - exp370_triggered_reset_rejuvenation_pf
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep the exp263 fixed weights 0.50/0.25/0.25 and replace only its exp226
    K16 component with the saved exp333 Stage-1 path and its exp209 exact-HMM
    component with the saved exp355 Stage-1 path. Apply one reporting-fold
    scalar shrink toward the unchanged exp263 prediction, selected from a
    fixed nine-value set using only the other four reporting folds. No
    component is regenerated, no hard router is trained, and the exp263
    generation fold remains separate provenance from the exp226 reporting
    fold. Because the exp333 ML correction and PF/HMM components all
    materially generate the prediction, the route is ensemble.


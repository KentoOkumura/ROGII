  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  expected_independent_fold_label_mismatch_wells: 631
  primary_control:
    experiment: exp263_last_anchor_better_candidate_confidence_pair_cache
    candidate: exp226_w500_50_50
    formula: 0.50*exp226_k16 + 0.25*likpf_mean + 0.25*exp209_exact_hmm
    rmse_ft: 8.238331546
    public_lb: 7.800
  full_replacement_reference:
    formula: 0.50*exp333_stage1 + 0.25*likpf_mean + 0.25*exp355_stage1
    exploratory_rebuilt_control_rmse_ft: 8.2383317454837
    exploratory_rmse_ft: 8.159425494114096
    exploratory_gain_ft: 0.07890625136960416
    exploratory_fold_gain_ft:
      0: 0.2890096169813843
      1: 0.1212063740369107
      2: 0.1709873958402195
      3: -0.06022310327992031
      4: -0.08270308454439146
    exploratory_by_well_delta_p95_ft: 1.983209252754805
    exploratory_worst_well: 86454a6f
    exploratory_worst_well_delta_ft: 13.412006861804933
    evidence_classification: read_only_design_evidence_not_promotion_result
  scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  truth_attachment: after_source_predictions_formulas_and_content_sha_freeze
  leakage_policy:
    - Load exp333 prediction columns without tvt_true before freeze.
    - Read suffix TVT from raw train only after every source prediction, formula, identity, and content SHA is frozen.
    - Select lambda for reporting fold f using only wells whose exp226 reporting fold is not f.
    - Never use outer-valid RMSE, error, hidden-like role, persistent episode, or Public LB to select lambda.
    - Preserve exp263 generation fold only as independent provenance and never require it to equal exp226 reporting fold.
    - Saved parent and branch predictions are load-only and are never regenerated during the train-side readout.


experiment:
  name: exp256_segment_local_corridor_near_bucket_signal_attribution_readout
  description: >-
    Attribute the exp250 near-bucket pooled AUC to distance-conditioned base
    error, candidate-family and well strata, and risk=1 saturation using only
    fixed Stage 1 diagnostic artifacts.
  route: pf_beam
  status: completed_near_pooled_base_rate_attributed_weak_residual_signal_only
  created_at: '2026-07-15'

overrides:
  project_defaults:
    - validation.n_folds
    - validation.metric

lineage:
  parent: exp250_segment_local_negative_space_gr_corridor_audit
  references:
    - KAGGLE_DIRECTION.md segment_local_corridor_near_bucket_signal_attribution_readout
    - docs/06_reproducibility.md
  diff_summary: >-
    Reads the fixed exp250 Stage 1 candidate-segment, distance-group, by-well,
    and summary artifacts. It adds paired conditional AUC, family-by-well
    contribution, near evaluation-weight, and risk=1 saturation readouts. It
    does not recompute a corridor or change any exp250 candidate or decision.

validation:
  strategy: exp250_saved_stage1_paired_signal_attribution_readout
  metric: diagnostic_paired_auc_attribution
  n_folds: 0
  group_column: well
  score_rows: exp250_saved_candidate_segment_contributions
  leakage_policy:
    - The exp250 real and shuffled risk values and bad/good weights are immutable inputs.
    - Every paired comparison requires identical well, segment, candidate, and bad/good weights.
    - Target-derived bad/good weights are used only for retrospective attribution and never create a prediction, selector, gate, or feature.
    - No parameter, threshold, segment, corridor, candidate, model, or control is fitted or regenerated.


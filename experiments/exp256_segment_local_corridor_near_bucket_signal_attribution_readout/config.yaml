model:
  name: none_saved_corridor_attribution_readout
  estimator: none
  active_variant_count: 2
  model_config_count: 0
  fold_count: 0
  booster_count: 0
  pf_beam_regeneration_count: 0
  corridor_regeneration_count: 0
  parent_control_retraining: false

audit:
  mode: fixed_saved_artifact_attribution_only
  distance_labels: ['000_050', '050_100', '100_250', '250_500', '500_1000', '1000_plus']
  near_labels: ['000_050', '050_100']
  risk_saturation_value: 1.0
  equality_tolerance: 1.0e-12
  outputs:
    distance_paired_auc_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_distance_paired_auc.csv
    distance_conditional_summary_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_distance_conditional_summary.csv
    scope_summary_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_scope_summary.csv
    family_well_attribution_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_family_well_attribution.csv.gz
    family_summary_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_family_summary.csv
    well_summary_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_well_summary.csv
    risk_saturation_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_risk_one_saturation.csv
    input_manifest_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_input_manifest.json
    summary_filename: exp256_segment_local_corridor_near_bucket_signal_attribution_readout_summary.json
  forbidden:
    - exp250_stage1_replay
    - new_corridor_or_candidate_generation
    - threshold_slack_or_segment_grid
    - near_specific_rule
    - candidate_prune_replacement_or_blend
    - ml_feature_generation
    - raw_test_inference
    - submission

runtime:
  use_amp: false
  num_workers: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp250-seglocal-negspace-gr-corridor-audit-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_new_rng_fixed_exp250_artifacts
  stochastic_components: []
  parallel_rng_policy: sorted_single_process_no_global_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - Determinism is claimed only for this diagnostic with fixed exp250 inputs.
    - The upstream exp250 candidate artifacts inherit exp072 PF/Beam stochastic provenance.
    - This experiment is not a prediction or submission anchor.

inference:
  enabled: false
  mode: disabled_saved_train_side_attribution_only
  selected_candidate: null
  create_submission: false
  notes:
    - The readout cannot reopen exp250 hard use or feature use.
    - No raw-test path or submission is produced.

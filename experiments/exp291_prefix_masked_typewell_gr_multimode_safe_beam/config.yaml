experiment:
  name: exp291_prefix_masked_typewell_gr_multimode_safe_beam
  description: >-
    Exclude same-well self-GR, retain every eligible Type Well GR local shift
    mode together with the safe exp226 base, and audit a fixed safe-anchored
    multi-checkpoint commit policy in a known-prefix masked backtest.
  hypothesis: >-
    Retaining every eligible Type Well GR local mode with an unpruned safe base
    and requiring persistent checkpoint evidence reduces exp284 false switches.
  route: pf_beam
  status: train_side_backtest_completed_guard_failed_branch_closed
  phase: completed_fixed_contract_closed
  created_at: "2026-07-19"

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.group_column
    - validation.score_rows

lineage:
  parent: exp284_prefix_masked_wrong_mode_branch_recovery_backtest
  geometry_reference: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  emission_reference: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  shift_bank_reference: exp280_exp226_shift_likelihood_separability_readout
  negative_references:
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp283_self_gr_topk_alternative_mode_branch_future_evidence_readout
    - exp285_exp226_prefix_masked_offset_predictability_readout
  diff_summary: >-
    Replaces exp284's early Type Well top-1 choice plus same-well self-GR top-3
    candidates with all eligible fixed-bank Type Well GR local modes. The safe
    base is never pruned, and an alternative is committed only after the same
    mode persistently beats safe at fixed checkpoints and passes the fixed veto.

validation:
  strategy: fixed_prefix_masked_typewell_gr_multimode_safe_beam_backtest
  metric: h256_safe_anchored_selection_rmse_and_false_switch
  seed: 42
  n_folds: 5
  group_column: well_id
  fold_source: exp226_saved_oof_fold_assignment
  score_rows: masked_known_prefix_rows_after_fixed_cut
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  guards:
    minimum_eligible_wells: 750
    required_mask_identity_coverage: 1.0
    required_safe_candidate_coverage: 1.0
    required_all_local_modes_retained_coverage: 1.0
    required_self_gr_candidate_count: 0
    required_branch_finite_coverage: 1.0
    required_evidence_finite_coverage: 1.0
    required_post_cut_truth_access_before_freeze: 0
    minimum_safe_alternative_auc_each_fold: 0.60
    minimum_balanced_choice_accuracy_pooled: 0.60
    minimum_balanced_choice_accuracy_each_fold_exclusive: 0.50
    minimum_all_modes_gain_vs_safe_h256_ft: 0.10
    minimum_all_modes_gain_vs_safe_folds: 4
    minimum_all_modes_gain_vs_top1_h256_ft: 0.05
    minimum_all_modes_gain_vs_top1_folds: 3
    maximum_safe_unique_best_false_switch_rate: 0.05
    require_h512_gain_not_below_h256: true
    require_real_better_than_matched_shuffle_pooled: true
    minimum_real_vs_matched_shuffle_nonregressing_folds: 5
  leakage_policy:
    - TVT_input rows after the pseudo cut are masked before candidate or evidence generation.
    - Raw true TVT after the cut is unavailable until all target-free artifacts have frozen content SHA values.
    - Candidate shifts use only visible pre-cut rows, a fixed shift bank, and Type Well GR.
    - Policy selection is frozen before truth-best, RMSE, recovery, or false-switch labels are attached.
    - Cut, bank, local-maximum rule, horizons, likelihood, veto, and guards cannot be tuned on this backtest truth.


pseudo_mask:
  masked_rows: 640
  minimum_visible_rows_before_cut: 512
  cut_policy: last_contiguous_known_row_minus_640
  visible_shift_score_rows: 128
  checkpoints_rows: [128, 256, 512]
  primary_horizon_rows: 256
  cuts_per_well: 1

candidate_bank:
  sources: [safe_base, typewell_gr_local_modes]
  forbidden_sources: [same_well_self_gr, ncc, self_gr_donor, self_gr_shuffle]
  always_keep_safe_base: true
  safe_shift_ft: 0.0
  shift_bank_ft: [-80.0, -40.0, -20.0, -10.0, -5.0, -2.0, 0.0, 2.0, 5.0, 10.0, 20.0, 40.0, 80.0]
  minimum_alternative_abs_shift_ft: 10.0
  local_maximum_policy: score_greater_or_equal_to_full_bank_neighbors_endpoints_compare_one_side
  local_maximum_fallback: safe_only
  tie_policy: shift_bank_order
  retain_policy: all_eligible_local_maxima_without_topk_cap
  dedup_policy: exact_shift_value
  branch_path_policy: safe_base_plus_constant_shift
  reference_path_on_visible_score_rows: observed_visible_tvt_input
  emission: exp209_gaussian_raw_gr_typewell

geometry_replay:
  mode: exp226_fold_safe_donor_field_saved_kappa_at_pseudo_cut
  source_truth_policy: outer_train_wells_only
  target_truth_policy: never_read_before_all_target_free_artifacts_frozen
  params:
    theta0: 118.4
    k_segments: 16
    local_linear_k: 50
    local_linear_bandwidth: 500.0
    local_linear_ridge: 1.0
    smooth_rho: 10.0
    gate: 0.35
    field_min_proj: 0.3
    kbins: [0.0, 750.0, 1500.0, 2500.0, 4000.0, 1.0e18]
    rot_max_deg: 60.0
    ancc_theta_bandwidth: 1500.0

evidence:
  checkpoints_rows: [128, 256, 512]
  primary_horizon_rows: 256
  primary_score: mean_cumulative_exp209_gaussian_raw_gr_typewell_log_likelihood
  emission:
    sigma_mode: visible_prefix_residual_std
    sigma_clip: [10.0, 60.0]
    log_likelihood_clip: 600.0
    missing_gr_policy: interpolate_within_allowed_window_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
  geometry_veto:
    maximum_anchor_shift_ft: 80.0
    typewell_extension_ft: 40.0
    require_finite_path_and_steps: true
  commit:
    h256: same_alternative_strictly_beats_safe_and_passes_veto_at_h128_and_h256_else_safe
    h512: same_alternative_strictly_beats_safe_and_passes_veto_at_h128_h256_h512_else_safe
    multiple_passing_alternatives: maximum_current_checkpoint_evidence_then_shift_bank_order
    score_margin: 0.0
    tie_or_nonfinite_policy: safe
    candidate_pruning: none

policies:
  primary: safe_plus_all_typewell_modes
  fixed:
    - safe_base_only
    - safe_plus_top1_typewell_mode
    - safe_plus_all_typewell_modes
    - safe_plus_matched_count_shuffled_modes
  matched_shuffle:
    source: fixed_shift_bank_eligible_slots
    preserve_count_per_event: true
    score_blind: true
    sample_without_replacement: true
    allow_accidental_real_mode_overlap: true
    seed: 42
    seed_policy: stable_sha256_per_well_cut_source_local_rng


model:
  name: prefix_conditioned_gr_unary_local_ce_then_exact_ssm
  estimator: pytorch_local_ce_neural_unary_plus_frozen_exact_forward_backward
  target: nearest_typewell_tvt_grid_state
  sample_unit: complete_well
  output: tvt_posterior_mean
  inference_neighbor_well_data: false
  candidate_bank: none
  test_time_gradient_updates: false
  architecture_source: exp295_prefix_anchored_wholewell_gr_alignment_ssm
  preprocessing:
    robust_center: finite_median
    robust_scale: 1p4826_mad_with_floor_1
    missing_fill_value_after_normalization: 0.0
    include_missing_mask: true
    typewell_extrapolation: false
    prefix_huber_summary:
      minimum_pairs: 32
      fallback: neutral_context
  inputs:
    horizontal_emission_channels: [gr_robust_z, gr_missing_mask, dgr_dmd]
    typewell_emission_channels: [gr_robust_z, gr_missing_mask, dgr_dtvt]
    transition_only_channels: [MD, X, Y, Z, TVT_input]
    prefix_context_sources: [horizontal_gr, typewell_gr_at_visible_tvt_input, visible_tvt_input_mask]
  architecture:
    horizontal_encoder: multiscale_1d_residual
    typewell_encoder: multiscale_1d_residual
    embedding_dim: 64
    dilations: [1, 2, 4, 8, 16]
    normalization: group_norm
    dropout: 0.10
    prefix_context_aggregator: masked_attention_pool
    prefix_context_dim: 32
    conditioning: prefix_context_film_scale_and_bias
    similarity: normalized_bilinear_cosine
    temperature: positive_prefix_conditioned_clamped
    temperature_min: 0.05
    temperature_max: 2.0
    temperature_initial: 0.25
    convolution_kernel_size: 3
    group_norm_groups: 8
    prefix_pair_embedding_dim: 64
    derivative_clip_abs: 8.0
    unary_row_chunk_size: 256
    streamed_row_tvt_unary: true
  training:
    objective:
      name: hard_nearest_state_local_cross_entropy
      local_true_state_ce_weight: 1.0
      structured_label_nll_weight: 0.0
      state_space_calls_in_optimizer_graph: 0
      state_space_calls_for_early_stopping: 0
    full_suffix_no_tail_truncation: true
    optimizer: adamw
    learning_rate: 0.0003
    weight_decay: 0.0001
    max_epochs: 8
    early_stopping_source: stable_outer_train_holdout_local_ce_only
    early_stopping_holdout_fraction: 0.10
    early_stopping_minimum_wells: 16
    early_stopping_patience_epochs: 2
    early_stopping_min_delta_local_ce: 0.001
    early_stopping_views: [official]
    gradient_clip_norm: 1.0
    batch_size_wells: 1
    gradient_accumulation_wells: 4
    amp: true
    dataloader_shuffle: true
    dataloader_workers: 0
    pseudo_cut_views_per_well_maximum: 3
    require_cuda: true
    minimum_cuda_capability_major: 7
  state_space:
    use_phase: frozen_model_evaluation_and_inference_only
    source: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
    known_prefix_policy: hard_clamp_finite_tvt_input
    solver: exact_log_space_forward_backward
    primary_readout: posterior_mean_tvt
    diagnostic_readouts: [marginal_map, global_viterbi, posterior_std, entropy, grid_edge_mass]
    learn_transition: false
  controls:
    - real_gr
    - stable_within_well_circular_shuffled_typewell_gr_same_trained_model
    - zero_gr_unary_geometry_only_same_trained_model
  forbidden_actions:
    - structured_loss_or_forward_backward_during_training
    - exact_ssm_based_early_stopping
    - fixed_window_structured_training
    - neighbor_well_or_candidate_bank_input
    - architecture_loss_band_temperature_view_or_epoch_grid
    - parent_or_control_retraining
    - exp295_version4
    - inference_or_submission_before_promotion_and_approval
    - fold_unary_average_or_learned_fold_weighting
    - same_typewell_horizontal_donor
    - spatial_neighbor_feature_or_prior
    - candidate_bank_or_selector
    - test_time_backpropagation
    - blend_with_existing_ml_pf_or_beam


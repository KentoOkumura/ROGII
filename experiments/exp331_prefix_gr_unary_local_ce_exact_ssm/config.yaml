experiment:
  name: exp331_prefix_gr_unary_local_ce_exact_ssm
  description: >-
    Train the exp295 prefix-conditioned GR unary with row-independent local CE
    only, then use the fixed exp209 exact SSM exclusively after model freeze for
    validation and inference.
  route: ensemble
  status: stage_a_failed_branch_closed
  created_at: "2026-07-21"
  implementation_approved: true
  kaggle_run_approved: true
  inference_approved: false
  submission_approved: false

lineage:
  parent: exp295_prefix_anchored_wholewell_gr_alignment_ssm
  references:
    - exp202_heatmap_mdn_candidate_generator_probe
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp221_lgb_oof_gaussian_emission_hmm_on_exp148
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  design_source: .steering/20260721-exp331-prefix-gr-unary-local-ce-exact-ssm
  diff_summary: >-
    Keeps the exp295 data, fold, encoder, unary, decoder, controls, and
    promotion contracts, but removes every state-space forward-backward and
    structured term from training and early stopping. Each suffix row is
    trained against its nearest Type Well TVT state by hard cross entropy. The
    fixed exp209 exact SSM is called only after the neural model is frozen.

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.score_rows

validation:
  strategy: complete_well_groupkfold_official_prefix_hidden_suffix
  metric: pooled_oof_rmse_tvt_posterior_mean
  seed: 42
  n_folds: 5
  group_column: well
  sample_unit: complete_well
  score_rows: official_tvt_input_hidden_suffix_rows
  reuse_fold_map_from: exp202_heatmap_mdn_candidate_generator_probe
  valid_mask_policy: organizer_equivalent_official_tvt_input_mask
  outer_train_pseudo_cut_offsets_rows: [0, 256, 512]
  baselines:
    primary_decoder_baseline:
      experiment: exp221_lgb_oof_gaussian_emission_hmm_on_exp148
      pooled_oof_rmse: 8.327736951
    raw_exact_hmm:
      experiment: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
      pooled_oof_rmse: 11.938287417
  diagnostics:
    - local_ce_and_nearest_state_accuracy
    - fold_and_pooled_rmse
    - real_vs_circular_shuffle_and_geometry_only
    - posterior_mass_within10_and_20
    - distance_1000_plus_rmse
    - hidden_like_spatial_and_typewell_purged_rmse
    - by_well_rmse_p95_and_worst
    - target_in_grid_and_grid_edge_mass
    - runtime_and_peak_memory
  stage0_microbenchmark:
    accelerator: NvidiaTeslaT4
    fixed_view_count: 16
    suffix_length_quartiles: 4
    views_per_quartile: 4
    conservative_throughput_quantile: 0.10
    selection: stable_sha256_four_views_per_suffix_length_quartile
    maximum_projected_fold_runtime_hours: 8.5
    maximum_peak_gpu_memory_gb: 14.0
    failure_action: close_without_in_experiment_compute_rescue
  stage_a:
    folds: [0]
    architectures: 1
    seeds: [42]
    neural_models: 1
    lightgbm_configs: 0
    boosters: 0
    pf_beam_runs: 0
    parent_or_control_retraining: 0
  stage_a_pass:
    minimum_target_in_grid_rate: 0.995
    maximum_prefix_clamp_abs_error_ft: 0.000001
    minimum_real_nll_gain_vs_circular_shuffle_nats_per_token: 0.05
    minimum_real_within10_mass_gain_vs_circular_shuffle: 0.03
    minimum_real_rmse_gain_vs_geometry_only_ft: 0.25
    minimum_real_rmse_gain_vs_exp209_ft: 0.25
    require_well_rmse_p95_non_regression_vs_exp209: true
    maximum_worst_well_regression_vs_exp209_ft: 10.0
    maximum_peak_gpu_memory_gb: 14.0
    maximum_fold_runtime_hours: 8.5
  stage_b:
    requires_stage_a_all_pass_and_separate_approval: true
    reuse_fold0_model_without_retraining: true
    additional_folds: [1, 2, 3, 4]
    additional_neural_models: 4
  stage_c:
    requires_stage_b_promotion_and_separate_approval: true
    per_fold_decode: full_well_exact_ssm_posterior_mean
    fold_aggregation: rowwise_equal_arithmetic_mean_of_five_posterior_means
    forbidden_aggregation: [unary_average, learned_fold_weights, existing_candidate_blend]
  promotion_pass:
    maximum_pooled_oof_rmse_ft: 6.0
    architecture_signal_only_upper_rmse_ft: 6.75
    minimum_pooled_rmse_gain_vs_each_control_ft: 0.50
    require_real_better_than_each_control_all_folds: true
    require_improvement_vs_exp221_all_folds: true
    require_improvement_vs_exp221_distance_1000_plus: true
    require_improvement_vs_exp221_hidden_like_spatial: true
    require_improvement_vs_exp221_hidden_like_typewell_purged: true
    require_well_rmse_p95_non_regression_vs_exp221: true
    maximum_worst_well_regression_vs_exp221_ft: 5.0
  failure_policy:
    - Stage 0 failure closes Stage A without an in-experiment architecture, loss, band, view, epoch, or temperature rescue.
    - Stage A failure closes Stage B without an in-experiment rescue grid.
    - Only the full Stage B promotion gate permits separately approved Stage C inference.


experiment:
  name: exp401_exp368_weak_risk_candidate_advantage_readout_on_exp264
  description: >-
    Design-frozen zero-booster readout that tests whether the saved target-free
    exp368 weak-GR posterior identifies likpf_mean bad10 rows where the
    exp264 strict-nested selector scores already nominate a recoverable
    alternative. A single continuous risk feature may proceed to an add-only
    exp264 Stage C selector audit only after every Stage 0 gate passes.
  hypothesis: >-
    The continuous exp368 weak risk contains candidate-advantage information
    beyond the existing exp264 predicted-error margin, even though it was not
    strong or frequent enough to promote exp368's marginalized PF.
  route: ml_model
  status: stage_0_failed_closed
  created_at: "2026-07-26"
  updated_at: "2026-07-26"

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  auxiliary_source: exp368_marginalized_reliability_pf
  steering: ../../.steering/20260726-exp401-exp368-weak-risk-candidate-advantage-readout-on-exp264
  references:
    - exp263_last_anchor_better_candidate_confidence_pair_cache
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
  diff_summary: >-
    Do not weaken GR likelihood, rerun PF, or lower a weak-state threshold.
    Freeze one continuous row-level context feature by averaging the saved
    exp368 weak_posterior_mean of every overlapping block covering the row.
    Stage 0 only asks whether that feature predicts actionable recovery inside
    each existing exp264 legal selector domain after the feature SHA is frozen.

overrides:
  project_defaults:
    - validation.metric

implementation:
  enabled: true
  scope: stage_0_implementation_only
  design_approval_received: true
  design_approval_source: user_message_create_backlog_experiment_and_steering_2026_07_26
  implementation_approval_received: true

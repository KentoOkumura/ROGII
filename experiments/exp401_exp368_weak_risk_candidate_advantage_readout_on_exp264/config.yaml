features:
  active_feature_count: 1
  active:
    - name: ctx__exp368_weak_risk
      source_column: weak_posterior_mean
      join_keys: [well_id, block_id]
      row_aggregation: arithmetic_mean_over_all_covering_blocks
      block_rows: 512
      stride_rows: 256
      tail_policy: keep_short_tail_from_stride_starts
      overlap_weighting: equal_per_covering_block
      dtype: float32
      expected_range: [0.0, 1.0]
      transforms: []
      thresholds: []
  negative_control:
    name: ctx__exp368_circular_weak_risk
    source_column: circular_weak_score
    row_aggregation: same_as_active_feature
    use_as_model_feature: false
  freeze_before_truth:
    - row_identity
    - active_feature
    - circular_feature
    - fold
    - legal_domains
    - feature_schema_sha256
    - feature_content_sha256
    - scientific_contract_sha256

stage_0:
  enabled: true
  implementation_approval_required: true
  run_approval_required: true
  name: zero_booster_actionable_candidate_advantage_readout
  cohort:
    definition: likpf_actual_abs_error_greater_than_or_equal_10ft
    anchor_bad10_threshold_ft: 10.0
  nominated_other:
    selection_score: minimum_pred_abs_error
    exclude_anchor: true
    tie_break: declared_candidate_order
  labels_after_freeze:
    nominated_recovery10: nominated_other_actual_abs_error_strictly_less_than_10ft
    oracle_recoverable10: any_non_anchor_in_same_legal_domain_actual_abs_error_strictly_less_than_10ft
    realized_advantage_ft: likpf_actual_abs_error_minus_nominated_other_actual_abs_error
    selector_margin: likpf_pred_abs_error_minus_nominated_other_pred_abs_error
  conditional_readout:
    selector_margin_bins: 10
    boundary_source: other_four_outer_folds_target_free_margin
    metric: pooled_within_bin_pairwise_auc
  quartile_readout:
    edges: [0.25, 0.75]
    boundary_source: other_four_outer_folds_target_free_weak_risk
    metric: q4_minus_q1_mean_realized_advantage_ft
  technical_gate_all_required:
    expected_rows: 3783989
    expected_wells: 773
    expected_blocks: 15174
    expected_folds: 5
    expected_candidate_long_rows: 45407868
    expected_candidates_per_row: 12
    primary_domain_candidates: 11
    secondary_domain_candidates: 7
    row_coverage_fraction: 1.0
    feature_finite_fraction: 1.0
    feature_range: [0.0, 1.0]
    truth_columns_read_before_freeze: 0
    minimum_positive_rows_per_required_scope: 1000
    minimum_negative_rows_per_required_scope: 1000
    model_configs: 0
    lightgbm_configs: 0
    trained_folds: 0
    boosters: 0
    pf_runs: 0
    prediction_rows: 0
    require_input_schema_feature_and_readout_sha: true
  scientific_gate_all_required:
    primary_domain:
      minimum_pooled_nominated_recovery10_auc: 0.60
      minimum_auc_gain_over_circular: 0.02
      minimum_folds_with_real_auc_strictly_above_0p50: 4
      minimum_hidden_like_spatial_auc: 0.55
      minimum_hidden_like_typewell_purged_auc: 0.55
      minimum_pooled_margin_conditional_auc: 0.55
      minimum_folds_with_margin_conditional_auc_strictly_above_0p50: 4
      minimum_q4_minus_q1_mean_realized_advantage_ft: 0.50
      minimum_folds_with_positive_q4_minus_q1_advantage: 4
    secondary_domain:
      minimum_pooled_nominated_recovery10_auc: 0.52
      minimum_auc_gain_over_circular: 0.00
      minimum_q4_minus_q1_mean_realized_advantage_ft: 0.00
  non_gating_diagnostics:
    - oracle_recoverable10_auc
    - oracle_recoverable10_prevalence
    - nominated_recovery10_prevalence
    - candidate_nomination_distribution
    - p_within10_margin_readout
  fail_policy: close_without_inversion_threshold_block_domain_subset_metric_or_gate_rescue


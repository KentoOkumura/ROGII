  compact_selfcontained_candidate_created: true
  jupytext_source_created: true
  helper_code_created: false
  tests_created: true
  kaggle_package_created: true
  stage_0_implemented: true
  stage_1_implemented: false
  inference_enabled: false
  submission_enabled: false

validation:
  strategy: >-
    zero_booster_outer5_actionable_candidate_advantage_readout_then_conditional
    _strict_nested_selector_addonly
  metric: nominated_recovery10_auc
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  group_column: well_id
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_blocks: 15174
  expected_candidate_long_rows: 45407868
  truth_attachment: after_risk_domain_fold_schema_and_content_sha_freeze
  leakage_policy:
    - Read no suffix TVT, error, bad10, oracle, or hidden-like result before risk freeze.
    - Use exp264 strict-nested outer-valid scores; never use same-fold selector fits.
    - Keep primitive_pair_bank and primitive_fixed_bank as separate legal domains.
    - Use oracle_recoverable10 only as a non-gating headroom diagnostic.
    - Do not return labels, errors, quartiles, thresholds, or gate outcomes to features.
    - Derive valid-fold margin deciles and weak-risk quartiles from the other four folds.
    - Do not use public LB for feature, threshold, domain, or gate selection.


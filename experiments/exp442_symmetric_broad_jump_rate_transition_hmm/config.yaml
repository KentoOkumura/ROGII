    candidate_hmm_well_runs: 773
    parent_hmm_well_runs: 0
    direct_rmse_gain_vs_exp209_min_ft: 0.05
    positive_fold_count_min: 4
    persistent_episode_sse_reduction_min_fraction: 0.05
    required_scopes:
      - near_0_250
      - mid_250_1000
      - md_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
      - raw_gr_observed
      - raw_gr_missing
    required_scope_rmse_delta_max_ft: 0.02
    by_well_delta_p95_max_ft: 0.25
    worst_well_delta_max_ft: 2.0
    fail_action: close_without_blend_selector_or_same_oof_rescue


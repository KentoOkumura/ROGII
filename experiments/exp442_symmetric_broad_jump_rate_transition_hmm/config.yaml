model:
  name: symmetric_broad_jump_rate_transition_exact_hmm
  estimator: deterministic_exact_forward_backward
  state: [tvt_position, u_rate]
  fixed_from_exp209:
    position_grid_step_ft: 0.35
    rate_grid: per_well_zero_centered_41_state_parent_grid
    n_rates: 41
    rate_span: 0.10
    rate_span_min: 0.10
    sig_r: 0.002
    sig_p: 0.02
    momentum: 0.998
    emission_family: gaussian_typewell_gr
    emission_lambda: 1.0
    sigma_mode: known_prefix_zero_fill_population_std
    sigma_clip: [10.0, 60.0]
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    rate_center: zero
    rate_boundary_semantics: preserve_parent_substochastic_outward_mass
    position_boundary_semantics: preserve_parent_truncation
    position_mean_formula: r_destination*delta_MD-delta_Z
    output: smoothed_posterior_mean_and_std
  active_scientific_variants:
    - symmetric_broad_jump_w001_s002
  candidate_rate_transition:
    formula: (1-jump_weight)*parent_tridiagonal_kernel+jump_weight*broad_kernel
    jump_weight: 0.01
    broad_sigma_rate: 0.02
    broad_center_formula: r_source-(1-parent_momentum)*r_source*delta_MD
    broad_discretization: gaussian_cdf_integral_over_all_rate_bin_voronoi_cells
    symmetry: target_free_two_sided
    outer_tail_policy: discard_outside_finite_parent_rate_support_without_renormalization
    branch_responsibility_audit: true
    nonadjacent_edge_definition: absolute_destination_minus_source_index_gt_1
    future_rate_horizon_rows: 32
    future_rate_direction_definition: median_next32_minus_median_past32_physical_interval_rate
    direction_agreement_weight: posterior_nonadjacent_broad_edge_mass
    positive_fold_definition: weighted_direction_agreement_strictly_above_0p50
  forbidden:
    - jump_weight_or_sigma_grid
    - gr_innovation_direction_trigger_duration_or_refractory
    - asymmetric_jump_reset_reanchor_or_datum_branch
    - parent_local_kernel_position_grid_noise_emission_prior_or_readout_change
    - blend_selector_gate_or_same_oof_rescue

gates:
  stage0_fixed32:
    role: mechanism_preflight_only_not_cv_or_promotion
    scientific_variants: 1
    candidate_hmm_well_runs: 32
    parent_hmm_well_runs: 0
    technical:
      expected_wells: 32
      expected_rows: 156088
      finite_coverage_min: 1.0
      local_branch_parent_parity_max_abs_error: 1.0e-12
      mixture_decomposition_max_abs_error: 1.0e-12
      broad_in_support_mass_max_abs_error: 1.0e-12
      posterior_normalization_max_error: 1.0e-6
      brute_force_branch_responsibility_max_abs_error: 1.0e-6
      truth_role_fold_episode_reads_before_freeze_max: 0
      projected_stage1_runtime_seconds_max: 30600
      peak_rss_gb_max: 25
    mechanism:
      nonadjacent_posterior_edge_mass_min: 0.001
      jump_edge_future_rate_direction_agreement_min: 0.60
      jump_edge_direction_positive_folds_min: 4
      forward_cause_episode_sse_reduction_min_fraction: 0.10
      persistent_episode_sse_reduction_min_fraction: 0.05
      persistent_improved_wells_min: 10
      persistent_improving_folds_min: 4
      matched_control_pooled_rmse_delta_max_ft: 0.02
      matched_control_by_well_delta_p95_max_ft: 0.25
    fail_action: close_without_jump_weight_sigma_trigger_emission_grid_or_gate_rescue
  stage1_full_oof:
    prerequisite: stage0_all_technical_and_mechanism_gates_pass_and_separate_user_approval

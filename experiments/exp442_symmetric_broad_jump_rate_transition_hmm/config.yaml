experiment:
  name: exp442_symmetric_broad_jump_rate_transition_hmm
  description: >-
    Independent defensive-mixture exact-HMM candidate that mixes a fixed
    one-percent symmetric broad Gaussian rate branch into the unchanged exp209
    local transition, allowing rare multi-bin rate moves without a GR-derived
    direction trigger, reset, re-anchor or parameter grid.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-29"
  updated_at: "2026-07-30"
  inference_enabled: false

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  references:
    - exp408_hmm_message_rate_basin_audit
    - exp411_predictive_filtered_rate_innovation_destick
    - exp424_exp209_momentum1_exact_hmm_ablation
    - exp432_symmetric_datum_defensive_particle_reinjection
    - exp441_full_support_ou_rate_transition_hmm
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep 99 percent of the exact parent tri-diagonal rate kernel and mix in one
    percent of a target-free symmetric Gaussian branch with rate sigma 0.02.
    Keep every position, emission, prior, state and readout contract unchanged.
  implementation_source:
    - experiments/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation/exact_hmm_smoother.py
    - experiments/exp411_predictive_filtered_rate_innovation_destick/exp411_predictive_filtered_rate_innovation_destick_compact_selfcontained_train.py
    - experiments/exp440_ambiguity_gated_predictive_prior_hmm/exp440_ambiguity_gated_predictive_prior_hmm_compact_selfcontained_train.py

design:
  priority: P2
  design_frozen: true
  implementation_authorized: true
  implementation_approval_source: user_message_implement_exp442_2026_07_29
  canonical_notebook_adoption_authorized: true
  kaggle_package_authorized: true
  stage0_run_authorized: true
  stage1_run_authorized: false
  inference_authorized: false
  submission_authorized: false
  single_factor_change: true
  same_oof_rescue_allowed: false
  stage0_execution_prerequisite: >-
    Evaluate exp442 as an independent defensive-mixture hypothesis against the
    saved exp209 control. Preserve exp441 as negative context, not as positive
    evidence or an execution prerequisite. Keep the candidate parameters,
    fixed32 scope and all gates frozen without same-OOF rescue.
  stage0_execution_prerequisite_status: >-
    satisfied_independent_hypothesis_and_user_stage0_approval_2026_07_30
  independent_hypothesis_approval_source: >-
    user_message_update_steering_validation_contract_and_run_2026_07_30

validation:
  strategy: fixed32_mechanism_gate_then_separately_authorized_full_773_well_oof
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  leakage_policy:
    - The jump branch is symmetric and fixed before reading any target or error.
    - Freeze branch-responsibility, prediction and diagnostic SHA before joining truth, role, fold, episode or cause.
    - Stage 0 fixed32 is mechanism-only and not CV or promotion evidence.


  strategy: inherited_exp413_outer_groupkfold_with_inner_crossfit_for_rank_features
  group_column: well_id
  outer_folds: 5
  inner_folds_per_outer: 4
  metric: rmse
  score_rows: inherited_exp413_suffix_rows
  hidden_like_scopes:
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - A downstream outer-valid well is absent from every model used to create its features.
    - A downstream outer-train inner-held well is absent from its rank feature model.
    - Rank labels and regret weights use only the three allowed inner-training folds.
    - Standard exp504 five-fold OOF must not be copied into downstream outer-train partitions.
    - Truth, error, oracle, well id, hard-selected TVT, and ordinal candidate id are forbidden features.


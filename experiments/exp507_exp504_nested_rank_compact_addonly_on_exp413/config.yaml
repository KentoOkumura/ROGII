experiment:
  name: exp507_exp504_nested_rank_compact_addonly_on_exp413
  description: >-
    Add a strict outer/inner nested 45-column compact representation of the
    exp504 H512 pairwise rank surface to the frozen exp413 final370 TVT feature
    set. The hard-selected TVT and the full 66 pair probabilities are excluded.
  hypothesis: >-
    Exp504 pairwise preferences may be useful to the downstream TVT model even
    though collapsing them to one hard winner failed fold, hidden-like, and
    by-well tail gates.
  route: ensemble
  status: stage_d_complete_technical_pass_scientific_fail_closed
  created_at: "2026-08-03"
  updated_at: "2026-08-03"

lineage:
  parent: exp413_scale5_likpf_full_replacement_on_exp335
  rank_source: exp504_h512_regret_weighted_block_rank_selector
  candidate_contract_parent: exp293_physics_only_candidate_bank_headroom_contract
  selector_feature_contract_parent: exp264_exp263_candidate_confidence_dual_selector
  replacement_negative_reference: exp502_exp501_fixed13_selector_replacement_on_exp413
  steering: ../../.steering/20260803-exp507-exp504-nested-rank-compact-addonly-on-exp413
  references:
    - exp413_scale5_likpf_full_replacement_on_exp335
    - exp504_h512_regret_weighted_block_rank_selector
    - exp502_exp501_fixed13_selector_replacement_on_exp413
    - exp264_exp263_candidate_confidence_dual_selector
    - exp293_physics_only_candidate_bank_headroom_contract
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep exp413 clean273, compact74, signed23, downstream folds, model configs,
    and evaluation fixed. Add only a strict nested rank_compact45 block to form
    final415. Reuse the five saved exp504 outer-valid surfaces and train only
    twenty inner rank models in a future separately approved Stage N.


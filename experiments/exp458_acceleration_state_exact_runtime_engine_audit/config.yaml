  score_rows: train_unknown_suffix_rows
  leakage_policy:
    - Reuse the exact exp444 fixed4 well ledger without reading target, role, fold, episode or cause.
    - Freeze each repeat's prediction, posterior and diagnostic artifacts before any truth-bearing join.
    - Treat Stage 0A only as a runtime and numerical-equivalence audit.


scientific_contract:
  expected_sha256: f4a0bbbcc8b9cb44a55cff29e07f49ed251e11a896b3e877b4e2d6f9d08f4972
  source: exp444_acceleration_state_exact_hmm
  state: [tvt_position, u_rate, u_acceleration]
  position_grid_step_ft: 0.35
  rate_states: 41
  rate_span: 0.10
  rate_transition_family: exact_ornstein_uhlenbeck_full_support_bin_integral
  rate_momentum: 0.998
  sig_r: 0.002
  sig_p: 0.02
  acceleration_values: [-0.0005, 0.0, 0.0005]
  acceleration_initial_probability: [0.0, 1.0, 0.0]
  acceleration_transition:
    interior_to_lower: 0.08
    interior_stay: 0.84
    interior_to_upper: 0.08
    boundary_outward_policy: add_outward_probability_to_boundary_stay
  emission_family: gaussian_typewell_gr
  emission_lambda: 1.0
  start_sigma_ft: 0.75
  initial_rate_sigma: 0.01
  band_pad_ft: 100.0
  output: smoothed_posterior_mean_and_std
  forbidden_changes:
    - acceleration_state_value_count_span_transition_or_initial_prior
    - rate_state_count_span_transition_parameter_or_boundary_semantics
    - tvt_grid_position_kernel_noise_emission_prior_or_readout
    - pruning_threshold_banding_state_removal_or_float_precision_reduction
    - trigger_selector_blend_viterbi_map_or_truth_direction

model:
  name: acceleration_state_full_support_ou_exact_hmm_runtime_equivalent
  estimator: deterministic_exact_forward_backward
  fitted_model_artifact: false
  state: [tvt_position, u_rate, u_acceleration]
  fixed_from_exp441:
    position_grid_step_ft: 0.35
    rate_grid: per_well_zero_centered_41_state_parent_grid
    n_rates: 41
    rate_span: 0.10
    rate_span_min: 0.10
    rate_transition_family: exact_ornstein_uhlenbeck_full_support_bin_integral
    sig_r: 0.002
    rate_momentum: 0.998
    sig_p: 0.02
    emission_family: gaussian_typewell_gr
    emission_lambda: 1.0
    sigma_mode: known_prefix_zero_fill_population_std
    sigma_clip: [10.0, 60.0]
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    rate_boundary_semantics: preserve_parent_substochastic_outward_mass
    position_boundary_semantics: preserve_parent_truncation
    position_mean_formula: r_destination*delta_MD-delta_Z
    output: smoothed_posterior_mean_and_std
  active_scientific_variants:
    - three_state_persistent_acceleration
  acceleration_state:
    units: u_rate_per_md_ft
    values: [-0.0005, 0.0, 0.0005]
    initial_probability: [0.0, 1.0, 0.0]
    transition:
      interior_to_lower: 0.08
      interior_stay: 0.84
      interior_to_upper: 0.08
      boundary_outward_policy: add_outward_probability_to_boundary_stay
      derivation_note: nominal_exp209_one_ft_rate_move_probability_per_direction
    destination_rate_mean_formula: exp(-kappa*delta_MD)*r_source+a_destination*delta_MD
    destination_rate_variance_formula: sig_r^2*(1-exp(-2*kappa*delta_MD))/(2*kappa)
    position_update_uses: destination_rate
  forbidden:
    - acceleration_value_count_span_transition_or_initial_prior_grid
    - acceleration_trigger_reset_reanchor_or_truth_direction
    - exp441_rate_kernel_position_grid_noise_emission_prior_or_readout_change
    - viterbi_map_selector_blend_or_same_oof_rescue

runtime_engine:
  candidates:
    - scaled_probability_factorized_cached_outer4
  candidate_count: 1
  dtype: float64
  forward:
    - acceleration_3x3_matrix
    - destination_acceleration_conditioned_rate_41x41_matrix
    - exact_parent_position_five_offset_stencil
    - exact_parent_gr_emission
    - per_row_scale_normalization_and_log_scale_record
  backward: use_saved_forward_scale_with_reverse_factorized_operator
  joint_dense_transition_materialized: false
  delta_md_ou_cache:
    enabled: true
    key: exact_float64_bit_pattern_within_well
    rounding_or_quantization: false
  parallel:
    outer_well_workers: 4
    process_isolation: true
    numba_threads_per_worker: 1
    omp_threads_per_worker: 1
    mkl_threads_per_worker: 1
    openblas_threads_per_worker: 1
    shared_reduction_across_wells: false
    output_order: stable_well_id_then_row_idx
  accelerator: cpu_only
  gpu: false
  use_amp: false


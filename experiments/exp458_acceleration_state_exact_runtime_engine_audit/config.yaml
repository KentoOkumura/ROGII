experiment:
  name: exp458_acceleration_state_exact_runtime_engine_audit
  description: >-
    Independently test whether the frozen exp444 acceleration-state exact HMM
    posterior can be reproduced within the Kaggle CPU runtime limit by one
    exact-equivalent scaled probability-space, factorized, cached and
    four-well-parallel execution engine.
  route: pf_beam
  status: stage0a_fail_closed_parent_numerical_parity
  created_at: "2026-07-30"
  updated_at: "2026-07-30"
  inference_enabled: false

lineage:
  parent: exp444_acceleration_state_exact_hmm
  structural_parent: exp444_acceleration_state_exact_hmm
  root_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  references:
    - exp399_soft_sticky_fused_exact_runtime_audit
    - exp441_full_support_ou_rate_transition_hmm
    - docs/06_reproducibility.md
  steering: ../../.steering/20260730-exp458-acceleration-state-exact-runtime-engine-audit
  diff_summary: >-
    Preserve the complete exp444 scientific contract and change only its
    execution engine: scaled float64 probability-space forward-backward,
    factorized/fused acceleration-rate-position transitions, exact-bit
    delta_MD OU-kernel reuse, and four independent well workers. This is an
    independent runtime hypothesis and does not rescue or reclassify exp444.


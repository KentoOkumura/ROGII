experiment:
  name: exp502_exp501_fixed13_selector_replacement_on_exp413
  description: >-
    Design-frozen train-side ML ablation on exp413. Remove the existing exp413
    Stage C nested selector compact 74-column block and insert the saved exp501
    fixed13 selector compact 77-column block in the same slot. Retain exp413
    clean273 and signed23 unchanged, producing final373. This is replacement-only,
    not add-only. Train-side implementation and contract tests are complete. The
    user approved canonical train notebook adoption, Kaggle packaging, and the
    frozen 15-booster train run on 2026-08-02. Kaggle version 1 completed all 15
    models but failed the pooled-gain and scope gates, so the branch is closed
    without inference or submission.
  hypothesis: >-
    The exp501 fixed13 selector improved hard OOF versus the corrected exp264
    fixed12 selector by 0.387642 ft across 5/5 folds and all seven scopes. Even
    though its selector-level by-well tail gate failed, replacing exp413's nested
    selector representation with its saved fold-safe compact77 may improve the
    downstream TVT LightGBM OOF while all other exp413 feature blocks and model
    settings remain fixed.
  route: ml_model
  status: kaggle_train_complete_fail
  created_at: "2026-08-02"
  updated_at: "2026-08-02"
  inference_enabled: false

lineage:
  parent: exp413_scale5_likpf_full_replacement_on_exp335
  selector_source: exp501_exp490_mean_reverting_hmm_fixed13_selector_on_exp264
  selector_candidate_parent: exp490_geometry_centered_mean_reverting_offset_hmm
  clean_and_signed_source: exp413_scale5_likpf_full_replacement_on_exp335
  steering: ../../docs/legacy/steering/20260802-exp502-exp501-fixed13-selector-replacement-on-exp413
  references:
    - experiments/exp413_scale5_likpf_full_replacement_on_exp335/config.yaml
    - experiments/exp413_scale5_likpf_full_replacement_on_exp335/metrics.json
    - experiments/exp501_exp490_mean_reverting_hmm_fixed13_selector_on_exp264/config.yaml
    - experiments/exp501_exp490_mean_reverting_hmm_fixed13_selector_on_exp264/metrics.json
    - docs/06_reproducibility.md
  diff_summary: >-
    Freeze exp413 clean273, signed23, target, outer folds, three downstream
    LightGBM configs, seeds, GPU mode, early stopping, postprocess, and evaluation
    scopes. Exclude the exp413 Stage C nested compact74 block completely and put
    exp501 saved compact77 in that slot, changing final width only from 370 to
    373. Do not concatenate, blend, gate, or jointly retain both selector blocks.
    Reuse saved exp501 selector outputs and saved exp413 control; the only future
    training is 15 treatment TVT GPU boosters.


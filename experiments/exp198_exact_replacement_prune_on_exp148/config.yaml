inference:
  mode: saved_lgb_booster_inference_with_rawtest_learned_likelihood_features
  selected_variant: drop_exact_replacements_17
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  notes:
    - Inference requires a completed exp198 train manifest with saved boosters.
    - Direct submission should wait for OOF, worst-well, hidden-like, and feature parity review.

notes:
  - Implements the high-priority backlog item exact_replacement_prune_on_exp148.
  - Primary decision is whether removing only the 17 high-confidence replacement/duplicate columns preserves or improves the exp148 ML route anchor.
  - Follow-up candidates such as formation-last50 prune, learned-likelihood slim block, and U-projection slim review are intentionally excluded from this first drop-only run.

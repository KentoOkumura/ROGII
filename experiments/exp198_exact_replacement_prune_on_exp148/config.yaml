experiment:
  name: "exp198_exact_replacement_prune_on_exp148"
  description: Drop only high-confidence exact replacement, sign-flip, and constant duplicate columns from the exp148 learned-likelihood ML anchor.
  route: ml_model
  status: submitted_public_lb_7_930_not_adopted
  created_at: "2026-07-05"
  updated_at: "2026-07-05"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  prune_readout_parent: corr_prune_sanity_readout_on_exp148
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp092_u_projection_correction_disagreement_fullrun
    - exp162_learned_likelihood_rank_slot_on_exp148
    - exp180_learned_gr_window_matcher_features_on_exp148
    - exp185_last50_first_prefix_feature_rebuild_on_exp148
  implementation_source: exp198_exact_replacement_prune_on_exp148_train.py
  diff_summary: Keeps the exp148 base 196 features, exp092 U-projection correction/disagreement groups, exp145 learned-likelihood confidence group, residual target, split, and LightGBM config family fixed, then removes only the 17 columns identified by corr_prune_sanity_readout_on_exp148 as constants, exact duplicate deltas, sign-flipped U-projection residuals, or already-emitted base/public-replay replacement columns.

validation:
  strategy: groupkfold_by_well_exp148_surface_exact_replacement_prune_drop_only
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_and_exp145_full_train_ml_feature_cache_with_17_active_model_features_dropped
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache covers the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check.
    - The exact-prune columns are excluded only after the full exp148 train feature surface is assembled, so coverage and schema guards still verify the parent inputs before pruning.
    - No new features, direct TVT replacement, blend, postprocess, or hard gate are introduced.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


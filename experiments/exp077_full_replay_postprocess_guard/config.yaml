experiment:
  name: "exp077_full_replay_postprocess_guard"
  description: Conservative postprocess guard on top of the deterministic exp073 full replay ML anchor, plus fold-averaged LightGBM feature importance visualization.
  route: ml_model
  status: ml_route_postprocessed_anchor
  created_at: "2026-06-18"
  updated_at: "2026-06-18"

lineage:
  parent: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  cache_parent: exp072_exp063_full_replay_feature_cache
  implementation_source: exp063_full_replay_reproducibility_guard.py
  public_replay_source: public_notebook_replay_audit.py
  diff_summary: Reuses exp073 deterministic full replay OOF predictions and exp072 full replay train features to audit conservative postprocess policies. The training code still supports the exp073 LightGBM replay path and now saves fold/model feature importances plus a matplotlib mean-importance plot.

validation:
  strategy: exp073_oof_policy_audit
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: exp073_oof_rows
  leakage_policy:
    - Main postprocess audit reads exp073 OOF predictions; it does not fit a new supervised model.
    - Postprocess candidates are fixed small policies: residual clipping, tail-start fade, flat-prefix shrink, PF confidence clipping, and tiny PF-vs-ML gates.
    - Full replay features from exp072 are used only for target-free geometry/confidence guards and are joined by id.
    - Same-OOF policy ranking is considered diagnostic until a fixed policy is rerun through inference and checked against LB.
    - The copied exp073 LightGBM training path remains available only for optional rerun/importance generation.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp073_oof_predictions_local: /tmp/kaggle-output/exp073_gpu_reproducibility_guard_for_exp063_full_replay/train_v2/artifacts/exp063_full_replay_repro_guard_predictions.csv.gz

model:
  name: exp077_full_replay_postprocess_guard
  source_experiment: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  feature_source: exp072_exp063_full_replay_train_feature_cache
  expected_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp073-full-replay-repro-guard-train
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
    inference_kernel_sources:
      - kentookumura/exp073-full-replay-repro-guard-train

audit:
  mode: exp073_oof_postprocess_guard
  output_prefix: exp077_full_replay_postprocess_guard
  fast: false
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  clip_quantiles:
    - 0.99
    - 0.995
    - 0.999
  expected_train_artifacts:
    - exp077_full_replay_postprocess_guard_metrics.csv
    - exp077_full_replay_postprocess_guard_bucket_metrics.csv
    - exp077_full_replay_postprocess_guard_predictions.csv.gz
    - exp077_full_replay_postprocess_guard_summary.json
    - exp063_full_replay_repro_guard_feature_importance_by_fold.csv
    - exp063_full_replay_repro_guard_feature_importance_mean.csv
    - exp063_full_replay_repro_guard_feature_importance_mean_top40.png

inference:
  mode: saved_lgb_booster_inference_with_exp063_raw_test_feature_replay
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  postprocess_policy: longtail_likpf_tiny_gate_w006
  postprocess_params:
    pf_confidence_residual_clip:
      residual_clip_quantile: 0.995
      residual_clip_limit: 66.5908203125
      pf_std_p75: null
      beam_std_abs_p75: null
      min_instability: 1.0
      max_instability: 3.0
  model_manifest_path: null
  regenerate_test_features: true
  feature_generation:
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false
    use_gpu: auto
  notes:
    - Inference remains an optional port step after OOF policy selection.
    - The default inference path loads exp073 full replay saved boosters and regenerates raw test PF/Beam/likelihood-PF features with stable per-well seeds.

notes:
  - The user requested exp073_full_replay_postprocess_guard, but exp073 already exists. The correct incremented experiment id is exp077_full_replay_postprocess_guard.
  - This experiment starts from exp073 because exp073 is the current deterministic ML anchor.
  - Feature importance visualization is produced by averaging LightGBM gain importance over folds and model configs, then rendering a matplotlib horizontal bar plot.

    candidates:
      - exp226_k16
      - selfgr_hmm_a070
      - likpf_mean
      - exact_hmm
      - pf_ancc
      - beam_mean
      - exp226_w500_50_50

candidate_id_model_encoding:
  type: one_hot
  order_source: score_candidates_declared_order
  width: 12
  keep_string_id_in_artifacts: true
  ordinal_index_as_model_feature: false

confidence_contract:
  exact_hmm:
    confidence_valid: candidate_and_native_fields_are_finite
    sigma_tvt: student_t_df4_on_exp209_absolute_tvt_hmm_std
    source_loglik: student_t_df4_on_exp209_absolute_tvt_hmm_loglik
    loglik_per_row: source_loglik_divided_by_evaluation_rows_in_well
    output_namespace: confidence__exact_hmm
  preserve_parent_feature_names: true
  universal_proxy_required_for_every_candidate: true

forbidden_behaviors:
  - register_student_t_exact_hmm_as_a_thirteenth_candidate
  - retain_gaussian_exact_hmm_as_a_parallel_candidate
  - change_candidate_ids_order_or_legal_domains
  - leave_any_exact_hmm_dependent_formula_on_gaussian_values
  - refreeze_or_select_feature_columns_on_replacement_oof
  - use_truth_error_or_oracle_as_feature
  - use_source_fold_as_feature
  - tune_candidate_weight_usage_threshold_or_domain_on_same_oof
  - train_downstream_tvt
  - inference_or_submission

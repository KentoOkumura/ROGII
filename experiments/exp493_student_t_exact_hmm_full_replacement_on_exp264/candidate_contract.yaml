legal_domains:
  primitive_pair_bank:
    role: primary_meta_and_hard_readout_domain
    candidates:
      - exp226_k16
      - selfgr_hmm_a070
      - likpf_mean
      - exact_hmm
      - pf_ancc
      - beam_mean
      - exp226_k16__selfgr_hmm_a070
      - exp226_k16__exact_hmm
      - exp226_k16__likpf_mean
      - selfgr_hmm_a070__likpf_mean
      - likpf_mean__exact_hmm
  primitive_fixed_bank:

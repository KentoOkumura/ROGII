experiment:
  name: exp348_prefix_gr_unary_window_path_ranking_ssm
  description: >-
    Preserve the exp332 fixed-window path-level learning idea while replacing
    four-sweep exact structured NLL with a frozen positive-versus-negative path
    ranking loss and retaining full-well exact SSM evaluation.
  route: ensemble
  status: stage0_failed_branch_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-25"

lineage:
  parent: exp332_prefix_gr_unary_fixed_window_structured_ssm
  steering: ../../.steering/20260722-exp348-prefix-gr-unary-window-path-ranking-ssm
  references:
    - exp347_prefix_gr_unary_batched_window_exact_ssm
    - exp295_prefix_anchored_wholewell_gr_alignment_ssm
    - exp331_prefix_gr_unary_local_ce_exact_ssm
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp221_lgb_oof_gaussian_emission_hmm_on_exp148
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  diff_summary: >-
    Keeps the exp332 truth-free fixed window schedule, training-only teacher
    boundary, neural unary, local CE, fixed exp209 grammar, controls, and
    full-well exact decode. It replaces only the exact structured partition
    loss with a preregistered positive-versus-16-negative path ranking loss.
    The terminal exp332 experiment is not reopened.


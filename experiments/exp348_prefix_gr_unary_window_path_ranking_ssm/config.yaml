model:
  name: prefix_gr_unary_fixed_window_path_ranking_ssm
  estimator: pytorch_window_path_ranking_neural_unary_plus_full_exact_forward_backward
  target: typewell_tvt_state_of_true_horizontal_tvt
  sample_unit: well_window
  inference_neighbor_well_data: false
  candidate_bank: frozen_training_only_path_bank
  test_time_gradient_updates: false
  architecture_source: exp332_prefix_gr_unary_fixed_window_structured_ssm
  output: tvt_posterior_mean
  preprocessing:
    robust_center: finite_median
    robust_scale: 1p4826_mad_with_floor_1
    missing_fill_value_after_normalization: 0.0
    include_missing_mask: true
    typewell_extrapolation: false
    prefix_huber_summary:
      minimum_pairs: 32
      fallback: neutral_context
  inputs:
    horizontal_emission_channels: [gr_robust_z, gr_missing_mask, dgr_dmd]
    typewell_emission_channels: [gr_robust_z, gr_missing_mask, dgr_dtvt]
    transition_only_channels: [MD, X, Y, Z, TVT_input]
    prefix_context_sources: [horizontal_gr, typewell_gr_at_visible_tvt_input, visible_tvt_input_mask]
  architecture:
    horizontal_encoder: multiscale_1d_residual
    typewell_encoder: multiscale_1d_residual
    embedding_dim: 64
    dilations: [1, 2, 4, 8, 16]
    normalization: group_norm
    dropout: 0.10
    prefix_context_aggregator: masked_attention_pool
    prefix_context_dim: 32
    conditioning: prefix_context_film_scale_and_bias
    similarity: normalized_bilinear_cosine
    temperature: positive_prefix_conditioned_clamped
    temperature_min: 0.05
    temperature_max: 2.0
    temperature_initial: 0.25
    convolution_kernel_size: 3
    group_norm_groups: 8
    prefix_pair_embedding_dim: 64
    derivative_clip_abs: 8.0
    unary_row_chunk_size: 256
    streamed_row_tvt_unary: true
  training:
    objective:
      name: fixed_path_pairwise_softplus_ranking_plus_local_ce
      path_ranking_weight: 1.0
      local_true_state_ce_weight: 0.25
      margin_per_valid_row: 0.05
      label_observation_distribution: gaussian
      label_observation_sigma_ft: 0.35
      path_score: mean_valid_row_neural_unary_plus_fixed_transition_and_boundary_log_potential
      negative_reduction: mean_all_unique_negatives
      exact_partition_sweeps_per_window: 0
    windows:
      length_rows: 256
      scheduled_slots_per_well_per_epoch: 3
      maximum_active_windows_per_well_per_epoch: 3
      manifest_epochs: 8
      first_window: official_hidden_suffix_start
      remaining_windows: stable_sha256_nonoverlapping_eligible_suffix_starts
      interior_window_requires_full_length: true
      unavailable_slot_policy: inactive_zero_loss_no_duplicate_window
      maximum_fit_wells_fold0: 556
      maximum_windows_per_epoch: 1668
      maximum_scored_positions_per_epoch: 427008
      selection_uses_truth_or_error: false
      schedule_source: exp332_truth_free_stable_sha256_schedule
      interior_teacher_boundary: gaussian_tvt_observation_plus_quantized_rate_prior_loss_only
      teacher_boundary_position_sigma_source: model.state_space.start_sig
      official_prefix_only_in_encoder_context: true
    positive_path:
      count: 1
      generator: label_conditioned_viterbi_fixed_exp209_grammar
      label_observation_sigma_ft: 0.35
      generation_scope: outer_train_training_only_after_window_and_boundary_freeze
    negative_paths:
      maximum_count: 16
      minimum_unique_count: 12
      position_grid_index_offsets: [-57, -29, -14, 14, 29, 57]
      constant_rate_index_offsets: [-2, -1, 1, 2]
      midpoint_rate_pulse_rows: 32
      midpoint_rate_index_pulses: [-4, -2, 2, 4]
      include_saved_exp209_official_prefix_path: true
      include_geometry_only_fixed_grammar_path: true
      out_of_grid_policy: remove_as_invalid_no_clip
      duplicate_positive_or_negative_policy: deduplicate_and_require_minimum
      model_dependent_hard_negative_mining: false
      legal_projection:
        position_sigma_ft: 0.35
        rate_index_sigma: 0.25
    optimizer: adamw
    learning_rate: 0.0003
    weight_decay: 0.0001
    max_epochs: 8
    early_stopping_source: stable_outer_train_holdout_window_objective_only
    early_stopping_holdout_fraction: 0.10
    early_stopping_minimum_wells: 16
    early_stopping_patience_epochs: 2
    early_stopping_min_delta_nll_per_token: 0.001
    gradient_clip_norm: 1.0
    batch_size_well_windows: 1
    gradient_accumulation_windows: 4
    amp: true
    dataloader_shuffle: true
    dataloader_workers: 0
    require_cuda: true
    minimum_cuda_capability_major: 7
  state_space:
    source: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    training_use: fixed_legal_path_score_only_no_partition_function
    evaluation_use: exact_log_space_forward_backward_full_official_suffix
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
    known_prefix_policy: hard_clamp_finite_tvt_input
    solver: exact_log_space_forward_backward
    primary_readout: posterior_mean_tvt
    diagnostic_readouts: [marginal_map, global_viterbi, posterior_std, entropy, grid_edge_mass]
    learn_transition: false
  controls: [real_gr, stable_within_well_circular_shuffled_typewell_gr_same_trained_model, zero_gr_unary_geometry_only_same_trained_model]
  forbidden:
    - reopen_or_modify_exp332
    - concurrent_gpu_comparison_with_exp347
    - model_or_error_dependent_hard_negative_mining
    - negative_family_count_margin_or_temperature_grid
    - change_window_length_count_boundary_architecture_or_epoch
    - use_ranking_candidate_directly_as_validation_or_test_prediction
    - parent_or_control_retraining
    - inference_or_submission_before_promotion_and_approval


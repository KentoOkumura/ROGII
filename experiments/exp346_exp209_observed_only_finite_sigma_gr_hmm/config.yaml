model:
  name: exp209_observed_only_finite_sigma_exact_hmm
  estimator: none
  target: TVT
  active_variants: [observed_finite_std_missing_exp209_sigma]
  promotion_candidate: observed_finite_std_missing_exp209_sigma
  confidence_contract:
    certain_row_definition: raw_horizontal_gr_is_finite_before_interpolation
    uncertain_row_definition: raw_horizontal_gr_is_missing_before_interpolation
    learned_confidence: false
    threshold: none
  scale_schedule:
    residual_formula: raw_horizontal_gr_minus_typewell_gr_at_tvt_input
    affine_a: 1.0
    affine_b: 0.0
    observed_scale_estimator: population_standard_deviation_finite_known_prefix_pairs
    exp209_scale_estimator: population_standard_deviation_zero_filled_known_prefix_residuals
    minimum_finite_pairs: 20
    insufficient_or_nonfinite_fallback: exp209_zero_fill_sigma_same_well
    clip: [10.0, 60.0]
    raw_finite_evaluation_row: observed_finite_std
    raw_missing_evaluation_row: exp209_zero_fill_sigma_exact_parity
    gr_values_after_mask_freeze: exp209_linear_interpolate_both_directions_then_typewell_mean
  fixed_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    emission: gaussian_negative_half_min_z2_600_without_log_sigma
    emission_clip_z2: 600.0
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp
    output: posterior_mean
  readout:
    row_scopes: [all, raw_gr_observed, raw_gr_missing]
    missing_fraction_scopes: [low, mid, high]
    distance_scopes: [0_250, 250_1000, 1000_plus]
    well_scopes: [all, hidden_like_spatial, hidden_like_typewell_purged]
  forbidden:
    - finite_mad_or_robust_scale
    - sigma_multiplier_or_clip_grid
    - learned_confidence_or_threshold_search
    - missing_row_scale_or_weight_change
    - affine_or_mean_center_calibration
    - structure_variance
    - temperature_student_t_huber_or_mixture_emission
    - transition_prior_state_grid_or_output_change
    - blend_weight_grid
    - posthoc_rescue_on_same_predictions


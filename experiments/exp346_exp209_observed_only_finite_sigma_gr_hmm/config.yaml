experiment:
  name: exp346_exp209_observed_only_finite_sigma_gr_hmm
  description: >-
    Design-frozen exact-HMM audit that preserves the exp209 zero-fill GR scale
    on originally missing rows and uses a finite-only prefix standard deviation
    only on originally observed finite-GR rows.
  route: pf_beam
  status: train_side_observed_only_finite_sigma_gate_failed_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-23"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260722-exp346-exp209-observed-only-finite-sigma-gr-hmm
  references:
    - exp307_finite_only_robust_sigma_gr
    - exp308_imputed_gr_confidence_downweight
    - exp337_prefix_backtested_structure_sigma_gr
    - exp341_missing_gap_calibrated_soft_variance_exp226_residual_hmm
  diff_summary: >-
    Changes only the GR emission scale on raw finite evaluation rows. Raw
    missing rows retain the exact exp209 zero-fill scale and interpolated GR.
    GR preprocessing, Gaussian shape, state grammar, transitions, priors, and
    posterior output remain fixed.

implementation:
  enabled: true
  scope: train_side_candidate_audit_only
  train_notebook_state: canonical_adopted_from_compact_selfcontained
  canonical_notebook_adopted: true
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

validation:
  strategy: grouped_train_side_observed_only_sigma_exact_hmm_audit
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: tvt_input_unknown_suffix_only_after_prediction_freeze
  truth_attachment: after_raw_mask_scale_schedule_and_prediction_content_sha_are_frozen
  missing_fraction_buckets:
    low: [0.0, 0.10]
    mid: [0.10, 0.30]
    high: [0.30, 1.0]
    boundary_policy: left_closed_right_open_except_final_closed
  leakage_policy:
    - Raw GR finite mask and all scales use only inference-available raw GR and known-prefix TVT_input.
    - Unknown-suffix TVT, error, abs_error, and oracle labels are forbidden before schedule and prediction freeze.
    - Known TVT_input is allowed only for prefix scale, initial state, and initial rate.


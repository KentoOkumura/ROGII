model:
  name: fault_reset_duration_semimarkov_hmm
  estimator: deterministic_fixed_branch_semimarkov_hmm
  state: [position, rate, reset_jump, remaining_duration]
  trigger: fixed_from_stage_0
  reset:
    position_jumps_ft: [-12.6, -6.3, 6.3, 12.6]
    position_grid_step_ft: 0.35
    position_grid_jump_cells: [-36, -18, 18, 36]
    horizons_rows: [128, 256, 512]
    rate_state_at_entry: copy_base_branch_rate_distribution
    base_branch_always_retained: true
    commit_log_evidence_margin: 5.0
    overlapping_trigger_policy: ignore_until_refractory_end
  fixed_from_exp209:
    - within_branch_position_and_rate_transition
    - grids_and_momentum
    - gaussian_emission_and_sigma
    - posterior_mean_output
  fixed_emission:
    family: gaussian
    squared_z_clip: 600.0
    likelihood_weight: 1.0
    sigma_mode: known_prefix_zero_fill_population_std
    sigma_clip: [10.0, 60.0]
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
  fixed_grid:
    position_grid_step_ft: 0.35
    band_pad_ft: 100.0
    typewell_outer_pad_ft: 40.0
  forbidden:
    - horizontal_gr_atlas
    - true_error_or_oracle_trigger
    - rate_prediction_from_prefix_or_geometry
    - global_or_overlapping_branch_spawn
    - unlimited_beam
    - jump_horizon_margin_or_trigger_grid
    - softmax_branch_average
    - blend_or_selector
    - parent_control_rerun


experiment:
  name: "exp366_fault_reset_duration_semimarkov_hmm"
  description: >-
    Add target-free triggered, fixed-jump, explicit-duration reset branches to
    exp209 without an atlas, after a trigger and branch-coverage preflight.
  route: pf_beam
  status: completed_stage0_gate_failed_closed
  created_at: "2026-07-23"
  updated_at: "2026-07-25"

implementation:
  enabled: true
  scope: stage0_trigger_and_fixed_branch_preflight_only
  stage_0_implemented: true
  stage_1_implemented: false
  compact_selfcontained_source_created: true
  canonical_notebook_adopted: true
  canonical_notebook_adoption_approval_source: user_message_execute_exp366
  regular_notebook_preserved_as_placeholder: false
  helper_code_created: false
  tests_created: true
  kaggle_package_created: true
  inference_enabled: false
  submission_enabled: false

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260723-exp366-fault-reset-duration-semimarkov-hmm
  references:
    - exp289_fault_risk
    - exp290_piecewise_datum_semimarkov
    - exp231_peer_atlas_emission
  diff_summary: >-
    At a fixed target-free GR change plus exp209 emission-surprise trigger,
    retain the base branch and create twelve branches from four bounded TVT
    jumps and three fixed durations. Within each branch exp209 is unchanged.
    No atlas, rate predictor, global branch spawning, or oracle commit is used.

validation:
  strategy: trigger_and_fixed_branch_preflight_then_semimarkov_hmm
  metric: rmse
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  expected_rows: 3783989
  expected_wells: 773
  group_column: well_id
  score_rows: unknown_suffix_only
  truth_attachment: after_trigger_branch_path_and_score_sha_freeze
  stage_0:
    name: saved_exp209_trigger_and_branch_coverage_readout
    hmm_well_runs: 0
    evaluation_horizon_rows: 512
    incomplete_horizon_policy: exclude
    fold_assignment: sklearn_group_kfold_on_fixed_eligible_row_ledger
    trigger:
      gr_change_transform: absolute_first_difference_then_median_1p4826mad_z
      gr_change_robust_z_quantile_from_known_prefix: 0.995
      emission_surprise: exp209_gaussian_negative_log_emission
      exp209_emission_surprise_quantile_from_known_prefix: 0.995
      combine: logical_and
      refractory_rows: 512
      negative_control_shift_rows: 512
    branches:
      position_jumps_ft: [-12.6, -6.3, 6.3, 12.6]
      horizons_rows: [128, 256, 512]
      order: base_then_abs_jump_then_sign_then_duration
      path_contract: >-
        Use the saved exp209 posterior-mean path over one fixed 512-row
        evaluation horizon. A reset branch adds its fixed jump, clips it to the
        unchanged exp209 position grid, holds it for exactly its configured
        duration, and then returns to the saved base path.
      score: cumulative_exp209_gaussian_gr_log_emission_over_fixed_512_row_horizon
      selected_branch: maximum_score_with_frozen_branch_order_tie_break
      truth_rank_after_freeze: minimum_fixed_512_row_tvt_rmse
    freeze_before_truth:
      - trigger_rows
      - branch_paths
      - branch_gr_scores
      - selected_branch
      - reporting_fold_assignment
    bad_event_label_after_freeze: exp209_fixed_512_row_horizon_rmse_ge_10ft
    negative_control: within_well_circular_shift_of_accepted_trigger_score_by_512_rows
    hidden_like_direction_metric: selected_branch_rmse_gain_vs_base_ft
    all_required:
      minimum_trigger_bad_event_auc: 0.60
      minimum_auc_gain_over_circular: 0.05
      trigger_row_fraction_range: [0.001, 0.10]
      minimum_alternative_branch_within10_coverage: 0.60
      minimum_selected_branch_mrr_gain_vs_base_first: 0.01
      minimum_passing_folds: 4
      require_positive_both_hidden_like_directions: true
  stage_1:
    enabled_only_after_stage_0_pass_and_separate_user_approval: true
    semimarkov_hmm_well_runs: 773
    all_required:
      minimum_rmse_gain_vs_exp209_ft: 0.05
      minimum_improved_folds: 4
      maximum_1000_plus_regression_ft: 0.02
      maximum_hidden_like_spatial_regression_ft: 0.02
      maximum_hidden_like_typewell_purged_regression_ft: 0.02
      maximum_by_well_p95_regression_ft: 0.02
      maximum_worst_well_regression_ft: 0.25


experiment:
  name: exp443_mean_preserving_trapezoidal_lattice_hmm
  description: >-
    Revisit the exp439 trapezoidal joint rate-position edge with a
    lattice-feasible contract: preserve the continuous trapezoidal mean
    exactly and set conditional variance to the larger of the parent target
    variance and the unavoidable two-neighbor lattice variance.
  route: pf_beam
  status: stage0_fail_closed_v1
  created_at: "2026-07-29"
  updated_at: "2026-07-30"
  inference_enabled: false

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  references:
    - exp408_hmm_message_rate_basin_audit
    - exp438_u_state_fixed_lattice_exact_hmm
    - exp439_continuous_kinematic_joint_transition_exact_hmm
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep the exact exp209 adjacent rate marginal and all HMM contracts, but
    compute each legal rate edge's TVT displacement using the source/destination
    trapezoidal mean. Unlike exp439, accept and audit the minimum variance
    forced by the 0.35-ft lattice instead of demanding an infeasible smaller
    variance.


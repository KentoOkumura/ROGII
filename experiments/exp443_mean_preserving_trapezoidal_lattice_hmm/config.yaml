model:
  name: mean_preserving_trapezoidal_lattice_exact_hmm
  estimator: deterministic_exact_forward_backward
  state: [tvt_position, u_rate]
  fixed_from_exp209:
    position_grid_step_ft: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    effective_position_sigma_ft: 0.1225
    momentum: 0.998
    emission: gaussian_typewell_gr
    emission_lambda: 1.0
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    rate_center: zero
    rate_boundary_semantics: preserve_parent_substochastic_outward_mass
    position_band_boundary_semantics: preserve_parent_truncation
    output: smoothed_posterior_mean_and_std
  active_scientific_variants:
    - trapezoidal_mean_lattice_variance_floor
  candidate_joint_transition:
    rate_marginal: exact_exp209_adjacent_three_state_kernel
    conditional_position_mean_formula: 0.5*(r_source+r_destination)*delta_MD-delta_Z
    lower_neighbor_formula: floor(mu/position_grid_step)*position_grid_step
    upper_neighbor_formula: lower_neighbor+position_grid_step
    minimum_lattice_variance_formula: (mu-lower_neighbor)*(upper_neighbor-mu)
    parent_target_variance_formula: max(sig_p,0.35*position_grid_step)^2
    effective_variance_formula: max(parent_target_variance,minimum_lattice_variance)
    projection: nonnegative_five_cell_maximum_entropy
    constraints: [probability_sum, exact_conditional_mean, effective_conditional_variance]
    support_cells: 5
    fail_if_formula_or_projection_contract_violated: true
    numerical_dtype: float64
    solver:
      maximum_iterations: 80
      moment_tolerance: 1.0e-12
      feasibility_tolerance: 1.0e-13
      damping_min: 9.5367431640625e-7
    hmm_message_dtype: float32
  forbidden:
    - exact_parent_variance_claim_when_below_lattice_floor
    - grid_step_support_width_sig_p_or_variance_floor_tuning
    - rate_kernel_rate_grid_momentum_or_sig_r_change
    - gr_emission_prior_readout_trigger_reset_or_reanchor_change
    - blend_selector_gate_or_same_oof_rescue

gates:

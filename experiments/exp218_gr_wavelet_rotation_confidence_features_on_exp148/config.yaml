    - multiobs_top1_mae
    - multiobs_top1_ncc
  feature_cache:
    include_candidate_tvt: true
    include_multiobs_scores: true
    include_probability_features: true
    include_expected_error_features: true
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng_and_deterministic_wavelet_fft_feature_generation
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - gpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; GRWR feature generation is deterministic per well and has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a full-train add-only feature audit that became the ML route submitted anchor after inference v1 scored Public LB 7.843.
    - GR wavelet/FFT feature generation is target-free and does not use hidden-tail true TVT.
    - Raw-test GRWR feature generation was added in inference v1 using the same target-free builder on the current test directory.


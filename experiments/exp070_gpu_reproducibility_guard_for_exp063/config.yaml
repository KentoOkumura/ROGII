experiment:
  name: "exp070_gpu_reproducibility_guard_for_exp063"
  description: LightGBM reproducibility guard for exp063 using fixed exp063 PF/Beam tracker feature outputs.
  route: ml_model
  status: implemented
  created_at: "2026-06-13"
  updated_at: "2026-06-13"

lineage:
  parent: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
  implementation_source: exp063_reproducibility_guard.py
  diff_summary: Train uses the exp063 generated PF/Beam/likelihood-PF tracker feature frame as fixed input and retrains only the public Pixiux LightGBM config family with reproducibility-focused hyperparameter modes. Inference regenerates exp063 public replay PF/Beam/likelihood-PF features from the current raw test files before applying the exp070 saved LightGBM boosters.

validation:
  strategy: groupkfold_by_exp063_well
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - PF/Beam/likelihood-PF features are read from exp063 output artifact ravaghi_vs_pixiux_public_replay_tracker_features_train.csv.gz.
    - The supervised target is exp063 target, defined as TVT minus last_known_tvt.
    - GroupKFold is grouped by exp063 well; a well never appears in train and validation in the same fold.
    - Train-side audit does not run raw PF/Beam, likelihood-PF, CatBoost, Ridge stack, final public blend, static visible override, or projection postprocess.
    - Inference regenerates only test-side exp063 public replay PF/Beam/likelihood-PF features from raw test files so hidden test rows are supported.
    - This is a reproducibility guard, not a feature-improvement experiment.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp063_tracker_features_train_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_tracker_features_train.csv.gz
  exp063_tracker_features_test_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_tracker_features_test.csv.gz
  exp063_oof_predictions_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_oof_predictions.csv.gz
  exp063_summary_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_summary.json

model:
  name: exp063_tracker_lgbm_reproducibility_guard
  source_experiment: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
  feature_source: exp063_tracker_features_train
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; included for optional rerun comparison.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp063-ravaghi-pixiux-strict-replay-train
    inference_kernel_sources:
      - kentookumura/exp070-gpu-repro-guard-exp063-train

audit:
  mode: exp063_lgbm_reproducibility_guard_from_saved_tracker_features
  output_prefix: exp063_repro_guard
  expected_train_artifacts:
    - exp063_repro_guard_metrics.csv
    - exp063_repro_guard_by_well.csv
    - exp063_repro_guard_predictions.csv.gz
    - exp063_repro_guard_feature_schema.csv
    - exp063_repro_guard_summary.json
    - exp063_repro_guard_lgb_models/manifest.json
  notes:
    - Default package for this guard is GPU-only.
    - Run the same GPU-only Kaggle train package twice before trusting bitwise reproducibility.
    - Do not include CPU modes in the same GPU-enabled package because CPU execution also spends GPU session wall time.
    - Compare metrics.csv pooled RMSE, prediction_sha256, and model file sha256 values across versions.

inference:
  mode: saved_lgb_booster_inference_with_exp063_raw_test_feature_replay
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  model_manifest_path: null
  regenerate_test_features: true
  feature_generation:
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false
    use_gpu: auto
  notes:
    - Loads exp070 train saved boosters from kernel source kentookumura/exp070-gpu-repro-guard-exp063-train.
    - Regenerates exp063 public replay tracker/PF/Beam/likelihood-PF test features from current competition raw test files.
    - The saved exp063 tracker test feature file is no longer used for the primary inference path because it is tied to the public replay sample_submission rows.
    - Writes submission.csv for one LB check.

notes:
  - Train feature input is the compact exp063 tracker/PF/Beam output frame.
  - Inference regenerates the same exp063 public replay test feature family from raw test files to support hidden test rows.
  - Inference also uses GPU metadata to match large-scale submission conditions.

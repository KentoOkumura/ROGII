experiment:
  name: exp499_exp490_cross_fitted_well_application_selector
  description: >-
    Test whether target-free well signatures can cross-fittedly choose between
    the saved exp490 mean-reverting HMM and its saved exp357 parent before
    suffix truth is known. This is a train-OOF selector readout only.
  route: ensemble
  status: completed_fail_closed
  created_at: "2026-08-01"
  updated_at: "2026-08-01"

lineage:
  parent: exp490_geometry_centered_mean_reverting_offset_hmm
  fallback: exp357_exp226_huber_emission_independent_audit
  physics_feature_parent: exp498_geometry_mean_reversion_tail_regime_physics_readout
  steering: ../../.steering/20260801-exp499-exp490-cross-fitted-well-application-selector
  diff_summary: >-
    Adds one strict-nested target-free well selector over frozen exp490 and
    exp357 OOF predictions. It does not regenerate or change either candidate.

implementation:
  enabled: true
  scope: saved_full_oof_cross_fitted_well_application_selector_readout
  train_notebook_state: compact_selfcontained_canonical_adopted
  inference_notebook_state: guarded_disabled_canonical_adopted
  canonical_notebook_adopted: true
  compact_train_candidate: exp499_exp490_cross_fitted_well_application_selector_compact_selfcontained_train.py
  compact_train_notebook_candidate: exp499_exp490_cross_fitted_well_application_selector_compact_selfcontained_train.ipynb
  inference_enabled: false
  submission_enabled: false
  kaggle_run_completed: true
  kaggle_kernel_id: kentookumura/exp499-exp490-cross-fitted-well-selector-train
  kaggle_kernel_id_no: 129362815
  kaggle_kernel_version: 2
  technical_passed: true
  predictability_supported: false
  safe_router_supported: false
  deployment_eligible: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds

validation:
  strategy: outer5_held_well_with_inner4_policy_selection
  metric: rmse_tvt
  seed: 42
  n_folds: 5
  group_column: well
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  signed_target: exp357_parent_rmse_squared_minus_exp490_candidate_rmse_squared
  row_weight: suffix_rows
  apply_rule: predicted_signed_mse_benefit_gt_zero
  model_selection_metric: inner_oof_routed_rmse
  tie_tolerance_ft: 0.01
  tie_priority: [always_exp490, weighted_ridge, weighted_hist_gradient_boosting]
  leakage_policy:
    - Freeze target-free feature content and schema before reading fold or outcome metrics.
    - Never expose fold, truth, candidate error, parent error, or truth-derived roles to a selector.
    - Select model family only on the four outer-train folds using inner OOF scores.
    - Keep the routing threshold fixed at zero; do not tune it on outer-valid outcomes.

data:
  exp490_merge_source:
    kernel_id: kentookumura/exp490-mean-revert-full-merge
    kernel_version: 1
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp490-mean-revert-full-merge/artifacts
      - /kaggle/input/exp490-mean-revert-full-merge/artifacts
      - /tmp/kaggle-output/exp490_geometry_centered_mean_reverting_offset_hmm/merge_v1/artifacts
  exp498_feature_source:
    kernel_id: kentookumura/exp498-geometry-mean-reversion-tail-regime-train
    kernel_version: 2
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp498-geometry-mean-reversion-tail-regime-train/artifacts

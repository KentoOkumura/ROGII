        - geometry_mean_reverting_delta_mean
        - geometry_mean_reverting_hmm_std
        - exp357_parent_prediction
        - exp226_pred
      forbidden_before_freeze:
        - fold
        - true_tvt_readout_only
        - candidate_error
        - parent_error
        - exp226_error
    exp490_by_well_metrics:
      filename: exp490_geometry_centered_mean_reverting_offset_hmm_stage1_full_oof_by_well_metrics.csv
      sha256: 65abf0131d06473980d71410ae931aa21e4c5b4a90d7975024c32713ecdba076
      phase: post_feature_freeze_outcome_only
    exp498_features:

features:
  exp498_columns:
    - rows
    - visible_prefix_rows
    - suffix_horizon_md
    - k16_median_segment_span_ft
    - prefix_gr_sigma
    - prefix_gr_information_ratio
    - geometry_disagreement_median_ft
    - early_abs_offset_ft
    - state_uncertainty_median_ft
  suffix_aggregates:
    parent_exp226_abs: [mean, std, q90]
    parent_geometry_abs: [mean, q90]
    candidate_parent_abs: [mean, std, q90]
    candidate_exp226_abs: [mean, q90]
    candidate_geometry_abs: [mean, q90]
    delta_abs: [mean, q90]
    posterior_std: [mean, q90]
  early128_means:
    - parent_exp226_abs
    - candidate_parent_abs
    - delta_abs
    - posterior_std
  roughness_means:
    - parent_prediction
    - candidate_prediction
    - exp226_prediction
  expected_count: 32
  transform:
    nonnegative: log1p
    scaler: median_imputer_then_standard_scaler_for_ridge

model:
  name: strict_nested_signed_benefit_router
  prediction_target: signed_mse_benefit_ft2_per_row
  configs:
    weighted_ridge:
      alpha: 100.0
      fit_intercept: true
    weighted_hist_gradient_boosting:
      learning_rate: 0.03
      max_iter: 120
      max_leaf_nodes: 7
      min_samples_leaf: 40
      l2_regularization: 25.0
      early_stopping: false
      random_state: 42
  sample_weight: rows_divided_by_training_mean_rows


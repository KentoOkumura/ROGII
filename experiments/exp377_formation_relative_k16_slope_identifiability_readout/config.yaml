experiment:
  name: exp377_formation_relative_k16_slope_identifiability_readout
  description: >-
    Decompose exp226-style K16 structural-position slopes relative to six
    train-only formation surfaces and audit whether the reconstructed slopes
    transfer to outer-valid wells before any HMM, PF, or fitted model is used.
  route: pf_beam
  status: kaggle_cpu_v2_completed_stage1_scientific_fail_closed
  created_at: "2026-07-24"
  updated_at: "2026-07-24"

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  formation_reference_parent: exp287_fold_safe_formation_74_addonly_on_exp264
  negative_reference: exp376_exp226_formation_conditioned_k16_donor_kernel
  downstream_if_pass:
    - exp378_formation_relative_exp226_multisurface_candidate_audit
    - exp379_formation_transition_mixture_exact_hmm
    - exp380_formation_stratified_multimode_pf
  diff_summary: >-
    Keep exp226's outer five-fold split, K16 row boundaries, directional
    projection, XY-nearest-50 local-linear kernel, 500 ft bandwidth, and ridge
    fixed. Replace the interpolated quantity dS/dMD, S=TVT+Z, with six
    d(S-F_f)/dMD fields and add back dF_f/dMD from an outer-train-only
    FormationPlaneKNN(k=10). The primary is the pre-registered median of all six
    reconstructed rates. This experiment creates diagnostic rates and paths
    only; it does not create an inference candidate or submission.

validation:
  strategy: exp226_outer5_groupfold_role_safe_formation_readout
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_segments: 12368
  expected_folds: [0, 1, 2, 3, 4]
  primary: robust_median_across_6_formations
  scopes:
    h512:
      kind: suffix_offset_less_than
      value: 512
      notes: unknown suffix first 512 rows
    long401:
      kind: well_suffix_rows_at_least
      value: 401
      notes: all rows from wells whose unknown suffix has at least 401 rows
    clean273:
      kind: pooled_contract_alias
      notes: >-
        clean273 is a feature allowlist, not a target-derived row subset. The
        diagnostic uses no ML feature surface, so this guard is an explicit
        pooled alias rather than an invented well subset.
  leakage_policy:
    - Outer-valid objects are loaded from X/Y/Z/MD/TVT_input only before freeze.
    - Outer-valid TVT and all six raw formation columns have zero pre-freeze reads.
    - Outer-train donor TVT and formation columns are opened only inside that fold.
    - Fold assignment and row identity come from the saved exp226 OOF allowlist.
    - Truth is joined only after the complete Stage 0 bundle and logical SHA freeze.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  raw_train_dir_patterns:
    - data/raw/train
    - /kaggle/input/rogii-wellbore-geology-prediction/train
    - /kaggle/input/competitions/rogii-wellbore-geology-prediction/train
  raw_horizontal_glob: "*__horizontal_well.csv"
  target_column: TVT
  visible_prefix_column: TVT_input
  coordinate_columns: [X, Y, Z, MD]
  formation_columns: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
  structural_position_formula: S=TVT+Z
  exp226_oof:
    filename: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
    patterns:
      - /tmp/kaggle-output/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/train_v1/artifacts/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
      - /kaggle/input/notebooks/kentookumura/exp226-k16-kappa-repro-train/artifacts/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
      - /kaggle/input/exp226-k16-kappa-repro-train/artifacts/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
    expected_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
    pre_freeze_columns: [well_id, row_idx, suffix_offset, fold]
    forbidden_pre_freeze_columns: [tvt_true, TVT, error, abs_error, oracle_rank]

method:
  segment_count: 16
  segment_boundary: exp226_numpy_linspace_searchsorted_left
  segment_rate_estimator: median_of_finite_positive_md_step_rates
  directional_projection:
    theta0_deg: 118.4
    minimum_abs_projection: 0.3
  donor_kernel:
    family: exp226_xy_local_linear
    nearest_segments: 50
    bandwidth_ft: 500.0
    ridge: 1.0
    stable_tie_order: [distance, donor_well_id, donor_segment_id]
  formation_surface:
    family: FormationPlaneKNN
    reference_statistic: well_median
    nearest_wells: 10
    reference_scope: outer_train_only
    query_scope: outer_valid_segment_endpoints
    fallback: inverse_distance_weighted_k10
    self_exclusion: true
  candidate_order:
    - frk16_ANCC
    - frk16_ASTNU
    - frk16_ASTNL
    - frk16_EGFDU
    - frk16_EGFDL
    - frk16_BUDA
    - frk16_robust_median6
  primary_aggregation:
    family: median
    minimum_finite_formations: 6
    posthoc_surface_selection: forbidden
  formula: >-
    reconstructed dS/dMD =
    XYKernel[d(S-F_f)/dMD divided by directional projection]
    times target directional projection + FormationPlaneKNN dF_f/dMD
  output_type: diagnostic_readout_only

model:
  name: diagnostic_only_no_fitted_model
  estimator: deterministic_geometry_readout
  trained_models: 0


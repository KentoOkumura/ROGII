experiment:
  name: exp450_dzdmd_conditioned_tvt_rate_likelihood_pf
  description: >-
    Design-frozen one-factor likelihood-PF ablation that expresses the
    particles as TVT and TVT-rate, fits a well-local affine TVT-rate mean from
    visible-prefix dZ/dMD, and applies persistence only to the residual rate.
  hypothesis: >-
    Restoring known-Z forcing through a visible-prefix affine transition
    center can avoid exp446's under-response failure while retaining an
    interpretable TVT-rate state.
  route: pf_beam
  status: stage0b_mechanism_failed_closed
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp417_scale5_seed_aggregation_promotion_audit
  exact_pf_implementation_reference: exp404_scale5_sigma_gr_likelihood_pf_ablation
  prefix_affine_reference: exp072_exp063_full_replay_feature_cache
  negative_mechanism_reference: exp446_persistent_tvt_rate_exact_hmm
  exact_coordinate_reference: exp445_tvt_to_u_coordinate_parity_exact_hmm
  mechanism_manifest_reference: exp411_predictive_filtered_rate_innovation_destick
  steering: ../../docs/legacy/steering/20260730-exp450-dzdmd-conditioned-tvt-rate-likelihood-pf
  diff_summary: >-
    Re-express exp404's U/r_U particles as TVT/q particles and replace only
    the exact transformed q transition center with a well-local visible-prefix
    OLS mean mu_t=beta*dZ/dMD_t+intercept. Persist q_t-mu_t with the original
    0.998 momentum. Keep initialization in exact parent coordinates and keep
    every PF, emission, resampling, roughening, seed, and temperature-5
    aggregation setting fixed. Do not add PF_Z's rate likelihood.


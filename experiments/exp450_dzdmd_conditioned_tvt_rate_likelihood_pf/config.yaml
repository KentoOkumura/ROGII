model:
  name: visible_prefix_affine_dzdmd_conditioned_tvt_rate_likelihood_pf
  estimator: stochastic_likelihood_weighted_particle_filter
  active_scientific_variants: [learned_prefix_affine_residual_ar]
  particle_state:
    position: tvt
    rate: q_equals_d_tvt_d_md
    weight: normalized_gr_likelihood_weight
  prefix_affine_fit:
    scope: same_well_visible_prefix_only
    response: delta_tvt_input_divided_by_delta_md
    covariate: delta_z_divided_by_delta_md
    valid_step: delta_md_positive_and_all_terms_finite
    estimator: unweighted_ordinary_least_squares_with_intercept
    implementation_reference: numpy_linalg_lstsq
    minimum_valid_steps: 10
    fallback_beta: -1.0
    fallback_intercept: 0.0
    fallback_on_nonfinite_coefficients: true
    coefficient_clip: null
    coefficient_shrinkage: null
    regularization: null
  transition:
    g_t: delta_z_divided_by_parent_compatible_delta_md
    mu_t: beta_times_g_t_plus_intercept
    formula: q_t_equals_mu_t_plus_momentum_times_q_previous_minus_mu_previous_plus_rate_noise
    position_formula: tvt_t_equals_tvt_previous_plus_q_t_times_delta_md_plus_position_noise
    previous_mu_initialization: fitted_mu_at_last_finite_visible_prefix_g
    previous_g_fallback: 0.0
    first_suffix_previous_z: last_visible_prefix_z
    delta_md_policy: max_raw_delta_md_and_1p0_as_in_parent
    exact_parent_coordinate_sentinel:
      beta: -1.0
      intercept: 0.0
      scientific_candidate: false
      formula: q_t_equals_momentum_times_q_previous_plus_g_previous_minus_g_t_plus_noise
  initialization:
    position_center: last_visible_tvt_input
    position_spread_ft: 4.5
    parent_initial_u_rate: tail30_median_delta_tvt_input_plus_delta_z_divided_by_delta_md
    parent_initial_u_rate_minimum_valid_steps: 3
    parent_initial_u_rate_fallback: 0.0
    q_center: parent_initial_u_rate_minus_last_finite_prefix_g
    q_spread: 0.01
  fixed_from_exp404:
    particles: 500
    seeds: 128
    primary_seed_weighting_temperature: 5.0
    gr_emission: capped_gaussian
    gr_emission_clip_z2: 600.0
    gr_scale_multiplier: 1.0
    base_scale_clip: [10.0, 60.0]
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    rough_position: 0.1
    rough_rate: 0.001
    resample_threshold_fraction: 0.5
    typewell_grid_step_ft: 0.2
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32
  explicitly_not_imported_from_pf_z:
    - rate_likelihood
    - residual_zsig_noise_or_weight
    - smoothed_gr_mixture
    - pf_z_initial_position_or_rate_spread

mechanism_readout:
  prefix_fit_ledger:

    minimum_fit_valid_steps: 10
    candidate: learned_affine_mu
    control: exact_coordinate_mu_equals_negative_g
    target_free: true
    selector_use: forbidden
  suffix_after_freeze:
    rate_readout: finite_difference_of_prediction_including_last_visible_tvt
    compare_to: saved_exp404_prediction
    scopes:
      - zero_directed_under_response
      - forward_cause_episodes
      - persistent_episodes
      - matched_control_wells


  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: tvt_input_missing_evaluation_suffix
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  primary_control: exp404_exp417_likpf_scale5_x1p0
  primary_control_rmse_ft: 10.914522073
  fixed_hmm_pf_50_50_control_rmse_ft: 10.084909679560383
  primary_candidate: likpf_scale5_dzdmd_conditioned_tvt_rate
  gain_definition: primary_control_rmse_minus_candidate_rmse
  truth_attachment: after_prefix_fit_ledger_all_candidate_predictions_diagnostics_schema_and_logical_content_sha_are_frozen
  leakage_policy:
    - Prefix OLS reads only finite visible-prefix TVT_input, MD, and Z steps from the same well.
    - Prefix coefficients and diagnostics are frozen before unknown-suffix truth, error, role, episode, or fold score is read.
    - Candidate PF generation reads suffix MD, Z, and GR but not suffix TVT.
    - Type Well TVT is an allowed reference-curve coordinate, as in exp404.
    - Fixed32 membership and episode definitions are immutable saved manifests and cannot select a successful coefficient or well after prediction.


    - upstream_exp145_learned_likelihood_feature_generator_cache
    - cpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; GRWR and well-scaled z/dz feature generation are deterministic per well and have no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a full-train add-only feature audit on top of exp218, the current ML route submitted anchor after inference v1 scored Public LB 7.843.
    - GR wavelet/FFT feature generation is target-free and does not use hidden-tail true TVT.
    - Well-scaled z/dz feature generation is target-free and uses same-well feature-frame statistics only.


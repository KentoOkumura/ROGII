    status: not_submitted
    public_lb: null
    private_lb: null
    submission_sha256: null
    adopted_as_ml_route_submitted_anchor: false
    adopted_as_overall_anchor: false
  notes:
    - Inference is prepared but not run until train_lgb0/lgb1/lgb2 CV, feature importance, 100-1000 bucket, and worst-well readout justify it.
    - Saved-booster inference requires an aggregate manifest or explicit handling of the three split train outputs.
    - Current-test GRWR and well-scaled z/dz feature generation use the same target-free builders as train.
    - Do not submit a direct z-scale correction, candidate replacement, blend, postprocess, hard selector, or sample-weight variant as this artifact.

notes:
  - Implements the `well_scaled_z_dz_features_on_exp218` backlog item as exp224.
  - Planned Kaggle train cost is 1 active add-only variant, 3 CPU LightGBM config splits, 5 folds each, 15 boosters total.
  - Parent/control retraining is not included; exp218 CV/Public LB are historical baselines.
  - The train code is CPU-only and split into train_lgb0, train_lgb1, and train_lgb2 notebook packages to reduce timeout risk.
  - likPF p05-p95 range scaling is a feature scale only and must not be used as candidate correction.
  - Direct z-scale correction, replacement, blend, postprocess, hard gate, and sample-weight changes remain out of scope.

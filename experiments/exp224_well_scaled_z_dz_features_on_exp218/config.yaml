model:
  name: exp224_well_scaled_z_dz_features_on_exp218_lgbm
  source_experiment: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  base_surface_experiment: exp092_u_projection_correction_disagreement_fullrun
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  learned_likelihood_feature_experiment: exp145_learned_likelihood_rawtest_feature_generator_parity
  gr_signal_feature_experiment: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  z_scale_feature_experiment: exp224_well_scaled_z_dz_features_on_exp218
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_exp145_full_train_ml_features_plus_target_free_grwr_wavelet_rotation_features_plus_well_scaled_z_dz_features
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  gr_wavelet_rotation_confidence_features:
    prefix: grwr_
    feature_group: gr_wavelet_rotation_confidence
    prefix_slope_window_rows: 80
    slope_clip: [-3.0, 3.0]
    local_windows_rows: [33, 65, 129]
    candidate_match_offsets_rows: [-32, -24, -16, -8, 0, 8, 16, 24, 32]
    typewell_smooth_window: 5
    ncc_weight: 8.0
    wavelet:
      name: db4
      level: 3
      fallback_window: 65
    fft:
      detrend: linear
      top_k_notch: 3
      rotation_band_norm: [0.06, 0.35]
      high_frequency_norm: 0.35
    denoise_filters:
      rolling_median_11:
        kind: rolling_median
        window: 11
      savgol_31_p2:
        kind: savgol
        window: 31
        polyorder: 2
    default_candidate: likpf_mean
    candidate_match_names: [pf_ancc, beam_mean, likpf_mean, sc_ens, hyb]
    candidate_tvt_specs:
      - name: pf_ancc
        column: pf_ancc
        kind: absolute
      - name: beam_mean
        column: beam_mean_d
        kind: delta
      - name: likpf_mean
        column: likpf_mean_d
        kind: delta
      - name: sc_ens
        column: sc_ens_d
        kind: delta
      - name: hyb
        column: hyb_d
        kind: delta
      - name: tvt_dense
        column: tvt_dense_d
        kind: delta
      - name: tvt_densew
        column: tvt_densew_d
        kind: delta
      - name: tvt_dense50
        column: tvt_dense50_d
        kind: delta
  well_scaled_z_dz_features:
    prefix: wsz_
    feature_group: well_scaled_z_dz
    source_columns: [z, dz, dzdmd, slp_z]
    scaled_interaction_columns: [z, dz]
    min_scale: 1.0e-6
    include_likpf_range_scale: true
    likpf_base_column: last_known_tvt
    likpf_delta_column: likpf_mean_d
    likpf_range_quantiles: [0.05, 0.95]
    raw_interaction_columns: [gr]
    grwr_interaction_columns:
      - grwr_fft_rotation_ratio_x_log1p_md_since
      - grwr_candidate_tvt_std
      - grwr_candidate_tvt_range
      - grwr_known_prefix_fraction
  feature_ablation:
    selected_variant: well_scaled_z_dz_addonly
    active_variants:
      - name: exp218_anchor_control
        description: Disabled by cost guard; use completed exp218 CV/Public LB as the comparison baseline unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
          - gr_wavelet_rotation_confidence
        enabled: false
      - name: well_scaled_z_dz_addonly
        description: Adds target-free well-level robust scaled z/dz/dzdmd/slp_z, likPF p05-p95 range scale, and limited GR/GRWR interactions on top of exp218.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
          - gr_wavelet_rotation_confidence
          - well_scaled_z_dz
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    lgb_config_splits: [0, 1, 2]
    active_modes:
      - cpu_deterministic_threads8
    modes:
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM training with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:

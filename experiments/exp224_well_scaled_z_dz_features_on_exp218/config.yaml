experiment:
  name: "exp224_well_scaled_z_dz_features_on_exp218"
  description: Add target-free well-scaled z/dz/dzdmd/slp_z features on top of the exp218 GRWR LightGBM anchor.
  route: ml_model
  status: train_completed_rejected
  created_at: "2026-07-08"
  updated_at: "2026-07-09"

lineage:
  parent: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  ml_submitted_anchor_parent: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  feature_surface_parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  gr_signal_audit_parents:
    - exp167_fft_denoised_gr_matching_audit
    - exp189_denoised_gr_pfbeam_generation_audit
    - exp216_affine_shift_landscape_ruler_readout
    - exp214_public_raw_gr_residual_scale_control
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp218_gr_wavelet_rotation_confidence_features_on_exp148
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp193_typewell_late_interval_context_features_addonly_on_exp148
    - exp198_exact_replacement_prune_on_exp148
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148
  implementation_source: well_scaled_z_dz_features_on_exp218.py
  diff_summary: >
    Keeps the exp218 ML feature surface (exp092 U-projection, exp145 learned
    likelihood confidence, and exp218 GR wavelet / rotation confidence features)
    and adds target-free well-level robust scale features for z, dz, dzdmd, and
    slp_z. The added columns use within-well median/MAD/IQR/rank/p05-p95 range,
    a likPF p05-p95 robust range scale for z/dz diagnostics, and a small fixed
    set of GR/GRWR interactions. Raw z/dz/dzdmd/slp_z columns remain in the
    model; no target-derived scaler, direct correction, replacement, blend,
    postprocess, hard selector, or sample-weight change is used.

validation:
  strategy: groupkfold_by_well_exp218_surface_full_train_well_scaled_z_dz_addonly_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_exp145_full_train_ml_features_exp218_grwr_and_well_scaled_z_dz_features
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache covers the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check.
    - GRWR features use horizontal GR, typewell GR, known TVT_input prefix, fixed wavelet/FFT transforms, and fixed local observation windows only.
    - Hidden-tail true TVT is never used for feature generation, denoise choice, spectrum-band selection, candidate ranking labels, or missing-value filling.
    - DWT/FFT/rolling/Savitzky-Golay outputs are used only as confidence and uncertainty descriptors.
    - Candidate TVT values are used only to score existing candidate observation consistency; no new selectable candidate, replacement, blend, postprocess, or hard gate is produced.
    - Well-scaled z/dz features use only same-row raw z/dz/dzdmd/slp_z, same-well robust train/test feature-frame statistics, likPF candidate range, raw GR, and already-generated GRWR confidence columns.
    - The likPF p05-p95 range is a scale feature only and is never used as a candidate correction or replacement.
    - Full-row coverage is required; all generated features must be aligned one-to-one with the exp218 train surface.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_feature_importance_mean.csv
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_feature_importance_mean_top.png
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_predictions.csv.gz
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_feature_schema.csv
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_lgb_models/manifest.json
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_summary.json

inference:
  mode: train_side_replacement_only_first
  selected_variant: null
  selected_mode: null
  selected_model: null
  notes:
    - Initial implementation is train-side only.
    - If OOF is positive, add current-test GR matching feature generation and saved-booster inference in this same exp195 directory.
    - Do not submit a direct shift-scan top1/top2/posterior TVT path or hard selector.

notes:
  - Implements the `denoised_calibrated_matching_replacement_only_on_exp148` backlog item as exp195.
  - Planned Kaggle train cost is 1 active replacement-only variant, 3 LightGBM configs, 5 folds, 15 boosters.
  - Parent/control retraining is not included; exp148 CV/Public LB are historical baselines.
  - The active feature groups are projection_correction, u_disagreement, and denoised_calibrated_matching; learned_likelihood_confidence is fully excluded from the active replacement-only model.
  - The train code is a single GPU notebook and is not split into lgb0/lgb1/lgb2 notebook packages.
  - Direct shift-scan top1/top2/posterior TVT replacement, blend, postprocess, hard gate, inference port, and submit are explicitly out of initial scope.

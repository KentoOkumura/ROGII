experiment:
  name: "exp195_denoised_calibrated_matching_replacement_only_on_exp148"
  description: Replace the exp148 learned-likelihood confidence feature block with denoised calibrated GR matching confidence features.
  route: ml_model
  status: completed_train_side_rejected_no_submit
  created_at: "2026-07-04"
  updated_at: "2026-07-05"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  matching_audit_parents:
    - exp167_fft_denoised_gr_matching_audit
    - exp170_heel_calibrated_shift_scan_pfbeam_audit
    - exp171_bimodal_posterior_pfbeam_candidate_audit
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp190_denoised_calibrated_matching_features_on_exp148
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148
    - exp162_learned_likelihood_rank_slot_on_exp148
    - exp175_cluster_outlier_typewell_prior_gate
  implementation_source: denoised_calibrated_matching_replacement_only_on_exp148.py
  diff_summary: >
    Keeps the exp148 base 196 features plus projection_correction and
    u_disagreement groups, removes the exp145 learned_likelihood_confidence
    ll_* block from the active model feature set, and replaces that role with
    target-free denoised calibrated GR matching confidence features. The DCM
    columns describe raw/rolling/Savitzky-Golay matching surface cost, top1/top2
    sharpness, entropy, posterior ambiguity, raw-vs-smoothed localization
    movement, candidate disagreement, and distance interactions. DCM top1/top2
    or posterior TVT values are not used as direct replacement predictions,
    blend, postprocess, or hard gate.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_denoised_calibrated_matching_replacement_only_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_and_dcm_shift_scan_features_with_exp145_ll_block_removed_from_active_model_features
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are loaded only for coverage/schema inventory and to define the ll_* replacement boundary; learned_likelihood_confidence is not part of the active replacement-only model feature list.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache covers the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check even though the ll_* block is excluded from the active model.
    - GR matching features use horizontal GR, typewell GR, known TVT_input prefix, fixed scan grid, fixed smoothing filters, and fixed temperatures only.
    - Hidden-tail true TVT is never used for feature generation, shift selection, calibration, denoise choice, posterior temperature choice, or missing-value filling.
    - Known-prefix backtest summaries use only observed finite TVT_input prefix rows and are broadcast as target-free quality diagnostics.
    - FFT notch and heel calibration columns are excluded because exp167/exp170 did not support them.
    - Commit top1/top2/posterior TVT values are converted to deltas/disagreement/confidence features only; they are never used as direct replacement, blend, postprocess, or hard gate.
    - Full-row coverage is required; coarse scan values are interpolated within well to avoid sparse sampled diagnostic joins.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


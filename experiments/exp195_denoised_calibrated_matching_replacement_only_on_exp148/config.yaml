model:
  name: exp195_denoised_calibrated_matching_replacement_only_on_exp148_lgbm
  source_experiment: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_experiment: exp092_u_projection_correction_disagreement_fullrun
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  learned_likelihood_feature_experiment: exp145_learned_likelihood_rawtest_feature_generator_parity
  matching_feature_experiment: exp195_denoised_calibrated_matching_replacement_only_on_exp148
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_projection_u_features_plus_target_free_dcm_shift_scan_features_with_exp145_ll_block_excluded_from_active_model
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  denoised_calibrated_matching_features:
    prefix: dcm_
    feature_group: denoised_calibrated_matching
    scan_stride_rows: 16
    prefix_slope_window_rows: 80
    slope_clip: [-3.0, 3.0]
    shift_min_ft: -80.0
    shift_max_ft: 80.0
    shift_step_ft: 4.0
    local_offsets_rows: [-36, -24, -12, -6, 0, 6, 12, 24, 36]
    typewell_smooth_window: 5
    ncc_weight: 8.0
    min_mode_separation_ft: 6.0
    max_mode_separation_ft: 30.0
    posterior_temperatures: [4.0, 8.0, 16.0]
    filters:
      - name: raw
        kind: raw
      - name: rolling_median_11
        kind: rolling_median
        window: 11
      - name: savgol_31_p2
        kind: savgol
        window: 31
        polyorder: 2
    prefix_backtest:
      enabled: true
      tail_rows: 256
      max_rows_per_well: 128
    default_candidate: likpf_mean
    candidate_tvt_specs:
      - name: pf_ancc
        column: pf_ancc
        kind: absolute
      - name: beam_mean
        column: beam_mean_d
        kind: delta
      - name: likpf_mean
        column: likpf_mean_d
        kind: delta
      - name: sc_ens
        column: sc_ens_d
        kind: delta
      - name: hyb
        column: hyb_d
        kind: delta
      - name: tvt_dense
        column: tvt_dense_d
        kind: delta
      - name: tvt_densew
        column: tvt_densew_d
        kind: delta
      - name: tvt_dense50
        column: tvt_dense50_d
        kind: delta
    exp148_oof_predictions_path: experiments/exp148_learned_likelihood_fulltrain_addonly_on_exp092/kaggle/output/train_v1/artifacts/exp148_learned_likelihood_fulltrain_addonly_on_exp092_predictions.csv.gz
    exp148_oof_variant: learned_likelihood_confidence_addonly
    exp148_oof_mode: gpu_repro_guard_dp_threads8
    exp148_oof_model: lgb_mean
  feature_ablation:
    selected_variant: denoised_calibrated_matching_replacement_only
    active_variants:
      - name: exp148_fulltrain_control
        description: Disabled by cost guard; use completed exp148 CV/Public LB as the comparison baseline unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
        enabled: false
      - name: denoised_calibrated_matching_replacement_only
        description: Replaces the exp148 learned_likelihood_confidence ll_* block with target-free raw/rolling/savgol GR shift-scan cost sharpness, posterior ambiguity, candidate disagreement, and distance interaction features.
        feature_groups:
          - projection_correction
          - u_disagreement
          - denoised_calibrated_matching
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    inference_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp195-dcm-replace-exp148-train
      - kentookumura/exp099-pf-multiobs-likelihood-train
      - kentookumura/exp111-learned-pf-likelihood-train
      - kentookumura/exp112-learned-pf-likelihood-followup-train

generator:
  chunksize: 200000
  include_candidate_values: false
  default_candidate: likpf_mean
  candidates:
    - name: pf_ancc
      column: pf_ancc
    - name: beam_mean
      column: beam_mean
    - name: likpf_mean
      column: likpf_mean
    - name: sc_ens
      column: sc_ens
    - name: hyb
      column: hyb
  row_context_columns:
    - last_known_tvt
    - pf_ancc_std
    - beam_mean_d
    - sc_ens_d
    - hyb_d
    - eval_len
    - md_since
    - likpf_mean_d
  multiobs_global_columns:
    - multiobs_score_max
    - multiobs_score_mean
    - multiobs_score_gap
    - multiobs_top1_source_id
    - multiobs_top1_mae
    - multiobs_top1_ncc
  feature_cache:
    include_candidate_tvt: true
    include_multiobs_scores: true
    include_probability_features: true
    include_expected_error_features: true
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng_and_deterministic_shift_scan_grid
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - gpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; GR feature generation is deterministic per well and has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a full-train replacement-only feature audit, not a deterministic submission anchor.
    - GR shift-scan feature generation is target-free and does not use hidden-tail true TVT.
    - Raw-test GR matching feature generation is not part of initial train implementation; submission requires a later inference port in the same experiment.

audit:
  mode: denoised_calibrated_matching_replacement_only_on_exp148_full_train_rows
  output_prefix: exp195_denoised_calibrated_matching_replacement_only_on_exp148
  fast: false
  reference_metrics:
    exp148_lgb_mean_pooled_rmse: 8.50128118189582
    exp148_public_lb: 7.960
    exp190_addonly_lgb_mean_pooled_rmse: 8.503596159484825
    exp190_addonly_lgb1_delta_vs_exp148_lgb1: -0.024346641095376
    exp160_lgb_mean_pooled_rmse: 8.463718773783008
    exp160_public_lb: 8.061
    exp167_rolling_hidden_tail_gap_gain_vs_raw: 0.133844
    exp171_best_posterior_hidden_tail_note: posterior_direct_candidate_rejected
  expected_train_artifacts:
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_metrics.csv
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_by_well.csv
    - exp195_denoised_calibrated_matching_replacement_only_on_exp148_bucket_metrics.csv

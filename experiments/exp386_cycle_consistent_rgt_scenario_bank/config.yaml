experiment:
  name: exp386_cycle_consistent_rgt_scenario_bank
  description: >-
    Build a topology-first, cycle-consistent relative-geologic-time graph from
    outer-train TVT and six formation surfaces, then enumerate a deterministic
    bank of physically distinct target-well paths without using target GR.
  route: pf_beam
  status: kaggle_cpu_v1_completed_stage0_fail_closed
  created_at: "2026-07-24"
  updated_at: "2026-07-24"

lineage:
  parent: independent_topology_first_rgt_physics_family
  comparison_references:
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp293_fixed12_candidate_bank
    - exp301_gauge_invariant_multiformation_edge_potential
    - exp377_formation_relative_k16_slope_identifiability_readout
    - exp383_all_tvt_stratigraphic_vector_drift_field
  downstream_if_pass:
    - exp387_prefix_gr_rgt_scenario_posterior
  diff_summary: >-
    Do not interpolate TVT rates or six formation surfaces independently.
    Convert every outer-train row to an ordered relative-geologic-time
    coordinate, solve one global multi-well correspondence graph with explicit
    cycle consistency, and enumerate 8--32 deterministic target paths using
    geometry and known TVT prefix only. Target GR is reserved for exp387.

validation:
  strategy: exp226_outer5_groupfold_topology_first_rgt_bank
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  control:
    experiment: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    regenerate: false
    cv_rmse_ft: 9.427109596582213
    public_lb: 9.837
    oof_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
  report_scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Outer-valid wells are absent from all RGT controls, graph nodes, and graph edges.
    - Outer-valid/test raw formation columns and suffix true TVT are unread before the frozen scenario-bank SHA.
    - Outer-valid/test GR is not used by scenario generation, scenario cost, diversity filtering, or Stage 0.
    - Known TVT_input prefix may anchor the target gauge but may not tune graph or scenario settings.
    - The visible three-well sample test may not select any graph, scenario, or gate setting.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  target_column: TVT
  visible_prefix_column: TVT_input
  coordinate_columns: [MD, X, Y, Z]
  observed_log_column_reserved_for_downstream: GR
  formation_columns: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
  formation_order: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
  structural_position_formula: S=TVT+Z
  outer_train_full_truth_tvt: true
  target_allowed_pre_freeze_columns: [well_id, row_idx, MD, X, Y, Z, TVT_input]
  target_forbidden_pre_freeze_columns:
    - TVT
    - GR
    - ANCC
    - ASTNU
    - ASTNL
    - EGFDU
    - EGFDL
    - BUDA
  parent_exp226:
    filename: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
    expected_oof_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp226-k16-kappa-repro-train/artifacts
      - /kaggle/input/exp226-k16-kappa-repro-train/artifacts
      - /tmp/kaggle-output/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/train_v1/artifacts

rgt:
  coordinate:
    family: ordered_formation_interval_coordinate
    formation_levels:
      ANCC: 0
      ASTNU: 1
      ASTNL: 2
      EGFDU: 3
      EGFDL: 4
      BUDA: 5
    within_interval_fraction: structural_position_linear_between_adjacent_surfaces
    outer_interval_extrapolation: nearest_valid_interval_thickness
    invalid_or_reversed_interval: unavailable
    posthoc_formation_reordering: forbidden
  graph_nodes:
    md_window_ft: 64
    md_stride_ft: 32
    minimum_rows: 8
    statistics:
      - rgt_median
      - rgt_slope_per_md
      - structural_position_median
      - formation_interval_thickness_vector
      - trajectory_direction
    stable_order: [fold, well_id, md_start, md_end]
    linear_fit: deterministic_ordinary_least_squares
  graph_edges:
    outer_train_only: true
    nearest_unique_wells: 24
    maximum_nodes_per_source_well: 4
    maximum_edge_candidates: 96
    same_well_edges: false
    compatibility:
      - formation_interval_identity
      - positive_local_rgt_progress
      - outer_train_empirical_stretch_bounds
      - trajectory_direction_consistency
    stretch_bounds:
      source: outer_train_leave_one_well_out
      lower_quantile: 0.05
      upper_quantile: 0.95
      same_fold_valid_information: forbidden
    cycle_basis: deterministic_fundamental_cycle_basis
    cycle_residual_unit: formation_interval
    cycle_penalty: huber
    huber_delta: 0.10
    huber_iterations: 5
    solve_ridge: 1.0e-9
    pair_aggregation: median_at_common_rgt
    graph_cost:
      spatial_distance_weight: 1.0
      rgt_correspondence_weight: 1.0
      log_stretch_ratio_weight: 1.0
      trajectory_direction_weight: 1.0
  target_path:
    observations: [MD, X, Y, Z, TVT_input]
    gr_usage: forbidden
    prefix_constraint: hard_gauge_anchor
    suffix_constraint: topology_geometry_and_empirical_rgt_dynamics_only
    interpolation: monotone_piecewise_linear
    control_stride_ft: 32
    route_enumeration_limit: 128
    minimum_known_prefix_rows: 1
  scenario_bank:
    generator: deterministic_k_shortest_cycle_consistent_paths
    minimum_scenarios_per_well: 8
    maximum_scenarios_per_well: 32
    path_rms_separation_ft_min: 0.5
    diversity_filter_order: [total_graph_cost, path_sha256]
    stable_tie_order: [total_graph_cost, source_well_sequence, node_sequence, path_sha256]
    prior_cost_components:
      - graph_edge_cost
      - cycle_residual_cost
      - prefix_gauge_misfit
      - rgt_stretch_cost
    prior_cost_weights:
      graph_edge_cost: 1.0
      cycle_residual_cost: 1.0
      prefix_gauge_misfit: 1.0
      rgt_stretch_cost: 1.0
    prefix_gauge_misfit_scale_ft: 25.0
    oracle_granularity_rows: 512
    posthoc_oracle_selection: forbidden
    primary_prediction: none_bank_only
  downstream_contract:
    save_reference_gr_templates: true
    target_gr_read_during_template_creation: false
    reference_gr_source: outer_train_rows_mapped_through_frozen_rgt_path

model:

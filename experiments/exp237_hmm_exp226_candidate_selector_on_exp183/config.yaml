inference:
  mode: user_authorized_rawtest_fixed_viterbi_with_reported_prior_median_fallback
  selected_variant: viterbi_sw200_bias000_jw100_jf025_d0075_std999999_md0000_seg001
  use_test_base_as_dense_auxiliary: true
  source_contract:
    exp073_test_cache: exp063_full_replay_repro_guard_test_features.csv.gz
    exp226_test_prediction_summary: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_test_prediction_summary.csv
    exp237_model_manifest: exp237_hmm_exp226_candidate_selector_on_exp183_model_manifest.json
  multi_observation_likelihood:
    observation_offsets: [-24, -12, 0, 12, 24]
    gr_rolling_window: 5
    gr_scale: 18.0
    out_of_range_scale: 80.0
    softmax_temperatures: [0.15, 0.30]
    likpf_blend_weights: [0.25, 0.50]
  hmm:
    exact:
      step: 0.35
      n_rates: 41
      rate_span: 0.10
      sig_r: 0.002
      sig_p: 0.02
      df: 4.0
      emission: gauss
      lam: 1.0
      sigma_mode: std
      start_sig: 0.75
      r0_sig: 0.01
      band_pad: 100.0
      mom: 0.998
      rate_center: zero
    self_gr:
      alpha: 0.07
      clip: 1.0
      mode: boost_only
      surface:
        enabled: true
        alpha_grid: [0.07]
        clip_grid: [1.0]
        modes: [boost_only]
        max_variants: 1
        window_radius_rows: 12
        descriptor_offsets: [-12, -8, -4, 0, 4, 8, 12]
        top_k: 5
        prefix_anchor_stride: 3
        max_prefix_anchors: 128
        keep_last_prefix_anchors: 32
        min_prefix_anchors: 12
        max_window_missing_rate: 0.35
        gaussian_sigma_tvt: 12.0
        descriptor_distance_temperature: 1.5
        typewell_agreement_sigma_tvt: 18.0
        surface_quadratic_clip: 60.0
        surface_chunk_size: 256
  rawtest_feature_policy:
    - Regenerate exp209 exact-HMM and exp223 self-GR-HMM from raw test horizontal/typewell files using their fixed train-side parameters.
    - Read exp073 deterministic raw-test base cache and exp226 raw-test K16 prediction under ID/sample-submission contracts.
    - Regenerate exp099 multi-observation scores from raw test GR for the five base PF/Beam candidates.
    - Saved ranker boosters are read without retraining. Their input median state was not persisted by train v1, so raw-test feature medians are recomputed from each model schema; all-missing columns use zero.
    - exp109/exp114 OOF-only cluster/prior confidence columns are unavailable for raw test; record their exact names and count in the inference summary.
  notes:
    - User explicitly authorized raw-test inference after reviewing exp237 near and worst-well guard failures.
    - No Kaggle competition submission is authorized or performed by the inference notebook.
    - This inference is a guarded artifact-generation step, not a train-side safety approval or submitted anchor.

notes:
  - Implements the `hmm_exp226_candidate_selector_on_exp183` backlog item.
  - Planned Kaggle train cost before push is 1 candidate-error ranker config, 5 folds, 5 boosters, and 1 pre-fixed Viterbi rule.
  - Parent/control retraining is not included; exp183, exp209, exp223, and exp226 are read as fixed OOF sources.
  - pf_z is not selectable. HMM/PF/exp226 fixed blends beyond exp209 w500, candidate hard replacement, and submit are out of scope.

    - hmm_selfgr_boost_only_a070_c100
    - v6_k16_geometry_gr_u_projection
  log_period: 10
  viterbi_grid:
    switch_penalty: [20.0]
    nondefault_bias: [0.0]
    jump_penalty_weight: [1.0]
    jump_free_ft: [25.0]
    jump_scale_ft: 25.0
    max_abs_delta_vs_default: [75.0]
    max_pf_ancc_std: [999999.0]
    min_md_since: [0.0]
    min_segment_len: [1]
  historical_baselines:

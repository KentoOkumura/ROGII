experiment:
  name: "exp237_hmm_exp226_candidate_selector_on_exp183"
  description: Add fixed exp209 HMM blend, exp223 self-GR HMM, and exp226 K16 geometry OOF paths to the exp183 candidate-error selector and apply one pre-fixed well-local Viterbi continuity rule.
  route: ensemble
  status: completed_rawtest_inference_not_submitted_after_guard_failure
  created_at: "2026-07-12"
  updated_at: "2026-07-12"

lineage:
  parent: exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector
  ranker_parent: exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector
  continuity_parent: exp158_segment_continuity_selector_on_exp157
  prior_parent: exp181_cluster_outlier_pfbeam_prior_gate
  typewell_prior_parent: exp109_typewell_neighbor_prior_features
  spatial_prior_parent: exp114_spatial_neighbor_prior_signal_audit
  cluster_parent: exp065_typewell_supertype_cluster_cv_audit
  stress_parent: exp115_hidden_like_spatial_holdout_from_ppt
  feature_cache_parent: exp072_exp063_full_replay_feature_cache
  hmm_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  self_gr_hmm_parent: exp223_joint_typewell_self_gr_hmm_likelihood_probe
  geometry_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  implementation_source: hmm_exp226_candidate_selector_on_exp183.py
  diff_summary: >
    Keeps exp183's eight PF/Beam/dense candidates and its add-only cluster/prior
    confidence surface, adds three independently generated OOF paths (exp209
    exact-HMM/likPF blend, exp223 self-GR HMM, and exp226 K16 geometry), and trains
    only the previously best candidate absolute-error regressor. The fixed exp183
    Viterbi continuity rule consumes OOF predicted errors; no LightGBM prediction
    is fed into an HMM emission or transition.

validation:
  strategy: train_well_pseudotail_candidate_selector_oof_plus_viterbi
  metric: rmse
  secondary_metrics:
    - mae
    - within_10ft
    - oracle_label_accuracy
    - selection_distribution
    - path_switch_count
    - bucket_rmse
    - subgroup_rmse
    - worst_well_rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Candidate values and target-free likelihood features are read from exp099 v2 and exp072 train-side pseudo-tail caches.
    - Dense candidates are reconstructed as last_known_tvt plus tvt_dense*_d columns, matching exp157.
    - Cluster-outlier features use exp065 native-overlap cluster assignments and exp114 geometry summaries only.
    - Typewell/spatial priors are fixed fold-safe upstream outputs from exp109/114 and are used only as features.
    - exp209, exp223, and exp226 candidate paths are precomputed group-safe OOF inputs; their source IDs, wells, rows, targets, and last-known TVT contracts are checked before use.
    - Candidate-long labels use absolute candidate error only as a training label, not as a feature column.
    - Viterbi local costs use OOF predicted-error scores from the newly trained add-only ranker. Transition penalties use candidate path geometry and target-free guard features only.
    - exp115 hidden-like roles are used only for result subgroup metrics, never for training features.
    - No validation/test true TVT, oracle candidate, or true error is used in selector features.
    - This is a train-side audit; no raw-test inference port or submission candidate is selected.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp099_train_feature_cache_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_train_features.csv.gz

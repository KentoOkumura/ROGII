reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_real_score_stable_sha256_local_rng_for_circular_shuffle_only
  stochastic_components:
    - stable_within_well_circular_shuffle_negative_control
  parallel_rng_policy: single_process_local_rng_per_well_no_global_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - This is a fixed-input deterministic diagnostic, not a model or submission anchor.
    - Target-free score and selection content SHA must be frozen before truth is joined.
    - Raw and decompressed gzip SHA are recorded; decompressed content SHA is primary.

inference:

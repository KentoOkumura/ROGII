candidate_bank:
  order:
    - hmm_ir_tail30
    - hmm_ir_w32
    - hmm_ir_w64
    - hmm_ir_w128
    - hmm_ir_w256
  safe_candidate: hmm_ir_tail30
  source_initial_rate_windows: [30, 32, 64, 128, 256]
  regenerate_candidates: false
  persist_selected_row_prediction: false

model:
  name: none_fixed_candidate_identifiability_audit
  estimator: none
  target: train_unknown_suffix_tvt_for_post_freeze_readout_only
  params: {}

audit:
  mode: typewell_gr_warp_rate_identifiability
  output_prefix: exp292_typewell_gr_warp_rate_identifiability_audit
  horizons_rows: [128, 256, 512]
  primary_horizon_rows: 256
  short_horizon_min_rows: 64
  common_pair_coverage:
    minimum_pairs: 32
    minimum_fraction_of_effective_horizon: 0.50
    require_all_candidates_common_mask: true
  typewell:
    finite_only: true
    sort_by_tvt_stable: true
    duplicate_tvt_gr_aggregation: median
    extrapolation: disabled
  prefix_calibration:
    scope: last_known_prefix_rows
    maximum_rows: 512
    minimum_pairs: 40
    trim_quantile: 0.90
    robust_iterations: 2
    minimum_typewell_gr_std: 5.0
    slope_range: [0.25, 4.0]
    maximum_prefix_rmse: 60.0
    invalid_policy: disable_gr_selection_and_use_safe
  gaussian_component:
    residual_scale: 1p4826_times_prefix_residual_mad
    sigma_clip: [10.0, 60.0]
    log_likelihood_clip: 600.0
  derivative_component:
    formula: affine_slope_times_typewell_gr_gradient_at_candidate_midpoint_times_candidate_tvt_delta
    residual_scale: 1p4826_times_prefix_residual_first_difference_mad
    scale_clip: [1.0, 30.0]
    minimum_median_absolute_forward_delta_gr_per_row: 0.25
  ncc_component:
    formula: pearson_correlation_on_common_finite_horizon_rows
  composite:
    component_order: [gaussian, ncc, derivative]
    component_normalization: candidate_median_mad_zscore_clip
    zscore_clip: [-5.0, 5.0]
    zero_mad_threshold: 0.000000001
    weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
    tie_policy: candidate_order_safe_first
  shuffled_control:
    kind: stable_within_well_circular_rotation
    seed: 42
    seed_keys: [experiment, seed, well]
    minimum_rotation_rows: 32
    minimum_rotation_fraction: 0.25
    use_same_rotation_for_all_horizons: true
  truth_readout:
    candidate_best_label: minimum_candidate_rmse_with_all_ties_positive
    truth_rmse_tie_atol_ft: 0.000000001
    auc_horizon_rows: 256
    fixed_top1_horizon_rows: 256
    fixed_top1_score_scope: horizon
    fixed_top1_rmse_scope: full_unknown_suffix
    selected_prediction_persisted: false
  forbidden_actions:
    - tune_rate_window
    - tune_horizon
    - tune_affine_or_scale
    - tune_coverage_or_gradient_threshold
    - tune_component_weight
    - candidate_average_or_softmax_tvt
    - hmm_or_pf_regeneration
    - selector_or_weight_learning
    - raw_test_inference
    - submission
  expected_artifacts:
    - exp292_typewell_gr_warp_rate_identifiability_audit_contract.json
    - exp292_typewell_gr_warp_rate_identifiability_audit_input_manifest.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_fold_manifest.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_calibration_eligibility.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_target_free_scores.csv.gz
    - exp292_typewell_gr_warp_rate_identifiability_audit_target_free_selection.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_auc_metrics.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_rmse_metrics.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_subgroup_metrics.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_by_well.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_sha_manifest.csv
    - exp292_typewell_gr_warp_rate_identifiability_audit_summary.json


experiment:
  name: exp292_typewell_gr_warp_rate_identifiability_audit
  description: >-
    Audits whether prefix-calibrated Type Well forward-GR frequency and shape
    can rank the five saved exp268 exact-HMM initial-rate candidates without
    using unknown-suffix TVT, error, or oracle information.
  route: pf_beam
  status: completed_fail_closed
  created_at: "2026-07-19"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp268_multi_scale_initial_rate_candidates
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp288_known_tvt_typewell_horizontal_gr_visualization
    - exp170_heel_calibrated_shift_scan_pfbeam_audit
    - exp211_affine_calibrated_gr_observation_pfbeam
    - exp132_multi_scale_gr_observation_likelihood
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
    - backlog/KAGGLE_DIRECTION.md typewell_gr_warp_rate_identifiability_audit
  implementation_source: exp292_typewell_gr_warp_rate_identifiability_audit_compact_selfcontained_train.py
  diff_summary: >-
    Keeps the saved exp268 tail30/w32/w64/w128/w256 paths, exp209 HMM
    generation contract, and all rate windows fixed. Adds one target-free
    readout that robustly calibrates Type Well GR on the known prefix, scores
    each fixed path over H128/H256/H512 using Gaussian residual, NCC, and
    chain-rule derivative residual, and compares real scores with a stable
    within-well circular-shuffle and the always-tail30 safe control. No HMM/PF
    regeneration, candidate averaging, model fit, inference, or submission is
    included.

validation:
  strategy: fixed_exp268_rate_candidate_typewell_gr_warp_identifiability_audit
  metric: candidate_best_auc_and_fixed_top1_rmse_vs_tail30_safe
  seed: 42
  n_folds: 5
  trained_folds: 0
  group_column: well
  fold_policy: sklearn_groupkfold_n5_on_one_row_per_sorted_well
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  primary_horizon_rows: 256
  diagnostic_horizon_rows: [128, 512]
  success_criteria:
    minimum_primary_eligible_well_fraction: 0.90
    minimum_primary_eligible_row_fraction: 0.90
    minimum_pooled_auc_lift_real_vs_shuffle: 0.02
    minimum_positive_auc_lift_folds: 4
    minimum_pooled_rmse_gain_ft_top1_vs_safe: 0.10
    minimum_improved_rmse_folds: 4
    require_1000_plus_nonregression: true
    require_hidden_like_spatial_nonregression: true
    require_hidden_like_typewell_purged_nonregression: true
  leakage_policy:
    - Target-free scoring accepts only fixed candidate paths, MD, GR, TVT_input, and Type Well TVT/GR.
    - TVT, target, true_tvt, error, abs_error, and oracle columns are rejected before score freeze.
    - Robust affine calibration and residual scales use only the known TVT_input prefix.
    - Unknown-suffix true TVT is joined only after score, eligibility, and top1 selection content SHA are frozen.
    - True TVT, candidate error, fold metrics, and oracle labels never alter calibration, score, eligibility, shuffle, tie, or fallback.


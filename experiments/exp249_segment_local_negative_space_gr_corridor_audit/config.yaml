experiment:
  name: exp249_segment_local_negative_space_gr_corridor_audit
  description: Segment-local negative-space GR ridge and candidate corridor-transition audit.
  route: pf_beam
  status: complete_guard_failed
  created_at: "2026-07-14"

lineage:
  parent: exp246_negative_space_gr_barrier_audit
  local_heatmap_parent: exp202_heatmap_mdn_candidate_generator_probe
  dense_stride_parent: exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe
  candidate_cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parent: exp246_negative_space_gr_barrier_audit
  diff_summary: >-
    Reuses the fixed exp072 PF/Beam candidate cache and exp246 endpoint/crossing
    concepts, but replaces the full-tail global surface and tail-long hard history
    with exp202-style 128-row by 64-bin local surfaces at stride 64. GR scaling,
    free-space components, anchors, and history reset inside every segment. The
    experiment is diagnostic-only and never changes, prunes, averages, or selects
    a candidate.

validation:
  strategy: train_side_official_evaluation_tail_segment_local_negative_space_audit
  group_column: well
  score_rows: TVT_input_is_nan
  primary_metric: bad_candidate_precision_lift
  leakage_policy:
    - Segment centers, typewell crops, normalization, barriers, components, and path signals use raw input GR, typewell TVT/GR, row order, Z, and known-prefix TVT only.
    - Evaluation-tail true TVT, candidate error, oracle, and hidden-like role are read only after all segment-local signals are fixed.
    - Candidate error and oracle never select a segment, threshold, crop, component, or overlap view.
    - Overlap views are not combined by OR, AND, majority, best-error, or oracle selection.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  target_column: TVT
  input_target_column: TVT_input
  gr_column: GR
  md_column: MD
  z_column: Z
  horizontal_suffix: __horizontal_well.csv
  typewell_suffix: __typewell.csv
  candidate_cache_filename: exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  candidate_cache_paths:
    - experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    - /kaggle/input/notebooks/kentookumura/exp072-exp063-full-replay-feature-cache-train/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    - /kaggle/input/exp072-exp063-full-replay-feature-cache-train/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  hidden_like_filename: exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
  hidden_like_paths:
    - experiments/exp115_hidden_like_spatial_holdout_from_ppt/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    - /kaggle/input/notebooks/kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv

model:
  name: none_segment_local_negative_space_audit_only
  active_variants:
    - diagnostic_only
  lightgbm_config_count: 0
  fold_training_count: 0
  booster_count: 0
  parent_control_retraining: false

audit:
  active_mode: stage1_full_audit
  allowed_modes:
    - stage0_preview
    - stage1_full_audit
  output_prefix: exp249_segment_local_negative_space_gr_corridor_audit
  cache_chunksize: 200000
  max_wells: null
  bad_candidate_threshold_ft: 10.0
  segment:
    horizontal_window_rows: 128
    row_center_stride: 64
    include_tail_stop: true
    typewell_window_bins: 64
    tvt_grid_half_width_ft: 192.0
    boundary_margin_rows: 16
    target_free_prior: last_known_tvt_minus_z_delta
  normalization:
    scope: segment_and_typewell_crop
    center: median
    scale: iqr
    robust_clip: 8.0
    signed_display_clip: 4.0
  gr_surface:
    raw_abs_difference_threshold: 2.0
    smooth_abs_difference_threshold: 1.5
    smooth_window_rows: 11
    flat_window_rows: 21
    flat_min_periods: 7
    flat_std_threshold_z: 0.15
  barrier:
    min_row_persistence: 5
    min_tvt_thickness_ft: 12.0
    max_forbidden_fraction_per_row: 0.85
    max_corridor_shift_ft_per_row: 4.0
    require_adjacent_supported_rows: true
  candidates:
    - name: pf_ancc
      source_column: pf_ancc
      transform: absolute
    - name: beam_mean
      source_column: beam_mean_d
      transform: base_plus_delta
    - name: likpf_mean
      source_column: likpf_mean_d
      transform: base_plus_delta
    - name: sc_ens
      source_column: sc_ens_d
      transform: base_plus_delta
    - name: hyb
      source_column: hyb_d
      transform: base_plus_delta
  distance_buckets:
    edges: [-1.0, 49.0, 99.0, 249.0, 499.0, 999.0, 1.0e30]
    labels: ["000_050", "050_100", "100_250", "250_500", "500_1000", "1000_plus"]
  stage0:
    manual_parity_confirmed: true
    preferred_preview_wells:
      - d07aed8f
    fallback_preview_well_count: 2
    center_positions_per_well:
      - first
      - middle
      - last
    save_png: true
    save_pixel_metadata: true
  stage1:
    enabled_after_stage0_confirmation: true
    save_segment_path_summary: true
    save_flagged_events: true
    save_full_row_window_audit: false
    use_inverse_overlap_coverage_weight: true
  guards:
    max_truth_instantaneous_false_alert_rate: 0.001
    max_good_candidate_false_alert_rate: 0.02
    min_bad_candidate_precision_lift: 1.5
    max_overlap_view_disagreement_rate: 0.05
    max_boundary_core_false_alert_delta: 0.01
    max_hidden_like_truth_false_alert_rate: 0.002
    max_worst_well_truth_false_alert_rate: 0.05
  outputs:
    preview_manifest_filename: exp249_segment_local_negative_space_gr_corridor_audit_preview_manifest.json
    preview_pixel_metadata_filename: exp249_segment_local_negative_space_gr_corridor_audit_preview_pixel_metadata.csv
    segment_path_summary_filename: exp249_segment_local_negative_space_gr_corridor_audit_segment_path_summary.csv.gz
    flagged_events_filename: exp249_segment_local_negative_space_gr_corridor_audit_flagged_events.csv.gz
    candidate_metrics_filename: exp249_segment_local_negative_space_gr_corridor_audit_candidate_metrics.csv
    group_metrics_filename: exp249_segment_local_negative_space_gr_corridor_audit_group_metrics.csv
    overlap_metrics_filename: exp249_segment_local_negative_space_gr_corridor_audit_overlap_metrics.csv
    boundary_metrics_filename: exp249_segment_local_negative_space_gr_corridor_audit_boundary_metrics.csv
    by_well_filename: exp249_segment_local_negative_space_gr_corridor_audit_by_well.csv
    summary_filename: exp249_segment_local_negative_space_gr_corridor_audit_summary.json

runtime:
  use_amp: false
  num_workers: 1
  batch_size: null
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_new_rng_sorted_well_segment_local_audit
  stochastic_components:
    - upstream_exp072_pf_beam_candidate_cache
  parallel_rng_policy: sorted_well_single_process_no_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - The audit is deterministic for fixed raw files, candidate cache, config, and scipy/numpy versions.
    - It is not a prediction or submission anchor and inherits stochastic provenance from the saved exp072 candidate cache.
    - Segment reset, overlap weighting, and output order are deterministic and use no random sampling.

inference:
  enabled: false
  mode: diagnostic_only_no_hidden_test_inference
  create_submission: false
  notes:
    - Stage 0 image parity and Stage 1 train-side guards must pass before any downstream feature experiment is considered.
    - Candidate pruning, HMM/PF/Beam edge cuts, raw-test generation, and submission are outside this experiment.

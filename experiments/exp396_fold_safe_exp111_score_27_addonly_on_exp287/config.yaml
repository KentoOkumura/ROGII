experiment:
  name: exp396_fold_safe_exp111_score_27_addonly_on_exp287
  description: >-
    Stage A completed on Kaggle private CPU with all technical, scorer-quality,
    runtime, and memory gates passed for the fixed 27 exp111 learned likelihood
    score features. Stage B completed all 15 T4 GPU boosters with zero control
    retraining, but failed the fixed promotion gate: pooled RMSE improved only
    0.002413 ft versus exp287, only 2/5 folds were nonworse, scope and by-well
    tail guards regressed. The branch is closed without inference or submission.
  route: ml_model
  status: stage_b_complete_promotion_gate_failed_closed
  created_at: "2026-07-25"
  updated_at: "2026-07-26"

lineage:
  parent: exp287_fold_safe_formation_74_addonly_on_exp264
  clean_tail_control: exp264_exp263_candidate_confidence_dual_selector
  scorer_contract_source: exp111_learned_pf_observation_likelihood_probe
  rawtest_parity_reference: exp145_learned_likelihood_rawtest_feature_generator_parity
  candidate_cache_parent: exp099_pf_multi_observation_likelihood_probe
  diff_summary: >-
    Keep the saved exp287 clean-273 plus nested-compact-74 plus
    fold-safe-formation-74 surface, outer folds, target, LightGBM configs, and
    unweighted metrics fixed. Add only the fixed 27 exp111 score columns after
    regenerating them with outer-five by inner-four strict well-group nesting.
    Saved exp111 fold-0 model predictions and their dependent GRWR columns are
    forbidden.

validation:
  strategy: exp287_outer5_groupfold_with_inner4_groupfold_exp111_scorers
  metric: rmse
  metric_weighting: unweighted_rows
  seed: 42
  outer_folds: 5
  inner_folds_per_outer: 4
  group_column: well
  id_column: id
  target_column: TVT
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  primary_control:
    experiment: exp287_fold_safe_formation_74_addonly_on_exp264
    rmse: 8.136708220359452
    public_lb: 7.530
  clean_tail_control:
    experiment: exp264_exp263_candidate_confidence_dual_selector
    rmse: 8.460811237612477
  scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Assign inner folds by well independently inside each downstream outer-train partition.
    - Give outer-train rows only inner-OOF scorer predictions.
    - Give outer-valid rows the mean of four inner models trained exclusively on outer-train wells.
    - Fit each 48-column imputation median vector on that inner-train partition only.
    - Never use full-train or batch medians and never fit a scorer on outer-valid wells.
    - Never reuse saved exp111 fold-0 model predictions.
    - Do not share a global five-fold scorer OOF cache across downstream outer folds.


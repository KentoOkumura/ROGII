  create_submission: false
  reason: train_side_registration_transfer_readout_only

notes:
  - donor true TVT path、TVT増分、geometry path、exp423 truth-warpは転写しない。
  - registration offsetをTVT予測へ直接加減しない。
  - PASSしてもHMM/PF/Beam emissionやcandidateへの統合は別実験・別承認とする。

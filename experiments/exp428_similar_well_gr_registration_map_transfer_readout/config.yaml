    - Kaggle version 1はGR内部欠損をDTW入力でもNaNにした実装差によりsupport 0となった。
    - version 2は親互換補間へ修正したがsupported query fraction 0.395860で固定下限0.70をFAILした。
    - support FAILが独立してterminalのため独立rerunは行わずdeterministic anchorにはしない。


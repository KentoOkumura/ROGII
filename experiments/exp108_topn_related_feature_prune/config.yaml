experiment:
  name: "exp108_topn_related_feature_prune"
  description: Prune the exp098 full 260-feature surface to top-n selector-related base candidate families and rank-slot signals.
  route: ml_model
  status: implemented_train_side
  created_at: "2026-06-22"
  updated_at: "2026-06-22"

lineage:
  parent: exp098_selector_rank_slot_features_on_exp073
  base_surface_parent: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp073_gpu_reproducibility_guard_for_exp063_full_replay
    - exp077_full_replay_postprocess_guard
    - exp092_u_projection_correction_disagreement_fullrun
    - exp098_selector_rank_slot_features_on_exp073
    - exp105_compact_rank_slot_features_on_exp098
    - exp107_selector_topn_candidate_only_features
  implementation_source: topn_related_feature_prune.py
  diff_summary: Rebuilds the exp098 196 base + 64 rank-slot surface, then compares static column-set pruning variants. Candidate families rarely selected by top-n rank slots, source one-hot flags, global candidate entropy/range, and broad pairwise disagreement can be dropped without row-wise dynamic masking.

validation:
  strategy: groupkfold_by_well_exp098_topn_related_feature_prune
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Train features are read from exp072's raw-train-only deterministic feature cache.
    - Candidate rank scores use only target-free PF/Beam/likelihood-PF diagnostics and candidate disagreements.
    - Evaluation-zone true TVT is used only as the supervised LightGBM target and OOF metric.
    - Candidate TVT paths are not used as a direct selector, soft average, or postprocess replacement.
    - Column pruning is static per variant; row-wise top-n dynamic masking is not used.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.
    - Inference is out of scope until OOF, worst-well, distance bucket, feature importance, and path continuity are reviewed.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json

model:
  name: exp108_topn_related_feature_prune_lgbm
  source_experiment: exp098_selector_rank_slot_features_on_exp073
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  feature_source: exp072_exp063_full_replay_train_feature_cache
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  base_prune:
    candidate_family_patterns:
      - pf_*
      - beam_*
      - sc*
      - hyb*
      - sig_*
      - likpf*
      - tdpf*
    topn_core_candidate_family:
      - pf_ancc
      - pf_ancc_std
      - pf_ancc_delta
      - beam_mean_d
      - beam_std_d
      - beam_med_d
      - likpf_mean_d
  rank_slot:
    top_k: 3
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    prune_policy:
      keep_topn_slot_columns:
        - rank*_candidate_minus_last_anchor
        - rank*_score
        - rank*_source_code
        - rank*_u_slope
        - rank*_u_curvature
        - rank*_u_resid_mad
      drop_columns:
        - source one-hot flags rank*_is_*
        - rank_score_entropy
        - broad rank_slot_u_std/range except top3 related variant
        - pairwise rank deltas outside selected top-n
        - u_corr/u_resid/u_abs_resid/u_fit_degree
    candidates:
      - name: pf_ancc
        source_column: pf_ancc
        transform: absolute
        family: pf
        enabled: true
      - name: beam_mean
        source_column: beam_mean_d
        transform: base_plus_delta
        family: beam
        enabled: true
      - name: likpf_mean
        source_column: likpf_mean_d
        transform: base_plus_delta
        family: likelihood_pf
        enabled: true
      - name: sc_ens
        source_column: sc_ens_d
        transform: base_plus_delta
        family: ncc_scale_ensemble
        enabled: true
      - name: hyb
        source_column: hyb_d
        transform: base_plus_delta
        family: public_hybrid
        enabled: true
  feature_ablation:
    selected_variant: top3_related_pruned_260
    active_variants:
      - name: exp098_full_260
        description: Control matching exp098 full 196 base features plus all 64 rank-slot features.
        base_feature_groups:
          - base_196_all
        feature_groups:
          - rank_slot_delta
          - rank_slot_identity_score
          - rank_slot_u_projection
          - rank_slot_u_disagreement
        enabled: false
      - name: top1_related_pruned_260
        description: Keep non-candidate context, core top-n candidate-family columns, and top1 slot-related rank features.
        base_feature_groups:
          - base_196_non_candidate_context
          - base_196_topn_core_candidate_family
        feature_groups:
          - rank_slot_top1_related
        enabled: false
      - name: top2_related_pruned_260
        description: Keep non-candidate context, core top-n candidate-family columns, and top1/top2 slot plus within-top2 disagreement features.
        base_feature_groups:
          - base_196_non_candidate_context
          - base_196_topn_core_candidate_family
        feature_groups:
          - rank_slot_top2_related
        enabled: false
      - name: top3_related_pruned_260
        description: Single active variant. Keep non-candidate context, core top-n candidate-family columns, and top1/top2/top3 slot plus within-top3 disagreement features. Top3 is fixed from exp098 rank-slot distribution and feature importance, avoiding top1/top2/top3 GPU ablation.
        base_feature_groups:
          - base_196_non_candidate_context
          - base_196_topn_core_candidate_family
        feature_groups:
          - rank_slot_top3_related
        enabled: true
      - name: non_candidate_context_plus_topn_related
        description: Drop all base candidate-family columns and keep only non-candidate context plus top3 rank-slot related features.
        base_feature_groups:
          - base_196_non_candidate_context
        feature_groups:
          - rank_slot_top3_related
        enabled: false
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 50
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - gpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; feature pruning itself has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a train-side feature pruning audit, not a deterministic submission anchor.
    - Source gzip cache decompressed content SHA is recorded by the train summary when available.

audit:
  mode: topn_related_feature_prune
  output_prefix: exp108_topn_related_feature_prune
  fast: false
  reference_metrics:
    exp073_raw_anchor_pooled_rmse: 9.526374749390682
    exp077_policy_pooled_rmse: 9.470514801
    exp092_best_lgb1_pooled_rmse: 9.322479895503927
    exp098_lgb1_pooled_rmse: 9.35815105231876
    exp098_lgb_mean_pooled_rmse: 9.427447987389971
    exp105_best_pooled_rmse: 9.441103161090854
  expected_train_artifacts:
    - exp108_topn_related_feature_prune_metrics.csv
    - exp108_topn_related_feature_prune_by_well.csv
    - exp108_topn_related_feature_prune_bucket_metrics.csv
    - exp108_topn_related_feature_prune_rank_slot_feature_summary.csv
    - exp108_topn_related_feature_prune_feature_importance.csv
    - exp108_topn_related_feature_prune_feature_importance_mean.csv
    - exp108_topn_related_feature_prune_feature_importance_mean_top.png
    - exp108_topn_related_feature_prune_predictions.csv.gz
    - exp108_topn_related_feature_prune_feature_schema.csv
    - exp108_topn_related_feature_prune_lgb_models/manifest.json
    - exp108_topn_related_feature_prune_summary.json

inference:
  mode: not_selected_train_side_audit_only
  selected_variant: top3_related_pruned_260
  notes:
    - Inference is intentionally disabled until train-side OOF, worst-well, distance bucket, feature importance, and path continuity are reviewed.

submission:
  status: not_submitted
  public_lb: null
  private_lb: null
  notes:
    - This implementation only prepares Kaggle train-side ablation.

notes:
  - Implements backlog item exp098_topn_related_feature_prune under the incremented experiment prefix exp108.
  - PF/Beam candidates remain target-free structured features under route ml_model.
  - Direct candidate selector, dynamic row-wise masking, soft average, and candidate TVT replacement are intentionally out of scope.
  - Top-n is fixed to top3 from exp098 evidence to avoid GPU-expensive top1/top2/top3 ablation.

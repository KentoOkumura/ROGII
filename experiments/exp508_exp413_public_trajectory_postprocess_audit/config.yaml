postprocess:
  contract_file: postprocess_contract.yaml
  output_contract: output_contract.md
  control:
    id: raw_exp413_stage_d_oof
    selectable: false
  primary:
    id: sg61_p3_final_tvt
    selectable: true
    transform: scipy_signal_savgol_filter_per_well
    input_surface: final_tvt
    window_length: 61
    polyorder: 3
    mode: scipy_default_interp
    dtype: float64
    well_order: source_first_appearance
    row_order: preserve_source_order_within_well
    short_well_rule: decrement_even_window_then_apply_only_if_window_ge_5
    reanchor_after_filter: false
    clip_after_filter: false
    project_after_filter: false
  report_only:
    - id: tau85_warmup_final_delta
      selectable: false
      tau_ft: 85.0
      formula: last_known_tvt_plus_one_minus_exp_minus_md_since_over_tau_times_exp413_delta
      may_rescue_primary: false
    - id: tau85_warmup_then_sg61_p3
      selectable: false
      tau_ft: 85.0
      sg_window_length: 61
      sg_polyorder: 3
      may_rescue_primary: false
  prohibited:
    - public_model60_likpf40_blend
    - direct_likpf_reblend
    - sg_window_or_polyorder_grid
    - tau_grid
    - last_known_reanchor
    - clipping_or_monotonic_projection
    - u_space_projection
    - row_or_well_gate
    - public_fixed_well_shape_threshold_or_map
    - same_oof_rescue


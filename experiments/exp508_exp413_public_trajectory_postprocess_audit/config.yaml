  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  fold_source: exp413_saved_outer_fold
  fold_manifest_sha256: fa41084c5fcb4adffb88d44211b4cc5d2d2f46b5bd4d65828b6af941184b2a6d
  selection_fit: none
  truth_used_for_prediction_generation: false
  leakage_policy:
    - Verify source file, logical key, global row order, per-well row order, score-row role, and fold SHA before prediction generation.
    - Generate and freeze all candidate predictions before attaching suffix truth, error, scope, or by-well outcomes.
    - Score the selectable SG primary and freeze its decision before scoring report-only warmup controls.
    - Never use truth or error to choose window, polyorder, tau, well, row, clip, projection, or router.
    - Never use Public LB, public test well identity, public row count, or submission values for selection.


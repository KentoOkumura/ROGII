experiment:
  name: exp508_exp413_public_trajectory_postprocess_audit
  description: >-
    Audit one fixed public-notebook trajectory postprocess on the saved exp413
    Stage D OOF. The only selectable candidate is per-well Savitzky-Golay
    smoothing with window 61 and polynomial order 3. Tau-85 warmup variants
    are report-only, and well-level routing is deferred to a conditional,
    separately approved experiment.
  route: ml_model
  status: stage_a_complete_fail_closed
  created_at: "2026-08-04"
  updated_at: "2026-08-04"
  inference_enabled: false

lineage:
  parent: exp413_scale5_likpf_full_replacement_on_exp335
  public_core_reference: exp497_strict_public_core_fold_safe_ensemble_on_exp413
  public_source: docs/notebooks/rogii-wellbore-geology-prediction/date_run_recent_20260611/jaemin3404__rogii-sp45-fleongg-jy-dynamic-v1/rogii-sp45-fleongg-jy-dynamic-v1.py
  steering: ../../docs/legacy/steering/20260804-exp508-exp413-public-trajectory-postprocess-audit
  negative_references:
    - exp300_raw_deployable_well_feature_readout
    - exp499_exp490_cross_fitted_well_application_selector
    - exp497_strict_public_core_fold_safe_ensemble_on_exp413
  diff_summary: >-
    Keep the saved exp413 prediction, folds, row order, and all upstream models
    fixed. Apply exactly one per-well Savitzky-Golay 61/3 filter to final TVT.
    Keep tau-85 warmup and warmup-plus-SG non-selectable and exclude the public
    60/40 direct-LikPF blend, routing, refitting, grids, clipping, reanchoring,
    projection, retraining, and same-OOF rescue.


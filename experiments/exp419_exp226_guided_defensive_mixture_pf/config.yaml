experiment:
  name: exp419_exp226_guided_defensive_mixture_pf
  description: >-
    Use only the fold-safe exp226 geometry-only local surface rate as an
    importance-corrected defensive-mixture proposal for the exp404 x1.0
    temperature-5 likelihood-PF. The exp226 absolute path is never used as a
    state, offset, emission, output, or blend term.
  hypothesis: >-
    Reallocating finite particles toward multiple neighborhoods of the exp226
    geometry rate, while retaining 50 percent of the original transition
    proposal and correcting by p0/q, reduces the support-loss mechanism found
    in exp410 without changing the infinite-particle target posterior.
  route: pf_beam
  status: completed_train_side_gate_failed_closed
  created_at: "2026-07-27"
  updated_at: "2026-07-29"
  inference_enabled: false

lineage:
  parent: exp404_scale5_sigma_gr_likelihood_pf_ablation
  geometry_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  mechanism_evidence:
    - exp410_likpf_particle_resampling_basin_audit
  negative_reference:
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
  references:
    - exp072_exp063_full_replay_feature_cache
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
  steering: ../../docs/legacy/steering/20260727-exp419-exp226-guided-defensive-mixture-pf
  diff_summary: >-
    Keep the exp072 target transition, position conditional, x1.0 GR emission,
    initialization, ESS resampling, roughening, 500 particles, 128 seeds, and
    exp404 temperature-5 seed aggregation fixed. Change only the finite-particle
    rate proposal to a defensive mixture centered on the original transition
    and the fold-safe exp226 geometry rate, with exact p0/q importance
    correction. Reuse the saved exp404 scale5 prediction as control and rerun
    no control PF, exp226, HMM, Beam, or model.


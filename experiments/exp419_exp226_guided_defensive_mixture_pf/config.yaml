  metric: rmse
  metric_weighting: unweighted_suffix_rows
  n_reporting_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  primary_control: likpf_scale_5_x1p0
  primary_candidate: exp226_guided_defensive_mixture_scale5
  standalone_reference: exp226_final_oof
  gain_definition: rmse_reference_minus_rmse_candidate
  saved_control_rmse_ft: 10.914522073423171
  saved_exp226_final_rmse_ft: 9.427109596582213
  truth_attachment: after_candidate_prediction_target_free_diagnostics_and_logical_sha_freeze
  leakage_policy:
    - >-
      Proposal generation may read MD, Z, raw GR, Type Well inputs, last-known
      state, and the fold-safe exp226 tvt_geop column only.
    - >-
      The exp226 final prediction, gr_delta, U projection, suffix TVT, error,
      fold, hidden-like role, and Public LB are forbidden before candidate
      freeze.
    - >-
      Candidate identity, prediction bytes, logical SHA, proposal diagnostics,
      and resource ledger are frozen before evaluation fields are attached.
    - >-
      exp410 cause labels, truth-best seed, episode membership, and errors never
      activate or alter proposal generation.


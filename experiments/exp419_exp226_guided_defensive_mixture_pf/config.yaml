model:
  name: exp226_guided_defensive_mixture_scale5
  estimator: likelihood_weighted_particle_filter
  fitted_model: false
  active_variants:
    - exp226_guided_defensive_mixture_scale5
  state:
    position: surface_tvt_plus_z
    rate: surface_rate_per_md
  target_transition:
    momentum: 0.998
    rate_noise: 0.002
    position_noise: 0.005
    minimum_md_delta: 1.0
    rate_mean_formula: momentum_times_previous_particle_rate
    position_mean_formula: previous_position_plus_sampled_rate_times_md_delta
  geometry_rate:
    geometry_surface_formula: tvt_geop_plus_z
    formula: geometry_surface_difference_divided_by_md_delta
    first_suffix_previous_surface: last_known_tvt_input_plus_z
    uses_gr_correction: false
    uses_absolute_geometry_as_state: false
  rate_proposal:
    family: importance_corrected_defensive_gaussian_mixture
    target_component:
      weight: 0.5
      center: target_transition_rate_mean
      sigma_multiplier: 1.0
    geometry_components:
      weights: [0.16666666666666666, 0.16666666666666666, 0.16666666666666666]
      center: fold_safe_exp226_geometry_rate
      sigma_multipliers: [1.0, 4.0, 16.0]
    weight_sum: 1.0
    importance_ratio: target_rate_density_divided_by_mixture_rate_density
    maximum_importance_ratio_by_construction: 2.0
    importance_clipping: false
  replay:
    split_key: train
    observation_likelihood: raw_gr_gaussian_exp072_x1p0
    position_conditional: classic_exp072_surface_state
    seed_aggregation: full_suffix_temperature_5_log_marginal_likelihood_weighted_mean
    aggregation_mode: batch_noncausal
  pf:
    particles: 500
    seeds: 128
    seed_index_first: 0
    seed_index_last: 127
    typewell_grid_step_ft: 0.2
    initial_position_spread_ft: 4.5
    initial_rate_spread: 0.01
    resample_threshold_fraction: 0.5
    resampling: systematic
    rough_position: 0.10
    rough_rate: 0.001
    emission: capped_gaussian
    emission_clip_z2: 600.0
    gr_sigma_multiplier: 1.0
    gr_sigma_clip: [10.0, 60.0]
    typewell_tvt_pad_ft: 100.0
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    output_dtype: float32
  aggregation:
    temperature: 5.0
    evidence_source: importance_corrected_incremental_normalizer
    formula: softmax_centered_total_log_marginal_likelihood_divided_by_temperature

guards:
  technical:
    require_all_input_sha_matches: true
    require_expected_rows: 3783989
    require_expected_wells: 773
    require_expected_folds: [0, 1, 2, 3, 4]
    require_id_row_order_fold_identity: true
    require_all_wells_completed_without_fallback: true
    require_finite_candidate_coverage: 1.0
    require_proposal_allowlist_exact_match: true
    require_mixture_weight_sum: 1.0
    mixture_weight_sum_absolute_tolerance: 1.0e-15
    require_positive_finite_proposal_density: true
    maximum_importance_ratio: 2.000000000001
    require_no_importance_clipping: true
    require_geometry_weight_zero_exp404_parity_atol_ft_after_float32: 0.000001
    require_saved_control_rmse_parity_atol_ft: 0.00001
    maximum_truth_error_fold_hidden_reads_before_candidate_freeze: 0
    require_execution_count_match: true
  mechanism:
    minimum_direct_rmse_gain_vs_scale5_ft: 0.10
    minimum_improved_folds_vs_scale5: 4
    minimum_raw_gr_observed_gain_ft: 0.10
    maximum_raw_gr_missing_regression_ft: 0.02
    maximum_high_missing_regression_ft: 0.02
    maximum_long_tail_1000_plus_regression_ft: 0.02
    maximum_hidden_like_spatial_regression_ft: 0.02
    maximum_hidden_like_typewell_purged_regression_ft: 0.02
    minimum_exp410_majority_seed_predictive_support_outside_rate_reduction_percentage_points: 5.0
    minimum_exp410_fixed_episode_sse_reduction_fraction: 0.10
    maximum_by_well_delta_rmse_p95_ft: 0.25
    maximum_worst_well_regression_ft: 2.0
    require_all_checks: true
  standalone_adoption:
    minimum_direct_rmse_gain_vs_exp226_final_ft: 0.03
    minimum_improved_folds_vs_exp226_final: 3
    require_mechanism_gate_pass: true
    require_all_checks: true
  decision:
    mechanism_and_adoption_pass_action: eligible_for_separate_same_exp_inference_design_approval
    mechanism_only_pass_action: record_positive_proposal_mechanism_no_inference_promotion
    fail_action: proposal_rejected_close_without_same_oof_rescue
  forbidden:
    - prediction_blend
    - hmm_or_fixed_offset_state
    - exp226_absolute_path_prior_or_output
    - exp226_final_or_gr_delta_or_u_projection
    - adaptive_proposal_or_particle_allocation
    - mixture_weight_or_width_search
    - importance_clipping
    - gr_sigma_or_process_noise_or_roughening_change
    - particle_or_seed_count_change
    - donor_distance_or_well_or_row_gate
    - parent_pf_control_rerun
    - same_oof_rescue
    - inference_or_submission_without_separate_approval


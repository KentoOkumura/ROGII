experiment:
  name: "exp159_spatial_prior_confidence_features_on_exp092"
  description: Add target-free spatial neighbor prior confidence and disagreement features to the exp092 U-projection LightGBM surface.
  route: ml_model
  status: implemented_not_run_colab_ready
  created_at: "2026-06-29"
  updated_at: "2026-06-29"

lineage:
  parent: exp092_u_projection_correction_disagreement_fullrun
  cache_parent: exp072_exp063_full_replay_feature_cache
  spatial_prior_parent: exp114_spatial_neighbor_prior_signal_audit
  diagnostic_parents:
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092
    - exp129_spatial_prior_as_selector_candidate
  comparison_parents:
    - exp092_u_projection_correction_disagreement_fullrun
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp127_learned_likelihood_features_on_exp092
    - exp149_normalized_shape_addonly_features_on_exp092
  implementation_source: spatial_prior_confidence_features_on_exp092.py
  diff_summary: Keeps the exp092 U-projection correction plus disagreement feature surface and original residual target, then adds fold-safe exp114 spatial neighbor prior value, quality, disagreement, exp118 best-gate proxy, and near/longtail interaction features. It does not use validation true TVT, oracle candidate choice, hard selector, direct spatial correction, or exp092 control retraining.

validation:
  strategy: groupkfold_by_well_exp092_surface_full_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: exp072_full_replay_train_feature_cache_rows
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp114 spatial prior OOF diagnostics are fold-safe; validation wells use train-fold wells only as neighbor sources.
    - New spatial confidence features use exp114 prior values and target-free quality/disagreement columns only.
    - No hard selector, true validation TVT, oracle candidate choice, absolute error, or fold label is used to build the added features.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json
  exp114_spatial_oof_local: experiments/exp114_spatial_neighbor_prior_signal_audit/kaggle/output/train_v1/artifacts/exp114_spatial_neighbor_prior_signal_audit_oof_predictions.csv.gz

model:
  name: exp159_spatial_prior_confidence_features_on_exp092_lgbm
  source_experiment: exp092_u_projection_correction_disagreement_fullrun
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  spatial_prior_experiment: exp114_spatial_neighbor_prior_signal_audit
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_exp114_spatial_prior_confidence_features
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  spatial_prior_confidence:
    prefix: spc_
    spatial_oof_path: experiments/exp114_spatial_neighbor_prior_signal_audit/kaggle/output/train_v1/artifacts/exp114_spatial_neighbor_prior_signal_audit_oof_predictions.csv.gz
    min_md_scale: 25.0
    min_prior_scale: 10.0
    near_md_threshold: 50.0
    longtail_rank_threshold: 1000
    primary_prior_variant: xy_only_k8
    prior_variants:
      - xy_only_k8
      - xy_plus_trajectory_shape_k8
    exp118_best_gate:
      variant: xy_only_k8
      std_quantile: 0.50
      distance_quantile: 0.50
      alpha: 0.05
      clip_ft: 5.0
    reference_candidates:
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      pf_ancc:
        value_column: pf_ancc
        enabled: true
  feature_ablation:
    selected_variant: spatial_prior_confidence_addonly
    active_variants:
      - name: exp092_full_row_control
        description: Disabled GPU-cost guard. Use existing exp092 metrics as baseline unless the user explicitly approves control retraining.
        feature_groups:
          - projection_correction
          - u_disagreement
        enabled: false
      - name: spatial_prior_confidence_addonly
        description: Adds exp114 spatial prior value, confidence, neighbor quality, PF/likPF/Beam disagreement, exp118 gate proxy, and near/longtail interaction features.
        feature_groups:
          - projection_correction
          - u_disagreement
          - spatial_prior_geometry
          - spatial_prior_value
          - spatial_prior_quality
          - spatial_prior_disagreement
          - spatial_prior_interaction
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  colab:
    drive_root: /content/drive/MyDrive/Kaggle/ROGII
    copy_large_inputs_to_content: true
    required_inputs:
      - experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
      - experiments/exp114_spatial_neighbor_prior_signal_audit/kaggle/output/train_v1/artifacts/exp114_spatial_neighbor_prior_signal_audit_oof_predictions.csv.gz
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp114-spatial-neighbor-prior-signal-audit-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp114_spatial_prior_oof
    - gpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; feature merge itself has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a train-side add-only feature audit, not a deterministic submission anchor.
    - Inference and submission are disabled until OOF, worst-well, hidden-like stress, and raw-test feature parity are reviewed.

audit:
  mode: spatial_prior_confidence_features_on_exp092_surface
  output_prefix: exp159_spatial_prior_confidence_features_on_exp092
  fast: false
  reference_metrics:
    exp092_full_lgb1_pooled_rmse: 9.322479895503927
    exp092_full_public_lb: 8.350
    exp118_best_gate_rmse: 9.321625436
    exp114_best_likpf_correction_rmse: 11.151818387
    exp129_expanded_oracle_rmse: 6.709127
  expected_train_artifacts:
    - exp159_spatial_prior_confidence_features_on_exp092_metrics.csv
    - exp159_spatial_prior_confidence_features_on_exp092_by_well.csv
    - exp159_spatial_prior_confidence_features_on_exp092_bucket_metrics.csv
    - exp159_spatial_prior_confidence_features_on_exp092_projection_feature_summary.csv
    - exp159_spatial_prior_confidence_features_on_exp092_spatial_feature_summary.csv
    - exp159_spatial_prior_confidence_features_on_exp092_feature_importance.csv
    - exp159_spatial_prior_confidence_features_on_exp092_feature_importance_mean.csv
    - exp159_spatial_prior_confidence_features_on_exp092_feature_importance_mean_top.png
    - exp159_spatial_prior_confidence_features_on_exp092_predictions.csv.gz
    - exp159_spatial_prior_confidence_features_on_exp092_feature_schema.csv
    - exp159_spatial_prior_confidence_features_on_exp092_lgb_models/manifest.json
    - exp159_spatial_prior_confidence_features_on_exp092_summary.json

inference:
  mode: disabled_train_side_feature_audit_only
  selected_variant: null
  notes:
    - This experiment does not generate submission.csv.
    - Raw-test/full-train spatial feature parity must be implemented and reviewed before any inference port.

notes:
  - Implements the KAGGLE_DIRECTION backlog item `spatial_prior_confidence_features_on_exp092`.
  - Added features are spatial prior confidence features only; they do not replace PF/Beam/spatial candidates, hard-switch predictions, or change the residual target.
  - Planned Colab train cost is 1 active variant x 3 LightGBM configs x 5 folds = 15 boosters; exp092 control retraining is disabled.

    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    emission: huber_delta1p345
    huber_delta: 1.345
    lam: 1.0
    sigma_mode: std
    start_delta_ft: 0.0
    start_sig: 0.75
    initial_offset_rate: 0.0
    r0_sig: 0.01
    mom: 0.998
    rate_center: zero
    additional_likelihood_clip: none
    typewell_extension_ft: 40.0
    transition_center: exp226_tvt_geop_row_delta
    active_variants: [huber_delta1p345_residual_offset_delta80_step035_rate41]

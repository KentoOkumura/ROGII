experiment:
  name: exp374_exp209_student_t_exact_hmm_emission
  description: >-
    Train-side experiment that keeps the exp209 absolute-TVT
    exact HMM unchanged and replaces only its Gaussian row emission with a
    fixed df=4 Student-t likelihood. The saved exp209 Gaussian prediction is
    the control and is not rerun.
  route: pf_beam
  status: terminal_closed_tail_gate_failed_no_rescue
  created_at: "2026-07-24"
  updated_at: "2026-07-24"

implementation:
  enabled: true
  scope: train_side_candidate_audit_only
  train_notebook_state: canonical_compact_selfcontained
  inference_notebook_state: fail_closed_compact_selfcontained_candidate_not_canonical
  canonical_notebook_adopted: true
  jupytext_source_created: true
  helper_code_created: false
  tests_created: true
  kaggle_package_created: true
  emission_replacement_implemented: true

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260724-exp374-exp209-student-t-exact-hmm-emission
  negative_reference: exp342_exp226_student_t_residual_offset_emission_audit
  references:
    - exp072_likelihood_pf_baseline
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp338_exp209_well_adaptive_transition_noise
    - exp342_exp226_student_t_residual_offset_emission_audit
    - exp346_exp209_observed_only_finite_sigma_gr_hmm
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  diff_summary: >-
    Change only the exp209 row log emission from
    -0.5*min(z^2,600) to -0.5*(df+1)*log1p(z^2/df) with df=4.
    Keep the absolute-TVT coordinate, grid, rate states, transitions, priors,
    sigma, missing-GR handling, Type Well GR, momentum, likelihood weight,
    and posterior-mean output unchanged. Do not use exp226 tvt_geop or the
    exp342 residual-offset/shift-rank design.

validation:
  strategy: exp209_absolute_tvt_exact_hmm_saved_control_direct_student_t
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  missing_fraction_buckets:
    low: [0.0, 0.10]
    mid: [0.10, 0.30]
    high: [0.30, 1.0]
    boundary_policy: left_closed_right_open_except_final_closed
  truth_attachment: after_candidate_prediction_and_logical_content_sha_freeze
  saved_controls:
    gaussian_exact_hmm:
      experiment: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
      rmse: 11.938287234887435
      prediction_column: hmm_mean_tvt
      decompressed_sha256: 8e2f42367b7b8b28e73094eae642c57c75dc8a7ebcfbc3826b0f2067b37f7ae5
      rerun: false
    gaussian_fixed_likpf_hmm_blend:
      rmse: 10.269696146642758
      likpf_weight: 0.5
      hmm_weight: 0.5
  leakage_policy:
    - Candidate predictions and their logical content SHA are frozen before unknown-suffix truth, errors, fold scopes, or hidden-like roles are joined.
    - exp226 is used only for well, row, suffix-offset, and fold identity; tvt_geop and prediction columns are forbidden decoder inputs.
    - Saved Gaussian and LikPF predictions are reporting controls and fixed-blend inputs only.
    - Public LB is not used to select the emission, df, scale, gates, or any rescue.


experiment:
  name: exp437_neighbor_geometry_tvt_only_transition_hmm
  description: >-
    Replace only the exp435 TVT-only transition center from -delta_Z to the
    first difference of the fold-safe exp226 neighbor-geometry path, without
    restoring a persistent U-rate or branch state.
  hypothesis: >-
    The severe exp435 dz-only negative transfer is caused primarily by its
    zero-rate transition mean. A fold-safe signed neighbor-geometry increment
    can retain the TVT-only no-hysteresis state while restoring the missing
    directional drift.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-29"

lineage:
  parent: exp435_tvt_memoryless_u_rate_dzonly_hmm
  geometry_evidence_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  related_negative_evidence:
    - exp355_exp226_dip_rate_prior_on_exp209
    - exp394_soft_sticky_exp226_k16_branch_hmm
  independent_physics_candidate:
    - exp436_sparse_global_stratigraphic_potential
  steering: ../../docs/legacy/steering/20260729-exp437-neighbor-geometry-tvt-only-transition-hmm
  diff_summary: >-
    Keep the exp435 TVT-only probability state, GR emission, grid, process
    noise, and forward-backward decoder fixed. Replace only each row's
    transition center with the adjacent difference of fold-safe exp226
    geometry-only tvt_geop. No persistent rate, rate prior, branch state,
    exp226 GR/U correction, final prediction, selector, or blend is used.


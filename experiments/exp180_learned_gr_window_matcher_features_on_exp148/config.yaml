notes:
  - Implements the learned_gr_window_matcher_features_on_exp148 backlog as an add-only diagnostic.
  - Primary decision is whether learned GR matcher confidence features improve exp148 without near-row or worst-well regressions.
  - Direct submission should wait for OOF, feature importance, raw-test/current-test parity, and worst-well review.

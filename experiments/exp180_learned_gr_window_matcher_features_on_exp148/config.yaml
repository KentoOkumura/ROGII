experiment:
  name: "exp180_learned_gr_window_matcher_features_on_exp148"
  description: Add fold-safe learned GR window matcher probability, expected-error, margin, entropy, and negative-control gap features on top of the exp148 learned-likelihood LightGBM surface.
  route: ml_model
  status: completed_train_side_rejected_no_submit
  created_at: "2026-07-03"
  updated_at: "2026-07-04"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp092_u_projection_correction_disagreement_fullrun
    - exp154_segment_level_dense_candidate_verifier_on_exp148
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148
    - exp098_selector_rank_slot_features_on_exp073
    - exp082_public_artifact_replay_followup
  implementation_source: learned_gr_window_matcher_features_on_exp148.py
  diff_summary: Keeps the exp148 feature surface intact and adds hidden-safe learned GR window matcher scores learned from observed TVT_input prefix pair labels. The new features are probability, expected-error, top1/top2 margin, entropy, real-vs-shuffled/no-GR gaps, candidate-family indicators, and md_since interactions. Candidate TVT hard switches, weighted TVT averages, direct correction, PF/Beam regeneration, and exp148 feature replacement are not used.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_gr_matcher_addonly
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_exp145_full_train_ml_feature_cache_and_gr_matcher_features
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - Learned GR matcher labels are generated only from observed finite TVT_input prefix rows; evaluation-tail true TVT and TVT_input-NaN rows are never used for labels, window centers, threshold selection, or normalization.
    - Train feature cache uses GroupKFold-by-well scorer fitting by default, so a validation well's matcher scores are produced by scorers trained on other wells' observed prefixes.
    - Current-test scoring can use observed TVT_input prefix rows only; it must not learn from TVT_input-NaN evaluation rows.
    - PF/Beam, likelihood-PF, U-projection, learned likelihood model inputs, and candidate TVT paths are not regenerated or replaced by the matcher.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache covers the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


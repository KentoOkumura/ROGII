experiment:
  name: "exp076_exp039_cv_reassessment"
  description: Reassess the deterministic exp073 full replay LightGBM family on the exp039 CV surface while keeping train-side LightGBM reproducibility and inference-side PF/Beam reproducibility separate.
  route: ml_model
  status: submitted_not_adopted
  created_at: "2026-06-16"
  updated_at: "2026-06-17"

lineage:
  parent: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  reference_branch: exp039_ravaghi_single_lgbm_inference_submit
  cv_surface_parent: exp029_public_sel15_pf_oof_feature_generation
  cache_parent: exp072_exp063_full_replay_feature_cache
  implementation_source: exp073_exp039_cv_reassessment.py
  public_replay_source: public_notebook_replay_audit.py
  diff_summary: Replace the discarded exp068 exp063-target reassessment with the deterministic exp073 full replay family. Train reads the fixed exp072/exp073 full replay train feature cache and evaluates the exp073 LightGBM family under exp039 leave-one-original-fold and well-hash CV splits. Inference uses the saved exp076 LightGBM boosters and regenerates raw-test PF/Beam/likelihood-PF features with the established exp073 stable per-well seed policy.

validation:
  strategy: exp073_full_replay_model_on_exp039_cv
  metric: rmse
  audits:
    - leave_one_original_fold_out
    - well_hash_holdout
  well_hash_folds: 5
  leakage_policy:
    - The CV surface is the exp039/exp038-style audit surface from exp029 public_sel15_pf_oof_features.csv.gz.
    - The fold column from exp039 is assigned by well_id and used only for leave-one-original-fold evaluation; well-hash holdout is reproduced independently from well_id.
    - Train features are read from the exp072 deterministic full public replay train feature cache used by exp073.
    - Train-side PF/Beam features are not regenerated in exp076; train reproducibility evidence is the fixed feature content SHA, LightGBM model SHA, and OOF prediction SHA.
    - The supervised target is the exp073/exp072 cache target. On overlapping ids, exp039 target_tvt minus exp073/exp072 last_known_tvt is checked as an audit only.
    - Inference regenerates hidden-test PF/Beam/likelihood-PF features from current raw test files using the established exp073 stable per-well seed policy and records generated feature content SHA.
    - Inference does not use static public-sample prediction artifacts or static exp063/exp073 test prediction CSVs.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp039_cv_feature_path: experiments/exp029_public_sel15_pf_oof_feature_generation/features/public_sel15_pf_oof_features.csv.gz
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json

model:
  name: exp073_full_replay_lgbm_on_exp039_cv
  source_experiment: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  feature_source: exp072_exp073_full_replay_train_feature_cache
  expected_feature_count: 196
  target: target_tvt_minus_last_known_tvt
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  training:
    early_stopping_rounds: 250
    max_rows: null
    max_train_rows: null
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags, matching exp073 primary mode.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: Optional CPU deterministic control.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp029-sel15-pf-oof-train
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
    inference_kernel_sources:
      - kentookumura/exp076-exp039-cv-reassessment-train

audit:
  mode: exp073_full_replay_lgbm_retrained_on_exp039_cv_surface
  output_prefix: exp073_exp039_cv_reassessment
  fast: false
  expected_train_artifacts:
    - exp073_exp039_cv_reassessment_metrics.csv
    - exp073_exp039_cv_reassessment_by_well.csv
    - exp073_exp039_cv_reassessment_predictions.csv.gz
    - exp073_exp039_cv_reassessment_feature_schema.csv
    - exp073_exp039_cv_reassessment_summary.json
    - exp073_exp039_cv_reassessment_lgb_models/manifest.json
  notes:
    - Train is the LightGBM reproducibility boundary: fixed full replay feature cache, deterministic LightGBM settings, model SHA, OOF prediction SHA, and feature content SHA.
    - Exp039 CV and exp073 native CV are different evaluation surfaces; this experiment does not update the deterministic anchor by itself.

inference:
  mode: saved_lgb_booster_inference_with_exp073_raw_test_pfbeam_regeneration
  selected_mode: gpu_repro_guard_dp_threads8__leave_one_original_fold_out
  selected_model: lgb_mean
  model_manifest_path: null
  regenerate_test_features: true
  feature_generation:
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false
    use_gpu: auto
  notes:
    - Inference is the PF/Beam reproducibility boundary.
    - Uses exp073's established stable per-well seed policy; no duplicate feature generation is required.
    - Loads exp076 saved LightGBM boosters from the train kernel source.
    - Regenerates exp073 full replay PF/Beam/likelihood-PF test features from current competition raw test files.
    - Records generated feature decompressed content SHA, prediction SHA, and submission SHA.

notes:
  - The user requested the backlog named exp073_exp039_cv_reassessment, but exp075 already exists, so the actual experiment folder is correctly incremented to exp076_exp039_cv_reassessment.
  - This replaces the discarded exp068 reassessment by changing the target from exp063 compact/static artifacts to exp073 deterministic full replay.

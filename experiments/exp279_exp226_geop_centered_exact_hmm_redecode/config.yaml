experiment:
  name: exp279_exp226_geop_centered_exact_hmm_redecode
  description: >-
    Re-decode the fixed exp209 exact HMM with a per-row Gaussian unary centered
    on group-safe exp226 geometry-only tvt_geop, testing whether an absolute
    geometric reference prevents persistent GR mode-slip offsets.
  route: pf_beam
  status: completed_train_side_guard_failed_branch_closed
  created_at: "2026-07-18"
  updated_at: "2026-07-19"

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  sources:
    - exp221_lgb_oof_gaussian_emission_hmm_on_exp148
    - exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    - exp263_last_anchor_better_candidate_confidence_pair_cache
  diff_summary: >-
    Keeps the exp209 grid, 41 rate states, transition grammar, Gaussian raw-GR
    emission, known-prefix calibration, initial position/rate priors, and
    missing-GR interpolation fixed. Adds exactly one Gaussian unary with
    sigma=20 ft and lambda=0.50 centered on the saved group-safe exp226
    geometry-only tvt_geop for every evaluation row. exp226 tvt_pred is
    forbidden to avoid using GR twice. Saved exp226, exp209, and exp072
    predictions reconstruct the exp263 fixed formula as readout-only controls;
    no parent is regenerated or retrained.

validation:
  strategy: group_safe_exp226_geop_unary_exact_hmm_unknown_suffix_oof
  metric: rmse_tvt
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  promotion_baseline:
    candidate: exp263_fixed_exp226_w500_50_50
    oof_rmse: 8.238331
    parity_atol_ft: 0.00001
    public_lb: 7.800
  guards:
    minimum_oof_gain_ft: 0.02
    minimum_improved_folds: 3
    maximum_scope_rmse_regression_ft: 0.02
    maximum_worst_well_rmse_regression_ft: 0.25
    required_geop_grid_coverage: 1.0
    required_finite_coverage: 1.0
  leakage_policy:
    - exp226 OOF is generated with the target well excluded from donor fields and fold kappa fitting.
    - The decoder receives raw horizontal/typewell inputs, known TVT_input prefix, and saved group-safe tvt_geop only.
    - exp226 tvt_pred, gr_delta, unknown-suffix true TVT, error, and abs_error are absent from decoder inputs.
    - Unknown-suffix true TVT is attached by id only after the candidate path for every well is frozen.
    - Recovery episodes and all performance guards are truth-only post-generation readouts and cannot select a parameter.


    valid_role_columns:
      verification_like_spatial: verification_like_spatial_role
      verification_like_typewell_purged: verification_like_typewell_purged_role

model:
  name: exp226_geop_centered_exact_hmm
  estimator: deterministic_exact_hmm_forward_backward
  target: train_unknown_suffix_tvt_for_post_generation_scoring_only
  hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
  geometry_unary:
    source: exp226_group_safe_oof_tvt_geop
    sigma_ft: 20.0
    lambda: 0.50
    log_likelihood_clip: 600.0
    active_variants: [geop_sigma20_lambda050]
    forbid_columns: [tvt_pred, gr_delta, tvt_true, abs_error, error]
  fixed_formula_control:
    name: exp263_fixed_exp226_w500_50_50
    weights:
      exp226_pred: 0.50
      likelihood_pf_mean: 0.25
      exact_hmm: 0.25

audit:
  output_prefix: exp279_exp226_geop_centered_exact_hmm_redecode
  distance_buckets_ft: [50, 100, 250, 500, 1000]
  promotion_scopes:
    near:
      minimum_md_since_ft: 0.0
      maximum_md_since_ft: 250.0
    long_tail:
      minimum_md_since_ft: 1000.0
      maximum_md_since_ft: null
  persistent_offset:
    error_threshold_ft: 10.0
    minimum_consecutive_rows: 128
    return_threshold_ft: 5.0
    recovery_horizons_rows: [256, 512]
  persist_full_posterior: false
  persist_oracle_predictions: false
  persist_selector: false
  persist_candidate_blend: false
  expected_artifacts:
    - exp279_exp226_geop_centered_exact_hmm_redecode_oof_predictions.csv.gz
    - exp279_exp226_geop_centered_exact_hmm_redecode_candidate_metrics.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_fold_metrics.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_distance_bucket_metrics.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_hidden_like_metrics.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_by_well_metrics.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_recovery_episodes.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_recovery_summary.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_well_manifest.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_input_manifest.csv
    - exp279_exp226_geop_centered_exact_hmm_redecode_decoder_manifest.json
    - exp279_exp226_geop_centered_exact_hmm_redecode_summary.json

execution:
  active_hmm_variants: 1
  total_hmm_well_runs: 773
  outer_workers: 1
  numba_num_threads: 4
  progress_every_wells: 2
  max_wells: null
  lightgbm_config_count: 0
  trained_fold_count: 0
  total_boosters: 0
  control_or_parent_retraining: false
  cpu_exact_hmm_control_regenerated: false
  gpu: false
  inference: false
  submission: false
  kaggle_push_approved: false

runtime:
  use_amp: false
  num_workers: 1
  batch_size: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    train_kernel_sources:
      - kentookumura/exp226-k16-kappa-repro-train
      - kentookumura/exp209-joint-exact-parity-train
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train
    inference_kernel_sources: []

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_sorted_well_order_saved_exp226_group_fold
  stochastic_components: []
  parallel_rng_policy: no_rng_outer_workers1_numba_threads4
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - Exact HMM forward-backward and the exp226 geometry unary consume no random numbers.
    - The decoder manifest SHA covers the scientific HMM and unary config because no fitted model exists.
    - Raw and decompressed gzip SHA are recorded separately and decompressed content SHA is primary.
    - Numba parallel floating arithmetic may vary at tiny precision, so this is not a deterministic anchor before a Kaggle rerun check.

inference:
  enabled: false
  mode: disabled_until_all_train_guards_pass_and_user_approves
  create_submission: false
  selected_candidate: null

notes:
  - The initial implementation is one fixed falsifiable variant, not a sigma/lambda search.
  - exp263 is reconstructed only as a saved-prediction comparison and is not blended with the new candidate.
  - A PF rejuvenation follow-up is outside this experiment and requires separate evidence and approval.

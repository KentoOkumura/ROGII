    compact 74 features, three LightGBM configs, and all training parameters
    fixed. Add both saved exp287 fold-safe formation 74 and saved exp335
    strict-nested signed-residual 23 feature families in the frozen order
    clean273, saved74, formation74, signed23. Do not retrain or regenerate
    either standalone parent, any selector, or the saved exp264 control.


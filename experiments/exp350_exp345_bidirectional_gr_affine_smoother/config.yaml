experiment:
  name: exp350_exp345_bidirectional_gr_affine_smoother
  description: >-
    Design-frozen offline fixed-interval affine-state smoothing audit that
    replaces only the causal exp345 GR affine schedule with a deterministic
    bidirectional extended RTS schedule using the full raw-GR sequence of each
    well before one otherwise unchanged exp209 exact-HMM rerun.
  route: pf_beam
  status: stage_0_failed_closed
  created_at: "2026-07-22"
  updated_at: "2026-07-23"

lineage:
  parent: exp345_exp209_time_varying_gr_affine_calibration_hmm
  root_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../.steering/20260722-exp350-exp345-bidirectional-gr-affine-smoother
  design_origin: user_proposed_full_well_gr_bidirectional_smoother_after_exp345
  references:
    - exp318_typewell_group_time_varying_calibration_ssm
    - exp290_piecewise_datum_physical_smoother
  diff_summary: >-
    Keeps the frozen exp345 prefix initialization, state [intercept_b,
    log_scale_a], random-walk transition, outer-train process noise, exp209
    base path, observation variance, HMM grammar, and decoder. The only
    scientific change is a deterministic fixed-interval extended RTS backward
    pass over the full score-suffix raw-GR sequence after the exp345 forward
    EKF. The smoothed affine schedule is frozen and used for exactly one new
    exact-HMM candidate. Saved exp345 parent and causal predictions are controls;
    neither control HMM is rerun.


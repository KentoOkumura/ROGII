validation:
  strategy: last640_prefix_mask_offline_fixed_interval_smoother_audit
  metric: rmse
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  group_column: well_id
  expected_wells: 773
  expected_raw_rows: 3783989
  expected_stage_0_score_rows: 494720
  score_rows: last_640_rows_after_tvt_input_mask
  prefix_mask_backtest:
    horizon_rows: 640
    minimum_visible_prefix_rows: 160
    tvt_policy: mask_last_640_tvt_input_rows_before_any_candidate_generation
    gr_policy: retain_full_raw_gr_because_full_well_gr_is_available_at_inference
    smoother_interval: first_scored_row_through_last_row_of_current_well
    truth_join_policy: freeze_base_forward_smoother_schedule_and_prediction_before_truth
  dependency_policy:
    required_parent: exp345_exp209_time_varying_gr_affine_calibration_hmm
    required_parent_status: stage_0_full_failed_closed
    required_parent_decision: stage_failed_close_without_rescue
    fail_closed_on_dependency_mismatch: true
    reopen_parent: false
  leakage_policy:
    - Full-well raw GR, MD, Z, and Type Well GR are allowed because they exist for every inference row.
    - Last-640 TVT_input and every suffix true TVT, error, abs_error, formation, and oracle label are forbidden before prediction freeze.
    - The exp345 masked parent mean and standard deviation are immutable base-path inputs; the bidirectional pass may not update TVT or rerun the parent.
    - The exp345 outer-train process-noise table is reused by exact SHA and may not be re-estimated from held-out or score-row truth.
    - Fold and hidden-like roles are attached only after the new schedule and prediction content SHA are frozen.
    - Future raw GR is intentionally allowed, so the candidate is an offline full-well method and must not be described as streaming or causal.
    - Exactly one forward affine filter, one backward smoother, and one candidate HMM pass are allowed; iterative calibration is forbidden.


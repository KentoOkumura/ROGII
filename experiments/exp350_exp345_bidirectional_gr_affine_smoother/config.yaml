model:
  name: offline_bidirectional_extended_rts_affine_exp209_exact_hmm
  estimator: none
  target: TVT
  active_variants: [one_pass_bidirectional_rts_affine_schedule_on_exp209]
  base_path:
    stage_0_source: saved_exp345_masked_parent_hmm_mean_and_std
    stage_1_source: saved_exp209_full_suffix_hmm_mean_and_std
    parent_control_rerun: false
    causal_control_rerun: false
    calibration_iterations: 1
    freeze_before_forward_filter: true
  forward_affine_state:
    contract: exact_exp345_causal_ekf_regeneration
    state: [intercept_b, log_scale_a]
    transition: local_level_random_walk
    initial_fit: robust_current_well_visible_prefix_affine
    minimum_prefix_pairs: 40
    minimum_typewell_gr_std: 5.0
    slope_bounds: [0.25, 4.0]
    maximum_prefix_rmse: 60.0
    trim_quantile: 0.90
    robust_iterations: 2
    process_noise: reuse_saved_exp345_outer_train_empirical_bayes_table
    process_noise_estimator: median_squared_adjacent_robust_prefix_state_increment
    process_noise_state_sequence: cumulative_robust_fit_every_40_finite_pairs_plus_final
    process_noise_increment_normalization: squared_state_increment_per_source_row
    process_noise_shrinkage_space: linear_variance
    process_noise_numerical_floor: 1.0e-12
    initial_covariance: trimmed_ols_covariance_transformed_to_intercept_and_log_scale
    prefix_rmse_scope: retained_pairs_after_fixed_trim_iterations
    schedule_state_timing: current_row_posterior_after_one_finite_raw_gr_update
    gr_nll_policy: one_step_predictive_before_current_row_update
    covariance_update: joseph_form
    missing_raw_gr_update_policy: skip_update_propagate_state
    parity_max_abs_tolerance: 1.0e-10
  bidirectional_smoother:
    algorithm: deterministic_fixed_interval_extended_rts
    transition_matrix: identity_2x2
    interval: entire_masked_score_suffix_of_each_well
    observation_source: full_raw_gr_including_future_score_rows
    predicted_state_source: exp350_regenerated_forward_ekf_records_after_exp345_schedule_parity
    smoothing_gain: filtered_covariance_times_pinv_next_predicted_covariance
    pseudoinverse_rcond: 1.0e-12
    backward_order: last_score_row_to_first_score_row
    terminal_policy: smoothed_terminal_equals_filtered_terminal
    covariance_symmetrization: half_matrix_plus_transpose
    covariance_negative_eigen_tolerance: 1.0e-8
    covariance_numerical_floor: 1.0e-12
    output_scale_policy: clip_exp_log_scale_to_exp345_bounds_after_smoothing
    maximum_output_scale_clip_fraction: 0.01
    missing_raw_gr_policy: no_measurement_update_but_backward_state_information_propagates
    freeze_before_variant_hmm: true
  variant_hmm:
    state_gr_formula: exp_log_scale_a_smoothed_t_times_typewell_gr_state_plus_smoothed_intercept_b_t
    active_variants: [one_pass_bidirectional_rts_affine_schedule_on_exp209]
  fixed_exp209_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    emission: gaussian
    emission_clip_z2: 600.0
    sigma_mode: std
    sigma_known_gr_policy: fill_missing_with_zero_before_population_std
    sigma_clip: [10.0, 60.0]
    missing_gr_weight: none_exact_weight_1
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp
    effective_position_sigma_floor: 0.1225
    output: posterior_mean
  forbidden:
    - changing_forward_filter_or_process_noise
    - finite_only_or_robust_sigma_gr
    - missing_gr_downweight
    - well_adaptive_or_time_varying_sig_r
    - changing_sig_p_momentum_grid_or_prior
    - typewell_group_prior
    - joint_tvt_rate_affine_state_grid
    - more_than_one_forward_backward_calibration_pass
    - affine_parameter_or_smoother_grid
    - causal_bidirectional_prediction_blend
    - row_or_well_gate
    - truth_or_error_conditioned_smoothing


notes:
  - This implements the backlog item `u_projection_correction_disagreement_fullrun`.
  - This is the formal fullrun follow-up to exp085's timeout/log-derived finding.
  - Target ablation is not mixed into this experiment; the target remains TVT - last_known_tvt.
  - LGB OOF U-space features are deferred until a nested fold implementation is added.

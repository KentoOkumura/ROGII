experiment:
  name: exp025_pseudo_tail_postprocess_cv_audit
  description: Audit postprocess choices on the exp024 raw pseudo-tail anchor using fold-held OOF predictions
  route: ml_model
  status: planned
  created_at: "2026-06-06"
  updated_at: "2026-06-06"

lineage:
  parent: exp024_pseudo_tail_inference_postprocess
  diff_summary: Recreate the exp023 selected pseudo_tail_3_cutoffs_distance_balanced OOF predictions and audit conservative postprocess candidates before changing inference.

validation:
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Pseudo cutoffs are generated only inside training-fold wells.
    - Held-out fold scoring uses only each well's original TVT_input NaN evaluation zone.
    - Postprocess alpha fitting excludes the original validation fold or a stable well-hash holdout fold before evaluation.
    - Train-only formation columns are not used.
    - Inference postprocess is not selected unless held-out audits improve the raw pseudo-tail anchor.

data: {}

model:
  name: pseudo_tail_augmented_last_anchor_residual
  primary_strategy: drift_model
  drift_strategy: drift_model
  feature_set: no_gr_signal
  strategies:
    - last_anchor
    - recent_linear
    - drift_model
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: LGBMRegressor
    params:
      n_estimators: 800
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 80
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 0.1
      n_jobs: 2
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800


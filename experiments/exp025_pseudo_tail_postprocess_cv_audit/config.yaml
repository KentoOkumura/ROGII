  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  kaggle:
    kernel_sources: []

notes:
  - This experiment writes no inference submission.
  - It regenerates selected pseudo-tail OOF predictions from the fold-safe training recipe because exp023 saved compact metrics only.
  - Same-OOF fitted alphas are diagnostic only; held-out original-fold and well-hash audits decide whether postprocess should move to inference.

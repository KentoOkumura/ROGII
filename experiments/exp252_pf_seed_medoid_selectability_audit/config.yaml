experiment:
  name: exp252_pf_seed_medoid_selectability_audit
  description: >-
    Audits whether fixed target-free PF seed-cluster diagnostics can identify
    when exp243 K8 medoids add useful trajectory modes to the exp237 base8 bank.
  route: pf_beam
  status: completed_candidate_likelihood_signal_bank_gate_weak_no_selector
  created_at: "2026-07-15"

overrides:
  project_defaults:
    - validation.n_folds
    - validation.metric

lineage:
  parent: exp243_pf_seed_medoids
  references:
    - exp237_hmm_exp226_candidate_selector_on_exp183
    - docs/06_reproducibility.md
    - backlog/KAGGLE_DIRECTION.md pf_seed_medoid_selectability_audit
  diff_summary: >-
    Reads the canonical exp243 v3 base8 plus K8 row candidates, K8 cluster
    manifest and summary, and PF diagnostics without replaying PF. It freezes
    standalone target-free bank and medoid scores before joining true TVT for
    best-source labels, AUC, top1 regret, and coverage readouts.

validation:
  strategy: full_train_exp243_saved_candidate_selectability_audit
  metric: diagnostic_auc_regret_coverage
  n_folds: 0
  group_column: well
  score_rows: exp243_fixed_pseudotail_rows
  scopes:
    - row
    - block_128
    - block_256
    - block_512
    - whole_well
  leakage_policy:
    - All score values use only saved PF trajectories, cluster membership, likelihood, and PF diagnostics.
    - True TVT is passed only to the loss-and-label stage after score tables are frozen.
    - K, score signs, scope definitions, tie policy, coverage fraction, and shuffle policy are fixed before execution.
    - No score is combined, tuned, filtered, or selected using target-side results.


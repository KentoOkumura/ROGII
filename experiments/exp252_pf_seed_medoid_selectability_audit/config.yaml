model:
  name: none_saved_candidate_selectability_audit
  estimator: none
  k_values: [8]
  active_variant_count: 1
  lightgbm_config_count: 0
  fold_count: 0
  booster_count: 0
  pf_replay_count: 0
  parent_control_retraining: false

audit:
  mode: fixed_target_free_score_readout
  base_candidates:
    - pf_base_pf_ancc
    - pf_base_beam_mean
    - pf_base_likpf_mean
    - pf_base_sc_ens
    - pf_base_hyb
    - pf_base_tvt_dense
    - pf_base_tvt_densew
    - pf_base_tvt_dense50
  medoid_candidates:
    - pf_seed_medoid_k8_m0
    - pf_seed_medoid_k8_m1
    - pf_seed_medoid_k8_m2
    - pf_seed_medoid_k8_m3
    - pf_seed_medoid_k8_m4
    - pf_seed_medoid_k8_m5
    - pf_seed_medoid_k8_m6
    - pf_seed_medoid_k8_m7
  block_rows: [128, 256, 512]
  row_loss: absolute_error
  aggregate_loss: rmse
  tie_tolerance_ft: 1.0e-6
  coverage_top_fraction: 0.10
  ratio_epsilon: 1.0e-6
  primary_bank_label: union_best_source_is_k8
  primary_candidate_label: medoid_is_union_best
  secondary_candidate_label: medoid_beats_best_base8
  bank_scores:
    - cluster_normalized_entropy
    - negative_cluster_hhi
    - effective_cluster_count
    - mean_assignment_distance
    - max_pairwise_seed_distance
    - negative_ess_mean
    - resampling_rate
    - log_likelihood_std
    - seed_prediction_std
    - k8_max_nearest_base_disagreement
  candidate_scores:
    - cluster_seed_mass
    - cluster_likelihood_mass
    - medoid_likelihood_rank_score
    - medoid_likelihood_gap_from_best
    - negative_mean_within_distance
    - separation_to_within_ratio
    - nearest_base8_disagreement
  shuffled_control:
    enabled: true
    seed: 42
    static_policy: stable_well_permutation_preserve_candidate_slot
    dynamic_policy: stable_scope_unit_permutation_preserve_candidate_slot
  outputs:
    score_contract_filename: exp252_pf_seed_medoid_selectability_audit_score_contract.csv
    scope_metrics_filename: exp252_pf_seed_medoid_selectability_audit_scope_metrics.csv
    score_metrics_filename: exp252_pf_seed_medoid_selectability_audit_score_metrics.csv
    top1_regret_filename: exp252_pf_seed_medoid_selectability_audit_top1_regret.csv
    by_well_filename: exp252_pf_seed_medoid_selectability_audit_by_well.csv
    summary_filename: exp252_pf_seed_medoid_selectability_audit_summary.json

runtime:
  use_amp: false
  num_workers: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp243-pf-seed-medoids-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: stable_sha256_per_scope_score_for_shuffled_control
  stochastic_components:
    - shuffled_score_negative_control_only
  parallel_rng_policy: local_numpy_generator_single_process_no_global_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: false
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - Determinism is claimed only for the diagnostic given fixed canonical exp243 v3 inputs.
    - The upstream exp243 candidate bank inherits PF stochastic provenance but passed exact replay parity against exp072.
    - This experiment is not a prediction or submission anchor.

inference:
  enabled: false
  mode: disabled_train_side_selectability_audit_only
  selected_candidate: null
  create_submission: false
  notes:
    - A clear target-free signal may only motivate a separate outer-well-fold selector experiment.
    - This experiment never regenerates raw-test PF candidates or creates submission.csv.

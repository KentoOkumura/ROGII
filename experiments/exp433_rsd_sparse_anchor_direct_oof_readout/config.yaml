  canonical_train_notebook_adoption_source: user_message_2026_07_28_execute_exp433
  canonical_inference_notebook_is_placeholder: true
  inference_enabled: false
  submission_enabled: false

validation:
  strategy: frozen_saved_score_direct_full_oof_replay_then_late_truth_evaluation
  metric: rmse_and_fixed_mechanism_tail_gates
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  expected_blocks: 7787
  expected_score_rows: 101231
  fixed_probe_well: 000d7d20
  parent_rmse: 9.427109596582213
  parent_rmse_atol_ft: 1.0e-6
  primary_prediction: sparse_rsd_viterbi
  diagnostic_prediction: blockwise_rsd_top1_zero_fallback
  coverage_role: mandatory_report_not_a_truth_read_or_scientific_stop_gate
  truth_attachment: after_input_decoder_support_datum_path_and_prediction_sha_freeze
  report_scopes:
    - pooled
    - fold
    - distance_0_50
    - distance_50_100
    - distance_100_500
    - distance_500_1000
    - distance_1000_plus
    - raw_gr_observed
    - raw_gr_missing
    - high_missing
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - persistent_episode
    - by_well
  leakage_policy:
    - The exp426 score bank is immutable input and is never regenerated.
    - Before prediction freeze, read only score-bank target-free columns and exp226 well_id, row_idx, suffix_offset, fold, and tvt_pred.
    - Truth, error, oracle offset, persistent episode, and hidden-like roles are late joins only.
    - Input, support, datum path, row prediction, and logical content SHAs freeze before late joins.
    - Coverage or post-freeze outcomes never activate, select, shrink, clip, or blend the primary prediction.


experiment:
  name: exp433_rsd_sparse_anchor_direct_oof_readout
  description: >-
    Apply the frozen exp426 RSD-binned GR score bank to the real exp226 OOF
    prediction with one fixed sparse-anchor Viterbi decoder and judge actual
    full-OOF RMSE rather than stopping on dense score coverage.
  hypothesis: >-
    Although exp426 supports only a sparse subset of blocks, those target-free
    absolute-datum observations may still reduce exp226 accumulated offset
    when unsupported blocks carry the previous datum through a fixed decoder.
  route: pf_beam
  status: completed_scientific_failed_closed
  priority: P2
  created_at: "2026-07-28"
  updated_at: "2026-07-28"

lineage:
  parent: exp426_rsd_binned_pattern_absolute_reanchor
  base_prediction: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  steering: ../../.steering/20260728-exp433-rsd-sparse-anchor-direct-oof-readout
  references:
    - exp280_exp226_shift_likelihood_separability_readout
    - exp360_typewell_reference_shift_zncc_confidence_readout
    - exp421_signed_segment_rate_numerical_contract_stage1
  diff_summary: >-
    Keeps the failed exp426 Stage-A score, support, block, offset, and rank
    artifacts byte/logically frozen; changes only the evaluation contract by
    applying the preregistered sparse-datum Viterbi to the actual exp226 OOF
    and making full-row RMSE the primary outcome.

overrides:
  project_defaults:
    - validation.metric

implementation:
  enabled: true
  scope: compact_selfcontained_train_implementation_ready
  compact_train_source_created: true
  compact_train_source: exp433_rsd_sparse_anchor_direct_oof_readout_compact_selfcontained_train.py
  compact_train_notebook_created: true
  compact_train_notebook: exp433_rsd_sparse_anchor_direct_oof_readout_compact_selfcontained_train.ipynb

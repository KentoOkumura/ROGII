    role_columns:
      hidden_like_spatial: verification_like_spatial_role
      hidden_like_typewell_purged: verification_like_typewell_purged_role
    expected_sha256: 5f9ac9fac6bb3725a7c613f09856a85bdf73b8206fd2edf1b79e8eaa9bca6597

model:
  name: tempered_raw_swt_exact_hmm_posterior_mean_audit
  estimator: none
  target: TVT
  active_scientific_variants:
    - tempered_raw_swt_beta015
  active_variant_count: 1
  lightgbm_config_count: 0
  fold_training_count: 0
  booster_count: 0
  parent_control_retraining: false
  emission:
    raw_weight: 0.85
    swt_weight: 0.15
    formula: ell_beta_equals_raw_weight_times_ell_raw_plus_swt_weight_times_ell_swt
    sigma_source: known_prefix_raw_gr_residual_std
    sigma_clip: [10.0, 60.0]
    log_likelihood_clip: 600.0
    recompute_sigma_from_swt: false
  hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
    decoder: posterior_mean
    hmm_well_runs: 773
  blend:
    enabled: true
    tempered_hmm_weight: 0.50
    saved_likpf_weight: 0.50
    weight_grid: false

audit:
  saved_baselines:
    raw_hmm_rmse: 11.9382872349
    saved_likpf_rmse: 11.5948976722
    raw_hmm_likpf_50_50_rmse: 10.2696961466
    metric_absolute_tolerance: 1.0e-6
  promotion:
    direct_minimum_rmse_improvement_ft: 0.05
    blend_minimum_rmse_improvement_ft: 0.05
    minimum_folds_improved: 4
    required_non_degradation_scopes:
      - md_since_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
      - by_well_rmse_p95
    non_degradation_float_tolerance_ft: 1.0e-6
    worst_well_delta_rmse_max_ft: 0.25
    finite_coverage_min: 1.0
    id_mismatch_max: 0
    failure_action: close_without_rescue_and_keep_reserved_pf_transfer_closed
  expected_outputs:
    - exp305_tempered_raw_smoothed_exact_hmm_emission_scientific_contract.json
    - exp305_tempered_raw_smoothed_exact_hmm_emission_input_control_manifest.json
    - exp305_tempered_raw_smoothed_exact_hmm_emission_predictions.csv.gz
    - exp305_tempered_raw_smoothed_exact_hmm_emission_by_well_runtime.csv
    - exp305_tempered_raw_smoothed_exact_hmm_emission_overall_fold_scope_metrics.csv
    - exp305_tempered_raw_smoothed_exact_hmm_emission_by_well_metrics.csv
    - exp305_tempered_raw_smoothed_exact_hmm_emission_promotion_gate.json
    - exp305_tempered_raw_smoothed_exact_hmm_emission_summary.json

execution:
  implementation_approved: true
  kaggle_push_approved: true
  run_train: true
  run_inference: false
  create_submission: false
  kaggle_kernel_id: kentookumura/exp305-tempered-raw-swt-exact-hmm-emission-train
  kaggle_kernel_version: 3
  kaggle_kernel_url: https://www.kaggle.com/code/kentookumura/exp305-tempered-raw-swt-exact-hmm-emission-train

runtime:
  use_amp: false
  outer_workers: 2
  numba_num_threads: 2
  runtime_limit_seconds: 30600
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp304-gr-denoiser-separability-train
      - kentookumura/exp209-joint-exact-parity-train
      - kentookumura/exp226-k16-kappa-repro-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train
    inference_kernel_sources: []

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_new_rng_sorted_wells_saved_likpf_only
  stochastic_components:
    - Saved exp072 likPF was generated upstream with stable SHA256 per-well seeds and is not rerun here.
  parallel_rng_policy: exact_hmm_has_no_rng_outer_workers_2_numba_threads_2_recorded
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a train-side scientific candidate, not a deterministic submission anchor.
    - Record raw gzip SHA separately and use decompressed prediction content SHA as primary evidence.
    - Rebuild and inspect the Kaggle bootstrap only after implementation and push approval.

inference:
  enabled: false
  mode: disabled_train_side_tempered_exact_hmm_audit_only
  create_submission: false

notes:
  - Design frozen on 2026-07-21; implementation and the fixed Kaggle CPU train run were explicitly approved.
  - The approved run is exactly one scientific variant and 773 exact-HMM well-runs with zero model, LightGBM config, trained fold, PF, Beam, booster, or parent/control reruns.
  - Any change to beta, SWT, HMM, control, blend, scope, or gate requires steering revision before implementation.

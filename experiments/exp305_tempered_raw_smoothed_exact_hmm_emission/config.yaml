experiment:
  name: exp305_tempered_raw_smoothed_exact_hmm_emission
  description: >-
    Design-frozen train-side exact-HMM audit that weakly tempers the raw GR
    emission with the exp304-selected stationary db4 level-3 SWT emission and
    evaluates the posterior mean plus a fixed saved-likPF 50/50 blend.
  route: pf_beam
  status: train_side_tempered_exact_hmm_gate_failed_closed
  created_at: "2026-07-21"
  updated_at: "2026-07-21"

lineage:
  parent: exp304_gr_denoiser_emission_separability_readout
  methodology_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  hidden_like_reference: exp115_hidden_like_spatial_holdout_from_ppt
  reserved_contract: ../exp304_gr_denoiser_emission_separability_readout/reserved_followup_contract.md
  steering: ../../.steering/20260721-exp305-tempered-raw-smoothed-exact-hmm-emission
  diff_summary: >-
    Keeps the exp304-selected SWT series and the exp209 state grid, transition,
    prior, known-prefix raw sigma, missing policy, and posterior-mean decoder
    fixed. The only scientific change is ell_beta = 0.85 * ell_raw + 0.15 *
    ell_swt. Saved raw-HMM, likPF, and raw-HMM/likPF controls are not rerun.

overrides:
  project_defaults:
    - validation.strategy
    - validation.score_rows

validation:
  strategy: train_side_fixed_control_tempered_exact_hmm_paired_readout
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  truth_attachment: after_tempered_prediction_and_content_sha_are_frozen
  fold_improvement_minimum: 4
  leakage_policy:
    - Horizontal true TVT, error, abs_error, and formation are unavailable during HMM generation.
    - True TVT and diagnostic scopes are joined only after prediction content SHA is frozen.
    - No raw-test prediction, inference, selector, oracle gate, or submission is generated.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp304_selected_series:
    kernel_source: kentookumura/exp304-gr-denoiser-separability-train
    kernel_version: 1
    filename: exp304_gr_denoiser_emission_separability_readout_denoised_gr_series.csv.gz
    manifest_filename: exp304_gr_denoiser_emission_separability_readout_denoised_gr_manifest.json
    summary_filename: exp304_gr_denoiser_emission_separability_readout_summary.json
    scientific_contract_filename: exp304_gr_denoiser_emission_separability_readout_scientific_contract.json
    input_manifest_filename: exp304_gr_denoiser_emission_separability_readout_input_manifest.json
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp304-gr-denoiser-separability-train/artifacts
      - /kaggle/input/exp304-gr-denoiser-separability-train/artifacts
      - /tmp/kaggle-output/exp304_gr_denoiser_emission_separability_readout/train_v1/artifacts
    expected_data_rows: 6659300
    expected_selected_denoiser: swt_db4_l3
    expected_silent_fallback_count: 0
    expected_content_sha256: a4acb72d60b833b12b2560db1e5dc3a113ae6ecf4137efbccf78c278582a0988
    expected_scientific_contract_sha256: 8822df968200b74ea9969b0bc023ec127debbff01933bdc89ff3db9844d55064
    expected_raw_well_identity_sha256: bbb687a1998092578583ce259309b49031d095bde57cbb26c0ab8808d2379b32
    require_nonzero_file_size: true
    require_manifest_raw_decompressed_content_sha_match: true
  saved_controls:
    kernel_source: kentookumura/exp209-joint-exact-parity-train
    hmm_cache_filename: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation_amerhu_exact_hmm_smoother_default_train_features.csv.gz
    exp072_cache_filename: exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp209-joint-exact-parity-train/artifacts
      - /kaggle/input/exp209-joint-exact-parity-train/artifacts
      - /tmp/kaggle-output/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation/train_v5/artifacts
    expected_hmm_decompressed_sha256: 8e2f42367b7b8b28e73094eae642c57c75dc8a7ebcfbc3826b0f2067b37f7ae5
    expected_exp209_v5_exp072_cache_decompressed_sha256: 0503de0512302b06309d26e09fc06ba5095db0ef4d610b1508afe8c8d07ca536
    raw_hmm_prediction_column: hmm_mean_tvt
    likpf_prediction_column: likpf_mean_d
    likpf_prediction_representation: delta_from_last_known_tvt
  fold_assignment:
    filename: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
    candidates:

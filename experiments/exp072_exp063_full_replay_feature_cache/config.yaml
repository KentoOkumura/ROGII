experiment:
  name: "exp072_exp063_full_replay_feature_cache"
  description: CPU-only reusable train feature cache for exp063 full public replay PF/Beam/likelihood-PF features.
  route: pf_beam
  status: completed
  created_at: "2026-06-14"
  updated_at: "2026-06-15"

lineage:
  parent: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
  implementation_source: feature_cache.py
  public_replay_source: public_notebook_replay_audit.py
  diff_summary: Generates exp063-compatible full Pixiux public replay train features for reuse. No model training or test feature cache is produced. v2 adds per-well stable seeds for ANCC PF, Z PF, and likelihood-PF generation so the train cache can be regenerated deterministically.

validation:
  leakage_policy:
    - Uses only raw competition train files for generated train features.
    - Does not read raw test files.
    - Does not train models, infer, submit, or use labels outside the generated train target column.
    - Downstream experiments must regenerate current test features inside their own inference notebooks.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv

model:
  name: no_model_train_feature_cache
  estimator: none
  target: target
  base_prediction: last_known_tvt

feature_cache:
  variant: pixiux_likpf_public_replay
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  expected_feature_count: 196
  output_prefix: exp063_full_replay_feature_cache
  n_jobs: 8
  pf_seeds: 128
  pf_particles: 500
  fast: false
  max_wells: null
  expected_artifacts:
    - exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    - exp063_full_replay_feature_cache_feature_schema.csv
    - exp063_full_replay_feature_cache_summary.json

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources: []
    inference_kernel_sources: []

inference:
  mode: not_applicable_train_feature_cache_only
  notes:
    - Test PF/Beam/likelihood-PF features are intentionally not cached here.
    - Each downstream inference notebook should regenerate current raw test features directly.

notes:
  - This experiment exists to avoid repeatedly regenerating heavy train PF/Beam features in GPU notebooks.
  - The train cache keeps the full exp063 Pixiux feature surface, not the compact tracker subset.
  - v2 deterministic patch seeds ANCC PF, Z PF, and likelihood-PF from stable SHA256 keys using well id and split.
  - v2 completed on Kaggle with train feature SHA256 14faee3a24de587b7190e7febffd33cc1256e418c7505f2d1e6f5f7c9b3c2f18.

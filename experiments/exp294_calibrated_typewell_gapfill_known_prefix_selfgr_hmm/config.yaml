  use_amp: false
  outer_workers: 2
  numba_num_threads: 2
  expected_stage1_elapsed_hours: 5_to_6_based_on_exp223_two_variant_runtime
  gpu_enabled: false
  internet_enabled: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: stable_sha256_per_well_fold_runlength_no_global_rng
  stochastic_components: []
  parallel_rng_policy: No RNG is consumed; outer well scheduling must not affect mask identity.
  feature_sha_policy: decompressed_content_sha_for_gzip_plus_raw_gzip_sha_as_secondary
  record:
    kernel_version: true
    input_sha: true
    saved_control_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    pseudo_mask_sha: true
    prediction_sha: true
    model_manifest_sha: false

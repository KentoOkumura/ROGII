experiment:
  name: "exp188_exp183_selector_confidence_addonly_on_exp148"
  description: Add exp183 selector selected-path confidence features on top of the exp148 learned-likelihood LightGBM surface.
  route: ml_model
  status: train_completed_not_selected
  created_at: "2026-07-04"
  updated_at: "2026-07-04"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  learned_likelihood_subset_parent: exp127_learned_likelihood_features_on_exp092
  selector_parent: exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector
  selector_lineage:
    - exp157_candidate_ranker_feature_enrichment
    - exp158_segment_continuity_selector_on_exp157
    - exp181_cluster_outlier_pfbeam_prior_gate
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp160_sp45_bimodal_selector_confidence_features_on_exp148
    - exp162_learned_likelihood_rank_slot_on_exp148
    - exp175_cluster_outlier_typewell_prior_gate
  implementation_source: exp183_selector_confidence_addonly_on_exp148.py
  diff_summary: >
    Keeps the exp148 ML feature surface (exp092 U-projection plus exp145 learned
    likelihood confidence) and adds exp183 OOF best-Viterbi selector selected-path
    confidence features as an add-only ML route experiment. The exp183 selected
    path is used only as model features, not as direct replacement, blend,
    postprocess, or hard gate.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_exp183_selector_addonly_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_exp145_full_train_ml_features_and_exp183_oof_selector_path
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - The learned likelihood fold column is used only for inventory and is not a model feature.
    - Exp145 full-train cache covers the exp072/exp092 3,783,989-row train surface; any dropped rows fail the coverage check.
    - Exp183 selector features are read from the exp183 OOF best Viterbi selected path only; true_tvt, abs_error, oracle_candidate, and oracle_label columns are explicitly excluded.
    - Exp183 selected TVT is used only as confidence/path surface features and never as final replacement, blend, postprocess, or hard gate.
    - Exp183 Viterbi hyperparameter choice is a train-side selected upstream artifact; submit requires a later raw-test/current-test compatible selector feature port in the same exp188 directory.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json
  learned_likelihood_train_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_full_train_ml_features.csv.gz
  learned_likelihood_rawtest_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_rawtest_ml_features.csv.gz
  learned_likelihood_train_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_rawtest_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_train_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  learned_likelihood_rawtest_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  exp099_artifact_dir_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts
  exp099_train_feature_cache_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_train_features.csv.gz
  exp099_feature_schema_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_feature_schema.csv
  exp111_artifact_dir_local: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts
  exp111_feature_schema: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts/exp111_learned_pf_observation_likelihood_probe_feature_schema.csv
  exp111_model_manifest: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts/exp111_learned_pf_observation_likelihood_probe_model_manifest.json
  exp112_artifact_dir_local: experiments/exp112_learned_pf_likelihood_weight_or_feature_followup/kaggle/output/train_v1/artifacts
  exp112_feature_schema: experiments/exp112_learned_pf_likelihood_weight_or_feature_followup/kaggle/output/train_v1/artifacts/exp112_learned_pf_likelihood_weight_or_feature_followup_feature_schema.csv
  exp183_selector_oof_predictions_local: /tmp/kaggle-output/exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector/train_v2/artifacts/exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector_oof_predictions.csv.gz
  exp183_selector_summary_local: /tmp/kaggle-output/exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector/train_v2/artifacts/exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector_summary.json
  exp148_oof_predictions_local: experiments/exp148_learned_likelihood_fulltrain_addonly_on_exp092/kaggle/output/train_v1/artifacts/exp148_learned_likelihood_fulltrain_addonly_on_exp092_predictions.csv.gz

model:
  name: exp188_exp183_selector_confidence_addonly_on_exp148_lgbm
  source_experiment: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_experiment: exp092_u_projection_correction_disagreement_fullrun
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  learned_likelihood_feature_experiment: exp145_learned_likelihood_rawtest_feature_generator_parity
  selector_feature_experiment: exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_exp145_full_train_ml_features_plus_exp183_oof_selector_path_features
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  exp183_selector_features:
    prefix: exp183_
    oof_predictions_path: /tmp/kaggle-output/exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector/train_v2/artifacts/exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector_oof_predictions.csv.gz
    selected_variant: viterbi_sw200_bias000_jw100_jf025_d0075_std999999_md0000_seg001
    selected_mode: viterbi
    max_missing_rate: 0.0
    default_candidate: likpf_mean
    pfbeam_candidates:
      - pf_ancc
      - beam_mean
      - likpf_mean
      - sc_ens
      - hyb
    dense_candidates:
      - tvt_dense
      - tvt_densew
      - tvt_dense50
    candidate_tvt_specs:
      - name: pf_ancc
        column: pf_ancc
        kind: absolute
      - name: beam_mean
        column: beam_mean_d
        kind: delta
      - name: likpf_mean
        column: likpf_mean_d
        kind: delta
      - name: sc_ens
        column: sc_ens_d
        kind: delta
      - name: hyb
        column: hyb_d
        kind: delta
      - name: tvt_dense
        column: tvt_dense_d
        kind: delta
      - name: tvt_densew
        column: tvt_densew_d
        kind: delta
      - name: tvt_dense50
        column: tvt_dense50_d
        kind: delta
    exp148_oof_predictions_path: experiments/exp148_learned_likelihood_fulltrain_addonly_on_exp092/kaggle/output/train_v1/artifacts/exp148_learned_likelihood_fulltrain_addonly_on_exp092_predictions.csv.gz
    exp148_oof_variant: learned_likelihood_confidence_addonly
    exp148_oof_mode: gpu_repro_guard_dp_threads8
    exp148_oof_model: lgb_mean
  feature_ablation:
    selected_variant: exp183_selector_confidence_addonly
    active_variants:
      - name: exp148_fulltrain_control
        description: Disabled by cost guard; use completed exp148 CV/Public LB as the comparison baseline unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
        enabled: false
      - name: exp183_selector_confidence_addonly
        description: Adds exp183 OOF best-Viterbi selected path, selected candidate/family, candidate disagreement, path jump, and segment stability features on top of exp148.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
          - exp183_selector_confidence
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
      - kentookumura/exp183-copcf-train
    inference_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp188-exp183-selconf-exp148-train
      - kentookumura/exp099-pf-multiobs-likelihood-train
      - kentookumura/exp111-learned-pf-likelihood-train
      - kentookumura/exp112-learned-pf-likelihood-followup-train

generator:
  chunksize: 200000
  include_candidate_values: false
  default_candidate: likpf_mean
  candidates:
    - name: pf_ancc
      column: pf_ancc
    - name: beam_mean
      column: beam_mean
    - name: likpf_mean
      column: likpf_mean
    - name: sc_ens
      column: sc_ens
    - name: hyb
      column: hyb
  row_context_columns:
    - last_known_tvt
    - pf_ancc_std
    - beam_mean_d
    - sc_ens_d
    - hyb_d
    - eval_len
    - md_since
    - likpf_mean_d
  multiobs_global_columns:
    - multiobs_score_max
    - multiobs_score_mean
    - multiobs_score_gap
    - multiobs_top1_source_id
    - multiobs_top1_mae
    - multiobs_top1_ncc
  feature_cache:
    include_candidate_tvt: true
    include_multiobs_scores: true
    include_probability_features: true
    include_expected_error_features: true
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng_and_fixed_upstream_exp183_oof_selector_artifact
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - upstream_exp183_lightgbm_selector_oof_surface
    - gpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; feature merge itself has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a full-train add-only feature audit, not a deterministic submission anchor.
    - Exp183 OOF selector path is an upstream fixed train-side artifact and excludes true_tvt, abs_error, oracle_candidate, and oracle_label from downstream features.
    - Raw-test exp183 selector feature generation is not part of initial train implementation; submission requires a later inference port in the same experiment.

audit:
  mode: exp183_selector_confidence_addonly_on_exp148_full_train_rows
  output_prefix: exp188_exp183_selector_confidence_addonly_on_exp148
  fast: false
  reference_metrics:
    exp148_lgb_mean_pooled_rmse: 8.50128118189582
    exp148_public_lb: 7.960
    exp160_lgb_mean_pooled_rmse: 8.463718773783008
    exp160_public_lb: 8.061
    exp183_best_viterbi_rmse: 10.601481774
  expected_train_artifacts:
    - exp188_exp183_selector_confidence_addonly_on_exp148_metrics.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_by_well.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_bucket_metrics.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_projection_feature_summary.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_learned_feature_summary.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_exp183_selector_feature_summary.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_feature_importance.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_feature_importance_mean.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_feature_importance_mean_top.png
    - exp188_exp183_selector_confidence_addonly_on_exp148_predictions.csv.gz
    - exp188_exp183_selector_confidence_addonly_on_exp148_feature_schema.csv
    - exp188_exp183_selector_confidence_addonly_on_exp148_lgb_models/manifest.json
    - exp188_exp183_selector_confidence_addonly_on_exp148_summary.json

inference:
  mode: not_selected_train_side_addonly_first
  selected_variant: null
  selected_mode: null
  selected_model: null
  notes:
    - Initial implementation is train-side only.
    - If OOF is positive, add current-test exp183 selector feature generation and saved-booster inference in this same exp188 directory.
    - Do not submit a direct exp183 selected TVT path or hard selector.

notes:
  - Implements the `exp183_selector_confidence_addonly_on_exp148` backlog item as exp188.
  - Planned Kaggle train cost is 1 active add-only variant, 3 LightGBM configs, 5 folds, 15 boosters.
  - Parent/control retraining is not included; exp148 CV/Public LB are historical baselines.
  - The train code is a single GPU notebook and is not split into lgb0/lgb1/lgb2 notebook packages.
  - Direct exp183 selected TVT replacement, blend, postprocess, hard gate, inference port, and submit are explicitly out of initial scope.
  - Kaggle train v3 completed with lgb_mean CV 8.539573790, worse than exp148 8.501281182 by +0.038292608; not selected for inference or submit.

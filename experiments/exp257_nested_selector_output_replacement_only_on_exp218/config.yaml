experiment:
  name: exp257_nested_selector_output_replacement_only_on_exp218
  description: Replace the existing exp218 learned-likelihood selector output slots with fold-safe exp238 nested selector outputs without adding LightGBM features.
  route: ml_model
  status: completed_guard_failed_user_override_submission_scored
  created_at: '2026-07-15'
  updated_at: '2026-07-16'

lineage:
  parent: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  selector_parent: exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218
  candidate_parent: exp237_hmm_exp226_candidate_selector_on_exp183
  comparison_parents:
    - exp218_gr_wavelet_rotation_confidence_features_on_exp148
    - exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218
    - exp147_exp092_exp098_rank_slot_replacement_only
  implementation_source: nested_selector_output_replacement_only.py
  diff_summary: Keep the exp218 380-column schema fixed; overwrite 29 existing ll selector-output columns from the exp238 outer5-inner4 score surfaces, preserve 25 ll selector-input diagnostic columns, and add zero nsel columns.

validation:
  strategy: exp238_outer5_inner4_groupkfold_nested_scores_with_exp218_schema_fixed_replacement_only
  metric: rmse
  seed: 42
  group_column: well
  outer_folds: 5
  inner_folds: 4
  reference_metrics:
    exp218_historical_lgb_mean_rmse: 8.475793751656624
    exp238_same_nested_fold_lgb_mean_rmse: 7.936689853668213
  leakage_policy:
    - The exp238 score artifact role is the authoritative outer-fold contract.
    - Outer-train selector features use inner GroupKFold OOF scores.
    - Outer-valid selector features use the average of four inner models trained only on outer-train wells.
    - Outer-valid true TVT and candidate true error are never used to generate outer-valid features.
    - Existing exp218 multi-observation and legacy candidate delta diagnostics remain target-free pass-through features.
    - No selected path, blend, postprocess, residual anchor, or nsel add-only feature is used.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  selector_artifact_dir_local: experiments/exp238_nested_hmm_exp226_selector_rank_slot_addonly_on_exp218/artifacts

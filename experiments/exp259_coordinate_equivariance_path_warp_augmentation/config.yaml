experiment:
  name: exp259_coordinate_equivariance_path_warp_augmentation
  description: Audit exact coordinate equivariance and physically consistent path-warp training views before augmenting a learned candidate ranker.
  route: ensemble
  status: completed_train_side_guard_failed_no_inference_no_submit
  created_at: "2026-07-15"
  updated_at: "2026-07-16"

lineage:
  parent: exp251_raw_test_safe_dual_objective_candidate_ranker
  candidate_parent: exp237_hmm_exp226_candidate_selector_on_exp183
  learned_likelihood_parent: exp111_learned_pf_observation_likelihood_probe
  coordinate_feature_reference: exp165_coordinate_frame_normalization_features_on_exp148
  ml_reference_anchor: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  negative_augmentation_reference: exp248_candidate_perturbation_augmentation_for_likelihood_ranker
  implementation_source: src/coordinate_path_augmentation.py
  diff_summary: >
    Adds a reusable raw-well augmentation engine that separates exact heel-centered
    coordinate symmetries from approximate MD/TVT/XYZ path warps. The default stage
    performs no model or candidate training. It checks exact inverse consistency,
    preserves the official-start prefix for approximate views, resamples horizontal
    GR from the transformed TVT path and same typewell, regenerates local geometry,
    prefix, FFT, and Haar-DWT diagnostics, and rejects views outside a real-train
    distribution envelope. Direct PF/HMM replacement, CNN/MTP flips, inference, and
    submission remain disabled.

validation:
  strategy: train_well_transform_contract_audit_before_outer_groupkfold_training
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  leakage_policy:
    - The default transform audit fits no model and makes no prediction.
    - Transform kind and parameters are selected only from SHA256(seed, well, kind, view_slot).
    - Python hash(), global RNG, validation error, oracle rank, hidden-like role, and Public LB are not used for transform selection.
    - Approximate warps are zero at the official-start anchor and leave the known prefix unchanged.
    - Approximate horizontal GR is resampled from the same typewell at transformed true TVT only for train-side synthetic views.
    - True TVT slope is a synthetic-distribution diagnostic only and is never exposed as a model feature.
    - A later outer-fold train stage must fit the distribution envelope on outer-train wells only and score clean outer-valid wells only.
    - Absolute spatial and KNN features are outside the exact local-coordinate equivariance contract.
    - Existing PF, Beam, HMM, dense, geometry, exp218, exp251 parent, and control models are not retrained or regenerated.
    - Synthetic paths are never direct PF/HMM replacements or selectable submission candidates.


execution:
  stage: train_exact_datum_after_transform_audit
  allowed_stages:
    - transform_audit_only
    - train_exact_datum_after_transform_audit
  max_wells: null
  preview_wells: 3
  view_slots_per_transform: 1
  model_training_enabled: true
  training_stage_implemented: true
  inference_enabled: false
  submission_enabled: false

augmentation:
  keep_clean_original_view: true
  compose_transforms: false
  expose_augmentation_metadata_to_model: false
  exact_transforms:
    - heel_center_translation
    - lateral_reflection
    - yaw_rotation
    - tvt_datum_shift
  approximate_transforms:
    - md_stretch
    - tvt_shear
    - xy_plane_tilt
    - low_frequency_spline_warp
    - smooth_xyz_control_perturbation
  parameter_grid:
    heel_center_translation: {}
    lateral_reflection: {}
    yaw_rotation:
      angle_degrees: [-135.0, -90.0, -45.0, 45.0, 90.0, 135.0, 180.0]
    tvt_datum_shift:
      shift_ft: [-40.0, -20.0, 20.0, 40.0]
    md_stretch:
      factor: [0.97, 1.03]
    tvt_shear:
      tail_delta_ft: [-40.0, -20.0, 20.0, 40.0]
    xy_plane_tilt:
      slope_x: [-0.01, -0.005, 0.005, 0.01]
      slope_y: [-0.01, -0.005, 0.005, 0.01]
    low_frequency_spline_warp:
      amplitude_ft: [-40.0, -20.0, 20.0, 40.0]
      middle_sign: [-1.0, 1.0]
    smooth_xyz_control_perturbation:
      amplitude_ft: [5.0, 10.0, 20.0]
      sign_x: [-1.0, 1.0]
      sign_y: [-1.0, 1.0]
      sign_z: [-1.0, 1.0]
  guard:
    inverse_tolerance: 1.0e-7
    anchor_tolerance: 1.0e-9
    lower_quantile: 0.005
    upper_quantile: 0.995
    relative_margin: 0.25
    min_typewell_coverage: 0.95
  training:
    variant: exact_tvt_datum_shift
    parent_control_variant: raw_test_regenerated_copcf
    enabled_stage: train_exact_datum_after_transform_audit
    keep_clean_original_view: true
    synthetic_well_fraction: 0.25
    eligible_exact_transforms:
      - tvt_datum_shift
    diagnostic_only_exact_transforms:
      - heel_center_translation
      - lateral_reflection
      - yaw_rotation
    diagnostic_only_reason: selected_295_schema_contains_no_raw_xy_or_local_geometry_columns_so_rigid_xy_views_are_feature_identical
    disabled_transforms:
      - md_stretch
      - tvt_shear
      - xy_plane_tilt
      - low_frequency_spline_warp
      - smooth_xyz_control_perturbation
    absolute_tvt_feature_columns:
      - last_known_tvt
      - candidate_mean
      - blend_likpf_hmm_w500
      - hmm_selfgr_boost_only_a070_c100_mean_tvt
      - exp226_v6_k16_geometry_gr_u_projection
      - candidate_tvt
      - view_candidate_mean
    selected_feature_schema_sha256: 7a9217d6ed96f5f1e569dbefff2a1fb17751405d6ddccae5e5d9dbf12da787ae
    expected_selected_feature_count: 295
    expected_well_count: 773
    exact_delta_tolerance: 1.0e-5
    feature_identical_rigid_view_training_forbidden: true
    success_criteria:
      overall_rmse: 0.0
      candidate_logloss: 0.0
      distance_1000_plus_rmse: 0.0
      exp115_spatial_rmse: 0.0
      exp115_typewell_purged_rmse: 0.0
      worst_well_regression: 0.25


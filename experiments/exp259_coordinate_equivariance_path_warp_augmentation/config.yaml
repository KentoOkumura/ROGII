notes:
  - Default transform_audit_only stage is 0 variants x 0 configs x 0 folds = 0 boosters.
  - The implemented optional train stage is 1 variant x 2 objectives x 5 folds = 10 CPU boosters.
  - The separately executed exp251 295-feature clean model is the fixed control; exp259 did not retrain it and used the pinned version-3 selected-schema SHA.
  - Rigid XY exact transforms remain audit-only because the selected 295-feature ranker schema contains no raw XY or local-geometry columns and would receive feature-identical duplicate rows.
  - Only exact TVT datum shift is train-active; all approximate transforms including md_stretch remain disabled.
  - Exact transformations are checked after applying their inverse.
  - Approximate transformations keep the known prefix unchanged and resample only evaluation-tail GR.
  - Full augmented well CSVs are not persisted; only well-level manifests and small previews are saved.
  - exp165 coordinate features worsened exp148 by 0.048650420, but training-time raw-well augmentation remains a separate hypothesis.
  - exp248 mixed seven candidate perturbations at nearly one synthetic row per clean row and failed all guards; exp258 therefore audits one transform at a time before any training.
  - Kaggle training version 1 completed with fixed-Viterbi RMSE 8.427125551, improving the exp251 clean control by 0.075086454 ft.
  - Adoption remains unsupported because exp115 spatial and typewell-purged RMSE worsened by 0.067319432 and 0.045377256 ft, and the maximum per-well regression was 6.370552990 ft.

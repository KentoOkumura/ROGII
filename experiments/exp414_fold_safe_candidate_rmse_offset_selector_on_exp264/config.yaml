  correlation_policy: report_only_for_abs_pearson_or_spearman_ge_0p999

candidate_rmse_offset:
  enabled: true
  fit_partition: exact_deterministic_sampled_outer_train_rows
  expression: sqrt(mean(candidate_abs_error_squared))
  target: candidate_abs_error_minus_fit_candidate_rmse
  reconstruction: max_zero_of_residual_prediction_plus_fit_candidate_rmse
  offset_scale: 1.0
  training_sample_weight: none
  validation_sample_weight: none
  metric_sample_weight: none
  binary_objective_fit: false
  forbidden:
    - global_oof_rmse
    - target_division
    - inverse_rmse_sample_weight
    - binary_objective_weight
    - offset_scale_grid
    - clip_grid
    - candidate_subset
    - offset_as_feature

model:
  name: fold_safe_candidate_rmse_offset_candidate_long_lightgbm
  trains_new_boosters: true
  objectives:
    - name: pred_abs_error
      estimator: lightgbm_regression_l1
      training_label: candidate_abs_error_minus_fit_candidate_rmse
      reconstructed_score: residual_prediction_plus_fit_candidate_rmse
  training:
    max_train_base_rows_per_outer_fold: 60000
    max_valid_base_rows_for_early_stopping: 30000
    predict_base_row_chunk_size: 20000
    num_boost_round: 1200
    early_stopping_rounds: 80
    log_evaluation_period: 100
  lightgbm_common:
    learning_rate: 0.035
    num_leaves: 63
    min_child_samples: 80
    subsample: 0.85
    subsample_freq: 1
    colsample_bytree: 0.85
    reg_alpha: 0.1
    reg_lambda: 1.0
    n_jobs: 8
    deterministic: true
    force_col_wise: true
    verbosity: -1


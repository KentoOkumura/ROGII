validation:
  strategy: frozen_outer5_groupkfold_selector_stage_b
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_base_rows: 3783989
  expected_candidate_long_rows: 45407868
  expected_wells: 773
  expected_candidates: 12
  expected_selectable_candidates: 11
  leakage_policy:
    - Freeze candidate order, feature schema, folds, and sampled row IDs before reading labels.
    - Compute each RMSE offset only from the exact sampled fit rows for that outer model.
    - Outer-valid, global OOF, hidden-like, and current-test truth are forbidden from offset calculation.
    - Validation labels are transformed using fit-partition offsets; they never update the offsets.
    - Training and validation sample weights remain absent; all metrics are unweighted.
    - The RMSE offset is not a model feature and is added back only after residual prediction.
    - The binary p_within10 objective is not retrained and is outside the treatment.
  distance_buckets:
    edges: [-.inf, 250.0, 500.0, 1000.0, .inf]
    labels: [near_0_250, 250_500, 500_1000, 1000_plus]
  hidden_like_scopes:
    hidden_like_spatial: verification_like_spatial_role
    hidden_like_typewell_purged: verification_like_typewell_purged_role


experiment:
  name: exp414_fold_safe_candidate_rmse_offset_selector_on_exp264
  description: >-
    Diagnose the exp407 inverse-RMSE-weight regression and test one fixed,
    fold-safe use of candidate RMSE as an additive base offset for the
    pred_abs_error selector, without changing sample importance.
  hypothesis: >-
    Candidate RMSE is useful as a fold-safe global expected-error baseline,
    but harmful as task importance. An unweighted L1 model trained on local
    deviations from that baseline should preserve the parent objective while
    reducing the row-local score-surface instability caused by exp407.
  route: ml_model
  status: implementation_in_progress
  created_at: "2026-07-26"
  updated_at: "2026-07-26"
  inference_enabled: false
  submission_enabled: false
  next_action: implement_and_static_validate_fixed_stage_b_candidate_rmse_offset

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  comparator: exp407_fold_safe_inverse_rmse_weighted_dual_selector_on_exp264
  candidate_source: exp263_last_anchor_better_candidate_confidence_pair_cache
  parent_selector_surface: corrected_exp264_stage_b_v5
  comparator_selector_surface: exp407_stage_b_v1
  steering: ../../.steering/20260726-exp414-fold-safe-candidate-rmse-offset-selector-on-exp264
  references:
    - docs/06_reproducibility.md
    - experiments/exp264_exp263_candidate_confidence_dual_selector/config.yaml
    - experiments/exp407_fold_safe_inverse_rmse_weighted_dual_selector_on_exp264/result.md
    - experiments/exp409_saved_selector_candidate_switch_tail_attribution_on_exp407/result.md
  diff_summary: >-
    Keep the parent candidate bank, values, folds, sampled fit row IDs,
    88-feature schema, unweighted L1 objective, and LightGBM parameters fixed.
    For each outer model only, calculate candidate RMSE on its exact sampled
    fit rows, subtract it from candidate_abs_error for training and validation,
    then add it back to the prediction before clipping at zero. Train no binary
    model and apply no sample weight.


validation:
  strategy: fixed32_mechanism_then_separately_approved_full_group_safe_oof
  metric: rmse_tvt
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_full_rows: 3783989
  expected_full_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  truth_join: after_schedule_prediction_diagnostic_and_content_sha_freeze
  stage_0:
    role: mechanism_preflight_only_not_cv
    expected_wells: 32
    persistent_wells: 16
    matched_control_wells: 16
    expected_suffix_rows: 156088
    candidate_variants: 1
    candidate_hmm_well_runs: 32
    parent_control_hmm_reruns: 0
  stage_1:
    enabled_only_after_stage_0_all_pass_and_separate_user_approval: true
    expected_wells: 773
    expected_rows: 3783989
    candidate_variants: 1
    candidate_hmm_well_runs: 773
    parent_control_hmm_reruns: 0
  report_scopes:
    - near_0_250
    - mid_250_1000
    - md_1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - persistent_offset_episode
  leakage_policy:
    - The exp226 OOF is group-safe and its expected decompressed SHA must match before use.
    - Candidate generation may read only well_id, row_idx, suffix_offset, fold, and final tvt_pred from the saved exp226 OOF.
    - The exp226 OOF must be read with an explicit usecols allowlist; reading all columns and dropping truth later is forbidden.
    - Unknown-suffix TVT, tvt_true, error, abs_error, and oracle information are unavailable until all target-free candidate outputs are frozen.
    - The fixed32 well-id set may be used before prediction, but persistent/control roles, fold outcomes, and episode labels are attached only after freeze.
    - Last-known TVT_input is allowed only as the boundary anchor; unknown-suffix TVT_input is missing by construction.
    - Reusing raw suffix GR in the HMM after exp226 final tvt_pred has already used GR is allowed but must be reported as evidence reuse and a CV-to-hidden generalization risk, not as target leakage.
    - Public three-well test behavior cannot select the transition formula, emission, gate, or comparison.


experiment:
  name: exp491_exp226_final_tvt_rate_direct_hmm
  description: >-
    Replace the exp437 geometry-only row increment with the row increment of
    the fold-safe exp226 final tvt_pred as the exact TVT-only HMM transition
    center. The design removes every persistent rate state and uses the
    exp226-implied rate directly at every row.
  hypothesis: >-
    exp226 final tvt_pred contains a more transferable local TVT-rate signal
    than its geometry-only tvt_geop intermediate. Using its exact row
    increment as the transition mean may remove exp209 rate-following lag
    while allowing the unchanged HMM position posterior and GR emission to
    correct exp226's accumulated absolute offset.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-30"

lineage:
  parent: exp437_neighbor_geometry_tvt_only_transition_hmm
  prediction_source: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  mechanism_evidence:
    - exp408_hmm_message_rate_basin_audit
    - exp410_likpf_particle_resampling_basin_audit
  related_experiments:
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp355_exp226_dip_rate_prior_on_exp209
    - exp419_exp226_guided_defensive_mixture_pf
  steering: ../../docs/legacy/steering/20260730-exp491-exp226-final-tvt-rate-direct-hmm
  diff_summary: >-
    Keep the exp437 TVT-only state, fixed TVT grid, position kernel, Gaussian
    typewell-GR emission, start prior, and forward-backward readout unchanged.
    Replace only the transition schedule source from exp226 geometry-only
    tvt_geop to exp226 final tvt_pred. The first transition is
    tvt_pred[0]-last_known_TVT_input and later transitions are adjacent
    differences of tvt_pred. No persistent rate, rate noise, momentum,
    residual offset/rate state, blend, selector, or PF is included.


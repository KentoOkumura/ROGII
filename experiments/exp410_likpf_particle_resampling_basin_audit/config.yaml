      - assets/pf_target_wells.csv
      - assets/pf_persistent_offset_episodes.csv
      - assets/pf_persistent_asset_manifest.json
      - assets/pf_counterfactual_sentinel_wells.csv
      - assets/pf_counterfactual_sentinel_manifest.json

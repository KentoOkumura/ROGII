experiment:
  name: exp410_likpf_particle_resampling_basin_audit
  description: >-
    Replays the unchanged exp072 500-particle x 128-seed likelihood PF on the
    preregistered PF-specific persistent-offset wells and records particle
    support, GR update, resampling ancestry, and seed aggregation diagnostics.
  route: pf_beam
  status: completed
  created_at: "2026-07-26"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp072_exp063_full_replay_feature_cache
  steering: ../../docs/legacy/steering/20260726-exp410-likpf-particle-resampling-basin-audit
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp235_fixed_lag_particle_smoother_pf
    - exp243_pf_seed_medoids
    - exp408_hmm_message_rate_basin_audit
    - docs/06_reproducibility.md
  diff_summary: >-
    The exp072 PF initialization, transition, Gaussian GR likelihood, ESS
    threshold, systematic resampling, roughening, stable seed bank, and
    arithmetic seed mean are unchanged. Only target-late diagnostic summaries
    are added; no prediction candidate or scientific treatment is introduced.

validation:
  strategy: preregistered_pf_persistent_offset_internal_particle_audit
  metric: mechanism_attribution_not_candidate_cv
  seed: 42
  reporting_folds: 5
  expected_source_rows: 3783989
  expected_source_wells: 773
  expected_target_wells: 496
  expected_target_suffix_rows: 2500744
  expected_episodes: 839
  expected_episode_rows: 819288
  expected_episode_sse: 453149095.6093302
  parity_atol_ft: 0.00001
  leakage_policy:
    - PF-specific scope is frozen from the saved exp072 likpf_mean, never from a regenerated candidate.
    - Truth and episode data are used only by diagnostic accumulation and cause readout.
    - Particle transition, likelihood, normalization, resampling, and output aggregation do not branch on truth, error, episode, fold, or hidden role.
    - Exact replay parity against the SHA-fixed exp209 reconstruction is mandatory for every processed well.
    - No threshold is tuned after reading the audit result.


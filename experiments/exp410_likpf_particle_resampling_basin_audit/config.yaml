      - kentookumura/exp209-joint-exact-parity-train
    inference_kernel_sources: []

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: exp072_sha256_modulo_plus_one_then_seed_index_numba_single_worker
  stochastic_components:
    - likelihood_pf_particle_initialization
    - likelihood_pf_particle_propagation
    - likelihood_pf_conditional_systematic_resampling
    - likelihood_pf_resampling_roughening
  parallel_rng_policy: no_thread_parallel_rng_one_well_one_numba_worker_stable_well_seed
  feature_sha_policy: decompressed_and_logical_content_sha
  record:
    kernel_version: true
    input_sha: true
    prediction_sha: true
    diagnostic_sha: true
    model_sha: false
    submission_sha: false

inference:
  enabled: false
  mode: disabled_internal_train_side_diagnostic_only
  create_submission: false

notes:
  - One unchanged exp072 PF replay per processed well; diagnostics do not add RNG calls.
  - Four balanced CPU shards each contain 124 wells and about 625k suffix rows.
  - No LightGBM, folds, boosters, GPU, HMM, Beam, inference, or submission.

model:
  name: exp072_likelihood_pf_internal_particle_audit
  estimator: none_diagnostic_replay
  fitted_model: false
  replay:
    split_key: train
    observation_likelihood: raw_gr_gaussian_exp072
    transition: classic_exp072_surface_state
    seed_aggregation: arithmetic_mean
  runtime:
    particles: 500
    seed_count: 128
    resample_threshold: 0.5
    init_spread: 4.5
    momentum: 0.998
    velocity_noise: 0.002
    position_noise: 0.005
    resample_pos_noise: 0.10
    resample_velocity_noise: 0.001
    grid_step: 0.2
    gr_sigma_min: 10.0
    gr_sigma_max: 60.0
    gr_sigma_default: 30.0
    min_known_prefix_rows: 160
    min_eval_rows: 64

audit:
  output_prefix: exp410_likpf_particle_resampling_basin_audit
  basin_radius_ft: 5.0
  mass_floor: 0.01
  log_odds_effect: 1.0986122886681098
  dominant_row_fraction: 0.50
  pre_episode_rows: 128
  support_margin_ft: 0.0
  truth_close_seed_radius_ft: 5.0
  wrong_seed_radius_ft: 10.0
  ancestor_unique_fraction_floor: 0.10
  ancestor_max_offspring_fraction: 0.25
  threshold_sensitivity:
    basin_radius_ft: [3.0, 5.0, 10.0]
    mass_floor: [0.002, 0.01, 0.05]
    log_odds_effect: [0.09531017980432493, 0.4054651081081644, 1.0986122886681098]
    dominant_row_fraction: [0.25, 0.50, 0.75]
  expected_artifacts:
    - exp410_likpf_particle_resampling_basin_audit_row_ledger.csv.gz
    - exp410_likpf_particle_resampling_basin_audit_episode_summary.csv
    - exp410_likpf_particle_resampling_basin_audit_cause_summary.csv
    - exp410_likpf_particle_resampling_basin_audit_threshold_sensitivity.csv
    - exp410_likpf_particle_resampling_basin_audit_well_manifest.csv
    - exp410_likpf_particle_resampling_basin_audit_input_manifest.json
    - exp410_likpf_particle_resampling_basin_audit_summary.json
  counterfactual:
    enabled: true
    diagnostic_only: true
    sentinel_max_wells: 12
    sentinel_selection: top_episode_sse_well_per_exclusive_cause_then_global_episode_sse_fill
    evaluation_scopes:
      - all_suffix_rows
      - all_fixed_episode_rows_for_selected_wells
    variants:
      baseline: {}
      momentum_one:
        momentum: 1.0
      zero_process_noise:
        velocity_noise: 0.0
        position_noise: 0.0
      process_noise_x3:
        velocity_noise_multiplier: 3.0
        position_noise_multiplier: 3.0
      init_spread_x3:
        init_spread_multiplier: 3.0
      gr_sigma_x1p3:
        gr_sigma_multiplier: 1.3
      gr_sigma_x3:
        gr_sigma_multiplier: 3.0
      gr_emission_near_disabled:
        gr_sigma_multiplier: 1000000.0
      resample_threshold_0p1:
        resample_threshold: 0.1
      resampling_disabled:
        resample_threshold: 0.0
      roughening_x10:
        resample_pos_noise_multiplier: 10.0
        resample_velocity_noise_multiplier: 10.0
      clamp_margin_x2:
        clamp_margin_multiplier: 2.0
    baseline_seed_readouts:
      - arithmetic_seed_mean
      - rowwise_seed_median
      - full_suffix_log_likelihood_best_seed
      - full_suffix_log_likelihood_weighted_seed_mean
      - contiguous_seed_block0_mean
      - contiguous_seed_block1_mean
      - contiguous_seed_block2_mean
      - contiguous_seed_block3_mean
      - particle_mode_seed_mean
      - particle_mode_seed_median
      - truth_best_seed_per_row_oracle
    particle_mode_readout:
      histogram_bin_width_ft: 5.0
      half_bin_shift: true
      target_free: true
      state_mutation: false
    interpretation:
      - Sentinel selection is target-late and only confirms mechanism on frozen PF-offset wells.
      - Full-suffix likelihood readouts are target-free but offline and are not deployable online selectors.
      - Truth-best seed is an oracle upper bound and never a prediction candidate.

execution:
  run_stage: counterfactual_strict_merge_completed
  kaggle_execution_approved: true
  rerun_enabled: false
  approval_source: user_message_2026_07_26_execute_heavy_on_kaggle

validation:
  strategy: saved_exp413_outer5_transductive_predicted_k16_neighbor_rate_postprocess
  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  fold_source: exp413_saved_outer_fold
  fold_manifest_sha256: fa41084c5fcb4adffb88d44211b4cc5d2d2f46b5bd4d65828b6af941184b2a6d
  selection_fit: none
  truth_used_for_prediction_generation: false
  transductive_batch: outer_valid_wells_with_same_fold
  leakage_policy:
    - Verify exp413 OOF, fold, well-row identity, score-row role, raw geometry, and row order before prediction generation.
    - Prediction-phase allowlist is well, row_idx, fold, pred_tvt, X, Y, and Z only.
    - A target well is always excluded from its own donor field.
    - Donors are other outer-valid wells' exp413 predictions from the same fold; outer-train and outer-valid true suffix TVT are forbidden as donors.
    - ANCC, train-only formation surfaces, typewell GR, truth, error, hidden-like role, and by-well outcomes are forbidden before prediction freeze.
    - Freeze and read back candidate predictions and content SHA before attaching truth or reporting scopes.
    - Never use Public LB, public test identity, public three-well cardinality, or same-OOF outcome to tune parameters or support.


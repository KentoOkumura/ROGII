experiment:
  name: exp511_exp413_transductive_k16_neighbor_rate_postprocess
  description: >-
    Apply one fixed, target-free, transductive K16 neighbor-rate postprocess to
    the saved exp413 Stage D OOF prediction. Each outer-valid fold is treated as
    one pseudo-test batch; only other outer-valid wells' predicted TVT and raw
    X/Y/Z geometry may form the donor field.
  route: ensemble
  status: stage_a_complete_fail_closed
  created_at: "2026-08-04"
  updated_at: "2026-08-04"
  inference_enabled: false

lineage:
  parent: exp413_scale5_likpf_full_replacement_on_exp335
  method_reference: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  steering: ../../docs/legacy/steering/20260804-exp511-exp413-transductive-k16-neighbor-rate-postprocess
  evidence_references:
    - exp114_spatial_neighbor_prior_signal_audit
    - exp118_spatial_neighbor_prior_confidence_gate_on_exp092
    - exp201_typewell_spatial_tvt_error_readout
    - exp263_last_anchor_better_candidate_confidence_pair_cache
    - exp418_exp226_signed_segment_rate_residual
  diff_summary: >-
    Keep exp413 OOF values, folds, score rows, models, and row order fixed. For
    every outer-valid pseudo-test batch, fit smoothed K16 coefficients to each
    well's predicted TVT+Z path, form an exp226-style XY local-linear field from
    other predicted wells only, and add one zero-intercept, alpha-0.05,
    +/-0.25-ft capped low-frequency correction. Do not use true donor TVT,
    exp226 absolute predictions, ANCC, typewell GR, kappa fitting, candidate
    grids, routing, refitting, retraining, inference, or submission.


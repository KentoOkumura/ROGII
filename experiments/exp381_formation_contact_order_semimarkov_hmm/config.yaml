    - /kaggle/input/rogii-wellbore-geology-prediction/train
    - /kaggle/input/competitions/rogii-wellbore-geology-prediction/train
  raw_horizontal_glob: "*__horizontal_well.csv"
  target_column: TVT
  visible_prefix_column: TVT_input
  coordinate_columns: [MD, X, Y, Z]
  formation_columns: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
  target_allowed_columns: [MD, X, Y, Z, TVT_input]
  target_formation_read_count_before_freeze: 0
  target_truth_read_count_before_freeze: 0
  exp226_oof:
    filename: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
    patterns:
      - /tmp/kaggle-output/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/train_v1/artifacts/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
      - /kaggle/input/notebooks/kentookumura/exp226-k16-kappa-repro-train/artifacts/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
      - /kaggle/input/exp226-k16-kappa-repro-train/artifacts/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
    expected_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
    pre_freeze_columns: [well_id, row_idx, suffix_offset, fold]
    forbidden_pre_freeze_columns: [tvt_true, TVT, error, abs_error, oracle_rank]

contact_model:
  formation_order: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
  surface:
    primary:
      family: FormationPlaneKNN
      reference_statistic: well_median
      nearest_wells: 10
      reference_scope: outer_train_only
      missing_formation_policy: formation_specific_finite_outer_train_donors
      minimum_finite_donors_per_formation: 10
      query_chunk_rows: 50000
      coordinate_scale: outer_train_standard_deviation
      ridge_diagonal: [1.0e-9, 1.0e-9, 1.0e-12]
      self_exclusion: role_safe_outer_fold
      fallback: inverse_distance_weighted_k10
    constant_control:
      family: outer_train_well_median_global_median
  crossing:
    equation: "Z - predicted_F_f = 0"
    selection: first_crossing_in_increasing_md
    scope: full_well
    exact_zero_precedes_sign_change: true
    interpolation: linear_between_adjacent_rows
    multiple_crossing_oracle_selection: forbidden
    posthoc_order_repair: forbidden
  contact_tvt:
    source_center: outer_train_true_first_contact_median_by_formation
    target_prefix_implied_formula: "TVT_input + Z - predicted_F_f"
    target_calibration: single_median_additive_offset_across_all_prefix_rows_and_formations
    prediction_formula: "source_contact_center_f + target_offset"
  eligibility:
    minimum_triple_matched_formations: 2
    require_finite_prefix_offset: true
    triple_match_methods: [formation_plane_knn, constant_surface, truth]
  order:
    fixed_order: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
    strict_increasing_md: true
    well_pass: predicted_and_truth_both_respect_fixed_order

semimarkov_hmm:
  implementation_status: not_implemented_stage0_failed_closed
  states: 7_ordered_intervals
  allowed_transitions: [stay, advance_exactly_one]
  skip_transition: forbidden
  duration_sigma_source: outer_train_surface_dispersion
  duration_sigma_clip_ft: [64, 512]
  duration_potential_scale: 0.10
  duration_squared_error_clip: 25
  all_other_exp209_components_fixed: true


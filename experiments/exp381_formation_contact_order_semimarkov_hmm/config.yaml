experiment:
  name: exp381_formation_contact_order_semimarkov_hmm
  description: >-
    Audit whether six fold-safe formation-surface contacts transfer in position,
    contact TVT, and order before implementing an ordered semi-Markov HMM.
  route: pf_beam
  status: stage0_failed_closed
  created_at: "2026-07-24"
  updated_at: "2026-07-24"

lineage:
  parent: exp209_emission_dynamics_direct_hmm
  operational_fold_identity: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  comparison:
    - exp226_tvt_slope_kriging_hmm
    - exp355_rate_transition_prior_in_exp209_hmm
  method_reference:
    - exp138_ancc_surface_predictability_audit
    - exp377_formation_relative_k16_slope_identifiability_readout
  diff_summary: >-
    Replace continuous formation-relative rate proposals with first geometric
    contacts Z-F_f=0. Stage 0 uses no HMM: it compares an outer-train-only
    FormationPlaneKNN(k=10) with a constant outer-train surface, calibrates six
    contact-TVT centers by one known-prefix additive offset per target well, and
    freezes every target-free output before validation truth is late-joined.

validation:
  strategy: exp226_outer5_groupfold_identity_used_by_exp209
  metric: rmse
  primary_readout: contact_predictability
  seed: 42
  n_folds: 5
  group_column: well_id
  evaluation_zone: full_well
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  by_fold_required: true
  by_well_required: true
  leakage_policy:
    - Outer-valid wells expose only MD/X/Y/Z/TVT_input before target-free freeze.
    - Outer-valid TVT and six raw formation columns are parsed only after freeze.
    - Every surface reference and contact-TVT center comes from outer-train wells.
    - Surface/crossing/contact prediction selection never uses validation truth.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  raw_train_dir_patterns:

notes:
  - Compact self-contained Stage 0 train and fail-closed inference candidates are implemented.
  - Canonical train notebook adoption and one Kaggle CPU Stage 0 run were authorized by the user's execute request on 2026-07-24.
  - Version 1 stopped before scientific Stage 0 because the loader rejected wholly missing source formation columns; version 2 keeps k=10 but selects finite outer-train donors independently per formation.
  - Version 2 completed Stage 0 and failed only the contact-TVT RMSE gate (44.7701 ft versus 15 ft); the semi-Markov HMM branch is closed without rescue.
  - Stage 1 implementation/run, canonical inference adoption, inference, and submission remain disabled; exp381 is closed after the fixed Stage 0 failure.

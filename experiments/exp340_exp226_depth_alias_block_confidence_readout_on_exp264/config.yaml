experiment:
  name: exp340_exp226_depth_alias_block_confidence_readout_on_exp264
  description: >-
    Design-frozen zero-booster readout of target-free depth-alias confidence
    families derived from the fixed exp280 shift likelihood bank on exp264.
  route: ensemble
  status: stage_0_completed_guard_failed
  created_at: "2026-07-22"
  updated_at: "2026-07-23"

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  steering: ../../docs/legacy/steering/20260722-exp340-exp226-depth-alias-block-confidence-readout-on-exp264
  references:
    - exp280_exp226_shift_likelihood_separability_readout
    - exp236_exact_hmm_posterior_bimodality_audit
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
    - exp286_geop_hmm_sparse_addonly_candidate_on_exp264
  diff_summary: >-
    Keeps every candidate and prediction frozen. Seven preregistered confidence
    families summarize the exp280 likelihood surface before any truth or error join.

implementation:
  enabled: true
  scope: zero_booster_stage_0_readout
  train_notebook_state: compact_selfcontained
  canonical_notebook_replacement_authorized_by_request: true
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.score_rows

validation:
  strategy: frozen_block_confidence_then_late_error_attribution
  metric: block_rmse_and_auc
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_blocks: 7787
  expected_folds: [0, 1, 2, 3, 4]
  fold_source: exp280_exp226_group_safe_fold
  exp264_outer_fold_policy: provenance_only_not_required_to_equal_exp226_fold
  truth_alignment_atol_ft: 0.001
  score_rows: nonoverlapping_512_row_blocks
  primary_unit: block
  auc_unit: row_weighted_block_score
  auc_label: exp264_row_abs_error_ge_10ft
  auc_definition: >-
    Repeat each frozen block risk score over that block's rows and compute the
    exact tie-aware ROC AUC against abs(exp264 prediction - truth) >= 10 ft.
  truth_attachment: after_feature_quantile_and_content_sha_freeze
  report_scopes:
    - pooled
    - fold
    - distance_1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Confidence features and fold-specific Q1/Q4 boundaries are frozen before truth or error is read.
    - No candidate, prediction, selector, threshold, or correction is fitted.


model:
  name: exp226_depth_alias_block_confidence_readout
  estimator: none
  target_free_families:
    - top1_top2_margin
    - softmax_entropy
    - likelihood_weighted_shift_std
    - zero_shift_rank
    - absolute_top1_shift
    - top1_shift_jump_from_previous_block
    - three_block_sign_inconsistency
  family_contract:
    top1_top2_margin:
      formula: largest_likelihood_minus_second_largest_likelihood
      risk_transform: negative
    softmax_entropy:
      formula: natural_log_entropy_of_unit_temperature_softmax_likelihood
      risk_transform: identity
    likelihood_weighted_shift_std:
      formula: population_std_of_shift_ft_under_unit_temperature_softmax_likelihood
      risk_transform: identity
    zero_shift_rank:
      formula: zero_shift_likelihood_rank_minus_one_divided_by_twelve
      risk_transform: identity
    absolute_top1_shift:
      formula: absolute_likelihood_top1_shift_ft
      risk_transform: identity
    top1_shift_jump_from_previous_block:
      formula: absolute_top1_shift_change_with_first_block_zero
      risk_transform: identity
    three_block_sign_inconsistency:
      formula: pairwise_disagreement_share_among_nonzero_signs_in_current_and_previous_two_blocks
      risk_transform: identity
  attribution:
    quantiles: [0.25, 0.75]
    quantile_fit_scope: each_fold_target_free_blocks_only
    quartile_assignment: risk_le_q25_vs_risk_ge_q75
    primary_metric: q4_minus_q1_exp264_block_rmse
    secondary_labels:
      - exp264_block_abs_error_ge_10ft
      - exp226_beats_exp264_block_rmse_by_ge_0p25ft
    negative_control:
      name: stable_sha256_circular_block_order
      applies_to:
        - top1_shift_jump_from_previous_block
        - three_block_sign_inconsistency
      construction: >-
        Rotate each well's top1-shift sequence by a nonzero SHA256-derived
        offset, then recompute the same order-dependent family.
      comparison_metric: row_weighted_abs_error_ge_10ft_auc
  pass_requires_all_per_family:
    minimum_feature_coverage: 0.99
    minimum_q4_minus_q1_mean_rmse_ft: 0.50
    require_q4_minus_q1_median_positive: true
    minimum_positive_folds: 4
    require_1000_plus_positive: true
    require_hidden_like_spatial_positive: true
    require_hidden_like_typewell_purged_positive: true
    minimum_pooled_auc_abs_error_ge_10ft: 0.60
    minimum_folds_auc_gt_half: 4
    require_real_better_than_circular_pooled: true
    minimum_folds_real_better_than_circular: 4
  forbidden:
    - candidate_change
    - prediction_change
    - mode_switch
    - selector_training
    - same_oof_threshold_search
    - inference
    - submission


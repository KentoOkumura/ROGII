    kernel_version: true
    input_sha: true
    fold_map_sha: true
    graph_node_schema_sha: true
    graph_node_content_sha: true
    graph_edge_schema_sha: true
    graph_edge_content_sha: true
    fault_risk_content_sha: true
    fault_weight_content_sha: true
    solver_manifest_sha: true
    prediction_sha: true
    submission_sha: true
  notes:
    - CPU float64, stable graph ordering, fixed BLAS threads, and sparse solver version are part of the canonical contract.

    - Stage 0 has no prediction, model booster, inference, or submission.

notes:
  - Stage 0 target-free fault-topology readout is implemented and its Kaggle CPU run is user-approved but not yet pushed.
  - Stage 1 MAP solver and Stage 2 GR factor remain unimplemented and separately gated.
  - No Kaggle package has been prepared or pushed.
  - Stage 1 and Stage 2 require separate approvals after their prerequisite guards pass.

experiment:
  name: "exp117_linear_md_z_prior_residual_target"
  description: Compare weak linear MD/Z prior residual targets on the fixed exp073 full replay LightGBM feature surface.
  route: ml_model
  status: completed_train_side_rejected
  created_at: "2026-06-24"
  updated_at: "2026-06-24"

lineage:
  parent: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  cache_parent: exp072_exp063_full_replay_feature_cache
  implementation_source: linear_md_z_prior_residual_target.py
  copied_from: exp095_prefix_u_line_residual_target
  diagnostic_parent: exp113_linear_md_z_prior_global_search
  diff_summary: Reuses the exp072 deterministic 196-feature full replay train cache and exp073 LightGBM config family, but changes only the supervised target definition. Instead of flat T0 residual dTVT, this experiment learns TVT minus a weak prior T0 + a*dMD + b*dZ using coefficients chosen from the low-risk exp113 diagnostic grid.

validation:
  strategy: groupkfold_by_exp063_well_same_features_linear_prior_target_ablation
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Train features are read from exp072's raw-train-only deterministic feature cache.
    - The expected train feature surface is exp063 Pixiux full public replay with 196 features.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.
    - Linear prior anchors use only each well's known-prefix last TVT/MD/Z row.
    - Fixed a/b coefficients are predeclared in config and are not selected using validation tail true TVT.
    - The only changed variable versus exp073 is supervised target definition.
    - This is a train-side target ablation and not a submission candidate until full CV is reviewed.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json

model:
  name: exp117_linear_md_z_prior_residual_target_lgbm
  source_experiment: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  feature_source: exp072_exp063_full_replay_train_feature_cache
  expected_feature_count: 196
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  target_ablation:
    stage: 3
    selected_target: dTVT
    control_target: dTVT
    linear_prior:
      formula: prior = T0 + a * (MD - MD0) + b * (Z - Z0)
      coefficients:
        - {a: 0.0, b: 0.0}
        - {a: 0.02, b: -0.25}
        - {a: 0.02, b: -0.50}
        - {a: 0.04, b: -0.25}
      coefficient_source: Small weak-prior subset of exp113; no fold or validation-tail fitting inside this experiment.
    active_targets:
      - dTVT
      - linear_prior_a0p02_bm0p25
      - linear_prior_a0p02_bm0p50
      - linear_prior_a0p04_bm0p25
    target_definitions:
      dTVT:
        description: TVT - T0, equivalent to the exp073 last_known_tvt residual baseline.
      linear_prior_a0p02_bm0p25:
        description: TVT - (T0 + 0.02*dMD - 0.25*dZ); inverse is prior + predicted residual.
      linear_prior_a0p02_bm0p50:
        description: TVT - (T0 + 0.02*dMD - 0.50*dZ); inverse is prior + predicted residual.
      linear_prior_a0p04_bm0p25:
        description: TVT - (T0 + 0.04*dMD - 0.25*dZ); inverse is prior + predicted residual.
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    max_lgb_models: 1
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; included for optional rerun comparison.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train

audit:
  mode: linear_md_z_prior_residual_target_from_exp072_cache
  output_prefix: exp117_linear_md_z_prior_residual_target
  fast: false
  bucket_columns:
    distance: md_since
    tail_rank: id
  expected_train_artifacts:
    - exp117_linear_md_z_prior_residual_target_metrics.csv
    - exp117_linear_md_z_prior_residual_target_by_well.csv
    - exp117_linear_md_z_prior_residual_target_bucket_metrics.csv
    - exp117_linear_md_z_prior_residual_target_target_summary.csv
    - exp117_linear_md_z_prior_residual_target_predictions.csv.gz
    - exp117_linear_md_z_prior_residual_target_feature_schema.csv
    - exp117_linear_md_z_prior_residual_target_lgb_models/manifest.json
    - exp117_linear_md_z_prior_residual_target_summary.json

inference:
  mode: not_selected_train_side_target_ablation
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  selected_target: null
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb0
  notes:
    - Inference is intentionally not selected until train-side target ablation results are reviewed.
    - If a linear prior residual target is selected, the inference notebook must regenerate raw-test features and apply the matching inverse transform using test known-prefix T0/MD0/Z0 anchors.

notes:
  - This implements the backlog item `linear_md_z_prior_residual_target`.
  - exp080 and exp095 rejected stronger U-space target changes, so this experiment only tests weak fixed linear MD/Z priors.
  - exp113 showed linear prior direct prediction is weak; this is a supervised residual smoke, not a direct prior replacement.
  - Target-only comparison keeps exp073 feature cache, folds, and LightGBM config fixed.
  - Kaggle train v1 rejected all linear prior residual targets; keep dTVT and do not inference-port.

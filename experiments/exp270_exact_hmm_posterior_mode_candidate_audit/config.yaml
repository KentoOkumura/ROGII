  total_hmm_well_runs: 773
  expected_target_wells: 773
  outer_workers: 1
  numba_num_threads: 4
  progress_every_wells: 2
  streaming_candidate_write: true
  stream_flush_every_wells: 10
  parity_chunksize_rows: 100000
  frame_write_chunksize_rows: 100000
  binary_hash_chunk_bytes: 8388608
  gzip_compresslevel: 1
  gzip_mtime: 0
  max_wells_per_shard: null
  lightgbm_config_count: 0
  fold_count: 0
  total_boosters: 0
  control_or_parent_retraining: false
  cpu_exact_hmm_control_regenerated_for_required_posterior: true
  gpu: false
  inference: false
  submission: false
  kaggle_push_approved: true

runtime:
  use_amp: false
  num_workers: 1
  kaggle:
    enable_gpu: false
    enable_internet: false
    train_kernel_sources:
      - kentookumura/exp209-joint-exact-parity-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train
      - kentookumura/exp270-exact-hmm-mode-audit-shard0
      - kentookumura/exp270-exact-hmm-mode-audit-shard1
    train_variant0_kernel_sources:
      - kentookumura/exp209-joint-exact-parity-train
    train_variant1_kernel_sources:
      - kentookumura/exp209-joint-exact-parity-train
    inference_kernel_sources: []

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_exact_hmm_decoder_stable_sha256_well_shard_only
  stochastic_components: []
  parallel_rng_policy: no_rng_two_operational_shards_outer_workers1_numba_threads4
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - Exact HMM forward-backward and top-K decoding consume no random numbers.
    - Stable SHA256 determines only the operational well shard and never changes a candidate value.
    - The decoder manifest SHA covers the scientific HMM and decoder config because no fitted model exists.
    - Raw and decompressed gzip SHA are both recorded; decompressed content SHA is primary.
    - Numba parallel floating arithmetic may vary at tiny precision, so this train-side audit is not promoted to a deterministic submission anchor.

inference:
  enabled: false
  mode: disabled_train_side_candidate_bank_audit_only
  create_submission: false
  selected_candidate: null

notes:
  - The posterior-mean control is regenerated because the same forward-backward pass is required to expose posterior modes; this is one CPU HMM variant and not GPU model retraining.
  - Joint top-5 is exact before TVT-path deduplication. Deduplication may leave fewer than five unique TVT candidates and no approximate backfill is allowed.
  - Oracle predictions exist only transiently while diagnostics are computed and are never persisted as deployable candidates.

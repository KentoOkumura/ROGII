model:
  name: exact_hmm_posterior_mode_candidate_bank
  estimator: none_candidate_generation_audit
  target: train_unknown_suffix_tvt_for_post_generation_scoring_only
  hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    emission: gauss
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    rate_center: zero
  decoder:
    joint_top_k: 5
    deduplicate_by: tvt_grid_index_sequence
    backfill_after_dedup: false
    tie_break: score_then_stable_ascending_transition_and_terminal_state_order
    persist_rate_paths: false
    persist_full_posterior: false
    max_backpointer_bytes: 6000000000

candidate_bank:
  fixed_candidates:
    - posterior_mean
    - marginal_map
  path_candidate_prefix: topk_path_
  global_viterbi_alias: topk_path_1
  maximum_unique_path_candidates: 5
  candidate_order:
    - posterior_mean
    - marginal_map
    - topk_path_1
    - topk_path_2
    - topk_path_3
    - topk_path_4
    - topk_path_5

audit:
  output_prefix: exp270_exact_hmm_posterior_mode_candidate_audit
  oracle_block_rows: [128, 256, 512]
  distance_buckets_ft: [50, 100, 250, 500, 1000]
  focus_wells: [11d0f5ac]
  unique_best_tie_atol_ft: 0.000000001
  path_edge_margin_grid_points: 2
  persist_oracle_predictions: false
  persist_selector: false
  persist_candidate_blend: false
  expected_artifacts:
    - exp270_exact_hmm_posterior_mode_candidate_audit_candidates.csv.gz
    - exp270_exact_hmm_posterior_mode_candidate_audit_candidate_schema.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_decoder_manifest.json
    - exp270_exact_hmm_posterior_mode_candidate_audit_candidate_metrics.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_distance_bucket_metrics.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_hidden_like_metrics.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_by_well.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_path_diagnostics.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_pairwise_path_distance.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_unique_best.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_oracle_scope_metrics.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_focus_well.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_input_manifest.csv
    - exp270_exact_hmm_posterior_mode_candidate_audit_summary.json


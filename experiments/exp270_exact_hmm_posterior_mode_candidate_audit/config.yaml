experiment:
  name: exp270_exact_hmm_posterior_mode_candidate_audit
  description: >-
    Audits target-free posterior mode readouts from the raw exp209 exact HMM:
    posterior mean, marginal MAP, global joint-state Viterbi, and exact joint-state
    top-5 paths deduplicated by their TVT grid-index sequence.
  route: pf_beam
  status: completed_train_side_direct_negative_oracle_diagnostic_only_no_inference_no_submit
  created_at: "2026-07-17"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.n_folds
    - validation.metric

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  references:
    - exp205_exact_hmm_smoother_exp072_compatible_cache_audit
    - exp223_hmm_self_gr_emission
    - exp236_lgb_unary_hmm_decode_readout_ablation
    - exp243_pf_seed_medoids
    - exp252_pf_seed_medoids_on_exp250
    - exp266_exp072_worst_well_rescue_readout
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
    - backlog/KAGGLE_DIRECTION.md exact_hmm_posterior_mode_candidate_audit
  implementation_source:
    - exp270_exact_hmm_posterior_mode_candidate_audit_train.py
    - exp270_exact_hmm_posterior_mode_candidate_audit_train_variant0.py
    - exp270_exact_hmm_posterior_mode_candidate_audit_train_variant1.py
  diff_summary: >-
    Keeps the exp209 exact-HMM grid, transition grammar, Gaussian GR emission,
    known-prefix calibration, initial position/rate priors, and missing-GR
    handling fixed. Only posterior readout changes: marginal MAP, global
    Viterbi, and joint-state top-5 paths are added beside the posterior-mean
    control. Joint paths with an identical TVT grid-index sequence are
    deduplicated after exact top-5 decoding. No self-GR emission, ML unary,
    PF seed candidate, blend, selector, inference, or submission is included.

validation:
  strategy: full_train_exact_hmm_posterior_mode_candidate_audit
  metric: rmse_tvt_and_candidate_bank_oracle_headroom
  seed: 42
  n_folds: 0
  group_column: well
  score_rows: full_train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  success_criteria:
    - Generated posterior mean aligns exactly by id with the saved exp209 HMM control and stays within the configured absolute tolerance.
    - Exact top-5 DP matches exhaustive enumeration on small trellises.
    - Posterior mean, marginal MAP, Viterbi, unique TVT top-K, path diagnostics, and oracle scopes are recorded.
    - Row/block/well oracle headroom is separated from direct candidate metrics and no oracle prediction is persisted.
  leakage_policy:
    - Decoder inputs are raw horizontal/typewell GR, MD, Z, and known TVT_input prefix only.
    - Unknown-suffix true TVT is absent from forward-backward, decoder, candidate rank, and TVT-path deduplication.
    - Unknown-suffix true TVT is attached by id only after every candidate path for the well is frozen.
    - Oracle scopes and focus-well analysis are train-side diagnostics only.
    - Well sharding uses only a stable SHA256 hash of well id and is independent of truth, errors, candidates, and runtime.


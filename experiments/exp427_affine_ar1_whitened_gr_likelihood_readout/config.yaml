experiment:
  name: exp427_affine_ar1_whitened_gr_likelihood_readout
  description: >-
    Design-frozen zero-HMM readout comparing raw-finite GR shift likelihoods
    under a fixed identity/affine by iid/AR1 Gaussian factorial, with the
    prefix-posterior affine plus fold-safe AR1 posterior-predictive score as
    the sole primary.
  route: pf_beam
  status: stage_0_completed_gate_failed_closed
  created_at: "2026-07-28"

lineage:
  parent: exp280_exp226_shift_likelihood_separability_readout
  steering: ../../docs/legacy/steering/20260728-exp427-affine-ar1-whitened-gr-likelihood-readout
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp343_acf_effective_sample_likelihood_tempering_audit
    - exp345_exp209_time_varying_gr_affine_calibration_hmm
    - exp359_exp226_window_likelihood_on_exp281
    - exp360_typewell_reference_shift_zncc_confidence_readout
    - exp374_exp209_student_t_exact_hmm_emission
    - exp389_exp209_huber_exact_hmm_emission
  diff_summary: >-
    Keeps the exp280 exp226 path, 13 vertical shifts, non-overlapping 512-row
    blocks, Type Well policy, sigma clip, tie order, folds, and truth-late
    boundary. The only scientific family change is replacing the matched
    raw-finite identity-iid row-Gaussian aggregate with an analytic Gaussian
    block posterior-predictive density that marginalizes current-well
    known-prefix affine uncertainty and whitens residuals with one
    outer-train-fold AR(1) coefficient. A fixed 2x2 factorial isolates the
    affine and AR1 main effects.


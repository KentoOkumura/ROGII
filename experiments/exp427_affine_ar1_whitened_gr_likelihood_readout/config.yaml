model:
  name: none_affine_ar1_whitened_gr_likelihood_readout
  estimator: none_deterministic_diagnostic
  active_primary: affine_ar1
  factorial:
    factors:
      affine: [identity, prefix_posterior]
      residual_covariance: [iid, fold_safe_ar1]
    variants:
      - identity_iid_matched
      - affine_iid
      - identity_ar1
      - affine_ar1
    matched_control: identity_iid_matched
    diagnostic_ablations: [affine_iid, identity_ar1]
    primary: affine_ar1
  affine:
    observation: horizontal_gr_equals_intercept_plus_slope_times_typewell_gr
    prior_mean: [0.0, 1.0]
    prior_std: [20.0, 0.25]
    posterior: analytic_fixed_sigma_bayesian_linear_regression
    source: current_well_known_prefix_finite_pairs_only
    minimum_prefix_pairs: 64
    minimum_typewell_gr_std: 5.0
    require_positive_posterior_mean_slope: true
    ineligible_policy: no_primary_score_no_identity_fallback
  sigma:
    source: current_well_known_prefix_identity_residual_population_std
    clip: [10.0, 60.0]
    fixed_across_four_factorial_scores: true
  ar1:
    order: 1
    source: outer_train_fold_known_prefix_affine_posterior_residuals
    per_well_estimator: yule_walker_lag1_within_contiguous_finite_runs
    yule_walker_formula: sum_lagged_pair_products_div_sum_lagged_left_squares
    minimum_lag1_pairs_per_source_well: 64
    aggregate: median_in_fisher_z_space
    rho_clip: [-0.8, 0.8]
    application: stationary_whitening_separately_within_each_contiguous_finite_run
    outer_valid_well_in_source_forbidden: true
  predictive_density:
    family: gaussian
    covariance: sigma_squared_identity_plus_whitened_design_affine_posterior_covariance
    aggregation: sum_run_log_density_divide_total_finite_observations
    numerical_method: rank2_woodbury_and_matrix_determinant_lemma
    dense_reference: tests_only
    score_normalization: mean_log_predictive_density_per_finite_observation
  forbidden:
    - candidate_block_affine_refit
    - per_outer_valid_well_rho
    - ar_order_or_rho_clip_grid
    - student_t_or_huber_row_emission
    - pearson_or_zncc_score
    - swt_dtw_or_spectral_score
    - typewell_group_prior
    - imputed_gr_in_ar_innovation
    - transition_state_or_decoder_change
    - same_oof_rescue

audit:

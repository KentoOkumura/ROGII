    - validation.score_rows

validation:
  strategy: >-
    fixed_exp280_surface_affine_ar1_factorial_target_free_score_freeze_then_late_shift_rank
  metric: mrr_top3_factorial_main_effect_and_saved_gaussian_comparison
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_folds: [0, 1, 2, 3, 4]
  expected_rows: 3783989
  expected_wells: 773
  expected_blocks: 7787
  score_rows: raw_finite_rows_in_nonoverlapping_512_row_unknown_suffix_blocks
  primary_unit: block
  truth_attachment: >-
    after_prefix_posterior_fold_rho_eligibility_four_score_negative_control_and_manifest_content_sha_freeze
  leakage_policy:
    - Score-stage horizontal input exposes only row identity, MD, raw GR, and known-prefix TVT_input.
    - Exp226 score-stage input exposes only well_id, row_idx, suffix_offset, fold, and tvt_geop.
    - Current-well affine updates use finite known-prefix pairs only.
    - Fold rho uses outer-train known-prefix residual pairs only; each outer-valid well is excluded from its rho source.
    - Unknown-suffix TVT, error, abs_error, formation, oracle shift, hidden-like role, and worst-well identity are forbidden before all score artifacts freeze.
    - Candidate block affine refits, suffix-adaptive rho, and truth-driven support selection are forbidden.
  technical_gate:
    required_score_finite_coverage: 1.0
    required_row_identity_coverage: 1.0
    required_candidate_count_per_eligible_block: 13
    minimum_eligible_well_fraction: 0.90
    minimum_eligible_block_fraction: 0.75
    minimum_affine_eligible_well_fraction: 0.90
    require_outer_valid_rho_source_overlap_zero: true
    require_abs_fold_rho_strictly_below: 0.8
    maximum_dense_woodbury_score_abs_error: 1.0e-8
    maximum_runtime_seconds: 30600
    maximum_peak_rss_gb: 25.0
  scientific_gate:
    minimum_mrr_gain_vs_matched_identity_iid: 0.02
    minimum_top3_gain_vs_matched_identity_iid: 0.02
    minimum_mrr_gain_vs_saved_exp280: 0.01
    minimum_top3_gain_vs_saved_exp280: 0.01
    minimum_improved_folds_vs_each_control_mrr: 4
    minimum_improved_folds_vs_each_control_top3: 4
    minimum_mrr_gain_vs_affine_iid: 0.005
    minimum_mrr_gain_vs_identity_ar1: 0.005
    minimum_improved_folds_vs_each_single_factor: 3
    require_real_above_shuffled_folds: 5
    require_1000_plus_non_regression_vs_both_controls: true
    require_hidden_like_spatial_non_regression_vs_both_controls: true
    require_hidden_like_typewell_purged_non_regression_vs_both_controls: true
    require_top1_regret_p90_non_regression_vs_saved_exp280: true


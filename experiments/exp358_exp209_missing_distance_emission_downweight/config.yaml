validation:
  strategy: exp209_missing_distance_technical_audit_then_grouped_hmm
  metric: technical_contract_then_rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  expected_wells: 773
  expected_rows: 3783989
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: unknown_suffix_truth_only_after_missing_surface_freeze
  missing_fraction_buckets:
    low: [0.0, 0.10]
    mid: [0.10, 0.30]
    high: [0.30, 1.0]
    boundary_policy: left_closed_right_open_except_final_closed
  truth_attachment: after_missing_surface_and_candidate_prediction_content_sha_freeze
  leakage_policy:
    - Raw missing masks, distances, weights, and interpolated GR are frozen before truth or error is joined.
    - Unknown-suffix TVT, error, abs_error, oracle choice, and worst-well identity are forbidden from weight generation.


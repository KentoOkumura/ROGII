experiment:
  name: exp358_exp209_missing_distance_emission_downweight
  description: >-
    Independent two-stage audit of distance-based evidence downweighting only
    on raw-missing GR rows while retaining the trusted exp209 observation scale.
  route: pf_beam
  status: stage_1_completed_scientific_gate_failed_closed
  created_at: "2026-07-23"
  updated_at: "2026-07-25"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260723-exp358-exp209-missing-distance-emission-downweight
  history: exp308_imputed_gr_confidence_downweight
  references:
    - exp339_exp209_geometry_gap_uncertainty_transfer
    - exp346_exp209_finite_observed_scale_audit
  diff_summary: >-
    Removes the failed exp307 finite-MAD observation dependency. It keeps the
    complete exp209 observation, diffusion, grid, momentum, prior, and output
    contract fixed and changes only the log-emission multiplier at raw-missing rows.


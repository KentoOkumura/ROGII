model:
  name: exp209_missing_distance_emission_downweight
  estimator: deterministic_exact_forward_backward
  active_variants: [missing_distance_half_life_8_floor_0p25]
  promotion_candidate: missing_distance_half_life_8_floor_0p25
  emission:
    control_family: capped_gaussian
    control_formula: "-0.5 * min(z^2, 600)"
    candidate_family: missing_distance_weighted_capped_gaussian
    candidate_formula: "confidence_weight * (-0.5 * min(z^2, 600))"
    emission_clip_z2: 600.0
    normalization_constant: omitted_as_state_independent
    application_count: 1
  missing_weight:
    raw_finite_observed: 1.0
    missing_formula: max_floor_two_to_negative_distance_over_half_life
    distance_unit: rows_to_nearest_raw_finite_gr
    half_life_rows: 8
    floor: 0.25
    all_missing_well_fallback: 0.25
    application: multiply_gaussian_log_emission_exactly_once
  stage_0:
    audit: full_missing_weight_surface_contract
    pass_requires_all:
      expected_wells: 773
      expected_rows: 3783989
      require_all_finite: true
      require_observed_weight_exact_one: true
      minimum_missing_weight: 0.25
      require_missing_weight_strictly_below_one: true
      require_missing_rows: true
      require_missing_weight_above_floor: true
      require_multiple_missing_weight_values: true
      require_all_missing_well_fallback_exact_floor: true
  stage_1:
    enabled_condition: stage_0_all_gates_pass_and_separate_user_approval
    active_variants: [missing_distance_half_life_8_floor_0p25]
    hmm_well_runs: 773
    pass_requires_all:
      minimum_rmse_gain_vs_exp209_ft: 0.05
      minimum_improved_folds: 4
      require_1000_plus_non_regression: true
      require_hidden_like_spatial_non_regression: true
      require_hidden_like_typewell_purged_non_regression: true
      require_by_well_p95_non_regression: true
      maximum_worst_well_regression_ft: 0.25
      require_fixed_likpf_blend_non_regression: true
  fixed_parent:
    interpolation: exact_exp209
    observation_sigma: exact_exp209_zero_filled_residual
    typewell: exact_exp209
    sig_r: 0.002
    sig_p: 0.02
    effective_position_sigma_floor: 0.1225
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    momentum: 0.998
    prior: exact_exp209
    output: posterior_mean
  fixed_hmm:
    coordinate: absolute_tvt
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    band_pad: 100.0
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    momentum: 0.998
    sigma_mode: known_prefix_zero_fill_population_std
    sigma_clip: [10.0, 60.0]
    missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
    output: posterior_mean
    emission: missing_distance_weighted_capped_gaussian
    emission_clip_z2: 600.0
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
  forbidden:
    - exp307_finite_mad_observation
    - zero_weight_or_hard_missing_mask
    - half_life_or_floor_grid
    - sigma_rescaling
    - transition_or_prior_change
    - prediction_blend


experiment:
  name: "exp034_public_sel15_pf_meta_stack"
  description: Stack exp026-style pseudo-tail anchor with public sel15 PF/Beam train well の途中以降を隠した疑似 test features.
  route: pf_beam
  status: completed
  created_at: "2026-06-07"
  updated_at: "2026-06-07"

lineage:
  parent: exp029_public_sel15_pf_oof_feature_generation
  diff_summary: Regenerate exp026 pseudo-tail bucket-shrink predictions on exp029 train well の途中以降を隠した疑似 test rows, then audit fixed blends and shallow residual meta models with original-fold and well-hash holdouts.

validation:
  leakage_policy:
    - Input PF rows come from exp029 pseudo-test artifacts where each train well was masked after the cutoff before public sel15 PF/Beam runs.
    - The exp026-style pseudo-tail anchor is regenerated per holdout split, excluding validation wells from the pseudo-tail training files.
    - Meta models train only on out-of-fold base predictions and PF/Beam features generated under the pseudo-test condition.
    - target_tvt is used only as a supervised target and scoring label.
    - Error diagnostic columns such as pf_error, last_anchor_error, and beam_error are not model features.
    - A meta candidate is supported only if it beats the exp026-style anchor and required PF controls in both original-fold and well-hash audits.

data:
  feature_path: experiments/exp029_public_sel15_pf_oof_feature_generation/features/public_sel15_pf_oof_features.csv.gz
  source_well_summary_path: experiments/exp029_public_sel15_pf_oof_feature_generation/artifacts/public_sel15_pf_oof_well_summary.csv

model:
  name: public_sel15_pf_meta_stack
  target: target_tvt_minus_exp026_anchor
  base_prediction: exp026_pred
  primary_strategy: drift_model
  drift_strategy: drift_model
  feature_set: no_gr_signal
  strategies:
    - last_anchor
    - recent_linear
    - drift_model
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: LGBMRegressor
    params:
      n_estimators: 800
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 80
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 0.1
      n_jobs: 2
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800
  features:
    - exp026_pred
    - pf_pred
    - beam_pred
    - last_anchor_tvt
    - pf090_hold010
    - exp026_minus_pf
    - abs_exp026_minus_pf
    - exp026_minus_last_anchor
    - pf_pred_minus_last_anchor
    - pf_beam_diff
    - abs_pf_beam_diff
    - beam_spread
    - beam_min
    - beam_max
    - pf_selected_scale_pred
    - pf_scale_3
    - pf_scale_5
    - pf_scale_8
    - pf_scale_12
    - pf_seed_mean
    - pf_seed_std
    - pf_lik_best
    - pf_lik_mean
    - pf_lik_std
    - pf_lik_gap_best_second
    - pf_weight_entropy
    - pf_weight_top
    - pf_weight_best_second_gap
    - pf_effective_seeds
    - selector_code
    - selector_scale
    - selector_beam_weight
    - selector_hold_weight
    - selector_n_eval
    - selector_z_span
    - pseudo_cutoff_fraction
    - cutoff_row
    - row_idx
    - prefix_length
    - eval_step
    - eval_fraction
    - MD
    - X
    - Y
    - Z
    - GR
    - gr_isna
    - gr_prefix_availability
    - gr_eval_availability
    - pf_gr_sigma_mean
    - pf_initial_rate_mean
    - pf_mean_effective_particles
    - pf_min_effective_particles
    - pf_resample_count_mean
  candidates:
    - name: ridge_meta_residual
      estimator: ridge
      params:
        alpha: 30.0
      residual_shrink_values: [0.25, 0.50, 0.75, 1.00]
      residual_clip_values: [15.0, 30.0, 60.0]
      target_clip: 80.0
      max_train_rows: 550000
      max_train_rows_per_bucket: 130000
      seed: 42
    - name: hgb_meta_residual_small
      estimator: hist_gradient_boosting
      params:
        learning_rate: 0.04
        max_iter: 100
        max_leaf_nodes: 31
        min_samples_leaf: 160
        l2_regularization: 3.0
        max_bins: 255
        early_stopping: true
        validation_fraction: 0.12
        n_iter_no_change: 10
      residual_shrink_values: [0.25, 0.50, 0.75]
      residual_clip_values: [15.0, 30.0]
      target_clip: 80.0
      max_train_rows: 350000
      max_train_rows_per_bucket: 90000
      seed: 42

postprocess:
  selected_method: distance_bucket_shrink
  methods:
    distance_bucket_shrink:
      name: exp014_bucket_shrink_params
      buckets:
        - {name: rows_0_49, max_step: 49, alpha: 0.20}
        - {name: rows_50_249, max_step: 249, alpha: 0.5917180252647632}
        - {name: rows_250_999, max_step: 999, alpha: 1.15}
        - {name: rows_1000_2499, max_step: 2499, alpha: 1.15}
        - {name: rows_2500_plus, max_step: 1000000000, alpha: 1.0490770312511664}

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  chunk_rows: 500000
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp029-sel15-pf-oof-train

audit:
  well_holdout_folds: 5
  parent_exp026_clean_cv: 12.870780
  reference_control: exp026_pseudo_tail_bucket_shrink
  required_controls:
    - exp026_pseudo_tail_bucket_shrink
    - public_pf_selector
    - pf090_hold010
  controls:
    - name: exp026_pseudo_tail_bucket_shrink
      method: column
      column: exp026_pred
    - name: public_pf_selector
      method: column
      column: pf_pred
    - name: pf090_hold010
      method: blend
      weights: {pf_pred: 0.90, last_anchor_tvt: 0.10}
    - name: pf080_hold020
      method: blend
      weights: {pf_pred: 0.80, last_anchor_tvt: 0.20}
    - name: beam
      method: column
      column: beam_pred
    - name: last_anchor
      method: column
      column: last_anchor_tvt
  fixed_blends:
    - name: exp026090_pf010
      weights: {exp026_pred: 0.90, pf_pred: 0.10}
    - name: exp026080_pf020
      weights: {exp026_pred: 0.80, pf_pred: 0.20}
    - name: exp026070_pf030
      weights: {exp026_pred: 0.70, pf_pred: 0.30}
    - name: exp026090_beam010
      weights: {exp026_pred: 0.90, beam_pred: 0.10}
  training_variants:
    selected_variant: pseudo_tail_3_cutoffs_distance_balanced
    variants:
      - name: pseudo_tail_3_cutoffs_distance_balanced
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
  pseudo_tail:
    min_prefix_rows: 200
    min_pseudo_eval_rows: 250
    cutoff_strategy: quantile
  distance_buckets:
    - {name: rows_0_49, max_step: 49}
    - {name: rows_50_249, max_step: 249}
    - {name: rows_250_999, max_step: 999}
    - {name: rows_1000_2499, max_step: 2499}
    - {name: rows_2500_plus, max_step: 1000000000}

notes:
  - This is a train-audit experiment and does not create a submission.
  - The exp026-style anchor is recomputed because exp029's exp026_oof column is empty.
  - Kaggle train version 2 completed; selected ridge_meta_residual_shrink0p75_clip60p0 passed both holdout audits.

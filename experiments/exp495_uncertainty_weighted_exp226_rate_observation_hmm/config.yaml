experiment:
  name: exp495_uncertainty_weighted_exp226_rate_observation_hmm
  description: >-
    Preserve the exp209 joint position-rate exact HMM and add the fold-safe
    exp226 geometry U-rate as a Gaussian observation on the rate transition.
    The observation variance is estimated from known-prefix rate residuals so
    unreliable wells shrink back to the unchanged parent transition.
  hypothesis: >-
    exp355 showed that exp226 geometry relative-rate changes reduce the exp209
    average lag, while its fixed schedule creates severe hidden-like and
    worst-well regressions. A target-safe prefix-derived uncertainty can retain
    the average rate-following signal and weaken it on unreliable wells without
    removing the persistent rate state or hard-replacing the TVT increment.
  route: pf_beam
  status: stage_0b_completed_fail_closed
  created_at: "2026-07-31"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  rate_schedule_evidence: exp355_exp226_dip_rate_prior_on_exp209
  mechanism_evidence: exp408_hmm_message_rate_basin_audit
  negative_references:
    - exp411_predictive_filtered_rate_innovation_destick
    - exp491_exp226_final_tvt_rate_direct_hmm
    - exp285_exp226_prefix_masked_offset_predictability_readout
  steering: ../../docs/legacy/steering/20260731-exp495-uncertainty-weighted-exp226-rate-observation-hmm
  diff_summary: >-
    Keep every exp209 HMM state, kernel, observation, prior, and readout fixed.
    Reuse the exp355 target-anchored relative exp226 geometry U-rate center, but
    replace its deterministic time-varying prior mean with one Gaussian rate
    observation factor whose well-level scale comes only from the last 128
    known-prefix rate residuals. Do not use exp226 final tvt_pred or its GR/U
    corrections.


assumptions:
  - >-
    Known-prefix robust geometry-rate residual scale may rank unknown-suffix
    geometry-rate reliability even though exp285 showed that prefix offset does
    not predict full-suffix absolute offset. Stage 0A is designed to falsify this
    assumption before any HMM is implemented.

notes:
  - Stage 0A compact self-contained candidate and contract tests are implemented and adopted as the canonical train notebook by the user execution instruction.
  - Stage 0A failed its preregistered mechanism gate; the user explicitly overrode that stop and approved the unchanged preregistered Stage 0B fixed32 implementation and Kaggle CPU run on 2026-07-31.
  - Stage 1, inference, and submission remain unapproved and disabled regardless of the Stage 0B result.
  - This is an independent uncertainty-fusion hypothesis, not a same-OOF rescue of exp355 or exp491.

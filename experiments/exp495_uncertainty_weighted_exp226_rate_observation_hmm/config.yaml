prefix_uncertainty:
  transition_selection: last_128_finite_observed_u_rate_positive_delta_md
  maximum_transitions: 128
  minimum_valid_transitions: 32
  replay_cut: row_immediately_before_earliest_selected_transition
  mask_policy: remove_all_target_tvt_input_after_replay_cut
  residual: replayed_exp226_geometry_u_rate_minus_observed_prefix_u_rate
  center_for_scale_only: median
  mad_multiplier: 1.4826
  floor: 0.002
  bias_correction: none
  fallback_sigma: 0.002
  fallback_observation_enabled: false


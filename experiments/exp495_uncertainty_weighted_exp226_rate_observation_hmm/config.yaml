    residual: exp226_geometry_u_rate_minus_observed_prefix_u_rate
    center: median
    scale_formula: max_parent_sig_r_and_1p4826_times_centered_mad
    floor: 0.002
    ceiling: null
    insufficient_prefix_fallback: exact_parent_transition_no_observation
  rate_observation:
    likelihood: gaussian
    log_factor_formula: -0.5_times_squared_rate_state_minus_mu226_div_sigma226
    application: multiply_each_exp209_rate_transition_destination_then_row_normalize
    additional_lambda: none
    temperature: 1.0
    clipping: none
    activation_gate: none
    parent_parity_when_factor_uniform_required: true
  position_transition:

experiment:
  name: "exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe"
  description: >
    Train-side diagnostic that regenerates dense stride heatmap MDN local paths
    from exp202 saved models, then reruns the exp207 overlapping-window stitch
    readout.
  route: pf_beam
  status: kaggle_train_v1_complete_diagnostic_only
  created_at: "2026-07-07"
  updated_at: "2026-07-07"

lineage:
  parent: exp202_heatmap_mdn_candidate_generator_probe
  stitch_parent: exp207_heatmap_mdn_overlapping_window_path_stitch_probe
  backlog: heatmap_mdn_dense_stride_window_path_regeneration_probe
  comparison_parent: exp099_pf_multi_observation_likelihood_probe
  discussion_source: docs/discussions/rogii-wellbore-geology-prediction-699853-multi-trajectory-prediction-mtp-with-deep-cnn-for-welllog-inversion-fullcsv.md
  implementation_source: heatmap_mdn_dense_stride_window_path_regeneration_probe.py
  diff_summary: >
    Reuses exp202 saved fold models and heatmap input builder to create dense
    validation-window local path artifacts at stride 64. It then applies the
    exp207 target-free stitch score and candidate-union oracle readout for
    local topK 5 and 10. It does not retrain exp202, train a selector, perform
    direct TVT replacement, softmax-average heatmap paths, replace PF weights,
    run inference, or submit.

validation:
  strategy: exp202_saved_model_dense_stride_path_regeneration_train_side_probe
  metric: rmse
  seed: 42
  n_folds: 5
  active_fold_indices: [0, 1, 2, 3, 4]
  group_column: well
  score_rows: exp099_pseudo_tail_rows_intersecting_dense_stitched_window_coverage
  secondary_metrics:
    - source_overlap_pair_count
    - row_coverage_rate_vs_exp099_cache
    - overlap_abs_disagreement
    - gap_boundary_abs
    - stitched_only_top3_oracle_rmse
    - existing_plus_stitched_top3_oracle_rmse
    - new_best_candidate_rate
    - distance_bucket_1000_plus_oracle_delta
    - worst_well_oracle_delta
    - path_step_abs_mean
    - curvature_abs_mean
  leakage_policy:
    - Dense window generation uses only raw horizontal/typewell inputs, observed TVT_input prefix channels, exp202 saved weights, and target-free prior grids.
    - Stitch score uses only exp202 predicted center scores, candidate rank, predicted local path smoothness, adjacent-window overlap disagreement, and gap boundary continuity.
    - "`true_tvt_path`, `true_center_tvt`, `center_abs_error`, oracle rank, within10, and absolute-error columns are not used by the stitch score."
    - exp099 target is used only after dense stitched paths are fixed, for train-side oracle readout.
    - No direct TVT replacement, softmax weighted average, PF weight replacement, postprocess blend, inference, or submission is in scope.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp202_artifact_dir_local: experiments/exp202_heatmap_mdn_candidate_generator_probe/kaggle/output/train_v2/artifacts
  exp202_model_manifest_local: experiments/exp202_heatmap_mdn_candidate_generator_probe/kaggle/output/train_v2/artifacts/exp202_heatmap_mdn_candidate_generator_probe_model_manifest.json
  exp099_train_feature_cache_local: experiments/exp099_pf_multi_observation_likelihood_probe/kaggle/output/train_v2/artifacts/exp099_pf_multi_observation_likelihood_probe_multiobs_likelihood_probe_train_features.csv.gz

model:
  name: heatmap_mdn_dense_stride_window_path_regeneration_probe
  estimator: exp202_saved_pytorch_conv2d_path_logit_head
  variants:
    - real_gr
  channel_sets:
    base:
      include_geometry: false
  architecture:
    channels: [32, 64, 64]
    kernel_size: 3
    path_modes: 10
    path_horizon: 128
    use_group_norm: true
    dropout: 0.05
  active_run_specs:
    - name: candidate_real_w128_b64_fullfold
      variant: real_gr
      channel_set: base
      fold_indices: [0, 1, 2, 3, 4]
      horizontal_window_rows: 128
      typewell_window_bins: 64
      tvt_grid_half_width_ft: 192.0
      history_scale_ft: 200.0
  training:
    max_wells: null
    max_valid_wells: null
    max_tail_rows: 2048
    center_target_tolerance_ft: 10.0
    min_label_fraction: 0.35
    planned_cnn_training_models: 0
    planned_lightgbm_configs: 0
    planned_boosters: 0
    control_or_parent_retraining: false

path_generation:
  enabled: true
  source_parent: exp202_heatmap_mdn_candidate_generator_probe
  run_spec: candidate_real_w128_b64_fullfold
  split: valid
  row_center_stride: 64
  include_tail_stop: true
  topk: 10
  device: cpu
  debug_max_wells_per_fold: 2
  output:
    save_dense_sample_index: true
    save_dense_predictions: true
    save_dense_path_npz: true
    save_dense_path_samples: true
    save_dense_path_rank_index: true

stitching:
  local_topk_values: [5, 10]
  primary_local_topk: 10
  beam_width: 6
  output_topn: 3
  max_windows_per_well: null
  debug_max_wells: 3
  score_weights:
    score: 1.0
    rank: 0.05
    smoothness: 0.01
    overlap: 0.04
    boundary: 0.02
    rank_switch: 0.02
    score_eps: 0.000001
  output:
    save_row_level_paths: true
    save_window_assignments: true
    save_source_coverage: true
    save_candidate_union_readouts: true

candidate_union:
  enabled: true
  source_cache: data.exp099_train_feature_cache_local
  id_column: id
  target_delta_column: target
  last_known_tvt_column: last_known_tvt
  distance_column: md_since
  topk_values: [1, 3]
  within_ft: 10.0
  existing_candidates:
    - pf_ancc
    - beam_mean
    - likpf_mean
    - sc_ens
    - hyb
    - tvt_dense
    - tvt_densew
    - tvt_dense50
  required_existing_candidates:
    - pf_ancc
    - beam_mean
    - likpf_mean
    - sc_ens
    - hyb
  optional_existing_candidates:
    - tvt_dense
    - tvt_densew
    - tvt_dense50
  distance_buckets:
    - [0, 50]
    - [50, 100]
    - [100, 250]
    - [250, 500]
    - [500, 1000]
    - [1000, 1000000000]

runtime:
  use_amp: false
  num_workers: 0
  batch_size: 64
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp202-heatmap-mdn-candgen-train
      - kentookumura/exp099-pf-multiobs-likelihood-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_random_sampling_saved_exp202_model_inference_only
  stochastic_components:
    - upstream_exp202_pytorch_gpu_training
    - upstream_exp099_pfbeam_candidate_cache
  parallel_rng_policy: no_parallel_rng_in_exp208_generation_or_stitching
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: false
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - exp208 does not retrain exp202 models; it reads saved fold model artifacts.
    - exp208 generation and stitching are deterministic given raw train data, exp202 saved models, and exp099 candidate cache.
    - It is not a deterministic submission anchor because it does not create a submission and depends on upstream GPU-trained exp202 weights.
    - gzip outputs record decompressed CSV content SHA.

audit:
  mode: heatmap_mdn_dense_stride_window_path_regeneration_probe
  output_prefix: exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe
  expected_train_artifacts:
    - exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe_dense_path_samples.csv.gz
    - exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe_dense_candidate_paths_top10.npz
    - exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe_localtopk10_candidate_union_metrics.csv
    - exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe_localtopk10_candidate_union_distance_bucket_metrics.csv
    - exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe_localtopk10_candidate_union_by_well.csv
    - exp208_heatmap_mdn_dense_stride_window_path_regeneration_probe_summary.json

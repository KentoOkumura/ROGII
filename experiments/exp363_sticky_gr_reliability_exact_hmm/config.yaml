experiment:
  name: "exp363_sticky_gr_reliability_exact_hmm"
  description: >-
    Add one sticky latent GR-reliability state to the exp209 exact HMM, after
    a truth-late-join emission-reliability identifiability readout.
  route: pf_beam
  status: stage_0_failed_closed
  created_at: "2026-07-23"
  updated_at: "2026-07-24"

implementation:
  enabled: true
  scope: stage0_train_side_reliability_readout
  stage_1_implemented: false
  train_notebook_state: canonical_adopted_from_compact_selfcontained
  canonical_notebook_adopted: true
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../.steering/20260723-exp363-sticky-gr-reliability-exact-hmm
  references:
    - exp269_missing_gr_neutrality_hmm
    - exp346_exp209_observed_only_finite_sigma_gr_hmm
    - exp232_adaptive_robust_likelihood_pf
    - exp233_outlier_mixture_pf
  diff_summary: >-
    Keep the exp209 position/rate state, transition, grids, initialization,
    Gaussian emission scale, and posterior-mean output fixed. Add only
    q in {normal, weak}; q follows a fixed sticky Markov chain and weak rows
    multiply the exp209 log emission by 0.25. No rate prediction is added.

validation:
  strategy: two_stage_truth_late_join_reliability_readout_then_exact_hmm
  metric: bad10_auc_and_block_rmse
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  expected_wells: 773
  expected_rows: 3783989
  group_column: well_id
  score_rows: unknown_suffix_only
  truth_attachment: after_block_ledger_and_weak_posterior_content_sha_freeze
  stage_0:
    name: saved_exp209_path_emission_reliability_readout
    hmm_well_runs: 0
    block_rows: 512
    stride_rows: 256
    tail_policy: keep_short_tail_from_stride_starts
    posterior_score: row_weighted_mean_forward_filtered_weak_probability
    bad_block_label_after_freeze: exp209_block_rmse_greater_than_or_equal_10ft
    bad_block_rmse_ft: 10.0
    quartile_edges: [0.25, 0.75]
    quartile_metric: mean_block_rmse_q4_minus_q1
    fold_pass_definition: real_bad10_auc_strictly_greater_than_0p50
    hidden_like_policy: require_both_spatial_and_typewell_purged
    negative_control:
      kind: within_well_nonzero_circular_shift_of_block_weak_score
      key_prefix: exp363
      offset_formula: one_plus_sha256_well_prefix_mod_block_count_minus_one
      preserve_within_well_score_multiset: true
      single_block_well_policy: identity_and_report
    all_required:
      minimum_bad_block_auc: 0.60
      minimum_auc_gain_over_circular: 0.02
      minimum_q4_minus_q1_block_rmse_ft: 0.50
      minimum_passing_folds: 4
      minimum_hidden_like_auc: 0.55
      weak_posterior_mean_range: [0.02, 0.50]
  stage_1:
    enabled_only_after_stage_0_pass_and_separate_user_approval: true
    exact_hmm_well_runs: 773
    all_required:
      minimum_rmse_gain_vs_exp209_ft: 0.05
      minimum_improved_folds: 4
      maximum_1000_plus_regression_ft: 0.02
      maximum_hidden_like_spatial_regression_ft: 0.02
      maximum_hidden_like_typewell_purged_regression_ft: 0.02
      maximum_by_well_p95_regression_ft: 0.02
      maximum_worst_well_regression_ft: 0.25


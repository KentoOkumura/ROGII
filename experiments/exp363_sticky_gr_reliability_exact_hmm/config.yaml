model:
  name: sticky_gr_reliability_exact_hmm
  estimator: none_stage0_then_deterministic_exact_hmm_if_promoted
  state: [position, rate, gr_reliability]
  exp209_path_emission:
    path_prediction_column: hmm_mean_tvt
    sigma_column: hmm_prefix_sigma
    kind: gaussian_negative_half_min_squared_z_600_without_log_sigma
    squared_z_clip: 600.0
    horizontal_gr_policy: exp209_linear_interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp_endpoint_hold
    affine_a: 1.0
    affine_b: 0.0
  gr_reliability:
    states: [normal, weak]
    transition_matrix:
      - [0.998046875, 0.001953125]
      - [0.0078125, 0.9921875]
    initial_probability: [0.8, 0.2]
    normal_log_emission_multiplier: 1.0
    weak_log_emission_multiplier: 0.25
  fixed_from_exp209:
    - position_and_rate_grid
    - transition_and_momentum
    - initial_position_and_rate_distribution
    - gaussian_emission_sigma
    - posterior_mean_output
  forbidden:
    - rate_or_rate_change_prediction_from_prefix_or_geometry
    - missing_row_hard_mask
    - emission_sigma_change
    - transition_change
    - multiplier_or_transition_grid
    - blend_or_selector
    - parent_control_rerun


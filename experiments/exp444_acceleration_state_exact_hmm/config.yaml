experiment:
  name: exp444_acceleration_state_exact_hmm
  description: >-
    Independently test whether extending the exp441 full-support OU HMM from
    (TVT, rate) to (TVT, rate, acceleration) with a frozen three-state signed
    acceleration process can recover persistent rate lag that full-support OU
    alone did not fix.
  route: pf_beam
  status: stage0a_fail_closed_v1_runtime_projection
  created_at: "2026-07-29"
  updated_at: "2026-07-30"
  inference_enabled: false

lineage:
  structural_parent: exp441_full_support_ou_rate_transition_hmm
  root_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  references:
    - exp408_hmm_message_rate_basin_audit
    - exp411_predictive_filtered_rate_innovation_destick
    - exp424_exp209_momentum1_exact_hmm_ablation
    - exp441_full_support_ou_rate_transition_hmm
    - exp442_symmetric_broad_jump_rate_transition_hmm
    - docs/06_reproducibility.md
  implementation_source:
    - experiments/exp441_full_support_ou_rate_transition_hmm/exp441_full_support_ou_rate_transition_hmm_compact_selfcontained_train.py
    - experiments/exp441_full_support_ou_rate_transition_hmm/exp441_full_support_ou_rate_transition_hmm_compact_selfcontained_inference.py
  diff_summary: >-
    Keep the exp441 full-support OU rate kernel, exp209 position/emission/prior
    contracts and posterior readout, and add only a persistent three-value
    acceleration state that shifts the OU destination-rate mean. Evaluate this
    as an independent combination hypothesis: exp441 is a frozen one-factor
    control and negative context, not an execution prerequisite; exp442 is
    neither a parent nor a prerequisite.


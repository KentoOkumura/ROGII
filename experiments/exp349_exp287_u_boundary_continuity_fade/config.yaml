  - The user authorized canonical train Notebook adoption and one Kaggle private CPU Stage 0 run on 2026-07-22.
  - The approved run contains one deterministic postprocess variant, five reporting folds, zero trained folds/configs/models/boosters, no parent/control retraining, no GPU, and no inference or submission.

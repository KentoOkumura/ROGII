experiment:
  name: exp349_exp287_u_boundary_continuity_fade
  description: >-
    Audit one fixed target-free U=TVT+Z boundary correction on the saved exp287
    OOF prediction: clip the first-hidden U gap at 8 ft and exponentially fade
    the opposite correction over 240 ft of measured depth.
  route: ml_model
  status: kaggle_cpu_v2_complete_fail_close_no_rescue
  created_at: "2026-07-22"
  updated_at: "2026-07-23"


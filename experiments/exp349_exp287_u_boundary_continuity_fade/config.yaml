method:
  name: fixed_u_boundary_continuity_fade
  coordinate: U=TVT+Z
  cap_ft: 8.0
  tau_md_ft: 240.0
  application: always_on_all_eligible_wells
  gap_threshold: null
  gap_formula: parent_first_hidden_plus_z_first_hidden_minus_last_visible_tvt_input_plus_z_last_visible
  move_formula: minus_clipped_gap_times_exp_minus_md_distance_over_tau
  compute_dtype: float64
  intermediate_reestimation: false
  additional_prediction_clip: false
  parameter_search: false


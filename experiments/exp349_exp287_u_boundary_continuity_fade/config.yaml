  references:
    - exp125_confidence_gate_continuity_rawtest_parity
    - exp158_segment_continuity_selector_on_exp157
    - exp191_typewell_continuity_selector_confidence_replacement_only_on_exp148
    - exp299_base_posterior_self_gr_boundary_handoff
    - exp115_hidden_like_spatial_holdout_from_ppt
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  external_reference:
    kaggle_notebook: phuongncn/kdrill-f594-ucont8
    kaggle_id_no: 128179543
    fetched_at: "2026-07-22"
    fetched_notebook_sha256: a98e718dc8cc3b8e94b74bf76b9d91d3e5af50b59b917d0fef31eb636f46f8ab
  diff_summary: >-
    Keeps the saved exp287 OOF prediction, folds, models, raw prefix/suffix,
    and evaluation scopes fixed. Adds only one deterministic post-composition
    move based on the current well's first-hidden U gap with cap=8 ft and
    tau=240 MD-ft. It does not replay the public notebook's contact, overlap,
    PF/Beam, visible-prefix, model-package, or branch-hedge layers.


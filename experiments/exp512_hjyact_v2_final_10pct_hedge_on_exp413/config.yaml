    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    candidate_reuse_manifest_sha: true
    model_manifest_sha: true
    component_prediction_sha: true
    final_prediction_sha: true
    submission_sha: true
  notes:
    - Deterministic anchor requires exact hjyact source parity, an exact or pre-audited exp413 witness SHA, and two byte-identical Kaggle visible reruns.
    - Version 6 and exact-source version 8 satisfy the two-run visible component/final output gate, but deterministic-GR intermediate content SHA differs and hidden-well stochastic determinism remains unproven.
    - Visible test data and Public LB scoring data are distinct.

notes:
  - The directory name retains the original 10-percent design suffix; the implemented and tested formula is exactly 0.50/0.50.
  - Kaggle candidate inference versions 1 through 5 were executed; version 5 failed closed only at exp413 exact component parity after prediction generation.
  - The user approved the pre-audited exp413 numerical tolerance contract of max_abs <= 0.02 ft and RMSE <= 0.001 ft for version 6.
  - Version 6 completed and passed current-test parity, reuse, formula, and submission-format checks; external submission was not performed.
  - The user authorized a version-7 all-well inference run with four-way SP45/exp413 well parallelism and model-package correction disabled.
  - Version 7 completed in 1197.667 seconds, 23.77 percent faster than version 6 overall; exp413 improved 38.53 percent while SP45 threading was 38.71 percent slower on the visible three-well sample.
  - Version 7 preserved the exact version-6 final submission SHA and passed current-test submit-check with no FAIL or WARN.
  - Version 8 re-executed the exact version-6 source and is now the latest canonical-kernel version; its hjyact component, exp413 component, and final submission are byte-identical to version 6.
  - Version 8 completed in 1193.477 scientific seconds / 1205.751 total log seconds and passed reuse, formula, model-package guard, and current-test submit-check; no competition submission was performed.
  - The version-6/version-8 visible output reproducibility gate is 2/2 PASS. The deterministic-GR intermediate content SHA differs, so full intermediate byte reproducibility and hidden-well RNG determinism are not claimed.
  - The visible three-well runtime is not a submission-limit estimate; the pre-submission stage-wise 200-well estimate of 11.5 to 15.0 hours failed the nine-hour planning gate.
  - A later user-submitted exp512 code submission, ref 55255459, completed with Public LB 6.541 and establishes the new overall and ensemble Public-LB anchor.
  - The completed hidden rerun proves platform-limit completion for the submitted package, but exact hidden runtime and hidden well count are unavailable; the pre-submission 200-well estimate remains recorded as a conservative audit, not as observed runtime.
  - Hidden-well stochastic determinism remains unproven, so deterministic_anchor stays false despite the completed visible-output 2-run gate.
  - Canonical adoption and agent-initiated competition submission were not authorized; the recorded submission was performed externally by the user.
  - Public LB improvement does not establish private generalization because honest OOF is unavailable.

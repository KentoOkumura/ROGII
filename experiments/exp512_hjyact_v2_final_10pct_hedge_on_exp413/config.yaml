    - visible_prefix_pf_final_48_seeds
    - pf_seed_branch_statistics
  parallel_rng_policy: four_way_well_tasks_have_explicit_per_well_seeds_and_parent_reassembles_input_order
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true

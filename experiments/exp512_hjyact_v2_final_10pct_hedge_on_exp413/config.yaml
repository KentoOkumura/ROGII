  seed: 42
  deterministic_anchor: false
  seed_policy: exact_source_seed_schedule_plus_two_run_sha_gate
  stochastic_components:
    - sp45_likelihood_pf_seed_bank_0_to_127
    - hjyact_learned_likpf_grsigma_x1p3_seed_base_0
    - exp413_likpf_grsigma_x1p0_stable_per_well_seed

experiment:
  name: exp278_formation_gradient_prefix_stability_risk_readout_on_exp273
  description: >-
    Recomputes the exp273 robust formation plane on full, last-512, and last-256
    known-prefix windows, freezes a target-free prefix-instability risk score,
    and reads its relationship to the frozen exp273 gradient-candidate well
    regressions without rerunning HMM paths or fitting a gate.
  route: pf_beam
  status: completed_readout_guard_failed_branch_closed
  created_at: "2026-07-18"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.n_folds
    - validation.metric

lineage:
  parent: exp273_two_dimensional_formation_gradient_transition
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md formation_gradient_prefix_stability_risk_readout_on_exp273
  implementation_source:
    - exp278_formation_gradient_prefix_stability_risk_readout_on_exp273_train.py
  diff_summary: >-
    Keeps the exp273 shard candidate paths, scalar control, five gradient
    candidates, Huber-plane configuration, and by-well outcomes frozen. Only
    the same plane diagnostic is recomputed on full/last-512/last-256 known
    prefixes. A fixed equal-weight instability score is attached to the frozen
    candidate outcomes for a five-fold report-only readout. HMM generation,
    geometry/scale tuning, gate fitting, inference, and submission stay disabled.

validation:
  strategy: stable_sha256_five_fold_full_valid_well_risk_readout
  metric: fold_and_pooled_spearman_with_fixed_risk_quintile_readout
  seed: 42
  n_folds: 5
  group_column: well
  primary_cohort: exp273_full_gradient_valid_wells
  primary_outcome: gradient_bank_mean_delta_rmse_vs_scalar
  expected_rows: 3783989
  expected_wells: 773
  expected_full_valid_wells: 111
  fold_policy: sha256_exp278_outer_fold_well_modulo_5
  leakage_policy:
    - Plane features read only MD, X, Y, Z, and finite known-prefix TVT_input from the same well.
    - Raw TVT, evaluation-tail target, formation labels, other-well target, candidate error, and oracle values are forbidden risk-feature inputs.
    - Window sizes, transforms, clips, equal weights, primary cohort, fold hash, quintiles, and guards are fixed before outcomes are joined.
    - Exp273 candidate error is attached only after the stability feature table and fold assignment are frozen.
    - Candidate-specific and secondary outcomes are report-only and cannot rescue the primary guard.


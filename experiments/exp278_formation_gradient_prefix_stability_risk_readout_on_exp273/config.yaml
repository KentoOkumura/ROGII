plane:
  target_formula: surface_S_equals_TVT_input_plus_Z
  estimator: deterministic_huber_irls
  diagnostic_fit_policy: fit_if_min_points_and_rank2_even_when_exp273_geometry_guard_fails
  generation_guard_policy: preserve_exp273_validity_and_zero_gradient_fallback_for_parity
  windows:
    - name: full
      rows: null
    - name: last512
      rows: 512
    - name: last256
      rows: 256
  huber_delta: 1.345
  max_iterations: 25
  convergence_tolerance: 0.0000000001
  min_points: 64
  min_xy_step: 0.000001
  min_rank_ratio: 0.05
  max_condition_number: 20.0
  min_azimuth_coverage: 0.02
  covariance_rcond: 0.000000000001
  full_parity:
    absolute_tolerance: 0.00001
    relative_tolerance: 0.000001

risk:
  primary_score: stability_risk_score
  pair_aggregation: maximum_disagreement_across_three_window_pairs
  component_aggregation: equal_weight_mean
  components:
    - gradient_angle_disagreement
    - gradient_magnitude_log_ratio
    - plane_rmse_log_ratio
    - rank_ratio_absolute_gap
    - condition_number_log_ratio
    - validity_flip
  angle_normalizer_degrees: 180.0
  log_ratio_clip: 5.0
  magnitude_epsilon: 0.000000000001
  rmse_epsilon: 0.000000001
  quantiles: 5
  fit_from_outcome: false

candidate_bank:
  candidates:
    - hmm_grad_center
    - hmm_grad_axis1_minus
    - hmm_grad_axis1_plus
    - hmm_grad_axis2_minus
    - hmm_grad_axis2_plus
  control: hmm_scalar_tail30
  primary_aggregation: equal_candidate_mean_delta_rmse_vs_scalar
  secondary_aggregations:
    - max_candidate_delta_rmse_vs_scalar
    - candidate_specific_delta_rmse_vs_scalar

model:
  name: none_zero_booster_prefix_stability_readout
  trains_new_boosters: false
  params: {}

execution:
  stage: formation_gradient_prefix_stability_risk_readout
  run_approved: false
  kaggle_push_requires_user_approval: true
  variants: 0
  lightgbm_configs: 0
  folds_trained: 0
  total_boosters: 0
  parent_control_retraining: false
  hmm_paths_generated: 0
  inference_enabled: false
  submission_enabled: false

guards:
  technical:
    expected_rows: 3783989
    expected_wells: 773
    expected_full_valid_wells: 111
    expected_candidates: 5
    expected_candidate_well_rows: 3865
    expected_folds: 5
    min_full_valid_wells_per_fold: 15
    by_well_rmse_parity_atol: 0.000001
  primary:
    required_positive_folds: 5
    pooled_spearman_must_be_positive: true
    highest_quintile_mean_delta_must_exceed_lowest: true
    sign_epsilon: 0.000000000001
    secondary_can_rescue: false
    candidate_specific_can_rescue: false

artifacts:
  required:
    - exp278_prefix_plane_diagnostics.csv
    - exp278_prefix_stability_features.csv
    - exp278_candidate_outcomes_by_well.csv
    - exp278_candidate_metric_parity.csv
    - exp278_stability_correlations.csv
    - exp278_risk_quintile_metrics.csv
    - exp278_input_manifest.csv
    - exp278_prefix_stability_readout.png
    - exp278_readout_summary.json
    - exp278_reproducibility_manifest.json

runtime:
  use_amp: false
  num_workers: 1
  chunk_rows: 250000
  kaggle:
    enable_gpu: false
    enable_internet: false
    train_kernel_sources:
      - kentookumura/exp273-2d-formation-gradient-aggregate
      - kentookumura/exp273-2d-formation-gradient-shard0
      - kentookumura/exp273-2d-formation-gradient-shard1
    inference_kernel_sources: []

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_stable_sha256_well_outer_fold
  stochastic_components: []
  parallel_rng_policy: no_rng_single_process_stable_well_sort
  feature_sha_policy: aggregate_csv_byte_sha_shard_raw_and_decompressed_sha_output_logical_sha
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - Huber IRLS and SVD use no RNG; numerical parity uses fixed absolute and relative tolerances.
    - The readout does not update a CV, LB, PF/Beam, or submission anchor.
    - A Kaggle rerun is required before calling it a deterministic diagnostic anchor.

inference:
  enabled: false
  mode: disabled_train_side_readout_only
  create_submission: false

notes:
  - A passing readout only supports designing a separate fold-safe gate audit; it does not approve a gate or inference.
  - A failing five-fold direction guard closes the exp273 formation-gradient branch without a rescue grid.

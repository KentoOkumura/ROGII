experiment:
  name: exp516_sixth_place_pfa_tw_late_submit
  description: >-
    Faithful component replay of the 6th-place public submission source's
    single pfA x typewell-GR particle filter: GR-free physical anchor, learned
    emission, 600 particles, 32 seeds, and whole-interval ancestral smoothing.
    The fixed output is submitted once as an explicit post-competition LATE SUBMIT.
  hypothesis: >-
    The published pfA x twGR component can be regenerated from current runtime
    inputs without visible-test prediction reuse and should produce a valid
    late-submission score in the neighborhood of the author's reported
    standalone component, subject to runtime and GPU reproducibility differences.
  route: pf_beam
  status: complete_late_submission_score_mismatch
  created_at: "2026-08-07"
  updated_at: "2026-08-07"
  train_enabled: false
  inference_enabled: true


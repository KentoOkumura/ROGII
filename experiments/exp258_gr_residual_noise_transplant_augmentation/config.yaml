    - exp258_gr_residual_noise_transplant_augmentation_final_model_manifest.json
    - exp258_gr_residual_noise_transplant_augmentation_final_summary.json

inference:
  status: forbidden_until_selector_and_final_guards_pass
  augmentation_at_inference: false
  selected_model: null
  submission_requested: false

submission:
  status: not_submitted
  public_lb: null
  private_lb: null

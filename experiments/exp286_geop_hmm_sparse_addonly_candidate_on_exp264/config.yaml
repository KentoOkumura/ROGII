experiment:
  name: exp286_geop_hmm_sparse_addonly_candidate_on_exp264
  description: >-
    Preserve the corrected exp264 12-candidate selector bank and add the saved
    exp279 geop_hmm path as a full-coverage thirteenth primitive with the same
    candidate ID, availability, generic proxy, and native-confidence contract.
    Retrain only the dual-objective outer-OOF selector and compare it with the
    frozen corrected exp264 Stage B v5 baseline.
  route: ensemble
  status: stage_d_full13_addonly_completed_global_improved_stability_guard_failed
  created_at: "2026-07-19"

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_generator_parent: exp279_exp226_geop_centered_exact_hmm_redecode
  candidate_cache_parent: exp263_last_anchor_better_candidate_confidence_pair_cache
  diff_summary: >-
    Keep the corrected exp264 core12, formulas, legal domains, raw-test-safe
    context, outer folds, selector objectives, sampling, and LightGBM settings.
    Append geop_hmm as primitive candidate 13 in both legal domains with full
    saved-OOF availability and exp279 posterior confidence. The failed fixed
    top-25 percent gate remains closed and is not used in selector training.

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.group_column
    - validation.score_rows

validation:
  strategy: outer5_groupkfold_dual_objective_candidate_selector_full13
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  secondary_metrics:
    - candidate_expected_error_mae
    - candidate_within10_logloss
    - candidate_within10_brier
    - rank_regret
    - top3_oracle_coverage
    - hard_primary_oof_rmse
    - fold_rmse
    - distance_bucket_rmse
    - candidate_selection_rate
  leakage_policy:
    - exp263/exp279のtarget、true TVT、error、oracle、catalog RMSEをrow featureへ入れない。
    - exp279から読む列はID、well、row、fold、geop path、posterior std、well loglikだけに限定する。
    - candidate labelはfeature schemaとouter foldを固定した後にraw train truthから生成する。
    - outer-valid wellのtarget/errorはselector fit、early stopping、prior作成に使わない。
    - candidate IDはstring artifactとone-hotだけを使い、ordinal indexをfeatureにしない。


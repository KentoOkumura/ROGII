experiment:
  name: exp051_pseudo_tail_lgbm_param_micro_tune
  description: Micro-tune exp026 pseudo-tail LightGBM residual parameters and audit raw plus fixed bucket-shrink CV
  route: ml_model
  status: completed
  created_at: "2026-06-10"
  updated_at: "2026-06-10"

lineage:
  parent: exp026_pseudo_tail_bucket_shrink_inference_submit
  diff_summary: Keep the exp026 pseudo-tail cutoffs, no-GR feature set, distance-balanced sampling, residual shrink, and fixed bucket-shrink postprocess; compare only narrow LightGBM parameter and row-cap changes against the exp026 LightGBM control.

validation:
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Existing raw comparison uses GroupKFold-by-well OOF predictions from exp013 only as a reference.
    - Pseudo cutoffs are generated only inside training-fold wells.
    - Held-out fold scoring uses only each well's original TVT_input NaN evaluation zone.
    - Train-only formation columns are not used.

data: {}

model:
  name: lgbm_pseudo_tail_micro_tune_last_anchor_residual
  primary_strategy: drift_model
  drift_strategy: drift_model
  feature_set: no_gr_signal
  strategies:
    - last_anchor
    - recent_linear
    - drift_model
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: LGBMRegressor
    params:
      n_estimators: 800
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 80
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 0.1
      n_jobs: 2
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800

audit:
  parent_train_experiment: exp023_pseudo_tail_distance_augmentation
  parent_postprocess_audit: exp025_pseudo_tail_postprocess_cv_audit
  parent_inference_experiment: exp026_pseudo_tail_bucket_shrink_inference_submit
  parent_best_variant: pseudo_tail_3_cutoffs_distance_balanced
  parent_raw_pseudo_tail_cv: 12.942938
  parent_bucket_shrink_cv: 12.870780
  parent_public_lb: 12.102
  raw_anchor_experiment: exp013_model_diversity_or_postprocess
  raw_anchor_variant: lightgbm_no_gr
  raw_clean_cv: 13.549257
  heldout_postprocess_cv: 13.535596
  weighted_clean_cv: 13.470015
  weighted_postprocess_cv: 13.415799
  raw_oof_path: data/external/kaggle-output/exp013_model_diversity_or_postprocess/train/artifacts/row_oof_predictions.csv
  raw_oof_variant: lightgbm_no_gr
  chunk_rows: 250000
  distance_buckets:
    - name: rows_0_49
      max_step: 49
    - name: rows_50_249
      max_step: 249
    - name: rows_250_999
      max_step: 999
    - name: rows_1000_2499
      max_step: 2499
    - name: rows_2500_plus
      max_step: 1000000000
  postprocess:
    exp014_heldout_bucket_shrink:
      - name: rows_0_49
        max_step: 49
        alpha: 0.20
      - name: rows_50_249
        max_step: 249
        alpha: 0.5917180252647632
      - name: rows_250_999
        max_step: 999
        alpha: 1.15
      - name: rows_1000_2499
        max_step: 2499
        alpha: 1.15
      - name: rows_2500_plus
        max_step: 1000000000
        alpha: 1.0490770312511664
  training_variants:
    enabled: true
    variants:
      - name: lgbm_control_pseudo_tail_3_cutoffs_distance_balanced
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
      - name: lgbm_regularized_leaves23_minchild120
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
        model_params:
          num_leaves: 23
          min_child_samples: 120
      - name: lgbm_capacity_leaves47_minchild60
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
        model_params:
          num_leaves: 47
          min_child_samples: 60
      - name: lgbm_subsample080_colsample085
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
        model_params:
          subsample: 0.8
          subsample_freq: 1
          colsample_bytree: 0.85
      - name: lgbm_reglambda050
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
        model_params:
          reg_lambda: 0.5
      - name: lgbm_rowcap700_perwell
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
        max_train_rows_per_well: 700
      - name: lgbm_rowcap900_perwell
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
        max_train_rows_per_well: 900
  fixed_postprocess:
    exp014_bucket_shrink_params:
      - name: rows_0_49
        max_step: 49
        alpha: 0.20
      - name: rows_50_249
        max_step: 249
        alpha: 0.5917180252647632
      - name: rows_250_999
        max_step: 999
        alpha: 1.15
      - name: rows_1000_2499
        max_step: 2499
        alpha: 1.15
      - name: rows_2500_plus
        max_step: 1000000000
        alpha: 1.0490770312511664
  pseudo_tail:
    min_prefix_rows: 200
    min_pseudo_eval_rows: 250
    cutoff_strategy: quantile

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  kaggle:
    kernel_sources:
      - kentookumura/exp013-model-diversity-or-postprocess-train

notes:
  - This experiment writes no inference submission.
  - The estimator remains LGBMRegressor; only narrow LightGBM params and per-well row caps differ by variant.
  - Pseudo-tail rows are created only from train-fold wells; valid-fold predictions use the original TVT_input mask.
  - The primary comparison is raw LightGBM micro-tune CV versus exp023 raw 12.942938 and fixed bucket-shrink 12.870780.
  - Fixed bucket-shrink is evaluated with exp025-selected exp014 parameters, not refit on this OOF.

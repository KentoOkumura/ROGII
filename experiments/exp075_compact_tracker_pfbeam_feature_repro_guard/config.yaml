experiment:
  name: "exp075_compact_tracker_pfbeam_feature_repro_guard"
  description: Generate compact PF/Beam tracker train features once, then train LightGBM from that generated feature frame with feature importance plots.
  route: ml_model
  status: submitted_repro_guarded_gpu_v3_public_lb_8_489
  created_at: "2026-06-16"
  updated_at: "2026-06-18"

lineage:
  parent: exp074_compact_tracker_surface_lgbm_candidate_audit
  feature_parent: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
  implementation_source: compact_tracker_pfbeam_repro_guard.py
  diff_summary: Split compact PF/Beam tracker feature generation from LightGBM training. Train feature generation is a dedicated reusable notebook over raw train data; the LightGBM train notebook reads that generated CSV without regenerating it; inference regenerates the same compact PF/Beam/likelihood-PF feature surface from raw test before applying saved boosters.

validation:
  strategy: groupkfold_by_exp063_well
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - PF/Beam feature generation notebook reads raw train files only and writes ravaghi_vs_pixiux_public_replay_tracker_features_train.csv.gz.
    - LightGBM train notebook reads the generated train feature CSV and does not regenerate an equivalent CSV for reproducibility checking.
    - The supervised target is TVT minus last_known_tvt.
    - GroupKFold is grouped by well, so a well never appears in train and validation in the same fold.
    - Train-side LightGBM audit does not read raw test files, public submissions, train-visible overrides, CatBoost, Ridge stack, final blend, or projection postprocess.
    - Inference regenerates current raw-test compact tracker/PF/Beam/likelihood-PF features inside the notebook; it does not reuse the saved public replay test CSV.
    - Feature determinism evidence uses decompressed CSV content SHA rather than raw gzip SHA.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  generated_tracker_features_train_local: experiments/exp075_compact_tracker_pfbeam_feature_repro_guard/artifacts/ravaghi_vs_pixiux_public_replay_tracker_features_train.csv.gz
  exp063_tracker_features_test_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_tracker_features_test.csv.gz

feature_generation:
  mode: raw_train_pfbeam_likelihoodpf_compact_feature_generation
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  output_prefix: compact_tracker_pfbeam_repro_guard
  n_jobs: 8
  pf_seeds: 128
  pf_particles: 500
  fast: false
  use_gpu: cpu
  max_wells: null
  expected_artifacts:
    - ravaghi_vs_pixiux_public_replay_tracker_features_train.csv.gz
    - compact_tracker_pfbeam_repro_guard_feature_generation_summary.json
  notes:
    - v1-v3 were generated before the stable-seed patch and must not be used as reproducibility evidence.
    - v4+ must use stable_seed("pf_ancc", wid), stable_seed("pf_z", wid), and stable_seed("likpf", split, wid).

model:
  name: compact_tracker_pfbeam_repro_guard_lgbm
  source_experiment: exp074_compact_tracker_surface_lgbm_candidate_audit
  feature_source: generated_compact_tracker_pfbeam_features_train
  expected_feature_count: 65
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; optional comparison only.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    pfbeam_features:
      enable_gpu: false
    feature_generation_kernel: kentookumura/exp075-compact-pfbeam-features-train
    kernel_sources:
      - kentookumura/exp075-compact-pfbeam-features-train
    inference_kernel_sources:
      - kentookumura/exp075-compact-pfbeam-lgbm-train

audit:
  mode: compact_tracker_pfbeam_lgbm_from_generated_train_features
  output_prefix: compact_tracker_pfbeam_repro_guard
  fast: false
  expected_train_artifacts:
    - compact_tracker_pfbeam_repro_guard_metrics.csv
    - compact_tracker_pfbeam_repro_guard_feature_importance.csv
    - compact_tracker_pfbeam_repro_guard_feature_importance_mean.csv
    - compact_tracker_pfbeam_repro_guard_feature_importance_mean_top.png
    - compact_tracker_pfbeam_repro_guard_feature_importance_fold_mean_by_fold.csv
    - compact_tracker_pfbeam_repro_guard_feature_importance_fold_mean.csv
    - compact_tracker_pfbeam_repro_guard_feature_importance_fold_mean_top.png
    - compact_tracker_pfbeam_repro_guard_by_well.csv
    - compact_tracker_pfbeam_repro_guard_predictions.csv.gz
    - compact_tracker_pfbeam_repro_guard_feature_schema.csv
    - compact_tracker_pfbeam_repro_guard_summary.json
    - compact_tracker_pfbeam_repro_guard_lgb_models/manifest.json
  notes:
    - Train feature generation is intentionally single-pass; no duplicate ravaghi_vs_pixiux_public_replay_tracker_features_train.csv.gz-equivalent generation is used as a reproducibility guard.
    - The generated train feature CSV content SHA, feature schema, model manifest SHA, prediction SHA, and submission SHA are recorded.
    - Train v1 used pre-patch PF/Beam features and must be rerun after feature generation v4.

inference:
  mode: saved_lgb_booster_inference_with_raw_test_pfbeam_regeneration
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  model_manifest_path: null
  regenerate_test_features: true
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  feature_generation:
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false
    use_gpu: auto
  notes:
    - Loads exp075 saved boosters from kernel source kentookumura/exp075-compact-pfbeam-lgbm-train.
    - Regenerates compact exp063 public replay PF/Beam/likelihood-PF test features from current competition raw test files using stable SHA256 per-well seeds.
    - Writes submission.csv for submit-check and optional LB attribution.
    - Inference v1 was submitted twice before stable-seed patch and produced different Public LB scores, so v1 is not a reproducibility anchor.

notes:
  - This experiment implements the requested split: raw-train PF/Beam feature notebook, LightGBM train notebook that reads the generated features, and inference notebook that regenerates raw-test PF/Beam features before prediction.
  - exp074 remains the earlier candidate audit that used the fixed exp063 train artifact directly.

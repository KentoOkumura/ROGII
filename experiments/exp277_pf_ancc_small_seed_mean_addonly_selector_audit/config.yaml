experiment:
  name: exp277_pf_ancc_small_seed_mean_addonly_selector_audit
  description: >-
    Replaces the exp263/exp264 pf_ancc candidate with the frozen exp271 PF ANCC
    mean4/mean8 paths, adds target-free disagreement only to the two-mean variant,
    then audits downstream add-only value against the frozen exp264 Stage D control.
  route: ensemble
  status: corrected_mean4_nested_completed_score_guard_passed
  created_at: "2026-07-18"

lineage:
  parent: exp271_pf_ancc_small_seed_mean_candidate_audit
  selector_parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_bank_parent: exp263_last_anchor_better_candidate_confidence_pair_cache
  downstream_model_anchor: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  selector_parent_stage: corrected_stage_a_v4_stage_c_v6_raw_test_only_88
  downstream_control_parent_stage: corrected_stage_d_v3_clean_273
  references:
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md pf_ancc_small_seed_mean_addonly_selector_audit
  diff_summary: >-
    Keeps the corrected exp264 raw-test-only MD/X/Y/Z/GR context, core-12 candidate
    layout, outer/inner folds, dual selector objectives, compact adapter, clean 273
    downstream surface, and three LightGBM configs. It replaces the existing pf_ancc
    slot with mean4, mean8, or mean4+mean8 with seed/particle/cross-mean disagreement.
    The corrected exp264 Stage D v3 clean-273 matched-control OOF is SHA-guarded and
    is not retrained.

validation:
  strategy: outer5_inner4_nested_selector_then_fixed_control_downstream_addonly
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  leakage_policy:
    - exp271 path and disagreement are frozen before raw horizontal TVT is joined for labels or evaluation.
    - target, error, oracle, hidden-like role, catalog RMSE, and outer eligibility are forbidden selector features.
    - outer-valid wells are excluded from selector fit, calibration, early stopping, and downstream fit.
    - downstream outer-train compact uses inner OOF scores; outer-valid compact uses four-inner-model ensembles.
    - hidden-like assignments are post-hoc metrics only.
    - no hard top1, oracle routing, candidate averaging, raw-test PF regeneration, inference, or submission is produced.
    - actual train/current-test headers must contain MD/X/Y/Z/GR before selector feature audit or fit.
    - training-only formation raw/delta features are forbidden even when present in train horizontal files.


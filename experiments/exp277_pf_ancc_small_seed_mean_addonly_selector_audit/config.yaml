      disagreement_enabled: false
      expected_candidate_count: 12
    mean8_only:
      external_candidates: [pf_ancc_seed_mean_8]
      disagreement_enabled: false
      expected_candidate_count: 12
    mean4_mean8_disagreement:
      external_candidates: [pf_ancc_seed_mean_4, pf_ancc_seed_mean_8]
      disagreement_enabled: true
      expected_candidate_count: 13
  single_candidate_control: mean4_only
  raw_test_contract_if_mean8_independent: four_seed_mean
  hard_selection_enabled: false

features:
  parent_surface: exp264_corrected_stage_c_v6_raw_test_only_88
  schema_mode: per_variant_audit_then_sha_freeze
  groups: [ctx, cand, conf, bank, formula, id]
  missing_policy: native_nan_plus_validity_flags
  exact_duplicate_policy: drop_after_deterministic_audit
  constant_policy: drop_after_deterministic_audit
  correlation_policy: report_only_for_abs_pearson_or_spearman_ge_0p999
  raw_context:
    horizontal_numeric_allowlist: [MD, X, Y, Z, GR]
    forbidden_training_only_columns: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
    add_delta_from_last_known_row: true
    add_typewell_summary: true
    forbidden_columns: [TVT, TVT_input, target, true_tvt]
  audit:
    base_rows_per_fold: 10000
    correlation_long_rows: 50000
    pearson_abs_threshold: 0.999
    spearman_abs_threshold: 0.999
  shape_windows: [32, 128, 512]


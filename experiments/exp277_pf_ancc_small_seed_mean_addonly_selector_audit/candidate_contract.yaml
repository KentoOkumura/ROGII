      - exp226_k16__likpf_mean
      - selfgr_hmm_a070__likpf_mean
      - likpf_mean__exact_hmm
      - pf_ancc_seed_mean_4
      - pf_ancc_seed_mean_8
  primitive_fixed_bank:
    role: fixed_fallback_comparison_domain
    candidates:
      - exp226_k16
      - selfgr_hmm_a070
      - likpf_mean
      - exact_hmm
      - pf_ancc
      - beam_mean
      - exp226_w500_50_50

variants:
  mean4_only:
    external_candidates: [pf_ancc_seed_mean_4]
    disagreement_enabled: false
    expected_candidate_count: 12
  mean8_only:
    external_candidates: [pf_ancc_seed_mean_8]
    disagreement_enabled: false
    expected_candidate_count: 12
  mean4_mean8_disagreement:
    external_candidates: [pf_ancc_seed_mean_4, pf_ancc_seed_mean_8]
    disagreement_enabled: true
    expected_candidate_count: 13
    disagreement_source_columns:
      - pf_ancc_seed_std_4
      - pf_ancc_seed_std_8
      - pf_ancc_particle_std_mean_4
      - pf_ancc_particle_std_mean_8
      - pf_ancc_mean8_minus_mean4

candidate_id_model_encoding:
  type: one_hot
  order_source: score_candidates_declared_order
  max_width: 13
  keep_string_id_in_artifacts: true
  ordinal_index_as_model_feature: false

confidence_contract:
  native_confidence_required_for_every_candidate: false
  external_single_candidate_disagreement_enabled: false
  external_both_candidate_disagreement_enabled: true
  external_both_fields:
    - pf_ancc_seed_std_4
    - pf_ancc_seed_std_8
    - pf_ancc_particle_std_mean_4
    - pf_ancc_particle_std_mean_8
    - pf_ancc_mean8_minus_mean4
    - pf_ancc_mean8_minus_mean4_abs
  universal_proxy_groups:
    - candidate_availability_and_coverage
    - candidate_anchor_distance
    - candidate_local_shape
    - candidate_bank_disagreement
    - formula_parent_disagreement_and_validity
  common_learned_scale: [pred_abs_error, p_within10]

forbidden_behaviors:
  - use_target_error_or_oracle_as_feature_gate_or_candidate_selection
  - hard_top1_prediction
  - softmax_or_plain_candidate_average
  - raw_test_pf_regeneration
  - control_retraining
  - inference
  - submission

    - validation.score_rows

validation:
  strategy: direct_group_safe_k16_segment_local_gradient_exact_hmm
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  fold_assignment: sha256_seed42_well_id_order_round_robin
  expected_wells: 773
  expected_rows: 3783989
  expected_folds: [0, 1, 2, 3, 4]
  score_rows: unknown_suffix_truth_only_after_schedule_and_prediction_freeze
  truth_attachment: after_fold_donor_ledger_schedule_and_prediction_content_sha_freeze
  report_scopes:
    - pooled
    - fold
    - distance_bucket
    - hidden_like_spatial
    - hidden_like_typewell_purged
    - by_well_p50_p95_worst
    - donor_support_and_fallback
  leakage_policy:
    - All wells assigned to the target outer-valid fold are excluded from donor construction.
    - Donor segments use raw outer-train TVT truth; targets use only raw X, Y, Z, MD, GR, typewell, and visible TVT_input prefix.
    - Donor ledger, rowwise prior schedule, and candidate prediction are frozen before suffix truth is attached.
    - Unknown-suffix TVT, errors, oracle choices, formation columns, and well-id-specific rules are forbidden from schedule construction.
    - No exp226 artifact or prediction column may be resolved or read.


experiment:
  name: "exp362_segment_local_donor_slope_exact_hmm"
  description: >-
    Direct exact-HMM experiment that transfers only the exp226 idea of K16
    path segmentation and spatial interpolation of nearby donor slopes into
    the transition-rate mean, without reading any exp226 prediction artifact.
  route: pf_beam
  status: completed_postrun_support_audit_failed_closed
  created_at: "2026-07-23"
  updated_at: "2026-07-24"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260723-exp362-segment-local-donor-slope-exact-hmm
  conceptual_reference: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  superseded_interpretation: exp355_exp226_dip_rate_prior_on_exp209
  references:
    - exp302_exp226_multiscale_k_segment_candidate_audit
    - docs/06_reproducibility.md
  diff_summary: >-
    Keeps the trusted exp209 exact-HMM emission, grid, diffusion, momentum,
    initialization, and posterior output fixed. Replaces only its constant
    transition-rate mean with a fold-safe K16 schedule derived directly from
    raw outer-train donor truth and raw target geometry. Exp226 OOF, tvt_geop,
    tvt_pred, GR correction, kappa, near-strike ANCC, and U projection are
    forbidden inputs. There is no Stage 0; the first future run is the HMM.


model:
  name: k16_segment_local_gradient_residual_exact_hmm
  estimator: none_exact_hmm
  state_definition:
    u: tvt_plus_z
    absolute_rate: delta_u_div_delta_md
    residual_rate: absolute_rate_minus_rowwise_prior_mean
  prefix_rate:
    formula: median_finite_delta_tvt_input_plus_delta_z_div_delta_md
    tail_steps: 30
    fallback: 0.0
  donor_segments:
    source: raw_outer_train_truth_only
    k_segments: 16
    partition: equal_measured_depth_span_over_full_horizontal_well
    minimum_finite_rows: 2
    minimum_positive_md_span: 0.0
    fit: intercept_ordinary_least_squares_against_md
    quantities:
      center_xy: fitted_xy_at_segment_md_midpoint
      u_rate: fitted_tvt_plus_z_slope
      heading_xy: fitted_x_and_y_slopes
    stable_order: outer_fold_well_id_segment_id_row_id
  target_segments:
    k_segments: 16
    partition: equal_measured_depth_span_over_unknown_suffix
    geometry_inputs: [MD, X, Y, Z]
    target_heading_fit: intercept_ordinary_least_squares_against_md
  local_gradient:
    donor_candidate_policy: nearest_segment_per_donor_well_then_nearest_50_wells
    n_neighbors: 50
    bandwidth_ft: 500.0
    weight: exp_minus_half_squared_distance_over_bandwidth
    regression: no_intercept_weighted_ridge_of_u_rate_on_heading_xy
    ridge_relative_trace: 0.001
    ridge_formula: 0.001_times_max_trace_htwh_div_2_or_1e_minus_12
    minimum_valid_donor_wells: 10
    minimum_effective_donors: 10.0
    maximum_nearest_distance_ft: 1500.0
    minimum_directional_information: 0.30
    minimum_target_horizontal_speed_norm: 0.30
    maximum_abs_delta_from_prefix_rate: 0.10
    invalid_policy: target_known_prefix_rate
  prior_schedule:
    segment_mean: dot_target_heading_and_local_gradient
    row_interpolation: linear_between_segment_md_midpoints
    outside_midpoints: hold_nearest_endpoint
    failed_segment_value: target_known_prefix_rate
  hmm:
    transition: residual_rate_ar1_around_rowwise_prior_mean
    residual_rate_formula: q_t_equals_0p998_q_prev_plus_epsilon
    u_formula: u_t_equals_u_prev_plus_mu_t_plus_q_t_times_delta_md_plus_eta
    initial_residual_rate: prefix_rate_minus_first_row_prior_mean
    step: 0.35
    n_rates: 41
    residual_rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    emission: gauss
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    output: posterior_mean
  active_variants:
    - k16_segment_local_gradient_residual_hmm
  forbidden:
    - stage_0_or_preflight
    - exp226_prediction_or_feature_artifact
    - absolute_tvt_unary
    - gr_correction_or_u_projection
    - transition_variance_change
    - parameter_grid
    - prediction_blend
    - ml_selector


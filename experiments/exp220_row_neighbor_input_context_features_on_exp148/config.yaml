model:
  name: exp220_row_neighbor_input_context_features_on_exp148_lgbm
  source_experiment: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_experiment: exp092_u_projection_correction_disagreement_fullrun
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  learned_likelihood_feature_experiment: exp145_learned_likelihood_rawtest_feature_generator_parity
  row_neighbor_context_feature_experiment: exp220_row_neighbor_input_context_features_on_exp148
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_exp145_full_train_ml_features_plus_target_free_same_well_row_neighbor_context_features
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  row_neighbor_input_context_features:
    prefix: rnic_
    feature_group: row_neighbor_input_context
    order_column: md_since
    lag_lead_periods: [1, 3, 5]
    centered_rolling: true
    rolling_windows: [5]
    max_feature_count: 60
    lag_lead_columns:
      - gr
      - dzdmd
      - md_since
      - beam_mean_d
      - likpf_mean_d
      - ll_candidate_tvt_std
      - ll_learned_prob_entropy
      - uproj_source_u_std
    rolling_columns:
      - gr
      - likpf_mean_d
      - ll_candidate_tvt_std
      - ll_learned_prob_entropy
  feature_ablation:
    selected_variant: row_neighbor_input_context_addonly
    active_variants:
      - name: exp148_fulltrain_control
        description: Disabled by cost guard; use completed exp148 CPU/GPU CV and Public LB as comparison baselines unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
        enabled: false
      - name: row_neighbor_input_context_addonly
        description: Adds same-well lag/lead and centered rolling context from target-free input, candidate, and confidence columns on top of exp148.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
          - row_neighbor_input_context
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 60
    lgb_config_splits: [0, 1, 2]
    active_modes:
      - cpu_deterministic_threads8
    modes:
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: false
    enable_internet: false
    train_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    inference_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp220-row-neighbor-input-context-features-on-exp148-train-lgb0
      - kentookumura/exp220-row-neighbor-input-context-features-on-exp148-train-lgb1
      - kentookumura/exp220-row-neighbor-input-context-features-on-exp148-train-lgb2
      - kentookumura/exp099-pf-multiobs-likelihood-train
      - kentookumura/exp111-learned-pf-likelihood-train
      - kentookumura/exp112-learned-pf-likelihood-followup-train

generator:
  chunksize: 200000
  include_candidate_values: false
  default_candidate: likpf_mean
  candidates:
    - name: pf_ancc
      column: pf_ancc
    - name: beam_mean
      column: beam_mean
    - name: likpf_mean
      column: likpf_mean
    - name: sc_ens
      column: sc_ens
    - name: hyb
      column: hyb
  row_context_columns:
    - last_known_tvt
    - pf_ancc_std
    - beam_mean_d
    - sc_ens_d
    - hyb_d
    - eval_len
    - md_since
    - likpf_mean_d
  multiobs_global_columns:
    - multiobs_score_max
    - multiobs_score_mean
    - multiobs_score_gap
    - multiobs_top1_source_id
    - multiobs_top1_mae
    - multiobs_top1_ncc
  feature_cache:
    include_candidate_tvt: true
    include_multiobs_scores: true
    include_probability_features: true
    include_expected_error_features: true
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_feature_rng_cpu_lgbm
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - cpu_lightgbm_training
  parallel_rng_policy: Row-neighbor feature generation has no RNG; LightGBM uses fixed seed/random_state and deterministic CPU flags with fixed n_jobs/num_threads.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a full-train add-only feature audit, not a deterministic submission anchor.
    - Row-neighbor context generation is target-free and preserves row order.
    - Saved-booster inference is not enabled until lgb0/lgb1/lgb2 split outputs are complete and an aggregate manifest is defined.

audit:
  mode: row_neighbor_input_context_features_on_exp148_cpu_split_train
  output_prefix: exp220_row_neighbor_input_context_features_on_exp148
  fast: false
  reference_metrics:
    exp148_gpu_lgb_mean_pooled_rmse: 8.50128118189582
    exp148_gpu_public_lb: 7.960
    exp148_cpu_public_lb: 7.921
    exp193_lgb_mean_pooled_rmse: 8.456665438542778
    exp193_public_lb: 7.946
    exp198_lgb_mean_pooled_rmse: 8.457923653
    exp198_public_lb: 7.930
  expected_train_artifacts:
    - exp220_row_neighbor_input_context_features_on_exp148_metrics.csv
    - exp220_row_neighbor_input_context_features_on_exp148_by_well.csv
    - exp220_row_neighbor_input_context_features_on_exp148_bucket_metrics.csv
    - exp220_row_neighbor_input_context_features_on_exp148_projection_feature_summary.csv
    - exp220_row_neighbor_input_context_features_on_exp148_learned_feature_summary.csv
    - exp220_row_neighbor_input_context_features_on_exp148_row_context_feature_summary.csv
    - exp220_row_neighbor_input_context_features_on_exp148_feature_importance.csv
    - exp220_row_neighbor_input_context_features_on_exp148_feature_importance_mean.csv
    - exp220_row_neighbor_input_context_features_on_exp148_feature_importance_mean_top.png
    - exp220_row_neighbor_input_context_features_on_exp148_predictions.csv.gz
    - exp220_row_neighbor_input_context_features_on_exp148_feature_schema.csv
    - exp220_row_neighbor_input_context_features_on_exp148_lgb_models/manifest.json
    - exp220_row_neighbor_input_context_features_on_exp148_summary.json

inference:
  mode: disabled_until_split_train_outputs_are_complete
  selected_variant: row_neighbor_input_context_addonly
  selected_mode: cpu_deterministic_threads8
  selected_model: lgb_mean
  notes:
    - lgb0/lgb1/lgb2 are trained in separate CPU notebooks.
    - Saved-booster inference requires either a merged manifest or explicit model source handling for the three split outputs.
    - Do not submit until OOF, hidden-like stress, raw-test/current-test parity, and submit-check pass.

notes:
  - Implements the `row_neighbor_input_context_features_on_exp148` backlog item as exp220.
  - Planned Kaggle train cost is 1 active add-only variant, 3 LightGBM configs, 5 folds, 15 boosters total.
  - Each CPU split notebook trains 1 LightGBM config x 5 folds = 5 boosters.
  - Parent/control retraining is not included; exp148, exp193, and exp198 results are historical baselines.

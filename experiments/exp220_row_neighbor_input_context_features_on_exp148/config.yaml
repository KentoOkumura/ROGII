experiment:
  name: "exp220_row_neighbor_input_context_features_on_exp148"
  description: Add target-free same-well row-neighbor input context features to the exp148 learned-likelihood LightGBM surface.
  route: ml_model
  status: kaggle_split_train_completed_no_submit
  created_at: "2026-07-08"
  updated_at: "2026-07-08"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  parity_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp193_typewell_late_interval_context_features_addonly_on_exp148
    - exp198_exact_replacement_prune_on_exp148
  implementation_source: row_neighbor_input_context_features_on_exp148.py
  diff_summary: >
    Keeps the exp148 ML feature surface (exp092 U-projection plus exp145 learned
    likelihood confidence) and adds target-free same-well row-neighbor context
    features from input/candidate/confidence columns. It uses MD-order lag/lead
    deltas and centered rolling context only; it does not use OOF predictions,
    previous-row model predictions, hidden-tail true TVT, oracle best, error
    ranks, direct replacement, blend, postprocess, or a hard selector. CPU
    LightGBM training is split into train_lgb0, train_lgb1, and train_lgb2
    notebook packages to reduce timeout risk.

validation:
  strategy: groupkfold_by_well_exp148_surface_full_train_row_neighbor_context_addonly_rows
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_exp145_full_train_ml_features_and_row_neighbor_context_features
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood features are generated target-free from exp111 saved learned likelihood transforms and exp099/full replay candidate features.
    - Row-neighbor context features use only same-well input, candidate, and confidence feature columns already available at inference.
    - Lead and centered rolling context assume the hidden inference notebook can see the whole current test well before prediction.
    - TVT_input is not used as a rolling/lead source; no hidden-tail true TVT, OOF prediction, previous-row model prediction, oracle best, true-error rank, or evaluation label is used as a feature source.
    - Full-row coverage is required; row-neighbor context generation must preserve row count and row order.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.


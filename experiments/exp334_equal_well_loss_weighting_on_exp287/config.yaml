experiment:
  name: exp334_equal_well_loss_weighting_on_exp287
  description: >-
    Keep the exp287 421-feature, five-fold, three-LightGBM-config surface fixed
    and change only the outer-train sample weights so every well contributes the
    same total training loss. Validation, early stopping, OOF, scope, and by-well
    metrics remain unweighted. The implementation, including the zero-booster
    preflight path, is complete. The compact train notebook, zero-booster
    preflight, and one 15-booster Kaggle train completed. Pooled/global guards
    passed, but the fixed well-tail AND gate failed; the experiment is closed
    without inference or submission.
  route: ml_model
  status: train_complete_guard_failed_closed_no_inference
  created_at: "2026-07-21"
  updated_at: "2026-07-22"

lineage:
  parent: exp287_fold_safe_formation_74_addonly_on_exp264
  clean_tail_control: exp264_exp263_candidate_confidence_dual_selector
  diff_summary: >-
    Reuse the saved exp287 control and keep its clean-273 plus nested-compact-74
    plus fold-safe-formation-74 feature surface, folds, target, selectors, seeds,
    and three LightGBM configs fixed. The only scientific change is a deterministic
    outer-train row weight N_train/(N_train_wells*n_rows_for_well), normalized to
    mean one and equal total weight per well. No validation weight is supplied.

validation:
  strategy: exp287_outer5_groupfold_with_saved_exp287_and_exp264_controls
  metric: rmse
  metric_weighting: unweighted_rows
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  early_stopping_metric_weighting: unweighted_rows
  primary_control:
    experiment: exp287_fold_safe_formation_74_addonly_on_exp264
    rmse: 8.136708220359452
    public_lb: 7.530
  clean_tail_control:
    experiment: exp264_exp263_candidate_confidence_dual_selector
    rmse: 8.460811237612477
  scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Build weights independently inside each outer fold from outer-train score-row identity and well only.
    - Never use target, prediction, error, formation value, or outer-valid rows to define weights.
    - Do not attach sample weights to the validation Dataset.
    - Compare against SHA-pinned saved exp287 and corrected exp264 OOF artifacts without retraining either control.


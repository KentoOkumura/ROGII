experiment:
  name: exp023_pseudo_tail_distance_augmentation
  description: Compare fold-safe pseudo-tail cutoff augmentation and distance-balanced sampling for the LightGBM no-GR residual model
  route: ml_model
  status: completed
  created_at: "2026-06-06"
  updated_at: "2026-06-06"

lineage:
  parent: exp020_distance_weighted_training_audit
  diff_summary: Keep the exp012/exp013 LightGBM no-GR feature/model anchor and compare augmentation that hides the tail of train wells against the same GroupKFold-by-well validation rows.

validation:
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Existing raw comparison uses GroupKFold-by-well OOF predictions from exp013.
    - Pseudo cutoffs are generated only inside training-fold wells.
    - Held-out fold scoring uses only each well's original TVT_input NaN evaluation zone.
    - Train-only formation columns are not used.

data: {}

model:
  name: pseudo_tail_augmented_last_anchor_residual
  primary_strategy: drift_model
  drift_strategy: drift_model
  feature_set: no_gr_signal
  strategies:
    - last_anchor
    - recent_linear
    - drift_model
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: LGBMRegressor
    params:
      n_estimators: 800
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 80
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 0.1
      n_jobs: 2
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800

audit:
  raw_anchor_experiment: exp013_model_diversity_or_postprocess
  raw_anchor_variant: lightgbm_no_gr
  raw_clean_cv: 13.549257
  heldout_postprocess_cv: 13.535596
  weighted_clean_cv: 13.470015
  weighted_postprocess_cv: 13.415799
  raw_oof_path: data/external/kaggle-output/exp013_model_diversity_or_postprocess/train/artifacts/row_oof_predictions.csv
  raw_oof_variant: lightgbm_no_gr
  chunk_rows: 250000
  distance_buckets:
    - name: rows_0_49
      max_step: 49
    - name: rows_50_249
      max_step: 249
    - name: rows_250_999
      max_step: 999
    - name: rows_1000_2499
      max_step: 2499
    - name: rows_2500_plus
      max_step: 1000000000
  postprocess:
    exp014_heldout_bucket_shrink:
      - name: rows_0_49
        max_step: 49
        alpha: 0.20
      - name: rows_50_249
        max_step: 249
        alpha: 0.5917180252647632
      - name: rows_250_999
        max_step: 999
        alpha: 1.15
      - name: rows_1000_2499
        max_step: 2499
        alpha: 1.15
      - name: rows_2500_plus
        max_step: 1000000000
        alpha: 1.0490770312511664
  training_variants:
    enabled: true
    variants:
      - name: control_lightgbm_no_gr
        cutoffs_per_well: 0
        distance_balanced: false
      - name: pseudo_tail_1_cutoff
        cutoffs_per_well: 1
        cutoff_quantiles: [0.65]
        distance_balanced: false
        max_rows_per_pseudo_tail: 350
      - name: pseudo_tail_3_cutoffs
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: false
        max_rows_per_pseudo_tail: 260
      - name: distance_balanced_sampling
        cutoffs_per_well: 0
        distance_balanced: true
        balanced_rows_per_bucket: 60000
      - name: pseudo_tail_3_cutoffs_distance_balanced
        cutoffs_per_well: 3
        cutoff_quantiles: [0.45, 0.65, 0.82]
        distance_balanced: true
        max_rows_per_pseudo_tail: 260
        balanced_rows_per_bucket: 60000
  pseudo_tail:
    min_prefix_rows: 200
    min_pseudo_eval_rows: 250
    cutoff_strategy: quantile

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  kaggle:
    kernel_sources:
      - kentookumura/exp013-model-diversity-or-postprocess-train

notes:
  - This experiment writes no inference submission.
  - OOF artifact audit keeps the raw exp013 anchor and exp014 bucket shrink references visible.
  - Pseudo-tail rows are created only from train-fold wells; valid-fold predictions use the original TVT_input mask.
  - Distance-balanced sampling is compared as an augmentation-independent control.
  - Kaggle full CV selected pseudo_tail_3_cutoffs_distance_balanced at 12.942938, improving raw exp013 13.549257 and exp021 weighted bucket shrink 13.415799.

experiment:
  name: exp006_hard_well_router_diagnostic
  description: Diagnose hard and public-like wells for a future all-GR/no-GR/guarded router
  route: ml_model
  status: completed
  created_at: "2026-06-01"
  updated_at: "2026-06-01"

lineage:
  parent: exp005_gr_gate_recalibration
  diff_summary: Add fold-safe OOF router diagnostics on top of the exp005 control variants without changing the prediction model

validation:
  # Shared metric, fold count, seed, group, and score-row defaults come from project.yml.
  leakage_policy:
    - Same well is never split across train and validation folds.
    - Target-derived features use only the known TVT_input prefix.
    - Evaluation-zone TVT is used only as the residual target during training/CV.
    - Router diagnostics may use OOF target outcomes for labels, but candidate rule inputs are limited to inference-safe well summaries.
    - Train-only formation columns are not used.

data: {}

model:
  name: hgb_last_anchor_residual_router_diagnostic
  primary_strategy: drift_hgb
  drift_strategy: drift_hgb
  feature_set: all
  strategies:
    - last_anchor
    - drift_hgb
  params:
    recent_slope_window: 200
    recent_slope_shrink: 0.5
    max_abs_recent_slope: 0.08
    min_known_rows: 2
    gr_slope_window: 200
    max_abs_gr_slope: 2.0
    gr_roll_short: 25
    gr_roll_long: 100
    residual_shrink: 0.85
    max_abs_residual: 80.0
  drift_model:
    estimator: HistGradientBoostingRegressor
    params:
      max_iter: 180
      learning_rate: 0.05
      max_leaf_nodes: 31
      min_samples_leaf: 80
      l2_regularization: 0.05
      max_bins: 255
  training:
    max_train_rows_per_fold: 300000
    max_train_rows_final: 450000
    max_train_rows_per_well: 800
  rationale:
    - exp002 all-GR residual learning is the Public LB control with CV 14.124569 and Public LB 12.533.
    - exp003 no-GR improved CV to 13.882944 but worsened Public LB to 12.852.
    - exp005 strict GR gate improved Public LB versus exp004 but still trailed exp002.
    - The next step is to tag OOF wells where no-GR helps, where all-GR should be preserved, and which inference-safe well conditions separate those groups.

ablation:
  baseline_experiment: exp002_drift_minimal
  baseline_cv: 14.124569
  baseline_public_lb: 12.533
  alternate_experiment: exp003_residual_ablation
  alternate_cv: 13.882944
  alternate_public_lb: 12.852
  comparison_experiment: exp004_gr_gating
  comparison_cv: 13.932968
  comparison_public_lb: 12.730
  parent_experiment: exp005_gr_gate_recalibration
  parent_cv: 13.936732
  parent_public_lb: 12.579
  selected_variant: gate_low_gr_strict_hard
  variants:
    - name: control_exp002_all
      variable: control
      description: Re-run exp002 all-GR settings as the main control row.
      overrides: {}
    - name: control_exp003_no_gr
      variable: feature_set
      description: Re-run exp003 selected no-GR feature set as the alternate control row.
      overrides:
        model:
          feature_set: no_gr_signal
    - name: control_exp004_low_gr_any_hard
      variable: gr_gating
      description: "Re-run exp004 selected gate: no-GR hard routing when either prefix or evaluation GR coverage is weak."
      overrides:
        model:
          gr_gating:
            enabled: true
            base_feature_set: all
            alternate_feature_set: no_gr_signal
            combine: any
            default_weight: 0.0
            alternate_weight: 1.0
            rules:
              - feature: prefix_gr_missing_rate
                op: ">="
                value: 0.35
              - feature: eval_gr_missing_rate
                op: ">="
                value: 0.40
    - name: gate_low_gr_any_soft_050
      variable: gr_gating
      description: Use exp004 low-GR coverage condition, but blend only 50% toward no-GR to reduce public-visible over-routing.
      overrides:
        model:
          gr_gating:
            enabled: true
            base_feature_set: all
            alternate_feature_set: no_gr_signal
            combine: any
            default_weight: 0.0
            alternate_weight: 0.5
            rules:
              - feature: prefix_gr_missing_rate
                op: ">="
                value: 0.35
              - feature: eval_gr_missing_rate
                op: ">="
                value: 0.40
    - name: gate_low_gr_strict_hard
      variable: gr_gating
      description: Route fully to no-GR only when both prefix and evaluation GR coverage are weak; this keeps `000d7d20` on all-GR in visible sanity.
      overrides:
        model:
          gr_gating:
            enabled: true
            base_feature_set: all
            alternate_feature_set: no_gr_signal
            combine: all
            default_weight: 0.0
            alternate_weight: 1.0
            rules:
              - feature: prefix_gr_missing_rate
                op: ">="
                value: 0.35
              - feature: eval_gr_missing_rate
                op: ">="
                value: 0.40
    - name: gate_low_gr_strict_soft_050
      variable: gr_gating
      description: Apply the stricter both-coverage condition, but blend only 50% toward no-GR.
      overrides:
        model:
          gr_gating:
            enabled: true
            base_feature_set: all
            alternate_feature_set: no_gr_signal
            combine: all
            default_weight: 0.0
            alternate_weight: 0.5
            rules:
              - feature: prefix_gr_missing_rate
                op: ">="
                value: 0.35
              - feature: eval_gr_missing_rate
                op: ">="
                value: 0.40

diagnostic:
  control_variant: control_exp002_all
  no_gr_variant: control_exp003_no_gr
  comparison_variant: control_exp004_low_gr_any_hard
  guarded_variant: gate_low_gr_strict_hard
  meaningful_rmse_delta: 0.25
  thresholds:
    prefix_gr_missing_rate: 0.35
    eval_gr_missing_rate: 0.40
    prefix_fraction_short: 0.23
    eval_row_count_long: 5700
    trajectory_abs_dz_dmd_high: 0.04
    gr_delta_abs_mean_high: 15.0
  source_artifacts:
    exp003_well_delta: experiments/exp003_residual_ablation/artifacts/exp002_exp003_well_delta.csv
    exp005_well_metrics: experiments/exp005_gr_gate_recalibration/artifacts/well_metrics.csv
  outputs:
    well_tags: router_diagnostic_well_tags.csv
    condition_summary: router_condition_summary.csv
    candidate_rules: router_candidate_rules.csv
    metrics: router_diagnostic_metrics.json

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  debug_n_wells: 30
  save_well_metrics: true
  save_oof_predictions: false

notes:
  - Train notebook still runs the exp005 control variants fold-safely, then builds router diagnostics from the generated OOF well_metrics table.
  - The local diagnostics CLI can also read the saved exp003 and exp005 artifacts listed under diagnostic.source_artifacts.
  - Router candidate rules are diagnostic only; the actual router implementation is the next backlog item.
  - Inference is intentionally disabled for this diagnostic experiment.

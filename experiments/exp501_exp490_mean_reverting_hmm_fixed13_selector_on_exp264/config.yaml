  inference_implemented: false
  submission_implemented: false

validation:
  strategy: outer5_groupkfold_fixed13_selector_then_inner4_nested_stacking
  metric: rmse
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_score_candidates: 13
  expected_primary_candidates: 12
  expected_fixed_fallback_candidates: 7
  fold_source: exp263_selector_outer_fold_after_global_exp490_key_join
  leakage_policy:
    - Read exp490 data only through the frozen pre-feature allowlist.
    - Do not read exp490 fold, truth, error, role, episode, scope, by-well, or gate fields before feature freeze.
    - Globally join exp490 by well and row_idx, verify suffix_offset parity, and repartition with the exp263 selector outer fold.
    - Never use the exp490 source fold as a selector feature or split source.
    - Exclude outer-valid wells from inner assignment, fit, and early stopping.
    - Build outer-train compact rows from inner OOF scores only.
    - Build outer-valid compact rows from the four inner-model ensemble only.
    - Read parent exp264 scores only after fixed13 selector scores and choices freeze.
    - Compute oracle, usage, and incumbent-reranking readouts post-freeze and diagnostic-only.


experiment:
  name: exp501_exp490_mean_reverting_hmm_fixed13_selector_on_exp264
  description: >-
    Add the saved exp490 geometry-centered mean-reverting exact-HMM prediction
    as the thirteenth score candidate to the corrected exp264 fixed12 dual
    selector. Keep the existing candidates, fixed fallback, objectives, folds,
    and model settings unchanged. Kaggle CPU Stage A/C completed with strong
    pooled gains but failed both preregistered by-well tail guards, so the
    branch is closed without inference or submission.
  route: ensemble
  status: completed_train_side_rejected_no_submit
  created_at: "2026-08-01"
  updated_at: "2026-08-01"
  inference_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.n_folds
    - validation.score_rows

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_parent: exp490_geometry_centered_mean_reverting_offset_hmm
  fixed_bank_source: exp263_last_anchor_better_candidate_confidence_pair_cache
  implementation_reference: exp496_exp486_absolute_geometry_fixed13_selector_on_exp264
  excluded_router_reference: exp499_exp490_cross_fitted_well_application_selector
  steering: ../../.steering/20260801-exp501-exp490-mean-reverting-hmm-fixed13-selector-on-exp264
  diff_summary: >-
    Change only the score-candidate inventory from corrected exp264 fixed12 to
    fixed12 plus exp490_geometry_mean_reverting_hmm. Add the saved exp490
    prediction and two target-free native fields after a global key join. Keep
    the fixed seven-candidate fallback, objectives, folds, sampling, LightGBM
    parameters, thresholds, and scopes unchanged. Do not use exp498 physics
    features or exp499 well-router features. The fixed Kaggle CPU Stage A/C
    run is approved; downstream TVT, current-test inference, and submission
    remain disabled.


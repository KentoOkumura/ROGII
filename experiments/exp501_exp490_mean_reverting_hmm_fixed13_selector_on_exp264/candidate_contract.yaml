schema_version: 1.0.0
implementation_status: compact_stage_a_stage_c_complete_run_not_approved
source_of_truth: exp263_deployable12_plus_saved_exp490_mean_reverting_hmm_prediction
expected_rows: 3783989
expected_wells: 773

score_candidates:
  - {id: exp226_k16, kind: primitive, family: geometry}
  - {id: selfgr_hmm_a070, kind: primitive, family: self_gr_hmm}
  - {id: likpf_mean, kind: primitive, family: likelihood_pf}
  - {id: exact_hmm, kind: primitive, family: exact_hmm}
  - {id: pf_ancc, kind: primitive, family: particle_filter}
  - {id: beam_mean, kind: primitive, family: beam}
  - id: exp226_k16__selfgr_hmm_a070
    kind: pair_mean_50
    family: geometry_self_gr_hmm_pair
    parents: [exp226_k16, selfgr_hmm_a070]
    weights: [0.5, 0.5]
  - id: exp226_k16__exact_hmm
    kind: pair_mean_50
    family: geometry_exact_hmm_pair
    parents: [exp226_k16, exact_hmm]
    weights: [0.5, 0.5]
  - id: exp226_k16__likpf_mean
    kind: pair_mean_50
    family: geometry_likelihood_pf_pair
    parents: [exp226_k16, likpf_mean]
    weights: [0.5, 0.5]
  - id: selfgr_hmm_a070__likpf_mean
    kind: pair_mean_50
    family: self_gr_hmm_likelihood_pf_pair
    parents: [selfgr_hmm_a070, likpf_mean]
    weights: [0.5, 0.5]
  - id: likpf_mean__exact_hmm
    kind: pair_mean_50
    family: likelihood_pf_exact_hmm_pair
    parents: [likpf_mean, exact_hmm]
    weights: [0.5, 0.5]
  - id: exp226_w500_50_50
    kind: named_fixed
    family: geometry_likelihood_pf_exact_hmm_fixed
    parents: [exp226_k16, likpf_mean, exact_hmm]
    weights: [0.5, 0.25, 0.25]
  - id: exp490_geometry_mean_reverting_hmm
    kind: geometry_centered_mean_reverting_offset_hmm
    family: geometry_guided_exact_hmm
    source_experiment: exp490_geometry_centered_mean_reverting_offset_hmm
    prediction_column: geometry_mean_reverting_hmm
    candidate_generation: saved_exp490_group_safe_full_oof_mean_reverting_hmm
    source_fold_role: upstream_oof_safety_audit_only
    source_fold_used_as_model_feature: false
    selector_join_policy: global_well_row_idx_then_exp263_fold_repartition
    native_confidence:
      geometry_mean_reverting_delta_mean: geometry_mean_reverting_delta_mean
      geometry_mean_reverting_hmm_std: geometry_mean_reverting_hmm_std

legal_domains:
  primitive_pair_bank:
    role: primary_meta_and_hard_select_domain
    candidates:
      - exp226_k16
      - selfgr_hmm_a070
      - likpf_mean
      - exact_hmm
      - pf_ancc
      - beam_mean
      - exp226_k16__selfgr_hmm_a070
      - exp226_k16__exact_hmm
      - exp226_k16__likpf_mean
      - selfgr_hmm_a070__likpf_mean
      - likpf_mean__exact_hmm
      - exp490_geometry_mean_reverting_hmm
  primitive_fixed_bank:
    role: unchanged_fixed_fallback_comparison_domain
    candidates:
      - exp226_k16
      - selfgr_hmm_a070
      - likpf_mean
      - exact_hmm
      - pf_ancc
      - beam_mean
      - exp226_w500_50_50

candidate_id_model_encoding:
  type: one_hot
  order_source: score_candidates_declared_order
  width: 13
  keep_string_id_in_artifacts: true
  ordinal_index_as_model_feature: false

added_candidate_contract:
  included: [exp490_geometry_mean_reverting_hmm]
  excluded_exp490_outputs:
    - tvt_geop
    - exp357_parent_prediction
    - exp226_pred
    - fold
    - true_tvt_readout_only
    - candidate_error
    - parent_error
    - exp226_error
  new_pair_or_blend_candidates: []
  fixed_fallback_changed: false

confidence_contract:
  native_confidence_required_for_added_candidate: true
  native_confidence_finite_required: true
  universal_proxy_required_for_every_candidate: true
  universal_proxy_groups:
    - candidate_availability_and_coverage
    - candidate_anchor_distance
    - candidate_local_shape
    - candidate_bank_disagreement
    - candidate_family_and_kind_one_hot

forbidden_behaviors:
  - use_exp490_truth_error_role_episode_fold_scope_gate_or_by_well_result_as_feature
  - use_exp490_source_fold_id_as_selector_feature_or_split_source
  - use_exp498_physics_or_exp499_well_router_features
  - create_exp490_pair_blend_or_fixed_fallback_candidate
  - change_existing_candidate_value_order_formula_or_domain
  - use_candidate_error_or_oracle_as_feature
  - tune_candidate_weight_usage_threshold_or_gate_on_same_oof
  - train_parent_control_or_downstream_tvt
  - rerun_parent_selector_or_candidate_hmm_pf_beam
  - run_inference_or_submission_before_separate_approval

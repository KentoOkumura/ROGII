experiment:
  name: exp482_isolated_gr_shock_prior_hold
  description: >-
    Detect rows where raw GR is an isolated local shock, the past predictive
    message and the current-observation leave-one-out future message agree,
    and only the current emission moves the estimate. Replace only that row's
    parent readout with the leave-one-out posterior mean without changing the
    parent HMM state or any later prediction.
  hypothesis: >-
    A one-row prior hold can help when independent past and future HMM context
    agrees and the current raw GR sample alone is a local outlier, even though
    broad ambiguity-gated holds failed in exp440.
  route: pf_beam
  status: stage_a0_eligibility_failed_closed
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  evidence:
    - exp408_hmm_message_rate_basin_audit
    - exp440_ambiguity_gated_predictive_prior_hmm
    - exp358_exp209_missing_distance_emission_downweight
    - exp363_sticky_gr_reliability_exact_hmm
    - exp389_exp209_huber_exact_hmm_emission
  steering: ../../.steering/20260730-exp482-isolated-gr-shock-prior-hold
  diff_summary: >-
    Keep the unchanged exp209 HMM and saved prediction. On a single
    preregistered target-free isolated-GR-shock trigger, replace only the
    current row's smoothed mean with the posterior mean computed from the
    predictive message and future beta while excluding the current emission.
    Do not propagate the hold into the forward state or later outputs.


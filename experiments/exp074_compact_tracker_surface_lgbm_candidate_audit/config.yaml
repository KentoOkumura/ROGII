experiment:
  name: "exp074_compact_tracker_surface_lgbm_candidate_audit"
  description: Audit the 65-feature compact tracker surface LightGBM branch as an LB candidate.
  route: ml_model
  status: kaggle_train_inference_completed_pending_optional_lb
  created_at: "2026-06-16"
  updated_at: "2026-06-16"

lineage:
  parent: exp070_gpu_reproducibility_guard_for_exp063
  feature_parent: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
  implementation_source: compact_tracker_surface_audit.py
  diff_summary: Reclassify the exp070 65-feature compact tracker surface from an invalid exp063 reproducibility guard into an explicit LB candidate audit. Train retrains the Pixiux LightGBM family on the fixed compact tracker feature frame; inference regenerates current raw-test PF/Beam/likelihood-PF compact features before applying the exp074 saved boosters.

validation:
  strategy: groupkfold_by_exp063_well
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Train reads only the exp063 compact tracker/PF/Beam output artifact ravaghi_vs_pixiux_public_replay_tracker_features_train.csv.gz.
    - The supervised target is TVT minus last_known_tvt.
    - GroupKFold is grouped by well, so a well never appears in train and validation in the same fold.
    - Train-side audit does not read raw test files, public submissions, train-visible overrides, CatBoost, Ridge stack, final blend, or projection postprocess.
    - Inference regenerates current raw-test compact tracker/PF/Beam/likelihood-PF features inside the notebook; it does not reuse the saved public replay test CSV.
    - This experiment can be treated as an LB candidate audit, not as proof of exp063 full-replay reproducibility.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp063_tracker_features_train_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_tracker_features_train.csv.gz
  exp063_tracker_features_test_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_tracker_features_test.csv.gz
  exp063_oof_predictions_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_oof_predictions.csv.gz
  exp063_summary_local: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/artifacts/ravaghi_vs_pixiux_public_replay_summary.json

model:
  name: compact_tracker_surface_lgbm_candidate_audit
  source_experiment: exp070_gpu_reproducibility_guard_for_exp063
  feature_source: exp063_compact_tracker_features_train
  expected_feature_count: 65
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; optional comparison only.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp063-ravaghi-pixiux-strict-replay-train
    inference_kernel_sources:
      - kentookumura/exp074-compact-tracker-lgbm-audit-train

audit:
  mode: compact_tracker_surface_lgbm_candidate_audit_from_saved_tracker_features
  output_prefix: compact_tracker_surface_audit
  fast: false
  expected_train_artifacts:
    - compact_tracker_surface_audit_metrics.csv
    - compact_tracker_surface_audit_by_well.csv
    - compact_tracker_surface_audit_predictions.csv.gz
    - compact_tracker_surface_audit_feature_schema.csv
    - compact_tracker_surface_audit_summary.json
    - compact_tracker_surface_audit_lgb_models/manifest.json
  notes:
    - Default package is a single GPU train run to avoid spending more than one additional GPU session.
    - Compare CV, feature schema, source feature SHA, model manifest SHA values, and inference submission SHA against exp070.
    - Public LB promotion requires ref, kernel version, and submission SHA attribution.

inference:
  mode: saved_lgb_booster_inference_with_exp063_raw_test_feature_replay
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  model_manifest_path: null
  regenerate_test_features: true
  feature_generation:
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false
    use_gpu: auto
  notes:
    - Loads exp074 saved boosters from kernel source kentookumura/exp074-compact-tracker-lgbm-audit-train.
    - Regenerates compact exp063 public replay PF/Beam/likelihood-PF test features from current competition raw test files.
    - Writes submission.csv for submit-check and optional LB attribution.

notes:
  - Exp070 remains invalid for exp063 full-replay reproducibility because it used this 65-feature compact tracker surface instead of the 196-feature full replay surface.
  - Exp074 makes that compact surface an explicit candidate audit and keeps its evidence separate from exp063/exp073 reproducibility claims.

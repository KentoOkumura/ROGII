  design_approval_received: true
  design_approval_source: user_message_2026_07_30_create_three_backlogs_experiments_steering_design_only
  implementation_approval_received: false
  scaffold_created: true
  notebook_placeholders_only: true
  code_created: false
  tests_created: false

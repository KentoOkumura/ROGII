experiment:
  name: exp454_student_t_exact_hmm_direct_public_lb_audit
  description: >-
    Design-frozen direct Public-LB audit of the exp374 absolute-TVT exact HMM
    with fixed df=4 Student-t row emission. The frozen physical candidate is
    exposed as a standalone submission without retraining, control replay,
    blending, selection, gating, or postprocess.
  hypothesis: >-
    The 0.217808533 ft OOF gain and improvement across all fixed scopes may
    transfer to Public LB despite failing by-well p95 and worst-well guards.
  route: pf_beam
  status: design_frozen_implementation_not_started
  created_at: "2026-07-30"
  updated_at: "2026-07-30"

lineage:
  parent: exp374_exp209_student_t_exact_hmm_emission
  scientific_control: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  public_lb_control: exp434_physics_candidate_public_lb_audit
  sibling_reference: exp389_exp209_huber_exact_hmm_emission
  steering: ../../docs/legacy/steering/20260730-exp454-student-t-exact-hmm-direct-public-lb-audit
  references:
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp374_exp209_student_t_exact_hmm_emission
    - exp389_exp209_huber_exact_hmm_emission
    - exp434_physics_candidate_public_lb_audit
    - docs/06_reproducibility.md
  diff_summary: >-
    Do not create or tune a new HMM. Port exactly the frozen exp374 df=4
    Student-t emission candidate to dynamic current/hidden-test inference and
    expose its posterior-mean TVT directly. The exp209 coordinate, lattice,
    rate process, transitions, prior, sigma, GR preprocessing, and readout
    remain unchanged. No Gaussian or Huber control, blend, selector, gate,
    model, or postprocess is executed.


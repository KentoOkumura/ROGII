experiment:
  name: exp285_exp226_prefix_masked_offset_predictability_readout
  description: >-
    Mask the final 640 rows of each eligible official known prefix, replay the
    group-safe exp226 geometry-only path from the shortened prefix, freeze
    prefix-observable offset summaries, and audit whether they predict the
    official evaluation-suffix exp226 residual before any correction is built.
  route: pf_beam
  status: train_side_readout_completed_guard_failed_branch_closed
  created_at: "2026-07-19"
  updated_at: "2026-07-19"

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.group_column
    - validation.score_rows

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  negative_references:
    - exp279_exp226_geop_centered_exact_hmm_redecode
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
  supporting_diagnostic: exp280_exp226_shift_likelihood_separability_readout
  diff_summary: >-
    Replays only exp226 geometry from a fixed shortened known prefix. The
    masked-known offset summary is frozen before official suffix truth is
    attached. This is an independent prefix predictability readout, not a
    rescue of the exp281 always-on residual-offset HMM.

validation:
  strategy: fixed_prefix_masked_exp226_offset_predictability_readout
  metric: well_level_spearman_and_sign_balanced_accuracy
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: official_evaluation_suffix_post_freeze_readout_only
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  eligibility:
    require_last_known_block_contiguous: true
    pseudo_mask_rows: 640
    minimum_visible_rows_before_cut: 512
    minimum_eligible_wells: 750
    observed_design_time_eligible_wells: 766
  scopes:
    official_horizon_rows: [256, 512, 640]
    near_distance_ft: [0.0, 250.0]
    long_tail_min_distance_ft: 1000.0
    hidden_like_roles:
      - hidden_like_spatial
      - hidden_like_typewell_purged
  guards:
    required_official_oof_rows: 3783989
    required_official_oof_wells: 773
    required_eligible_wells: 750
    required_fold_count: 5
    required_target_well_donor_exclusion_coverage: 1.0
    required_pseudo_mask_identity_coverage: 1.0
    required_pseudo_path_finite_coverage: 1.0
    required_pseudo_summary_finite_coverage: 1.0
    required_masked_tvt_input_access_before_path_freeze: 0
    required_official_truth_access_before_summary_freeze: 0
    primary_pair: pseudo_offset_median_to_official_full_suffix_offset_median
    minimum_primary_spearman_pooled: 0.30
    minimum_primary_positive_folds: 5
    minimum_primary_spearman_0p20_folds: 4
    minimum_primary_sign_balanced_accuracy_pooled: 0.60
    maximum_primary_permutation_pvalue: 0.01
    supporting_pairs:
      - pseudo_offset_slope_to_official_offset_slope
      - pseudo_block_drift_rate_to_official_block_drift_rate
    minimum_supporting_pair_spearman_pooled: 0.20
    minimum_supporting_pair_positive_folds: 4
    minimum_passing_supporting_pair_count: 1
    require_positive_primary_spearman_scopes:
      - near_0_250_ft
      - long_tail_1000_plus_ft
      - hidden_like_spatial
      - hidden_like_typewell_purged
  leakage_policy:
    - The complete validation well is excluded from donor fields, kappa fitting, and donor ANCC surface samples.
    - Saved exp226 fold kappa is reused and is never refit on the validation well or pseudo suffix.
    - Every TVT_input row after the pseudo cut is removed before the target replay receives the frame.
    - The pseudo replay uses target X, Y, Z, and MD through the well end but never target TVT, GR, or ANCC.
    - Masked-known TVT_input is attached only after the pseudo geometry path is frozen and hashed.
    - Official suffix true TVT is attached only after the prefix offset summary is frozen and hashed.
    - Cut, mask length, block definitions, summaries, permutation count, scopes, and guards cannot be tuned on this readout truth.


notes:
  - Compact self-contained train and fail-closed inference notebooks are implemented under separate filenames.
  - The compact train notebook is adopted as the canonical train notebook for the approved Kaggle CPU readout.
  - The canonical inference notebook remains an untouched template stub because inference is disabled.
  - A failed fixed readout cannot trigger cut, mask, block, summary, clip, threshold, or guard rescue.
  - No correction, current-test generation, inference, or submission is authorized by this design.
  - Version 2 completed all technical guards but failed every primary guard; the prefix-calibrated offset branch is closed without parameter rescue.

    filename: exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    candidates:
      - experiments/exp115_hidden_like_spatial_holdout_from_ppt/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
      - /kaggle/input/notebooks/kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
      - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts/exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    expected_sha256: 5f9ac9fac6bb3725a7c613f09856a85bdf73b8206fd2edf1b79e8eaa9bca6597
    role_columns:
      hidden_like_spatial: verification_like_spatial_role
      hidden_like_typewell_purged: verification_like_typewell_purged_role

pseudo_mask:
  masked_rows: 640
  minimum_visible_rows_before_cut: 512
  cut_policy: last_contiguous_known_row_minus_640
  generator_mask_policy: set_all_tvt_input_rows_after_cut_to_missing
  replay_horizon: all_rows_after_cut_through_well_end
  score_zone: first_640_rows_after_cut_ending_at_official_known_end
  cuts_per_well: 1

geometry_replay:
  mode: exp226_geometry_only_fold_safe_saved_kappa_at_pseudo_cut
  source_truth_policy: other_fold_wells_only
  target_input_columns: [well_id, X, Y, Z, MD, TVT_input]
  target_forbidden_columns: [TVT, GR, ANCC]
  target_truth_policy: never_read_before_prefix_summary_freeze
  use_exp226_gr_correction: false
  use_exp226_u_projection: false
  params:
    theta0: 118.4
    k_segments: 16
    local_linear_k: 50
    local_linear_bandwidth: 500.0
    local_linear_ridge: 1.0
    smooth_rho: 10.0
    gate: 0.35
    field_min_proj: 0.3
    kbins: [0.0, 750.0, 1500.0, 2500.0, 4000.0, 1.0e18]
    kappa_regimes: [0.0, 1000.0, 1500.0, 2000.0]
    rot_max_deg: 60.0
    ancc_theta_bandwidth: 1500.0

prefix_summary:
  residual: masked_known_tvt_input_minus_frozen_pseudo_tvt_geop
  total_rows: 640
  block_count: 5
  block_rows: 128
  require_finite_fraction: 1.0
  offset_median: median_all_640_residuals
  offset_slope: intercept_ols_of_five_block_medians_on_block_center_md
  block_drift_rate: last_minus_first_block_median_divided_by_center_md_span
  diagnostics:
    - first_block_median
    - last_block_median
    - raw_block_drift
    - block_center_md_span
    - residual_finite_fraction
  clip: none
  winsorize: none
  sign_policy: nonnegative_is_positive_negative_is_negative

official_target_summary:
  residual: post_freeze_tvt_true_minus_saved_official_exp226_tvt_geop
  full_suffix_blocks: five_contiguous_row_array_split_blocks
  corresponding_summaries: [offset_median, offset_slope, block_drift_rate]
  fixed_horizon_rows: [256, 512, 640]
  distance_scopes_ft:
    near: [0.0, 250.0]
    long_tail: [1000.0, null]

negative_control:
  type: within_fold_well_assignment_permutation
  permutations: 256
  aggregation: independently_permute_each_fold_then_rejoin_for_one_pooled_spearman
  seed: 42
  seed_policy: stable_sha256_per_fold_and_permutation_local_rng
  pvalue: add_one_exceedance_rate


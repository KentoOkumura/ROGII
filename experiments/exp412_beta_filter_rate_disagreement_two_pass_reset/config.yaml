    expected_sha256: b230ffc759e6ee4891f22809b3f3c8a8796681fb461ec0b7215b94a352bf0ab0
  exp209_saved_control:
    filename: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation_amerhu_exact_hmm_smoother_default_train_features.csv.gz
    prediction_column: hmm_mean_tvt
    row_index_source: parsed_from_id_suffix_after_exact_well_prefix
    expected_decompressed_sha256: 8e2f42367b7b8b28e73094eae642c57c75dc8a7ebcfbc3826b0f2067b37f7ae5
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp209-joint-exact-parity-train/artifacts
      - /kaggle/input/exp209-joint-exact-parity-train/artifacts
      - /tmp/kaggle-output/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation/train_v5/artifacts
      - experiments/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation/artifacts
    patterns:
      - "**/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation_amerhu_exact_hmm_smoother_default_train_features.csv.gz"
  stage_0:
    backward_cause_wells: 8
    forward_cause_wells: 8
    matched_control_wells: 16
    total_wells: 32
    backward_sort_key: sha256_exp412_backward_well
    forward_sort_key: sha256_exp412_forward_well
    control_sort_key: sha256_exp412_control_well
    require_each_cause_all_folds: true
    control_match:
      - fold
      - suffix_row_count_quartile
      - raw_gr_missing_quartile
      - prefix_row_count_quartile

model:
  name: beta_filter_rate_disagreement_two_pass_directional_reset
  parent_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    rate_step: 0.005
    sig_r: 0.002
    sig_p: 0.02
    df: 4.0
    lam: 1.0
    sigma_mode: std
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    mom: 0.998
    emission: gauss
    rate_center: zero
  first_pass:
    treatment: none
    persist_filtered_rate_mean: true
    persist_filtered_rate_std: true
    persist_smoothed_rate_mean: true
    require_saved_exp209_prediction_parity_ft: 1.0e-5
  trigger:
    statistic: standardized_smoothed_minus_filtered_rate
    denominator_floor: 0.005
    absolute_z_threshold: 2.0
    rolling_window_rows: 16
    qualifying_rows_min: 8
    same_sign_fraction_min: 0.75
    tie_policy: inactive
    freeze_before_truth: true
    recompute_from_treatment: false
  treatment:
    stay_mass_transfer_fraction: 0.10
    target: signed_adjacent_rate_state
    add_rate_states: false
    edge_policy: no_op_for_outward_source_state
    freeze_schedule_before_backward: true
    first_affected_transition: transition_entering_active_row

validation:
  strategy: stage_0_fixed32_two_pass_then_stage_1_full_773_two_pass
  reporting_folds: 5
  truth_join: after_first_pass_schedule_and_second_pass_prediction_freeze
  stage_0:
    technical:
      posterior_reference_tolerance: 1.0e-10
      baseline_saved_prediction_tolerance_ft: 1.0e-5
      normalization_max_abs_error: 1.0e-5
      finite_coverage: 1.0
      active_row_fraction_min: 0.005
      active_row_fraction_max: 0.20
      active_wells_min: 8
      full_runtime_projection_max_seconds: 30600
      peak_rss_max_gb: 25
    mechanism:
      beta_direction_correction_agreement_min: 0.60
      passing_folds_min: 4
      per_fold_direction_agreement_strictly_above: 0.50
      backward_active_row_coverage_min: 0.05
      backward_sse_reduction_min: 0.10
      forward_sse_regression_max: 0.02
      control_rmse_delta_max_ft: 0.02
      control_active_row_fraction_max: 0.10
  stage_1:
    direct_gain_vs_exp209_min_ft: 0.05
    improving_folds_min: 4
    exclusive_backward_sse_reduction_min: 0.10
    exclusive_forward_sse_regression_max: 0.02
    required_nonworse_scopes:
      - md_1000_plus
      - hidden_like_spatial
      - hidden_like_typewell_purged
      - raw_gr_observed
      - raw_gr_missing
      - fixed_likpf_hmm_50_50
    by_well_delta_p95_max_ft: 0.25
    worst_well_delta_max_ft: 5.0
    active_row_fraction_min: 0.005
    active_row_fraction_max: 0.20
    require_active_well_all_folds: true
    direct_replacement_baseline_rmse: 8.238331667


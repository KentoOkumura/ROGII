experiment:
  name: exp412_beta_filter_rate_disagreement_two_pass_reset
  description: >-
    Completed two-pass exact-HMM Stage-0 experiment that froze persistent
    smoothed-versus-filtered rate disagreement in an unchanged exp209 first
    pass and directionally de-stuck only those transitions in a second pass;
    it failed closed on backward-cause SSE reduction and runtime projection.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-26"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  evidence_parent: exp408_hmm_message_rate_basin_audit
  prerequisite: exp411_predictive_filtered_rate_innovation_destick
  diff_summary: >-
    Run an exact exp209 baseline pass to freeze beta-filter rate disagreement,
    then change only the existing three-state rate transition at frozen active
    rows in a second pass. Beta weights, position, emission, support, and
    posterior readout remain unchanged.

design:
  phase: late
  priority: P3
  risk: high
  implementation_enabled: true
  implementation_approval_source: user_message_implement_exp412_2026_07_28
  stage_0_execution_approved: true
  stage_0_execution_approval_source: user_message_execute_exp412_2026_07_28
  stage_1_execution_approved: false
  inference_enabled: false
  submission_enabled: false
  prerequisite_satisfied: true
  prerequisite_evidence: >-
    exp411 Stage 0 Version 5 failed closed with future-rate direction agreement
    0.225397, zero passing folds, control active-row fraction 0.136119, and
    zero persistent-minus-control active-well fraction.
  assumption: >-
    Where future beta persistently disagrees with the forward filter, beta's
    local rate direction is more often a correct physical-rate correction even
    when its absolute position basin is wrong.


model:
  name: well_adaptive_sig_r_exact_hmm
  estimator: none
  target: TVT
  active_variants: [robust_prefix_rate_diffusion]
  gr_scale:
    pair_policy: finite_horizontal_gr_and_finite_typewell_interp_only
    estimator: 1.4826_times_median_absolute_deviation_about_median
    minimum_pairs: 20
    insufficient_pair_fallback: 30.0
    clip: [10.0, 60.0]
    affine_a: 1.0
    affine_b: 0.0
  confidence:
    observed_weight: 1.0
    distance_unit: within_well_row_distance_to_nearest_raw_finite_gr
    missing_formula: max_floor_times_power2_negative_distance_div_half_life
    half_life_rows: 8.0
    minimum_weight: 0.25
    no_finite_gr_fallback: 0.25
    apply_to: gaussian_log_emission
    additional_grid: false
  transition_scale:
    state_coordinate: U_equals_TVT_input_plus_Z
    rate: delta_U_div_delta_MD
    innovation: adjacent_rate_difference_div_sqrt_mean_delta_MD
    raw_scale: 1.4826_times_mad_about_median
    minimum_innovations: 20
    fallback_sig_r: 0.002
    shrinkage_pseudocount: 100.0
    shrinkage_alpha: n_div_n_plus_100
    shrinkage_space: log
    raw_scale_floor: 1.0e-6
    clip: [0.001, 0.004]
  fixed_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    emission: gaussian
    emission_clip_z2: 600.0
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp
    output: posterior_mean
    effective_position_sigma_floor: 0.1225
  execution_counts:
    variants: 1
    hmm_well_runs: 773
    lightgbm_configs: 0
    trained_folds: 0
    pf_well_runs: 0
    beam_well_runs: 0
    boosters: 0
    parent_control_retraining: false

references:
  parent_prediction_decompressed_sha256: PENDING_EXP308_PASS
  parent_rmse: null
  likpf_rmse: 11.5948976722
  parent_likpf_50_50_rmse: null

gate:
  min_rmse_improvement_vs_parent: 0.05
  min_improved_folds: 4
  maximum_fallback_fraction: 0.50
  maximum_total_clip_fraction: 0.50
  require_1000_plus_non_regression: true
  require_hidden_like_spatial_non_regression: true
  require_hidden_like_typewell_purged_non_regression: true
  require_by_well_p95_delta_max: 0.0
  maximum_worst_well_regression: 0.25
  require_fixed_likpf_blend_non_regression: true
  non_regression_tolerance_ft: 1.0e-6
  baseline_metric_absolute_tolerance: 1.0e-6


experiment:
  name: exp309_well_adaptive_transition_noise
  description: >-
    Implementation-ready train-side exact-HMM audit that estimates one
    well-specific rate diffusion sig_r from robust known-prefix U-rate
    innovations while keeping the promoted exp308 observation model and all
    other state grammar fixed.
  route: pf_beam
  status: closed_without_run_upstream_exp307_chain_failed
  created_at: "2026-07-21"
  updated_at: "2026-07-22"

lineage:
  parent: exp308_imputed_gr_confidence_downweight
  steering: ../../.steering/20260721-exp309-well-adaptive-transition-noise
  diff_summary: >-
    Changes only HMM rate diffusion sig_r by a fixed robust prefix formula.
    Exp307 finite-MAD sigma GR, exp308 imputed-GR confidence, sig_p, rate grid,
    momentum, position kernel, priors, and posterior output remain fixed.

overrides:
  project_defaults: [validation.strategy, validation.metric, validation.n_folds, validation.score_rows]

validation:
  strategy: conditional_grouped_train_side_exact_hmm_transition_audit
  metric: rmse
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  group_column: well_id
  score_rows: tvt_input_unknown_suffix_only_after_prediction_freeze
  expected_wells: 773
  expected_rows: 3783989
  truth_attachment: after_transition_audit_and_prediction_content_sha_are_frozen
  dependency_policy:
    required_parent: exp308_imputed_gr_confidence_downweight
    required_parent_promotion_gate_passed: true
    expected_parent_sha_status: pending_exp308_pass
    fail_closed_on_dependency_mismatch: true
  leakage_policy:
    - Transition statistics use known TVT_input and Z only and are frozen before suffix truth is read.
    - Raw GR missing masks and exp308 confidence weights are frozen before suffix truth is read.
    - Unknown-suffix TVT, error, abs_error, formation, and oracle labels are forbidden before prediction freeze.


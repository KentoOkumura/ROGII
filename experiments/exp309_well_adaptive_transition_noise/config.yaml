notes:
  - Implementation was approved and completed before exp308 execution; all execution remains fail-closed until exp308 passes and exact dependency values are frozen.
  - sig_p adaptation is excluded because the exp209 kernel applies a 0.35*step position-kernel floor.
  - No parent control, PF, LikPF, Beam, model, inference, or submission is regenerated.
  - Exp307 failed promotion, so exp308 is closed without execution and exp309's fixed parent dependency can no longer be satisfied; exp309 is closed without run.

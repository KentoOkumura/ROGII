experiment:
  name: exp265_target_free_pairwise_candidate_divergence_soft_experts_on_exp264
  description: >-
    exp263の6 primitive candidate path間の時間的な差分形状と、TVTを除くraw train情報、
    target-free confidenceだけから512-row blockをK=3 regimeへ分ける。exp264の
    candidate score OOFはregime確定後の評価にだけ使い、soft expert化の前提となる
    separabilityを0-boosterで監査する。
  route: ensemble
  status: invalidated_train_only_raw_context_and_exp264_score_leakage
  created_at: "2026-07-17"

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  candidate_source: exp263_last_anchor_better_candidate_confidence_pair_cache
  diff_summary: >-
    exp264のglobal dual selectorを置換せずfallbackとして残し、候補の絶対TVTではなく
    6 primitive間15 pairのgap・傾き差・符号持続・rank switch・bank特異値構造を
    regime定義の中心にする。outer-train blockだけでRobustScalerとKMeansをfitし、
    outer-validへsoft membershipを付ける。Stage 0ではexpert modelを学習しない。

validation:
  strategy: outer5_target_free_block_regime_separability_audit
  metric: regime_occupancy_stability_and_candidate_family_separation
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  leakage_policy:
    - regime fitにはcandidate absolute TVT、true TVT、TVT_input、target、error、oracleを使わない。
    - raw contextはhorizontal wellの非TVT allowlist列だけを使い、typewell TVTも使わない。
    - outer-valid blockはouter-trainでfitしたimputer、RobustScaler、KMeansだけで割り当てる。
    - exp264 candidate score OOFはregime assignmentを固定した後の評価joinにだけ使う。
    - candidate family winner、calibration bias、guardをregime featureやcluster fitへ戻さない。

data:
  exp263_experiment: experiments/exp263_last_anchor_better_candidate_confidence_pair_cache
  exp263_stage0_root_patterns:
    - /kaggle/input/notebooks/kentookumura/exp263-last-anchor-pair-cache-train/artifacts
    - /tmp/kaggle-output/exp263_last_anchor_better_candidate_confidence_pair_cache/train_v1/artifacts
    - /tmp/kaggle-output/exp263_last_anchor_better_candidate_confidence_pair_cache/train_v1_sample_partitions/artifacts
  exp263_stage0_manifest_patterns:
    - "**/cache_manifest.json"
  exp263_expected_stage0_manifest_sha256: 85e60ac10b50197fa44ea29faffcbba81bd0746114bc53bae0f5cc537a26bb9e
  exp263_expected_catalog_sha256: 7cd748661b719bfcfb1ed21b9fe314366b1c089cc0dd224a9e4cbd4ba7e9e6e0
  exp264_candidate_score_patterns:
    - /kaggle/input/notebooks/kentookumura/exp264-exp263-confidence-dual-selector-train/artifacts/candidate_score_oof.parquet
    - /tmp/kaggle-output/exp264_exp263_candidate_confidence_dual_selector/train_v2/artifacts/candidate_score_oof.parquet
    - "**/candidate_score_oof.parquet"
  exp264_expected_candidate_score_sha256: e51bb6747c71ed38a550b72a119558241220bdddab3fa9bdc2a21e0587445a5a
  exp264_selector_manifest_patterns:
    - /kaggle/input/notebooks/kentookumura/exp264-exp263-confidence-dual-selector-train/artifacts/selector_model_manifest.json
    - /tmp/kaggle-output/exp264_exp263_candidate_confidence_dual_selector/train_v2/artifacts/selector_model_manifest.json
    - "**/selector_model_manifest.json"
  exp264_expected_selector_manifest_sha256: 123750384c24f1a51b5a0108fc17483df35c575ba5a7a852b461bd04ca3f4c9a
  exp264_selector_metrics_patterns:
    - /kaggle/input/notebooks/kentookumura/exp264-exp263-confidence-dual-selector-train/artifacts/selector_metrics.json
    - /tmp/kaggle-output/exp264_exp263_candidate_confidence_dual_selector/train_v2/artifacts/selector_metrics.json
    - "**/selector_metrics.json"
  exp264_expected_selector_metrics_sha256: 568140aafb5d1a3d9191ea6888212a97dd990e2166fb511834510f19e5513c16
  regime_contract: regime_contract.yaml

candidate_bank:
  source_of_truth: exp263_stage0_primitive_surfaces
  primitive_count: 6
  pair_count: 15
  formula_candidates_used_for_regime_fit: 0
  candidate_absolute_value_used_for_regime_fit: false

features:
  block_size: 512
  block_origin: evaluation_row_cumcount_per_well
  raw_context:
    horizontal_numeric_allowlist:
      - MD
      - X
      - Y
      - Z
      - ANCC
      - ASTNU
      - ASTNL
      - EGFDU
      - EGFDL
      - BUDA
      - GR
    summaries: [mean, std, range, end_minus_start, finite_fraction]
    forbidden_columns: [TVT, TVT_input, target, true_tvt]
  confidence_slots:
    - sigma_tvt
    - loglik_per_row
    - entropy
    - score_margin
    - support_count
    - ess_fraction
    - fallback_rate
  pairwise_summaries:
    - gap_mean
    - gap_end
    - gap_std
    - abs_gap_mean
    - abs_gap_p90
    - abs_gap_max
    - gap_slope
    - gap_slope_change
    - first_diff_correlation
    - zero_crossing_rate
    - sign_persistence
    - divergence_expansion_ratio
  bank_summaries:
    - range_mean
    - range_p90
    - range_max
    - rank_switch_rate
    - singular_value_1_share
    - singular_value_2_share
    - effective_rank
  forbidden_feature_tokens:
    - tvt
    - tvt_input
    - true_tvt
    - candidate_tvt
    - last_known_tvt
    - target
    - truth
    - error
    - absolute_error
    - actual_abs_error
    - pred_abs_error
    - oracle
    - label
    - last_known

regime:
  n_clusters: 3
  scaler: robust
  quantile_range: [25.0, 75.0]
  imputation: outer_train_median
  kmeans_n_init: 20
  soft_temperature: median_outer_train_nearest_centroid_distance
  assignment_audit: second_seed_centroid_matched

model:
  name: target_free_pairwise_regime_audit_then_conditional_soft_experts
  trains_new_boosters: false
  stage0:
    variants: 0
    lightgbm_configs: 0
    folds_trained: 0
    planned_boosters: 0
    parent_control_retraining: false
  conditional_stage1:
    enabled: false
    approval_required: true
    regimes: 3
    objectives: 2
    folds: 5
    planned_cpu_boosters: 30
    global_fallback: saved_exp264_selector
    parent_control_retraining: false

execution:
  stage: pairwise_regime_separability_audit
  run_approved: true
  allowed_stages:
    - pairwise_regime_separability_audit
  kaggle_push_requires_user_approval: true
  inference_enabled: false
  stage0_variants: 0
  stage0_lightgbm_configs: 0
  stage0_folds: 0
  stage0_total_boosters: 0
  conditional_stage1_total_boosters: 30

guards:
  technical:
    expected_rows: 3783989
    expected_wells: 773
    expected_folds: 5
    expected_primitives: 6
    expected_pairs: 15
    forbidden_feature_hits: 0
  occupancy:
    min_wells_per_regime_fold: 100
    min_block_share_per_regime_fold: 0.10
    min_passing_folds_per_regime: 4
  stability:
    min_centroid_matched_assignment_agreement: 0.70
  separability:
    min_distinct_best_candidate_families: 2
    min_global_calibration_bias_range_ft: 0.25
    logic: distinct_family_or_calibration_bias
  stage1_requires_all_stage0_guards: true

artifacts:
  required:
    - pairwise_block_fingerprint.parquet
    - regime_block_assignments.parquet
    - regime_row_assignments.parquet
    - regime_centroids.csv
    - regime_feature_schema.json
    - regime_occupancy.csv
    - regime_candidate_metrics.csv
    - regime_candidate_calibration.csv
    - stage0_summary.json
    - reproducibility_manifest.json

runtime:
  use_amp: false
  num_workers: 8
  batch_size: 512
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp263-last-anchor-pair-cache-train
      - kentookumura/exp264-exp263-confidence-dual-selector-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_explicit_seed_plus_outer_fold_offset
  stochastic_components:
    - kmeans_initialization
  parallel_rng_policy: sklearn_random_state_is_explicit_no_global_rng
  feature_sha_policy: logical_content_sha_for_parquet_and_sha256_for_contracts
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - 2つ目の固定seedで同じouter-train blockを再fitしcentroid matching後のassignment一致率を保存する。
    - Stage 0の再現確認が終わるまではdeterministic anchorと呼ばない。

notes:
  - exp264 Stage Bは完了済み。Stage 0はcandidate score、model manifest、metricsの3点をfail-closedで要求する。
  - hard routing、row-level switching、K/window/temperature grid、Viterbi、submissionはscope外。

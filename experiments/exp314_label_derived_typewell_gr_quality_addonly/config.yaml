experiment:
  name: exp314_label_derived_typewell_gr_quality_addonly
  description: Outer-train TVT truthから作ったType Well群GR信頼度priorをraw-test再生成可能なadd-only ML特徴として評価する
  route: ml_model
  status: design_frozen_blocked_on_exp311_exp313
  created_at: "2026-07-21"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  dependencies: [exp311_typewell_group_prefix_suffix_gr_calibration_readout, exp313_typewell_group_unseen_transfer_guard]
  diff_summary: exp148の特徴・fold・3 LightGBM configを固定し、outer-train suffix正解由来のgroup-level noise/reliability prior 6列だけをadd-onlyする。saved controlは再学習しない。

implementation: {enabled: false, scope: design_only, inference_enabled: false, submission_enabled: false}

validation:
  strategy: reuse_exp148_sha256_well_grouped_5fold
  n_folds: 5
  group_column: well_id
  fit_scope: outer_train_wells_only
  control: saved_exp148_oof_no_retrain
  truth_join_policy: build_group_priors_from_outer_train_then_join_outer_valid_by_typewell_content_only

features:
  add_only:
    - typewell_group_log_support_wells
    - typewell_group_log_support_rows
    - typewell_group_residual_sigma
    - typewell_group_fit_rmse
    - typewell_group_bias_abs_gr50
    - typewell_group_prior_available
  fallback: global_outer_train_prior_with_availability_zero
  forbidden: [calibrated_gr_value, direct_tvt_correction, suffix_target_statistic, well_id]

model:
  name: exp148_lightgbm_addonly
  source: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  configs: [lgb0, lgb1, lgb2]
  control_retrain: false

execution_contract: {scientific_variants: 1, model_configs: 3, folds: 5, boosters: 15, control_boosters: 0}

promotion_gates:
  lgb_mean_cv_gain_min_ft: 0.03
  folds_improved_min: 4
  distance_bucket_nonregression: true
  hidden_like_nonregression: true
  worst_well_delta_max_ft: 0.25
  feature_availability_parity_required: true

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: exp148_fixed_folds_and_model_seeds
  stochastic_components: [lightgbm_training]
  parallel_rng_policy: fixed seeds and num_threads; no stochastic feature generation
  feature_sha_policy: decompressed_content_sha_for_gzip
  record: {kernel_version: true, input_sha: true, feature_schema_sha: true, feature_content_sha: true, model_manifest_sha: true, prediction_sha: true, submission_sha: false}

notes:
  - Implementation and any 15-booster Kaggle train require a separate user approval.
  - This is distinct from target-free same_typewell_gr_quality_features_on_exp092 because its prior is learned from outer-train suffix labels.

experiment:
  name: exp505_exp490_tau500_fade_fixed13_on_exp413
  description: >-
    Design-frozen two-stage ensemble experiment. Replace the raw exp490 slot in
    exp501 fixed13 with one alpha-1 tau-500 fade candidate, evaluate the same
    strict-nested selector, and only after a material selector-tail improvement
    permit a separate exp413 nested-selector-block replacement evaluation.
    Stage C implementation is complete as a compact self-contained candidate.
    Kaggle CPU Stage C completed with all technical checks passing and a small
    pooled gain over raw exp501, but failed both preregistered material tail
    reduction guards. The branch is closed without Stage D, inference, or
    submission.
  route: ensemble
  status: completed_train_side_rejected_no_stage_d_no_submit
  created_at: "2026-08-02"
  updated_at: "2026-08-03"

lineage:
  parent: exp501_exp490_mean_reverting_hmm_fixed13_selector_on_exp264
  fixed12_parent: exp264_exp263_candidate_confidence_dual_selector
  fade_evidence: exp503_exp490_strength_weakness_prefix_policy_readout
  candidate_parent: exp490_geometry_centered_mean_reverting_offset_hmm
  candidate_fallback: exp357_exp226_huber_emission_independent_audit
  downstream_parent: exp413_scale5_likpf_full_replacement_on_exp335
  raw_downstream_reference: exp502_exp501_fixed13_selector_replacement_on_exp413
  steering: ../../docs/legacy/steering/20260802-exp505-exp490-tau500-fade-fixed13-on-exp413
  diff_summary: >-
    Replace only exp501's thirteenth raw exp490 prediction with the deterministic
    tau-500 fade of the saved exp490-minus-exp357 correction. Keep fixed12,
    fixed7 fallback, feature families, folds, objectives, selector settings, and
    evaluation scopes unchanged. Stage D is gated: remove exp413 nested74 and
    insert the new compact77 only if Stage C improves raw-exp501 tail metrics.
    Never use the fade as a standalone or direct final prediction.


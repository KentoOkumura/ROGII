  metric: rmse
  metric_weighting: unweighted_suffix_rows
  seed: 42
  n_folds: 5
  outer_folds: 5
  inner_folds: 4
  group_column: well
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_score_candidates: 13
  expected_primary_candidates: 12
  expected_fixed_fallback_candidates: 7
  clean_independent_validation: false
  selection_bias_note: >-
    Tau 500 was retained after the exp503 29-profile saved-OOF readout. The
    exp505 OOF therefore evaluates a frozen reuse candidate but is not an
    independent clean confirmation of the fade hyperparameter.
  leakage_policy:
    - Read exp490 data before feature freeze only through the exact eight-column allowlist.
    - Join globally by well and row_idx, verify suffix_offset and md_since parity, and repartition only with the exp263 outer fold.
    - Never use the exp490 source fold as a feature or split source.
    - Never expose truth, error, role, episode, scope, by-well outcome, or exp503 outcome fields before selector prediction freeze.
    - Build outer-train compact rows from inner OOF scores and outer-valid compact rows from the four-inner-model ensemble.
    - Read saved exp264 and exp501 control scores only after exp505 score, choice, compact, and prediction SHA freeze.
    - Stage D may start only after the frozen Stage C all-AND progression gate passes.


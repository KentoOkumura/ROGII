experiment:
  name: "exp162_learned_likelihood_rank_slot_on_exp148"
  description: Rebuild exp098-style rank-slot U-shape features using exp145 learned likelihood probability and predicted-error scores on top of the exp148 learned likelihood ML anchor.
  route: ml_model
  status: submitted_public_lb_8p100_not_adopted
  created_at: "2026-06-30"
  updated_at: "2026-07-04"

lineage:
  parent: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  base_surface_parent: exp092_u_projection_correction_disagreement_fullrun
  learned_likelihood_parent: exp145_learned_likelihood_rawtest_feature_generator_parity
  learned_likelihood_model_parent: exp111_learned_pf_observation_likelihood_probe
  rank_slot_source_parent: exp098_selector_rank_slot_features_on_exp073
  cache_parent: exp072_exp063_full_replay_feature_cache
  comparison_parents:
    - exp148_learned_likelihood_fulltrain_addonly_on_exp092
    - exp098_selector_rank_slot_features_on_exp073
    - exp139_exp092_exp098_small_rank_slot_merge
    - exp147_exp092_exp098_rank_slot_replacement_only
    - exp153_full_rank_slot_addonly_on_exp092
  implementation_source: learned_likelihood_rank_slot_on_exp148.py
  diff_summary: Keeps the exp148 base, learned likelihood confidence features, residual target, and exp092 U-projection surface fixed, then adds learned-likelihood-defined rank-slot features. Candidate TVT paths are not selected, averaged, blended, or used as a postprocess replacement.

validation:
  strategy: groupkfold_by_well_exp148_surface_with_learned_likelihood_rank_slot_addonly
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: full_rows_between_exp072_exp092_surface_and_exp145_full_train_ml_feature_cache
  leakage_policy:
    - Exp072 full replay features are raw-train-only deterministic cache columns.
    - Exp092 U-projection features use target-free PF/Beam/likelihood-PF candidate paths, row Z, MD distance, and known-prefix anchors.
    - Exp145 learned likelihood probability and predicted-error columns are target-free features generated from saved exp111 transforms and exp099/full replay candidate features.
    - Learned rank slots are ordered only by exp145 learned probability and predicted-error columns; valid/test true TVT, oracle best, and true-error ranks are not used.
    - Rank-slot columns are add-only LightGBM features, not direct selector output, soft average, blend, or postprocess replacement.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json
  learned_likelihood_train_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_full_train_ml_features.csv.gz
  learned_likelihood_rawtest_features_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_rawtest_ml_features.csv.gz
  learned_likelihood_train_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_rawtest_feature_schema_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_feature_schema.csv
  learned_likelihood_train_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/train_v2/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  learned_likelihood_rawtest_summary_local: experiments/exp145_learned_likelihood_rawtest_feature_generator_parity/kaggle/output/inference_v3/artifacts/exp145_learned_likelihood_rawtest_feature_generator_parity_summary.json
  exp111_artifact_dir_local: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts
  exp111_feature_schema: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts/exp111_learned_pf_observation_likelihood_probe_feature_schema.csv
  exp111_model_manifest: experiments/exp111_learned_pf_observation_likelihood_probe/kaggle/output/train_v1/artifacts/exp111_learned_pf_observation_likelihood_probe_model_manifest.json

model:
  name: exp162_learned_likelihood_rank_slot_on_exp148_lgbm
  source_experiment: exp148_learned_likelihood_fulltrain_addonly_on_exp092
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  learned_likelihood_feature_experiment: exp145_learned_likelihood_rawtest_feature_generator_parity
  rank_slot_source_experiment: exp098_selector_rank_slot_features_on_exp073
  feature_source: exp072_exp063_full_replay_train_feature_cache_plus_exp145_full_train_ml_features
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  u_projection:
    anchor_definition: local_prefix_u0_equals_T0_plus_Z0
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    include_lgb_oof_features: false
    sources:
      pf_ancc:
        value_column: pf_ancc
        enabled: true
      pf_z:
        value_column: pf_z
        enabled: true
      beam_mean:
        delta_column: beam_mean_d
        enabled: true
      beam_med:
        delta_column: beam_med_d
        enabled: true
      likpf_mean:
        delta_column: likpf_mean_d
        enabled: true
  learned_likelihood_features:
    prefix: ll_
    direct_columns:
      - learned_prob_top1_index
      - learned_error_top1_index
      - learned_prob_top1_value
      - learned_prob_top2_value
      - learned_prob_margin_top1_top2
      - learned_prob_entropy
      - learned_error_top1_value
      - learned_error_top2_value
      - learned_error_margin_top2_top1
      - learned_prob_likpf_rank
      - learned_error_likpf_rank
      - learned_prob_top3_contains_likpf
      - learned_error_top3_contains_likpf
      - candidate_tvt_std
      - candidate_tvt_range
      - learned_prob_pf_ancc
      - learned_pred_abs_error_pf_ancc
      - multiobs_score_pf_ancc
      - multiobs_mae_pf_ancc
      - multiobs_ncc_pf_ancc
      - learned_prob_beam_mean
      - learned_pred_abs_error_beam_mean
      - multiobs_score_beam_mean
      - multiobs_mae_beam_mean
      - multiobs_ncc_beam_mean
      - learned_prob_likpf_mean
      - learned_pred_abs_error_likpf_mean
      - multiobs_score_likpf_mean
      - multiobs_mae_likpf_mean
      - multiobs_ncc_likpf_mean
      - learned_prob_sc_ens
      - learned_pred_abs_error_sc_ens
      - multiobs_score_sc_ens
      - multiobs_mae_sc_ens
      - multiobs_ncc_sc_ens
      - learned_prob_hyb
      - learned_pred_abs_error_hyb
      - multiobs_score_hyb
      - multiobs_mae_hyb
      - multiobs_ncc_hyb
    candidate_tvt_columns:
      - candidate_tvt_pf_ancc
      - candidate_tvt_beam_mean
      - candidate_tvt_likpf_mean
      - candidate_tvt_sc_ens
      - candidate_tvt_hyb
    weighted_tvt_columns:
      - learned_prob_weighted_tvt
      - learned_error_weighted_tvt
  learned_likelihood_rank_slot:
    prefix: llrs_
    top_k: 3
    degree: 3
    robust_iters: 3
    clip_sigma: 4.0
    error_scale: 50.0
    missing_error_fill: 250.0
    include_lgb_oof_features: false
    candidates:
      - name: pf_ancc
        source_column: pf_ancc
        transform: absolute
        family: pf
        probability_column: learned_prob_pf_ancc
        error_column: learned_pred_abs_error_pf_ancc
        candidate_tvt_column: candidate_tvt_pf_ancc
        enabled: true
      - name: beam_mean
        source_column: beam_mean_d
        transform: base_plus_delta
        family: beam
        probability_column: learned_prob_beam_mean
        error_column: learned_pred_abs_error_beam_mean
        candidate_tvt_column: candidate_tvt_beam_mean
        enabled: true
      - name: likpf_mean
        source_column: likpf_mean_d
        transform: base_plus_delta
        family: likelihood_pf
        probability_column: learned_prob_likpf_mean
        error_column: learned_pred_abs_error_likpf_mean
        candidate_tvt_column: candidate_tvt_likpf_mean
        enabled: true
      - name: sc_ens
        source_column: sc_ens_d
        transform: base_plus_delta
        family: ncc_scale_ensemble
        probability_column: learned_prob_sc_ens
        error_column: learned_pred_abs_error_sc_ens
        candidate_tvt_column: candidate_tvt_sc_ens
        enabled: true
      - name: hyb
        source_column: hyb_d
        transform: base_plus_delta
        family: public_hybrid
        probability_column: learned_prob_hyb
        error_column: learned_pred_abs_error_hyb
        candidate_tvt_column: candidate_tvt_hyb
        enabled: true
  feature_ablation:
    selected_variant: learned_likelihood_rank_slot_addonly
    active_variants:
      - name: exp148_historical_control
        description: Disabled by user request; use historical exp148 CV/LB as the comparison baseline unless an explicit control rerun is later approved.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
        enabled: false
      - name: learned_likelihood_rank_slot_addonly
        description: Adds learned-likelihood-defined rank-slot identity, score, TVT delta, U-shape, slot disagreement, and exp098 heuristic-rank comparison features to exp148.
        feature_groups:
          - projection_correction
          - u_disagreement
          - learned_likelihood_confidence
          - learned_likelihood_rank_slot_identity
          - learned_likelihood_rank_slot_delta
          - learned_likelihood_rank_slot_u_projection
          - learned_likelihood_rank_slot_u_disagreement
          - learned_likelihood_rank_slot_exp098_compare
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 80
    active_modes:
      - cpu_deterministic_threads8
    modes:
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    train_lgb0_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    train_lgb1_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    train_lgb2_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp145-train
    inference_kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
      - kentookumura/exp162-ll-rank-slot-exp148-lgb0-train
      - kentookumura/exp162-ll-rank-slot-exp148-lgb1-train
      - kentookumura/exp162-ll-rank-slot-exp148-lgb2-train
      - kentookumura/exp099-pf-multiobs-likelihood-train
      - kentookumura/exp111-learned-pf-likelihood-train
      - kentookumura/exp112-learned-pf-likelihood-followup-train

generator:
  chunksize: 200000
  include_candidate_values: false
  default_candidate: likpf_mean
  candidates:
    - name: pf_ancc
      column: pf_ancc
    - name: beam_mean
      column: beam_mean
    - name: likpf_mean
      column: likpf_mean
    - name: sc_ens
      column: sc_ens
    - name: hyb
      column: hyb
  row_context_columns:
    - last_known_tvt
    - pf_ancc_std
    - beam_mean_d
    - sc_ens_d
    - hyb_d
    - eval_len
    - md_since
    - likpf_mean_d
  multiobs_global_columns:
    - multiobs_score_max
    - multiobs_score_mean
    - multiobs_score_gap
    - multiobs_top1_source_id
    - multiobs_top1_mae
    - multiobs_top1_ncc
  feature_cache:
    include_candidate_tvt: true
    include_multiobs_scores: true
    include_probability_features: true
    include_expected_error_features: true
  rawtest_replay:
    variant: pixiux_likpf_public_replay
    n_jobs: 8
    pf_seeds: 128
    pf_particles: 500
    fast: false

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: fixed_groupkfold_seed_no_new_pf_rng
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp145_learned_likelihood_feature_generator_cache
    - cpu_lightgbm_training
  parallel_rng_policy: LightGBM deterministic flags plus fixed n_jobs and num_threads; learned rank-slot feature generation itself has no RNG.
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a CPU full-train add-only feature audit, not a deterministic submission anchor.
    - Control retraining is disabled; saved exp148 metrics and Public LB are the baseline.

audit:
  mode: learned_likelihood_rank_slot_on_exp148_full_train_rows
  output_prefix: exp162_learned_likelihood_rank_slot_on_exp148
  fast: false
  reference_metrics:
    exp148_lgb_mean_pooled_rmse: 8.50128118189582
    exp148_public_lb: 7.960
    exp092_full_lgb1_pooled_rmse: 9.322479895503927
    exp098_lgb1_pooled_rmse: 9.35815105231876
    exp139_lgb1_pooled_rmse: 9.324907640659603
    exp147_lgb2_pooled_rmse: 9.397013392978039
    exp153_lgb_mean_pooled_rmse: 9.423385453890534
  expected_train_artifacts:
    - exp162_learned_likelihood_rank_slot_on_exp148_metrics.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_by_well.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_bucket_metrics.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_projection_feature_summary.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_learned_feature_summary.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_learned_rank_slot_feature_summary.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_feature_importance.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_feature_importance_mean.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_feature_importance_mean_top.png
    - exp162_learned_likelihood_rank_slot_on_exp148_predictions.csv.gz
    - exp162_learned_likelihood_rank_slot_on_exp148_feature_schema.csv
    - exp162_learned_likelihood_rank_slot_on_exp148_lgb_models/manifest.json
    - exp162_learned_likelihood_rank_slot_on_exp148_summary.json

inference:
  mode: saved_lgb_booster_inference_with_current_test_learned_likelihood_rank_slot_features
  selected_variant: learned_likelihood_rank_slot_addonly
  selected_mode: cpu_deterministic_threads8
  selected_model: lgb_mean
  model_manifest_prefixes:
    - exp162_learned_likelihood_rank_slot_on_exp148_lgb0
    - exp162_learned_likelihood_rank_slot_on_exp148_lgb1
    - exp162_learned_likelihood_rank_slot_on_exp148_lgb2
  notes:
    - Inference requires completed exp162 split train manifests with saved CPU boosters.
    - Hidden-safe inference v4 completed and code submission ref 54247043 scored Public LB 8.100.
    - Public LB did not beat exp148, so exp162 is not adopted as the ML route anchor.

notes:
  - Implements the high-priority backlog item learned_likelihood_rank_slot_on_exp148.
  - CPU training is split into lgb0, lgb1, and lgb2 Kaggle train notebooks, each with 5 folds.
  - Learned probability / predicted-error rank slots improved split CV but did not transfer to Public LB.

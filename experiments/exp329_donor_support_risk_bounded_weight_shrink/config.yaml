model:
  name: none_deterministic_donor_support_risk_readout
  estimator: none
  params: {}

exp226_geometry:
  theta0: 118.4
  k_segments: 16
  local_linear_k: 50
  local_linear_bandwidth: 500.0
  local_linear_ridge: 1.0
  smooth_rho: 10.0
  field_min_proj: 0.3

support_risk:
  segment_scale: exp226_k16
  donor_selection: exact_exp226_source_fold_safe_local_linear_k50_bandwidth500_ridge1
  donor_distance: sqrt_median_of_nearest_15_squared_distances
  kernel_weight: exp_negative_distance_squared_div_2_bandwidth_squared
  effective_sample_size: squared_sum_weights_div_sum_squared_weights
  local_linear_condition: log1p_condition_number_of_ridged_3x3_normal_matrix
  weighted_mad_center: weighted_median
  primitive_features:
    - donor_distance_high
    - effective_sample_size_low
    - local_linear_condition_high
    - raw_donor_weighted_mad_high
    - smoothed_donor_weighted_mad_high
    - raw_smoothed_local_linear_disagreement_high
  feature_transform: outer_train_empirical_percentile_with_stable_well_segment_tie_order
  raw_composite: arithmetic_mean_of_six_feature_percentiles
  final_score: outer_train_empirical_percentile_of_raw_composite
  range: [0.0, 1.0]
  signed_direction_allowed: false

stage_0_readout:
  enabled_after_implementation: true
  unit: k16_segment
  destination_formula:
    likpf_mean: 0.50
    exact_hmm: 0.50
  segment_benefit_ft: rmse_exp263_base_minus_rmse_destination
  positive_label: segment_benefit_strictly_greater_than_zero
  negative_control:
    kind: within_well_nonzero_circular_shift_of_k16_risk
    offset: one_plus_sha256_well_prefix_mod_15
    key_prefix: exp329
    preserve_segment_count: true
  pass_requires_all:
    minimum_pooled_auc: 0.60
    minimum_folds_with_auc_above_half: 4
    minimum_real_minus_control_auc: 0.05
    minimum_top_risk_decile_mean_benefit_ft: 0.10
    minimum_top_minus_bottom_risk_decile_benefit_ft: 0.25
    require_1000_plus_direction_non_regression: true
    require_hidden_like_spatial_direction_non_regression: true
    require_hidden_like_typewell_purged_direction_non_regression: true
  top_risk_minimum: 0.90
  bottom_risk_maximum: 0.10
  activation_risk_strictly_greater_than: 0.80
  fail_action: close_branch_without_threshold_alpha_clip_destination_or_feature_rescue

stage_1_bounded_shrink:
  enabled_after_implementation: false
  enable_condition: stage_0_all_gates_pass_and_separate_user_approval
  base_formula: 0.50_exp226_plus_0.25_likpf_plus_0.25_exact_hmm
  destination_formula: 0.50_likpf_plus_0.50_exact_hmm
  activation: clip_risk_minus_0.80_div_0.20_to_zero_one
  maximum_shrink_fraction: 0.25
  formula: base_plus_clip_0.25_times_activation_times_destination_minus_base
  maximum_absolute_move_ft: 5.0
  minimum_md_since_last_known_ft: 250.0
  near_policy: bitwise_parent_parity
  boundary_taper: false
  hard_replacement: false
  negative_control: exact_stage_0_within_well_circular_risk_shift

execution_contract:
  stage: stage0_completed_fail_closed
  stage_0:
    scientific_risk_scores: 1
    diagnostic_controls: 1
    support_well_runs: 773
    active_prediction_candidates: 0
    hmm_well_runs: 0
    pf_well_runs: 0
    beam_well_runs: 0
    model_configs: 0
    trained_folds: 0
    boosters: 0
  stage_1_if_pass:
    scientific_candidates: 1
    matched_controls: 1
    parent_prediction_regeneration: false
    hmm_well_runs: 0
    pf_well_runs: 0
    beam_well_runs: 0
    model_configs: 0
    trained_folds: 0
    boosters: 0
  parent_control_retraining: false

promotion_gates:
  minimum_rmse_gain_vs_exp263_ft: 0.02
  minimum_improved_folds: 4
  minimum_activated_subset_rmse_gain_ft: 0.10
  require_near_prediction_bitwise_parity: true
  maximum_1000_plus_rmse_delta_ft: 0.0
  maximum_hidden_like_spatial_rmse_delta_ft: 0.0
  maximum_hidden_like_typewell_purged_rmse_delta_ft: 0.0
  maximum_by_well_delta_p95_ft: 0.0
  maximum_worst_well_delta_ft: 0.25
  minimum_real_gain_minus_control_gain_ft: 0.02

forbidden:

experiment:
  name: exp329_donor_support_risk_bounded_weight_shrink
  description: >-
    Design-frozen two-stage readout that reconstructs the fold-safe exp226 K16
    donor support, tests whether it identifies segments where the exp226 share
    of the saved exp263 formula is harmful, and only then permits one bounded
    shrink of that share toward the two saved non-exp226 parents.
  route: pf_beam
  status: stage0_scientific_gate_failed_branch_closed
  created_at: "2026-07-21"
  updated_at: "2026-07-21"

lineage:
  parent: exp263_last_anchor_better_candidate_confidence_pair_cache
  anchor: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  steering: ../../docs/legacy/steering/20260721-exp329-donor-support-risk-bounded-weight-shrink
  references:
    - exp302_exp226_multiscale_k_segment_candidate_audit
    - exp303_exp226_multiscale_k_stability_selectability_readout_on_exp264
    - exp322_gr_likelihood_weak_exp226_soft_shrink_readout
    - exp279_exp226_geop_centered_exact_hmm_redecode
    - exp281_exp226_residual_offset_exact_hmm_transition_probe
  diff_summary: >-
    Keeps all three saved primitive predictions and the exp263 base formula
    fixed. Adds one target-free donor-support risk score at the exp226 K16
    segment scale. If the readout passes, reduces only the exp226 contribution
    by at most 25 percent and redistributes it equally to saved likPF and exact
    HMM, with a 5 ft row cap and a 0--250 ft veto. This is the opposite direction
    and a different gate from the closed exp322 GR-weak branch.

implementation:
  enabled: true
  scope: stage0_train_side_readout
  train_notebook_state: canonical_adopted_from_compact_selfcontained
  inference_notebook_state: untouched_template_scaffold_do_not_run
  inference_enabled: false
  submission_enabled: false

validation:
  strategy: saved_exp263_oof_fold_safe_exp226_donor_support_two_stage_readout
  metric: rmse
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  group_column: well_id
  expected_rows: 3783989
  expected_wells: 773
  readout_fold_policy: use_saved_exp263_outer_fold_for_metrics
  exp226_source_fold_policy: >-
    Reconstruct each exp226 prediction with its saved source fold and exclude
    that complete validation fold from donor fields. Do not require the exp226
    source fold to equal the exp263 readout fold.
  score_rows: train_unknown_suffix_truth_only_after_support_and_prediction_freeze
  scopes:
    near:
      minimum_md_since_ft: 0.0
      maximum_md_since_ft: 250.0
    long_tail:
      minimum_md_since_ft: 1000.0
      maximum_md_since_ft: null
  leakage_policy:
    - Validation wells and all wells in the same exp226 source fold are excluded from donor fields.
    - Donor values may use complete outer-train wells; validation-well suffix TVT, error, and oracle labels are forbidden before freeze.
    - Each exp263 readout fold uses empirical CDFs fit on the other four readout folds only.
    - Support features, CDFs, segment risk, activation, real/control predictions, and their content SHA are frozen before suffix truth is attached.
    - Signed neighbor error, neighbor correction direction, K12/K24 disagreement, GR likelihood, and HMM posterior information are forbidden risk inputs.
  technical_guards:
    required_row_identity_coverage: 1.0
    required_well_identity_coverage: 1.0
    required_segment_feature_coverage: 1.0
    required_finite_prediction_coverage: 1.0
    maximum_exp263_formula_parity_abs_ft: 0.00001
    minimum_activated_row_fraction: 0.05
    maximum_activated_row_fraction: 0.30
    minimum_activated_wells: 100
    minimum_folds_with_activation: 4
    coverage_fail_status: inconclusive_coverage_no_rescue


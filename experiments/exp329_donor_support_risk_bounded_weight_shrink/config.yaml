notes:
  - Design frozen on 2026-07-21; Stage 0 implementation and Kaggle CPU execution approved.
  - Donor support predicts risk only. It never supplies a correction sign or magnitude from neighboring error.
  - Stage 0 completed on Kaggle CPU version 2 and failed the scientific gates; Stage 1 and rescue grids are closed.
  - exp330 required a Stage 0 PASS and is therefore closed without implementation or execution.

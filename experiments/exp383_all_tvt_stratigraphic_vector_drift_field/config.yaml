experiment:
  name: exp383_all_tvt_stratigraphic_vector_drift_field
  description: >-
    Use all outer-train ground-truth TVT and six train-only formation surfaces
    to reconstruct a prefix-calibrated stratigraphic absolute/vector drift field.
  route: pf_beam
  status: stage0_resource_fail_closed
  created_at: "2026-07-24"
  updated_at: "2026-07-25"

lineage:
  parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  positive_reference:
    - exp287_fold_safe_formation_74_addonly_on_exp264
  negative_references:
    - exp138_ancc_surface_predictability_audit
    - exp150_formation_physical_imputer_revisit
    - exp362_segment_local_donor_slope_exact_hmm
    - exp376_exp226_formation_conditioned_k16_donor_kernel
  diff_summary: >-
    Replace exp226's one-pseudo-start K16 scalar donor field with a dense,
    all-TVT multiscale absolute/vector field conditioned on fold-safe formation
    surfaces, calibrated by every known-prefix S=TVT_input+Z row, and shrunk
    continuously to exp226 under low support or high uncertainty.

validation:
  strategy: exp226_outer_5fold_well_split
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: train_unknown_suffix_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  control:
    experiment: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
    regenerate: false
    cv_rmse_ft: 9.427109596582213
    public_lb: 9.837
    oof_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
  report_scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Outer-valid wells are absent from surface references and drift donors.
    - Outer-valid formation columns and suffix true TVT are unread until late scoring.
    - Donor covariates use leave-one-well-out formation surfaces.
    - Visible three-well sample test is never used for configuration selection.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  target_column: TVT
  visible_prefix_column: TVT_input
  structural_position: "S = TVT + Z"
  formation_columns: [ANCC, ASTNU, ASTNL, EGFDU, EGFDL, BUDA]
  target_allowed_columns: [MD, X, Y, Z, TVT_input]
  target_formation_read_count: 0
  outer_train_full_truth_tvt: true
  parent_exp226:
    expected_oof_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
    filename: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp226-k16-kappa-repro-train/artifacts
      - /kaggle/input/exp226-k16-kappa-repro-train/artifacts
      - /tmp/kaggle-output/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/train_v1/artifacts
  hidden_like_assignments:
    filename: exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    expected_sha256: 5f9ac9fac6bb3725a7c613f09856a85bdf73b8206fd2edf1b79e8eaa9bca6597
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts
      - /kaggle/input/rogii-exp115-hidden-like-assignments
      - /tmp/exp275-output-v2/inputs

method:
  output_type: deterministic_physical_path
  donor_catalog:
    window_lengths_ft: [64, 256, 1024]
    window_strides_ft: [32, 64, 256]
    minimum_rows_per_window: 8
    estimator: fixed_huber_irls
    huber_delta: 1.345
    huber_iterations: 5
  formation_surface:
    row_decimation_md_ft: 32
    unique_wells: 24
    max_points_per_well: 8
    max_points: 192
    adaptive_bandwidth_clip_ft: [500, 4000]
    ridge_trace_ratio: 1.0e-6
    donor_self_exclusion: true
    initial_neighbor_query: 256
    maximum_neighbor_query: 2048
    query_batch_rows: 128
  signature:
    relative_depth_dimensions: 6
    adjacent_thickness_dimensions: 5
    surface_gradient_dimensions: 12
    surface_variance_dimensions: 6
    total_dimensions: 29
    robust_center: median
    robust_scale: 1.4826_mad
    robust_scale_floor: 1.0e-6
    standardized_delta_clip: [-3.0, 3.0]
    target_reference_s: exp226_saved_oof_path_s
  vector_field:
    unique_wells: 32
    max_nodes_per_well: 4
    max_nodes: 128
    minimum_unique_wells: 8
    initial_neighbor_query: 256
    maximum_neighbor_query: 2048
    query_batch_rows: 128
    adaptive_bandwidth_clip_ft: [500, 4000]
    adaptive_bandwidth_unique_well_rank: 24
    ridge_trace_ratio: 1.0e-4
    formation_series: six_surface_relative_residuals
    primary_aggregation: componentwise_robust_median6
  prefix_calibration:
    source: all_finite_TVT_input_plus_Z
    estimator: huber_location
    huber_delta: 1.345
    huber_iterations: 5
    correction: single_vertical_bias
  fallback:
    parent: exp226_saved_oof_rate
    saved_oof_rate_derivation: gradient_of_exp226_prediction_plus_z_on_raw_md
    mode: continuous_uncertainty_shrink
    support_ess_full: 32
    support_unique_wells_full: 24
    condition_reference: 1.0e4
    surface_variance_reference: outer_train_loo_p50
  path_solver:
    query_grid_md_ft: 64
    prefix_constraint: hard_equality
    absolute_term: inverse_variance
    derivative_term: inverse_variance
    curvature_weight: 1.0e-3
    variance_floor: 1.0e-9
    solver: deterministic_banded_weighted_least_squares
    fail_closed: whole_well_exp226

model:
  name: deterministic_all_tvt_stratigraphic_vector_drift_field
  fitted_model: false


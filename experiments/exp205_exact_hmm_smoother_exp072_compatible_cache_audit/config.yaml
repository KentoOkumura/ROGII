  best_rmse_tvt: 10.269699957242537
  baseline_candidate: exp072_likpf_mean
  baseline_rmse_tvt: 11.594897668440991
  delta_rmse_vs_baseline: -1.325197711198454
  feature_content_sha256: 8e2f42367b7b8b28e73094eae642c57c75dc8a7ebcfbc3826b0f2067b37f7ae5
  id_mismatches: 0
  output_archive: /tmp/kaggle-output/exp205_exact_hmm_smoother_exp072_compatible_cache_audit/train_v2_small

runtime:
  use_amp: false
  num_workers: 1
  numba_num_threads: 4
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train
    inference_kernel_sources: []

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_for_default_hmm_generation
  stochastic_components: []
  parallel_rng_policy: numba_parallel_no_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: false
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: false
    submission_sha: false
  notes:
    - Default HMM generation consumes no random numbers.
    - Numba parallel floating arithmetic may still vary at tiny precision, so this is not promoted to a deterministic submission anchor.
    - Test features, model artifacts, predictions, and submissions are intentionally not generated.

inference:
  mode: not_applicable_train_feature_cache_only
  selected_candidate: null
  notes:
    - This experiment intentionally does not create a test HMM feature generator or submission path.
    - If train-side audit supports the HMM, raw-test-compatible regeneration must be designed in a later experiment.

notes:
  - Implements KAGGLE_DIRECTION backlog exact_hmm_smoother_exp072_compatible_cache_audit.
  - HMM path is not treated as direct replacement or postprocess blend for submission in this experiment.
  - Fixed blends are train-side diagnostics only and are written by direct_hmm_comparison.py after joining exp072.

experiment:
  name: "exp089_pf_beam_disagreement_sample_weight"
  description: PF/Beam disagreement confidence features and sample-weight ablation on the fixed exp073 full replay LightGBM surface.
  route: ml_model
  status: train_completed_no_submit_candidate
  created_at: "2026-06-20"
  updated_at: "2026-06-20"

lineage:
  parent: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  cache_parent: exp072_exp063_full_replay_feature_cache
  implementation_source: pf_beam_disagreement_sample_weight.py
  public_replay_source: public_notebook_replay_audit.py
  diff_summary: Keeps the exp073/exp072 deterministic 196-feature full replay surface and original TVT-minus-last-anchor target, then compares target-free PF/Beam confidence features, confidence-derived sample weights, and their combination.

validation:
  strategy: groupkfold_by_exp063_well_same_features_confidence_weight_ablation
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Train features are read from exp072's raw-train-only deterministic feature cache.
    - The expected train feature surface is exp063 Pixiux full public replay with 196 base features.
    - The supervised target remains exp073's TVT minus last_known_tvt residual.
    - GroupKFold is grouped by well; a well never appears in train and validation in the same fold.
    - Confidence features use only target-free PF/Beam/likelihood-PF candidate disagreement, distance, and density diagnostics that already exist in the exp072 cache.
    - Sample weights are computed from target-free confidence ranks before CV splitting and do not use true validation TVT.
    - This is a train-side ablation and not a submission candidate until full CV, well-hash, and worst-well checks are reviewed.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt
  exp072_train_feature_cache_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
  exp072_feature_schema_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_feature_schema.csv
  exp072_summary_local: experiments/exp072_exp063_full_replay_feature_cache/artifacts/exp063_full_replay_feature_cache_summary.json

model:
  name: exp089_pf_beam_disagreement_sample_weight_lgbm
  source_experiment: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  feature_cache_experiment: exp072_exp063_full_replay_feature_cache
  feature_source: exp072_exp063_full_replay_train_feature_cache
  expected_base_feature_count: 196
  target: target
  base_prediction: last_known_tvt
  estimator: lightgbm
  lgb_config_family: exp063_public_pixiux_lgb0_lgb1_lgb2
  confidence_features:
    required_columns:
      - last_known_tvt
      - pf_ancc
      - beam_mean_d
      - likpf_mean_d
      - beam_std_d
      - dense_dist
      - pf_vs_dense
      - md_since
      - eval_len
    robust_rank_columns:
      - pf_likpf_abs
      - pf_beam_abs
      - beam_likpf_abs
      - beam_std_abs
      - dense_dist_abs
      - pf_vs_dense_abs
    feature_groups:
      confidence_core:
        - pf_likpf_abs
        - pf_beam_abs
        - beam_likpf_abs
      confidence_context:
        - beam_std_abs
        - dense_dist_abs
        - pf_vs_dense_abs
      confidence_score:
        - pfbeam_instability_score
        - pfbeam_stable_score
        - pfbeam_high_instability
  sample_weight:
    policies:
      confidence_downweight_unstable:
        description: Slightly upweight stable agreement rows and downweight high disagreement / sparse-density rows.
        score_column: pfbeam_instability_score
        low_weight: 0.65
        high_weight: 1.10
        normalize_mean: true
  feature_ablation:
    selected_variant: null
    active_variants:
      - name: control_exp073_base196
        description: Exp073 full replay 196-feature control, original target and unit sample weights.
        feature_groups: []
        sample_weight_policy: null
        enabled: true
      - name: confidence_features_core
        description: Add the three strongest exp087 PF/Beam/likelihood-PF disagreement features.
        feature_groups:
          - confidence_core
        sample_weight_policy: null
        enabled: true
      - name: sample_weight_unstable_downweight
        description: Keep base 196 features, but train with confidence-derived unstable-row downweighting.
        feature_groups: []
        sample_weight_policy: confidence_downweight_unstable
        enabled: true
      - name: confidence_features_plus_weight
        description: Add core confidence features and train with the same confidence-derived sample weights.
        feature_groups:
          - confidence_core
        sample_weight_policy: confidence_downweight_unstable
        enabled: true
  training:
    early_stopping_rounds: 250
    max_train_rows: null
    max_rows: null
    save_models: true
    save_predictions: true
    top_n_importance: 40
    active_modes:
      - gpu_repro_guard_dp_threads8
    modes:
      exp063_gpu_float32_reference:
        description: Exp063-like GPU LightGBM setting; included for optional rerun comparison.
        use_gpu: true
        common_overrides:
          gpu_use_dp: false
          n_jobs: -1
      gpu_repro_guard_dp_threads8:
        description: GPU double precision plus fixed thread count and deterministic flags.
        use_gpu: true
        common_overrides:
          gpu_use_dp: true
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8
      cpu_deterministic_threads8:
        description: CPU deterministic LightGBM control with fixed thread count.
        use_gpu: false
        common_overrides:
          deterministic: true
          force_col_wise: true
          n_jobs: 8
          num_threads: 8

runtime:
  use_amp: false
  num_workers: 8
  kaggle:
    enable_gpu: true
    enable_internet: false
    kernel_sources:
      - kentookumura/exp072-exp063-full-replay-feature-cache-train

audit:
  mode: pf_beam_disagreement_sample_weight_from_exp072_cache
  output_prefix: exp089_pf_beam_disagreement_sample_weight
  fast: false
  bucket_columns:
    distance: md_since
    tail_rank: id
  expected_train_artifacts:
    - exp089_pf_beam_disagreement_sample_weight_metrics.csv
    - exp089_pf_beam_disagreement_sample_weight_by_well.csv
    - exp089_pf_beam_disagreement_sample_weight_bucket_metrics.csv
    - exp089_pf_beam_disagreement_sample_weight_confidence_feature_summary.csv
    - exp089_pf_beam_disagreement_sample_weight_sample_weight_summary.csv
    - exp089_pf_beam_disagreement_sample_weight_feature_importance.csv
    - exp089_pf_beam_disagreement_sample_weight_feature_importance_mean.csv
    - exp089_pf_beam_disagreement_sample_weight_feature_importance_mean_top.png
    - exp089_pf_beam_disagreement_sample_weight_predictions.csv.gz
    - exp089_pf_beam_disagreement_sample_weight_feature_schema.csv
    - exp089_pf_beam_disagreement_sample_weight_lgb_models/manifest.json
    - exp089_pf_beam_disagreement_sample_weight_summary.json

inference:
  mode: not_selected_train_side_weight_ablation
  deterministic_pf: true
  seed_policy: stable_sha256_per_well
  selected_variant: null
  selected_mode: gpu_repro_guard_dp_threads8
  selected_model: lgb_mean
  notes:
    - Inference is intentionally not selected until train-side feature/weight ablation results are reviewed.
    - If selected, the inference notebook must regenerate raw-test full replay features and compute the same target-free confidence features from test PF/Beam/likelihood-PF paths.

notes:
  - This implements the backlog item `pf_beam_disagreement_sample_weight`.
  - PF/Beam predictions are not used as labels, replacements, routers, or submission branches.
  - Target ablation is not mixed into this experiment; the target remains TVT - last_known_tvt.

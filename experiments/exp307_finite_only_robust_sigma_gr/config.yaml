notes:
  - Design frozen and implementation completed on 2026-07-21.
  - The user explicitly approved Kaggle CPU package/push/run on 2026-07-21 for exactly 2 variants, 1546 HMM well-runs, zero control reruns, and zero boosters.
  - Kaggle v1 completed all 773 well loops but failed in late readout because the saved exp072 cache stores last_known_tvt plus likpf_mean_d rather than an absolute likpf_mean column; v2 fixes only this saved-control materialization contract and adds an early schema preflight.
  - Kaggle v2 completed in 27402.239 seconds. Finite std and finite MAD both degraded direct and fixed-likPF blend RMSE, so the preregistered gate failed closed without rescue, inference, or submission.
  - LikPF port, imputed-GR weighting, transition-noise adaptation, and effective-sample-size shrinkage require separate experiments.

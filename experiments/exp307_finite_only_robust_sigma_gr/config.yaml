  raw_dir: data/raw
  train_dir: data/raw/train
  horizontal_suffix: __horizontal_well.csv
  typewell_suffix: __typewell.csv
  expected_raw_well_identity_sha256: bbb687a1998092578583ce259309b49031d095bde57cbb26c0ab8808d2379b32
  saved_controls:
    kernel_source: kentookumura/exp209-joint-exact-parity-train
    hmm_cache_filename: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation_amerhu_exact_hmm_smoother_default_train_features.csv.gz
    exp072_cache_filename: exp063_full_replay_feature_cache_pixiux_likpf_public_replay_train_features.csv.gz
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp209-joint-exact-parity-train/artifacts
      - /kaggle/input/exp209-joint-exact-parity-train/artifacts
      - /tmp/kaggle-output/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation/train_v5/artifacts
    raw_hmm_prediction_column: hmm_mean_tvt
    likpf_anchor_column: last_known_tvt
    likpf_delta_column: likpf_mean_d
  fold_assignment:
    filename: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_train_oof_predictions.csv.gz
    candidates:
      - /kaggle/input/notebooks/kentookumura/exp226-k16-kappa-repro-train/artifacts
      - /kaggle/input/exp226-k16-kappa-repro-train/artifacts
      - /tmp/kaggle-output/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/train_v1/artifacts
    safe_columns: [well_id, row_idx, suffix_offset, fold, tvt_geop]
    truth_columns: [well_id, row_idx, tvt_true]
    expected_decompressed_sha256: 709eb726cc30da523f017ed0dbd0371967b88a91ddcf25578eb9356f28e4c609
  hidden_like_assignment:
    filename: exp115_hidden_like_spatial_holdout_from_ppt_fold_assignments.csv
    candidates:
      - experiments/exp115_hidden_like_spatial_holdout_from_ppt/artifacts
      - /kaggle/input/notebooks/kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts
      - /kaggle/input/exp115-hidden-like-spatial-holdout-from-ppt-train/artifacts
    role_columns:
      hidden_like_spatial: verification_like_spatial_role
      hidden_like_typewell_purged: verification_like_typewell_purged_role

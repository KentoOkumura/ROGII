experiment:
  name: exp307_finite_only_robust_sigma_gr
  description: >-
    Design-frozen exact-HMM audit that removes zero-filled horizontal GR from
    prefix sigma estimation and compares finite-only std with a preregistered
    finite-only MAD primary while keeping the decoder unchanged.
  route: pf_beam
  status: completed_train_side_gate_failed_closed
  created_at: "2026-07-21"
  updated_at: "2026-07-22"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../docs/legacy/steering/20260721-exp307-finite-only-robust-sigma-gr
  diff_summary: >-
    Changes only known-prefix GR residual scale estimation. Evaluation GR
    interpolation, typewell processing, Gaussian emission center, HMM state
    grammar, transition, prior, and posterior mean remain exp209-compatible.

overrides:
  project_defaults: [validation.strategy, validation.metric, validation.n_folds, validation.score_rows]

validation:
  strategy: grouped_train_side_exact_hmm_candidate_audit
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: tvt_input_unknown_suffix_only_after_prediction_freeze
  expected_wells: 773
  expected_rows: 3783989
  expected_folds: [0, 1, 2, 3, 4]
  truth_attachment: after_scale_and_prediction_content_sha_are_frozen
  leakage_policy:
    - Unknown-suffix TVT, error, abs_error, and oracle labels are forbidden before scale and prediction freeze.
    - Known TVT_input is allowed only for prefix residual scale, initial state, and initial rate.
    - Typewell TVT and GR are reference-coordinate inputs available at inference.


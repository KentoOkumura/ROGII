model:
  name: finite_only_sigma_exact_hmm_audit
  estimator: none
  target: TVT
  active_variants: [finite_std_diagnostic, finite_mad_primary]
  promotion_candidate: finite_mad_primary
  finite_std:
    pair_policy: finite_horizontal_gr_and_finite_typewell_interp_only
    estimator: population_standard_deviation
  finite_mad:
    pair_policy: finite_horizontal_gr_and_finite_typewell_interp_only
    estimator: 1.4826_times_median_absolute_deviation_about_median
  common_scale:
    minimum_pairs: 20
    insufficient_pair_fallback: 30.0
    clip: [10.0, 60.0]
    affine_a: 1.0
    affine_b: 0.0
  fixed_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    emission: gaussian
    emission_clip_z2: 600.0
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp
    output: posterior_mean
  execution_counts:
    variants: 2
    hmm_well_runs: 1546
    lightgbm_configs: 0
    trained_folds: 0
    pf_well_runs: 0
    beam_well_runs: 0
    boosters: 0
    parent_control_retraining: false

references:

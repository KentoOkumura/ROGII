experiment:
  name: "exp423_same_typewell_gr_dtw_truth_warp_transfer_readout"
  description: "same-typewell内のGR類似donorから正解TVT warpを転写する0-model OOF readout"
  route: pf_beam
  status: completed_closed
  created_at: "2026-07-28"
  updated_at: "2026-07-28"
  stage: 0

lineage:
  parent: exp109_typewell_neighbor_prior_features
  references:
    - exp065
    - exp099
    - exp119
    - exp230
    - exp282
  diff_summary: >-
    same-typewell group平均priorを、GR constrained-DTWで選んだouter-train donor固有の
    正解TVT増分をquery anchorへ転写するanalog path readoutへ置き換えて検証する。


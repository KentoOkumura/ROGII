    - Kaggle version 2/3の独立再実行でlogical content SHAが一致し、deterministic anchorへ昇格した。
    - 実装時もquery/outer-valid truthのlate joinを維持する。

notes:
  - compact self-contained Jupytext source/notebook、DTW、freeze、metric、gate、専用testを実装済み。
  - 2026-07-28の実行依頼により正規train notebook採用、Kaggle package、CPU audit runを承認済み。
  - Kaggle version 2の初回有効runでlogical content SHAを取得し、独立rerun referenceへ固定した。
  - Kaggle version 3でlogical content SHAの独立再実行一致を確認した。
  - technical coverageとscientific oracle/primary gateがFAILしたため、truth-warp transfer仮説をrescueなしで閉じる。
  - 正規inference notebookはplaceholderのまま保持し、inference、submissionは未承認・未実行。
  - hard clusteringは行わず、same-typewell groupをdonor pool guardとしてのみ使う。

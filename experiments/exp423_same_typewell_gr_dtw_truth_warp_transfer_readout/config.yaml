  canonical_train_notebook_adopted: true
  canonical_inference_notebook_is_placeholder: true
  canonical_train_notebook_adoption_source: user_message_2026_07_28_run_exp423
  compact_selfcontained_train_source_created: true
  compact_selfcontained_train_notebook_created: true
  jupytext_source_created: true
  helper_code_created: false
  tests_created: true

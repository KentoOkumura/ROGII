experiment:
  name: "exp066_cv_submit_gate"
  description: Submit gate for the exp063 strict Pixiux public replay candidate using CV, inference, submit-check, and train/test overlap probe evidence.
  route: ml_model
  status: completed
  created_at: "2026-06-13"
  updated_at: "2026-06-13"

lineage:
  parent: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
  probe: exp064_train_test_well_id_assert_probe
  diff_summary: Does not train or generate new predictions. Reads exp063 strict public replay metrics and inference metadata, checks exp064 no-overlap probe evidence, and records whether exp063 inference v2 is approved for code submission.

# Defaults come from project.yml. Add keys here only when this experiment intentionally differs.
validation:
  strategy: gate_audit_over_existing_exp063_outputs
  metric: rmse
  seed: 42
  n_folds: 5
  notes:
    - exp063 used GroupKFold by public well id over raw train replay rows.
    - exp066 only gates existing evidence and does not recompute CV.

# Common paths and submission columns come from project.yml.
data:
  source_metrics: experiments/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/metrics.json
  source_submission: /tmp/kaggle-output/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/infer_v2/submission.csv
  overlap_probe_metrics: experiments/exp064_train_test_well_id_assert_probe/metrics.json

model:
  name: exp063_pixiux_likpf_public_replay_submit_gate
  candidate:
    source_experiment: exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit
    variant: pixiux_likpf_public_replay
    model: lgb_mean
    train_kernel: kentookumura/exp063-ravaghi-pixiux-strict-replay-train
    train_kernel_version: 4
    inference_kernel: kentookumura/exp063-ravaghi-pixiux-strict-replay-infer
    inference_kernel_version: 2
    output_file: submission.csv
  params: {}

gate:
  decision_name: exp063_strict_pixiux_replay_v2
  required_source_status: completed
  required_inference_status: complete
  required_submit_check_status: pass
  required_probe_status: complete
  max_cv_rmse: 9.75
  min_delta_vs_ravaghi_mean: 0.50
  max_fallback_rows: 0
  expected_submission_rows: 14151
  prediction_min_lower_bound: 11000.0
  prediction_max_upper_bound: 12500.0
  require_submission_file_present: true
  require_sha_match: true
  route_lb_anchors:
    overall_pf_public_lb: 8.781
    ml_route_public_lb: 11.740
    pseudo_tail_self_public_lb: 11.826
  notes:
    - Gate approval means exp063 inference v2 is ready for code submission, not that it updates any LB anchor.
    - Submit with the exp063 inference kernel/version; exp066 is only the decision record.

runtime:
  use_amp: false
  num_workers: 2
  batch_size: 32
  kaggle:
    enable_gpu: false
    enable_internet: false

notes:
  - The user requested exp063_cv_submit_gate, but exp065 already exists. This experiment is correctly incremented as exp066_cv_submit_gate and does not include exp063 in its experiment name.

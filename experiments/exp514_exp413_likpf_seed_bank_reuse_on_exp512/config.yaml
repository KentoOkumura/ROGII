shared_likelihood_pf:
  producer_id: exp413_x1p0_stable_seed_bank
  source_family: exp073_exp413_likelihood_pf
  generation_count_per_eligible_well: 1
  particles: 500
  seeds: 128
  seed_namespace: "SHA256(likpf::<split>::<well>)"
  seed_index_policy: stable_seed_base_plus_0_to_127
  gr_scale_estimator: known_prefix_zero_fill_population_std
  gr_scale_clip: [10.0, 60.0]
  gr_scale_multiplier: 1.0
  typewell_grid_step_ft: 0.2
  initial_position_spread_ft: 4.5
  momentum: 0.998
  rate_noise: 0.002
  position_noise: 0.005
  rough_position: 0.1
  rough_rate: 0.001
  resample_threshold_fraction: 0.5
  missing_gr_policy: linear_interpolate_both_directions_then_typewell_mean
  aggregation_scales: [3.0, 5.0, 8.0, 12.0]
  branch_weighting_scale: 5.0
  kernel_dtype: float64
  consumer_dtype: float32
  raw_seed_bank_lifetime: per_well_release_after_aggregate_and_branch_summary
  global_raw_seed_bank_cache_allowed: false

consumer_contract:
  sp45:
    inputs:
      - pf_scale_3
      - pf_scale_5
      - pf_scale_8
      - pf_scale_12
      - pf_mean
      - seed_branch_summary
    full_length_prefix_source: raw_tvt_input_known_rows
    suffix_source: shared_exp413_seed_bank_aggregates
    selector_formula_changed: false
    beam_changed: false
    hold_changed: false
    branch_hedge_formula_changed: false
    producer_semantics_changed_from_legacy: true
  exp413:
    inputs:
      - likpf_scale_5
      - likpf_scale_5_d
      - likpf_mean_semantic_alias
    required_parent_scale5_content_parity: exact
    allow_other_scales_in_model_schema: false
    allow_second_likelihood_pf_generation: false
  explicitly_not_shared:
    - learned_likelihood_pf_gs_x1p3_seed0
    - gold_masked_prefix_particle_filter
    - pf_ancc
    - pf_z
    - sp45_fourteen_beam_ensemble
    - exp413_beam_and_hmm_and_k16


experiment:
  name: exp514_exp413_likpf_seed_bank_reuse_on_exp512
  description: >-
    Design-frozen runtime/scientific audit that generates the exp413 x1.0,
    500-particle, 128-seed likelihood-PF bank once per dynamic well and reuses
    it for both exp413 scale-5 features and the SP45 scale-3/5/8/12 selector
    plus seed-branch summary. The legacy SP45 bank is replaced scientifically,
    not treated as an exact optimization.
  hypothesis: >-
    A single exp413 stable-seed Numba bank can preserve exp413 scale-5 content,
    remove the duplicate SP45 128-seed PF cost, remain within frozen paired
    accuracy guards, and produce a Stage D visible-test stagewise runtime
    estimate whose 200-well upper estimate is within the nine-hour limit.
  route: ensemble
  status: completed_stage_b_scientific_fail_stage_d_v4_technical_pass_no_resubmit
  created_at: "2026-08-05"
  updated_at: "2026-08-05"
  train_enabled: false
  inference_enabled: false

lineage:
  parent: exp512_hjyact_v2_final_10pct_hedge_on_exp413
  likelihood_pf_source: exp413_scale5_likpf_full_replacement_on_exp335
  replay_kernel_source: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  comparison:
    - exp512_hjyact_v2_final_10pct_hedge_on_exp413
    - exp513_hjyact_v2_final_standalone_public_lb_audit
    - exp413_scale5_likpf_full_replacement_on_exp335
  steering: ../../.steering/20260805-exp514-exp413-likpf-seed-bank-reuse-on-exp512
  references:
    - ../exp512_hjyact_v2_final_10pct_hedge_on_exp413/result.md
    - ../exp512_hjyact_v2_final_10pct_hedge_on_exp413/SESSION_NOTES.md
    - ../exp413_scale5_likpf_full_replacement_on_exp335/config.yaml
    - ../../docs/06_reproducibility.md
  diff_summary: >-
    Move the exp413 stable-seed x1.0 likelihood-PF producer before SP45, call
    it exactly once per dynamic well, and derive all four SP45 temperatures,
    full-length adapters, and seed-branch summaries from the same raw seed
    paths and log-likelihoods. Feed only scale 5 to the unchanged exp413 model
    graph. Keep learned x1.3 PF, Gold masked-prefix PF, pf_ancc, pf_z, Beam,
    saved models, weights, selectors, postprocess, and model-package-disabled
    parent settings fixed. After Stage A PASS, change only the Stage B paired
    accuracy sample from 200 wells to the exact target-free Stage A 32-well
    selection and keep all accuracy thresholds fixed. Stage C is not required
    by user override; estimate 200-well runtime from Stage D visible-test
    per-stage timings without treating that estimate as hidden runtime evidence.
    Stage D v3 changes runtime orchestration only: Gold uses at most four
    well-level processes and HJYACT reuses SP45 deterministic test features,
    with five exact Stage D v2 output SHA witnesses required. Stage D v4 keeps
    the numerical contract fixed while bounding shared-PF payload lifetime,
    releasing Ridge intermediates, transferring DataFrame ownership, and
    restricting the five visible SHA witnesses to the visible sample only.


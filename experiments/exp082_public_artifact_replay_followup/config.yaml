experiment:
  name: "exp082_public_artifact_replay_followup"
  description: Follow-up integrity audit for SP45, fle3n, Koolbox, and SP45/Fleongg public replay candidates after exp079.
  route: ensemble
  status: submitted_jaemin_final_source_port_public_lb_7_602_not_adopted
  created_at: "2026-06-19"
  updated_at: "2026-06-21"

lineage:
  parent: exp079_public_artifact_replay_integrity_audit
  deterministic_anchor: exp073_gpu_reproducibility_guard_for_exp063_full_replay
  pf_route_anchor: exp027_public_replay_needless090_sel15_spread3
  diff_summary: Fixes exact source slugs for the SP45/fle3n/Koolbox family left as placeholder in exp079, then reruns the same integrity audit and source-ports fle3n and jaemin SP45/Fleongg final blends for hidden-compatible notebook submission. This is an ensemble public-notebook route candidate, not an ML-route anchor.

validation:
  strategy: target_free_public_artifact_integrity_audit
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: TVT_input_isna
  leakage_policy:
    - No supervised training is performed in this experiment.
    - Public notebook outputs are not submitted until inputs, branch CSVs, hashes, and sample compatibility are recorded.
    - Static visible-test CSV and public-sample branches are treated as blocking risks until explained.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  sample_submission: data/raw/sample_submission.csv
  target_column: TVT
  id_column: id
  submission_target_column: tvt

model:
  name: public_artifact_replay_followup_audit
  estimator: none
  params: {}

runtime:
  use_amp: false
  num_workers: 2
  kaggle:
    enable_gpu: false
    enable_internet: false
    kernel_sources:
      - lightningv08/lb-7-776-rogii-ridge-sp
      - fleongg/fle3n-rogii-v4
      - jaemin3404/rogii-sp45-fleongg-blend-v2
      - debatreyabiswas/wellboregeology-prediction-with-koolbox-best-8-188
      - packagemanager/pm-121774751-at-06-05-2026-09-29-28
    dataset_sources:
      - phongnguyn23021656/koolbox-offline
      - fleongg/rogii-claude-models-pub
      - ravaghi/wellbore-geology-prediction-artifacts
    inference_kernel_sources: []
    inference_dataset_sources:
      - phongnguyn23021656/koolbox-offline
      - fleongg/rogii-claude-models-pub
      - ravaghi/wellbore-geology-prediction-artifacts

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_used
  stochastic_components: []
  parallel_rng_policy: no_parallel_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: false
    feature_content_sha: false
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: true
  notes:
    - This is an audit notebook, not a deterministic prediction anchor.
    - External input files and submission-like CSVs are hashed; gzip files also record decompressed content SHA.

audit:
  mode: public_artifact_replay_integrity_audit
  output_prefix: exp082_public_artifact_replay_followup
  max_inventory_files: 5000
  max_source_files: 200
  source_specs:
    - name: ridge_sp_lb_7776
      kernel: lightningv08/lb-7-776-rogii-ridge-sp
      kernel_output_slugs:
        - lb-7-776-rogii-ridge-sp
      required_input_slugs:
        - lb-7-776-rogii-ridge-sp
      branch_files:
        - submission.csv
      expected_checks:
        - dataset_kernel_model_sources
        - static_visible_csv_writer
        - code_competition_rerun_compatibility
    - name: fle3n_rogii_v4
      kernel: fleongg/fle3n-rogii-v4
      kernel_output_slugs:
        - fle3n-rogii-v4
      external_input_slugs:
        - koolbox-offline
        - rogii-claude-models-pub
        - wellbore-geology-prediction-artifacts
      required_input_slugs:
        - fle3n-rogii-v4
        - koolbox-offline
        - rogii-claude-models-pub
        - wellbore-geology-prediction-artifacts
      notebook_paths:
        - docs/notebooks/rogii-wellbore-geology-prediction/score_ascending_20260611/fleongg__fle3n-rogii-v4/fle3n-rogii-v4.ipynb
      branch_files:
        - submission.csv
        - fleongg_pretrained_submission.csv
      expected_checks:
        - exact_source_slug_fixed
        - external_dataset_sources_fixed
        - static_visible_csv_writer
        - code_competition_rerun_compatibility
    - name: sp45_fleongg_blend_v2
      kernel: jaemin3404/rogii-sp45-fleongg-blend-v2
      kernel_output_slugs:
        - rogii-sp45-fleongg-blend-v2
      external_input_slugs:
        - koolbox-offline
        - rogii-claude-models-pub
        - wellbore-geology-prediction-artifacts
      required_input_slugs:
        - rogii-sp45-fleongg-blend-v2
        - koolbox-offline
        - rogii-claude-models-pub
        - wellbore-geology-prediction-artifacts
      branch_files:
        - submission.csv
        - sp45_projection_submission.csv
        - fleongg_pretrained_submission.csv
        - submission_sp45_fleongg_w0.50.csv
        - submission_sp45_fleongg_w0.52.csv
        - submission_sp45_fleongg_w0.55.csv
        - submission_sp45_fleongg_w0.58.csv
        - submission_sp45_fleongg_w0.60.csv
        - sp45_fleongg_blend_report.csv
      notebook_paths:
        - docs/notebooks/rogii-wellbore-geology-prediction/score_ascending_20260611/jaemin3404__rogii-sp45-fleongg-blend-v2/rogii-sp45-fleongg-blend-v2.py
      expected_checks:
        - exact_source_slug_fixed
        - external_dataset_sources_fixed
        - branch_blend_outputs_saved
        - static_visible_csv_writer
        - code_competition_rerun_compatibility
    - name: koolbox_best_8188
      kernel: debatreyabiswas/wellboregeology-prediction-with-koolbox-best-8-188
      kernel_output_slugs:
        - wellboregeology-prediction-with-koolbox-best-8-188
      external_input_slugs:
        - wellbore-geology-prediction-artifacts
        - pm-121774751-at-06-05-2026-09-29-28
      required_input_slugs:
        - wellboregeology-prediction-with-koolbox-best-8-188
        - wellbore-geology-prediction-artifacts
        - pm-121774751-at-06-05-2026-09-29-28
      notebook_paths:
        - docs/notebooks/rogii-wellbore-geology-prediction/score_ascending_latest/debatreyabiswas__wellboregeology-prediction-with-koolbox-best-8-188/wellboregeology-prediction-with-koolbox-best-8-188.ipynb
      branch_files:
        - submission.csv
      expected_checks:
        - exact_source_slug_fixed
        - package_manager_source_fixed
        - static_visible_csv_writer
        - code_competition_rerun_compatibility
  anchor_submission_paths:
    - name: exp027_public_replay_anchor
      path: /tmp/kaggle-output/exp027_public_replay_needless090_sel15_spread3/inference/submission.csv
    - name: exp073_deterministic_ml_anchor
      path: /tmp/kaggle-output/exp073_gpu_reproducibility_guard_for_exp063_full_replay/inference_v2/submission.csv
    - name: exp063_old_ml_public_anchor
      path: /tmp/kaggle-output/exp063_ravaghi_vs_pixiux_lgbm_feature_parity_audit/inference_v2/submission.csv


experiment:
  name: exp308_imputed_gr_confidence_downweight
  description: >-
    Implementation-ready exact-HMM audit that keeps promoted exp307 interpolated
    GR values and finite-MAD sigma fixed while softly downweighting originally
    missing evaluation rows by distance to the nearest raw finite GR observation.
  route: pf_beam
  status: closed_without_run_parent_exp307_gate_failed
  created_at: "2026-07-21"
  updated_at: "2026-07-22"

lineage:
  parent: exp307_finite_only_robust_sigma_gr
  steering: ../../.steering/20260721-exp308-imputed-gr-confidence-downweight
  diff_summary: >-
    Multiplies the parent Gaussian log emission by one fixed missing-distance
    confidence. Interpolated values, finite-MAD sigma, typewell processing, HMM
    state grammar, transition, prior, and posterior mean remain parent-identical.

overrides:
  project_defaults: [validation.strategy, validation.metric, validation.n_folds, validation.score_rows]

validation:
  strategy: conditional_grouped_train_side_exact_hmm_candidate_audit
  metric: rmse
  seed: 42
  n_folds: 5
  expected_folds: [0, 1, 2, 3, 4]
  group_column: well_id
  score_rows: tvt_input_unknown_suffix_only_after_prediction_freeze
  expected_wells: 773
  expected_rows: 3783989
  truth_attachment: after_weight_audit_and_prediction_content_sha_are_frozen
  dependency_policy:
    required_parent: exp307_finite_only_robust_sigma_gr
    required_parent_promotion_gate_passed: true
    expected_parent_sha_status: not_frozen_parent_exp307_gate_failed
    observed_parent_status: train_side_finite_mad_gate_failed_closed
    observed_parent_promotion_gate_passed: false
    fail_closed_on_dependency_mismatch: true
  leakage_policy:
    - Raw GR missing mask, distance, interpolated GR, and confidence are frozen before unknown-suffix truth is read.
    - Unknown-suffix TVT, error, abs_error, formation, and oracle labels are forbidden before prediction freeze.


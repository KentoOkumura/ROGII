model:
  name: imputed_gr_confidence_weighted_exact_hmm
  estimator: none
  target: TVT
  active_variants: [missing_distance_half8_floor025]
  promotion_candidate: missing_distance_half8_floor025
  confidence:
    observed_weight: 1.0
    raw_finite_rows_exact_one: true
    distance_unit: within_well_row_distance_to_nearest_raw_finite_gr
    missing_formula: max_floor_0.25_times_power2_negative_distance_div8
    half_life_rows: 8.0
    minimum_weight: 0.25
    no_finite_gr_fallback: 0.25
    apply_to: gaussian_log_emission
    additional_grid: false
  fixed_parent:
    sigma: exp307_finite_mad_primary
    sigma_column: finite_mad
    prediction_column: finite_mad_primary_hmm_tvt
    evaluation_gr_values: exact_parent_interpolation_parity
    typewell_gr: exact_parent_parity
    hmm_grid_transition_prior_output: exact_parent_parity
  fixed_hmm:
    step: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    lam: 1.0
    start_sig: 0.75
    r0_sig: 0.01
    band_pad: 100.0
    momentum: 0.998
    emission: gaussian
    emission_clip_z2: 600.0
    rate_center: zero
    evaluation_gr_policy: interpolate_both_directions_then_typewell_mean
    typewell_gr_policy: sort_tvt_ffill_bfill_then_linear_interp
    output: posterior_mean
  execution_counts:
    variants: 1
    hmm_well_runs: 773
    lightgbm_configs: 0
    trained_folds: 0
    pf_well_runs: 0
    beam_well_runs: 0
    boosters: 0
    parent_control_retraining: false

references:
  parent_exp307_prediction_decompressed_sha256: PENDING_EXP307_PASS
  parent_exp307_rmse: null
  likpf_rmse: 11.5948976722
  parent_exp307_likpf_50_50_rmse: null

gate:
  min_rmse_improvement_vs_parent: 0.05
  min_improved_folds: 4
  require_gap_bucket_readout: true
  require_1000_plus_non_regression: true
  require_hidden_like_spatial_non_regression: true
  require_hidden_like_typewell_purged_non_regression: true
  require_by_well_p95_delta_max: 0.0
  maximum_worst_well_regression: 0.25
  require_fixed_likpf_blend_non_regression: true
  non_regression_tolerance_ft: 1.0e-6
  baseline_metric_absolute_tolerance: 1.0e-6

execution:
  implementation_approved: true
  parent_dependency_frozen: false
  kaggle_push_approved: false
  active_stage: closed_without_run_parent_exp307_gate_failed
  run_weight_audit: false
  run_hmm: false
  run_inference: false
  create_submission: false

runtime:
  use_amp: false
  num_workers: 2
  numba_num_threads: 2
  kaggle:
    enable_gpu: false
    enable_internet: false
    runtime_limit_seconds: 30600
    kernel_sources:
      - kentookumura/exp307-finite-only-robust-sigma-gr-train
      - kentookumura/exp209-joint-exact-parity-train
      - kentookumura/exp226-k16-kappa-repro-train
      - kentookumura/exp115-hidden-like-spatial-holdout-from-ppt-train

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: no_rng_deterministic_missing_distance_weight
  stochastic_components: []
  parallel_rng_policy: no_rng_fixed_threads
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: false
    prediction_sha: true
    submission_sha: false


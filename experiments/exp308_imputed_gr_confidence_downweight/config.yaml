  mode: disabled_train_side_missing_distance_confidence_audit_only
  create_submission: false

notes:
  - Implementation was approved and completed while exp307 was running; dependency SHA/metrics were intentionally never frozen because the parent gate failed.
  - This is not a rescue grid for exp269 blanket neutrality; zero weight and hard masking are forbidden.
  - No parent control, PF, LikPF, Beam, model, inference, or submission is regenerated.
  - Exp307 v2 completed with its primary gate failed; this fixed dependency can no longer be satisfied, so exp308 is closed without Kaggle execution.

notes:
  - Stage 0 implementation was approved on 2026-07-23; canonical notebook adoption and Kaggle execution are not approved.
  - Candidate families inherit exp263 source families for the six exp293 primitives and the exp263 virtual_combination family for the six fixed formulas.
  - The primary held-out family rank uses shrunk family RMSE; MAE and best-family rate remain fixed auxiliary prior statistics.
  - A Stage 0 PASS does not itself approve 40 selector models, inference, or submission.

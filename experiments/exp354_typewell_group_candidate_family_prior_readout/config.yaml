experiment:
  name: exp354_typewell_group_candidate_family_prior_readout
  description: >-
    Independent zero-model readout testing whether a cross-fit Type Well
    group-by-candidate-family error prior transfers to held-out wells.
  route: ml_model
  status: completed_stage_0_failed_close_without_rescue
  created_at: "2026-07-23"
  updated_at: "2026-07-23"

lineage:
  parent: exp293_physics_only_candidate_bank_headroom_contract
  downstream_control: exp264_exp263_candidate_confidence_dual_selector
  steering: ../../docs/legacy/steering/20260723-exp354-typewell-group-candidate-family-prior-readout
  references:
    - exp316_typewell_group_candidate_family_error_prior
    - exp256_segment_local_corridor_near_bucket_signal_attribution_readout
  diff_summary: >-
    Removes dependencies on exp311, exp312, exp313, and exp315. Stage 0 uses
    only the frozen exp293 deployable12 candidate/family manifest, outer-train
    truth, and Type Well content to test a soft family prior before selector fit.

implementation:
  enabled: true
  scope: stage_0_compact_selfcontained_canonical
  train_notebook_state: compact_selfcontained_canonical_adopted
  canonical_notebook_adopted: true
  stage_1_implemented: false
  inference_enabled: false
  submission_enabled: false

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.score_rows

validation:
  strategy: exp293_outer5_typewell_group_candidate_family_prior_readout
  metric: heldout_family_rank_spearman_then_nested_selector_rmse
  seed: 42
  outer_folds: 5
  inner_folds_if_stage_1: 4
  group_column: well_id
  fit_scope: outer_train_wells_only
  family_error_unit: equal_candidate_within_family_then_equal_well
  rank_score: shrunk_family_rmse_ascending
  rank_aggregation: mean_within_well_spearman_then_equal_well
  truth_attachment: after_prior_and_fallback_content_sha_freeze
  leakage_policy:
    - Candidate family statistics use outer-train well truth only.
    - Outer-valid error is joined after the prior, fallback, and shuffle manifests are frozen.
    - Well-id priors, hard family routing, oracle rank, and candidate-value changes are forbidden.


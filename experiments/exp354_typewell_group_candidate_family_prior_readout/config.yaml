model:
  name: typewell_group_candidate_family_prior_readout
  candidate_bank:
    source: exp293_deployable12
    manifest_and_order: frozen
    regenerate_candidates: false
    order:
      - exp226_k16
      - selfgr_hmm_a070
      - likpf_mean
      - exact_hmm
      - pf_ancc
      - beam_mean
      - exp226_k16__selfgr_hmm_a070
      - exp226_k16__exact_hmm
      - exp226_k16__likpf_mean
      - selfgr_hmm_a070__likpf_mean
      - likpf_mean__exact_hmm
      - exp226_w500_50_50
    family_order: [geometry, hmm_selfgr, pf, hmm, beam, virtual_combination]
    family_by_candidate:
      exp226_k16: geometry
      selfgr_hmm_a070: hmm_selfgr
      likpf_mean: pf
      exact_hmm: hmm
      pf_ancc: pf
      beam_mean: beam
      exp226_k16__selfgr_hmm_a070: virtual_combination
      exp226_k16__exact_hmm: virtual_combination
      exp226_k16__likpf_mean: virtual_combination
      selfgr_hmm_a070__likpf_mean: virtual_combination
      likpf_mean__exact_hmm: virtual_combination
      exp226_w500_50_50: virtual_combination
  prior:
    group: native_overlap_1
    unit: well_equal_weighted_candidate_family
    statistics: [mae, rmse, best_family_rate]
    shrinkage_support_k_wells: 10
    shrinkage_formula: alpha_equals_source_wells_over_source_wells_plus_k
    ranking_statistic: rmse
    family_candidate_reducer: equal_candidate
    well_reducer: equal_well
    best_family_tie_policy: fixed_family_order
    fallback_order: [group_family, global_family, neutral]
    families: fixed_from_exp293_manifest
  stage_0:
    controls: [real_native_group, stable_group_label_shuffle_within_fold]
    pass_requires_all:
      candidate_family_fold_identity_parity: true
      require_all_prior_values_finite: true
      minimum_heldout_group_coverage: 0.90
      minimum_family_rank_spearman: 0.15
      minimum_positive_folds: 4
      minimum_real_minus_shuffle_spearman: 0.05
      require_hidden_like_spatial_spearman_nonnegative: true
      require_hidden_like_typewell_purged_spearman_nonnegative: true
  stage_1:
    enabled_condition: stage_0_all_gates_pass_and_separate_user_approval
    downstream_model: corrected_exp264_dual_selector
    objectives: [expected_error, within10]
    outer_folds: 5
    inner_folds: 4
    selector_models: 40
    control_retrain: false
    pass_requires_all:
      minimum_rmse_gain_vs_saved_corrected_exp264_ft: 0.03
      minimum_improved_folds: 4
      require_hidden_like_non_regression: true
      maximum_worst_well_regression_ft: 0.25
  forbidden:
    - exp311_or_exp312_group_statistics
    - exp313_guard_output
    - exp315_rank_features
    - family_or_support_grid
    - hard_family_router
    - candidate_value_change


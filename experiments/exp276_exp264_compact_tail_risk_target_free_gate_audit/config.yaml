  raw_train_dir_patterns:
    - /kaggle/input/competitions/rogii-wellbore-geology-prediction/train
    - /kaggle/input/rogii-wellbore-geology-prediction/train
    - data/raw/train

risk_features:
  candidate_count: 12
  scopes:
    - name: prefix128
      max_rows: 128
    - name: early512
      max_rows: 512
    - name: full
      max_rows: null
  quantiles: [0.70, 0.80, 0.90]
  family_weighting: equal_family_then_equal_feature
  percentile_reference: downstream_outer_train_wells_only
  missing_policy: outer_train_median_plus_explicit_missingness
  families:
    score_dispersion:
      compact_columns:
        - selector__pred_abs_error_std
        - selector__p_within10_std
        - selector__p_within10_candidate_entropy
      aggregations: [mean, p90]
      direction: high_is_risk
    candidate_divergence:
      compact_columns:
        - selector__candidate_value_range
        - selector__candidate_value_std
      aggregations: [mean, p90]
      direction: high_is_risk
    top1_anchor_distance:
      compact_columns:
        - selector__primitive_pair_bank__pred_abs_error__top1_minus_anchor
        - selector__primitive_pair_bank__p_within10__top1_minus_anchor
        - selector__primitive_fixed_bank__pred_abs_error__top1_minus_anchor
        - selector__primitive_fixed_bank__p_within10__top1_minus_anchor
      transform: absolute
      aggregations: [mean, p90]
      direction: high_is_risk
    confidence_coverage:
      compact_columns:
        - selector__confidence_valid_count
        - selector__available_count
      transform: candidate_count_minus_value
      aggregations: [mean, p90]
      direction: high_is_risk
    geometry_context:
      raw_columns: [MD, X, Y, Z, GR]
      derived_signals:
        - eval_length
        - abs_anchor_delta_md
        - abs_anchor_delta_x
        - abs_anchor_delta_y
        - abs_anchor_delta_z
        - abs_step_md
        - abs_step_x
        - abs_step_y
        - abs_step_z
        - abs_anchor_delta_gr
        - abs_step_gr
        - gr_missing
      direction: high_is_risk


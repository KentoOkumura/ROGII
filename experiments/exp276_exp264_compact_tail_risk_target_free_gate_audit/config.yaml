experiment:
  name: exp276_exp264_compact_tail_risk_target_free_gate_audit
  description: >-
    exp264 Stage Dの大幅global改善を保ちながらtail regression wellsを事前識別できるか、
    Stage C compactとraw-test生成可能contextだけのouter-fold target-free riskで監査する。
  route: ml_model
  status: completed_corrected_parent_revalidation_guard_failed_no_inference
  created_at: "2026-07-18"

overrides:
  project_defaults:
    - validation.metric

lineage:
  parent: exp264_exp263_candidate_confidence_dual_selector
  stage_c_source: exp264_stage_c_nested_compact_meta_version6_corrected
  stage_d_source: exp264_stage_d_downstream_tvt_ablation_version3_corrected
  references:
    - docs/06_reproducibility.md
    - backlog/KAGGLE_DIRECTION.md exp264_compact_tail_risk_target_free_gate_audit
  diff_summary: >-
    hidden-safeなcorrected exp264 Stage C v6 / Stage D v3へ入力だけを差し替え、
    exp264の候補、selector、compact schema、TVT models、OOF予測を変更せず、25 compact
    partitionとraw horizontal geometryをwell単位へ事前固定集約する。outer-trainのtarget-free
    empirical rankだけからriskとq70/q80/q90を作り、outer-valid Stage D deltaは最後のreadoutに
    だけ使う。追加学習、threshold/weight grid、current-test inference、submitは行わない。

validation:
  strategy: outer5_target_free_well_risk_quantile_gate_audit
  metric: bad_well_rate_lift_recall_and_gated_rmse
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_isna
  leakage_policy:
    - risk feature、family方向、family重み、scope、quantileはStage D target/errorを読む前に固定する。
    - downstream outer foldごとにrole=trainの4 partitionだけでmedian、rank、thresholdを決める。
    - role=valid well、true TVT、actual error、by-well delta、worst-well IDをrisk fitへ使わない。
    - Stage D OOFはrisk scoreとthresholdを凍結した後のreadoutとfallback評価にだけjoinする。
    - current-test port、submission、guard緩和、有利なquantileの事後選択を行わない。


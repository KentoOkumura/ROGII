notes:
  - Design is frozen only. Template train and inference notebooks remain unimplemented scaffolds.
  - exp386 version 1 failed Stage 0 with an empty scenario bank and cycle residual p95 above the fixed gate.
  - The mandatory parent prerequisite cannot be met, so exp387 is closed without implementation or execution.
  - This experiment tests likelihood and posterior only; candidate generation belongs exclusively to exp386.

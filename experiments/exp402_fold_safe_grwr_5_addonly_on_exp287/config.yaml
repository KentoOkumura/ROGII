validation:
  strategy: exp287_outer5_groupfold_with_fold_role_deterministic_grwr5_addonly
  metric: rmse
  metric_weighting: unweighted_rows
  seed: 42
  n_folds: 5
  group_column: well
  id_column: id
  target_column: TVT
  score_rows: TVT_input_isna
  expected_rows: 3783989
  expected_wells: 773
  expected_current_test_rows: 14151
  expected_current_test_wells: 3
  primary_control:
    experiment: exp287_fold_safe_formation_74_addonly_on_exp264
    rmse: 8.136708220359452
    public_lb: 7.530
  clean_tail_control:
    experiment: exp264_exp263_candidate_confidence_dual_selector
    rmse: 8.460811237612477
    public_lb: 7.562
  scopes:
    - near_0_250
    - mid_250_1000
    - 1000_plus
    - hidden_like_spatial
    - hidden_like_typewell_purged
  leakage_policy:
    - Never load the historical exp218 values of the five GRWR columns.
    - Use the exp287 outer-train self-excluded formation role for model-fit rows.
    - Use only the matching exp287 outer-train reference for each outer-valid well.
    - Use all train wells as the formation reference for current-test generation.
    - Never read target-well formation columns from train or current-test raw files.
    - Do not use TVT, target residual, OOF error, hidden-like result, or public LB to construct or select a feature.
    - Freeze candidate order, formulas, dtype, feature order, and content SHA before model fitting.
    - Do not derive sample weights or row gates from the five features in this experiment.


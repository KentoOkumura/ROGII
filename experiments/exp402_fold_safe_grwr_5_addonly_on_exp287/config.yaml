grwr5:
  name: fold_safe_candidate_spread_grwr5
  output_dtype: float32
  candidate_stack_dtype: float32
  std_ddof: 0
  candidate_order:
    - pf_ancc
    - beam_mean
    - likpf_mean
    - sc_ens
    - hyb
    - tvt_dense
    - tvt_densew
    - tvt_dense50
  candidate_tvt_specs:
    - {name: pf_ancc, column: pf_ancc, kind: absolute}
    - {name: beam_mean, column: beam_mean_d, kind: delta_from_last_known_tvt}
    - {name: likpf_mean, column: likpf_mean_d, kind: delta_from_last_known_tvt}
    - {name: sc_ens, column: sc_ens_d, kind: delta_from_last_known_tvt}
    - {name: hyb, column: hyb_d, kind: delta_from_last_known_tvt}
    - {name: tvt_dense, column: tvt_dense_d, kind: delta_from_last_known_tvt}
    - {name: tvt_densew, column: tvt_densew_d, kind: delta_from_last_known_tvt}
    - {name: tvt_dense50, column: tvt_dense50_d, kind: delta_from_last_known_tvt}
  source_components:
    clean_273:
      - last_known_tvt
      - pf_ancc
      - beam_mean_d
      - likpf_mean_d
      - sc_ens_d
      - hyb_d
      - grwr_dwt_detail_energy_ratio_w065
      - grwr_fft_rotation_energy_ratio
      - grwr_dwt_approx_minus_raw_default_candidate_ncc
    fold_safe_formation_74:
      - tvt_dense_d
      - tvt_densew_d
      - tvt_dense50_d
  ordered_features:
    - name: grwr_candidate_tvt_std
      formula: numpy_std_float32_over_eight_candidate_tvt_values_ddof0
    - name: grwr_candidate_tvt_range
      formula: numpy_max_minus_min_float32_over_eight_candidate_tvt_values
    - name: grwr_dwt_energy_ratio_w065_x_candidate_std
      formula: grwr_dwt_detail_energy_ratio_w065_times_grwr_candidate_tvt_std_float32
    - name: grwr_fft_rotation_ratio_x_candidate_range
      formula: grwr_fft_rotation_energy_ratio_times_grwr_candidate_tvt_range_float32
    - name: grwr_dwt_minus_raw_ncc_gap_x_candidate_range
      formula: grwr_dwt_approx_minus_raw_default_candidate_ncc_times_grwr_candidate_tvt_range_float32
  expected_feature_count: 5
  feature_schema_sha_policy: freeze_during_zero_booster_preflight
  feature_schema_sha256: 56f63025b11d6e1a3d7ff983094ed782db86420976de85586c5316d7813cdcc8
  feature_content_sha_policy: id_sorted_float32_logical_content_per_outer_role
  finite_required: true
  exact_historical_names_required: true
  duplicate_with_parent_forbidden: true
  legacy_values_allowed: false

preflight:
  enabled: true
  implemented: true
  implementation_approval_required: true
  run_approval_required: true
  booster_count: 0
  model_count: 0
  prediction_count: 0
  submission_count: 0
  technical_gate_all_required:
    - Every pinned exp287 and exp264 input SHA matches.
    - Parent row identity, well identity, outer fold, score-row mask, target, and 421-column order match.
    - All eight candidate values are finite for every required outer-train and outer-valid role.
    - The three tvt_dense delta columns come from the matching exp287 fold-safe formation role.
    - The three GR/DWT/FFT factors come from the clean-273 allowlist and are not regenerated from truth.
    - The five new columns are finite, unique, ordered exactly as declared, and absent from the parent 421 schema.
    - Historical exp218 GRWR-5 values, exp111 score-27 values, and the entropy interaction are absent from every input matrix.
    - Current-test raw regeneration produces 14151 rows and 3 wells with five finite features and target formation reads equal to zero.
    - Feature schema and id-sorted float32 logical-content SHA are saved for every outer role and current-test.
    - Planned training resolves to one variant, three configs, five folds, fifteen GPU boosters, and zero control boosters.


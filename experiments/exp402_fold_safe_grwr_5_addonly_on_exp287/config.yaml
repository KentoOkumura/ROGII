experiment:
  name: exp402_fold_safe_grwr_5_addonly_on_exp287
  description: >-
    Design-frozen add-only experiment that reconstructs the five
    formation-dependent GRWR candidate-spread features from the saved exp287
    fold-safe formation roles and the existing target-free clean-273
    components, then adds only those five columns to the exp287 421-feature
    downstream LightGBM surface.
  hypothesis: >-
    Dispersion across the five target-free PF/Beam candidates and the three
    fold-safe dense-formation candidates contains useful local uncertainty
    information that is not fully represented by the eight candidate values
    and the existing target-free GR/DWT/FFT components separately.
  route: ml_model
  status: stage_1_gpu_train_version_4_running
  created_at: "2026-07-26"
  updated_at: "2026-07-28"

lineage:
  parent: exp287_fold_safe_formation_74_addonly_on_exp264
  clean_tail_control: exp264_exp263_candidate_confidence_dual_selector
  historical_formula_source: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  availability_audit_source: exp264_exp263_candidate_confidence_dual_selector
  steering: ../../docs/legacy/steering/20260726-exp402-fold-safe-grwr-5-addonly-on-exp287
  references:
    - exp072_exp063_full_replay_feature_cache
    - docs/06_reproducibility.md
  diff_summary: >-
    Keep the exp287 clean-273 plus nested-compact-74 plus
    fold-safe-formation-74 surface, outer folds, target, LightGBM family, and
    unweighted evaluation fixed. Recompute exactly five historical GRWR
    candidate-spread columns from each exp287 fold-role surface. Do not add the
    sixth exp111-entropy interaction, the exp396 score-27 family, a sample
    weight, a hard selector, or any direct TVT correction. The final prediction
    remains a downstream LightGBM output, so the route is ml_model.


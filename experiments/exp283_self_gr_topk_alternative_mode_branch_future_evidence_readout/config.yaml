experiment:
  name: exp283_self_gr_topk_alternative_mode_branch_future_evidence_readout
  description: >-
    Propose at most three causal same-well self-GR alternative mode branches at
    fixed target-free ambiguity events, then audit proposal recall and future
    typewell-evidence separability without changing a decoder or prediction.
  route: pf_beam
  status: kaggle_cpu_v2_completed_scientific_guard_failed
  created_at: "2026-07-19"
  updated_at: "2026-07-19"

overrides:
  project_defaults:
    - validation.strategy
    - validation.metric
    - validation.n_folds
    - validation.group_column
    - validation.score_rows

lineage:
  parent: exp282_longtail_prediction_zone_self_gr_loop_closure_readout
  base_reference: exp263_last_anchor_better_candidate_confidence_pair_cache
  geometry_reference: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  emission_reference: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  ambiguity_reference: exp236_exact_hmm_posterior_bimodality_audit
  separability_reference: exp280_exp226_shift_likelihood_separability_readout
  diff_summary: >-
    Replaces exp282's hard donor-transfer interpretation with a causal top-K
    proposal readout. The base path is always retained. Proposal rows end at the
    event, while the primary verifier uses only the following 256 rows and the
    frozen exp209 raw-GR/typewell likelihood. Geometry is diagnostic/veto only.

validation:
  strategy: target_free_ambiguity_event_self_gr_top3_future_evidence_readout
  metric: candidate_recall_and_future_branch_separability
  seed: 42
  n_folds: 5
  group_column: well_id
  score_rows: fixed_target_free_unknown_suffix_events_with_256_future_rows
  expected_rows: 3783989
  expected_wells: 773
  expected_folds: [0, 1, 2, 3, 4]
  guards:
    required_event_coverage: 1.0
    required_proposal_finite_coverage: 1.0
    required_evidence_finite_coverage: 1.0
    required_truth_attachment_before_freeze: 0
    minimum_top3_within10_lift_vs_shuffled: 0.02
    minimum_positive_proposal_lift_folds: 5
    minimum_branch_choice_auc_each_fold: 0.60
    minimum_selected_h256_rmse_gain_ft: 0.10
    minimum_nonregressing_selected_folds: 5
    maximum_base_unique_best_false_switch_rate: 0.05
  leakage_policy:
    - Events use target-free posterior flags and candidate disagreements only.
    - Proposal windows end at the event row and do not read verifier rows.
    - Future evidence uses rows strictly after the event and does not reuse NCC proposal scores.
    - Raw true TVT and error are forbidden until event, proposal, and evidence tables are frozen and hashed.
    - Fold labels are used only for outer-train margin q20 and post-freeze stratification.
    - Truth, error, oracle labels, and fold performance cannot select event, donor, K, horizon, veto, or threshold.


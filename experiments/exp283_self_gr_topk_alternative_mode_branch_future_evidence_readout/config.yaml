event_detection:
  disagreement_threshold_ft: 10.0
  persistent_rows: 128
  shift_margin_block_rows: 128
  shift_margin_outer_train_quantile: 0.20
  refractory_rows: 256
  trigger_precedence: [exp236_bimodal_segment_end, exact_hmm_likpf_persistent, exact_hmm_exp226_persistent, low_shift_margin]
  require_primary_future_rows: 256
  shift_bank_ft: [-80.0, -40.0, -20.0, -10.0, -5.0, -2.0, 0.0, 2.0, 5.0, 10.0, 20.0, 40.0, 80.0]
  emission:
    sigma_mode: known_prefix_residual_std
    sigma_clip: [10.0, 60.0]
    log_likelihood_clip: 600.0

proposal:
  max_alternative_branches: 3
  gr_rolling_mean_rows: 5
  trailing_window_rows: [17, 31, 51]
  primary_window_rows: 51
  donor_stride_rows: 3
  minimum_prediction_donor_gap_rows: 256
  donor_sources: [known_prefix, earlier_prediction_zone]
  orientations: [forward, reverse]
  donor_center_dedup_rows: 25
  anchor_dedup_ft: 2.0
  prediction_donor_anchor: exp263_fixed_exp226_w500_50_50
  future_increment_path: exp226_tvt_geop
  tie_policy: ncc51_desc_multiscale_desc_known_prefix_forward_donor_row_asc

evidence:
  primary_horizon_rows: 256
  diagnostic_horizons_rows: [128, 512]
  primary_score: mean_cumulative_exp209_gaussian_raw_gr_typewell_log_likelihood
  geometry_role: diagnostic_and_veto_only
  geometry_veto:
    maximum_anchor_shift_ft: 80.0
    typewell_extension_ft: 40.0
    require_finite_path_and_steps: true
  selection_readout: max_typewell_evidence_after_geometry_veto_else_base
  emission:
    sigma_mode: known_prefix_residual_std
    sigma_clip: [10.0, 60.0]
    log_likelihood_clip: 600.0

negative_control:
  kind: same_well_event_source_donor_assignment_shuffle
  seed: 42
  seed_policy: stable_sha256_per_well_event_source_local_rng

audit:

reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: sha256_derived_fold_sampling_and_perturbation_assignment_with_fixed_lightgbm_seed
  stochastic_components:
    - upstream_pf_beam_cache_from_exp072
    - upstream_exp099_likelihood_pf_oof_candidates
    - upstream_exp109_typewell_neighbor_prior_oof
    - upstream_exp114_spatial_neighbor_prior_oof
    - upstream_exp065_typewell_cluster_discovery
    - upstream_exp209_exact_hmm_oof
    - upstream_exp223_self_gr_hmm_oof
    - upstream_exp226_k16_geometry_oof
    - lightgbm_histogram_training
    - candidate_long_training_row_subsample
    - deterministic_candidate_perturbation_view_assignment
  parallel_rng_policy: sorted_rows_local_rng_seeded_from_sha256_no_global_rng
  feature_sha_policy: decompressed_content_sha_for_gzip
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - This is a train-side selector audit, not a deterministic submission anchor.
    - Candidate-long training samples sorted row indices with a local RNG whose seed is derived from SHA256 of experiment/fold/variant.
    - Each sampled train row receives at most one single-transform augmented candidate-set view; transforms are never composed.
    - Kaggle train is CPU runtime; GPU is disabled.
    - Viterbi selection is deterministic given OOF score surface, candidate values, config, and row order.

audit:
  mode: candidate_perturbation_augmentation_for_likelihood_ranker
  output_prefix: exp248_candidate_perturbation_augmentation_for_likelihood_ranker
  success_criteria:
    require_augmented_selected_rmse_nonworse: true
    require_augmented_candidate_logloss_nonworse: true
    require_augmented_1000_plus_nonworse: true
    require_augmented_hidden_like_nonworse: true
    max_worst_well_regression: 0.25
  expected_train_artifacts:
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_metrics.csv
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_candidate_metrics.csv
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_calibration.csv
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_topk_coverage.csv
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_margin_calibration.csv
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_oof_predictions.csv.gz
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_by_well.csv
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_bucket_metrics.csv
    - exp248_candidate_perturbation_augmentation_for_likelihood_ranker_subgroup_metrics.csv

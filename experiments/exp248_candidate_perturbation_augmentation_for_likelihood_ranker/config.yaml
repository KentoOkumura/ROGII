        own_cluster_dist_z_gt: 2.0
      - name: nearest_other_closer
        nearest_other_closer: true
      - name: nearby_majority_diff_k8
        nearby_majority_diff: true
        nearby_k: 8
      - name: any_outlier_signal_k8
        any_of:
          - own_cluster_dist_z_gt: 1.5
          - nearest_other_closer: true
          - nearby_majority_diff: true

experiment:
  name: exp248_candidate_perturbation_augmentation_for_likelihood_ranker
  description: Train-only deterministic candidate perturbation augmentation for the exp237 likelihood and candidate-error ranker.
  route: ensemble
  status: completed_train_side_guard_failed
  created_at: "2026-07-14"
  updated_at: "2026-07-14"

lineage:
  parent: exp237_hmm_exp226_candidate_selector_on_exp183
  ranker_parent: exp183_cluster_outlier_prior_confidence_addonly_on_exp158_selector
  continuity_parent: exp158_segment_continuity_selector_on_exp157
  prior_parent: exp181_cluster_outlier_pfbeam_prior_gate
  typewell_prior_parent: exp109_typewell_neighbor_prior_features
  spatial_prior_parent: exp114_spatial_neighbor_prior_signal_audit
  cluster_parent: exp065_typewell_supertype_cluster_cv_audit
  stress_parent: exp115_hidden_like_spatial_holdout_from_ppt
  feature_cache_parent: exp072_exp063_full_replay_feature_cache
  hmm_parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  self_gr_hmm_parent: exp223_joint_typewell_self_gr_hmm_likelihood_probe
  geometry_parent: exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction
  learned_likelihood_parent: exp111_learned_pf_observation_likelihood_probe
  ml_reference_anchor: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  implementation_source: candidate_perturbation_augmentation_for_likelihood_ranker.py
  diff_summary: >
    Keeps exp237's fixed eleven-candidate OOF surface, target-free context, outer
    well folds, and one fixed Viterbi rule. It changes only the candidate-long
    training views by adding deterministic target-independent shifts, drift,
    dropout, and spread perturbations. Original-only and augmented likelihood/error
    models are trained on the same folds. Validation always uses clean original
    candidates; augmented candidates are never direct predictions or Viterbi states.

validation:
  strategy: outer_well_groupkfold_clean_validation_candidate_perturbation_ablation
  metric: rmse
  secondary_metrics:
    - mae
    - within_10ft
    - oracle_label_accuracy
    - selection_distribution
    - path_switch_count
    - bucket_rmse
    - subgroup_rmse
    - worst_well_rmse
    - candidate_auc
    - candidate_logloss
    - candidate_brier
    - expected_error_mae
    - topk_within10_coverage
    - margin_calibration
  seed: 42
  n_folds: 5
  group_column: well
  score_rows: TVT_input_missing_equivalent_exp063_rows
  leakage_policy:
    - Candidate values and target-free likelihood features are read from exp099 v2 and exp072 train-side pseudo-tail caches.
    - Dense candidates are reconstructed as last_known_tvt plus tvt_dense*_d columns, matching exp157.
    - Cluster-outlier features use exp065 native-overlap cluster assignments and exp114 geometry summaries only.
    - Typewell/spatial priors are fixed fold-safe upstream outputs from exp109/114 and are used only as features.
    - exp209, exp223, and exp226 candidate paths are precomputed group-safe OOF inputs; their source IDs, wells, rows, targets, and last-known TVT contracts are checked before use.
    - Candidate-long labels use absolute candidate error and within10 only as training labels, never as feature columns.
    - Perturbation kind, direction, magnitude, dropout target, and sampling are determined before labels from stable seed and sorted train-fold keys only.
    - Augmentation is applied only after the outer train/validation split and never materialized for outer-valid wells.
    - Outer-valid scoring uses clean original candidates only; augmented candidates are teacher rows and are never selectable predictions.
    - Candidate-dependent multi-observation and set-context features are recomputed for every augmented view.
    - Viterbi local costs use OOF predicted-error scores. Transition penalties use candidate path geometry and target-free guard features only.
    - exp115 hidden-like roles are used only for result subgroup metrics, never for training features.
    - No validation/test true TVT, oracle candidate, or true error is used in selector features.
    - exp218, PF, HMM, Beam, dense, geometry, and parent selector models are not retrained.
    - This is a train-side audit; raw-test inference and submission are disabled.


  exp073_test_feature_cache_local: /tmp/kaggle-output/exp073_gpu_reproducibility_guard_for_exp063_full_replay/inference_v2/artifacts/exp063_full_replay_repro_guard_test_features.csv.gz
  exp226_test_summary_local: /tmp/kaggle-output/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction/inference_v1/artifacts/exp226_connortynan_k16_spline_kernel_knn_adaptive_kappa_reproduction_test_prediction_summary.csv
  exp237_model_manifest_local: /tmp/kaggle-output/exp237_hmm_exp226_candidate_selector_on_exp183/train_v1/artifacts/exp237_hmm_exp226_candidate_selector_on_exp183_model_manifest.json

model:
  name: candidate_perturbation_augmented_likelihood_and_error_ranker
  target: candidate_within10_and_absolute_error
  base_prediction: candidate_selected_tvt
  estimator:
    - lightgbm_within10_classifier
    - lightgbm_candidate_error_ranker
  trains_new_boosters: true
  active_variants:
    - original_only
    - perturbation_augmented
  planned_lightgbm_configs: 4
  planned_folds: 5
  planned_boosters: 20
  control_retraining: true
  control_retraining_reason: same_fold_original_only_control_required_for_causal_augmentation_ablation
  parent_retraining: false

augmentation:
  enabled: true
  variants:
    original_only:
      add_augmented_view: false
    perturbation_augmented:
      add_augmented_view: true
  view_policy: one_deterministic_single_transform_view_per_sampled_train_row
  keep_clean_original_view: true
  expose_augmentation_metadata_to_model: false
  max_train_base_rows_per_fold: 60000
  max_valid_base_rows_for_early_stopping: 30000
  predict_base_row_chunk_size: 30000
  shift_grid_ft: [-80.0, -40.0, -20.0, -10.0, -5.0, -2.0, 2.0, 5.0, 10.0, 20.0, 40.0, 80.0]
  enabled_transforms:
    - fixed_shift
    - common_datum_shift
    - low_frequency_drift
    - candidate_dropout
    - family_dropout
    - target_free_top_dropout
    - spread_scale
  drift:
    shape: half_cosine_from_known_boundary
    amplitude_grid_ft: [-80.0, -40.0, -20.0, -10.0, 10.0, 20.0, 40.0, 80.0]
  spread_scale_grid: [0.50, 0.75, 1.25, 1.50]
  family_groups:
    pfbeam: [pf_ancc, beam_mean, likpf_mean, sc_ens, hyb]
    dense: [tvt_dense, tvt_densew, tvt_dense50]
    hmm: [blend_likpf_hmm_w500, hmm_selfgr_boost_only_a070_c100]
    geometry: [v6_k16_geometry_gr_u_projection]
  top_dropout_score: multiobs_score
  min_available_candidates: 1
  candidate_context:
    exclude_parent_generated_prefixes: [crfe_]
    exclude_parent_columns:
      - beam_mean_d
      - sc_ens_d
      - hyb_d
      - likpf_mean_d
      - hmm_exact_minus_likpf_mean
      - exp226_geop_minus_pred
      - exp226_geop_minus_pred_abs
    recompute_delta_columns:
      beam_mean_d: beam_mean
      sc_ens_d: sc_ens
      hyb_d: hyb
      likpf_mean_d: likpf_mean
  multi_observation_likelihood:
    observation_offsets: [-24, -12, 0, 12, 24]
    gr_rolling_window: 5
    gr_scale: 18.0
    out_of_range_scale: 80.0
    softmax_temperatures: [0.15, 0.30]
    likpf_blend_weights: [0.25, 0.50]

ranker:
  mode: deterministic_candidate_perturbation_likelihood_error_ablation
  max_rows: null
  include_candidate_values: false
  log_period: 100
  candidates:
    - name: pf_ancc
      column: pf_ancc
    - name: beam_mean
      column: beam_mean
    - name: likpf_mean
      column: likpf_mean
    - name: sc_ens
      column: sc_ens
    - name: hyb
      column: hyb
    - name: tvt_dense
      column: tvt_dense
    - name: tvt_densew
      column: tvt_densew
    - name: tvt_dense50
      column: tvt_dense50
    - name: blend_likpf_hmm_w500
      column: blend_likpf_hmm_w500
      source: exp209
    - name: hmm_selfgr_boost_only_a070_c100
      column: hmm_selfgr_boost_only_a070_c100_mean_tvt
      source: exp223
    - name: v6_k16_geometry_gr_u_projection
      column: exp226_v6_k16_geometry_gr_u_projection
      source: exp226
  context_columns:
    - last_known_tvt
    - pf_ancc_std
    - beam_mean_d
    - sc_ens_d
    - hyb_d
    - eval_len
    - md_since
    - likpf_mean_d
    - hmm_exact_std
    - hmm_exact_loglik
    - hmm_exact_minus_likpf_mean
    - self_gr_quality
    - self_gr_peak_gap
    - self_gr_typewell_agreement
    - self_gr_valid
    - hmm_selfgr_std
    - hmm_selfgr_loglik
    - exp226_gr_delta
    - exp226_geop_minus_pred
    - exp226_geop_minus_pred_abs
  multiobs_feature_columns:

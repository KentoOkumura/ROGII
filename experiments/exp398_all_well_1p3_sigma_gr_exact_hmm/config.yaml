experiment:
  name: exp398_all_well_1p3_sigma_gr_exact_hmm
  description: >-
    Train-side audit that keeps the exp209 absolute-TVT Gaussian exact HMM
    unchanged except for multiplying the already-clipped well-level sigma_gr
    by 1.3 for every well. The saved exp209 Gaussian prediction is the
    control and is not rerun.
  route: pf_beam
  status: train_side_all_well_sigma_x1p3_gate_failed_closed
  created_at: "2026-07-25"
  updated_at: "2026-07-25"

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  steering: ../../.steering/20260725-exp398-all-well-1p3-sigma-gr-exact-hmm
  sibling_reference: exp397_prefix_gr_agreement_adaptive_sigma_exact_hmm
  references:
    - exp072_likelihood_pf_baseline
    - exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
    - exp397_prefix_gr_agreement_adaptive_sigma_exact_hmm
    - exp389_exp209_huber_exact_hmm_emission
    - docs/06_reproducibility.md
    - KAGGLE_DIRECTION.md
  diff_summary: >-
    Change only the exp209 well-level GR scale from clipped sigma_gr to
    1.3 times clipped sigma_gr for all 773 wells, without a second clip.
    Keep the absolute-TVT coordinate, grid, rate states, transitions, priors,
    Gaussian capped emission, missing-GR handling, Type Well GR, momentum,
    likelihood weight, and posterior-mean output unchanged. Do not reuse the
    failed exp397 prefix selector.


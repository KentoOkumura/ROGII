experiment:
  name: exp441_full_support_ou_rate_transition_hmm
  description: >-
    Replace only the exp209 adjacent three-state rate kernel with a
    full-support, bin-integrated exact OU transition that reuses the parent
    momentum and rate diffusion, removing the artificial one-bin-per-row
    propagation limit without adding a trigger or tuning parameter.
  route: pf_beam
  status: stage0_fail_closed
  created_at: "2026-07-29"
  updated_at: "2026-07-30"
  inference_enabled: false

lineage:
  parent: exp209_exp072_exp205_joint_exact_parity_fast_cache_generation
  references:
    - exp408_hmm_message_rate_basin_audit
    - exp411_predictive_filtered_rate_innovation_destick
    - exp424_exp209_momentum1_exact_hmm_ablation
    - exp439_continuous_kinematic_joint_transition_exact_hmm
    - docs/06_reproducibility.md
  implementation_source:
    - experiments/exp209_exp072_exp205_joint_exact_parity_fast_cache_generation/exact_hmm_smoother.py
    - experiments/exp408_hmm_message_rate_basin_audit/exp408_hmm_message_rate_basin_audit_compact_selfcontained_train.py
    - experiments/exp411_predictive_filtered_rate_innovation_destick/exp411_predictive_filtered_rate_innovation_destick_compact_selfcontained_train.py
    - experiments/exp440_ambiguity_gated_predictive_prior_hmm/exp440_ambiguity_gated_predictive_prior_hmm_compact_selfcontained_train.py
  diff_summary: >-
    Keep the complete exp209 state, TVT transition, prior, GR emission,
    position/rate grids, forward-backward smoother, boundary truncation and
    posterior-mean readout. Replace only the tri-diagonal Euler rate kernel by
    the exact OU conditional law integrated over every rate-bin Voronoi cell.


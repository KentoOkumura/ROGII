model:
  name: full_support_ou_rate_transition_exact_hmm
  estimator: deterministic_exact_forward_backward
  state: [tvt_position, u_rate]
  fixed_from_exp209:
    position_grid_step_ft: 0.35
    n_rates: 41
    rate_span: 0.10
    sig_r: 0.002
    sig_p: 0.02
    momentum: 0.998
    emission_family: gaussian_typewell_gr
    emission_lambda: 1.0
    sigma_mode: known_prefix_zero_fill_population_std
    sigma_clip: [10.0, 60.0]
    start_sigma_ft: 0.75
    initial_rate_sigma: 0.01
    band_pad_ft: 100.0
    rate_center: zero
    rate_boundary_semantics: preserve_parent_substochastic_outward_mass
    position_boundary_semantics: preserve_parent_truncation
    position_mean_formula: r_destination*delta_MD-delta_Z
    output: smoothed_posterior_mean_and_std
  active_scientific_variants:
    - full_support_exact_ou
  candidate_rate_transition:
    family: exact_ornstein_uhlenbeck
    kappa_formula: -log(parent_momentum)
    conditional_mean_formula: exp(-kappa*delta_MD)*r_source
    conditional_variance_formula: sig_r^2*(1-exp(-2*kappa*delta_MD))/(2*kappa)
    zero_kappa_limit_formula: sig_r^2*delta_MD
    discretization: gaussian_cdf_integral_over_all_rate_bin_voronoi_cells
    outer_tail_policy: discard_outside_finite_parent_rate_support_without_renormalization
    numerical_dtype: float64
  forbidden:
    - momentum_sig_r_rate_grid_or_rate_support_tuning
    - jump_mixture_trigger_reset_reanchor_or_acceleration_state
    - position_transition_grid_noise_or_boundary_change
    - gr_emission_prior_readout_or_missing_gr_change
    - blend_selector_gate_or_same_oof_rescue


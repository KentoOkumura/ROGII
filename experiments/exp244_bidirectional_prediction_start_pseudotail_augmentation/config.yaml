    - {name: likpf_mean, column: likpf_mean}
    - {name: sc_ens, column: sc_ens}
    - {name: hyb, column: hyb}
  row_context_columns: [last_known_tvt, pf_ancc_std, beam_mean_d, sc_ens_d, hyb_d, eval_len, md_since, likpf_mean_d]
  multiobs_global_columns: [multiobs_score_max, multiobs_score_mean, multiobs_score_gap, multiobs_top1_source_id, multiobs_top1_mae, multiobs_top1_ncc]
  feature_cache:
    include_candidate_tvt: true

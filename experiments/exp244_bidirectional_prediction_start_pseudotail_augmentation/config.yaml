reproducibility:
  seed: 42
  deterministic_anchor: false
  seed_policy: stable_sha256_per_source_well_start_offset_and_fold
  stochastic_components: []
  parallel_rng_policy: no_global_rng_sorted_well_and_view_order
  feature_sha_policy: canonical_decompressed_csv_content_sha
  record:
    kernel_version: true
    input_sha: true
    feature_schema_sha: true
    feature_content_sha: true
    model_manifest_sha: true
    prediction_sha: true
    submission_sha: false
  notes:
    - Initial implementation is deterministic CPU audit code but is not called a deterministic anchor before Kaggle rerun SHA confirmation.
    - PF/Beam regeneration is contract-only in the initial audit and must inherit stable per-view seeds when enabled.

notes:
  - V1-v3 trained no model; v4 trained one approved direct integrated augmentation variant and failed the worst-well adoption guard.
  - Late-start views use train true TVT only through the synthetic start and are forbidden on current test.
  - v2 parity preflight reads the frozen exp218 OOF and model manifest but does not retrain or re-predict exp218.

experiment:
  name: exp244_bidirectional_prediction_start_pseudotail_augmentation
  description: Train and evaluate a fold-safe exp218-family variant with early/original/late prediction-start views.
  route: ml_model
  status: completed_v4_train_side_guard_failed_no_inference_no_submit
  created_at: '2026-07-13'
  updated_at: '2026-07-16'

lineage:
  parent: exp239_distribution_matched_multicut_pseudotail
  model_parent: exp218_gr_wavelet_rotation_confidence_features_on_exp148
  calibration_followup: prefix_pseudotail_test_time_calibrator
  diff_summary: >
    Extends the exp239 early-start replay contract with fixed, symmetric
    prediction-start views around the official cutoff. Negative offsets are
    early-start views, zero is the official control, and positive offsets are
    train-only late-start views. Every view rebuilds TVT_input and prefix
    features from raw rows. V4 directly trains one exp218-family augmentation
    variant from the official full cache and four offset-specific pseudo caches;
    full-prefix cache slicing, validation/test unknown-tail TVT, inference, and
    submission remain disabled.

validation:
  strategy: source_well_groupkfold_official_start_primary
  metric: rmse
  seed: 42
  n_folds: 5
  group_column: source_well
  fold_assignment: exp218_official_tail_row_weighted_groupkfold
  legacy_v1_fold_assignment: unique_well_equal_weight_groupkfold
  primary_score_surface: official_start_oof
  stress_surfaces:
    - start_kind
    - remaining_tail_rows
    - rows_1000_plus
    - exp115_hidden_like
    - worst_well
  leakage_policy:
    - Every derived view inherits exactly one fold from its source well.
    - Outer-valid source-well views are excluded from the corresponding outer-train fold.
    - Positive-offset late views are train-only and cannot be generated from current-test unknown tail TVT.
    - Feature generation may read TVT only through the selected start to construct TVT_input.
    - TVT after the selected start is target-only and is attached after feature generation.
    - Official-start OOF remains the adoption metric.

data:
  raw_dir: data/raw
  train_dir: data/raw/train
  test_dir: data/raw/test
  horizontal_glob: '*__horizontal_well.csv'
  target_column: TVT
  input_target_column: TVT_input
  md_column: MD
  gr_column: GR
  coordinate_columns: [X, Y, Z]
  exp218_oof_predictions_local: /tmp/exp218_train_v1_output/artifacts/exp218_gr_wavelet_rotation_confidence_features_on_exp148_predictions.csv.gz
  exp218_model_manifest_local: /tmp/exp218_train_v1_output/artifacts/exp218_gr_wavelet_rotation_confidence_features_on_exp148_lgb_models/manifest.json
  exp244_v1_fold_manifest_local: experiments/exp244_bidirectional_prediction_start_pseudotail_augmentation/artifacts/exp244_bidirectional_prediction_start_pseudotail_augmentation_fold_manifest.csv


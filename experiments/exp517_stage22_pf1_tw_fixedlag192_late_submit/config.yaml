  public_v96_config_sha256: 80e973d5f5e0e39be758a03f399cdd3d81d9e79320da8db6fbddbc25c2a202f3
  references:
    - ../../docs/discussions/rogii-wellbore-geology-prediction-733226.md
    - ../../docs/notebooks/rogii-wellbore-geology-prediction/solution_6th/k256net__public20th-private6th-pf-pf-pf-pf-and-bagging/kernel-metadata.json
    - ../../docs/06_reproducibility.md
  diff_summary: >-
    Preserve v1 as a failed one-PF direct history. Correct v2 in the same exp
    by using the released original Optuna group of five banks, fixed-lag 192,
    GR-only likelihood, and the public Ravaghi LightGBM/CatBoost/Ridge
    tabular contract. Disable later robust/tempered likelihood, anchor,
    learned emission, alternative GR representations, and full smoothing.


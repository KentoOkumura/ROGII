experiment:
  name: exp517_stage22_pf1_tw_fixedlag192_late_submit
  description: >-
    Corrected reconstruction of the published stage 2-2 system in the same
    experiment that previously submitted the contract-mismatched one-PF
    direct v1. Generate five original-Optuna PF trajectories with typewell GR
    and fixed-lag 192, then fit the public tabular stack. The evaluated v2
    reproduced the reported CV and Public score regime approximately, but did
    not reproduce the reported Private score.
  hypothesis: >-
    Repeating the public one-PF feature family for pf_1, pf_2, pf_3, r0, and
    r1 fixed-lag-192 trajectories and fitting the public 5-model tabular stack
    reproduces the stage 2-2 CV 7.50 regime.
  route: ensemble
  status: corrected_v2_late_submission_pending
  created_at: "2026-08-07"
  updated_at: "2026-08-08"
  train_enabled: true
  inference_enabled: true


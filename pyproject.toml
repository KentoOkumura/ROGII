[project]
name = "kaggle-experiment-template"
version = "0.1.0"
description = "Kaggle experiment template workspace"
requires-python = ">=3.11"
dependencies = [
    "kaggle==2.2.3",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "pyyaml",
    "scikit-learn",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
kaggle-platform = [
    "kagglehub>=0.4.1",
]
notebook = [
    "ipykernel",
    "jupyterlab",
    "jupytext",
]
app = [
    "streamlit",
]
viewer = [
    "dtw-python>=1.3",
    "PySide6>=6.5,<6.9",
    "pyqtgraph>=0.13",
    "scipy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = "/tmp/ruff-cache"
extend-exclude = [
    ".agents",
    "docs/notebooks",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests", "experiments/*/tests"]
pythonpath = ["."]

version: "3"

dotenv: [".env"]

vars:
  EXP: '{{.EXP | default "exp001_baseline"}}'
  SOURCE: '{{.SOURCE | default "templates/experiment"}}'
  SURVEY_TITLE: '{{.SURVEY_TITLE | default ""}}'
  SURVEY_SLUG: '{{.SURVEY_SLUG | default ""}}'
  EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'
  VALIDATE_ARGS: '{{.VALIDATE_ARGS | default ""}}'
  SUBMISSION: '{{.SUBMISSION | default "submission.csv"}}'
  STATUS: '{{.STATUS | default ""}}'
  CV: '{{.CV | default ""}}'
  PUBLIC_LB: '{{.PUBLIC_LB | default ""}}'
  PRIVATE_LB: '{{.PRIVATE_LB | default ""}}'
  METRIC: '{{.METRIC | default ""}}'
  KEY_IDEA: '{{.KEY_IDEA | default ""}}'
  NOTES: '{{.NOTES | default ""}}'
  NOTEBOOK: '{{.NOTEBOOK | default "inference"}}'
  KERNEL: '{{.KERNEL | default ""}}'
  KERNEL_VERSION: '{{.KERNEL_VERSION | default "1"}}'
  COMPETITION: '{{.COMPETITION | default "rogii-wellbore-geology-prediction"}}'
  MESSAGE: '{{.MESSAGE | default .EXP}}'
  OUTPUT_FILE: '{{.OUTPUT_FILE | default "submission.csv"}}'
  OUT: '{{.OUT | default (printf "/tmp/kaggle-output/%s/%s" .EXP .NOTEBOOK)}}'
  VIEWER_DATA: '{{.VIEWER_DATA | default "data/raw"}}'
  UV_CACHE_DIR: '{{.UV_CACHE_DIR | default "/tmp/uv-cache"}}'

tasks:
  validate-template:
    desc: Validate repository template files without requiring competition-specific TODOs to be filled.
    cmds:
      - uv run python scripts/validate_project.py
      - uv run python scripts/update_survey_index.py --check

  validate-config:
    desc: Validate project.yml and fail if competition-specific TODOs remain.
    cmds:
      - uv run python scripts/validate_project.py --strict
      - uv run python scripts/update_survey_index.py --check

  new-exp:
    desc: Create a new self-contained experiment folder.
    cmds:
      - uv run python scripts/new_experiment.py --name {{.EXP}} --source {{.SOURCE}} {{.EXTRA_ARGS}}

  new-steering:
    desc: Create a steering document folder before implementing an experiment.
    cmds:
      - uv run python scripts/new_steering.py --experiment {{.EXP}} {{.EXTRA_ARGS}}

  new-survey-report:
    desc: Create a metadata-indexed completed-investigation report in docs/surveys.
    cmds:
      - uv run python scripts/new_survey_report.py --title "{{.SURVEY_TITLE}}" --slug "{{.SURVEY_SLUG}}" {{.EXTRA_ARGS}}

  update-survey-index:
    desc: Validate survey report metadata and regenerate docs/surveys/README.md.
    cmds:
      - uv run python scripts/update_survey_index.py

  validate-surveys:
    desc: Validate survey metadata and fail if the generated index is stale.
    cmds:
      - uv run python scripts/update_survey_index.py --check

  validate-exp:
    desc: Validate one experiment folder and fail on TODO config values.
    cmds:
      - uv run python scripts/validate_experiment.py --experiment {{.EXP}} {{.EXTRA_ARGS}}

  train-local:
    desc: Debug-only local train notebook execution; pass --allow-local explicitly.
    cmds:
      - uv run python scripts/execute_experiment_notebook.py --experiment {{.EXP}} --notebook train {{.EXTRA_ARGS}}

  infer-local:
    desc: Debug-only local inference notebook execution; pass --allow-local explicitly.
    cmds:
      - uv run python scripts/execute_experiment_notebook.py --experiment {{.EXP}} --notebook inference {{.EXTRA_ARGS}}

  dl-kaggle-comp:
    desc: Download Kaggle competition files into data/raw using competition.slug from project.yml.
    cmds:
      - uv run python scripts/kaggle_download.py

  submit-check:
    desc: Validate a submission file against the configured sample submission.
    cmds:
      - uv run python scripts/validate_submission.py --submission {{.SUBMISSION}}

  submit-code:
    desc: Submit a completed Kaggle kernel version to this Notebook-only code competition.
    cmds:
      - kaggle competitions submit {{.COMPETITION}} -k {{.KERNEL}} -v {{.KERNEL_VERSION}} -f {{.OUTPUT_FILE}} -m "{{.MESSAGE}}"

  pipeline-local:
    desc: Debug-only local pipeline; Kaggle notebook execution is authoritative.
    cmds:
      - task: validate-exp
        vars:
          EXP: "{{.EXP}}"
          EXTRA_ARGS: "{{.VALIDATE_ARGS}}"
      - task: train-local
        vars:
          EXP: "{{.EXP}}"
          EXTRA_ARGS: "{{.EXTRA_ARGS}}"
      - task: infer-local
        vars:
          EXP: "{{.EXP}}"
          EXTRA_ARGS: "{{.EXTRA_ARGS}}"
      - task: submit-check
        vars:
          EXP: "{{.EXP}}"
          SUBMISSION: "{{.SUBMISSION}}"
      - task: update-summary

  prepare-kaggle-notebooks:
    desc: Prepare train/inference notebooks for Kaggle kernel push.
    cmds:
      - uv run python scripts/prepare_kaggle_notebooks.py --experiment {{.EXP}} {{.EXTRA_ARGS}}

  push-kaggle-train:
    desc: Push the prepared train notebook to Kaggle.
    cmds:
      - kaggle kernels push -p experiments/{{.EXP}}/kaggle/train

  push-kaggle-infer:
    desc: Push the prepared inference notebook to Kaggle.
    cmds:
      - kaggle kernels push -p experiments/{{.EXP}}/kaggle/inference

  execute-notebook-local:
    desc: Debug-only local notebook execution; pass --allow-local explicitly.
    cmds:
      - uv run python scripts/execute_experiment_notebook.py --experiment {{.EXP}} --notebook {{.NOTEBOOK}} {{.EXTRA_ARGS}}

  kaggle-status:
    desc: Show Kaggle kernel execution status.
    cmds:
      - kaggle kernels status {{.KERNEL}}

  kaggle-logs:
    desc: Stream Kaggle kernel stdout/stderr via the CLI 2.2.3 live SSE endpoint.
    cmds:
      - kaggle kernels logs -f {{.KERNEL}}

  kaggle-output:
    desc: Download Kaggle kernel output files.
    cmds:
      - mkdir -p {{.OUT}}
      - kaggle kernels output {{.KERNEL}} -p {{.OUT}}

  record-submission:
    desc: Append a submission row to submissions/SUBMISSIONS.md.
    cmds:
      - uv run python scripts/record_submission.py --experiment {{.EXP}} --file {{.SUBMISSION}} {{.EXTRA_ARGS}}

  record-exp:
    desc: Update one experiment metrics.json and regenerate experiment_summary.md.
    cmds:
      - uv run python scripts/record_experiment.py --experiment {{.EXP}} --status "{{.STATUS}}" --cv "{{.CV}}" --public-lb "{{.PUBLIC_LB}}" --private-lb "{{.PRIVATE_LB}}" --metric "{{.METRIC}}" --key-idea "{{.KEY_IDEA}}" --notes "{{.NOTES}}" {{.EXTRA_ARGS}}

  compare-exp:
    desc: Print a compact comparison table for experiments.
    cmds:
      - uv run python scripts/compare_experiments.py {{.EXTRA_ARGS}}

  metric-weighted-tail-error-map:
    desc: Build weighted visible-tail error maps for candidate submission CSVs.
    cmds:
      - uv run python scripts/metric_weighted_tail_error_map.py {{.EXTRA_ARGS}}

  pf-beam-disagreement-error-map:
    desc: Build PF/Beam disagreement error maps from exp083 well summaries.
    cmds:
      - uv run python scripts/pf_beam_disagreement_error_map.py {{.EXTRA_ARGS}}

  update-summary:
    desc: Regenerate the auto-managed lineage and score table in experiment_summary.md.
    cmds:
      - uv run python scripts/update_experiment_summary.py

  app:
    desc: Run the Streamlit experiment dashboard.
    cmds:
      - uv run streamlit run app/streamlit_app.py

  oof-app:
    desc: Run the Streamlit OOF analysis app.
    cmds:
      - uv run streamlit run app/oof_analysis_app.py

  viewer:
    desc: Run Tom's ROGII PySide viewer on this repository's data/raw folder.
    cmds:
      - UV_CACHE_DIR="{{.UV_CACHE_DIR}}" uv run --extra viewer python scripts/run_rogii_viewer.py --dataset "{{.VIEWER_DATA}}" {{.EXTRA_ARGS}}

  viewer-smoke:
    desc: Run a headless smoke test for Tom's ROGII PySide viewer.
    cmds:
      - UV_CACHE_DIR="{{.UV_CACHE_DIR}}" uv run --extra viewer python scripts/run_rogii_viewer.py --dataset "{{.VIEWER_DATA}}" --smoke-test {{.EXTRA_ARGS}}

  fmt:
    desc: Format and lint code.
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Run tests.
    cmds:
      - uv run pytest
